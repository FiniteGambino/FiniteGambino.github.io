etal System","chName":"Chapter 12 — Muscular System","text":"Explain how muscle cells are specialized to contract and cause voluntary and involuntary movements.","verdict":"keep","justification":"Understanding how muscle cells contract explains why electrolyte abnormalities (especially calcium and potassium) affect muscle function, why cramping occurs in dehydration, and why cardiac arrest can follow severe electrolyte disturbance.|||TAKEAWAY|||<strong>Most important to take away:</strong> Sliding filament theory: actin and myosin filaments slide past each other to shorten the sarcomere. Requires: (1) calcium (triggers actin-myosin binding), (2) ATP (powers the power stroke). Calcium is released from sarcoplasmic reticulum when a nerve impulse arrives. Without calcium -> no contraction. Without ATP -> rigor mortis. Low calcium = muscle weakness/tetany; high potassium = depolarization block -> weakness or dysrhythmia.|||FIELD|||Hypocalcemia can cause tetany — involuntary sustained muscle contraction. Seen in parathyroid disorders, after thyroid surgery, or in severe hyperventilation (alkalosis causes calcium to bind albumin, reducing free calcium). Hyperkalemia (common in renal failure) can cause fatal cardiac dysrhythmias. Any dialysis patient with weakness, bradycardia, or ECG changes needs urgent assessment — peaked T waves are the early ECG sign.","modIndex":2,"chIndex":1},{"num":51,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 12 — Muscular System","text":"Discuss the ways in which muscle contraction is initiated and controlled.","verdict":"skim","justification":"Understanding the neuromuscular junction explains the mechanism of several important toxicological emergencies: organophosphate poisoning, botulism, and neuromuscular blocking agents (used in RSI). This is pharmacologically relevant for a PCP.|||TAKEAWAY|||<strong>Most important to take away:</strong> Neuromuscular junction (NMJ): motor neuron releases acetylcholine (ACh) -> binds nicotinic receptors on muscle -> depolarization -> contraction. ACh is broken down by acetylcholinesterase. Organophosphates inhibit acetylcholinesterase -> ACh accumulates -> overstimulation -> SLUDGE (Salivation, Lacrimation, Urination, Defecation, GI cramping, Emesis) + bradycardia + bronchospasm. Botulinum toxin blocks ACh release -> flaccid paralysis.|||FIELD|||Organophosphate toxicity (pesticide exposure, nerve agents) causes SLUDGE plus bradycardia and bronchospasm — the result of ACh accumulating at every cholinergic synapse. BCEHS treatment: atropine titrated to drying secretions. Recognizing the toxidrome matters — these patients deteriorate rapidly and may need airway management. In the Lower Mainland, occupational pesticide exposure is possible in agricultural workers from the Fraser Valley.","modIndex":2,"chIndex":1},{"num":52,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 12 — Muscular System","text":"Describe the structure and organization of skeletal muscles, including the different types of muscle fibres, and how actin and myosin filaments move across each other — according to the sliding filament theory — to cause muscle contraction.","verdict":"skip","justification":"Skip. The detailed microscopic structure of skeletal muscle (fascicles, sarcomeres, myofibrils) is histology content. Clinical application of muscle structure is covered adequately in entries 49-51.|||TAKEAWAY|||Clinical relevance of muscle breakdown: rhabdomyolysis — skeletal muscle breakdown releases myoglobin into the bloodstream. Myoglobin clogs renal tubules -> acute kidney injury. Causes: crush injuries, prolonged seizures, extreme exertion, hyperthermia, certain drugs/toxins. Signs: dark tea-coloured urine, muscle pain and weakness. Management: aggressive IV fluids to flush the kidneys.|||FIELD|||Crush syndrome: a patient trapped under debris for >1 hour who is then freed may develop rhabdomyolysis from reperfusion of crushed muscle. The danger isn't during entrapment — it's when the crush is released and myoglobin floods the circulation. BCEHS crush syndrome protocol involves IV fluids before extrication to dilute the myoglobin load. These patients can look well immediately after extrication and then crash with renal failure and hyperkalemia.","modIndex":2,"chIndex":1},{"num":53,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 12 — Muscular System","text":"Outline the structure and function of cardiac muscle tissue.","verdict":"keep","justification":"Cardiac muscle's unique properties — automaticity, contractility, the Frank-Starling mechanism — are the physiological foundation of cardiology. You need these to understand dysrhythmias, heart failure, and why your interventions (fluids, vasopressors, cardioversion) work.|||TAKEAWAY|||<strong>Most important to take away:</strong> Cardiac muscle properties: (1) Automaticity — SA node generates rhythm spontaneously (60-100 bpm), AV node backup (40-60 bpm), ventricular backup (20-40 bpm). (2) Contractility — force of contraction influenced by preload, afterload, calcium. (3) Frank-Starling mechanism: the more the heart fills (preload), the stronger it contracts — up to a point; overfilling causes failure. Intercalated discs with gap junctions allow coordinated contraction.|||FIELD|||The Frank-Starling mechanism explains volume resuscitation in shock: giving fluids increases preload -> increases stroke volume -> increases cardiac output — up to a point. In cardiogenic shock, the heart is already overdistended (failing past the Frank-Starling curve), so fluids worsen rather than help. This is why treating undifferentiated hypotension requires differentiating hypovolemic from cardiogenic shock before loading the patient with fluids.","modIndex":2,"chIndex":1},{"num":54,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 12 — Muscular System","text":"Outline the structure and function of smooth muscle tissue.","verdict":"keep","justification":"Smooth muscle in the bronchi, blood vessels, and GI tract is the target of many prehospital drugs and the source of several emergency presentations. Bronchospasm, vasospasm, and intestinal ileus are all smooth muscle disorders you'll encounter.|||TAKEAWAY|||<strong>Most important to take away:</strong> Smooth muscle: involuntary, non-striated, innervated by autonomic NS and regulated by hormones. Key locations: bronchial smooth muscle (bronchospasm in asthma/anaphylaxis -> beta-2 agonists), vascular smooth muscle (vasoconstriction in shock = compensatory; vasodilation in distributive shock = pathological), GI smooth muscle (ileus in bowel obstruction, spasm in renal colic).|||FIELD|||Anaphylaxis involves smooth muscle in two critical locations simultaneously: bronchial smooth muscle contracts (bronchospasm, wheeze) while vascular smooth muscle relaxes (massive vasodilation, distributive shock, hypotension). Epinephrine addresses both: relaxes bronchial smooth muscle (beta-2 effect) while constricting vascular smooth muscle (alpha-1 effect). This is why epinephrine is first-line for anaphylaxis — it reverses both life-threatening smooth muscle effects at once.","modIndex":2,"chIndex":1},{"num":55,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 12 — Muscular System","text":"Discuss disorders of the muscular system, including musculoskeletal disorders (such as strains and sprains) and neuromuscular disorders (such as muscular dystrophy and Parkinson's disease).","verdict":"keep","justification":"Musculoskeletal disorders — compartment syndrome, rhabdomyolysis, and common sports injuries — are presentations you'll manage in the field. Compartment syndrome is a time-critical limb-threatening emergency that requires recognition and urgent transport.|||TAKEAWAY|||<strong>Most important to take away:</strong> Compartment syndrome: increased pressure within a muscle compartment compromises circulation and nerve function. The 6 P's: Pain (out of proportion, worse with passive stretch), Pressure (tense compartment), Paralysis (late), Paresthesia (early nerve ischemia), Pallor, Pulselessness (very late). Causes: fractures (especially tibia, forearm), crush injuries, tight circumferential dressings. Treatment: fasciotomy (surgical). Your role: recognize, loosen constricting wrappings, transport urgently.|||FIELD|||A tibial fracture patient who develops increasing severe pain unresponsive to analgesia — especially with passive dorsiflexion of the foot — has compartment syndrome until proven otherwise. Loosen any bandaging, do not elevate above heart level (reduces perfusion pressure), and transport urgently. Missed compartment syndrome = permanent muscle and nerve damage. Low threshold for concern.","modIndex":2,"chIndex":1},{"num":56,"modTitle":"Module 4 | Anatomy and Physiology of the Nervous System","chName":"Chapter 8 — Nervous System","text":"Outline the organization of the nervous system — including the central and peripheral nervous systems — and their organs and subdivisions.","verdict":"keep","justification":"The nervous system organization — CNS vs. PNS, somatic vs. autonomic, sympathetic vs. parasympathetic — is the master framework for understanding almost all of acute medicine. You need this fluently to understand shock physiology, drug mechanisms, toxicological emergencies, and neurological assessments.|||TAKEAWAY|||<strong>Most important to take away:</strong> CNS: brain + spinal cord (command and control). PNS: all nerves outside CNS. Somatic PNS: voluntary control of skeletal muscle. Autonomic PNS: involuntary control of smooth muscle, cardiac muscle, glands. Sympathetic (fight-or-flight): HR up, BP up, bronchodilation, pupil dilation, decreased GI motility, increased glucose. Parasympathetic (rest-and-digest): HR down, bronchoconstriction, pupil constriction, increased GI motility, salivation.|||FIELD|||Every drug you administer works through the nervous system or mimics it. Epinephrine = sympathetic agonist. Atropine = parasympathetic blocker. Salbutamol = selective sympathetic (beta-2) agonist at bronchial smooth muscle. Naloxone reverses opioid-induced CNS depression. When a painful patient is bradycardic instead of tachycardic, think vagal response or suspect a spinal injury that has disrupted sympathetic pathways.","modIndex":3,"chIndex":0},{"num":57,"modTitle":"Module 4 | Anatomy and Physiology of the Nervous System","chName":"Chapter 8 — Nervous System","text":"Describe the cells of the nervous system — neurons and neuroglia — and their anatomical parts and functions.","verdict":"keep","justification":"Neurons and their anatomy explain how nerve signals travel, why demyelinating diseases (MS) cause the deficits they do, and why nerve injuries produce specific patterns of motor and sensory loss.|||TAKEAWAY|||<strong>Most important to take away:</strong> Neuron anatomy: dendrites (receive input), cell body, axon (conducts impulse), axon terminals (release neurotransmitters). Myelin sheath: produced by Schwann cells (PNS) and oligodendrocytes (CNS) — speeds up conduction via saltatory conduction at nodes of Ranvier. Demyelination (MS, Guillain-Barre) -> slowed/blocked conduction -> motor and sensory deficits. CNS neurons cannot regenerate; PNS neurons have limited regeneration.|||FIELD|||A patient with Guillain-Barre syndrome (ascending demyelinating polyneuropathy) presents with progressive ascending weakness starting in the legs. The danger is respiratory failure when demyelination reaches the phrenic nerve (C3-C5). These patients need monitoring of respiratory effort and rapid transport — they can go from weak legs to intubation within hours. Assess for respiratory fatigue: paradoxical abdominal movement, accessory muscle use, declining SpO2.","modIndex":3,"chIndex":0},{"num":58,"modTitle":"Module 4 | Anatomy and Physiology of the Nervous System","chName":"Chapter 8 — Nervous System","text":"Explain how messages are sent by neurons through the nervous system, and to and from the rest of the body.","verdict":"keep","justification":"Synaptic transmission is the mechanism behind nearly all neurological and psychiatric drugs, many toxicological emergencies, and the autonomic responses you observe in your patients.|||TAKEAWAY|||<strong>Most important to take away:</strong> Action potential reaches axon terminal -> vesicles release neurotransmitter into synaptic cleft -> binds postsynaptic receptor -> excitatory or inhibitory response. Key neurotransmitters: acetylcholine (NMJ, parasympathetic), norepinephrine (sympathetic, CNS), dopamine (motor control — depleted in Parkinson's), serotonin (mood), GABA (main inhibitory NT — potentiated by benzos and alcohol). Reuptake inhibition -> more NT in cleft -> prolonged effect.|||FIELD|||GABA is the main inhibitory neurotransmitter — benzodiazepines enhance GABA activity, which is why they reduce seizures and sedate. Serotonin syndrome (excess serotonergic activity from SSRI overdose or drug interactions) causes hyperthermia, agitation, tremor, clonus, and tachycardia — it looks like excited delirium but has a pharmacological cause. Knowing the neurotransmitter involved tells you which antidote to expect at hospital.","modIndex":3,"chIndex":0},{"num":59,"modTitle":"Module 4 | Anatomy and Physiology of the Nervous System","chName":"Chapter 8 — Nervous System","text":"Indicate how nerve impulses are transmitted by electrical changes within neurons, and through chemical molecules to other cells.","verdict":"keep","justification":"The action potential is the mechanism behind cardiac conduction, nerve conduction, and muscle depolarization. It explains why electrolyte imbalances cause dysrhythmias and neurological symptoms, and it underlies the ECG waveform.|||TAKEAWAY|||<strong>Most important to take away:</strong> Resting membrane potential: -70mV (inside negative). Depolarization: Na+ rushes in through voltage-gated channels -> membrane potential rises -> action potential fires. Repolarization: K+ exits -> membrane potential returns to negative. Refractory period: cell cannot be re-stimulated immediately after firing. Electrolyte relevance: Na+ drives depolarization; K+ drives repolarization. Alter either and you alter the action potential.|||FIELD|||Hyperkalemia (high K+) slows repolarization -> peaked T-waves, wide QRS, eventually fatal dysrhythmias. Hyponatremia (low Na+) can cause seizures because neurons become hyperexcitable. This is the cellular mechanism behind electrolyte emergencies. When your dialysis patient or adrenal crisis patient presents with dysrhythmia or seizures, altered electrolytes are altering the action potential.","modIndex":3,"chIndex":0},{"num":60,"modTitle":"Module 4 | Anatomy and Physiology of the Nervous System","chName":"Chapter 8 — Nervous System","text":"Identify the structure and functions of different parts of the central nervous system, which includes the brain and spinal cord, and outcomes when damaged.","verdict":"keep","justification":"The book covers the major brain regions in detail. Directly clinically relevant by region: <strong>Frontal lobe</strong> — personality, judgment, voluntary motor control. Injury = disinhibition, aggression, contralateral motor deficits. <strong>Temporal lobe</strong> — hearing, language, memory. Injury = language deficits. <strong>Parietal lobe</strong> — sensory processing, spatial awareness. Injury = contralateral sensory deficits. <strong>Occipital lobe</strong> — vision. Injury = visual field deficits. <strong>Brainstem (medulla)</strong> — controls breathing rate, heart rate, blood pressure. Brainstem compression from herniation = respiratory arrest. <strong>Cerebellum</strong> — coordination and balance. Injury = ataxia, which can mimic intoxication. Know the Cushing's triad (hypertension, bradycardia, irregular respiration) — it's a late sign of severe raised ICP and impending herniation.|||TAKEAWAY|||Cushing's triad (hypertension + bradycardia + irregular respirations) = impending brainstem herniation from raised ICP — late pre-terminal sign requiring immediate ALS intercept and transport. Contralateral deficits: left hemisphere injury causes right-sided weakness. Cerebellar injury = ataxia, nystagmus, dysarthria — can be mistaken for intoxication. Brainstem controls all vital functions — herniation here = respiratory arrest.|||FIELD|||A TBI patient with deteriorating GCS, vomiting, and Cushing's triad is herniating. Their brain is being pushed through the foramen magnum by rising ICP. BCEHS TBI protocol: head of stretcher at 30 degrees, avoid hypoxia (SpO2 >95%), avoid hypotension (SBP >90), avoid hyperventilation unless herniating (ETCO2 target 35-40 normally), immediate transport to highest-level trauma centre. Every intervention is about protecting the brain from secondary injury.","modIndex":3,"chIndex":0},{"num":61,"modTitle":"Module 4 | Anatomy and Physiology of the Nervous System","chName":"Chapter 8 — Nervous System","text":"Describe the normal function of cerebrospinal fluid and where it is found.","verdict":"keep","justification":"CSF production, circulation, and function are directly relevant to understanding meningitis, hydrocephalus, and lumbar puncture findings. Rapid changes in CSF pressure cause clinical deterioration.|||TAKEAWAY|||<strong>Most important to take away:</strong> CSF is produced by the choroid plexus in the ventricles, circulates through the ventricular system and subarachnoid space, reabsorbed by arachnoid granulations. Normal CSF: clear, colourless, low protein. Blood in CSF = subarachnoid hemorrhage (SAH). Cloudy/purulent CSF = meningitis. Increased ICP from blocked CSF drainage = hydrocephalus -> altered LOC, papilledema, headache.|||FIELD|||A patient with sudden 'worst headache of my life' has subarachnoid hemorrhage until proven otherwise — blood has entered the subarachnoid space. This is a neurosurgical emergency. Transport immediately. These patients can present with a normal neuro exam initially and deteriorate rapidly as the hematoma expands or vasospasm develops. Never dismiss the thunderclap headache.","modIndex":3,"chIndex":0},{"num":62,"modTitle":"Module 4 | Anatomy and Physiology of the Nervous System","chName":"Chapter 8 — Nervous System","text":"Outline the structure and functions of the peripheral nervous system, which includes the nerves that carry motor and sensory information to and from the body to control voluntary and involuntary activities.","verdict":"keep","justification":"The peripheral nervous system — cranial nerves and spinal nerve dermatomes — provides the framework for neurological assessment. Cranial nerve deficits localize lesions. Dermatome patterns help identify spinal cord injury levels.|||TAKEAWAY|||<strong>Most important to take away:</strong> 12 cranial nerves — clinically key ones: CN II (optic — vision), CN III (oculomotor — pupil/eye movement), CN V (trigeminal — face sensation), CN VII (facial — face movement/facial droop in stroke), CN X (vagus — heart/GI). Dermatomes: T4 = nipple line, T10 = umbilicus, C5-T1 = upper extremity, L1-S3 = lower extremity. Unilateral blown pupil = CN III compression from uncal herniation — neurosurgical emergency.|||FIELD|||The facial droop in stroke is a CN VII deficit — cortical neurons controlling that nerve have lost blood supply. A unilateral blown pupil indicates CN III compression from uncal herniation. Spinal cord injury level is determined by dermatome testing: sensation at the umbilicus (T10) but not below means injury at approximately T10. Communicate the spinal level to the receiving team — it helps them prepare management.","modIndex":3,"chIndex":0},{"num":63,"modTitle":"Module 4 | Anatomy and Physiology of the Nervous System","chName":"Chapter 8 — Nervous System","text":"Describe the human senses, as well as how visual information, sounds, smells, tastes, touch, and balance are detected by sensory receptor cells and then sent to the brain for interpretation.","verdict":"skim","justification":"The senses — vision, hearing, balance, smell, taste, pain — are assessed in neurological exams and are affected by a wide range of conditions. Pain physiology is particularly relevant for your patient assessment and analgesia decisions.|||TAKEAWAY|||<strong>Most important to take away:</strong> Pain: nociceptors detect tissue damage -> signal via A-delta fibres (sharp, fast) and C fibres (slow, dull, burning). Referred pain: pain perceived at a site different from its origin — cardiac pain to left arm/jaw (heart and left arm share spinal afferents), diaphragm irritation -> shoulder pain, kidney stones -> flank to groin. Balance: vestibular apparatus in inner ear — disruption causes nystagmus and vertigo.|||FIELD|||Referred pain is one of the most important clinical concepts in EMS. Cardiac ischemia -> left arm, jaw, or epigastric pain. Diaphragm irritation (blood or pus under diaphragm) -> shoulder pain. If your patient can't explain why their arm hurts and they're also diaphoretic, the arm pain may be their MI presentation. Never anchor on the presenting complaint without considering referred pain patterns.","modIndex":3,"chIndex":0},{"num":64,"modTitle":"Module 4 | Anatomy and Physiology of the Nervous System","chName":"Chapter 8 — Nervous System","text":"Discuss the main psychoactive effects on the brain and main receptors involved.","verdict":"keep","justification":"Psychoactive drugs alter neurotransmitter systems — stimulants increase sympathetic activity, depressants potentiate GABA, opioids bind specific receptors. Understanding these mechanisms explains clinical presentations and guides treatment. This objective is directly relevant given the overdose landscape in the Lower Mainland.|||TAKEAWAY|||<strong>Most important to take away:</strong> Opioids: bind mu-receptors -> CNS depression, respiratory depression, miosis (pinpoint pupils), decreased GI motility. Naloxone reverses by competitive binding. Stimulants (cocaine, methamphetamine): catecholamine release -> tachycardia, hypertension, hyperthermia, agitation, mydriasis. Alcohol/benzos: GABA potentiation -> CNS depression. Serotonin syndrome (SSRI excess/interaction): hyperthermia, agitation, clonus, tachycardia.|||FIELD|||The Lower Mainland has the highest illicit drug overdose rate in Canada. Opioid overdose presentations frequently involve fentanyl and increasingly fentanyl analogues or combined stimulant-opioid products (fentanyl + methamphetamine). BCEHS opioid overdose protocol: naloxone titrated to adequate ventilation, not full reversal (precipitates withdrawal and combative behaviour). Recognize stimulant-opioid combinations: the patient may have paradoxical findings — agitation AND respiratory depression simultaneously.","modIndex":3,"chIndex":0},{"num":65,"modTitle":"Module 5 | Anatomy and Physiology of the Respiratory System","chName":"Chapter 13 — Respiratory System","text":"Describe the process of respiration, in which oxygen moves from the outside air into the body, and carbon dioxide and other waste gases move from inside the body into the outside air.","verdict":"keep","justification":"The physiology of respiration — the movement of oxygen from atmosphere to cells and CO2 in reverse — is the foundation of airway and breathing management. Every ventilation intervention you perform is based on understanding this pathway.|||TAKEAWAY|||<strong>Most important to take away:</strong> Respiration pathway: atmosphere -> nose/mouth -> pharynx -> larynx -> trachea -> bronchi -> bronchioles -> alveoli -> alveolar-capillary membrane -> bloodstream -> tissues. Ventilation = moving air in and out. Respiration = gas exchange at the alveolar-capillary membrane and at tissue level. Oxygen transport: 98% bound to haemoglobin (SpO2 measures this); 2% dissolved in plasma. CO2: transported as bicarbonate (70%), bound to haemoglobin (23%), dissolved (7%).|||FIELD|||SpO2 measures haemoglobin oxygen saturation — 98% of oxygen transport. But SpO2 doesn't tell you about CO2 elimination — a patient can have a normal SpO2 and still be in respiratory failure if they're retaining CO2 (type 2 respiratory failure). ETCO2 monitoring (capnography) tells you about ventilation and CO2. Both together give you a complete picture. BCEHS protocols increasingly use ETCO2 for BVM ventilation monitoring, intubation confirmation, and cardiac arrest management.","modIndex":4,"chIndex":0},{"num":66,"modTitle":"Module 5 | Anatomy and Physiology of the Respiratory System","chName":"Chapter 13 — Respiratory System","text":"Outline the structures of the respiratory system and differentiate between the upper respiratory tract, lower respiratory tract, conducting zones, and respiratory zones.","verdict":"keep","justification":"Upper and lower respiratory tract anatomy is essential for airway management decisions — which device to use, where anatomical obstacles are, why certain interventions work. You'll manage airways in difficult anatomical situations; knowing normal anatomy helps you anticipate and troubleshoot.|||TAKEAWAY|||<strong>Most important to take away:</strong> Upper airway: nasal cavity (warms/filters/humidifies), pharynx, larynx (contains vocal cords — narrowest point in adults; widest point in children is below the cricoid). Lower airway: trachea -> carina -> right and left main bronchi (right is wider and more vertical — foreign bodies go right), bronchioles, alveoli. Airway landmarks: thyroid cartilage (Adam's apple), cricoid cartilage, cricothyroid membrane (surgical airway site).|||FIELD|||The right main bronchus is wider and more vertical — this is why foreign body aspirations and inadvertent right mainstem intubation both go right. When you intubate, listen to both sides: absent left breath sounds means you're in the right mainstem and need to pull back. A foreign body aspiration in a child causing unilateral wheeze is in the right bronchus until proven otherwise. BCEHS cricothyrotomy targets the cricothyroid membrane between the thyroid and cricoid cartilages.","modIndex":4,"chIndex":0},{"num":67,"modTitle":"Module 5 | Anatomy and Physiology of the Respiratory System","chName":"Chapter 13 — Respiratory System","text":"Understand how the respiratory tract protects itself from pathogens and other potentially harmful substances in the air.","verdict":"keep","justification":"The respiratory tract's defense mechanisms — mucociliary escalator, cough reflex, alveolar macrophages — are what prevent every breath from causing pneumonia. When these defenses fail (in unconscious patients, intubated patients, immunocompromised patients), respiratory infection risk skyrockets.|||TAKEAWAY|||<strong>Most important to take away:</strong> Mucociliary escalator: mucus traps particles, cilia sweep upward toward the pharynx where it's swallowed — impaired by smoking, cold air, intubation. Cough reflex: CN IX/X mediated, forcefully expels material from lower airway — lost in unconscious patients or those with CNS depression. Alveolar macrophages: phagocytose particles reaching the alveoli. Aspiration risk increases dramatically with: altered LOC, seizures, vomiting, dysphagia, supine positioning.|||FIELD|||An unconscious patient with a depressed gag reflex who vomits will aspirate stomach contents. Your airway management (positioning, suction, advanced airway) substitutes for the patient's lost protective reflexes. BCEHS airway protocol: unconscious patients without adequate airway protection get an advanced airway. Lateral recovery position for patients with intact ventilation but impaired consciousness reduces aspiration risk.","modIndex":4,"chIndex":0},{"num":68,"modTitle":"Module 5 | Anatomy and Physiology of the Respiratory System","chName":"Chapter 13 — Respiratory System","text":"Define normal lung volumes and capacities.","verdict":"keep","justification":"Lung volumes and capacities are the numbers behind your ventilation decisions. Tidal volume for BVM ventilation is based on normal physiology. Understanding lung volumes explains why certain patients (COPD with high FRC) are different to ventilate.|||TAKEAWAY|||<strong>Most important to take away:</strong> Tidal volume (TV): normal breath ~500mL (6-8 mL/kg ideal body weight). For BVM ventilation, use minimum volume to achieve visible chest rise — overventilation is harmful. FEV1: volume exhaled in first second — reduced in obstructive disease (asthma, COPD). FRC: volume remaining after normal expiration — increased in COPD (air trapping). Residual volume: can never be emptied — prevents alveolar collapse.|||FIELD|||BVM ventilation: squeeze just enough to see the chest rise — about 500mL. Overventilation causes gastric insufflation (aspiration risk) and impairs venous return (auto-PEEP, especially in obstructive lung disease). COPD patients have increased FRC due to air trapping — they need longer expiration times. If you're squeezing the bag 20 times a minute on a COPD patient, you're stacking breaths and not letting them exhale fully.","modIndex":4,"chIndex":0},{"num":69,"modTitle":"Module 5 | Anatomy and Physiology of the Respiratory System","chName":"Chapter 13 — Respiratory System","text":"Explain how the rate of breathing is regulated to maintain homeostasis of blood gases and pH.","verdict":"keep","justification":"Breathing rate regulation — by chemoreceptors sensing CO2, O2, and pH — explains why certain patients breathe the way they do and what it means clinically. The hypoxic drive myth about COPD patients and oxygen is explained (and largely debunked) by this physiology.|||TAKEAWAY|||<strong>Most important to take away:</strong> Primary driver of breathing: CO2 level (central chemoreceptors in medulla). Rising CO2 -> increased breathing rate to blow off more CO2. Secondary driver: O2 level (peripheral chemoreceptors in carotid and aortic bodies). COPD patients with chronic CO2 retention have reset their central chemoreceptor threshold. Current evidence: give O2 to hypoxic COPD patients but titrate to SpO2 88-92% to avoid worsening hypercapnia via Haldane effect.|||FIELD|||BCEHS oxygen protocol for COPD exacerbation: target SpO2 88-92%. This isn't because you'll turn off their drive to breathe — the evidence for that is weak. It's because hyperoxia in COPD causes the Haldane effect — O2 displaces CO2 from haemoglobin, raising PaCO2. Titrated O2 is the message, not withheld O2. A hypoxic COPD patient still gets oxygen — you just target a slightly lower saturation than for a healthy adult.","modIndex":4,"chIndex":0},{"num":70,"modTitle":"Module 5 | Anatomy and Physiology of the Respiratory System","chName":"Chapter 13 — Respiratory System","text":"Compare and contrast internal respiration and external respiration.","verdict":"keep","justification":"External vs. internal respiration — alveolar gas exchange vs. tissue-level gas exchange — explains why a patient can have intact lung function and still suffer from cellular hypoxia (in CO poisoning, severe anemia, or circulatory failure). This distinction is critical for understanding why SpO2 can be misleading.|||TAKEAWAY|||<strong>Most important to take away:</strong> External respiration: O2 diffuses from alveoli into pulmonary capillaries; CO2 diffuses out. Driven by partial pressure gradients. Internal respiration: O2 diffuses from systemic capillaries into cells; CO2 diffuses out. CO poisoning: CO binds haemoglobin 250x more avidly than O2 -> blocks O2 transport despite normal PaO2 -> pulse oximetry reads falsely normal. Cyanide poisoning: blocks cellular O2 use -> internal respiration fails despite normal blood O2.|||FIELD|||CO poisoning is the perfect example of why SpO2 is unreliable: haemoglobin is saturated with CO instead of O2, but the pulse ox can't tell the difference — it reads 98-100%. The patient is profoundly hypoxic at the cellular level. Treatment: high-flow 100% O2 to competitively displace CO. BCEHS CO protocol: any patient in a fire, enclosed space with combustion, or presenting with headache/confusion in relevant context gets high-flow O2 regardless of SpO2.","modIndex":4,"chIndex":0},{"num":71,"modTitle":"Module 5 | Anatomy and Physiology of the Respiratory System","chName":"Chapter 13 — Respiratory System","text":"Differentiate between conscious and unconscious (neurologic) control of breathing and identify homeostatic regulation of breathing.","verdict":"keep","justification":"The distinction between voluntary (cortical) and involuntary (brainstem) control of breathing explains why brainstem injury causes specific respiratory patterns that you can recognize clinically and use to localize neurological lesions.|||TAKEAWAY|||<strong>Most important to take away:</strong> Involuntary control: medullary respiratory centre sets baseline rhythm; pons modulates. Voluntary override: allows breath-holding, speaking, singing. Abnormal respiratory patterns from brainstem lesions: Cheyne-Stokes (crescendo-decrescendo with apnea — bilateral hemisphere or early herniation), central neurogenic hyperventilation (sustained rapid deep breathing — midbrain lesion), Biot's/ataxic breathing (irregular, unpredictable — medullary damage, pre-terminal).|||FIELD|||Recognizing abnormal respiratory patterns in head-injured or post-cardiac-arrest patients provides neurological localization at zero equipment cost. Cheyne-Stokes in a post-resuscitation patient indicates significant bilateral cortical or subcortical damage. Ataxic breathing in a TBI patient indicates medullary involvement — imminent respiratory arrest, these patients need airway protection. Document the respiratory pattern in your handoff.","modIndex":4,"chIndex":0},{"num":72,"modTitle":"Module 5 | Anatomy and Physiology of the Respiratory System","chName":"Chapter 13 — Respiratory System","text":"Understand disorders of the respiratory system, including asthma, pneumonia, chronic obstructive pulmonary disease (COPD), and lung cancer.","verdict":"keep","justification":"Asthma, pneumonia, COPD, pulmonary embolism, and pneumothorax are among the most common prehospital respiratory emergencies. Understanding the pathophysiology — not just the treatment algorithm — allows you to adapt when the algorithm doesn't fit and to anticipate deterioration.|||TAKEAWAY|||<strong>Most important to take away:</strong> Asthma: bronchospasm + inflammation + mucus -> air trapping -> increased WOB. Treat: beta-2 agonists (salbutamol), ipratropium, corticosteroids. COPD: chronic airflow obstruction, air trapping, loss of elastic recoil. PE: clot in pulmonary vasculature -> V/Q mismatch -> hypoxia + right heart strain. Signs: sudden SOB, pleuritic chest pain, tachycardia, risk factors (DVT, malignancy, immobility). Tension pneumothorax: air in pleural space -> lung collapse -> mediastinal shift -> obstructive shock.|||FIELD|||Status asthmaticus (severe refractory bronchospasm) is life-threatening. BCEHS asthma protocol: salbutamol MDI with spacer (4-8 puffs = equivalent to nebulizer), ipratropium if available, early recognition of impending respiratory failure. A silent chest in an asthmatic is not improving asthma — it's a patient about to arrest: no air movement in or out. Call ALS early and be ready to ventilate.","modIndex":4,"chIndex":0},{"num":73,"modTitle":"Module 5 | Anatomy and Physiology of the Respiratory System","chName":"Chapter 13 — Respiratory System","text":"Discuss the negative health effects of smoking.","verdict":"skim","justification":"Smoking as a cause of COPD, lung cancer, cardiovascular disease, and impaired healing is epidemiologically relevant for your patient population. A significant portion of your patients will be current or former smokers, and this shapes their baseline respiratory reserve and comorbidity profile.|||TAKEAWAY|||<strong>Most important to take away:</strong> Smoking causes: COPD (directly), lung cancer, cardiovascular disease (accelerated atherosclerosis), impaired wound healing (vasoconstriction reduces tissue oxygenation), increased surgical risk. Secondhand smoke: significant risk for children — higher rates of asthma, ear infections, SIDS. Pack-year history (packs/day x years smoked) quantifies cumulative damage.|||FIELD|||When assessing a patient with COPD, knowing their pack-year history gives you a sense of severity. A 40-pack-year smoker likely has significant lung damage. Their baseline SpO2 may be 90-93% — normal for them. Always ask: 'What does your breathing feel like on a normal day?' and 'What's your usual oxygen level?' This contextualizes whether today's presentation is a significant change from their baseline.","modIndex":4,"chIndex":0},{"num":74,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Outline and label the major components of the cardiovascular system: the heart, blood vessels, and blood.","verdict":"keep","justification":"The cardiovascular system overview — heart, blood vessels, blood — frames the most common life-threatening emergencies you'll manage. Cardiac arrest, AMI, stroke, heart failure, and hemorrhagic shock are all cardiovascular system failures or consequences of cardiovascular disease.|||TAKEAWAY|||<strong>Most important to take away:</strong> Cardiovascular system: heart (pump), blood vessels (distribution network), blood (transport medium). Function: deliver O2 and nutrients to tissues, remove CO2 and waste. Cardiac output = heart rate x stroke volume. Stroke volume determined by preload (filling), afterload (resistance), contractility. Blood pressure = cardiac output x systemic vascular resistance. Shock = inadequate O2 delivery to tissues.|||FIELD|||Every shock state can be analyzed using the CO formula: hypovolemic shock (low preload -> low SV -> low CO), cardiogenic shock (low contractility -> low SV -> low CO), distributive shock (low SVR -> normal CO but inadequate perfusion pressure), obstructive shock (impaired filling or outflow -> low CO). Your treatments target whichever component is failing: fluids for hypovolemia, vasopressors for distributive shock, pericardiocentesis for tamponade.","modIndex":5,"chIndex":0},{"num":75,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Differentiate between the pulmonary circulation and systemic circulation.","verdict":"keep","justification":"Pulmonary vs. systemic circulation is the anatomical basis for understanding heart failure (left vs. right sided), pulmonary hypertension, and why conditions that affect one circuit affect the other. Left heart failure causes pulmonary edema; right heart failure causes systemic edema.|||TAKEAWAY|||<strong>Most important to take away:</strong> Pulmonary circulation: right heart -> pulmonary arteries -> lungs (gas exchange) -> pulmonary veins -> left heart. Low-pressure, high-flow circuit. Systemic circulation: left heart -> aorta -> all body tissues -> venae cavae -> right heart. High-pressure, high-resistance circuit. Left heart failure: backs up into pulmonary circulation -> pulmonary edema (wet crackles, orthopnea, pink frothy sputum). Right heart failure: backs up into systemic veins -> JVD, peripheral edema, hepatomegaly.|||FIELD|||Acute pulmonary edema (APE) is left heart failure backing up into the lungs — your patient is drowning in their own fluid. BCEHS APE protocol: upright positioning (reduces preload), oxygen (high-flow or CPAP if available), nitroglycerin (vasodilation reduces preload and afterload), furosemide (diuresis). Recognizing the crackles, orthopnea, and pink frothy sputum directs you to the cardiac etiology rather than treating it as pneumonia.","modIndex":5,"chIndex":0},{"num":76,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Describe the functions of the cardiovascular system, including transporting needed substances (such as oxygen and nutrients) to the cells of the body, and picking up waste products.","verdict":"keep","justification":"The functions of the cardiovascular system explain why cardiovascular failure has such broad systemic effects. Shock affects every organ because every organ depends on the cardiovascular system for O2.|||TAKEAWAY|||<strong>Most important to take away:</strong> Cardiovascular functions: transport O2 from lungs to tissues, transport CO2 from tissues to lungs, deliver nutrients, remove waste (urea, creatinine), transport hormones and immune cells, thermoregulation (cutaneous blood flow), deliver clotting factors to injury sites. Shock impairs all of these simultaneously — hence multi-organ dysfunction in prolonged shock.|||FIELD|||Septic shock patients in the ICU develop multi-organ dysfunction syndrome (MODS) — kidneys fail, liver fails, lungs fail (ARDS). Every organ failure is a consequence of prolonged inadequate perfusion. Your prehospital job: identify shock early, treat reversible causes, and get the patient to hospital before MODS develops. Time to definitive care is the intervention.","modIndex":5,"chIndex":0},{"num":77,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Explain the structure and function of the alveolar-capillary membrane how gas exchange occurs through the pulmonary circulation.","verdict":"keep","justification":"The alveolar-capillary membrane and gas exchange mechanism is directly relevant to understanding V/Q mismatch, pneumonia, pulmonary edema, and ARDS — all conditions that impair O2 transfer at this interface.|||TAKEAWAY|||<strong>Most important to take away:</strong> Alveolar-capillary membrane: <0.5 microns thick, massive surface area (~70m2). O2 diffuses from high PO2 in alveolus (105 mmHg) to low PO2 in capillary (40 mmHg). CO2 diffuses in reverse. Conditions impairing gas exchange: thickened membrane (pneumonia, fibrosis), fluid in alveoli (pulmonary edema, near-drowning), reduced surface area (emphysema), V/Q mismatch (PE = perfusion without ventilation; atelectasis = ventilation without perfusion).|||FIELD|||A COVID-19 patient with bilateral pneumonia has inflamed, fluid-filled alveoli — the alveolar-capillary membrane is thickened and gas exchange fails. SpO2 drops despite seemingly adequate ventilation effort. High-flow O2 helps bridge them to hospital; what they ultimately need is positive pressure to recruit collapsed alveoli (CPAP, ventilator PEEP). Your job is recognizing the failure and getting them there fast.","modIndex":5,"chIndex":0},{"num":78,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Explain how blood circulates throughout the body through the systemic circulation.","verdict":"keep","justification":"Systemic circulation and blood distribution between compartments explains fluid management, hemorrhagic shock stages, and why capillary refill is a clinical assessment tool.|||TAKEAWAY|||<strong>Most important to take away:</strong> Blood distribution: ~60% in veins (capacitance vessels — the body's blood reservoir), ~15% in arteries, ~5% in capillaries. Venous return (preload) is the main determinant of stroke volume. Capillary refill time: reflects peripheral perfusion; >2 sec = poor perfusion. Starling forces: capillary hydrostatic pressure pushes fluid out; oncotic pressure (albumin) pulls fluid in. Imbalance -> edema.|||FIELD|||The massive venous capacitance explains why venoconstriction is one of the body's first compensatory responses to hemorrhage — it autotransfuses from the venous reservoir into the active circulation. BP can be maintained until 30% blood volume is lost. A patient who appears hemodynamically stable after trauma may have lost a litre or more already. Don't be reassured by a normal BP in a trauma patient.","modIndex":5,"chIndex":0},{"num":79,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Describe the components of blood — including plasma, red blood cells, white blood cells, and platelets — and describe their specific functions.","verdict":"keep","justification":"Blood components — plasma, RBCs, WBCs, platelets, clotting factors — are the medium of the cardiovascular system and the basis for understanding anemia, coagulopathy, infection, and transfusion.|||TAKEAWAY|||<strong>Most important to take away:</strong> RBCs: carry haemoglobin -> O2 transport. Anemia = low RBC/haemoglobin -> reduced O2-carrying capacity -> fatigue, pallor, tachycardia. WBCs: immune defence. Platelets: primary hemostasis (clot initiation). Plasma proteins: albumin (oncotic pressure, drug binding), clotting factors (coagulation cascade), immunoglobulins (antibodies). Anticoagulants (warfarin, rivaroxaban, heparin) impair different steps of coagulation.|||FIELD|||A trauma patient on warfarin (Coumadin), rivaroxaban (Xarelto), or apixaban (Eliquis) has impaired coagulation — they will bleed more severely and longer. Hemorrhage control is more critical; direct pressure time is longer; hospital notification should include anticoagulant status so reversal agents can be prepared. Asking about blood thinners in your medication history is not optional for trauma patients.","modIndex":5,"chIndex":0},{"num":80,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Classify blood typing using the ABO system and Rh factor and identify a universal donor versus a universal recipient.","verdict":"skim","justification":"ABO blood typing and Rh factor are relevant for trauma patients who may receive blood products, and for obstetric emergencies where Rh incompatibility between mother and fetus is a clinical concern.|||TAKEAWAY|||<strong>Most important to take away:</strong> ABO system: A, B, AB, O types determined by antigens on RBCs. Mismatched transfusion -> agglutination -> hemolysis -> potentially fatal. Type O negative = universal donor — used in emergency trauma. Rh factor: Rh-positive (antigen present) vs. Rh-negative (antigen absent). Rh-negative mother + Rh-positive fetus = maternal sensitization after first pregnancy -> hemolytic disease in subsequent pregnancies. RhoGAM prevents sensitization.|||FIELD|||In a mass casualty or rural trauma scenario, a patient may receive uncrossmatched O-negative blood. This is safe and life-saving for immediate hemorrhage control, but the hospital needs to know it was given. For obstetric patients: an Rh-negative woman with vaginal bleeding in pregnancy needs anti-D immunoglobulin (RhoGAM) if there's any possibility of fetal blood exposure. Document Rh status if known at handoff.","modIndex":5,"chIndex":0},{"num":81,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Compare and contrast the structure and function of different types of blood vessels — including arteries, veins, and capillaries.","verdict":"keep","justification":"Arteries, veins, and capillaries have different structures for different functions — arteries withstand high pressure, veins accommodate large volumes, capillaries allow exchange. This explains why arterial bleeding is an emergency and venous bleeding usually is not, and why IV access goes in veins.|||TAKEAWAY|||<strong>Most important to take away:</strong> Arteries: thick elastic walls, withstand high pressure, carry oxygenated blood (except pulmonary artery). Arterial hemorrhage: pulsatile, bright red, life-threatening — tourniquet or direct pressure required immediately. Veins: thinner walls, valves prevent backflow, lower pressure, large diameter. Venous access: all peripheral IV sites are veins. Capillaries: single cell layer -> exchange. Aortic aneurysm: weakened arterial wall -> risk of catastrophic rupture.|||FIELD|||Arterial vs. venous hemorrhage at a trauma scene: bright red + pulsatile = arterial -> tourniquet immediately, proximal occlusion. Dark red + steady flow = venous -> direct pressure usually adequate. Aortic aneurysm rupture: tearing/ripping back pain, hypotension, pulsatile abdominal mass — this patient needs the OR in under 30 minutes. Any delay is fatal. Internal arterial hemorrhage is always an OR-only fix.","modIndex":5,"chIndex":0},{"num":82,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Outline and label the structures of the heart, electrical conduction system components, and nervous control of the heart.","verdict":"keep","justification":"The heart's structure and conduction system are foundational to ECG interpretation and ACLS algorithms. Every rhythm you identify on a monitor reflects this anatomy.|||TAKEAWAY|||<strong>Most important to take away:</strong> Cardiac chambers: RA -> tricuspid -> RV -> pulmonary valve -> pulmonary artery. LA -> mitral valve -> LV -> aortic valve -> aorta. LV has thickest wall (systemic pressure). Conduction system: SA node (pacemaker, 60-100 bpm) -> AV node (0.1s delay, allows atrial priming) -> Bundle of His -> left/right bundle branches -> Purkinje fibres -> ventricular myocardium. ECG: P wave = atrial depolarization, PR interval = AV conduction time, QRS = ventricular depolarization, T wave = ventricular repolarization.|||FIELD|||Complete heart block (third-degree): no conduction from atria to ventricles — ventricles fire at their intrinsic rate (20-40 bpm) = haemodynamically unstable. BCEHS protocol: transcutaneous pacing or atropine as a temporizing measure. First-degree block (prolonged PR) = benign. Mobitz II (sudden dropped beats without warning) = high risk of progressing to complete block — treat as urgent. Understanding the conduction system tells you what each block means clinically.","modIndex":5,"chIndex":0},{"num":83,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Understand action potentials of the cardiac conduction system and associated electrolytes.","verdict":"keep","justification":"Cardiac action potentials explain why antiarrhythmic drugs work, why electrolyte imbalances cause dysrhythmias, and what your cardiac monitor is showing you.|||TAKEAWAY|||<strong>Most important to take away:</strong> Pacemaker action potential: slow spontaneous depolarization via funny current + Ca2+ channels — this is automaticity. Myocardial action potential: fast Na+ influx -> steep depolarization, Ca2+ influx sustains plateau (refractory period — prevents premature re-excitation). Electrolyte effects: hyperkalemia = peaked T waves, wide QRS, sine-wave pattern; hypokalemia = flat T waves, U waves, prolonged QT; hypocalcemia = prolonged QT, spasms.|||FIELD|||Your dialysis patient who missed sessions is likely hyperkalemic. Peaked T waves and a wide QRS are the ECG manifestations. This patient needs hospital urgently for calcium gluconate (stabilizes cardiac membrane), insulin+glucose (drives K+ into cells), and dialysis. Hypocalcemia after thyroid/parathyroid surgery causes prolonged QT -> risk of Torsades de Pointes. Recognize these ECG patterns — the monitor is also an electrolyte monitor.","modIndex":5,"chIndex":0},{"num":84,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Describe what blood pressure is and how it is regulated.","verdict":"keep","justification":"Blood pressure regulation — the baroreceptor reflex, RAAS, and blood volume — is the physiological basis for your hemodynamic assessment and your interventions in shock, hypertensive emergencies, and hypotension.|||TAKEAWAY|||<strong>Most important to take away:</strong> BP = CO x SVR. Baroreceptor reflex (fast, seconds): carotid sinus/aortic arch detect BP changes -> adjust HR and vasomotor tone. RAAS (slow, hours): low BP -> renin -> angiotensin I -> ACE converts to angiotensin II -> vasoconstriction + aldosterone -> Na/water retention -> volume expansion. Hypertensive emergency: SBP >180/DBP >120 WITH end-organ damage (chest pain, headache, visual changes, stroke symptoms) — reduce BP carefully, not rapidly.|||FIELD|||A patient with very high BP but no symptoms is hypertensive urgency — not a field emergency. A patient with high BP + chest pain/stroke symptoms/altered LOC is a hypertensive emergency. BCEHS approach: treat the presenting emergency (AMI, stroke, APE) rather than targeting the number. Rapidly dropping BP in a stroke patient can extend the infarct by reducing perfusion to the ischemic penumbra. Tell the hospital the BP; they'll titrate it carefully.","modIndex":5,"chIndex":0},{"num":85,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Discuss blood disorders, including anemia, HIV, and leukemia.","verdict":"keep","justification":"Anemia, HIV/AIDS, and leukemia represent blood disorders you'll encounter in your patient population. Understanding their pathophysiology helps you contextualize symptoms, anticipate complications, and communicate effectively at handoff.|||TAKEAWAY|||<strong>Most important to take away:</strong> Anemia: reduced O2-carrying capacity -> compensatory tachycardia, tachypnea, pallor, fatigue. Tachycardia in anemia = compensation, not primary cardiac problem. HIV/AIDS: progressive immune dysfunction -> opportunistic infections. End-stage AIDS patients have multiple concurrent infections — assess carefully. Leukemia: malignant WBC proliferation -> bone marrow failure -> anemia (low RBCs), infection risk (abnormal WBCs), bleeding (low platelets).|||FIELD|||A profoundly anemic patient (haemoglobin <70 g/L) can be in high-output cardiac failure — their heart is compensating so hard for low O2-carrying capacity that it's failing. These patients may present with CHF symptoms without any underlying cardiac disease. An HIV patient with fever, productive cough, and SpO2 88% needs Pneumocystis pneumonia (PCP) considered — a common AIDS-defining illness that can be lethal.","modIndex":5,"chIndex":0},{"num":86,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Discuss cardiovascular diseases (including heart attack, stroke, and angina), and the risk factors and precursors — such as high blood pressure and atherosclerosis — that contribute to them.","verdict":"keep","justification":"AMI, stroke, and heart failure are the top three cardiovascular killers in Canada and the most common time-critical emergencies you'll manage. Understanding their pathophysiology is essential for recognition, intervention, and transport decisions.|||TAKEAWAY|||<strong>Most important to take away:</strong> AMI: coronary artery occlusion (thrombus on ruptured plaque) -> ischemia -> necrosis. STEMI: complete occlusion, ST elevation, needs immediate PCI (door-to-balloon <90 min). Recognition: chest pain/pressure ± radiation to arm/jaw, diaphoresis, nausea, dyspnea. Stroke: ischemic (80% — clot) or hemorrhagic (20% — bleed). FAST: Face droop, Arm weakness, Speech difficulty, Time. Heart failure: pump failure -> congestion upstream (LHF = pulmonary edema; RHF = peripheral edema).|||FIELD|||STEMI is a race — every minute of occlusion = ~2 million myocardial cells dead. BCEHS STEMI protocol: 12-lead ECG on scene, aspirin 162-325mg chewed, nitroglycerin if no contraindication (BP >90, no right-sided MI, no PDE5 inhibitor in last 24-48h), early notification to activate the cath lab. Right-sided MI precaution: nitro drops preload — a right-sided MI patient is preload-dependent and nitro can cause severe hypotension. Do a right-sided ECG (V4R) if inferior MI suspected.","modIndex":5,"chIndex":0},{"num":87,"modTitle":"Module 7 | Anatomy and Physiology of the Lymphatic and Immune Systems","chName":"Chapter 17 — Lymphatic and Immune Systems","text":"Describe how the immune system identifies normal cells of the body as \"self\" and pathogens and damaged cells as \"non-self.\"","verdict":"keep","justification":"The immune system's ability to distinguish self from non-self is the basis for autoimmune disease, allergic reactions, and organ transplant rejection. It also explains why HIV is so destructive — it targets the key coordinator cells of adaptive immunity.|||TAKEAWAY|||<strong>Most important to take away:</strong> Self-recognition: MHC proteins on cell surfaces identify cells as 'self.' T cells trained in the thymus to ignore self-MHC — failures -> autoimmune disease. Non-self recognition: antibodies, complement, phagocytes recognize pathogen-associated molecular patterns (PAMPs). Autoimmune diseases (lupus, RA, MS, type 1 diabetes): immune system attacks self-tissue. Many autoimmune patients are on immunosuppressants -> increased infection risk.|||FIELD|||A patient with rheumatoid arthritis on methotrexate or biologics presenting with fever and focal infection is high-risk. Their immunosuppressive therapy prevents the immune response from containing the infection. What would be mild soft-tissue infection in an immunocompetent patient can become sepsis rapidly. Treat infection more aggressively, transport earlier, communicate immunosuppressant medications prominently at handoff.","modIndex":6,"chIndex":0},{"num":88,"modTitle":"Module 7 | Anatomy and Physiology of the Lymphatic and Immune Systems","chName":"Chapter 17 — Lymphatic and Immune Systems","text":"Explain the two major subsystems of the general immune system: the innate immune system and the adaptive immune system.","verdict":"keep","justification":"The innate vs. adaptive immune system distinction explains why infections initially get worse before getting better (innate response is fast but non-specific) and why vaccines work (adaptive memory). It also frames the pathophysiology of sepsis — dysregulated innate immune activation.|||TAKEAWAY|||<strong>Most important to take away:</strong> Innate immune system: fast (hours), non-specific, no memory. Components: physical barriers (skin, mucosa), phagocytes (neutrophils, macrophages), complement, natural killer cells, inflammation. Adaptive immune system: slow (days-weeks), specific, has memory (faster on re-exposure). Components: B cells (antibodies) and T cells (cell-mediated). Sepsis: dysregulated innate immune response to infection -> systemic inflammation -> vasodilation -> organ damage -> death.|||FIELD|||Sepsis is the innate immune response gone systemic and out of control. The body releases massive inflammatory mediators causing widespread vasodilation, capillary leak, and organ damage. BCEHS sepsis recognition: fever (or hypothermia in elderly/immunocompromised), tachycardia, tachypnea, altered LOC, source of infection. Sepsis kills through distributive shock. Early IV access, fluids, and transport are your interventions — time to antibiotics matters.","modIndex":6,"chIndex":0},{"num":89,"modTitle":"Module 7 | Anatomy and Physiology of the Lymphatic and Immune Systems","chName":"Chapter 17 — Lymphatic and Immune Systems","text":"Outline components of the neuroimmune system.","verdict":"skim","justification":"The neuroimmune system — connections between the nervous and immune systems — explains why stress causes immunosuppression, why pain management matters beyond comfort, and why psychosocial factors affect recovery.|||TAKEAWAY|||<strong>Most important to take away:</strong> Nervous and immune systems communicate bidirectionally. Cortisol (stress hormone) is immunosuppressive — chronic stress -> impaired immune function -> increased infection susceptibility. Substance P (neuropeptide released in pain) has pro-inflammatory effects. Physiological basis for mind-body connections. In prehospital care: pain management isn't just comfort — undertreated pain amplifies the stress response and may worsen outcomes.|||FIELD|||Adequate pain management reduces the stress hormone response (cortisol, epinephrine) that can worsen cardiovascular strain, impair immune function, and increase myocardial oxygen demand. A trauma patient in severe unmanaged pain is physiologically stressed in ways that compound their injury. BCEHS analgesia protocol: assess pain, treat pain, reassess. Use the tools available (fentanyl, morphine, ketorolac, methoxyflurane) and document.","modIndex":6,"chIndex":0},{"num":90,"modTitle":"Module 7 | Anatomy and Physiology of the Lymphatic and Immune Systems","chName":"Chapter 17 — Lymphatic and Immune Systems","text":"Describe the organs, cells, and responses of the innate immune system.","verdict":"skim","justification":"The innate immune response — inflammation, phagocytosis, complement — is the mechanism behind the local and systemic signs of infection that you assess on every call. Understanding what causes fever, redness, swelling, and pain allows you to recognize when these normal responses have become pathological.|||TAKEAWAY|||<strong>Most important to take away:</strong> Inflammatory response: tissue damage or infection -> mast cells release histamine -> vasodilation and increased vascular permeability -> redness, heat, swelling, pain. Purpose: bring immune cells to site, isolate pathogen. Fever: pyrogens reset hypothalamic temperature set point upward — protective at moderate levels but dangerous at >40 degrees C (enzyme denaturation, seizure risk). Phagocytosis: neutrophils (first responders) and macrophages engulf and destroy pathogens.|||FIELD|||A patient with a wound infection will have local signs of inflammation. When those signs extend — spreading erythema (cellulitis), red streaking toward central lymph nodes (lymphangitis), fever, and tachycardia — the infection is spreading and the patient is becoming septic. Lymphangitis + systemic signs = IV antibiotics and hospital urgently. These patients can become septic within hours of your assessment.","modIndex":6,"chIndex":0},{"num":91,"modTitle":"Module 7 | Anatomy and Physiology of the Lymphatic and Immune Systems","chName":"Chapter 17 — Lymphatic and Immune Systems","text":"Outline components of the lymphatic system as it relates to adaptive immunity — including lymphocytes, lymphatic vessels, lymph, and organs (such as the spleen, tonsils, and lymph nodes).","verdict":"skim","justification":"The lymphatic system as the anatomical basis of adaptive immunity explains lymphadenopathy as a sign of immune activation, and lymphoma as a presentation you may encounter. Splenomegaly from infectious mononucleosis creates a specific trauma risk.|||TAKEAWAY|||<strong>Most important to take away:</strong> Lymphatic organs: thymus (T cell maturation), bone marrow (B cell origin), lymph nodes (antigen presentation and immune activation), spleen (blood filtration and immune response). Lymphadenopathy: enlarged lymph nodes = immune activation from infection, inflammation, or malignancy. Splenomegaly: enlarged spleen — risk of splenic rupture in trauma, especially relevant in infectious mononucleosis (EBV).|||FIELD|||A teenager or young adult with recent mononucleosis (EBV) who takes any contact force to the abdomen is at risk for splenic rupture — the spleen is enlarged and friable. Even a tackle or a seatbelt impact can rupture a mono-infected spleen. Spleen rupture = massive intraperitoneal hemorrhage = rapid hemorrhagic shock. Left upper quadrant pain + left shoulder tip pain (Kehr's sign = diaphragmatic irritation) + hemodynamic instability = splenic rupture until proven otherwise.","modIndex":6,"chIndex":0},{"num":92,"modTitle":"Module 7 | Anatomy and Physiology of the Lymphatic and Immune Systems","chName":"Chapter 17 — Lymphatic and Immune Systems","text":"Outline the specific cells of the immune system and their functions, including Lymphocytes (B cells, T cells, plasma cells, and natural killer cells), myeloid cells (neutrophils, eosinophils, and basophils), monocytes and macrophages, and mast cells.","verdict":"skip","justification":"Skip. Detailed cellular immunology of lymphocyte subtypes (CD4+, CD8+, regulatory T cells, B cell subtypes) is beyond PCP scope and not directly applicable to prehospital decision-making.|||TAKEAWAY|||The clinically relevant point: CD4+ T-helper cells are the cells destroyed by HIV. CD4 count <200 cells/uL = AIDS-defining. Low CD4 = profound immunosuppression = vulnerability to opportunistic infections (PCP pneumonia, toxoplasmosis, CMV, Cryptococcus). HIV patients in advanced disease need assessment with a low threshold for serious pathology.|||FIELD|||An HIV patient with a low CD4 count presenting with headache, fever, and photophobia may have cryptococcal meningitis or CNS toxoplasmosis — not a simple tension headache. The immunological deficit means the brain is vulnerable to organisms a healthy immune system would contain. These patients need urgent transport and appropriate infection control precautions.","modIndex":6,"chIndex":0},{"num":93,"modTitle":"Module 7 | Anatomy and Physiology of the Lymphatic and Immune Systems","chName":"Chapter 17 — Lymphatic and Immune Systems","text":"Describe how the adaptive immune system can generate specific and often long-lasting immunity against pathogens through the production of antibodies.","verdict":"skim","justification":"The adaptive immune system's specific response and immunological memory explain how vaccines work, why reinfection is less severe, and why immunocompromised patients lack memory responses.|||TAKEAWAY|||<strong>Most important to take away:</strong> Adaptive response: antigen presented by dendritic cells -> T cell activation -> B cell activation -> antibody production (humoral immunity) + cytotoxic T cells (cell-mediated). Memory cells: long-lived B and T memory cells persist after infection/vaccination -> faster, stronger response on re-exposure. This is the immunological basis of herd immunity.|||FIELD|||Unvaccinated individuals represent transmission vectors to infants too young to be vaccinated and immunocompromised individuals for whom vaccines don't work. In the Lower Mainland, outbreaks in under-vaccinated communities do occur. When you encounter patients with suspected measles or pertussis, respiratory isolation during transport and early notification of the receiving facility matters for infection control.","modIndex":6,"chIndex":0},{"num":94,"modTitle":"Module 7 | Anatomy and Physiology of the Lymphatic and Immune Systems","chName":"Chapter 17 — Lymphatic and Immune Systems","text":"Discuss how vaccines work to generate immunity.","verdict":"skip","justification":"Skip. The detailed mechanism of vaccine-induced immunity is public health education content rather than prehospital clinical content.|||TAKEAWAY|||Vaccines work by presenting a non-harmful antigen (live-attenuated, killed, subunit, mRNA) to the immune system -> adaptive response -> memory cells form -> faster response when real pathogen encountered. mRNA vaccines (COVID-19): mRNA codes for spike protein -> body produces it -> immune response without live virus. The mRNA is degraded within days and never integrates into DNA.|||FIELD|||Patients may ask you about vaccines during calls. You can explain that vaccines train the immune system without causing the disease. As a prehospital clinician, encouraging vaccine access and dispelling misinformation is part of your public health role. For specific questions beyond your knowledge, refer patients to their GP or pharmacy.","modIndex":6,"chIndex":0},{"num":95,"modTitle":"Module 7 | Anatomy and Physiology of the Lymphatic and Immune Systems","chName":"Chapter 17 — Lymphatic and Immune Systems","text":"Discuss how cells in the immune system detect and kill cancerous cells.","verdict":"skip","justification":"Skip. Tumour immunosurveillance and how immune cells detect and kill cancerous cells is immunology/oncology content beyond PCP clinical scope.|||TAKEAWAY|||The immune system continuously monitors for and eliminates cancerous cells via natural killer (NK) cells and cytotoxic T cells. When this surveillance fails -> malignancy. Immunosuppressed patients (transplant patients, HIV/AIDS) have higher rates of cancer. Transplant patients on immunosuppression need a lower threshold for concerning symptoms.|||FIELD|||Organ transplant patients on immunosuppression have dramatically increased cancer risk. A transplant patient with an unexplained lump, weight loss, or night sweats warrants oncological workup — their immune surveillance is pharmacologically impaired. Note immunosuppressive medications prominently at handoff.","modIndex":6,"chIndex":0},{"num":96,"modTitle":"Module 7 | Anatomy and Physiology of the Lymphatic and Immune Systems","chName":"Chapter 17 — Lymphatic and Immune Systems","text":"Discuss strategies that pathogens employ to evade the immune system.","verdict":"skip","justification":"Skip. Pathogen immune evasion mechanisms are microbiology content not directly applicable to prehospital decision-making.|||TAKEAWAY|||Some pathogens evade immunity so well that infection becomes chronic (HIV, TB, herpes viruses). TB reactivation in immunocompromised patients (HIV, TNF-inhibitor use, prolonged steroids) is a real prehospital encounter. Respiratory isolation for suspected active TB during transport is appropriate.|||FIELD|||Active TB: persistent productive cough >3 weeks, night sweats, weight loss, blood-tinged sputum. Risk factors: HIV, immigration from high-prevalence country, homelessness, incarceration. In the Lower Mainland, TB rates in certain immigrant communities are higher than the national average. Respiratory precautions: N95 mask on the patient, maximize ventilation in your vehicle, notify receiving facility before arrival.","modIndex":6,"chIndex":0},{"num":97,"modTitle":"Module 7 | Anatomy and Physiology of the Lymphatic and Immune Systems","chName":"Chapter 17 — Lymphatic and Immune Systems","text":"Discuss disorders of the immune system, including allergies, autoimmune diseases (such as diabetes and multiple sclerosis), and immunodeficiency resulting from conditions such as HIV infection.","verdict":"keep","justification":"Allergic reactions, autoimmune diseases, and immunodeficiency are the three main categories of immune system disorders you'll encounter. Anaphylaxis is the most immediately life-threatening immune disorder you'll manage.|||TAKEAWAY|||<strong>Most important to take away:</strong> Allergies: IgE-mediated hypersensitivity -> mast cell degranulation -> histamine release -> local (urticaria, rhinitis) or systemic (anaphylaxis) response. Anaphylaxis: systemic allergic reaction with hemodynamic compromise (bronchospasm + vasodilation) -> life-threatening. Treatment: epinephrine IM (0.3-0.5mg 1:1000) as first line — not antihistamines, not steroids. Autoimmune patients on immunosuppressants -> increased infection risk.|||FIELD|||Anaphylaxis: epinephrine IM into the outer mid-thigh (anterolateral), not IV unless you have monitoring. BCEHS anaphylaxis protocol: epi first, then IV fluids if hypotensive, then diphenhydramine and ranitidine. A patient who received an EpiPen at home may have had only partial reversal — these patients still need hospital observation for biphasic reaction (second wave 4-8 hours later). Never be reassured by initial improvement alone.","modIndex":6,"chIndex":0},{"num":98,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Summarize the glands that make up the endocrine system, and how hormones act as chemical messengers in the body.","verdict":"keep","justification":"The endocrine system overview — glands, hormones, and feedback loops — is essential for understanding diabetic emergencies, adrenal crisis, thyroid storm, and the hormonal stress response.|||TAKEAWAY|||<strong>Most important to take away:</strong> Endocrine glands: hypothalamus (master regulator), pituitary (master gland), thyroid, parathyroids, adrenal glands, pancreas, gonads, pineal. Hormones travel in blood -> bind specific receptors. Negative feedback maintains hormone homeostasis. Key clinical hormones: cortisol (stress), epinephrine (emergency response), insulin/glucagon (glucose regulation), ADH/aldosterone (fluid balance), thyroid hormones (metabolic rate).|||FIELD|||Patients on long-term steroids have suppressed their own cortisol production — they can't mount the stress response. An Addisonian crisis patient presenting with hypotension, weakness, and abdominal pain who is on steroids needs stress-dose hydrocortisone. BCEHS treatment: hydrocortisone 100mg IM if adrenal crisis suspected and patient is severely ill. These patients carry medical alert bracelets — take them seriously.","modIndex":7,"chIndex":0},{"num":99,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Describe the general types of endocrine system disorders.","verdict":"keep","justification":"Endocrine disorders — hyper/hypothyroidism, Cushing's syndrome, Addison's disease, diabetes — are extremely common and can present as apparent cardiac or neurological emergencies. Recognizing the endocrine etiology changes your management.|||TAKEAWAY|||<strong>Most important to take away:</strong> Hyperthyroidism/thyroid storm: hyperthermia, tachycardia (AF common), hypertension, agitation, diaphoresis — can mimic AMI or sepsis. Hypothyroidism/myxedema coma: hypothermia, bradycardia, hypotension, decreased LOC, edema. Addison's disease: hypotension, hyperkalemia, hyponatremia, hypoglycemia, fatigue. Cushing's syndrome (cortisol excess): hypertension, hyperglycemia, central obesity, moon face, easy bruising.|||FIELD|||A patient with altered LOC, profound hypothermia, bradycardia, and no obvious cause in an elderly woman may be myxedema coma (severe hypothyroidism). Rare but treatable — keep the patient warm, manage airway, transport. A patient with Addison's disease in physiological stress (infection, trauma) may go into crisis — watch for unexplained hypotension in a patient with a steroid prescription or adrenal disease history.","modIndex":7,"chIndex":0},{"num":100,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Name the types of endocrine hormones — including steroid hormones (such as sex hormones) and non-steroid hormones (such as insulin) — and how they affect the functions of their target cells by binding to different types of receptor proteins.","verdict":"skim","justification":"Hormone types — steroid vs. peptide — and their mechanisms of action explain why steroid hormones have slower, longer-lasting effects while peptide hormones act faster. This underpins pharmacology: steroids and peptide-mimicking drugs have different onset and duration profiles.|||TAKEAWAY|||<strong>Most important to take away:</strong> Steroid hormones (cortisol, sex hormones, aldosterone): lipid-soluble -> cross cell membrane -> bind intracellular receptors -> affect gene expression. Slow onset (hours), prolonged effect. Peptide hormones (insulin, glucagon, epinephrine): water-soluble -> bind surface receptors -> second messenger cascade. Fast onset (seconds to minutes), shorter duration. Clinical application: IV hydrocortisone for anaphylaxis or adrenal crisis takes hours to work — it's not the immediate life-saving drug.|||FIELD|||In anaphylaxis: epinephrine (peptide hormone mimetic) acts in minutes — it's the life-saving drug. Hydrocortisone (steroid) is given to prevent the late-phase reaction hours later, not to reverse the acute anaphylaxis. This is why BCEHS protocol is epi first, steroids second. Don't delay epinephrine waiting for an IV to give steroids — the epi goes IM into the thigh immediately.","modIndex":7,"chIndex":0},{"num":101,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Explain how the levels of hormones are regulated mostly through negative, but sometimes through positive, feedback loops.","verdict":"keep","justification":"Negative feedback regulation of hormone levels is the homeostatic mechanism of the endocrine system. Disruption of these feedback loops — by disease or exogenous hormone administration — produces the clinical syndromes of endocrine disease.|||TAKEAWAY|||<strong>Most important to take away:</strong> High cortisol -> inhibits CRH (hypothalamus) and ACTH (pituitary) -> less cortisol production. Exogenous steroids (prednisone, dexamethasone) suppress the hypothalamic-pituitary-adrenal (HPA) axis through negative feedback -> adrenal atrophy -> patient can't respond to physiological stress -> adrenal crisis risk if steroids abruptly stopped or patient becomes severely ill.|||FIELD|||Patients on chronic oral steroids (for COPD, asthma, autoimmune disease, transplant) have suppressed HPA axes. When this patient develops serious illness or trauma, they may need stress-dose steroids (hydrocortisone 100mg IV/IM). Ask every sick patient: 'Do you take any steroids?' Prednisone, dexamethasone, methylprednisolone, hydrocortisone all count. A patient who says 'I take prednisone for my arthritis' may be adrenal-insufficient.","modIndex":7,"chIndex":0},{"num":102,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Describe the hormones involved in the stress response.","verdict":"keep","justification":"The stress response — involving cortisol, epinephrine, and norepinephrine — is the body's acute and chronic adaptation to threat. Understanding it explains why critically ill patients have predictable physiological responses and why prolonged stress is pathological.|||TAKEAWAY|||<strong>Most important to take away:</strong> Acute stress response: hypothalamus -> sympathetic NS + adrenal medulla -> epinephrine/norepinephrine -> HR up, BP up, bronchodilation, glucose mobilization. Cortisol (HPA axis): mobilizes glucose, suppresses inflammation, maintains BP. Prolonged cortisol elevation: immunosuppression, hypertension, hyperglycemia, muscle wasting, impaired healing — this is Cushing's syndrome.|||FIELD|||Your patients in acute distress have fully activated stress responses. Their tachycardia and hypertension are partly the stress response, not purely the pathology. Reassurance and pain management are therefore therapeutic interventions, not just comfort measures. Reducing the stress response reduces myocardial oxygen demand (important in AMI), reduces blood pressure (important in dissection/hemorrhagic stroke), and helps you accurately assess the patient's baseline hemodynamics.","modIndex":7,"chIndex":0},{"num":103,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Identify the location and function of the \"master gland\" of the endocrine system, how it is regulated, and how it controls other parts of the endocrine system through the hormones that it secretes.","verdict":"skim","justification":"The pituitary gland as the master regulator of the endocrine system explains how a single small structure — when it fails — can cause multi-system endocrine collapse. Pituitary apoplexy is a rare but recognizable emergency.|||TAKEAWAY|||<strong>Most important to take away:</strong> Anterior pituitary: produces GH, TSH (-> thyroid), ACTH (-> adrenal cortex), FSH/LH (-> gonads), PRL. Posterior pituitary: releases ADH (-> kidney water retention) and oxytocin. ADH deficiency = diabetes insipidus (massive dilute urine). SIADH (excess ADH) = water retention -> dilutional hyponatremia -> altered LOC, seizures. Pituitary apoplexy: sudden severe headache, visual disturbance, altered LOC — treat as neurosurgical emergency.|||FIELD|||SIADH (syndrome of inappropriate ADH) c
