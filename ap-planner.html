<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARA-1101 A&P Study Planner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0f2d4a;
    --blue: #1a5c8a;
    --mid: #2d88c0;
    --light: #e8f3fb;
    --accent: #d4a853;
    --green: #2a7a4b;
    --green-bg: #edf7f1;
    --green-dark: #1e5c38;
    --amber: #b86c00;
    --amber-bg: #fff8ec;
    --amber-border: #f0c060;
    --red: #b83232;
    --red-bg: #fdf0f0;
    --red-border: #e8a0a0;
    --row-alt: #f7fbff;
    --border: #b8d4ea;
    --text: #1a2535;
    --muted: #6b7f95;
    --white: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #f0f5fa; color: var(--text); min-height: 100vh; font-size: 16px; }

  /* STICKY HEADER */
  .sticky-header {
    position: sticky; top: 0; z-index: 200;
    background: var(--navy);
    box-shadow: 0 4px 20px rgba(15,45,74,0.35);
    width: 100%;
  }
  .header-inner {
    max-width: 1280px; margin: 0 auto;
    padding: 14px 32px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
  }
  .header-title { display: flex; flex-direction: column; justify-content: center; }
  .header-title h1 { font-family: 'DM Serif Display', serif; font-size: 1.45rem; color: white; letter-spacing: 0.02em; }
  .header-title p { font-size: 0.88rem; color: #8ab4d0; margin-top: 2px; font-weight: 300; }

  .header-stats { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }

  .stat-pill {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.13);
    border-radius: 8px; padding: 6px 14px; text-align: center;
  }
  .stat-num { font-family: 'DM Serif Display', serif; font-size: 1.6rem; color: var(--accent); line-height: 1; }
  .stat-label { font-size: 0.65rem; color: #8ab4d0; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2px; }

  .progress-section { min-width: 160px; }
  .progress-label { font-size: 0.65rem; color: #8ab4d0; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 5px; }
  .progress-track { height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--mid), var(--accent)); width: 0%; transition: width 0.4s cubic-bezier(0.4,0,0.2,1); border-radius: 3px; }
  .progress-pct { font-size: 0.72rem; color: #8ab4d0; text-align: right; margin-top: 4px; }

  /* FILTER BAR */
  .filter-bar {
    background: white; border-bottom: 1px solid var(--border);
    position: sticky; top: 68px; z-index: 100;
    box-shadow: 0 2px 8px rgba(15,45,74,0.08);
  }
  @media (max-width: 600px) {
    .filter-bar { top: 0; position: sticky; }
    .sticky-header { position: relative; } /* don't stick on mobile — let filter bar stick at top */
  }
  .filter-inner {
    max-width: 1280px; margin: 0 auto;
    padding: 10px 32px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .filter-label { font-size: 0.88rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-right: 4px; }
  .filter-btn {
    border: none; border-radius: 6px; padding: 6px 16px;
    font-size: 0.9rem; font-family: 'DM Sans', sans-serif; font-weight: 600;
    cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px;
  }
  .filter-btn.all { background: var(--navy); color: white; }
  .filter-btn.keep { background: var(--green-bg); color: var(--green-dark); border: 1px solid #a0d4b8; }
  .filter-btn.skim { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
  .filter-btn.skip { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .filter-btn.done { background: #f0f0f0; color: #666; border: 1px solid #ccc; }
  .filter-btn.active { box-shadow: 0 0 0 2px var(--mid); }
  .filter-btn .count { opacity: 0.7; font-weight: 400; }

  /* CONTAINER */
  .container { max-width: 1280px; margin: 0 auto; padding: 32px 32px 80px; }

  /* MODULE */
  .module { margin-bottom: 44px; }
  .module-heading {
    font-family: 'DM Serif Display', serif; font-size: 1.4rem; color: var(--navy);
    margin-bottom: 18px; padding-bottom: 10px; border-bottom: 3px solid var(--mid);
    display: flex; align-items: center; gap: 12px;
  }
  .mod-tag {
    font-size: 0.68rem; font-family: 'DM Sans', sans-serif; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    background: var(--mid); color: white; padding: 3px 10px; border-radius: 3px; flex-shrink: 0;
  }

  /* CHAPTER BLOCK */
  .chapter-block { margin-bottom: 20px; border-radius: 8px; overflow: visible; box-shadow: 0 2px 10px rgba(15,45,74,0.1); }
  .chapter-header {
    background: var(--blue); color: white;
    padding: 10px 16px; font-family: 'DM Serif Display', serif; font-size: 1rem;
  }

  /* COLUMN HEADER ROW */
  .col-header-row {
    display: grid;
    grid-template-columns: 52px 52px 110px 1fr 130px 160px 90px;
    background: #1a4a6e;
    font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: rgba(255,255,255,0.85);
  }
  .col-header-row > div { padding: 8px 12px; border-right: 1px solid rgba(255,255,255,0.1); }
  .col-header-row > div:last-child { border-right: none; }
  .col-center { text-align: center; }

  /* OBJ ROW */
  .obj-row {
    display: grid;
    grid-template-columns: 52px 52px 110px 1fr 130px 160px 90px;
    border-top: 1px solid var(--border);
    transition: background 0.12s;
  }
  .obj-row:nth-child(even) { background: var(--row-alt); }
  .obj-row:nth-child(odd) { background: white; }
  .obj-row:hover { background: #deeef9; }
  .obj-row.completed { background: var(--green-bg) !important; }
  .obj-row.completed .obj-text-cell { color: var(--muted); }
  .obj-row.hidden { display: none; }

  .obj-row > div {
    padding: 11px 14px;
    font-size: 1rem;
    border-right: 1px solid var(--border);
    display: flex; align-items: center;
  }
  .obj-row > div:last-child { border-right: none; }
  .num-divider { display: none; } /* desktop: hidden, not a grid cell */

  /* NUM cell */
  .num-cell {
    justify-content: center; align-items: center;
    font-weight: 700; font-size: 0.9rem; color: var(--blue);
    background: var(--light) !important;
    flex-shrink: 0;
  }
  .obj-row.completed .num-cell { background: #c8ead8 !important; color: var(--green); }

  /* VERDICT badge */
  .verdict-cell { justify-content: center; align-items: center; }
  .verdict-badge {
    display: inline-block; padding: 3px 8px; border-radius: 4px;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    white-space: nowrap;
  }
  .verdict-keep { background: var(--green-bg); color: var(--green-dark); border: 1px solid #a0d4b8; }
  .verdict-skim { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
  .verdict-skip { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }

  /* OBJ TEXT */
  .obj-text-cell { line-height: 1.5; color: var(--text); }

  /* JUSTIFICATION */
  .just-cell { flex-direction: column; position: relative; justify-content: center; align-items: center; }
  .just-toggle {
    background: var(--light); border: 1px solid var(--border); border-radius: 5px;
    padding: 5px 12px; font-size: 0.84rem; font-weight: 600; color: var(--blue);
    cursor: pointer; white-space: nowrap; font-family: 'DM Sans', sans-serif;
    transition: all 0.15s; width: 100%;
  }
  .just-toggle:hover { background: var(--mid); color: white; border-color: var(--mid); }
  .just-panel {
    display: none; position: fixed; z-index: 500;
    background: white; border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 32px rgba(15,45,74,0.22);
    padding: 18px 20px; width: 520px; max-width: 92vw;
    font-size: 1rem; line-height: 1.75; color: var(--text);
    max-height: 70vh; overflow-y: auto;
  }
  .just-panel.open { display: block; }
  .just-panel strong { color: var(--navy); }
  .just-panel-num {
    display: inline-block;
    font-size: 0.68rem; font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .just-panel-close {
    float: right; background: none; border: none; font-size: 1.1rem;
    cursor: pointer; color: var(--muted); margin: -4px -4px 8px 8px; line-height: 1;
  }
  .just-panel p + p { margin-top: 8px; }

  /* DATE */
  .date-cell input[type="date"] {
    border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px;
    font-size: 0.88rem; font-family: 'DM Sans', sans-serif; color: var(--text);
    background: white; width: 100%; cursor: pointer;
  }
  .date-cell input:focus { outline: none; border-color: var(--mid); box-shadow: 0 0 0 2px rgba(45,136,192,0.18); }


  /* PAGES CELL */
  .pages-cell {
    justify-content: center; align-items: center; flex-direction: column;
    font-size: 0.78rem; font-weight: 600; color: var(--blue);
    text-align: center; line-height: 1.35;
    background: var(--light) !important;
  }
  .obj-row.completed .pages-cell { background: #c8ead8 !important; color: var(--green); }
  .pages-lbl {
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 2px;
  }
  .pages-sec {
    font-size: 0.85rem; font-weight: 800; color: var(--blue);
    letter-spacing: 0.02em; margin-bottom: 2px;
  }
  .obj-row.completed .pages-sec { color: var(--green); }
  /* DONE */
  .done-cell { justify-content: center; align-items: center; }
  .col-done { display: flex; align-items: center; justify-content: center; }
  .check-wrap { position: relative; width: 26px; height: 26px; cursor: pointer; flex-shrink: 0; }
  .check-wrap input[type="checkbox"] { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; margin: 0; }
  .check-box {
    width: 26px; height: 26px; border: 2px solid var(--border); border-radius: 5px;
    background: white; display: flex; align-items: center; justify-content: center; transition: all 0.15s;
    pointer-events: none;
  }
  .check-wrap input:checked ~ .check-box { background: var(--green); border-color: var(--green); }
  .check-wrap input:checked ~ .check-box::after {
    content: ''; display: block; width: 6px; height: 11px;
    border: 2px solid white; border-top: none; border-left: none;
    transform: rotate(45deg) translate(-1px,-1px);
  }
  .check-wrap:hover .check-box { border-color: var(--mid); box-shadow: 0 0 0 3px rgba(45,136,192,0.15); }

  /* ── MODULE COLOUR THEMES ── */
  .module-1  .module-heading .mod-tag { background: #3892cc; }
  .module-1  .module-heading          { border-color: #67ccff; }
  .module-1  .chapter-header          { background: #3892cc; }

  .module-2  .module-heading .mod-tag { background: #29a575; }
  .module-2  .module-heading          { border-color: #4eefad; }
  .module-2  .chapter-header          { background: #29a575; }

  .module-3  .module-heading .mod-tag { background: #9464cc; }
  .module-3  .module-heading          { border-color: #dca2ff; }
  .module-3  .chapter-header          { background: #9464cc; }

  .module-4  .module-heading .mod-tag { background: #e05f13; }
  .module-4  .module-heading          { border-color: #ff923a; }
  .module-4  .chapter-header          { background: #e05f13; }

  .module-5  .module-heading .mod-tag { background: #ea4e4e; }
  .module-5  .module-heading          { border-color: #ff8e88; }
  .module-5  .chapter-header          { background: #ea4e4e; }

  .module-6  .module-heading .mod-tag { background: #81c027; }
  .module-6  .module-heading          { border-color: #ccff4e; }
  .module-6  .chapter-header          { background: #81c027; }

  .module-7  .module-heading .mod-tag { background: #cf407e; }
  .module-7  .module-heading          { border-color: #ff73b7; }
  .module-7  .chapter-header          { background: #cf407e; }

  .module-8  .module-heading .mod-tag { background: #30af9c; }
  .module-8  .module-heading          { border-color: #5ffce0; }
  .module-8  .chapter-header          { background: #30af9c; }

  .module-9  .module-heading .mod-tag { background: #6d70d6; }
  .module-9  .module-heading          { border-color: #afb2ff; }
  .module-9  .chapter-header          { background: #6d70d6; }

  .module-10 .module-heading .mod-tag { background: #cf4e75; }
  .module-10 .module-heading          { border-color: #ff86a5; }
  .module-10 .chapter-header          { background: #cf4e75; }

  .module-11 .module-heading .mod-tag { background: #18afcc; }
  .module-11 .module-heading          { border-color: #30f4ff; }
  .module-11 .chapter-header          { background: #18afcc; }

  .module-1  .col-header-row { background: #2970a8; }
  .module-2  .col-header-row { background: #1e7d59; }
  .module-3  .col-header-row { background: #7048a8; }
  .module-4  .col-header-row { background: #b04a0e; }
  .module-5  .col-header-row { background: #c03a3a; }
  .module-6  .col-header-row { background: #609018; }
  .module-7  .col-header-row { background: #a83060; }
  .module-8  .col-header-row { background: #228a78; }
  .module-9  .col-header-row { background: #5254b0; }
  .module-10 .col-header-row { background: #a83858; }
  .module-11 .col-header-row { background: #1290a8; }

  /* ── TABLET ── */
  @media (max-width: 900px) {
    .col-header-row, .obj-row { grid-template-columns: 44px 44px 90px 1fr 110px 80px 76px; }
    .date-cell { display: none; }
    .just-panel { width: 92vw; }
  }

  /* ── MOBILE ── */
  @media (max-width: 600px) {
    body { font-size: 15px; }

    .header-inner {
      flex-direction: column; align-items: flex-start;
      padding: 12px 16px 10px; gap: 10px;
    }
    .header-title h1 { font-size: 1.1rem; }
    .header-title p { font-size: 0.78rem; }
    .header-stats { width: 100%; justify-content: space-between; }
    .stat-pill { padding: 4px 10px; }
    .stat-num { font-size: 1.3rem; }
    .progress-section { flex: 1; min-width: 0; }

    .sticky-header { position: relative; }
    .filter-bar { top: 0; }
    .filter-inner { padding: 8px 12px; gap: 8px; }
    .filter-label { display: none; }
    .filter-btn { padding: 5px 11px; font-size: 0.82rem; }

    .container { padding: 16px 12px 60px; }
    .module { margin-bottom: 28px; }
    .module-heading { font-size: 1.1rem; gap: 8px; }
    .chapter-header { font-size: 0.9rem; padding: 8px 12px; }
    .chapter-block { border-radius: 6px; }
    .col-header-row { display: none; }

    /* Card layout using CSS order + flex-wrap.
       Visual layout per card:
         [#] | [KEEP badge]          [☐ checkbox]   ← row 1
         Objective text (full width)                 ← row 2
         [Why →]  [date input]                       ← row 3
    */
    .obj-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      padding: 10px 12px 0;
    }

    .obj-row > div {
      border-right: none !important;
      padding: 0 !important;
      font-size: 0.92rem;
    }

    /* Row 1 — number */
    .num-cell {
      order: 1;
      flex: 0 0 auto;
      background: transparent !important;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      padding-right: 0 !important;
      padding-left: 0 !important;
      border-right: none !important;
      align-self: center;
      justify-content: center;
      min-width: 0;
      width: auto;
    }
    .obj-row.completed .num-cell { background: transparent !important; color: var(--green); }

    /* Actual visible divider line between number and badge */
    .num-divider {
      order: 2;
      display: block !important;
      width: 1px;
      height: 16px;
      background-color: #b8d4ea;
      margin: 0 10px;
      flex-shrink: 0;
      align-self: center;
    }

    /* Row 1 — verdict badge */
    .verdict-cell {
      order: 3;
      flex: 0 0 auto;
      padding-left: 0 !important;
      align-self: center;
    }

    /* Row 1 — done checkbox pushed right */
    .done-cell {
      order: 4;
      flex: 0 0 auto;
      margin-left: auto;
      align-self: center;
    }

    /* Row 2 — objective text, full width */
    .obj-text-cell {
      order: 5;
      flex: 0 0 100%;
      padding: 18px 0 18px !important;
      line-height: 1.55;
    }

    /* Row 3 — Why + date wrapper behaviour: centered as a group */
    .just-cell {
      order: 6;
      flex: 0 0 auto;
      padding-bottom: 16px !important;
      padding-top: 0 !important;
      align-self: center;
    }
    .just-toggle { font-size: 0.85rem; padding: 7px 16px; width: auto; }

    /* Row 3 — date input */
    .date-cell {
      order: 7;
      flex: 0 0 auto;
      margin-left: 12px;
      padding-left: 0 !important;
      padding-bottom: 16px !important;
      padding-top: 0 !important;
      display: flex;
      align-self: center;
    }
    .date-cell input[type="date"] { font-size: 0.84rem; width: 160px; padding: 6px 8px; }

    /* Push Why+date group to centre of the row */
    .obj-row .just-cell,
    .obj-row .date-cell {
      margin-top: 0;
    }
    /* Use a pseudo flex trick: spacer before Why and after date to centre the pair */
    .obj-row::before {
      content: '';
      order: 6;
      flex: 1;
    }
    .obj-row::after {
      content: '';
      order: 8;
      flex: 1;
    }

    /* Justification panel: centered modal */
    .just-panel {
      position: fixed;
      left: 8px !important; right: 8px !important;
      top: 50% !important;
      transform: translateY(-50%);
      width: auto !important;
      max-height: 75vh;
      font-size: 0.93rem;
      line-height: 1.65;
      z-index: 9999;
    }
  }


  /* SWITCHER BUTTON */
  .switcher-btn {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.68rem; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 5px; padding: 1px 8px;
    cursor: pointer; text-decoration: none;
    transition: all 0.15s; margin-bottom: 4px;
    white-space: nowrap;
  }
  .switcher-btn:hover {
    background: #c8381a;
    border-color: #c8381a;
    color: white;
  }
  .switcher-btn svg { flex-shrink: 0; }
</style>
</head>
<body>

<div class="sticky-header">
  <div class="header-inner">
    <div class="header-title">
      <a class="switcher-btn" href="pcp-planner.html"><svg width="11" height="11" viewBox="0 0 11 11" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 5.5h9M6.5 2 10 5.5 6.5 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>→ PCP Planner</a>
      <h1>PARA-1101 &mdash; Anatomy &amp; Physiology</h1>
      <p>Self-Study Planner &nbsp;&middot;&nbsp; Primary Care Paramedic Program &nbsp;&middot;&nbsp; Based on EMALB &amp; BCEHS CPGs</p>
    </div>
    <div class="header-stats">
      <div class="stat-pill">
        <div class="stat-num" id="doneCount">0</div>
        <div class="stat-label">Complete</div>
      </div>
      <div class="stat-pill">
        <div class="stat-num" style="color:#8ab4d0">143</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="progress-section">
        <div class="progress-label">Overall Progress</div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-pct" id="progressPct">0%</div>
      </div>
    </div>
  </div>
</div>

<div class="filter-bar">
  <div class="filter-inner">
    <span class="filter-label">Filter:</span>
    <button class="filter-btn all active" data-filter="all">All <span class="count">(143)</span></button>
    <button class="filter-btn keep" data-filter="keep">✅ Keep <span class="count">(84)</span></button>
    <button class="filter-btn skim" data-filter="skim">⚪ Skim <span class="count">(26)</span></button>
    <button class="filter-btn skip" data-filter="skip">❌ Skip <span class="count">(33)</span></button>
    <button class="filter-btn done" data-filter="done">☑ Done</button>
  </div>
</div>

<div class="container" id="mainContent"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";

const data = [{"num":1,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 2 — Biology: The Study of Life","text":"Define homeostasis.","verdict":"keep","justification":"Homeostasis is the foundational concept that everything else in this course builds on. Every organ system, every intervention in prehospital care, every vital sign abnormality you'll encounter can be framed as either a failure of homeostasis or the body's attempt to restore it. This is the lens through which a clinician thinks.|||TAKEAWAY|||Homeostasis = the body's continuous, dynamic process of maintaining a stable internal environment (temperature, pH, blood glucose, fluid balance) despite external changes. It is not a fixed state — it is an active, ongoing process. Every vital sign you measure is a snapshot of whether homeostasis is being maintained.|||FIELD|||Every call you run — whether it's a hypoglycemic patient, a septic elder, or a drowning — is fundamentally a homeostasis failure. When you assess a patient, you're asking: what system has lost its ability to self-regulate, and how far has it drifted from normal? This framing is what separates a thinking clinician from someone just following a protocol.","modIndex":0,"chIndex":0},{"num":2,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 2 — Biology: The Study of Life","text":"Describe positive and negative feedback loop mechanisms and provide an example of each.","verdict":"keep","justification":"Feedback loops are the mechanism of homeostasis. Negative feedback is the dominant system — it explains compensated vs. decompensated shock, why the body raises heart rate when BP drops, and why a diabetic patient's glucose spirals without insulin. Positive feedback loops explain a few specific high-acuity events.|||TAKEAWAY|||Negative feedback: a change triggers a response that reverses the change (e.g., rising BP -> baroreceptors -> decreased HR). Normal physiology maintaining balance. Positive feedback: a change triggers a response that amplifies the change (e.g., childbirth contractions, blood clotting, fever spiraling in sepsis). Positive feedback is self-reinforcing and requires intervention to break.|||FIELD|||Compensated shock is your patient's negative feedback loop working — HR up, vasoconstriction up, trying to maintain perfusion pressure. Decompensated shock is when those mechanisms fail. When your hypovolemic patient's BP finally drops, the negative feedback has been overwhelmed. Intervene while the body is still compensating.","modIndex":0,"chIndex":0},{"num":3,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 3 — Biological Molecules","text":"Define the nature of chemical substances, including elements, compounds, and their component atoms and molecules.","verdict":"skip","justification":"Skip. Elements, compounds, and atomic theory are general chemistry with no direct prehospital application at EMR/PCP scope.|||TAKEAWAY|||One concept worth retaining: electrolytes (Na+, K+, Ca2+, Cl-) are ions — atoms carrying a charge. Their charge allows them to conduct electrical signals in nerve and muscle tissue. That is the only chemical concept from this section that carries forward.|||FIELD|||You'll hear 'electrolyte imbalance' frequently at ALS handoffs. In practice: sodium governs fluid shifts, potassium governs cardiac rhythm, calcium governs muscle contraction. You don't need the chemistry — you need to know why dysrhythmias, weakness, and altered LOC can all trace back to electrolyte disturbance.","modIndex":0,"chIndex":1},{"num":4,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 3 — Biological Molecules","text":"Identify the structures and functions of biochemical compounds, including carbohydrates, lipids, proteins, and nucleic acids (such as DNA and RNA).","verdict":"skim","justification":"You don't need deep biochemistry, but the four macromolecule categories come up constantly — glucose as fuel, proteins as structural and enzymatic components, lipids in cell membranes and atherosclerosis, nucleic acids in genetics. Skim structures; focus on clinical roles.|||TAKEAWAY|||<strong>Most important to take away:</strong> Carbohydrates (glucose) = primary cellular fuel. Proteins = enzymes, antibodies, clotting factors, albumin. Lipids = cell membranes, hormones, atherosclerotic plaques. Nucleic acids = genetic code. In clinical practice, glucose and proteins (clotting factors, albumin) are most directly relevant.|||FIELD|||Oral glucose for a hypoglycemic patient restores carbohydrate substrate to glucose-starved neurons. A trauma patient who can't clot may have dilution or consumption of clotting proteins. A patient with chronic alcohol use and altered LOC — low albumin means third-spacing. These are the real-world biochemistry moments.","modIndex":0,"chIndex":1},{"num":5,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 3 — Biological Molecules","text":"Understand what chemical reactions are, how energy is involved in chemical reactions, how enzymes assist in chemical reactions, and some types of biochemical reactions in living organisms.","verdict":"skip","justification":"Skip. Activation energy, catalysts, endothermic vs. exothermic reactions are not tested in the PCP curriculum and don't appear in BCEHS clinical decision tools.|||TAKEAWAY|||One practical concept: enzymes are biological catalysts that speed up reactions. When enzymes are released into the bloodstream (troponin, lipase, LDH), it indicates cell damage. That is the clinical relevance.|||FIELD|||Troponin elevation in an AMI patient means cardiac muscle cells have been damaged and leaked their contents. You won't order troponin in the field but the receiving team will. Elevated enzymes = cell death is enough context to understand why the ED is moving fast on your chest pain patient.","modIndex":0,"chIndex":1},{"num":6,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 3 — Biological Molecules","text":"Summarize the properties of water and the importance of water for most biochemical processes.","verdict":"skip","justification":"Skip. Detailed water chemistry (hydrogen bonding, specific heat) is not required for prehospital practice. Clinical relevance of water is covered better under fluid balance objectives later.|||TAKEAWAY|||Clinically relevant properties of water: (1) solvent for all physiological processes, (2) blood is ~92% water by volume, (3) high heat capacity — relevant to thermoregulation, (4) incompressible — relevant to why cerebral edema increases ICP.|||FIELD|||Burn fluid resuscitation is essentially replacing water lost through the damaged skin barrier. In head injury, the brain sits in a rigid skull full of incompressible fluid — small increases in brain water content rapidly increase ICP. These are the clinically actionable concepts from water chemistry.","modIndex":0,"chIndex":1},{"num":7,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 3 — Biological Molecules","text":"Define pH, acids, and bases, and why maintaining a proper pH in the body is important for biochemical reactions.","verdict":"keep","justification":"pH is directly testable and directly applicable. You will encounter acidosis and alkalosis from DKA, hypoventilation, sepsis, and overdose — understanding why pH shifts matter is essential for interpreting patient presentation and anticipating deterioration.|||TAKEAWAY|||<strong>Most important to take away:</strong> Normal blood pH: 7.35-7.45. Below 7.35 = acidosis; above 7.45 = alkalosis. Acidosis depresses cardiac and neurological function — at pH below 7.2, myocardial contractility falls, dysrhythmias increase, LOC deteriorates. Body buffers via bicarbonate (kidneys), CO2 (lungs), and intracellular buffers. Respiratory compensation is fast (seconds); renal compensation is slow (hours to days).|||FIELD|||DKA patients are profoundly acidotic — burning fat produces ketone bodies that drop blood pH. Their deep rapid Kussmaul breathing is compensation: blowing off CO2 to raise pH. Recognize that pattern as compensation, not distress. In cardiac arrest, effective CPR matters partly because poor perfusion = lactic acidosis, which further depresses cardiac function.","modIndex":0,"chIndex":1},{"num":8,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 4 — Cells","text":"Describe the importance of size and shape to the functions of cells.","verdict":"skip","justification":"Skip. Cell size/shape relationships (surface area to volume ratios) are cell biology without prehospital clinical application.|||TAKEAWAY|||Not applicable to prehospital scope.|||FIELD|||No direct field application.","modIndex":0,"chIndex":2},{"num":9,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 4 — Cells","text":"Compare and contrast between eukaryotic cells (such as those in humans and other animals) and prokaryotic cells (such as bacteria).","verdict":"skip","justification":"Skip. Prokaryote vs. eukaryote distinctions are microbiology content not required at PCP scope.|||TAKEAWAY|||One practical point: bacteria are prokaryotes with different cellular machinery than human cells — this is why antibiotics can target bacteria without killing human cells. Bacterial infections are mechanistically distinct from viral infections, which is why patients take different medications for each.|||FIELD|||When your patient with a wound infection is on amoxicillin, it targets bacterial cell wall synthesis — a structure human cells lack. When a patient looks septic, the bacteria have overwhelmed the body's containment. That is the field relevance: recognizing infection severity, not the cell biology.","modIndex":0,"chIndex":2},{"num":10,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 4 — Cells","text":"Outline the structures and functions of cell parts, including the plasma membrane, cytoplasm, cytoskeleton, nucleus, ribosomes, Golgi apparatus, endoplasmic reticulum, mitochondria, vesicles, and vacuoles.","verdict":"skim","justification":"The book covers about ten organelles in detail. Most are irrelevant. The two you should understand: <strong>Mitochondria:</strong> The energy producers of the cell, converting glucose to ATP through aerobic respiration. When cells are deprived of oxygen (hypoxia, shock), mitochondria switch to anaerobic respiration, which is far less efficient and produces lactic acid. Lactic acid = metabolic acidosis. This is the biochemical explanation for why shocked patients become acidotic. Your PCP partner will be interpreting lactate levels at handoff. <strong>Plasma membrane:</strong> Selectively permeable, controls what enters and leaves the cell. This sets up the passive/active transport objectives below. Everything else (Golgi apparatus, ribosomes, endoplasmic reticulum) — skim the names but don't spend time on them.|||TAKEAWAY|||Mitochondria produce ATP via aerobic respiration. No oxygen = anaerobic respiration = lactic acid = metabolic acidosis. Plasma membrane is selectively permeable = controls cellular transport. These two organelles have direct clinical relevance; the rest do not.|||FIELD|||In a shocked patient, poor perfusion means cells are running on anaerobic metabolism. Lactic acid builds up — measurable at hospital as serum lactate, a marker of shock severity. Your job in the field: restore perfusion (fluids, positioning, hemorrhage control) so the mitochondria can return to aerobic metabolism.","modIndex":0,"chIndex":2},{"num":11,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 4 — Cells","text":"Explain the processes of passive and active transport to move substances into and out of cells, and how these processes help maintain homeostasis.","verdict":"keep","justification":"The book explains these clearly with diagrams. Three types of passive transport matter clinically: <strong>Osmosis</strong> — water moves across membranes from low solute concentration to high. This is the mechanism behind IV fluid selection (isotonic saline doesn't cause cells to swell or shrink), cerebral edema (cells swell when surrounding fluid becomes hypotonic), and why you don't give pure water IV. <strong>Diffusion</strong> — oxygen and CO2 move across the alveolar-capillary membrane by simple diffusion down concentration gradients. This is gas exchange. <strong>Sodium-potassium pump (active transport)</strong> — maintains the electrical gradient across nerve and muscle cell membranes. When it fails (due to ischemia), cells depolarize inappropriately. Relevant to cardiac dysrhythmias in electrolyte disturbances.|||TAKEAWAY|||Osmosis: water moves toward higher solute concentration. Isotonic fluids (0.9% NaCl, LR) don't shift water into or out of cells. Hypotonic fluids cause cells to swell; hypertonic causes shrinkage. Diffusion: O2 and CO2 move passively down concentration gradients across the alveolar-capillary membrane. Na-K pump: requires ATP, maintains resting membrane potential — critical for nerve and cardiac conduction.|||FIELD|||IV fluid selection is based on osmosis. Isotonic saline stays in the vascular space without shifting fluid into brain cells. Giving pure water IV would cause cells to swell via osmosis — including brain cells — causing cerebral edema. This is why BCEHS protocols specify fluid type and volume: wrong fluid = wrong osmotic effect.","modIndex":0,"chIndex":2},{"num":12,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 4 — Cells","text":"Understand how organisms obtain the energy needed for life, including how the sugar glucose is broken down to produce ATP through the processes of anaerobic and aerobic cellular respiration.","verdict":"keep","justification":"Cellular respiration — cells converting glucose and oxygen into ATP — is the biochemical foundation of why oxygen delivery matters. Aerobic respiration is ~18x more efficient than anaerobic. This is why oxygen is the single most important intervention in prehospital care for undifferentiated critically ill patients.|||TAKEAWAY|||<strong>Most important to take away:</strong> Aerobic respiration: glucose + O2 -> ~30-32 ATP + CO2 + H2O. Requires oxygen. Anaerobic respiration: glucose -> 2 ATP + lactic acid. No oxygen required but produces lactic acid. The body switches to anaerobic whenever O2 delivery is inadequate — hypoxia, poor perfusion, respiratory failure. Anaerobic metabolism is unsustainable; lactic acid accumulates and pH drops.|||FIELD|||High-flow O2 for a hypoxic patient restores aerobic respiration to cells that still have viable mitochondria. CPR exists to maintain minimal aerobic metabolism to the heart and brain during cardiac arrest. Effective compressions = O2 delivery to cells = aerobic metabolism = chance of ROSC.","modIndex":0,"chIndex":2},{"num":13,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 4 — Cells","text":"Identify the phases of the cell cycle, how cells divide through mitosis, and how cancer (neoplasms) can result from unregulated cell division.","verdict":"skip","justification":"Skip. The cell cycle, mitosis, and cytokinesis have no direct application to prehospital clinical decision-making.|||TAKEAWAY|||One peripheral relevance: uncontrolled cell division = cancer. Chemotherapy drugs target rapidly dividing cells — which also affects bone marrow (anemia, immunosuppression), hair follicles, and GI mucosa. Cancer treatment = immunosuppression = higher infection risk.|||FIELD|||A patient on chemotherapy presenting with fever and altered LOC is a sepsis red flag — chemo has damaged their bone marrow's ability to make white blood cells. You don't need to know mitosis; you need to recognize that cancer treatment = immunosuppression.","modIndex":0,"chIndex":2},{"num":14,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 5 — Genetics","text":"Compare and contrast the structure of DNA and RNA.","verdict":"skip","justification":"Skip. DNA vs. RNA structure is molecular biology with no direct prehospital application.|||TAKEAWAY|||DNA is the genetic blueprint stored in every cell nucleus. RNA carries instructions from DNA to ribosomes. Clinically relevant only for understanding HIV antiretroviral therapy and mRNA vaccines — not required at PCP level.|||FIELD|||HIV is an RNA virus that uses reverse transcriptase to convert its RNA into DNA and integrate into host cells. Antiretroviral therapy blocks this. Treatment is lifelong because the virus hides in host DNA. You don't need the mechanism, but knowing HIV is incurable-but-controllable shapes your patient interaction.","modIndex":0,"chIndex":3},{"num":15,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 5 — Genetics","text":"Describe how DNA replication occurs.","verdict":"skip","justification":"Skip. DNA replication mechanisms have no direct prehospital application.|||TAKEAWAY|||Not applicable. Skip.|||FIELD|||No direct field application.","modIndex":0,"chIndex":3},{"num":16,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 5 — Genetics","text":"Define genes and alleles and how they are located on chromosomes.","verdict":"skip","justification":"Skip. Gene/allele/chromosome location theory is genetics education content, not prehospital clinical content.|||TAKEAWAY|||One carry-forward: genetic conditions predispose patients to disease. Family history of early MI, sudden cardiac death, or bleeding disorders (hemophilia) is relevant to your patient assessment. Family history = genetic risk factor in clinical use.|||FIELD|||Asking a chest pain patient about family history of heart disease is you applying genetics to prehospital assessment. A 45-year-old with a father who died of MI at 50 has a significant genetic risk factor. You're not doing genetics — you're using family history as a clinical data point.","modIndex":0,"chIndex":3},{"num":17,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 5 — Genetics","text":"Outline how many pairs of human chromosomes there are and differentiate between autosomal and sex chromosomes.","verdict":"skip","justification":"Skip. Chromosome pair counts and sex chromosome distinctions are background science, not clinical content.|||TAKEAWAY|||Chromosomal abnormalities may appear in patient history. Down syndrome (trisomy 21): cardiac defects, atlantoaxial instability (C1-C2 joint — be careful with cervical manipulation), intellectual disability affecting communication. Turner syndrome (XO): short stature, cardiac anomalies.|||FIELD|||Patients with Down syndrome often have atlantoaxial instability — their C1-C2 joint is hypermobile. Be cautious with cervical spine manipulation and adjust your communication style. Adjust your communication for intellectual disability: speak clearly, use simple language, involve caregivers, and be patient.","modIndex":0,"chIndex":3},{"num":18,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 5 — Genetics","text":"Define meiosis and how this contributes to gamete (eggs and sperm) production.","verdict":"skip","justification":"Skip. Meiosis mechanics and gamete production are reproductive cell biology with no direct prehospital relevance.|||TAKEAWAY|||Not applicable. Skip.|||FIELD|||No direct field application.","modIndex":0,"chIndex":3},{"num":19,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 5 — Genetics","text":"Understand Mendelian inheritance and pedigree.","verdict":"skip","justification":"Skip. Mendelian inheritance and pedigree analysis are genetics education content.|||TAKEAWAY|||Not applicable. Skip.|||FIELD|||No direct field application.","modIndex":0,"chIndex":3},{"num":20,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 5 — Genetics","text":"Define and differentiate between autosomal traits and sex-linked traits.","verdict":"skip","justification":"Skip. Autosomal vs. sex-linked trait theory is genetics content without prehospital application.|||TAKEAWAY|||One carry-forward: haemophilia A and B are X-linked recessive — they affect males almost exclusively. A male patient with unexplained or disproportionate bleeding should prompt a question about haemophilia history.|||FIELD|||A young male trauma patient with unusual bleeding despite apparently minor injury — consider haemophilia. Ask about bleeding history and current factor replacement therapy. BCEHS hemorrhage control protocols apply; what changes is your urgency for transport and your handoff communication.","modIndex":0,"chIndex":3},{"num":21,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 5 — Genetics","text":"Predict inheritance patterns using a Punnett square.","verdict":"skip","justification":"Skip. Punnett squares are a teaching tool for predicting inheritance ratios, not clinical content.|||TAKEAWAY|||Not applicable. Skip.|||FIELD|||No direct field application.","modIndex":0,"chIndex":3},{"num":22,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 7 — Introduction to the Human Body","text":"Outline the organization of the body from atoms and molecules up through cells, tissues, organs, and organ systems.","verdict":"keep","justification":"Understanding body organization from cell to tissue to organ to system to organism gives you the framework to localize pathology. When you know a patient's liver is failing, you know it's an organ-level problem that will affect multiple systems (coagulation, detoxification, metabolism). This hierarchical thinking is essential for pattern recognition.|||TAKEAWAY|||<strong>Most important to take away:</strong> Organization hierarchy: atoms -> molecules -> organelles -> cells -> tissues -> organs -> organ systems -> organism. The four tissue types: epithelial (covering/lining), connective (support/transport — includes blood), muscle (contraction), nervous (signal transmission). Organ systems don't work in isolation — failure at one level cascades upward.|||FIELD|||Liver failure doesn't just affect the liver. It affects coagulation (clotting factors are made in the liver), detoxification (toxins accumulate — hepatic encephalopathy), fluid balance (low albumin = third-spacing = ascites and peripheral edema), and drug metabolism (medications last longer). Your yellow-tinged, confused, swollen patient with alcohol use history has an organ-level problem that has cascaded to multiple systems.","modIndex":0,"chIndex":4},{"num":23,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 7 — Introduction to the Human Body","text":"Describe how organ systems work together to carry out the functions of life.","verdict":"keep","justification":"Organ systems interact constantly — the cardiovascular system delivers oxygen from the respiratory system to tissues, while the nervous system regulates both. Understanding these interactions allows you to predict how one system's failure will affect others — the foundation of pattern recognition in sick patients.|||TAKEAWAY|||<strong>Most important to take away:</strong> No organ system works in isolation. Key cross-system interactions for EMS: cardiovascular + respiratory (gas exchange and O2 delivery), nervous + cardiovascular (autonomic regulation of HR and BP), endocrine + cardiovascular (epinephrine, cortisol in stress response), renal + cardiovascular (fluid volume and BP regulation). When one system fails, compensatory changes appear in others.|||FIELD|||Septic shock illustrates cross-system failure: bacteria trigger the immune system -> massive vasodilation (cardiovascular) -> hypotension -> tachycardia (cardiovascular compensation) -> poor renal perfusion -> AKI (renal) -> metabolic acidosis -> altered breathing (respiratory compensation) -> altered LOC (neurological). Your patient looks cardiovascular but the origin was immunological. System interaction thinking lets you read the whole picture.","modIndex":0,"chIndex":4},{"num":24,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 7 — Introduction to the Human Body","text":"Understand the variety of different specialized cell types in humans, the four major types of human tissues, and some of their functions.","verdict":"skim","justification":"The four tissue types explain how different body structures respond to injury and heal. Skim the detail; focus on functional implications. Connective tissue (including blood) is the most clinically relevant category for prehospital practice.|||TAKEAWAY|||<strong>Most important to take away:</strong> Epithelial tissue: covers surfaces and lines cavities — damaged in burns, wounds, GI injury. Connective tissue: broadest category — bone, cartilage, fat, blood, loose connective tissue. Muscle tissue: skeletal (voluntary), cardiac (involuntary, striated), smooth (involuntary, visceral). Nervous tissue: neurons + neuroglia — essentially no regenerative capacity in the CNS.|||FIELD|||CNS nervous tissue doesn't regenerate — this is why spinal cord injury causes permanent deficits and why time-to-treatment in stroke is so critical. Every minute of ischemia means more neurons die, and those neurons cannot be replaced. 'Time is brain' is the clinical expression of this tissue-level fact.","modIndex":0,"chIndex":4},{"num":25,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 7 — Introduction to the Human Body","text":"Identify the five vital organs and the 11 major organ systems of the human body.","verdict":"keep","justification":"The five vital organs and eleven organ systems are the structural map you'll reference throughout your career. Every patient assessment is organized around organ systems. Knowing what the vital organs are — and why loss of any one means death — frames your clinical priorities.|||TAKEAWAY|||<strong>Most important to take away:</strong> Five vital organs: brain, heart, lungs, kidneys, liver. Loss of any = death without intervention. The 11 organ systems: integumentary, skeletal, muscular, nervous, endocrine, cardiovascular, lymphatic/immune, respiratory, digestive, urinary, reproductive. In prehospital practice, the nervous, cardiovascular, and respiratory systems are your primary assessment targets because acute failure in any is immediately life-threatening.|||FIELD|||Your primary survey (ABCDE or CABCDE) is an organ system scan: airway/breathing = respiratory, circulation = cardiovascular, disability = nervous system, exposure = integumentary and other. When you find a problem, you're identifying an organ system in failure. Prioritization follows from which vital organ is most at risk.","modIndex":0,"chIndex":4},{"num":26,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 7 — Introduction to the Human Body","text":"Identify body cavities and the organs they hold and protect.","verdict":"keep","justification":"Body cavities and the organs they protect are directly relevant to trauma assessment. Knowing which organs are in the thoracic cavity (heart, lungs) vs. abdominal cavity (liver, spleen, GI tract) vs. pelvic cavity (bladder, reproductive organs) tells you what's at risk based on mechanism and injury location.|||TAKEAWAY|||<strong>Most important to take away:</strong> Dorsal cavities: cranial (brain) and spinal (spinal cord) — bony protection, high-stakes injury. Ventral cavities: thoracic (heart, lungs, great vessels) separated from abdominopelvic by the diaphragm. Abdominal: liver, spleen, stomach, intestines — solid organs bleed; hollow organs spill. Pelvic: bladder, reproductive organs, rectum — pelvic fractures can cause massive hemorrhage here.|||FIELD|||Pelvic fractures in high-mechanism trauma are a major hemorrhage threat — the pelvic cavity can hold several litres of blood before obvious external signs. A patient with a pelvic fracture and unexplained hypotension may be bleeding into the pelvic space. BCEHS TCCC protocol includes pelvic binding for suspected pelvic fracture. Cavity anatomy tells you where the blood is going.","modIndex":0,"chIndex":4},{"num":27,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 7 — Introduction to the Human Body","text":"Identify the tissues and fluid that protect the brain and spinal cord.","verdict":"keep","justification":"The meninges, CSF, and blood-brain barrier are essential for understanding head injury, meningitis, and why certain drugs cross into the CNS and others don't. This directly informs your TBI assessment and why bacterial meningitis is a high-priority transfer.|||TAKEAWAY|||<strong>Most important to take away:</strong> Three meningeal layers: dura mater (outermost, tough), arachnoid mater (middle), pia mater (innermost, adheres to brain). CSF circulates in the subarachnoid space, produced by choroid plexus. Epidural hematoma: arterial bleeding between skull and dura (middle meningeal artery) — classic lucid interval. Subdural hematoma: venous bleeding between dura and arachnoid — slower, often in elderly. Meningitis: infection of the meninges.|||FIELD|||An elderly patient who fell, had a brief LOC, seemed fine, then deteriorates hours later — classic epidural hematoma (lucid interval). Arterial bleeding fills the epidural space fast and compresses the brain. ALS intercept and immediate transport. Meningitis signs (fever, stiff neck, photophobia, petechial rash) = CNS infection — high-priority transport and respiratory precautions for you.","modIndex":0,"chIndex":4},{"num":28,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 7 — Introduction to the Human Body","text":"Describe how organ systems communicate and interact in body processes, such as cellular respiration, digestion, the fight-or-flight response to stressors, and physical activities (such as sports).","verdict":"keep","justification":"The nervous and endocrine systems are the two master regulatory systems. Understanding how they communicate with organ systems explains compensatory responses in shock, the stress response, and why drugs targeting these systems (vasopressors, atropine, beta blockers) have the effects they do.|||TAKEAWAY|||<strong>Most important to take away:</strong> Nervous system: fast, electrical, via neurotransmitters. Endocrine: slow, chemical, via hormones in bloodstream. Autonomic NS: sympathetic (fight-or-flight — HR up, BP up, bronchodilation, vasoconstriction) vs. parasympathetic (rest-and-digest — HR down, increased GI motility). Both interact with the cardiovascular system constantly.|||FIELD|||Epinephrine is the body's own sympathetic agonist. When you give exogenous epi in anaphylaxis or cardiac arrest, you're amplifying the sympathetic response: HR up, BP up, bronchodilation, vasoconstriction. Atropine blocks parasympathetic (vagal) input to the heart — that's why it increases HR in bradycardia. The autonomic system tells you what every cardiac drug is doing mechanistically.","modIndex":0,"chIndex":4},{"num":29,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 7 — Introduction to the Human Body","text":"Explain and integrate how homeostasis is maintained to keep the body in a relatively steady state, and the problems that can be caused by loss of homeostasis, such as diabetes.","verdict":"keep","justification":"This objective ties the whole module together — homeostasis maintained by organ system interaction through feedback loops. It is the conceptual framework you will apply on every call.|||TAKEAWAY|||<strong>Most important to take away:</strong> The body maintains homeostasis through negative feedback loops involving sensors (detect change), control centres (nervous/endocrine), and effectors (organs that respond). Baroreceptors detect BP drop -> brainstem -> HR increase + vasoconstriction. Blood glucose drops -> pancreas -> glucagon released -> liver releases glucose. When these systems are overwhelmed, homeostasis fails and clinical deterioration occurs.|||FIELD|||Every vital sign abnormality is a signal that homeostasis is being challenged or has failed. Tachycardia isn't the problem — it's the compensation. Hypotension means the compensatory mechanisms have been exhausted. Your job: support failing homeostatic mechanisms with interventions (oxygen, fluids, positioning, medications) while getting the patient to definitive care.","modIndex":0,"chIndex":4},{"num":30,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Lecture — Anatomical Position & Directional Terms","text":"Describe the anatomical position.","verdict":"keep","justification":"Anatomical position and directional terminology is the language of clinical communication. Every report to a receiving physician, every handoff, every trauma assessment uses these terms. Getting them wrong creates dangerous miscommunication about injury location.|||TAKEAWAY|||<strong>Most important to take away:</strong> Anatomical position: standing, facing forward, palms forward. Directional terms: superior/inferior (above/below), anterior/posterior (front/back), medial/lateral (toward/away from midline), proximal/distal (toward/away from attachment point), superficial/deep. Body planes: sagittal (left/right), frontal/coronal (front/back), transverse (upper/lower).|||FIELD|||When you say 'laceration on the lateral aspect of the left distal forearm,' the receiving physician knows exactly where it is. When you document 'posterior chest pain radiating to the anterior chest,' that's specific and reproducible. BCEHS documentation and handoff reports use anatomical terminology — fluency in it makes your communication precise and professional.","modIndex":0,"chIndex":5},{"num":31,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Lecture — Anatomical Position & Directional Terms","text":"Outline principal directional terms and body planes used in describing the body and how this relates to body parts.","verdict":"keep","justification":"Directional terms and body planes are the vocabulary of anatomy and physical exam. You need these fluently to communicate about injury locations, describe physical findings, and understand anatomical descriptions in protocols and clinical resources.|||TAKEAWAY|||<strong>Most important to take away:</strong> These terms must be automatic. Additional terms: ipsilateral (same side), contralateral (opposite side — critical for neurological deficits: left brain injury causes right-sided deficits). Bilateral = both sides. Unilateral = one side.|||FIELD|||A patient with a right-sided stroke will have contralateral (left-sided) motor and sensory deficits because motor pathways cross in the brainstem. When you tell the hospital 'left arm and leg weakness with right facial droop,' you're communicating a specific neurological pattern that localizes the lesion to the right hemisphere. Anatomical language makes that possible.","modIndex":0,"chIndex":5},{"num":32,"modTitle":"Module 2 | Anatomy and Physiology of the Integumentary System","chName":"Chapter 10 — Integumentary System","text":"Describe the functions of the organs of the integumentary system (the skin, hair, and nails).","verdict":"keep","justification":"The integumentary system — skin, hair, nails, sweat and sebaceous glands — is your first line of clinical information. Skin tells you about perfusion (colour, temperature, moisture), oxygenation (cyanosis), systemic disease (jaundice, pallor), and injury. You assess it on every patient.|||TAKEAWAY|||<strong>Most important to take away:</strong> Skin functions: protection (physical barrier), thermoregulation (sweating, vasodilation/vasoconstriction), sensation, vitamin D synthesis, immune defence. Prehospital skin signs: pale/cool/diaphoretic = sympathetic activation/shock; cyanotic = hypoxia; flushed/warm = fever or vasodilation; jaundiced = liver dysfunction; mottled = poor perfusion.|||FIELD|||Skin assessment is instant and requires no equipment. Pale, cool, diaphoretic skin = sympathetic activation — the patient is compensating for something (pain, blood loss, cardiac event). Cyanotic = hypoxic. Warm, flushed, dry = possible distributive shock (sepsis, anaphylaxis) or hyperthermia. Your eyes and hands on the patient's skin give you immediate hemodynamic data.","modIndex":1,"chIndex":0},{"num":33,"modTitle":"Module 2 | Anatomy and Physiology of the Integumentary System","chName":"Chapter 10 — Integumentary System","text":"Define the two main layers of the skin.","verdict":"keep","justification":"The dermis and epidermis distinction matters for burn depth assessment and wound healing. Partial-thickness burns are painful (dermis nerve endings intact) while full-thickness burns are painless (nerve endings destroyed). This clinical distinction guides burn classification and transport decisions.|||TAKEAWAY|||<strong>Most important to take away:</strong> Epidermis: outermost, avascular, protective. Dermis: deeper layer, contains blood vessels, nerve endings, hair follicles, sweat/sebaceous glands. Subcutaneous layer: fat and connective tissue, insulation and energy storage. Burn depth: superficial (epidermis only) = red, painful. Partial thickness (into dermis) = blistering, very painful. Full thickness (through entire dermis) = waxy/leathery, painless.|||FIELD|||A patient with partial-thickness burns is in significant pain because dermis nerve endings are intact. A patient with full-thickness burns reporting less pain in the burned area is a red flag, not reassurance. BCEHS burn protocol uses rule of nines and depth to determine transport destination. Burns involving face, airway, hands, feet, genitalia, or circumferential burns are high-priority regardless of percentage.","modIndex":1,"chIndex":0},{"num":34,"modTitle":"Module 2 | Anatomy and Physiology of the Integumentary System","chName":"Chapter 10 — Integumentary System","text":"Identify the cells and layers of the epidermis and their functions.","verdict":"skim","justification":"The book describes five epidermal layers. The clinical value is limited. The practical takeaway: burns that destroy the deepest layer (stratum basale, where new cells are produced) cannot self-heal and require grafting. Skip the individual layer names.|||TAKEAWAY|||The stratum basale is the deepest epidermal layer — it contains the stem cells that regenerate the epidermis. Burns or injuries that destroy it cannot self-heal and require skin grafting. Partial-thickness burns that preserve the stratum basale can heal on their own.|||FIELD|||When you describe a burn as 'full thickness' at handoff, you're communicating that the entire epidermis including the stratum basale has been destroyed — no self-healing possible. This patient needs a burn centre for grafting. Accurate burn classification at the scene directly affects the transport destination decision.","modIndex":1,"chIndex":0},{"num":35,"modTitle":"Module 2 | Anatomy and Physiology of the Integumentary System","chName":"Chapter 10 — Integumentary System","text":"Outline the composition of epidermal cells and how the epidermis grows.","verdict":"skip","justification":"Skip. Detailed epidermal cell composition (keratinocytes, melanocytes, Langerhans cells) is histology content without prehospital application.|||TAKEAWAY|||Melanocytes produce melanin — the pigment that gives skin colour and provides UV protection. Melanoma (malignant melanocyte tumour) is the most dangerous skin cancer. ABCDEs of melanoma: Asymmetry, Border irregularity, Colour variation, Diameter >6mm, Evolution (changing over time).|||FIELD|||You may encounter concerning skin lesions during assessment. Flagging one at handoff ('patient has a rapidly changing pigmented lesion — may warrant follow-up') is good practice. Skin cancer is the most common cancer in Canada. You have access to patients who may not otherwise see a physician — early detection matters.","modIndex":1,"chIndex":0},{"num":36,"modTitle":"Module 2 | Anatomy and Physiology of the Integumentary System","chName":"Chapter 10 — Integumentary System","text":"Identify the composition and layers of the dermis and their functions.","verdict":"skim","justification":"The dermis is where the action is clinically — blood vessels, nerve endings, sweat glands, sebaceous glands. Understanding dermal structures explains why partial-thickness burns hurt so much, why breached skin becomes an infection entry point, and how wound healing progresses.|||TAKEAWAY|||<strong>Most important to take away:</strong> Dermis contains: blood vessels (thermoregulation, wound healing), sensory nerve endings (pain, touch, temperature), hair follicles, eccrine sweat glands (temperature regulation), apocrine sweat glands (stress response, axilla/groin), sebaceous glands (sebum, lubrication). Collagen fibres give skin its strength — loss in aging leads to fragile skin in elderly patients.|||FIELD|||Elderly patients have thin, fragile dermis with reduced collagen — their skin tears easily and heals slowly. Minor trauma can cause significant lacerations in patients on anticoagulants. When you see a thin-skinned, easily bruised elderly patient, their integumentary system is compromised. Be gentle during assessment, expect wounds to look worse than the mechanism suggests, and document skin condition carefully at handoff.","modIndex":1,"chIndex":0},{"num":37,"modTitle":"Module 2 | Anatomy and Physiology of the Integumentary System","chName":"Chapter 10 — Integumentary System","text":"Outline the specialized structures in the dermis, which include sweat and sebaceous (oil) glands, hair follicles, and sensory receptors that detect touch, temperature, and pain.","verdict":"skim","justification":"Sweat glands and sebaceous glands have direct clinical relevance in thermoregulation and infection. Diaphoresis is a sympathetic nervous system sign you will assess on every patient.|||TAKEAWAY|||<strong>Most important to take away:</strong> Eccrine sweat glands: entire body surface, thermoregulation. Diaphoresis (excessive sweating) = sympathetic activation — seen in AMI, shock, severe pain, anxiety, hypoglycemia. Sebaceous glands: produce sebum, associated with hair follicles — blockage + infection = abscess. Once skin is breached (laceration, burn, IV site), pathogen entry is possible.|||FIELD|||Diaphoresis is one of the most important skin signs in prehospital care. Chest pain AND diaphoresis = much higher probability of AMI — the diaphoresis indicates sympathetic activation from a serious physiological threat. Absence of diaphoresis doesn't rule out AMI, but its presence significantly raises suspicion. BCEHS STEMI protocol is activated based on clinical presentation including diaphoresis.","modIndex":1,"chIndex":0},{"num":38,"modTitle":"Module 2 | Anatomy and Physiology of the Integumentary System","chName":"Chapter 10 — Integumentary System","text":"Describe the structure and functions of nails, which includes protecting the fingers and toes, enhancing the detection of sensory stimuli, and acting as tools.","verdict":"skip","justification":"Skip. Nail structure and protective function have limited prehospital relevance beyond assessment findings.|||TAKEAWAY|||Nails can indicate systemic disease: clubbing (chronic hypoxia — COPD, cyanotic heart disease), koilonychia/spoon nails (iron deficiency anemia), Terry's nails (liver failure), Mees' lines (heavy metal poisoning).|||FIELD|||Nail clubbing in a breathless patient suggests chronic hypoxia — this isn't their first respiratory event and they likely have significant underlying disease. Communicate nail findings at handoff when relevant — they indicate chronicity.","modIndex":1,"chIndex":0},{"num":39,"modTitle":"Module 2 | Anatomy and Physiology of the Integumentary System","chName":"Chapter 10 — Integumentary System","text":"Describe how nails grow and how they can reflect and affect our health.","verdict":"skip","justification":"Skip. Nail growth mechanisms have no prehospital application.|||TAKEAWAY|||Not applicable. Skip.|||FIELD|||No direct field application.","modIndex":1,"chIndex":0},{"num":40,"modTitle":"Module 2 | Anatomy and Physiology of the Integumentary System","chName":"Chapter 10 — Integumentary System","text":"Describe causes and detection of skin cancer (neoplasms) and outline the 3 most common types of skin cancer.","verdict":"skip","justification":"Skip. Detailed pathophysiology of basal cell, squamous cell, and melanoma skin cancers is dermatology content. However, recognizing suspicious skin lesions and flagging them at handoff is within your scope as a clinician.|||TAKEAWAY|||ABCDEs of melanoma: Asymmetry, Border irregularity, Colour variation, Diameter >6mm, Evolution. Basal cell carcinoma: most common, rarely metastasizes, pearly appearance. Squamous cell: second most common, can metastasize, scaly/red lesion. Melanoma: least common but most dangerous.|||FIELD|||A patient presenting for an unrelated complaint who has a suspicious pigmented lesion is an incidental finding — document it and mention it at handoff. You're not diagnosing cancer, but flagging it may prompt follow-up that saves a life. You have access to patients who may not otherwise see a physician.","modIndex":1,"chIndex":0},{"num":41,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 11 — Skeletal System","text":"Outline the components of the skeletal system, which includes bones, ligaments, and cartilage.","verdict":"keep","justification":"The skeletal system provides the structural framework your trauma assessment is built around. Knowing the components and their functions explains fracture patterns, joint injuries, and why certain injuries are immediately life-threatening.|||TAKEAWAY|||<strong>Most important to take away:</strong> Components: 206 bones, cartilage (joint surfaces, tracheal rings), ligaments (bone to bone), tendons (muscle to bone). Functions: support, protection (cranium=brain, ribs/sternum=heart/lungs, vertebral column=spinal cord), movement, mineral storage (Ca2+ and phosphorus reservoir), hematopoiesis (red bone marrow produces RBCs, WBCs, platelets).|||FIELD|||Rib fractures compromise the thoracic cage's protective function — multiple rib fractures (flail chest) disrupt the mechanics of breathing. A femur fracture can hold 1-1.5L of blood in the thigh. A pelvic fracture can hold even more. BCEHS trauma protocols account for these — traction splints and pelvic binding address skeletal injuries that threaten life through hemorrhage or ventilation failure.","modIndex":2,"chIndex":0},{"num":42,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 11 — Skeletal System","text":"Identify and describe the functions of the skeletal system.","verdict":"keep","justification":"Knowing the functions of the skeletal system explains why certain injuries are systemic events, not just local ones. A long bone fracture isn't just painful — it causes fat embolism risk and significant blood loss potential.|||TAKEAWAY|||<strong>Most important to take away:</strong> Skeletal functions critical for prehospital: (1) Protection — skull/spine/thoracic cage protect vital organs; breach = organ at risk. (2) Hematopoiesis — red marrow produces blood cells; bone marrow disease impairs blood cell production. (3) Calcium storage — bone releases Ca2+ into blood when needed; essential for muscle contraction (including cardiac) and coagulation.|||FIELD|||A tension pneumothorax is a rib/pleural injury that disrupted the thoracic cage's protective seal — lung collapses, mediastinum shifts, cardiac output drops. Absent breath sounds, tracheal deviation, hypotension, JVD. The skeletal injury is the entry point for a rapidly fatal condition. Recognizing chest injuries early by mechanism and physical findings is the application of thoracic cage anatomy.","modIndex":2,"chIndex":0},{"num":43,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 11 — Skeletal System","text":"Explain the organization and functions of the two main divisions of the skeletal system: the axial skeletal system and the appendicular skeletal system.","verdict":"keep","justification":"The axial vs. appendicular skeleton distinction matters for trauma pattern recognition. Axial injuries (skull, spine, ribs, sternum) are immediately life-threatening because they put vital organs at risk. Appendicular injuries (limbs) cause hemorrhage and pain but are less immediately fatal.|||TAKEAWAY|||<strong>Most important to take away:</strong> Axial skeleton: skull, vertebral column (C/T/L/S/coccyx), ribs, sternum — protects CNS and thoracic organs. Appendicular: upper/lower limbs, pectoral girdle, pelvic girdle — movement. Axial injuries = higher immediate mortality. C-spine injury + airway management conflict is the most important axial challenge in prehospital care.|||FIELD|||In high-mechanism trauma you simultaneously manage the airway while protecting the cervical spine. C-spine precautions vs. airway patency — this tension is central to BCEHS trauma protocol. Injury at C3-C5 can disrupt the phrenic nerve (C3-C5 keeps the diaphragm alive), causing respiratory failure. Airway takes priority over c-spine, but use the least manipulation possible.","modIndex":2,"chIndex":0},{"num":44,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 11 — Skeletal System","text":"Describe the tissues and cells that make up bones, along with their specific functions, which include making new bone, breaking down bone, producing blood cells, and regulating mineral homeostasis.","verdict":"skim","justification":"Bone tissue types and bone cells explain fracture patterns, healing timelines, and why osteoporosis increases fracture risk. Skim the cellular detail; focus on clinical implications.|||TAKEAWAY|||<strong>Most important to take away:</strong> Compact bone: outer dense layer, provides strength. Spongy (cancellous) bone: inner lattice, contains red marrow. Periosteum: outer bone membrane — highly innervated (why fractures hurt so much) and vascular. Osteoblasts (build bone), osteoclasts (break down bone), osteocytes (maintain bone). Osteoporosis: osteoclast activity exceeds osteoblast activity -> decreased bone density -> fragility fractures.|||FIELD|||An elderly patient with osteoporosis can fracture a hip from a low-energy mechanism — standing up from a chair. The fracture may precede the fall, not result from it. Hip fractures in the elderly carry significant mortality from immobility, blood loss, and surgical complications. Pain management (BCEHS analgesia protocol) and efficient transport are your priorities.","modIndex":2,"chIndex":0},{"num":45,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 11 — Skeletal System","text":"Identify and label the different types of bones in the skeletal system, based on shape and location.","verdict":"skim","justification":"Bone classification by shape helps you understand fracture types and clinical implications. Long bone fractures have different hemorrhage implications than flat bone fractures.|||TAKEAWAY|||<strong>Most important to take away:</strong> Long bones (femur, humerus, tibia): medullary cavity, prone to shaft fractures with significant hemorrhage risk. Flat bones (skull, scapula, ribs, sternum): protect organs, fractures can injure underlying structures. Irregular bones (vertebrae, facial bones): vertebral fractures threaten spinal cord. Sesamoid bones (patella): embedded in tendons.|||FIELD|||A femur fracture (long bone) can cause 1-1.5L blood loss into the thigh — enough for hemorrhagic shock. A traction splint is specifically designed for mid-shaft femur fractures to reduce the fracture space and limit hemorrhage. Skull fractures (flat bone) may be associated with underlying brain injury or epidural/subdural hematoma. The bone fracture tells you what vital structure might be at risk.","modIndex":2,"chIndex":0},{"num":46,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 11 — Skeletal System","text":"Explain how bones grow, remodel, and repair themselves.","verdict":"skip","justification":"Skip. Bone growth plates, remodeling, and fracture healing timelines are orthopedic science content, not prehospital clinical content.|||TAKEAWAY|||Clinically relevant: growth plates (epiphyseal plates) in pediatric patients haven't fused yet and are weaker than ligaments. In children, growth plate fractures (Salter-Harris) are more common than ligamentous injuries — an apparent sprain in a child may actually be a growth plate fracture. Treat with higher suspicion and immobilize.|||FIELD|||A child with 'ankle sprain' after a fall may actually have a Salter-Harris fracture through the growth plate. Growth plate fractures look subtle on X-ray and are often initially missed. Your job is to immobilize, manage pain, and transport for imaging. Don't dismiss pediatric extremity injuries as just sprains.","modIndex":2,"chIndex":0},{"num":47,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 11 — Skeletal System","text":"Outline the different types of joints between bones, where they are located, and the ways in which they allow different types of movement, depending on their structure.","verdict":"keep","justification":"Joint types and their injury patterns are directly relevant to trauma assessment. Some dislocations are limb-threatening — posterior hip dislocation compresses the sciatic nerve, knee dislocation injures the popliteal artery.|||TAKEAWAY|||<strong>Most important to take away:</strong> Joint types: fibrous (immovable — skull sutures), cartilaginous (slightly movable — pubic symphysis, intervertebral discs), synovial (freely movable — most limb joints, contain synovial fluid and articular cartilage). Joint dislocation = bones displaced from normal articulation. Always do a neurovascular check (distal pulse, sensation, motor) before and after any immobilization.|||FIELD|||Shoulder dislocation is the most common major joint dislocation you'll encounter. Check axillary nerve function (sensation over deltoid region) and radial pulse. BCEHS protocols: immobilize in position of comfort and transport rather than field reduction. Posterior hip dislocations from dashboard injuries are emergent — sciatic nerve compression causes permanent neurological deficit if not reduced promptly at hospital.","modIndex":2,"chIndex":0},{"num":48,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 11 — Skeletal System","text":"Discuss the causes, risk factors, and treatments for the two most common disorders of the skeletal system — osteoporosis and osteoarthritis.","verdict":"keep","justification":"Osteoarthritis and osteoporosis are the two most common skeletal disorders in the Canadian population — you will encounter them on almost every geriatric call.|||TAKEAWAY|||<strong>Most important to take away:</strong> Osteoarthritis (OA): degenerative joint disease — articular cartilage breaks down, bone-on-bone contact, pain with movement. Affects knees, hips, spine, hands. Chronic pain baseline means analgesia needs may be higher. Osteoporosis: loss of bone density -> fragility fractures. Risk factors: post-menopausal women, prolonged steroids, calcium/vitamin D deficiency. Hip fracture = most serious complication.|||FIELD|||Your typical elderly fall patient often has both OA and osteoporosis. Baseline OA pain makes pain assessment harder. Osteoporotic bones mean a minor fall may have caused a fracture. Immobilize suspected fractures, manage pain per BCEHS analgesia protocol (older patients may require less opioid due to altered drug metabolism), and transport efficiently. A hip fracture in a 78-year-old is a high-mortality injury.","modIndex":2,"chIndex":0},{"num":49,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 12 — Muscular System","text":"Compare and contrast the different types of muscle tissue — skeletal, cardiac, and smooth muscle — and their different characteristics and functions.","verdict":"keep","justification":"The three muscle types explain why different muscles behave differently in disease and injury. Cardiac muscle's automaticity means it generates its own rhythm. Smooth muscle's involuntary control explains why airway bronchospasm can occur without conscious control.|||TAKEAWAY|||<strong>Most important to take away:</strong> Skeletal muscle: voluntary, striated, multinucleated, attached to bones, fatigues quickly. Cardiac muscle: involuntary, striated, intercalated discs allow coordinated contraction, autorhythmicity — does not fatigue under normal conditions. Smooth muscle: involuntary, non-striated, found in hollow organs (airway, blood vessels, GI tract, bladder), responds to autonomic NS and hormones. Only cardiac muscle has automaticity.|||FIELD|||Bronchospasm in asthma is smooth muscle in bronchial walls contracting involuntarily — the patient can't consciously relax it. Salbutamol works by stimulating beta-2 receptors on bronchial smooth muscle to relax it. Atrial fibrillation is cardiac muscle cells firing chaotically — the intercalated discs that normally synchronize contraction are overwhelmed by ectopic foci. Drug treatment targets the electrical properties of cardiac muscle.","modIndex":2,"chIndex":1},{"num":50,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskel
