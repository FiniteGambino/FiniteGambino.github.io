auses hyponatremia — common in pneumonia, CNS disease, certain medications (SSRIs, carbamazepine), and some cancers. Severe hyponatremia (<125 mmol/L) causes altered LOC and seizures. Rapid correction causes osmotic demyelination syndrome — so hospital management is slow and careful. Your role: recognize the altered LOC, get the history (medications, cancer history), transport. Don't give hypotonic fluids.","modIndex":7,"chIndex":0},{"num":104,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Outline the structure, function, regulation, and hormones associated with the thyroid and parathyroid glands and how metabolism and calcium homeostasis is maintained.","verdict":"keep","justification":"The thyroid gland regulates metabolic rate, heart rate, and calcium. Thyroid emergencies present as extreme ends of the metabolic spectrum and are recognizable by the combination of hemodynamic and metabolic signs.|||TAKEAWAY|||<strong>Most important to take away:</strong> Thyroid hormones (T3, T4): increase metabolic rate, HR, cardiac output, temperature. Hyperthyroidism: tachycardia, hypertension, weight loss, heat intolerance, fine tremor, exophthalmos. Thyroid storm: extreme hyperthyroidism + trigger (infection, surgery) -> hyperthermia, tachyarrhythmia (AF), heart failure — life-threatening. Hypothyroidism: bradycardia, cold intolerance, weight gain, fatigue, myxedema (non-pitting edema). Myxedema coma: extreme hypothyroidism -> hypothermia, bradycardia, hypotension, altered LOC.|||FIELD|||Thyroid storm: hyperthermia, tachycardia or AF, altered LOC, and known hyperthyroidism history. These patients can develop high-output cardiac failure. Hospital management involves beta-blockers, thionamides, and iodine — your role is recognition, supportive care, and urgent transport. Myxedema coma: elderly hypothyroid woman in winter, found collapsed, bradycardic and hypothermic. Keep warm, manage airway, transport.","modIndex":7,"chIndex":0},{"num":105,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Discuss disorders of the thyroid and parathyroid glands (such as hyperthyroidism, hypothyroidism, hypercalcemia, and hypocalcemia).","verdict":"keep","justification":"Thyroid and parathyroid disorders are extremely common — hypothyroidism affects up to 10% of women over 60. You will encounter patients with these conditions on nearly every shift.|||TAKEAWAY|||<strong>Most important to take away:</strong> Hyperthyroidism: most commonly Graves' disease (autoimmune). Hypothyroidism: most commonly Hashimoto's thyroiditis (autoimmune), also post-thyroid surgery/ablation. Hyperparathyroidism: excess PTH -> hypercalcemia -> 'bones, stones, groans, thrones' (fractures, kidney stones, abdominal pain, polyuria). Hypoparathyroidism (often post-thyroidectomy): low PTH -> hypocalcemia -> tetany, seizures, prolonged QT.|||FIELD|||Post-thyroidectomy hypocalcemia: parathyroid glands can be accidentally removed or devascularized during thyroid surgery. The patient (often a woman recovering from thyroid cancer surgery) develops perioral tingling, hand/foot cramping, muscle twitching, and cardiac dysrhythmias. Positive Chvostek's sign (facial muscle twitch when tapping facial nerve). Hospital treatment: IV calcium gluconate. If you see a patient with recent thyroid surgery and these symptoms, transport urgently.","modIndex":7,"chIndex":0},{"num":106,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Outline the structure, function, regulation, and hormones of the adrenal glands, and how processes such as metabolism, electrolyte balance, responses to stress, and basic reproductive functions are regulated.","verdict":"keep","justification":"The adrenal glands produce cortisol, aldosterone, and catecholamines — essential for the stress response, fluid balance, and vascular tone. Adrenal emergencies are rare but recognizable and treatable.|||TAKEAWAY|||<strong>Most important to take away:</strong> Adrenal cortex: zona glomerulosa (aldosterone — Na/K balance), zona fasciculata (cortisol — stress response), zona reticularis (sex hormones). Adrenal medulla: epinephrine + norepinephrine (fight-or-flight). Addison's disease: adrenal cortex failure -> low cortisol + low aldosterone -> hypotension, hyponatremia, hyperkalemia, hypoglycemia, fatigue, hyperpigmentation. Pheochromocytoma: catecholamine-secreting adrenal tumour -> episodic severe hypertension, tachycardia, headache, diaphoresis.|||FIELD|||Pheochromocytoma ('pheo') presents with paroxysmal episodes of severe hypertension (SBP may exceed 200), tachycardia, severe headache, and diaphoresis — can mimic panic attack or MI. Episodes can be triggered by physical pressure on the abdomen, stress, or certain medications. Pheo hypertensive crisis can cause stroke, MI, or aortic dissection. If your patient has recurrent unexplained hypertensive crises without a cardiac diagnosis, pheo belongs in the differential.","modIndex":7,"chIndex":0},{"num":107,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Discuss disorders of the adrenal glands that can occur when there are problems in adrenal hormone regulation, such as Cushing's syndrome and Addison's disease.","verdict":"keep","justification":"Addison's disease and Cushing's syndrome are important to recognize because Addisonian crisis is a medical emergency and Cushing's is a common complication of widespread steroid use in the community.|||TAKEAWAY|||<strong>Most important to take away:</strong> Addisonian crisis (acute adrenal insufficiency): triggered by physiological stress in a patient with Addison's or on chronic steroids. Signs: refractory hypotension, hyponatremia, hyperkalemia, hypoglycemia, fever, altered LOC. Treatment: hydrocortisone 100mg IV/IM + IV fluids. Cushing's syndrome (cortisol excess): central obesity, moon face, buffalo hump, easy bruising, thin skin, hyperglycemia, hypertension, osteoporosis — usually from chronic steroid medication.|||FIELD|||A patient on long-term prednisone who develops vomiting and diarrhea and becomes hypotensive is in adrenal crisis — they can't absorb their oral steroids and can't produce cortisol endogenously. BCEHS treatment: hydrocortisone 100mg IM if adrenal crisis suspected. Addisonian patients often carry a medical alert bracelet and an emergency hydrocortisone injection kit. These patients can deteriorate to cardiac arrest from hypoglycemia and hyperkalemia.","modIndex":7,"chIndex":0},{"num":108,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Outline the structure, function, regulation, and hormones of the endocrine pancreas, how blood glucose levels are regulated through insulin and glucagon.","verdict":"keep","justification":"Pancreatic endocrine function and glucose regulation are among the most important clinical topics in prehospital medicine. Hypoglycemia is common, rapidly reversible, and can mimic stroke. DKA is a major metabolic emergency.|||TAKEAWAY|||<strong>Most important to take away:</strong> Insulin (beta cells): lowers blood glucose by promoting cellular uptake and storage. Glucagon (alpha cells): raises blood glucose by stimulating liver glycogenolysis. Normal BG: 4.0-7.0 mmol/L fasting. Hypoglycemia (<4.0 mmol/L, symptomatic often <3.0): altered LOC, diaphoresis, tachycardia, tremor, seizures. Treatment: oral glucose if conscious, IV dextrose or IM glucagon if unconscious. DKA: insulin deficiency -> fat metabolism -> ketone bodies -> metabolic acidosis + hyperglycemia + dehydration.|||FIELD|||Hypoglycemia is a diagnostic trap — it mimics stroke, intoxication, seizure, and psychiatric crisis. Every altered LOC patient gets a blood glucose check. A BG of 2.1 mmol/L in a 'possible stroke' patient means treat the hypoglycemia first; if neuro symptoms resolve, the stroke diagnosis is much less likely. BCEHS hypoglycemia protocol: oral glucose for conscious patients, IV dextrose (D50W or D10W) for unconscious, IM glucagon if no IV access. Recheck BG 15 minutes after treatment.","modIndex":7,"chIndex":0},{"num":109,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Explain disorders of the pancreas and its endocrine hormones, including diabetes.","verdict":"keep","justification":"Diabetes mellitus and its complications affect a massive portion of the Canadian population. Diabetic complications are among the most common prehospital presentations.|||TAKEAWAY|||<strong>Most important to take away:</strong> Type 1 DM: autoimmune beta cell destruction -> absolute insulin deficiency -> prone to DKA. Type 2 DM: insulin resistance + relative deficiency -> more common (90% of cases) -> prone to HHS and hypoglycemia from medications. DKA: BG >11 mmol/L + ketones + acidosis -> hyperglycemia, dehydration, Kussmaul breathing, altered LOC. HHS (Hyperosmolar Hyperglycemic State): extreme hyperglycemia (often >33 mmol/L), severe dehydration, no significant ketoacidosis, profound altered LOC — more common in elderly type 2.|||FIELD|||DKA vs. HHS at the scene: DKA typically has younger patient, type 1, Kussmaul breathing, fruity/ketotic breath, moderate BG (14-30 mmol/L). HHS typically has elderly type 2 patient, very high BG (often >33 mmol/L), profound dehydration, severe altered LOC, no significant ketosis. Both need IV fluids and hospital urgently. BCEHS DKA protocol: fluid resuscitation with normal saline, glucose monitoring, transport. A BG >20 mmol/L with altered LOC = urgent transport regardless of type.","modIndex":7,"chIndex":0},{"num":110,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Chapter 16 — Excretory System","text":"Understand the organs of the excretory system — including the skin, liver, large intestine, lungs, and kidneys (renal) that eliminate waste and excess water from the body (with a focus on the kidneys), and discuss how wastes are eliminated through sweat, feces, urine, and exhaled gases.","verdict":"keep","justification":"The excretory system removes metabolic waste products. When multiple excretory organs fail simultaneously (as in septic shock or multi-organ failure), waste product accumulation causes the encephalopathy, dysrhythmias, and coagulopathy you'll encounter in critical patients.|||TAKEAWAY|||<strong>Most important to take away:</strong> Excretory organs and their waste products: kidneys (urea, creatinine, electrolytes, drugs), lungs (CO2), liver (bilirubin, drug metabolites), skin (small amounts of urea in sweat), large intestine (solid waste). Renal failure: urea accumulation -> uremia -> encephalopathy, pericarditis. Liver failure: ammonia accumulation -> hepatic encephalopathy. CO2 retention: respiratory acidosis -> neurological depression.|||FIELD|||A dialysis patient who has missed multiple sessions will have accumulated urea (uremia), potassium (hyperkalemia), and fluid (volume overload). They may present with altered LOC, dysrhythmias, and pulmonary edema simultaneously. Manage the presenting emergency (airway, breathing, circulation), identify the dialysis history, and transport urgently with early notification — the hospital will mobilize nephrology for emergent dialysis.","modIndex":8,"chIndex":0},{"num":111,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Chapter 16 — Excretory System","text":"Outline the anatomy of the renal system, which includes the kidneys, ureters, bladder, and urethra and explain the main function of the renal system.","verdict":"keep","justification":"Renal anatomy underpins your assessment of urological and renal emergencies. Flank pain from ureteral colic, hematuria from kidney trauma, and urinary retention are all anatomically based presentations.|||TAKEAWAY|||<strong>Most important to take away:</strong> Kidneys: retroperitoneal, protected by lower ribs posteriorly. Ureter: 25-30cm, courses over psoas muscle. Most ureteral stones get stuck at 3 points: ureteropelvic junction, pelvic brim, ureterovesical junction (most narrow). Bladder: retroperitoneal when empty, rises into abdomen when full. Urethra: male (longer, more tortuous) vs. female (shorter, more prone to UTI).|||FIELD|||Flank pain radiating to the groin with hematuria = renal/ureteral colic until proven otherwise. The pain is visceral, colicky, severe, and the patient writhes and changes positions constantly (as opposed to peritoneal pain from appendicitis, where the patient lies still). BCEHS renal colic management: analgesia (ketorolac or morphine per protocol), IV access, transport. Urinary retention (unable to void, distended painful bladder) = transport for catheterization.","modIndex":8,"chIndex":0},{"num":112,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Chapter 16 — Excretory System","text":"Outline the structure and function of the glomerulus and nephron.","verdict":"skim","justification":"The nephron and glomerular filtration explain how the kidney maintains fluid and electrolyte balance, and how this fails in renal disease. Understanding filtration, reabsorption, and secretion explains how diuretics work and why renal failure causes the electrolyte abnormalities it does.|||TAKEAWAY|||<strong>Most important to take away:</strong> Glomerulus: capillary tuft where filtration occurs. GFR: normal ~125 mL/min. Tubule reabsorption: glucose, amino acids, Na+, water reabsorbed in proximal tubule, Loop of Henle, distal tubule. Loop diuretics (furosemide): block Na-K-2Cl transporter in Loop of Henle -> less Na reabsorption -> less water reabsorption -> diuresis. Creatinine freely filtered and not reabsorbed -> serum creatinine reflects GFR (creatinine up = GFR down = renal failure).|||FIELD|||Furosemide (Lasix) is one of the most prescribed drugs in the heart failure patients you'll encounter. It works at the Loop of Henle to promote diuresis, reducing fluid overload and pulmonary edema. When a patient says 'I forgot my water pill,' they're describing furosemide. In acute pulmonary edema, IV furosemide provides both diuresis and venodilation — BCEHS protocol includes it as an option when available. Watch for hypokalemia in chronic furosemide users.","modIndex":8,"chIndex":0},{"num":113,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Chapter 16 — Excretory System","text":"Explain the renin-angiotensin-aldosterone system (RAAS) and aldosterone, and how these feedback systems relate to homeostasis, renal blood flow, and urine output.","verdict":"keep","justification":"The RAAS is one of the most clinically important physiological regulatory systems. It's the mechanism behind hypertension treatment (ACE inhibitors, ARBs), the reason kidney disease causes hypertension, and the explanation for ACE inhibitor-induced angioedema.|||TAKEAWAY|||<strong>Most important to take away:</strong> RAAS cascade: low BP -> kidney releases renin -> angiotensin I -> ACE converts to angiotensin II -> vasoconstriction + aldosterone release -> Na/water retention + K excretion -> increased BP. ACE inhibitors (lisinopril, ramipril): block ACE -> less angiotensin II -> vasodilation. ACE inhibitor side effect: bradykinin accumulation -> ACE inhibitor-induced angioedema (swelling of face, lips, tongue, throat — airway emergency). ARBs (losartan) block angiotensin II receptor — same BP effect without bradykinin issue.|||FIELD|||ACE inhibitor angioedema is an airway emergency. A patient on lisinopril with rapidly progressive facial and throat swelling — this is bradykinin-mediated, not allergic. It doesn't respond well to epinephrine, antihistamines, or steroids (unlike allergic angioedema). The airway can close rapidly and unpredictably. BCEHS management: high-flow O2, prepare for airway intervention, transport immediately, ALS intercept if available. Ask about ACE inhibitor use in any patient with unexplained facial swelling.","modIndex":8,"chIndex":0},{"num":114,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Chapter 16 — Excretory System","text":"Identify renal blood flow to and within the kidneys, how the kidneys filter the blood, retain necessary substances, produce urine, and help maintain homeostasis (such as proper ion and water balance).","verdict":"keep","justification":"Renal blood flow and the kidney's filtration function explain why shock causes acute kidney injury and why adequate resuscitation protects the kidneys. The kidney is exquisitely sensitive to perfusion pressure.|||TAKEAWAY|||<strong>Most important to take away:</strong> Renal blood flow: 20-25% of cardiac output (~1.2L/min). Kidneys autoregulate blood flow between MAP 70-170 mmHg. Below MAP ~70: autoregulation fails -> reduced GFR -> AKI. Prolonged hypotension -> ischemic acute tubular necrosis (ATN) -> oliguria -> anuria. AKI stages: prerenal (low flow, reversible with resuscitation), intrarenal (tubular damage), postrenal (obstruction). Prerenal AKI: most common prehospital — treat by restoring perfusion.|||FIELD|||Post-cardiac arrest care includes avoiding hypotension (MAP >65 mmHg target) — partly to protect the kidneys. A patient resuscitated from cardiac arrest with prolonged downtime will have had significant renal ischemia. Your role: restore and maintain adequate perfusion pressure with IV fluids and positioning. The kidneys are a marker organ — oliguria in an ICU patient means the resuscitation is inadequate. In the field, dialysis access and fluid overload tell you the kidneys are already compromised.","modIndex":8,"chIndex":0},{"num":115,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Chapter 16 — Excretory System","text":"Describe how urine is stored, transported, and released from the body.","verdict":"skim","justification":"Urine storage and transport are relevant for urological emergencies: urinary retention, hematuria, urethral injuries in trauma, and bladder injuries in pelvic fractures.|||TAKEAWAY|||<strong>Most important to take away:</strong> Bladder stores 300-500mL comfortably, up to 1000mL. Detrusor muscle contracts to void; internal and external urethral sphincters control continence. Urinary retention causes: BPH (benign prostatic hyperplasia), urethral stricture, anticholinergic/opioid medications, neurogenic bladder (spinal cord injury). Autonomic dysreflexia in SCI above T6: hypertensive crisis triggered by full bladder or bowel — identify and relieve cause immediately.|||FIELD|||Patients with spinal cord injuries above T10-T12 may have neurogenic bladder and self-catheterize at home. If they present with autonomic dysreflexia (hypertensive crisis, flushing above injury level, headache, bradycardia) — the trigger is often a full bladder or kinked catheter. Identify and relieve the cause immediately. Autonomic dysreflexia above T6 can cause life-threatening hypertension. This is a BCEHS spinal cord injury complication you need to recognize and act on.","modIndex":8,"chIndex":0},{"num":116,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Chapter 16 — Excretory System","text":"Discuss disorders of the renal system, including bladder infections, kidney stones, polycystic kidney disease, urinary incontinence, and kidney damage (acute kidney injury and chronic kidney injury).","verdict":"keep","justification":"Renal disorders — AKI, CKD, UTIs, kidney stones — are extremely prevalent in your patient population. Dialysis patients are among your most frequent critical calls.|||TAKEAWAY|||<strong>Most important to take away:</strong> AKI: sudden decrease in GFR — prerenal (most common, treat with fluids), intrarenal (ATN, glomerulonephritis), postrenal (obstruction). CKD complications: hypertension, anemia (EPO deficiency), hyperkalemia, metabolic acidosis, fluid overload. ESRD: requires dialysis or transplant. UTI: cystitis (lower) vs. pyelonephritis (upper — fever, flank pain, systemic illness). Kidney stones: ureteral colic, hematuria.|||FIELD|||Dialysis patients are high-frequency EMS users. Common calls: missed dialysis -> hyperkalemia + fluid overload + uremic symptoms; hypotension during/after dialysis; fistula site complications; infection. Key assessment points: when did they last dialyze? What is their dry weight? Is their AV fistula patent? (A bruit over the fistula = patent; no bruit = clotted = emergency for the fistula). These patients have multiple competing problems — prioritize the most immediately life-threatening.","modIndex":8,"chIndex":0},{"num":117,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Lecture — Fluid Balance and Acid-Base","text":"Define isotonic, hypotonic, and hypertonic states for fluid balance in the body and give an example of each.","verdict":"keep","justification":"Isotonic, hypotonic, and hypertonic fluid states directly determine your IV fluid selection in the field. Giving the wrong fluid type doesn't just fail to help — it can actively harm the patient.|||TAKEAWAY|||<strong>Most important to take away:</strong> Isotonic: fluid has same osmolarity as plasma (~285-295 mOsm/L). IV isotonic fluids (0.9% NaCl, LR): stay in extracellular space, don't cause net water shift into or out of cells. Hypotonic (e.g., D5W after glucose is metabolized): water moves into cells -> cells swell -> cerebral edema risk. Hypertonic (e.g., 3% NaCl): draws water out of cells -> used to treat cerebral edema in TBI but can cause cellular dehydration. Normal saline (0.9% NaCl) is isotonic and is the most common IV fluid in prehospital practice.|||FIELD|||BCEHS fluid resuscitation: normal saline (0.9% NaCl) or Lactated Ringer's (LR) for most patients. LR is slightly more physiological and preferred for large-volume resuscitation in many BCEHS protocols (large volumes of normal saline cause hyperchloremic metabolic acidosis). In TBI: avoid hypotonic fluids (worsen cerebral edema), use isotonic or hypertonic. In hemorrhagic shock: blood products are ideal, isotonic crystalloids as a bridge.","modIndex":8,"chIndex":1},{"num":118,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Lecture — Fluid Balance and Acid-Base","text":"Discuss osmotic, hydrostatic, and oncotic pressures as it relates to fluid balance in the body.","verdict":"keep","justification":"The pressures governing fluid movement between compartments explain edema formation, third-spacing in sepsis and burns, and why albumin matters for fluid distribution.|||TAKEAWAY|||<strong>Most important to take away:</strong> Starling forces: (1) Capillary hydrostatic pressure: pushes fluid out of capillary -> filtration. (2) Plasma oncotic pressure (mainly albumin): draws fluid into capillary -> reabsorption. Edema formation: increased hydrostatic pressure (heart failure, venous obstruction), decreased oncotic pressure (low albumin in liver failure/malnutrition), increased capillary permeability (inflammation/sepsis/burns). Third-spacing: fluid moves into interstitium and body cavities — not accessible for circulation.|||FIELD|||Sepsis causes massive third-spacing — pro-inflammatory mediators increase capillary permeability, driving fluid into the interstitium. The patient becomes profoundly edematous while having inadequate intravascular volume. You can give 3-4 litres of fluid and the patient is still volume-depleted because it's all leaking out. This is why septic shock is difficult to manage with crystalloids alone and why vasopressors (norepinephrine) are ultimately needed to maintain perfusion pressure.","modIndex":8,"chIndex":1},{"num":119,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Lecture — Fluid Balance and Acid-Base","text":"Identify major anions and cations found in the body, where they are found, and their roles in the body.","verdict":"keep","justification":"Electrolytes — their normal concentrations and functions — are the chemical foundation of action potentials, muscle contraction, fluid balance, and acid-base regulation. Electrolyte abnormalities are among the most common critical care diagnoses.|||TAKEAWAY|||<strong>Most important to take away:</strong> Na+ (135-145 mmol/L): primary extracellular cation, osmolarity, fluid balance. K+ (3.5-5.0 mmol/L): primary intracellular cation, action potential repolarization. Ca2+ (ionized 1.1-1.35 mmol/L): muscle contraction, coagulation, nerve signaling. Mg2+: enzyme cofactor, cardiac stability. Cl-: main extracellular anion. HCO3-: main buffer. Clinical priority: K+ (dysrhythmias), Na+ (neurological symptoms), Ca2+ (tetany, dysrhythmias).|||FIELD|||Hypokalemia: flat T waves, U waves, ventricular ectopy, weakness — common in loop diuretic users, vomiting, diarrhea. Hyperkalemia: peaked T waves, wide QRS, sine-wave pattern, VF/asystole — common in dialysis patients. Hyponatremia: headache, confusion, seizures. For every dialysis patient or significant electrolyte risk patient, the ECG gives you real-time electrolyte information — a cardiac monitor is also an electrolyte monitor.","modIndex":8,"chIndex":1},{"num":120,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Lecture — Fluid Balance and Acid-Base","text":"Discuss pH values as it relates to hydrogen ion concentration in the body.","verdict":"keep","justification":"pH and hydrogen ion concentration — reviewed here in the renal context — reinforce how the kidney regulates pH over hours through bicarbonate handling. This complements entry 7 with organ-system specificity.|||TAKEAWAY|||<strong>Most important to take away:</strong> Normal blood pH: 7.35-7.45. The kidney regulates acid-base balance slowly (hours-days) by: reabsorbing or excreting bicarbonate (HCO3-), secreting H+ into urine, producing new bicarbonate. Renal failure causes metabolic acidosis — kidneys can't excrete H+ or generate bicarbonate. The patient compensates by hyperventilating (blowing off CO2 lowers pCO2, compensating for low HCO3-).|||FIELD|||A tachypneic, acidotic-appearing dialysis patient with missed dialysis is compensating for metabolic acidosis — their tachypnea is compensatory, not a primary respiratory problem. Don't suppress it with oxygen alone without understanding the underlying acid-base abnormality. This patient needs urgent hospital care for dialysis to correct the acidosis. The breathing pattern is their body's last-ditch pH correction mechanism.","modIndex":8,"chIndex":1},{"num":121,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Lecture — Fluid Balance and Acid-Base","text":"Describe 3 buffering systems that help prevent deviations of pH in the body.","verdict":"keep","justification":"The three buffering systems — bicarbonate/CO2 (lungs), protein buffers (haemoglobin), and phosphate buffers (kidneys) — explain how the body maintains narrow pH limits despite constant acid production, and why respiratory and renal compensation follow predictable patterns.|||TAKEAWAY|||<strong>Most important to take away:</strong> Bicarbonate buffer system: H+ + HCO3- <-> H2CO3 <-> CO2 + H2O. Lungs regulate CO2 (fast). Kidneys regulate HCO3- (slow). Haemoglobin: major protein buffer. If one system fails, the other compensates: respiratory acidosis (high CO2) -> kidneys retain bicarbonate over days. Metabolic acidosis (low HCO3-) -> lungs hyperventilate to lower CO2 within minutes to hours.|||FIELD|||Kussmaul breathing in DKA is the respiratory buffer system compensating for metabolic acidosis — blowing off CO2 to compensate for low bicarbonate. A COPD patient with chronic CO2 retention has chronically elevated bicarbonate as renal compensation — their baseline acid-base state looks like compensated respiratory acidosis. These compensatory patterns tell you the duration and mechanism of the disorder.","modIndex":8,"chIndex":1},{"num":122,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Lecture — Fluid Balance and Acid-Base","text":"Explain how the lungs and the kidneys regulate acid–base balance and differentiate between respiratory and metabolic acid-base disorders and how the body compensates for deviations from normal.","verdict":"keep","justification":"The four primary acid-base disorders with their compensatory responses is one of the most important frameworks in emergency medicine. You'll use it to interpret altered breathing patterns and anticipate complications.|||TAKEAWAY|||<strong>Most important to take away:</strong> Respiratory acidosis: hypoventilation -> CO2 retention -> pH drops. Causes: COPD exacerbation, opioid OD, neuromuscular failure. Respiratory alkalosis: hyperventilation -> CO2 blown off -> pH rises. Causes: anxiety/panic, PE, salicylate overdose. Metabolic acidosis: excess H+ or HCO3- loss. Causes: DKA, sepsis, renal failure, lactic acidosis. Respiratory compensation: hyperventilation. Metabolic alkalosis: excess HCO3- or H+ loss. Causes: vomiting (loss of HCl), loop diuretics.|||FIELD|||Acid-base patterns in the field: DKA -> metabolic acidosis with respiratory compensation (Kussmaul). Opioid OD -> respiratory acidosis (hypoventilation). COPD exacerbation -> respiratory acidosis. Anxiety/panic -> respiratory alkalosis (PCO2 drops -> tetany, perioral tingling, carpal-pedal spasm). Salicylate (ASA) overdose -> initially respiratory alkalosis then metabolic acidosis. These patterns guide your management and help you anticipate hospital interventions.","modIndex":8,"chIndex":1},{"num":123,"modTitle":"Module 10 | Anatomy and Physiology of the Gastro-Intestinal System","chName":"Chapter 15 — Digestive System","text":"Outline the structure and function of the organs of the gastrointestinal (GI) tract through which food directly passes. This includes the mouth, pharynx, esophagus, stomach, small intestine, and large intestine.","verdict":"keep","justification":"GI tract anatomy provides the framework for localizing abdominal emergencies. The location of abdominal pain, combined with the organs in that region, generates your differential diagnosis.|||TAKEAWAY|||<strong>Most important to take away:</strong> GI tract: mouth -> esophagus -> stomach -> small intestine (duodenum, jejunum, ileum) -> large intestine (cecum, ascending, transverse, descending, sigmoid colon) -> rectum -> anus. Abdominal quadrant correlations: RUQ (liver, gallbladder, duodenum), LUQ (stomach, spleen, pancreatic tail), RLQ (appendix, right ovary, distal ileum), LLQ (sigmoid colon, left ovary). Upper GI bleed: proximal to ligament of Treitz (hematemesis, melena). Lower GI bleed: distal (hematochezia).|||FIELD|||RLQ pain + fever + anorexia + nausea in a young patient = appendicitis until proven otherwise. Appendix is at McBurney's point (1/3 of the way from ASIS to umbilicus). Rebound tenderness indicates peritoneal inflammation. A ruptured appendix causes diffuse peritonitis — guarding and rigidity across the entire abdomen. Your goal: identify the pattern, transport efficiently, nothing by mouth (patient may need emergency surgery), establish IV access.","modIndex":9,"chIndex":0},{"num":124,"modTitle":"Module 10 | Anatomy and Physiology of the Gastro-Intestinal System","chName":"Chapter 15 — Digestive System","text":"Explain mechanical and chemical digestion, absorption of nutrients, and the elimination of solid waste.","verdict":"skim","justification":"Mechanical and chemical digestion and nutrient absorption underpin understanding of malabsorption syndromes, bowel obstruction, and why certain patients are chronically malnourished.|||TAKEAWAY|||<strong>Most important to take away:</strong> Mechanical digestion: mastication (mouth), churning (stomach), segmentation (small intestine). Chemical digestion: salivary amylase (starch), gastric acid + pepsin (protein), bile (fat emulsification), pancreatic enzymes (protein, fat, carbohydrate). Absorption: primarily in small intestine (villi and microvilli). Carbohydrates and amino acids -> portal vein -> liver. Fats -> lymphatic system (chylomicrons) -> thoracic duct -> systemic circulation.|||FIELD|||Bowel obstruction: small bowel obstruction (SBO) presents with colicky central/periumbilical pain, vomiting (bilious), distension, and high-pitched bowel sounds early -> absent sounds late. Commonly from adhesions (prior surgery) or hernia. Large bowel obstruction: distension, altered bowel habits, less vomiting initially. Both are surgical emergencies. IV access, analgesia, nothing by mouth, transport. A patient who hasn't had a bowel movement in 5 days with a distended tense abdomen is an emergency.","modIndex":9,"chIndex":0},{"num":125,"modTitle":"Module 10 | Anatomy and Physiology of the Gastro-Intestinal System","chName":"Chapter 15 — Digestive System","text":"Outline the structure and function of the accessory organs of digestion — the liver, gallbladder, and pancreas — which secrete substances needed for digestion into the GI tract, in addition to performing other important functions.","verdict":"keep","justification":"The liver, gallbladder, and pancreas are themselves the site of common emergencies (cholecystitis, pancreatitis, hepatitis). Understanding their anatomy and function makes these presentations recognizable.|||TAKEAWAY|||<strong>Most important to take away:</strong> Liver: 1,500+ metabolic functions including glucose regulation, protein synthesis (albumin, clotting factors), drug metabolism, bilirubin conjugation, bile production. Gallbladder: stores and concentrates bile. Bile duct obstruction (gallstones) -> jaundice + RUQ pain + dark urine. Pancreas: endocrine (insulin/glucagon) + exocrine (digestive enzymes: lipase, amylase, proteases). Pancreatitis: enzyme activation within the pancreas -> autodigestion -> severe epigastric pain radiating to back. Causes: gallstones (most common) and alcohol.|||FIELD|||Acute pancreatitis: severe epigastric pain radiating to the back ('knife through the back'), nausea, vomiting, fever. These patients can be in such severe pain they can barely be assessed. Pancreatitis can cause massive retroperitoneal fluid sequestration, hemorrhagic shock, and ARDS in severe cases. IV access, aggressive fluid resuscitation, analgesia, transport. Grey-Turner sign (flank bruising) and Cullen's sign (periumbilical bruising) indicate hemorrhagic pancreatitis — severe, life-threatening.","modIndex":9,"chIndex":0},{"num":126,"modTitle":"Module 10 | Anatomy and Physiology of the Gastro-Intestinal System","chName":"Chapter 15 — Digestive System","text":"Review circulation related to the gastro-intestinal system and structures.","verdict":"keep","justification":"Portal circulation is directly relevant to hepatic emergencies. Portal hypertension from liver disease causes esophageal varices — a life-threatening upper GI hemorrhage you'll encounter.|||TAKEAWAY|||<strong>Most important to take away:</strong> Portal circulation: venous blood from GI tract -> portal vein -> liver (detoxification, first-pass metabolism) -> hepatic veins -> IVC. Portal hypertension (from cirrhosis): elevated portal pressure -> varices (dilated thin-walled collateral veins in esophagus and stomach) -> massive hematemesis when they rupture. Also causes splenomegaly, ascites, hepatic encephalopathy. First-pass effect: oral drugs absorbed from GI tract are metabolized by liver before reaching systemic circulation.|||FIELD|||Esophageal variceal hemorrhage: a patient with known cirrhosis or alcohol-related liver disease presenting with massive hematemesis. These patients can exsanguinate rapidly. Management: ABC priority, large-bore IV access x2, fluid resuscitation, immediate ALS intercept, rapid transport. These patients frequently also have coagulopathy (low clotting factors from liver failure) — making the bleeding even harder to control. Communicate the history of cirrhosis/varices prominently at handoff.","modIndex":9,"chIndex":0},{"num":127,"modTitle":"Module 10 | Anatomy and Physiology of the Gastro-Intestinal System","chName":"Chapter 15 — Digestive System","text":"Discuss specializations of the tissues of the digestive system that allow it to carry out its functions.","verdict":"skip","justification":"Skip. Specialized histology of GI tissue layers is detailed physiology not directly applicable to prehospital decision-making.|||TAKEAWAY|||Clinically relevant concept: the GI tract's large mucosal surface area and rich blood supply make it vulnerable to ischemia. Mesenteric ischemia (occlusion of superior mesenteric artery or vein) causes bowel infarction — severe constant abdominal pain out of proportion to physical findings in an older patient with vascular disease. 'Pain out of proportion to exam findings' is the hallmark.|||FIELD|||Mesenteric ischemia: severe abdominal pain in a patient >50 with atrial fibrillation (thrombus embolizes to SMA), atherosclerosis, or low-flow states. The GI mucosa infarcts rapidly. These patients look sick but have relatively unremarkable initial abdominal exams. Rapid deterioration to peritonitis and septic shock follows. High suspicion + rapid transport is the intervention.","modIndex":9,"chIndex":0},{"num":128,"modTitle":"Module 10 | Anatomy and Physiology of the Gastro-Intestinal System","chName":"Chapter 15 — Digestive System","text":"Outline how carbohydrates, proteins, and fats are digested and absorbed by the body.","verdict":"skip","justification":"Skip. Detailed biochemistry of macronutrient digestion and absorption is dietetics/nutrition content without prehospital application.|||TAKEAWAY|||Clinically relevant: fat malabsorption causes deficiency of fat-soluble vitamins (A, D, E, K). Vitamin K deficiency = coagulopathy (K is required for synthesis of clotting factors II, VII, IX, X). Patients with chronic malabsorption (Crohn's, celiac, pancreatic insufficiency) may have coagulopathy. Wernicke's encephalopathy: thiamine (B1) deficiency in alcohol use disorder — give IV thiamine before dextrose to avoid precipitating or worsening it.|||FIELD|||Wernicke's encephalopathy: confusion, ataxia, and ophthalmoplegia (eye movement abnormalities) in a patient with alcohol use disorder. Giving dextrose before thiamine in a thiamine-deficient patient can precipitate or worsen Wernicke's. BCEHS protocol: thiamine 100mg IV before or with dextrose in patients with suspected alcohol use disorder and altered LOC. This is a rare but devastating preventable complication.","modIndex":9,"chIndex":0},{"num":129,"modTitle":"Module 10 | Anatomy and Physiology of the Gastro-Intestinal System","chName":"Chapter 15 — Digestive System","text":"Explain how the beneficial bacteria that live in the GI tract and help us digest food, produce vitamins, and protect us from harmful pathogens and toxic substances.","verdict":"skip","justification":"Skip. The role of the gut microbiome in digestion and immunity is an emerging science area without direct prehospital clinical application.|||TAKEAWAY|||Clinically relevant: C. difficile colitis occurs when antibiotics disrupt normal gut flora, allowing C. diff to overgrow and produce toxins. Presentation: severe watery diarrhea, abdominal cramping, fever — often after recent antibiotic use. Highly contagious (spore-forming) — hand hygiene with soap and water (not just hand sanitizer) is essential. Contact precautions.|||FIELD|||C. difficile is common in elderly patients in long-term care or recently discharged from hospital. Contact precautions: gloves, gown, soap-and-water handwashing (alcohol gel does not kill C. diff spores). Decontaminate your equipment and stretcher. Notify the receiving facility of suspected C. diff before arrival so they can prepare an isolation room.","modIndex":9,"chIndex":0},{"num":130,"modTitle":"Module 10 | Anatomy and Physiology of the Gastro-Intestinal System","chName":"Chapter 15 — Digestive System","text":"Discuss major vitamins and how they contribute to homeostasis.","verdict":"skip","justification":"Skip. The specific roles of individual vitamins in biochemical pathways are nutrition science content. However, clinically relevant vitamin deficiencies present in your patient population.|||TAKEAWAY|||Clinically important vitamins: Vitamin K (coagulation — warfarin is a K antagonist). Vitamin D (calcium absorption — deficiency causes osteomalacia; epidemic in northern populations). Vitamin C deficiency (scurvy — rare, seen in severely malnourished/elderly patients: easy bruising, gum bleeding). Thiamine (B1) deficiency (Wernicke's encephalopathy in alcohol use disorder — give thiamine before dextrose).|||FIELD|||When you have a patient with alcohol use disorder and altered LOC, give thiamine before or with dextrose — this is BCEHS protocol. Vitamin K deficiency from malabsorption or malnutrition impairs coagulation — a malnourished elderly patient with unusual bleeding may have vitamin K deficiency on top of other coagulopathies. Ask about diet, alcohol use, and malabsorption syndromes in patients with unexpected bleeding.","modIndex":9,"chIndex":0},{"num":131,"modTitle":"Module 10 | Anatomy and Physiology of the Gastro-Intestinal System","chName":"Chapter 15 — Digestive System","text":"Discuss disorders of the digestive system, including inflammatory bowel diseases, ulcers, diverticulitis, and gastroenteritis.","verdict":"keep","justification":"IBD, appendicitis, and GI hemorrhage are the high-acuity GI presentations you'll most commonly manage. Recognizing them and managing the physiological consequences (hemorrhage, sepsis) is your core skill set for GI emergencies.|||TAKEAWAY|||<strong>Most important to take away:</strong> IBD: Crohn's (transmural, any GI segment, skip lesions) + UC (mucosal, only large bowel, continuous). Toxic megacolon: life-threatening complication of severe UC -> massive colonic dilation, perforation risk. GI hemorrhage: upper (hematemesis, melena) vs. lower (hematochezia). Significant hemorrhage -> hemorrhagic shock. Appendicitis: McBurney's point, rebound tenderness, Rovsing's sign (LLQ pressure causes RLQ pain).|||FIELD|||A patient with known UC presenting with diffuse abdominal distension, severe pain, fever, and tachycardia may have toxic megacolon — perforation is imminent. Surgical emergency. A patient with hematemesis and hemodynamic instability has an upper GI bleed requiring emergent endoscopy. IV access x2, large-bore (14-16g), fluid resuscitation to maintain perfusion, type and screen communication at handoff — they'll need blood products.","modIndex":9,"chIndex":0},{"num":132,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Outline the functions of the reproductive system, which includes the production and fertilization of gametes (eggs and sperm), the production of sex hormones by the gonads (testes and ovaries), and, in females, the carrying of a fetus.","verdict":"skim","justification":"The reproductive system's functions are relevant to obstetric emergencies, sexual health presentations, and the hormonal factors that affect cardiovascular risk and drug metabolism across the lifespan.|||TAKEAWAY|||<strong>Most important to take away:</strong> Functions: gametogenesis (sperm/egg production), hormone secretion (testosterone, estrogen, progesterone), pregnancy/childbirth support. Reproductive hormones affect non-reproductive systems: estrogen protects against cardiovascular disease pre-menopause. Reproductive emergencies: ectopic pregnancy, placental abruption, eclampsia, obstetric hemorrhage — all potentially life-threatening.|||FIELD|||A reproductive-age woman with acute pelvic pain and hemodynamic instability has an ectopic pregnancy until proven otherwise — even if she denies pregnancy. Ectopic pregnancy (fertilized ovum implanted outside the uterus, usually fallopian tube) causes internal hemorrhage when it ruptures. Leading cause of maternal death in the first trimester. BCEHS approach: IV access, fluid resuscitation, transport immediately. Every woman of reproductive age with pelvic pain and shock is potentially an ectopic.","modIndex":10,"chIndex":0},{"num":133,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Explain how the male and female reproductive systems differentiate in the embryo and fetus, and how they mature during puberty.","verdict":"skip","justification":"Skip. Embryological differentiation of male and female reproductive structures is developmental biology without prehospital application.|||TAKEAWAY|||Clinically relevant: transgender patients on hormone therapy have altered cardiovascular and metabolic profiles. Transgender women (male sex assigned at birth) taking estrogen have elevated DVT/PE risk — estrogen is procoagulant. Transgender men on testosterone have increased hematocrit and potentially higher cardiovascular risk. Take medication history including hormone therapy.|||FIELD|||A transgender woman on estrogen presenting with sudden dyspnea, pleuritic chest pain, and tachycardia — PE is in her differential. The estrogen component increases clotting factor production and impairs fibrinolysis, the same mechanism as the oral contraceptive pill. BCEHS high-flow O2, ECG, IV access, rapid transport. Include hormone therapy in your medication history for all patients.","modIndex":10,"chIndex":0},{"num":134,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Label and describe the structures of the male reproductive system, including the testes, epididymis, vas deferens, ejaculatory ducts, seminal vesicles, prostate gland, bulbourethral glands, and the penis.","verdict":"skim","justification":"Male reproductive anatomy is relevant for urological and reproductive emergencies: testicular torsion, priapism, prostate emergencies, and trauma.|||TAKEAWAY|||<strong>Most important to take away:</strong> Testes: produce sperm + testosterone, located in scrotum (temperature regulation). Epididymis: sperm maturation. Vas deferens: transport to urethra. Prostate: surrounds proximal urethra — BPH enlargement causes urinary obstruction. Testicular torsion: twisting of spermatic cord -> vascular occlusion -> testicular ischemia -> infarction within 4-6 hours. Surgical emergency — every hour reduces viability.|||FIELD|||Testicular torsion: sudden onset severe scrotal pain in a young male (most common in adolescents), may have accompanying nausea/vomiting. The cremasteric reflex is absent. This is a surgical emergency — transport urgently, do not apply heat (worsens ischemia), do not elevate. The only definitive treatment is surgical detorsion. Missed testicular torsion = permanent infertility and loss of testicle. Low threshold for concern in any young male with acute scrotal pain.","modIndex":10,"chIndex":0},{"num":135,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Discuss how sperm are produced, how they mature, how they are stored, and how they are deposited into the female.","verdict":"skip","justification":"Skip. Detailed spermatogenesis is reproductive biology without prehospital clinical application.|||TAKEAWAY|||Not clinically applicable at PCP level. Skip.|||FIELD|||No direct field application.","modIndex":10,"chIndex":0},{"num":136,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Describe the fluids in semen that protect and nourish sperm, and where those fluids are produced.","verdict":"skip","justification":"Skip. Composition of semen is anatomy detail without prehospital relevance.|||TAKEAWAY|||Not clinically applicable at PCP level. Skip.|||FIELD|||No direct field application.","modIndex":10,"chIndex":0},{"num":137,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Discuss disorders of the male reproductive system, including erectile dysfunction, epididymitis, prostate cancer, and testicular cancer.","verdict":"skim","justification":"Male reproductive disorders — erectile dysfunction and prostate disease — are common in your patient population and affect medication lists you'll review. The PDE5 inhibitor-nitrate interaction is a life-threatening contraindication you will encounter.|||TAKEAWAY|||<strong>Most important to take away:</strong> Erectile dysfunction (ED): often vascular — a marker of systemic vascular disease. PDE5 inhibitors (sildenafil/Viagra, tadalafil/Cialis) — ABSOLUTE CONTRAINDICATION with nitrates (severe hypotension). Always ask about PDE5 inhibitor use before giving nitroglycerin. Sildenafil lasts ~4 hours; tadalafil lasts up to 36 hours. BPH: urinary frequency, nocturia, weak stream, urinary retention.|||FIELD|||A chest pain patient who took Viagra or Cialis in the last 24-48 hours CANNOT receive nitroglycerin — the combined vasodilation causes potentially fatal hypotension. Always ask: 'Have you taken anything for erectile dysfunction in the past day or two?' BCEHS STEMI protocol explicitly lists PDE5 inhibitor use as a nitroglycerin contraindication. This interaction kills patients when it's missed.","modIndex":10,"chIndex":0},{"num":138,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Label and describe the structures of the female reproductive system, including the ovaries, fallopian tubes, uterus, cervix, vagina, and external structures of the vulva.","verdict":"keep","justification":"Female reproductive anatomy is directly relevant to obstetric emergencies: ectopic pregnancy, placenta previa, placental abruption, uterine rupture, and normal and abnormal delivery. This is not optional knowledge for the prehospital provider.|||TAKEAWAY|||<strong>Most important to take away:</strong> Uterus: muscular organ, fundus (top) to cervix. Fallopian tubes: connect uterus to ovaries — site of fertilization and ectopic implantation. Ovaries: produce eggs and sex hormones. Placenta previa: placenta covering cervical os -> painless antepartum hemorrhage — DO NOT do vaginal exam (can cause massive hemorrhage). Placental abruption: placenta detaches prematurely -> painful hemorrhage, rigid uterus, fetal distress.|||FIELD|||Antepartum hemorrhage in the third trimester: placenta previa (painless bleeding, lay flat, IV access x2, do NOT do vaginal exam), placental abruption (painful, rigid uterus, maternal shock possible, fetal distress). Both require immediate transport to an obstetric centre. For placenta previa: any vaginal examination can trigger catastrophic hemorrhage. Maternal death from obstetric hemorrhage is a real prehospital possibility — treat aggressively.","modIndex":10,"chIndex":0},{"num":139,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Explain how eggs are produced in the female fetus, and how they then mature after puberty through the process of ovulation.","verdict":"skip","justification":"Skip. Oocyte development embryology is reproductive science without clinical application at PCP level.|||TAKEAWAY|||Not clinically applicable at PCP level. Skip.|||FIELD|||No direct field application.","modIndex":10,"chIndex":0},{"num":140,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Understand the menstrual cycle, its purpose, and the hormones that control it.","verdict":"skim","justification":"The menstrual cycle and its hormonal control are relevant for understanding ovarian emergencies (ruptured ovarian cyst, ovarian torsion) and ectopic pregnancy.|||TAKEAWAY|||<strong>Most important to take away:</strong> Follicular phase (days 1-14): FSH -> follicle growth -> estrogen -> LH surge -> ovulation (day 14). Luteal phase (days 14-28): corpus luteum secretes progesterone -> maintains endometrium. Ovulation pain (Mittelschmerz): mid-cycle, unilateral. Ovarian cyst rupture: acute pelvic pain, can cause internal hemorrhage. Ovarian torsion: twisted ovarian blood supply -> ischemia -> severe pelvic pain -> surgical emergency.|||FIELD|||Ovarian torsion: severe acute unilateral pelvic pain (often right side), nausea, vomiting, similar presentation to appendicitis but in ovary location. Doppler ultrasound confirms; surgical detorsion within hours is required (time-critical like testicular torsion). Ruptured ovarian cyst: usually less severe but a hemorrhagic corpus luteum cyst can bleed significantly. Any reproductive-age woman with acute pelvic pain and hemodynamic instability needs IV access, fluid resuscitation, and urgent transport.","modIndex":10,"chIndex":0},{"num":141,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Outline how fertilization and implantation occur, the stages of pregnancy and childbirth, and how the mother's body produces milk to feed the baby.","verdict":"keep","justification":"Fertilization, implantation, and the stages of pregnancy — and the changes in maternal physiology — are essential for managing obstetric patients and for understanding why normal vital sign ranges change in pregnancy.|||TAKEAWAY|||<strong>Most important to take away:</strong> Normal maternal physiological changes: blood volume increases 30-50% (dilutional anemia is normal), HR increases 10-15 bpm (tachycardia is normal baseline), BP decreases in first/second trimester. Uterus in third trimester compresses IVC when supine -> supine hypotension syndrome -> position in left lateral decubitus. Eclampsia: hypertension + seizures in pregnancy — life-threatening. Preeclampsia: hypertension + proteinuria without seizures.|||FIELD|||A pregnant patient can lose 30-35% of blood volume before showing hemodynamic compromise — their expanded blood volume compensates. By the time a pregnant trauma patient shows hypotension, fetal perfusion has already been critically impaired. 'Resuscitate the mother to resuscitate the fetus.' Left lateral decubitus positioning for any pregnant patient >20 weeks — prevents IVC compression. For eclampsia: BCEHS protocol includes magnesium sulfate (from ALS) for seizure prevention/treatment, and rapid transport to an obstetric centre.","modIndex":10,"chIndex":0},{"num":142,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Discuss disorders of the female reproductive system, including cervical cancer, endometriosis, and vaginitis (including yeast infections).","verdict":"skim","justification":"Female reproductive disorders — ovarian/cervical cancer, endometriosis, PCOS — affect large portions of your patient population and may be in the background history of many patients you assess.|||TAKEAWAY|||<strong>Most important to take away:</strong> PCOS: most common endocrine disorder in women of reproductive age — insulin resistance, hyperandrogenism, irregular cycles. Associated with type 2 diabetes risk. Endometriosis: endometrial tissue outside the uterus -> chronic pelvic pain, dysmenorrhea. Ovarian cancer: often silent until late stage — vague abdominal symptoms, ascites. Ectopic pregnancy: most immediately life-threatening female reproductive emergency.|||FIELD|||PCOS patients frequently have insulin resistance — relevant to blood glucose assessment in altered LOC calls. Endometriosis patients often have significant chronic pain and higher baseline analgesic use — their pain tolerance baseline is higher and their analgesia needs may be greater for a give // FILTER — multi-select
const activeFilters = new Set(['all']);

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const f = btn.dataset.filter;

    if (f === 'all') {
      // All button clears everything else and resets to all
      activeFilters.clear();
      activeFilters.add('all');
    } else {
      // Remove 'all' when a specific filter is picked
      activeFilters.delete('all');
      if (activeFilters.has(f)) {
        activeFilters.delete(f);
        // If nothing left, go back to all
        if (activeFilters.size === 0) activeFilters.add('all');
      } else {
        activeFilters.add(f);
      }
    }

    // Update button active states
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.toggle('active', activeFilters.has(b.dataset.filter));
    });

    applyFilter();
  });
});

function applyFilter() {
  const showAll = activeFilters.has('all');
  const showDone = activeFilters.has('done');
  const verdicts = new Set(['keep', 'skim', 'skip'].filter(v => activeFilters.has(v)));

  document.querySelectorAll('.obj-row').forEach(row => {
    const isDone = row.classList.contains('completed');
    const verdict = row.dataset.verdict;

    if (showAll) {
      row.classList.remove('hidden');
    } else {
      const passVerdict = verdicts.size === 0 || verdicts.has(verdict);
      const passDone = !showDone || isDone;
      // Row is visible if it passes both verdict filter AND done filter
      // If only done is selected: show completed rows regardless of verdict
      // If verdict + done: show rows that match verdict AND are done
      let visible;
      if (verdicts.size > 0 && showDone) {
        visible = verdicts.has(verdict) && isDone;
      } else if (showDone) {
        visible = isDone;
      } else {
        visible = verdicts.has(verdict);
      }
      row.classList.toggle('hidden', !visible);
    }
  });

  // Hide chapter blocks with all hidden rows
  document.querySelectorAll('.chapter-block').forEach(block => {
    const rows = block.querySelectorAll('.obj-row');
    const anyVisible = [...rows].some(r => !r.classList.contains('hidden'));
    block.style.display = anyVisible ? '' : 'none';
  });
  // Hide module headings with all hidden blocks
  document.querySelectorAll('.module').forEach(mod => {
    const blocks = mod.querySelectorAll('.chapter-block');
    const anyVisible = [...blocks].some(b => b.style.display !== 'none');
    const heading = mod.querySelector('.module-heading');
    if (heading) heading.style.display = anyVisible ? '' : 'none';
  });
}

function saveState() {
  const state = {};
  document.querySelectorAll('.obj-row').forEach(row => {
    const id = row.dataset.id;
    const cb = row.querySelector('input[type="checkbox"]');
    const dateInp = row.querySelector('input[type="date"]');

  set(STATE_REF, state).catch(err => console.error('Firebase save error:', err));
}

function applyState(state) {
  if (!state) return;
  isSyncing = true;
  document.querySelectorAll('.obj-row').forEach(row => {
    const id = row.dataset.id;
    if (!state[id]) return;
    const cb = row.querySelector('input[type="checkbox"]');
    const dateInp = row.querySelector('input[type="date"]');
    if (state[id].done) { cb.checked = true; row.classList.add('completed'); }
    else { cb.checked = false; row.classList.remove('completed'); }
    if (dateInp && state[id].date) dateInp.value = state[id].date;
  });
  updateCounter();
  isSyncing = false;
}
