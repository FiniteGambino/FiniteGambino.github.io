 this concept.\n\n<strong>Most important to take away:</strong> Compensated shock maintains BP by increasing heart rate and vascular resistance — the patient looks pale and tachycardic but BP is normal. Decompensated shock is when these mechanisms fail and BP drops. You can have severely shocked patients with initially normal BPs. Trending HR, skin signs (colour, temperature, capillary refill), and LOC is more sensitive than a single BP reading.","modIndex":5,"chIndex":0},{"num":79,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Describe the components of blood — including plasma, red blood cells, white blood cells, and platelets — and describe their specific functions.","verdict":"keep","justification":"The book explains each component's function clearly.\n\n<strong>Most important to take away:</strong> Red blood cells carry oxygen via haemoglobin. SpO₂ measures haemoglobin saturation. A severely anaemic patient can have a normal SpO₂ (fully saturated haemoglobin) but still be in oxygen debt because there aren't enough RBCs to carry adequate total oxygen. SpO₂ alone is insufficient in suspected haemorrhage. Platelets initiate clotting — thrombocytopenia (from chemo, liver disease, sepsis) causes coagulopathy, meaning patients bleed more from even minor injuries.","modIndex":5,"chIndex":0},{"num":80,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Classify blood typing using the ABO system and Rh factor and identify a universal donor versus a universal recipient.","verdict":"skim","justification":"The book explains A, B, AB, O blood types and Rh positive/negative. Universal donor = O negative. Universal recipient = AB positive.\n\n<strong>What to focus on:</strong> In prehospital care you won't be transfusing blood, but you need to know this for handoff and documentation. If a patient has a medical alert bracelet with their blood type, document and communicate it. The receiving team will immediately need this information.","modIndex":5,"chIndex":0},{"num":81,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Compare and contrast the structure and function of different types of blood vessels — including arteries, veins, and capillaries.","verdict":"keep","justification":"Arteries = thick muscular walls, carry blood away from heart under high pressure. Veins = thinner walls, carry blood toward heart, contain valves. Capillaries = one cell thick, site of exchange.\n\n<strong>Most important to take away:</strong> Arterial bleeding is bright red, pulsatile, and high pressure — harder to control. Venous bleeding is dark red, steady flow, lower pressure — easier to control with direct pressure. Capillary bleeding is slow oozing. In hemorrhage control, identifying the source type helps you anticipate whether direct pressure, wound packing, or tourniquet is appropriate. This is directly in your EMALB wound care guidelines.","modIndex":5,"chIndex":0},{"num":82,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Outline and label the structures of the heart, electrical conduction system components, and nervous control of the heart.","verdict":"keep","justification":"The book covers the four chambers, four valves, and the conduction pathway: SA node → AV node → Bundle of His → bundle branches → Purkinje fibres.\n\n<strong>Most important to take away:</strong> The SA node is the pacemaker at 60–100/min. If it fails, the AV node takes over at 40–60/min. If the AV node fails, the ventricles fire at 20–40/min — often inadequate. This is why bradycardic arrest rhythms exist and why external pacing is a PCP intervention. Vagal tone (parasympathetic via vagus nerve) slows the heart — this is why Valsalva manoeuvre or carotid sinus pressure can cause profound bradycardia. The vagal response to pain or emotion is why people faint.","modIndex":5,"chIndex":0},{"num":83,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Understand action potentials of the cardiac conduction system and associated electrolytes.","verdict":"keep","justification":"The book explains that cardiac action potentials depend on sodium, potassium, and calcium ion movements.\n\n<strong>Most important to take away:</strong> Hyperkalemia (↑K⁺) slows conduction → wide, bizarre QRS complexes → progresses to VF and asystole. Hypokalemia (↓K⁺) increases excitability → premature beats and VF. Hypercalcemia shortens the QT interval; hypocalcemia lengthens it. Hypomagnesemia is associated with polymorphic VT (Torsades de pointes). When a renal failure patient presents with altered LOC and bradycardia, hyperkalemia is immediately on the differential — your PCP partner will be managing this on the ECG.","modIndex":5,"chIndex":0},{"num":84,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Describe what blood pressure is and how it is regulated.","verdict":"keep","justification":"The book explains BP = cardiac output × systemic vascular resistance. Baroreceptors in the carotid sinus and aortic arch detect pressure changes and feed back to the brainstem.\n\n<strong>Most important to take away:</strong> Normal systolic BP down to around 90mmHg in adults — below this is hypotension, but shock can be present with a systolic of 110 in someone who is normally hypertensive. Trending HR, skin signs (colour, temperature, capillary refill), and LOC is more sensitive early than a single BP reading. The baroreceptor reflex explains orthostatic hypotension — when a dehydrated or volume-depleted patient stands, the baroreceptors detect the drop and try to compensate but can't fully — causing presyncope or syncope.","modIndex":5,"chIndex":0},{"num":85,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Discuss blood disorders, including anemia, HIV, and leukemia.","verdict":"keep","justification":"The book covers all three. These are commonly encountered in your patient population.\n\n<strong>Most important to take away:</strong> Anaemia patients tolerate blood loss poorly — they have less reserve. Any volume of haemorrhage that would be manageable in a healthy person can be critical in an anaemic one. HIV-positive patients may have opportunistic infections — Pneumocystis pneumonia (PCP) causes severe hypoxia with minimal auscultatory findings and can be easily missed. Leukemia patients undergoing chemotherapy are severely immunocompromised — any fever in this population is an emergency (febrile neutropenia — rapidly fatal without antibiotics).","modIndex":5,"chIndex":0},{"num":86,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Discuss cardiovascular diseases (including heart attack, stroke, and angina), and the risk factors and precursors — such as high blood pressure and atherosclerosis — that contribute to them.","verdict":"keep","justification":"These are your highest-acuity, most common serious calls. Both cardiac chest pain and stroke have explicit EMALB protocols.\n\n<strong>Most important to take away:</strong>\n<strong>Atherosclerosis</strong> = cholesterol plaque buildup in arterial walls → thrombus formation.\n<strong>Angina</strong> = chest pain from myocardial ischemia without infarction. Exertional, relieved by rest or GTN. Treat with nitroglycerin (PCP scope).\n<strong>STEMI/NSTEMI</strong> = plaque rupture + complete/partial coronary occlusion. Classic: crushing central chest pain radiating to jaw/left arm, diaphoresis, nausea. Atypical presentations more common in women, diabetics, elderly — jaw pain only, epigastric pain, SOB without chest pain.\n<strong>Stroke</strong> = ischemic (thrombus/embolus, 85%) or hemorrhagic (ruptured vessel, 15%). EMALB uses CPSS — facial droop, arm drift, speech abnormality. Time is brain — approximately 1.9 million neurons lost per minute without treatment.","modIndex":5,"chIndex":0},{"num":87,"modTitle":"Module 7 | Anatomy and Physiology of the Lymphatic and Immune Systems","chName":"Chapter 17 — Lymphatic and Immune Systems","text":"Describe how the immune system identifies normal cells of the body as \"self\" and pathogens and damaged cells as \"non-self.\"","verdict":"keep","justification":"The book explains immune cells distinguish the body's own cells (marked with MHC proteins) from foreign cells and pathogens.\n\n<strong>Most important to take away:</strong> This concept explains anaphylaxis — an overly aggressive immune response to a perceived threat. The immune system identifies the allergen as non-self and mounts an exaggerated response involving mast cell degranulation, histamine release, and systemic vasodilation + bronchoconstriction. Epinephrine works by reversing these effects at the adrenergic receptor level, not by stopping the immune response itself.","modIndex":6,"chIndex":0},{"num":88,"modTitle":"Module 7 | Anatomy and Physiology of the Lymphatic and Immune Systems","chName":"Chapter 17 — Lymphatic and Immune Systems","text":"Explain the two major subsystems of the general immune system: the innate immune system and the adaptive immune system.","verdict":"keep","justification":"The book explains innate (non-specific, immediate, inflammation) and adaptive (specific, delayed, memory).\n\n<strong>Most important to take away:</strong> Sepsis is innate immunity gone systemic — the inflammatory response that should be localized to an infection site becomes dysregulated and affects the entire body. Massive vasodilation, increased capillary permeability, and endothelial damage cause distributive shock. BCEHS sepsis presentations include hypotension, tachycardia, fever or hypothermia, and altered LOC. Knowing the mechanism helps you recognize sepsis even in atypical presentations — elderly patients often don't mount a fever.","modIndex":6,"chIndex":0},{"num":89,"modTitle":"Module 7 | Anatomy and Physiology of the Lymphatic and Immune Systems","chName":"Chapter 17 — Lymphatic and Immune Systems","text":"Outline components of the neuroimmune system.","verdict":"skim","justification":"The book briefly covers that the nervous system communicates with immune cells. Not in BCEHS CPG scope at PCP level.\n\n<strong>What to focus on:</strong> A light read is enough. The key concept is that psychological stress activates the HPA axis and releases cortisol, which is immunosuppressive over time. This explains why chronically stressed patients are more susceptible to infection — clinically relevant context for your complex patients.","modIndex":6,"chIndex":0},{"num":90,"modTitle":"Module 7 | Anatomy and Physiology of the Lymphatic and Immune Systems","chName":"Chapter 17 — Lymphatic and Immune Systems","text":"Describe the organs, cells, and responses of the innate immune system.","verdict":"skim","justification":"The book covers skin (barrier), inflammatory response, macrophages, neutrophils, natural killer cells, and fever.\n\n<strong>What to focus on:</strong> Fever is a controlled homeostatic response — the hypothalamus raises the set point, causing vasoconstriction (feeling cold, shivering) to generate and retain heat. It's not the same as hyperthermia (uncontrolled heat gain, e.g. heat stroke). Treating fever with antipyretics does not treat the underlying cause — communicating fever as a sign to the receiving team is important. Skip the detailed cellular mechanisms.","modIndex":6,"chIndex":0},{"num":91,"modTitle":"Module 7 | Anatomy and Physiology of the Lymphatic and Immune Systems","chName":"Chapter 17 — Lymphatic and Immune Systems","text":"Outline components of the lymphatic system as it relates to adaptive immunity — including lymphocytes, lymphatic vessels, lymph, and organs (such as the spleen, tonsils, and lymph nodes).","verdict":"skim","justification":"The book explains the lymphatic system drains excess interstitial fluid back to the circulation and that lymph nodes filter lymph.\n\n<strong>What to focus on:</strong> The spleen filters blood and stores a reservoir of red blood cells and platelets. Splenic rupture from blunt abdominal trauma causes massive internal hemorrhage — the spleen is highly vascular and has no bony protection (only lower ribs partially cover it on the left). A patient with left-sided rib fractures should be treated with high suspicion for splenic injury even with initially normal BP (compensated shock). Kehr's sign — left shoulder pain from diaphragmatic irritation by splenic blood — is a clinical clue.","modIndex":6,"chIndex":0},{"num":92,"modTitle":"Module 7 | Anatomy and Physiology of the Lymphatic and Immune Systems","chName":"Chapter 17 — Lymphatic and Immune Systems","text":"Outline the specific cells of the immune system and their functions, including Lymphocytes (B cells, T cells, plasma cells, and natural killer cells), myeloid cells (neutrophils, eosinophils, and basophils), monocytes and macrophages, and mast cells.","verdict":"skip","justification":"The book covers this in significant cellular immunology detail. Not relevant to your prehospital scope. You won't be differentiating lymphocyte subtypes on a call.","modIndex":6,"chIndex":0},{"num":93,"modTitle":"Module 7 | Anatomy and Physiology of the Lymphatic and Immune Systems","chName":"Chapter 17 — Lymphatic and Immune Systems","text":"Describe how the adaptive immune system can generate specific and often long-lasting immunity against pathogens through the production of antibodies.","verdict":"skim","justification":"Antibodies = immunoglobulins produced by B cells against specific antigens. Memory cells allow faster secondary response.\n\n<strong>What to focus on:</strong> Anaphylaxis on first exposure is not possible with the classic IgE mechanism — the first exposure sensitizes the patient, the second triggers the reaction. Patients often don't know they've been sensitized (e.g. first bee sting sensitized them, second sting causes anaphylaxis). Always ask about prior reactions, not just known allergies — this is a direct clinical habit that comes from understanding this mechanism.","modIndex":6,"chIndex":0},{"num":94,"modTitle":"Module 7 | Anatomy and Physiology of the Lymphatic and Immune Systems","chName":"Chapter 17 — Lymphatic and Immune Systems","text":"Discuss how vaccines work to generate immunity.","verdict":"skip","justification":"Not in EMALB or BCEHS prehospital scope.","modIndex":6,"chIndex":0},{"num":95,"modTitle":"Module 7 | Anatomy and Physiology of the Lymphatic and Immune Systems","chName":"Chapter 17 — Lymphatic and Immune Systems","text":"Discuss how cells in the immune system detect and kill cancerous cells.","verdict":"skip","justification":"Not relevant to prehospital care at any level.","modIndex":6,"chIndex":0},{"num":96,"modTitle":"Module 7 | Anatomy and Physiology of the Lymphatic and Immune Systems","chName":"Chapter 17 — Lymphatic and Immune Systems","text":"Discuss strategies that pathogens employ to evade the immune system.","verdict":"skip","justification":"Interesting, not clinically actionable at PCP level. Not in BCEHS CPGs.","modIndex":6,"chIndex":0},{"num":97,"modTitle":"Module 7 | Anatomy and Physiology of the Lymphatic and Immune Systems","chName":"Chapter 17 — Lymphatic and Immune Systems","text":"Discuss disorders of the immune system, including allergies, autoimmune diseases (such as diabetes and multiple sclerosis), and immunodeficiency resulting from conditions such as HIV infection.","verdict":"keep","justification":"All three appear in BCEHS CPGs or regular call types in the Lower Mainland.\n\n<strong>Most important to take away:</strong> Allergic reactions exist on a spectrum from mild urticaria to life-threatening anaphylaxis. EMALB anaphylaxis protocol uses epinephrine (IM) as first-line. Indicators it's becoming anaphylaxis: stridor, wheeze, hypotension, altered LOC, angioedema of the tongue or throat. Autoimmune disease patients are often on chronic immunosuppressants — vulnerable to opportunistic infections with atypical presentations. HIV immunodeficiency means the patient's threshold for serious infection is much lower — a respiratory complaint in an HIV patient deserves more concern than in an immunocompetent patient.","modIndex":6,"chIndex":0},{"num":98,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Summarize the glands that make up the endocrine system, and how hormones act as chemical messengers in the body.","verdict":"keep","justification":"The book explains hormones are secreted into the blood and travel to target cells with specific receptors. Unlike the nervous system (fast, electrical, localized), the endocrine system is slow, chemical, and widespread.\n\n<strong>Most important to take away:</strong> A hormonal response takes minutes to hours to develop and resolve. This is why diabetic emergencies don't resolve instantly with glucose — it takes time for cells to uptake glucose and for the hormonal cascade to normalize. Knowing this prevents premature reassurance of a patient who appears to be \"waking up\" after initial glucose administration.","modIndex":7,"chIndex":0},{"num":99,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Describe the general types of endocrine system disorders.","verdict":"keep","justification":"The book explains hyper- vs hyposecretion as the two failure modes.\n\n<strong>Most important to take away:</strong> Too much hormone → signs of excess (e.g. hyperthyroidism = tachycardia, weight loss, anxiety). Too little → signs of deficiency (hypothyroidism = bradycardia, weight gain, fatigue). Same logic applies to insulin (too much = hypoglycemia, too little = hyperglycemia). This is your diagnostic framework for every endocrine call.","modIndex":7,"chIndex":0},{"num":100,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Name the types of endocrine hormones — including steroid hormones (such as sex hormones) and non-steroid hormones (such as insulin) — and how they affect the functions of their target cells by binding to different types of receptor proteins.","verdict":"skim","justification":"Steroid hormones (cortisol, sex hormones) cross cell membranes and act on nuclear receptors. Non-steroid hormones (insulin, adrenaline) bind to surface receptors.\n\n<strong>What to focus on:</strong> Insulin resistance (type 2 diabetes) occurs at the receptor level — insulin is present but cells don't respond normally. This is different from type 1 diabetes where insulin is absent. The clinical distinction matters because type 2 diabetics may have adequate insulin production early in their disease but still develop hyperglycemia. Skip the molecular receptor binding detail.","modIndex":7,"chIndex":0},{"num":101,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Explain how the levels of hormones are regulated mostly through negative, but sometimes through positive, feedback loops.","verdict":"keep","justification":"Covered conceptually in Chapter 2 and 7. The endocrine chapter applies it specifically with multiple clinical examples.\n\n<strong>Most important to take away:</strong> Insulin and glucagon form a negative feedback pair that controls blood glucose. When blood glucose rises → beta cells release insulin → glucose enters cells → blood glucose falls → alpha cells release glucagon → liver releases glucose → blood glucose rises. In type 1 diabetes this feedback pair is broken — no insulin → unchecked hyperglycemia → cells starve (DKA). Glucose is present in the blood but can't enter cells without insulin.","modIndex":7,"chIndex":0},{"num":102,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Describe the hormones involved in the stress response.","verdict":"keep","justification":"The book covers adrenaline (epinephrine) from the adrenal medulla and cortisol from the adrenal cortex as the primary stress hormones.\n\n<strong>Most important to take away:</strong> Adrenaline = immediate response (seconds) → tachycardia, vasoconstriction, bronchodilation, pupil dilation, glucose release from glycogen. Cortisol = sustained response (minutes to hours) → anti-inflammatory, sustains blood glucose, mobilizes energy stores. In exogenous epinephrine administration (anaphylaxis, cardiac arrest), you are mimicking the adrenaline response. Understanding the mechanism explains the drug's effects and side effects — tachycardia, hypertension, anxiety, tremor are all predictable epinephrine effects.","modIndex":7,"chIndex":0},{"num":103,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Identify the location and function of the \"master gland\" of the endocrine system, how it is regulated, and how it controls other parts of the endocrine system through the hormones that it secretes.","verdict":"skim","justification":"The book explains the pituitary is controlled by the hypothalamus and controls most other endocrine glands via stimulating hormones (TSH, ACTH, FSH, LH, GH).\n\n<strong>What to focus on:</strong> ADH (antidiuretic hormone, also called vasopressin) is released by the posterior pituitary in response to low blood pressure or high blood osmolarity — it causes the kidneys to retain water and causes vasoconstriction. This is directly relevant to fluid balance in hemorrhagic shock. Skip the detailed anterior/posterior pituitary axis for other hormones.","modIndex":7,"chIndex":0},{"num":104,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Outline the structure, function, regulation, and hormones associated with the thyroid and parathyroid glands and how metabolism and calcium homeostasis is maintained.","verdict":"keep","justification":"The book covers thyroid hormone (metabolism regulator) and parathyroid hormone (calcium regulator).\n\n<strong>Most important to take away:</strong> Thyroid storm (severe hyperthyroidism) = extreme tachycardia, hypertension, hyperthermia, altered LOC — can present like sepsis or stimulant toxicity. Myxedema coma (severe hypothyroidism) = bradycardia, hypothermia, hypotension, altered LOC — presents like a cold, altered patient of unknown cause. Hypocalcemia from hypoparathyroidism causes tetany (Chvostek's sign — facial twitch on tapping the cheek) and seizures. Hypercalcemia causes \"bones, groans, stones, and psychic moans\" — bone pain, constipation, kidney stones, and confusion.","modIndex":7,"chIndex":0},{"num":105,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Discuss disorders of the thyroid and parathyroid glands (such as hyperthyroidism, hypothyroidism, hypercalcemia, and hypocalcemia).","verdict":"keep","justification":"These are real emergency presentations you'll encounter.\n\n<strong>Most important to take away:</strong> Same as the objective above. The key clinical skill is recognizing these presentations without already knowing the patient has a thyroid disorder. A patient presenting with altered LOC, bradycardia, and hypothermia in a cold apartment — think myxedema coma even before you find the levothyroxine bottle. A patient with tachycardia, fever, and agitation who isn't obviously septic or on stimulants — thyroid storm belongs on the differential.","modIndex":7,"chIndex":0},{"num":106,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Outline the structure, function, regulation, and hormones of the adrenal glands, and how processes such as metabolism, electrolyte balance, responses to stress, and basic reproductive functions are regulated.","verdict":"keep","justification":"The book covers the adrenal cortex (aldosterone, cortisol, androgens) and medulla (adrenaline, noradrenaline).\n\n<strong>Most important to take away:</strong> Aldosterone controls sodium and water retention in the kidneys — part of the RAAS system. In Addisonian crisis, aldosterone is absent → sodium is lost → fluid depletion → hyponatremia and hypovolemia → cardiovascular collapse. These patients present with profound hypotension, nausea, vomiting, and altered LOC. They are often on chronic corticosteroid therapy (which suppresses adrenal function). A patient on steroids who develops an acute illness may not be able to mount an appropriate cortisol stress response — adrenal crisis.","modIndex":7,"chIndex":0},{"num":107,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Discuss disorders of the adrenal glands that can occur when there are problems in adrenal hormone regulation, such as Cushing's syndrome and Addison's disease.","verdict":"keep","justification":"The book explains both conditions with clinical presentations.\n\n<strong>Most important to take away:</strong> Cushing's syndrome (cortisol excess) = central obesity, moon face, buffalo hump, thin skin, easy bruising, immunosuppression, hypertension, hyperglycemia. Addison's disease (cortisol and aldosterone deficiency) = weakness, weight loss, hyperpigmentation, hypotension, hyponatremia, hyperkalemia. In a resuscitation that isn't responding — patient is hypotensive despite fluids and no obvious cause — Addisonian crisis belongs on your differential. The hyperkalemia from Addison's can also cause fatal dysrhythmias independently.","modIndex":7,"chIndex":0},{"num":108,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Outline the structure, function, regulation, and hormones of the endocrine pancreas, how blood glucose levels are regulated through insulin and glucagon.","verdict":"keep","justification":"The EMALB diabetic emergencies protocol covers both hypoglycemia and hyperglycemia explicitly, with specific drug interventions.\n\n<strong>Most important to take away:</strong> For hypoglycemia: if the patient can protect their airway → oral glucose. Unconscious or cannot swallow → D10W IV (PCP intervention) or glucagon IM/SC (EMR scope with endorsement). Know the signs: hypoglycemia = pale, diaphoretic, tachycardic, altered LOC, possibly combative. For hyperglycemia/DKA: flushed, Kussmaul breathing (deep, fast — respiratory compensation for metabolic acidosis), fruity breath (ketones), gradual onset. Treat the ABCs, give fluids if hypotensive, rapid transport.","modIndex":7,"chIndex":0},{"num":109,"modTitle":"Module 8 | Anatomy and Physiology of the Endocrine System","chName":"Chapter 9 — Endocrine System","text":"Explain disorders of the pancreas and its endocrine hormones, including diabetes.","verdict":"keep","justification":"The book distinguishes type 1 (autoimmune destruction of beta cells, no insulin production) and type 2 (insulin resistance, eventual beta cell failure).\n\n<strong>Most important to take away:</strong> Type 1 diabetics are at risk of DKA (no insulin → uncontrolled lipolysis → ketones → metabolic acidosis). Type 2 diabetics can develop HHS/HONK (hyperosmolar hyperglycaemic state — very high blood glucose without significant ketosis, extreme dehydration, altered LOC). In the field, you often can't distinguish them — treat the ABCs and glucose level, not the diabetes type. Always check blood glucose on any altered LOC patient regardless of presumed cause.","modIndex":7,"chIndex":0},{"num":110,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Chapter 16 — Excretory System","text":"Understand the organs of the excretory system — including the skin, liver, large intestine, lungs, and kidneys (renal) that eliminate waste and excess water from the body (with a focus on the kidneys), and discuss how wastes are eliminated through sweat, feces, urine, and exhaled gases.","verdict":"keep","justification":"The book frames the kidneys as primary regulators of fluid and electrolyte balance, with the lungs handling CO₂ and the skin handling minor waste.\n\n<strong>Most important to take away:</strong> The liver detoxifies drugs and metabolic waste. In liver failure, drugs accumulate to toxic levels faster — medication dosing and overdose thresholds change significantly in cirrhotic patients. The lungs are an excretory organ for CO₂ — hyperventilation blows off more CO₂ and raises pH (respiratory alkalosis). This is the mechanism of panic attack hyperventilation and of the body's compensation for metabolic acidosis.","modIndex":8,"chIndex":0},{"num":111,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Chapter 16 — Excretory System","text":"Outline the anatomy of the renal system, which includes the kidneys, ureters, bladder, and urethra and explain the main function of the renal system.","verdict":"keep","justification":"The book explains that the kidneys are retroperitoneal — behind the peritoneum, protected somewhat by the lower ribs posteriorly.\n\n<strong>Most important to take away:</strong> Retroperitoneal location means kidney injuries may not show obvious abdominal signs — pain is often in the flank rather than the abdomen. Haematuria (blood in urine) is a key indicator. Kidney stones cause colicky flank pain radiating to the groin. The right kidney is slightly lower than left (displaced by the liver). Ureters pass anterior to the iliac vessels — relevant to understanding ureteral obstruction patterns and referred pain.","modIndex":8,"chIndex":0},{"num":112,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Chapter 16 — Excretory System","text":"Outline the structure and function of the glomerulus and nephron.","verdict":"skim","justification":"The book explains the nephron as the functional unit of the kidney, with the glomerulus as the filtration component.\n\n<strong>What to focus on:</strong> The glomerular filtration rate (GFR) is the primary indicator of kidney function. Acute kidney injury (AKI) = rapid decline in GFR from pre-renal (low perfusion — shock, dehydration), intrinsic renal (direct toxin, inflammation), or post-renal (obstruction) causes. Pre-renal AKI is the most common in your patient population and is directly reversible with fluid resuscitation — one more reason to address hypovolemia aggressively. Skip the detailed tubular reabsorption steps.","modIndex":8,"chIndex":0},{"num":113,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Chapter 16 — Excretory System","text":"Explain the renin-angiotensin-aldosterone system (RAAS) and aldosterone, and how these feedback systems relate to homeostasis, renal blood flow, and urine output.","verdict":"keep","justification":"The book explains that when blood pressure or blood volume falls, the kidneys release renin → angiotensin I → ACE converts to angiotensin II → vasoconstriction + aldosterone release → kidneys retain sodium and water → blood volume and pressure rise.\n\n<strong>Most important to take away:</strong> RAAS is the body's slower but powerful BP compensation mechanism in hypovolemia — it kicks in over minutes to hours alongside the immediate sympathetic response. This is why volume-depleted patients maintain BP for a while before decompensating. Patients on ACE inhibitors (a very common antihypertensive) have a blunted RAAS response — they may decompensate faster in haemorrhage.","modIndex":8,"chIndex":0},{"num":114,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Chapter 16 — Excretory System","text":"Identify renal blood flow to and within the kidneys, how the kidneys filter the blood, retain necessary substances, produce urine, and help maintain homeostasis (such as proper ion and water balance).","verdict":"keep","justification":"The kidneys receive 20–25% of cardiac output — massive for their size and highly sensitive to perfusion changes.\n\n<strong>Most important to take away:</strong> Oliguria (reduced urine output) is one of the earliest signs of reduced renal perfusion and an early indicator of shock. \"Hasn't urinated in hours\" from a patient's history is a significant finding suggesting they've been in a low-perfusion state for some time. Renal failure causes fluid overload, acidosis, and hyperkalemia — all of which worsen cardiac function. The kidneys are both a victim and a contributor in shock physiology.","modIndex":8,"chIndex":0},{"num":115,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Chapter 16 — Excretory System","text":"Describe how urine is stored, transported, and released from the body.","verdict":"skim","justification":"The book covers the bladder as a smooth muscle reservoir and the internal/external sphincters controlling micturition.\n\n<strong>What to focus on:</strong> Urinary incontinence following trauma or altered LOC suggests either spinal cord injury (loss of voluntary sphincter control) or seizure activity. In suspected spinal cord injury patients, urinary incontinence is an important piece of history to ask about. Skip the detailed micturition reflex physiology.","modIndex":8,"chIndex":0},{"num":116,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Chapter 16 — Excretory System","text":"Discuss disorders of the renal system, including bladder infections, kidney stones, polycystic kidney disease, urinary incontinence, and kidney damage (acute kidney injury and chronic kidney injury).","verdict":"keep","justification":"These are common call types in the Lower Mainland.\n\n<strong>Most important to take away:</strong> Urosepsis from ascending UTI → pyelonephritis → bacteremia is a common cause of sepsis in elderly women. A patient presenting confused with flank pain, fever, and tachycardia may be septic from a urinary source — not just a simple UTI. Kidney stones can cause enough pain to trigger a vasovagal response (bradycardia and hypotension from pain) — don't mistake this for haemorrhagic shock. Polycystic kidney disease patients develop very large kidneys prone to rupture from relatively minor trauma.","modIndex":8,"chIndex":0},{"num":117,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Lecture — Fluid Balance and Acid-Base","text":"Define isotonic, hypotonic, and hypertonic states for fluid balance in the body and give an example of each.","verdict":"keep","justification":"Isotonic = same solute concentration as cells (normal saline 0.9%). Hypotonic = lower solute than cells → water moves INTO cells (cells swell). Hypertonic = higher solute than cells → water moves OUT of cells (cells shrink).\n\n<strong>Most important to take away:</strong> Normal saline (0.9% NaCl) is isotonic — it stays in the intravascular space and doesn't shift water into or out of cells. This is why it's the standard prehospital IV fluid. D5W (dextrose in water) is effectively hypotonic once glucose is metabolized — it distributes into all fluid compartments and is not appropriate for volume resuscitation. In cerebral edema, the goal is slightly hypertonic fluid to draw water out of swollen brain cells — this is why mannitol is used in head injury.","modIndex":8,"chIndex":1},{"num":118,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Lecture — Fluid Balance and Acid-Base","text":"Discuss osmotic, hydrostatic, and oncotic pressures as it relates to fluid balance in the body.","verdict":"keep","justification":"These forces govern fluid movement across capillary walls.\n\n<strong>Most important to take away:</strong> Hydrostatic pressure pushes fluid OUT of capillaries — elevated in heart failure → edema. Oncotic pressure (from plasma proteins, mainly albumin) pulls fluid back IN. In liver failure, albumin synthesis drops → low oncotic pressure → fluid leaks out of vessels → edema and ascites. In burns, capillary permeability increases → oncotic pressure fails to retain fluid → massive third-spacing. This is why major burn patients lose enormous amounts of intravascular fluid even without external bleeding and why early aggressive fluid resuscitation is critical.","modIndex":8,"chIndex":1},{"num":119,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Lecture — Fluid Balance and Acid-Base","text":"Identify major anions and cations found in the body, where they are found, and their roles in the body.","verdict":"keep","justification":"The main ones: Sodium (Na⁺, major extracellular cation), Potassium (K⁺, major intracellular cation), Calcium (Ca²⁺, bone/cardiac/nerve), Magnesium (Mg²⁺, cardiac/nerve), Chloride (Cl⁻, major extracellular anion), Bicarbonate (HCO₃⁻, buffer).\n\n<strong>Most important to take away:</strong> Na⁺ determines extracellular fluid osmolarity — hyponatremia causes cerebral edema and altered LOC; hypernatremia causes brain cell shrinkage. K⁺ is the cardiac ion — dysrhythmias are the lethal endpoint of both hypo- and hyperkalemia. Ca²⁺ deficiency causes tetany and dysrhythmias; toxicity causes bradycardia and confusion. Your PCP partner will be communicating about electrolyte abnormalities on every cardiac and medical call.","modIndex":8,"chIndex":1},{"num":120,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Lecture — Fluid Balance and Acid-Base","text":"Discuss pH values as it relates to hydrogen ion concentration in the body.","verdict":"keep","justification":"Normal blood pH = 7.35–7.45. Acidosis (pH < 7.35) and alkalosis (pH > 7.45) both impair enzyme function and cardiac conduction.\n\n<strong>Most important to take away:</strong> Severe acidosis (pH < 7.1) is associated with cardiac arrest. In shock, cells switch to anaerobic metabolism → lactic acid → metabolic acidosis → compensatory tachypnea. When the patient can no longer compensate (respiratory failure, exhaustion), pH drops sharply and deterioration accelerates. Your recognition of tachypnea as a compensatory sign — not just a respiratory sign — can be life-saving.","modIndex":8,"chIndex":1},{"num":121,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Lecture — Fluid Balance and Acid-Base","text":"Describe 3 buffering systems that help prevent deviations of pH in the body.","verdict":"keep","justification":"The three systems: bicarbonate buffer (fastest and most important clinically), protein buffers (haemoglobin), and phosphate buffers.\n\n<strong>Most important to take away:</strong> The bicarbonate buffer is the most clinically important: CO₂ + H₂O ↔ H₂CO₃ ↔ HCO₃⁻ + H⁺. The lungs control CO₂ (fast response, seconds to minutes). The kidneys control bicarbonate (slow response, hours to days). If a patient is acidotic from metabolic causes, the lungs compensate by blowing off CO₂ (breathing fast). This is the foundation of arterial blood gas interpretation — which your PCP partner will be communicating about at handoff.","modIndex":8,"chIndex":1},{"num":122,"modTitle":"Module 9 | Anatomy and Physiology of the Genitourinary System","chName":"Lecture — Fluid Balance and Acid-Base","text":"Explain how the lungs and the kidneys regulate acid–base balance and differentiate between respiratory and metabolic acid-base disorders and how the body compensates for deviations from normal.","verdict":"keep","justification":"This is one of the most clinically powerful concepts in the entire study guide.\n\n<strong>Most important to take away:</strong>\n<strong>Respiratory acidosis</strong> = lungs aren't blowing off CO₂ → CO₂ accumulates → pH falls. Cause: hypoventilation (opioid overdose, COPD exacerbation, severe asthma). Treatment: improve ventilation (naloxone, assisted ventilation, CPAP).\n<strong>Metabolic acidosis</strong> = excess acid or loss of bicarbonate → pH falls. Cause: shock (lactic acidosis), DKA (ketoacidosis), renal failure. Compensation: lungs hyperventilate — Kussmaul breathing.\n<strong>Respiratory alkalosis</strong> = hyperventilating → blowing off too much CO₂ → pH rises. Cause: anxiety, pain, early sepsis, head injury.\n<strong>Metabolic alkalosis</strong> = excess bicarbonate or loss of acid. Cause: vomiting (losing HCl).\n\nRecognizing the pattern helps you understand why your patient is breathing the way they are on every call.","modIndex":8,"chIndex":1},{"num":123,"modTitle":"Module 10 | Anatomy and Physiology of the Gastro-Intestinal System","chName":"Chapter 15 — Digestive System","text":"Outline the structure and function of the organs of the gastrointestinal (GI) tract through which food directly passes. This includes the mouth, pharynx, esophagus, stomach, small intestine, and large intestine.","verdict":"keep","justification":"The book traces the GI tract from oral cavity → pharynx → esophagus → stomach → small intestine (duodenum, jejunum, ileum) → large intestine (cecum, colon, rectum) → anus.\n\n<strong>Most important to take away:</strong> Know which quadrant/region each organ occupies for pain localization. Right lower quadrant = appendix. Right upper quadrant = liver, gallbladder, duodenum. Left upper quadrant = spleen, stomach, pancreatic tail. Epigastric = stomach, duodenum, pancreas. Periumbilical pain migrating to RLQ = appendicitis classic presentation. Diffuse peritonitis (rigid abdomen, guarding, rebound tenderness) = surgical emergency, rapid transport.","modIndex":9,"chIndex":0},{"num":124,"modTitle":"Module 10 | Anatomy and Physiology of the Gastro-Intestinal System","chName":"Chapter 15 — Digestive System","text":"Explain mechanical and chemical digestion, absorption of nutrients, and the elimination of solid waste.","verdict":"skim","justification":"The book covers chewing, peristalsis, and enzymatic breakdown.\n\n<strong>What to focus on:</strong> Upper GI bleeding (above the ligament of Treitz — esophagus, stomach, duodenum) produces melena (black, tarry, foul-smelling stool — digested blood) or hematemesis (vomiting blood). Lower GI bleeding produces hematochezia (bright red rectal bleeding). Melena tells you the bleed is in the upper GI tract. Hematemesis in an alcoholic suggests variceal bleeding from portal hypertension — can be catastrophically fast. Skip the detailed enzyme/digestion physiology.","modIndex":9,"chIndex":0},{"num":125,"modTitle":"Module 10 | Anatomy and Physiology of the Gastro-Intestinal System","chName":"Chapter 15 — Digestive System","text":"Outline the structure and function of the accessory organs of digestion — the liver, gallbladder, and pancreas — which secrete substances needed for digestion into the GI tract, in addition to performing other important functions.","verdict":"keep","justification":"The book covers the liver (metabolizes drugs, produces clotting factors, detoxifies, produces bile), gallbladder (stores bile), and exocrine pancreas (releases enzymes into duodenum).\n\n<strong>Most important to take away:</strong> The liver produces clotting factors — liver failure causes coagulopathy. A cirrhotic patient with a minor head injury may have catastrophic intracranial bleeding from impaired clotting. Acute cholecystitis = right upper quadrant pain, Murphy's sign (pain on deep palpation with inspiration), fever, nausea. Acute pancreatitis = epigastric pain radiating to the back, nausea and vomiting — can cause severe systemic inflammation and distributive shock.","modIndex":9,"chIndex":0},{"num":126,"modTitle":"Module 10 | Anatomy and Physiology of the Gastro-Intestinal System","chName":"Chapter 15 — Digestive System","text":"Review circulation related to the gastro-intestinal system and structures.","verdict":"keep","justification":"The book covers the portal circulation — blood from the GI tract drains into the portal vein → liver → hepatic veins → inferior vena cava.\n\n<strong>Most important to take away:</strong> In portal hypertension (from cirrhosis), pressure backs up in the portal system, causing esophageal varices (dilated veins in the esophagus). These can rupture and bleed massively — one of the most lethal GI emergencies. The patient presents with sudden massive hematemesis, often in a known alcoholic/cirrhotic. This is a catastrophic call requiring aggressive airway management and rapid transport.","modIndex":9,"chIndex":0},{"num":127,"modTitle":"Module 10 | Anatomy and Physiology of the Gastro-Intestinal System","chName":"Chapter 15 — Digestive System","text":"Discuss specializations of the tissues of the digestive system that allow it to carry out its functions.","verdict":"skip","justification":"The book covers villi, microvilli, and intestinal crypts. No prehospital clinical application.","modIndex":9,"chIndex":0},{"num":128,"modTitle":"Module 10 | Anatomy and Physiology of the Gastro-Intestinal System","chName":"Chapter 15 — Digestive System","text":"Outline how carbohydrates, proteins, and fats are digested and absorbed by the body.","verdict":"skip","justification":"The book covers enzymatic digestion in detail. Not relevant to prehospital care or any BCEHS CPG.","modIndex":9,"chIndex":0},{"num":129,"modTitle":"Module 10 | Anatomy and Physiology of the Gastro-Intestinal System","chName":"Chapter 15 — Digestive System","text":"Explain how the beneficial bacteria that live in the GI tract and help us digest food, produce vitamins, and protect us from harmful pathogens and toxic substances.","verdict":"skip","justification":"Interesting microbiome content. Not in EMALB or BCEHS prehospital scope.","modIndex":9,"chIndex":0},{"num":130,"modTitle":"Module 10 | Anatomy and Physiology of the Gastro-Intestinal System","chName":"Chapter 15 — Digestive System","text":"Discuss major vitamins and how they contribute to homeostasis.","verdict":"skip","justification":"Not in prehospital scope. Nutritional deficiency presentations (e.g. Wernicke's encephalopathy from thiamine deficiency in alcoholics) are relevant but are better learned in the clinical context of toxicology and neurology, not from a vitamin chart.","modIndex":9,"chIndex":0},{"num":131,"modTitle":"Module 10 | Anatomy and Physiology of the Gastro-Intestinal System","chName":"Chapter 15 — Digestive System","text":"Discuss disorders of the digestive system, including inflammatory bowel diseases, ulcers, diverticulitis, and gastroenteritis.","verdict":"keep","justification":"Common call presentations in the Lower Mainland.\n\n<strong>Most important to take away:</strong> Ulcers — gastric or duodenal — can perforate (sudden onset of severe constant abdominal pain, peritonitis, rapid deterioration) or bleed (melena, hematemesis, hypotension). A perforation is a surgical emergency. Diverticulitis = LLQ pain, fever, change in bowel habits — can perforate and cause peritonitis. Gastroenteritis causing severe vomiting and diarrhea → dehydration → hypovolemia → shock — especially dangerous in elderly, very young, and immunocompromised. IBD patients are often on immunosuppressants and can develop toxic megacolon (abdominal distension, fever, shock).","modIndex":9,"chIndex":0},{"num":132,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Outline the functions of the reproductive system, which includes the production and fertilization of gametes (eggs and sperm), the production of sex hormones by the gonads (testes and ovaries), and, in females, the carrying of a fetus.","verdict":"skim","justification":"Basic orientation. The clinical relevance is the endocrine function — gonads produce sex hormones that affect bone density, cardiovascular risk, and mood.\n\n<strong>What to focus on:</strong> Know this section exists and what it covers at a high level. The obstetric content later in this chapter is what matters operationally.","modIndex":10,"chIndex":0},{"num":133,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Explain how the male and female reproductive systems differentiate in the embryo and fetus, and how they mature during puberty.","verdict":"skip","justification":"Developmental biology. No prehospital relevance.","modIndex":10,"chIndex":0},{"num":134,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Label and describe the structures of the male reproductive system, including the testes, epididymis, vas deferens, ejaculatory ducts, seminal vesicles, prostate gland, bulbourethral glands, and the penis.","verdict":"skim","justification":"Know the basic anatomy for two specific clinical presentations:\n\n<strong>What to focus on:</strong> Testicular torsion = severe acute scrotal pain, often in adolescent males, nausea, elevated testicle — surgical emergency within 6 hours to save the testicle. Do not dismiss scrotal pain as minor. Priapism (prolonged painful erection) can occur in sickle cell disease (sickling in penile vasculature) and requires urgent urological intervention. Skip memorizing the seminal vesicles and bulbourethral gland detail.","modIndex":10,"chIndex":0},{"num":135,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Discuss how sperm are produced, how they mature, how they are stored, and how they are deposited into the female.","verdict":"skip","justification":"No prehospital relevance.","modIndex":10,"chIndex":0},{"num":136,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Describe the fluids in semen that protect and nourish sperm, and where those fluids are produced.","verdict":"skip","justification":"No prehospital relevance.","modIndex":10,"chIndex":0},{"num":137,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Discuss disorders of the male reproductive system, including erectile dysfunction, epididymitis, prostate cancer, and testicular cancer.","verdict":"skim","justification":"Epididymitis presents similarly to testicular torsion — scrotal pain and swelling.\n\n<strong>What to focus on:</strong> Distinguishing torsion from epididymitis matters because torsion is a surgical emergency and epididymitis is not. Torsion = sudden onset severe pain, often in adolescents. Epididymitis = more gradual onset in sexually active adults with fever. When in doubt, treat as torsion. Skip the prostate and testicular cancer content.","modIndex":10,"chIndex":0},{"num":138,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Label and describe the structures of the female reproductive system, including the ovaries, fallopian tubes, uterus, cervix, vagina, and external structures of the vulva.","verdict":"keep","justification":"The book covers ovaries, fallopian tubes, uterus, cervix, vagina, and external structures.\n\n<strong>Most important to take away:</strong> Ectopic pregnancy is the critical emergency — a fertilized egg implants in the fallopian tube instead of the uterus. The tube ruptures as the embryo grows → massive intraperitoneal hemorrhage → hemorrhagic shock. Presentation: lower abdominal pain (often one-sided), missed or abnormal period, vaginal bleeding, shoulder tip pain (diaphragmatic irritation from blood). Any woman of reproductive age with abdominal pain, hypotension, and tachycardia = ectopic pregnancy until proven otherwise.","modIndex":10,"chIndex":0},{"num":139,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Explain how eggs are produced in the female fetus, and how they then mature after puberty through the process of ovulation.","verdict":"skip","justification":"Reproductive biology. No prehospital relevance.","modIndex":10,"chIndex":0},{"num":140,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Understand the menstrual cycle, its purpose, and the hormones that control it.","verdict":"skim","justification":"LMP (last menstrual period) is a standard assessment question for all women of reproductive age.\n\n<strong>What to focus on:</strong> LMP helps estimate pregnancy likelihood (ectopic risk, gestational age) and can explain abnormal bleeding or pain presentations. You don't need to know the hormonal cycle in detail — just understand why you ask the question and what you do with the answer.","modIndex":10,"chIndex":0},{"num":141,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Outline how fertilization and implantation occur, the stages of pregnancy and childbirth, and how the mother's body produces milk to feed the baby.","verdict":"keep","justification":"The EMALB includes an emergency childbirth endorsement. This content is directly in scope.\n\n<strong>Most important to take away:</strong> Three stages of labour — first (cervical dilation, longest), second (pushing/delivery), third (placenta delivery). Signs of imminent delivery: regular strong contractions, urge to push, crowning. Your role in emergency delivery: support the head, check for nuchal cord (cord around neck — gently loop it over), support the body, keep warm, dry and stimulate the newborn. Complications to recognize: shoulder dystocia (head delivers but shoulders are stuck), postpartum haemorrhage (most common cause of maternal mortality — uterine atony, blood-soaked pads, hypotension post-delivery), prolapsed cord (cord visible before baby — elevate presenting part, do not push cord back, rapid transport in knee-chest position). Pre-eclampsia (hypertension, headache, visual disturbance, RUQ pain in pregnancy) and eclampsia (seizures) = obstetric emergencies requiring rapid transport.","modIndex":10,"chIndex":0},{"num":142,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Discuss disorders of the female reproductive system, including cervical cancer, endometriosis, and vaginitis (including yeast infections).","verdict":"skim","justification":"Endometriosis is the only one with direct clinical relevance to your work.\n\n<strong>What to focus on:</strong> Endometriosis causes severe cyclical pelvic pain — these patients may call 911 believing something acute is happening. Knowing it exists as a cause of severe pelvic pain helps you avoid anchoring on an acute abdomen when the patient describes a chronic cyclical pattern. Ectopic pregnancy is the emergency — endometriosis is not — but the pain can be indistinguishable without imaging.","modIndex":10,"chIndex":0},{"num":143,"modTitle":"Module 11 | Anatomy and Physiology of the Reproductive System","chName":"Chapter 18 — Reproductive System","text":"Discuss forms of contraception (birth control), including barrier methods (such as condoms), hormonal methods (such as the birth control pill), behavioural methods, intrauterine devices, and sterilization.","verdict":"skip","justification":"Not in EMALB or BCEHS prehospital scope. Skip entirely.","modIndex":10,"chIndex":0}];
const TOTAL = 143;

// Build DOM
const container = document.getElementById('mainContent');
let currentModTitle = null;
let currentModDiv = null;
let currentChName = null;
let currentChBlock = null;

data.forEach(row => {
  if (row.modTitle !== currentModTitle) {
    currentModTitle = row.modTitle;
    currentModDiv = document.createElement('div');
    currentModDiv.className = `module module-${row.modIndex + 1}`;
    currentModDiv.dataset.mod = row.modIndex;
    const parts = row.modTitle.split(' | ');
    const h2 = document.createElement('h2');
    h2.className = 'module-heading';
    h2.innerHTML = '<span class="mod-tag">' + parts[0] + '</span>' + (parts[1] || '');
    currentModDiv.appendChild(h2);
    container.appendChild(currentModDiv);
    currentChName = null;
  }

  if (row.chName !== currentChName) {
    currentChName = row.chName;
    currentChBlock = document.createElement('div');
    currentChBlock.className = 'chapter-block';
    currentChBlock.dataset.ch = row.chIndex;

    const chHeader = document.createElement('div');
    chHeader.className = 'chapter-header';
    chHeader.textContent = row.chName;
    currentChBlock.appendChild(chHeader);

    const colHeader = document.createElement('div');
    colHeader.className = 'col-header-row';
    colHeader.innerHTML = '<div class="col-center">#</div><div class="col-center">Flag</div><div>Learning Objective</div><div class="col-center">Justification</div><div class="col-center">Target Date</div><div class="col-center">Done</div>';
    currentChBlock.appendChild(colHeader);
    currentModDiv.appendChild(currentChBlock);
  }

  const objDiv = document.createElement('div');
  objDiv.className = 'obj-row';
  objDiv.dataset.id = row.num;
  objDiv.dataset.verdict = row.verdict;

  // ── Build cells ──

  // Num
  const numCell = document.createElement('div');
  numCell.className = 'num-cell';
  numCell.textContent = row.num;

  // Verdict
  const verdictCell = document.createElement('div');
  verdictCell.className = 'verdict-cell';
  const badge = document.createElement('span');
  badge.className = 'verdict-badge verdict-' + row.verdict;
  badge.textContent = row.verdict === 'keep' ? 'Keep' : row.verdict === 'skim' ? 'Skim' : 'Skip';
  verdictCell.appendChild(badge);

  // Done checkbox
  const doneCell = document.createElement('div');
  doneCell.className = 'done-cell';
  const label = document.createElement('label');
  label.className = 'check-wrap';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  const box = document.createElement('div');
  box.className = 'check-box';
  cb.addEventListener('change', () => {
    objDiv.classList.toggle('completed', cb.checked);
    updateCounter();
    saveState();
  });
  label.appendChild(cb);
  label.appendChild(box);
  doneCell.appendChild(label);

  // Text
  const textCell = document.createElement('div');
  textCell.className = 'obj-text-cell';
  textCell.textContent = row.text;

  // Justification
  const justCell = document.createElement('div');
  justCell.className = 'just-cell';
  const toggleBtn = document.createElement('button');
  toggleBtn.className = 'just-toggle';
  toggleBtn.textContent = 'Why →';
  const panel = document.createElement('div');
  panel.className = 'just-panel';
  const closeBtn = document.createElement('button');
  closeBtn.className = 'just-panel-close';
  closeBtn.innerHTML = '&times;';
  closeBtn.onclick = (e) => { e.stopPropagation(); panel.classList.remove('open'); toggleBtn.textContent = 'Why →'; };
  panel.appendChild(closeBtn);
  const content = document.createElement('div');
  content.innerHTML = row.justification.replace(/\n\n/g, '<br><br>').replace(/\n/g, '<br>');
  panel.appendChild(content);
  toggleBtn.onclick = (e) => {
    e.stopPropagation();
    const isOpen = panel.classList.contains('open');
    document.querySelectorAll('.just-panel.open').forEach(p => {
      p.classList.remove('open');
      const b = p.previousElementSibling;
      if (b) b.textContent = 'Why →';
    });
    if (!isOpen) {
      panel.classList.add('open');
      toggleBtn.textContent = 'Close ✕';
      if (window.innerWidth > 600) {
        // Desktop: position beside the button
        const rect = toggleBtn.getBoundingClientRect();
        const panelW = 500;
        const margin = 8;
        let left = rect.right + margin;
        if (left + panelW > window.innerWidth - margin) left = rect.left - panelW - margin;
        if (left < margin) left = margin;
        let top = rect.top;
        const maxTop = window.innerHeight * 0.25;
        if (top > maxTop) top = maxTop;
        panel.style.left = left + 'px';
        panel.style.top = top + 'px';
        panel.style.transform = '';
        panel.style.right = '';
      }
      // Mobile: CSS handles centering via fixed+transform
    }
  };
  justCell.appendChild(toggleBtn);
  justCell.appendChild(panel);

  // Date
  const dateCell = document.createElement('div');
  dateCell.className = 'date-cell';
  const dateInp = document.createElement('input');
  dateInp.type = 'date';
  dateInp.title = 'Target completion date';
  dateInp.addEventListener('change', saveState);
  dateCell.appendChild(dateInp);

  // Flat DOM — CSS order handles mobile card layout, grid handles desktop
  objDiv.appendChild(numCell);
  objDiv.appendChild(verdictCell);
  objDiv.appendChild(textCell);
  objDiv.appendChild(justCell);
  objDiv.appendChild(dateCell);
  objDiv.appendChild(doneCell);

  currentChBlock.appendChild(objDiv);
});

// Close panels on outside click
document.addEventListener('click', () => {
  document.querySelectorAll('.just-panel.open').forEach(p => {
    p.classList.remove('open');
    const btn = p.previousElementSibling;
    if (btn) btn.textContent = 'Why →';
  });
});

// FILTER — multi-select
const activeFilters = new Set(['all']);

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const f = btn.dataset.filter;

    if (f === 'all') {
      // All button clears everything else and resets to all
      activeFilters.clear();
      activeFilters.add('all');
    } else {
      // Remove 'all' when a specific filter is picked
      activeFilters.delete('all');
      if (activeFilters.has(f)) {
        activeFilters.delete(f);
        // If nothing left, go back to all
        if (activeFilters.size === 0) activeFilters.add('all');
      } else {
        activeFilters.add(f);
      }
    }

    // Update button active states
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.toggle('active', activeFilters.has(b.dataset.filter));
    });

    applyFilter();
  });
});

function applyFilter() {
  const showAll = activeFilters.has('all');
  const showDone = activeFilters.has('done');
  const verdicts = new Set(['keep', 'skim', 'skip'].filter(v => activeFilters.has(v)));

  document.querySelectorAll('.obj-row').forEach(row => {
    const isDone = row.classList.contains('completed');
    const verdict = row.dataset.verdict;

    if (showAll) {
      row.classList.remove('hidden');
    } else {
      const passVerdict = verdicts.size === 0 || verdicts.has(verdict);
      const passDone = !showDone || isDone;
      // Row is visible if it passes both verdict filter AND done filter
      // If only done is selected: show completed rows regardless of verdict
      // If verdict + done: show rows that match verdict AND are done
      let visible;
      if (verdicts.size > 0 && showDone) {
        visible = verdicts.has(verdict) && isDone;
      } else if (showDone) {
        visible = isDone;
      } else {
        visible = verdicts.has(verdict);
      }
      row.classList.toggle('hidden', !visible);
    }
  });

  // Hide chapter blocks with all hidden rows
  document.querySelectorAll('.chapter-block').forEach(block => {
    const rows = block.querySelectorAll('.obj-row');
    const anyVisible = [...rows].some(r => !r.classList.contains('hidden'));
    block.style.display = anyVisible ? '' : 'none';
  });
  // Hide module headings with all hidden blocks
  document.querySelectorAll('.module').forEach(mod => {
    const blocks = mod.querySelectorAll('.chapter-block');
    const anyVisible = [...blocks].some(b => b.style.display !== 'none');
    const heading = mod.querySelector('.module-heading');
    if (heading) heading.style.display = anyVisible ? '' : 'none';
  });
}

// COUNTER
function updateCounter() {
  const done = document.querySelectorAll('input[type="checkbox"]:checked').length;
  document.getElementById('doneCount').textContent = done;
  const pct = Math.round((done / TOTAL) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
}

};

const db = getDatabase(app);
const STATE_REF = ref(db, 'para1101/state');
let isSyncing = false;

function saveState() {
  const state = {};
  document.querySelectorAll('.obj-row').forEach(row => {
    const id = row.dataset.id;
    const cb = row.querySelector('input[type="checkbox"]');
    const dateInp = row.querySelector('input[type="date"]');
    state[id] = { done: cb.checked, date: dateInp ? dateInp.value : '' };
  });
  try { localStorage.setItem('para1101_v2_state', JSON.stringify(state)); } catch(e) {}
  set(STATE_REF, state).catch(err => console.error('Firebase save error:', err));
}

function applyState(state) {
  if (!state) return;
  isSyncing = true;
  document.querySelectorAll('.obj-row').forEach(row => {
    const id = row.dataset.id;
    if (!state[id]) return;
    const cb = row.querySelector('input[type="checkbox"]');
    const dateInp = row.querySelector('input[type="date"]');
    if (state[id].done) { cb.checked = true; row.classList.add('completed'); }
    else { cb.checked = false; row.classList.remove('completed'); }
    if (dateInp && state[id].date) dateInp.value = state[id].date;
  });
  updateCounter();
  isSyncing = false;
}

onValue(STATE_REF, (snapshot) => { if (!isSyncing) applyState(snapshot.val()); });

(function loadLocal() {
  let state;
  try { state = JSON.parse(localStorage.getItem('para1101_v2_state') || 'null'); } catch(e) {}
  if (state) applyState(state);
})();
</script>
</body>
</html>
