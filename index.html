<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARA-1101 A&P Study Planner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0f2d4a;
    --blue: #1a5c8a;
    --mid: #2d88c0;
    --light: #e8f3fb;
    --accent: #d4a853;
    --green: #2a7a4b;
    --green-bg: #edf7f1;
    --green-dark: #1e5c38;
    --amber: #b86c00;
    --amber-bg: #fff8ec;
    --amber-border: #f0c060;
    --red: #b83232;
    --red-bg: #fdf0f0;
    --red-border: #e8a0a0;
    --row-alt: #f7fbff;
    --border: #b8d4ea;
    --text: #1a2535;
    --muted: #6b7f95;
    --white: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #f0f5fa; color: var(--text); min-height: 100vh; font-size: 16px; }

  /* STICKY HEADER */
  .sticky-header {
    position: sticky; top: 0; z-index: 200;
    background: var(--navy);
    box-shadow: 0 4px 20px rgba(15,45,74,0.35);
    width: 100%;
  }
  .header-inner {
    max-width: 1280px; margin: 0 auto;
    padding: 14px 32px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
  }
  .header-title h1 { font-family: 'DM Serif Display', serif; font-size: 1.45rem; color: white; letter-spacing: 0.02em; }
  .header-title p { font-size: 0.88rem; color: #8ab4d0; margin-top: 2px; font-weight: 300; }

  .header-stats { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }

  .stat-pill {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.13);
    border-radius: 8px; padding: 6px 14px; text-align: center;
  }
  .stat-num { font-family: 'DM Serif Display', serif; font-size: 1.6rem; color: var(--accent); line-height: 1; }
  .stat-label { font-size: 0.65rem; color: #8ab4d0; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2px; }

  .progress-section { min-width: 160px; }
  .progress-label { font-size: 0.65rem; color: #8ab4d0; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 5px; }
  .progress-track { height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--mid), var(--accent)); width: 0%; transition: width 0.4s cubic-bezier(0.4,0,0.2,1); border-radius: 3px; }
  .progress-pct { font-size: 0.72rem; color: #8ab4d0; text-align: right; margin-top: 4px; }

  /* FILTER BAR */
  .filter-bar {
    background: white; border-bottom: 1px solid var(--border);
    position: sticky; top: 68px; z-index: 100;
    box-shadow: 0 2px 8px rgba(15,45,74,0.08);
  }
  @media (max-width: 600px) {
    .filter-bar { top: 0; position: sticky; }
    .sticky-header { position: relative; } /* don't stick on mobile — let filter bar stick at top */
  }
  .filter-inner {
    max-width: 1280px; margin: 0 auto;
    padding: 10px 32px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .filter-label { font-size: 0.88rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-right: 4px; }
  .filter-btn {
    border: none; border-radius: 6px; padding: 6px 16px;
    font-size: 0.9rem; font-family: 'DM Sans', sans-serif; font-weight: 600;
    cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px;
  }
  .filter-btn.all { background: var(--navy); color: white; }
  .filter-btn.keep { background: var(--green-bg); color: var(--green-dark); border: 1px solid #a0d4b8; }
  .filter-btn.skim { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
  .filter-btn.skip { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .filter-btn.done { background: #f0f0f0; color: #666; border: 1px solid #ccc; }
  .filter-btn.active { box-shadow: 0 0 0 2px var(--mid); }
  .filter-btn .count { opacity: 0.7; font-weight: 400; }

  /* CONTAINER */
  .container { max-width: 1280px; margin: 0 auto; padding: 32px 32px 80px; }

  /* MODULE */
  .module { margin-bottom: 44px; }
  .module-heading {
    font-family: 'DM Serif Display', serif; font-size: 1.4rem; color: var(--navy);
    margin-bottom: 18px; padding-bottom: 10px; border-bottom: 3px solid var(--mid);
    display: flex; align-items: center; gap: 12px;
  }
  .mod-tag {
    font-size: 0.68rem; font-family: 'DM Sans', sans-serif; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    background: var(--mid); color: white; padding: 3px 10px; border-radius: 3px; flex-shrink: 0;
  }

  /* CHAPTER BLOCK */
  .chapter-block { margin-bottom: 20px; border-radius: 8px; overflow: visible; box-shadow: 0 2px 10px rgba(15,45,74,0.1); }
  .chapter-header {
    background: var(--blue); color: white;
    padding: 10px 16px; font-family: 'DM Serif Display', serif; font-size: 1rem;
  }

  /* COLUMN HEADER ROW */
  .col-header-row {
    display: grid;
    grid-template-columns: 52px 52px 1fr 130px 130px 100px 76px;
    background: #1a4a6e;
    font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: rgba(255,255,255,0.85);
  }
  .col-header-row > div { padding: 8px 12px; border-right: 1px solid rgba(255,255,255,0.1); }
  .col-header-row > div:last-child { border-right: none; }
  .col-center { text-align: center; }

  /* OBJ ROW */
  .obj-row {
    display: grid;
    grid-template-columns: 52px 52px 1fr 130px 130px 100px 76px;
    border-top: 1px solid var(--border);
    transition: background 0.12s;
  }
  .obj-row:nth-child(even) { background: var(--row-alt); }
  .obj-row:nth-child(odd) { background: white; }
  .obj-row:hover { background: #deeef9; }
  .obj-row.completed { background: var(--green-bg) !important; }
  .obj-row.completed .obj-text-cell { color: var(--muted); }
  .obj-row.hidden { display: none; }

  .obj-row > div {
    padding: 11px 14px;
    font-size: 1rem;
    border-right: 1px solid var(--border);
    display: flex; align-items: flex-start;
  }
  .obj-row > div:last-child { border-right: none; }

  /* NUM cell */
  .num-cell {
    justify-content: center; align-items: center;
    font-weight: 700; font-size: 0.9rem; color: var(--blue);
    background: var(--light) !important;
    flex-shrink: 0;
  }
  .obj-row.completed .num-cell { background: #c8ead8 !important; color: var(--green); }

  /* VERDICT badge */
  .verdict-cell { justify-content: center; align-items: center; }
  .verdict-badge {
    display: inline-block; padding: 3px 8px; border-radius: 4px;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    white-space: nowrap;
  }
  .verdict-keep { background: var(--green-bg); color: var(--green-dark); border: 1px solid #a0d4b8; }
  .verdict-skim { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
  .verdict-skip { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }

  /* OBJ TEXT */
  .obj-text-cell { line-height: 1.5; color: var(--text); }

  /* JUSTIFICATION */
  .just-cell { flex-direction: column; position: relative; }
  .just-toggle {
    background: var(--light); border: 1px solid var(--border); border-radius: 5px;
    padding: 5px 12px; font-size: 0.84rem; font-weight: 600; color: var(--blue);
    cursor: pointer; white-space: nowrap; font-family: 'DM Sans', sans-serif;
    transition: all 0.15s; width: 100%;
  }
  .just-toggle:hover { background: var(--mid); color: white; border-color: var(--mid); }
  .just-panel {
    display: none; position: fixed; z-index: 500;
    background: white; border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 32px rgba(15,45,74,0.22);
    padding: 18px 20px; width: 520px; max-width: 92vw;
    font-size: 1rem; line-height: 1.75; color: var(--text);
    max-height: 70vh; overflow-y: auto;
  }
  .just-panel.open { display: block; }
  .just-panel strong { color: var(--navy); }
  .just-panel-close {
    float: right; background: none; border: none; font-size: 1.1rem;
    cursor: pointer; color: var(--muted); margin: -4px -4px 8px 8px; line-height: 1;
  }
  .just-panel p + p { margin-top: 8px; }

  /* DATE */
  .date-cell input[type="date"] {
    border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px;
    font-size: 0.88rem; font-family: 'DM Sans', sans-serif; color: var(--text);
    background: white; width: 100%; cursor: pointer;
  }
  .date-cell input:focus { outline: none; border-color: var(--mid); box-shadow: 0 0 0 2px rgba(45,136,192,0.18); }

  /* DONE */
  .done-cell { justify-content: center; align-items: center; }
  .check-wrap { position: relative; width: 26px; height: 26px; cursor: pointer; flex-shrink: 0; }
  .check-wrap input[type="checkbox"] { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; margin: 0; }
  .check-box {
    width: 26px; height: 26px; border: 2px solid var(--border); border-radius: 5px;
    background: white; display: flex; align-items: center; justify-content: center; transition: all 0.15s;
    pointer-events: none;
  }
  .check-wrap input:checked ~ .check-box { background: var(--green); border-color: var(--green); }
  .check-wrap input:checked ~ .check-box::after {
    content: ''; display: block; width: 6px; height: 11px;
    border: 2px solid white; border-top: none; border-left: none;
    transform: rotate(45deg) translate(-1px,-1px);
  }
  .check-wrap:hover .check-box { border-color: var(--mid); box-shadow: 0 0 0 3px rgba(45,136,192,0.15); }

  /* ── MODULE COLOUR THEMES ── */
  .module-1  .module-heading .mod-tag { background: #3892cc; }
  .module-1  .module-heading          { border-color: #67ccff; }
  .module-1  .chapter-header          { background: #3892cc; }

  .module-2  .module-heading .mod-tag { background: #29a575; }
  .module-2  .module-heading          { border-color: #4eefad; }
  .module-2  .chapter-header          { background: #29a575; }

  .module-3  .module-heading .mod-tag { background: #9464cc; }
  .module-3  .module-heading          { border-color: #dca2ff; }
  .module-3  .chapter-header          { background: #9464cc; }

  .module-4  .module-heading .mod-tag { background: #e05f13; }
  .module-4  .module-heading          { border-color: #ff923a; }
  .module-4  .chapter-header          { background: #e05f13; }

  .module-5  .module-heading .mod-tag { background: #ea4e4e; }
  .module-5  .module-heading          { border-color: #ff8e88; }
  .module-5  .chapter-header          { background: #ea4e4e; }

  .module-6  .module-heading .mod-tag { background: #81c027; }
  .module-6  .module-heading          { border-color: #ccff4e; }
  .module-6  .chapter-header          { background: #81c027; }

  .module-7  .module-heading .mod-tag { background: #cf407e; }
  .module-7  .module-heading          { border-color: #ff73b7; }
  .module-7  .chapter-header          { background: #cf407e; }

  .module-8  .module-heading .mod-tag { background: #30af9c; }
  .module-8  .module-heading          { border-color: #5ffce0; }
  .module-8  .chapter-header          { background: #30af9c; }

  .module-9  .module-heading .mod-tag { background: #6d70d6; }
  .module-9  .module-heading          { border-color: #afb2ff; }
  .module-9  .chapter-header          { background: #6d70d6; }

  .module-10 .module-heading .mod-tag { background: #cf4e75; }
  .module-10 .module-heading          { border-color: #ff86a5; }
  .module-10 .chapter-header          { background: #cf4e75; }

  .module-11 .module-heading .mod-tag { background: #18afcc; }
  .module-11 .module-heading          { border-color: #30f4ff; }
  .module-11 .chapter-header          { background: #18afcc; }

  .module-1  .col-header-row { background: #2970a8; }
  .module-2  .col-header-row { background: #1e7d59; }
  .module-3  .col-header-row { background: #7048a8; }
  .module-4  .col-header-row { background: #b04a0e; }
  .module-5  .col-header-row { background: #c03a3a; }
  .module-6  .col-header-row { background: #609018; }
  .module-7  .col-header-row { background: #a83060; }
  .module-8  .col-header-row { background: #228a78; }
  .module-9  .col-header-row { background: #5254b0; }
  .module-10 .col-header-row { background: #a83858; }
  .module-11 .col-header-row { background: #1290a8; }

  /* ── TABLET ── */
  @media (max-width: 900px) {
    .col-header-row, .obj-row { grid-template-columns: 44px 52px 1fr 110px 80px 76px; }
    .date-cell { display: none; }
    .just-panel { width: 92vw; }
  }

  /* ── MOBILE ── */
  @media (max-width: 600px) {
    body { font-size: 15px; }

    .header-inner {
      flex-direction: column; align-items: flex-start;
      padding: 12px 16px 10px; gap: 10px;
    }
    .header-title h1 { font-size: 1.1rem; }
    .header-title p { font-size: 0.78rem; }
    .header-stats { width: 100%; justify-content: space-between; }
    .stat-pill { padding: 4px 10px; }
    .stat-num { font-size: 1.3rem; }
    .progress-section { flex: 1; min-width: 0; }

    .sticky-header { position: relative; }
    .filter-bar { top: 0; }
    .filter-inner { padding: 8px 12px; gap: 8px; }
    .filter-label { display: none; }
    .filter-btn { padding: 5px 11px; font-size: 0.82rem; }

    .container { padding: 16px 12px 60px; }
    .module { margin-bottom: 28px; }
    .module-heading { font-size: 1.1rem; gap: 8px; }
    .chapter-header { font-size: 0.9rem; padding: 8px 12px; }
    .chapter-block { border-radius: 6px; }
    .col-header-row { display: none; }

    /* Card layout using CSS order + flex-wrap.
       Visual layout per card:
         [#] | [KEEP badge]          [☐ checkbox]   ← row 1
         Objective text (full width)                 ← row 2
         [Why →]  [date input]                       ← row 3
    */
    .obj-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      padding: 10px 12px 0;
    }

    .obj-row > div {
      border-right: none !important;
      padding: 0 !important;
      font-size: 0.92rem;
    }

    /* Row 1 — number */
    .num-cell {
      order: 1;
      flex: 0 0 auto;
      background: transparent !important;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      padding-right: 10px !important;
      margin-right: 2px;
      border-right: 1px solid var(--border) !important;
      align-self: center;
      justify-content: center;
      min-width: 30px;
    }
    .obj-row.completed .num-cell { background: transparent !important; color: var(--green); }

    /* Row 1 — verdict badge */
    .verdict-cell {
      order: 2;
      flex: 0 0 auto;
      padding-left: 12px !important;
      align-self: center;
    }

    /* Row 1 — done checkbox pushed right */
    .done-cell {
      order: 3;
      flex: 0 0 auto;
      margin-left: auto;
      align-self: center;
    }

    /* Row 2 — objective text, full width */
    .obj-text-cell {
      order: 4;
      flex: 0 0 100%;
      padding: 10px 0 10px !important;
      line-height: 1.55;
    }

    /* Row 3 — Why button */
    .just-cell {
      order: 5;
      flex: 0 0 auto;
      padding-bottom: 14px !important;
      padding-top: 2px !important;
      align-self: center;
    }
    .just-toggle { font-size: 0.85rem; padding: 7px 16px; width: auto; }

    /* Row 3 — date input */
    .date-cell {
      order: 6;
      flex: 1;
      padding-left: 10px !important;
      padding-bottom: 14px !important;
      padding-top: 2px !important;
      display: flex;
    }
    .date-cell input[type="date"] { font-size: 0.84rem; width: 100%; padding: 6px 8px; }

    /* Justification panel: centered modal */
    .just-panel {
      position: fixed;
      left: 8px !important; right: 8px !important;
      top: 50% !important;
      transform: translateY(-50%);
      width: auto !important;
      max-height: 75vh;
      font-size: 0.93rem;
      line-height: 1.65;
      z-index: 9999;
    }
  }

</style>
</head>
<body>

<div class="sticky-header">
  <div class="header-inner">
    <div class="header-title">
      <h1>PARA-1101 &mdash; Anatomy &amp; Physiology</h1>
      <p>Self-Study Planner &nbsp;&middot;&nbsp; Primary Care Paramedic Program &nbsp;&middot;&nbsp; Based on EMALB &amp; BCEHS CPGs</p>
    </div>
    <div class="header-stats">
      <div class="stat-pill">
        <div class="stat-num" id="doneCount">0</div>
        <div class="stat-label">Complete</div>
      </div>
      <div class="stat-pill">
        <div class="stat-num" style="color:#8ab4d0">143</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="progress-section">
        <div class="progress-label">Overall Progress</div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-pct" id="progressPct">0%</div>
      </div>
    </div>
  </div>
</div>

<div class="filter-bar">
  <div class="filter-inner">
    <span class="filter-label">Filter:</span>
    <button class="filter-btn all active" data-filter="all">All <span class="count">(143)</span></button>
    <button class="filter-btn keep" data-filter="keep">✅ Keep <span class="count">(84)</span></button>
    <button class="filter-btn skim" data-filter="skim">⚪ Skim <span class="count">(26)</span></button>
    <button class="filter-btn skip" data-filter="skip">❌ Skip <span class="count">(33)</span></button>
    <button class="filter-btn done" data-filter="done">☑ Done</button>
  </div>
</div>

<div class="container" id="mainContent"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

const data = [{"num":1,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 2 — Biology: The Study of Life","text":"Define homeostasis.","verdict":"keep","justification":"The book defines homeostasis as a \"more-or-less steady state\" maintained by continuous monitoring and adjustment. Every single patient you treat is someone whose homeostasis is failing to some degree. Shock, hypoxia, hypoglycemia, hypothermia, sepsis — all of these are homeostatic failures. When your PCP partner says \"this patient is compensating,\" they mean the body's feedback mechanisms are still fighting to maintain homeostasis but losing. Know this concept cold.\n\n<strong>Most important to take away:</strong> the four components — stimulus, sensor, control centre, effector — and that the body is always trying to return to a set point. When it can't, that's your patient deteriorating.","modIndex":0,"chIndex":0},{"num":2,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 2 — Biology: The Study of Life","text":"Describe positive and negative feedback loop mechanisms and provide an example of each.","verdict":"keep","justification":"The book covers this with two clinical examples that directly apply to your work. Negative feedback is used for almost everything — blood glucose, blood pressure, body temperature. Positive feedback is rare but includes blood clotting (relevant to hemorrhage calls) and childbirth (obstetric emergencies).\n\n<strong>Most important to take away:</strong> Negative feedback = corrective, keeps things in range. Positive feedback = amplifying, drives a process to completion. Know the blood glucose example in detail — insulin released when glucose rises, glucagon released when glucose falls. This is the exact mechanism behind the EMALB diabetic emergencies protocol and explains why a hypoglycemic patient deteriorates fast when glucagon stores are depleted.","modIndex":0,"chIndex":0},{"num":3,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 3 — Biological Molecules","text":"Define the nature of chemical substances, including elements, compounds, and their component atoms and molecules.","verdict":"skip","justification":"The book spends several pages on atomic structure, electrons, and ionic vs covalent bonds. None of this appears in any BCEHS CPG or EMALB protocol. It's chemistry for chemistry's sake at this level.","modIndex":0,"chIndex":1},{"num":4,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 3 — Biological Molecules","text":"Identify the structures and functions of biochemical compounds, including carbohydrates, lipids, proteins, and nucleic acids (such as DNA and RNA).","verdict":"skim","justification":"The book covers all four in detail. The only clinically relevant takeaway is: glucose is the primary fuel for the brain and body, and the brain is almost entirely dependent on it. This is why hypoglycemia causes altered LOC and why dextrose (D10W) is in the EMALB drug monographs. You don't need to know the structure of triglycerides or the difference between saturated and unsaturated fats.\n\n<strong>What to focus on:</strong> Read section 3.4 on carbohydrates for the glucose/glycogen relationship. Glycogen is how the body stores glucose in the liver and muscles. When blood glucose drops, glycogen is broken down by glucagon. When glycogen stores are depleted — chronic alcoholics, malnourished patients, prolonged hypoglycemia — glucagon becomes ineffective and IV dextrose is the only treatment. This comes up directly in the EMALB diabetic protocol.","modIndex":0,"chIndex":1},{"num":5,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 3 — Biological Molecules","text":"Understand what chemical reactions are, how energy is involved in chemical reactions, how enzymes assist in chemical reactions, and some types of biochemical reactions in living organisms.","verdict":"skip","justification":"The book covers activation energy, catalysts, anabolic vs catabolic reactions. No connection to anything in your EMALB or BCEHS scope.","modIndex":0,"chIndex":1},{"num":6,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 3 — Biological Molecules","text":"Summarize the properties of water and the importance of water for most biochemical processes.","verdict":"skip","justification":"The book discusses hydrogen bonding, polarity, boiling points, and surface tension. The only adjacent clinical concept is hyponatremia from overhydration, which is better understood through the genitourinary fluid balance module. Skip this section entirely.","modIndex":0,"chIndex":1},{"num":7,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 3 — Biological Molecules","text":"Define pH, acids, and bases, and why maintaining a proper pH in the body is important for biochemical reactions.","verdict":"keep","justification":"This is genuinely important and the book covers it well. Section 3.12 explains the pH scale, what makes a solution acidic or basic, and — critically — the bicarbonate buffer system. The book spells out the key equation you need to understand: CO₂ + H₂O ↔ H₂CO₃ ↔ HCO₃⁻ + H⁺. This is the chemical basis of respiratory compensation for metabolic acidosis.\n\n<strong>Most important to take away:</strong> pH 7.35–7.45 is the normal blood range. Below 7.35 = acidosis, above 7.45 = alkalosis. The bicarbonate buffer is the body's primary defence — when metabolic acid builds up (e.g. in shock, diabetic ketoacidosis), the lungs compensate by blowing off CO₂ (increasing respiratory rate). This is why a fast respiratory rate in a sick patient is often not a respiratory problem — it's a metabolic one. Your PCP partner will be assessing this constantly. You should understand why.","modIndex":0,"chIndex":1},{"num":8,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 4 — Cells","text":"Describe the importance of size and shape to the functions of cells.","verdict":"skip","justification":"The book discusses surface area to volume ratios and why cells are microscopic. No clinical application in prehospital care.","modIndex":0,"chIndex":2},{"num":9,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 4 — Cells","text":"Compare and contrast between eukaryotic cells (such as those in humans and other animals) and prokaryotic cells (such as bacteria).","verdict":"skip","justification":"The book contrasts human cells (eukaryotic) with bacteria (prokaryotic). This is introductory biology. You won't use it on a call.","modIndex":0,"chIndex":2},{"num":10,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 4 — Cells","text":"Outline the structures and functions of cell parts, including the plasma membrane, cytoplasm, cytoskeleton, nucleus, ribosomes, Golgi apparatus, endoplasmic reticulum, mitochondria, vesicles, and vacuoles.","verdict":"skim","justification":"The book covers about ten organelles in detail. Most are irrelevant. The two you should understand:\n\n<strong>Mitochondria:</strong> The energy producers of the cell, converting glucose to ATP through aerobic respiration. When cells are deprived of oxygen (hypoxia, shock), mitochondria switch to anaerobic respiration, which is far less efficient and produces lactic acid. Lactic acid = metabolic acidosis. This is the biochemical explanation for why shocked patients become acidotic. Your PCP partner will be interpreting lactate levels at handoff.\n\n<strong>Plasma membrane:</strong> Selectively permeable, controls what enters and leaves the cell. This sets up the passive/active transport objectives below.\n\nEverything else (Golgi apparatus, ribosomes, endoplasmic reticulum) — skim the names but don't spend time on them.","modIndex":0,"chIndex":2},{"num":11,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 4 — Cells","text":"Explain the processes of passive and active transport to move substances into and out of cells, and how these processes help maintain homeostasis.","verdict":"keep","justification":"The book explains these clearly with diagrams. Three types of passive transport matter clinically:\n\n<strong>Osmosis</strong> — water moves across membranes from low solute concentration to high. This is the mechanism behind IV fluid selection (isotonic saline doesn't cause cells to swell or shrink), cerebral edema (cells swell when surrounding fluid becomes hypotonic), and why you don't give pure water IV.\n\n<strong>Diffusion</strong> — oxygen and CO₂ move across the alveolar-capillary membrane by simple diffusion down concentration gradients. This is gas exchange.\n\n<strong>Sodium-potassium pump (active transport)</strong> — maintains the electrical gradient across nerve and muscle cell membranes. When it fails (due to ischemia), cells depolarize inappropriately. Relevant to cardiac dysrhythmias in electrolyte disturbances.","modIndex":0,"chIndex":2},{"num":12,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 4 — Cells","text":"Understand how organisms obtain the energy needed for life, including how the sugar glucose is broken down to produce ATP through the processes of anaerobic and aerobic cellular respiration.","verdict":"keep","justification":"The book explains this well. Aerobic respiration produces 36–38 ATP per glucose molecule. Anaerobic produces only 2 ATP and generates lactic acid as a byproduct.\n\n<strong>Most important to take away:</strong> When oxygen delivery fails — from hypoxia, airway obstruction, severe anemia, or shock — cells switch to anaerobic respiration. This generates lactic acid rapidly and causes metabolic acidosis. The patient compensates by breathing faster to blow off CO₂. When the patient can no longer compensate (respiratory muscles tire, LOC decreases), pH crashes and the patient deteriorates rapidly. This chain of events is the physiological story of every critical patient you'll encounter.","modIndex":0,"chIndex":2},{"num":13,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 4 — Cells","text":"Identify the phases of the cell cycle, how cells divide through mitosis, and how cancer (neoplasms) can result from unregulated cell division.","verdict":"skip","justification":"The book covers phases of mitosis and how unregulated cell division produces tumors. No prehospital clinical application. Skip entirely.","modIndex":0,"chIndex":2},{"num":14,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 5 — Genetics","text":"Compare and contrast the structure of DNA and RNA.","verdict":"skip","justification":"Having read the chapter, it is entirely about genetic counselling, BRCA mutations, family pedigrees, and chromosomal inheritance. Zero connection to EMALB scope or BCEHS CPGs.","modIndex":0,"chIndex":3},{"num":15,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 5 — Genetics","text":"Describe how DNA replication occurs.","verdict":"skip","justification":"Pure molecular biology. No clinical utility in the field at any level of prehospital care.","modIndex":0,"chIndex":3},{"num":16,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 5 — Genetics","text":"Define genes and alleles and how they are located on chromosomes.","verdict":"skip","justification":"No clinical utility in the field. You are not taking a genetic history in the ambulance.","modIndex":0,"chIndex":3},{"num":17,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 5 — Genetics","text":"Outline how many pairs of human chromosomes there are and differentiate between autosomal and sex chromosomes.","verdict":"skip","justification":"Not relevant to prehospital assessment or treatment at any level.","modIndex":0,"chIndex":3},{"num":18,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 5 — Genetics","text":"Define meiosis and how this contributes to gamete (eggs and sperm) production.","verdict":"skip","justification":"Not relevant. The case study in the textbook is about a woman seeing a genetic counsellor about hereditary breast cancer risk. Skip the entire chapter without hesitation.","modIndex":0,"chIndex":3},{"num":19,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 5 — Genetics","text":"Understand Mendelian inheritance and pedigree.","verdict":"skip","justification":"Not relevant. Skip entirely.","modIndex":0,"chIndex":3},{"num":20,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 5 — Genetics","text":"Define and differentiate between autosomal traits and sex-linked traits.","verdict":"skip","justification":"Not relevant. Skip entirely.","modIndex":0,"chIndex":3},{"num":21,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 5 — Genetics","text":"Predict inheritance patterns using a Punnett square.","verdict":"skip","justification":"Entirely academic. Skip without hesitation.","modIndex":0,"chIndex":3},{"num":22,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 7 — Introduction to the Human Body","text":"Outline the organization of the body from atoms and molecules up through cells, tissues, organs, and organ systems.","verdict":"keep","justification":"The book frames this as a hierarchy of complexity. The clinical value is that it gives you the mental model for understanding why a localized injury (e.g. a lacerated liver) creates systemic effects (hemorrhagic shock). Damage at the organ level disrupts the organ system, which disrupts the whole organism's homeostasis.\n\n<strong>Most important to take away:</strong> The hierarchy itself — cell, tissue, organ, organ system, organism. Know which organs belong to which systems, particularly for your assessment and documentation.","modIndex":0,"chIndex":4},{"num":23,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 7 — Introduction to the Human Body","text":"Describe how organ systems work together to carry out the functions of life.","verdict":"keep","justification":"The book uses the fight-or-flight response as the main example and it's perfect for your context. When the nervous system perceives threat, it signals the adrenal glands to release adrenaline and cortisol, which then affect the cardiovascular, respiratory, digestive, and urinary systems simultaneously — heart rate up, airways dilate, blood shunted to muscles, digestion paused.\n\n<strong>Most important to take away:</strong> In a trauma patient, this response is happening automatically. The tachycardia and vasoconstriction you see in early shock is sympathetic compensation. The pale, sweaty, tachycardic patient is in fight-or-flight mode. Understanding this explains why compensated shock can look deceptively stable until it suddenly decompensates.","modIndex":0,"chIndex":4},{"num":24,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 7 — Introduction to the Human Body","text":"Understand the variety of different specialized cell types in humans, the four major types of human tissues, and some of their functions.","verdict":"skim","justification":"The book covers epithelial, connective, muscle, and nervous tissue. You need one thing from this: the four types and their basic function. Epithelial = lining and covering. Connective = support and binding (includes blood, bone, cartilage). Muscle = movement. Nervous = communication.\n\n<strong>Most important to take away:</strong> Connective tissue includes blood — this is a common point of confusion. Also understand that different tissues heal differently: nervous tissue has very limited regeneration capacity, which is why spinal cord and brain injuries are permanent. This comes up constantly in your Candice Lodge context with ABI patients.","modIndex":0,"chIndex":4},{"num":25,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 7 — Introduction to the Human Body","text":"Identify the five vital organs and the 11 major organ systems of the human body.","verdict":"keep","justification":"The book explicitly lists these. The five vital organs are heart, brain, kidneys, liver, and lungs — the book notes that failure of any one without medical intervention means death.\n\n<strong>Most important to take away:</strong> Know the five vital organs and what immediate failure of each looks like. Cardiac arrest, respiratory arrest, acute liver failure (coagulopathy, encephalopathy), acute renal failure (fluid overload, acidosis, hyperkalemia), and brain herniation. These are the catastrophic endpoints you're working to prevent.","modIndex":0,"chIndex":4},{"num":26,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 7 — Introduction to the Human Body","text":"Identify body cavities and the organs they hold and protect.","verdict":"keep","justification":"The book covers this clearly and specifically discusses meningitis as a sidebar — noting it's a medical emergency diagnosed via lumbar puncture with symptoms including fever, headache, neck stiffness, altered consciousness, and photophobia.\n\n<strong>Most important to take away:</strong> Thoracic cavity = heart and lungs. Abdominal cavity = GI organs, liver, spleen, kidneys. Pelvic cavity = bladder, reproductive organs. Cranial and spinal cavities = brain and spinal cord. For trauma assessment, knowing which cavity an injury affects tells you immediately what structures are at risk and how fast a patient can deteriorate. Penetrating trauma to the thoracic cavity can cause pneumothorax or tamponade.","modIndex":0,"chIndex":4},{"num":27,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 7 — Introduction to the Human Body","text":"Identify the tissues and fluid that protect the brain and spinal cord.","verdict":"keep","justification":"The book explains the meninges as a three-layer membrane (dura mater, arachnoid, pia mater) with CSF between two of the layers. This fluid cushions the brain and spinal cord.\n\n<strong>Most important to take away:</strong> CSF leaking from the ears or nose after head trauma indicates a basilar skull fracture — a critical finding in EMALB TBI management. The meninges layers explain the three types of intracranial hemorrhage: epidural (between skull and dura), subdural (between dura and arachnoid), subarachnoid (between arachnoid and pia). Your PCP partner will be communicating about these at handoff.","modIndex":0,"chIndex":4},{"num":28,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 7 — Introduction to the Human Body","text":"Describe how organ systems communicate and interact in body processes, such as cellular respiration, digestion, the fight-or-flight response to stressors, and physical activities (such as sports).","verdict":"keep","justification":"The book's fight-or-flight explanation is excellent and directly clinical. The autonomic nervous system controls involuntary functions. The sympathetic division is your \"gas pedal\" — accelerates heart rate, dilates airways, vasoconstricts peripheral vessels, raises blood glucose. The parasympathetic division is your \"brake.\"\n\n<strong>Most important to take away:</strong> In a critical patient, sympathetic overdrive (the stress response) is what you're seeing. In an opioid overdose, it's parasympathetic predominance causing bradycardia, miosis, and respiratory depression. Recognizing which system is dominant tells you immediately what drug class or clinical state you're dealing with.","modIndex":0,"chIndex":4},{"num":29,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Chapter 7 — Introduction to the Human Body","text":"Explain and integrate how homeostasis is maintained to keep the body in a relatively steady state, and the problems that can be caused by loss of homeostasis, such as diabetes.","verdict":"keep","justification":"The book explicitly states that if homeostasis is not restored, \"the imbalance may lead to disease — or even death.\" The diabetes example ties this to a real, common condition you'll encounter constantly.\n\n<strong>Most important to take away:</strong> Your job on every call is to support the body's failing homeostatic mechanisms until definitive care can take over. Supplemental oxygen, IV fluids, glucose — these are all homeostatic supports. Understanding homeostasis gives purpose to every intervention.","modIndex":0,"chIndex":4},{"num":30,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Lecture — Anatomical Position & Directional Terms","text":"Describe the anatomical position.","verdict":"keep","justification":"These are communication tools you use every shift. Anatomical position = standing upright, arms at sides, palms forward. Every directional term assumes this starting position.\n\n<strong>Most important to take away:</strong> You'll use anatomical position as the reference point for every wound, fracture, or injury location you document or describe in a verbal handoff.","modIndex":0,"chIndex":5},{"num":31,"modTitle":"Module 1 | Structure and Function of Cells and Tissues","chName":"Lecture — Anatomical Position & Directional Terms","text":"Outline principal directional terms and body planes used in describing the body and how this relates to body parts.","verdict":"keep","justification":"These are standard clinical communication tools used in every patient care report and handoff.\n\n<strong>Most important to take away:</strong> Directional pairs: superior/inferior, anterior/posterior, medial/lateral, proximal/distal, superficial/deep. Body planes: sagittal (left/right), frontal/coronal (front/back), transverse (upper/lower). Proximal and distal are especially important for wound and fracture description — \"proximal to the knee\" vs \"distal to the wrist\" immediately tells the receiving team the anatomical level.","modIndex":0,"chIndex":5},{"num":32,"modTitle":"Module 2 | Anatomy and Physiology of the Integumentary System","chName":"Chapter 10 — Integumentary System","text":"Describe the functions of the organs of the integumentary system (the skin, hair, and nails).","verdict":"keep","justification":"The book frames skin's functions as protection, temperature regulation, sensation, vitamin D synthesis, and excretion. The clinical ones are protection (barrier against infection), temperature regulation (relevant to hypothermia and hyperthermia calls), and sensation (pain assessment).\n\n<strong>Most important to take away:</strong> Skin is the first line of defence against infection. When it's breached by burns, lacerations, or IV lines, infection risk jumps. In burn patients, loss of this barrier causes massive fluid loss and hypothermia simultaneously — this explains why major burns are so immediately life-threatening beyond just the tissue damage.","modIndex":1,"chIndex":0},{"num":33,"modTitle":"Module 2 | Anatomy and Physiology of the Integumentary System","chName":"Chapter 10 — Integumentary System","text":"Define the two main layers of the skin.","verdict":"keep","justification":"The book identifies the epidermis (outer, avascular) and dermis (inner, vascular and with nerve endings).\n\n<strong>Most important to take away:</strong> This maps directly to burn depth assessment in EMALB. Superficial (first degree) = epidermis only, no blisters. Partial thickness (second degree) = epidermis + part of dermis, blistering, very painful because nerve endings are exposed. Full thickness (third degree) = through both layers, may be painless because nerve endings are destroyed. Knowing this lets you anticipate what your patient is experiencing and how quickly they'll lose fluid.","modIndex":1,"chIndex":0},{"num":34,"modTitle":"Module 2 | Anatomy and Physiology of the Integumentary System","chName":"Chapter 10 — Integumentary System","text":"Identify the cells and layers of the epidermis and their functions.","verdict":"skim","justification":"The book describes five epidermal layers. The clinical value is limited. The practical takeaway: burns that destroy the deepest layer (stratum basale, where new cells are produced) cannot self-heal and require grafting. This is relevant when communicating burn depth to receiving teams. Skip the individual layer names and memorization.","modIndex":1,"chIndex":0},{"num":35,"modTitle":"Module 2 | Anatomy and Physiology of the Integumentary System","chName":"Chapter 10 — Integumentary System","text":"Outline the composition of epidermal cells and how the epidermis grows.","verdict":"skip","justification":"The book covers keratinocyte differentiation and epidermal turnover cycles. No prehospital clinical relevance.","modIndex":1,"chIndex":0},{"num":36,"modTitle":"Module 2 | Anatomy and Physiology of the Integumentary System","chName":"Chapter 10 — Integumentary System","text":"Identify the composition and layers of the dermis and their functions.","verdict":"skim","justification":"The dermis contains blood vessels, lymphatics, nerve endings, hair follicles, and sweat glands.\n\n<strong>What to focus on:</strong> The blood vessels in the dermis explain why deeper wounds bleed more. Partial thickness burns extending into the dermis bleed and are exquisitely painful. Know this and move on — you don't need the papillary vs reticular layer distinction.","modIndex":1,"chIndex":0},{"num":37,"modTitle":"Module 2 | Anatomy and Physiology of the Integumentary System","chName":"Chapter 10 — Integumentary System","text":"Outline the specialized structures in the dermis, which include sweat and sebaceous (oil) glands, hair follicles, and sensory receptors that detect touch, temperature, and pain.","verdict":"skim","justification":"The sensory receptors in the dermis are what matter clinically. The book covers mechanoreceptors (touch, pressure), thermoreceptors (temperature), and nociceptors (pain).\n\n<strong>Most important to take away:</strong> Loss of sensation in a limb distal to an injury = possible nerve or vascular compromise. Loss of sensation in a dermatomal pattern = possible spinal injury. You're testing these receptors when you do a sensory exam. The gland detail (sebaceous, sweat) is not clinically actionable — skip it.","modIndex":1,"chIndex":0},{"num":38,"modTitle":"Module 2 | Anatomy and Physiology of the Integumentary System","chName":"Chapter 10 — Integumentary System","text":"Describe the structure and functions of nails, which includes protecting the fingers and toes, enhancing the detection of sensory stimuli, and acting as tools.","verdict":"skip","justification":"The book covers nail anatomy and growth rate in detail. No prehospital clinical relevance whatsoever.","modIndex":1,"chIndex":0},{"num":39,"modTitle":"Module 2 | Anatomy and Physiology of the Integumentary System","chName":"Chapter 10 — Integumentary System","text":"Describe how nails grow and how they can reflect and affect our health.","verdict":"skip","justification":"The book mentions nail changes can indicate systemic illness (clubbing, koilonychia). Not in your scope for prehospital assessment or any BCEHS CPG.","modIndex":1,"chIndex":0},{"num":40,"modTitle":"Module 2 | Anatomy and Physiology of the Integumentary System","chName":"Chapter 10 — Integumentary System","text":"Describe causes and detection of skin cancer (neoplasms) and outline the 3 most common types of skin cancer.","verdict":"skip","justification":"The book covers basal cell, squamous cell, and melanoma with ABCDE detection criteria, UV exposure, and biopsy. You are not screening for skin cancer in the field. Not in any BCEHS CPG.","modIndex":1,"chIndex":0},{"num":41,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 11 — Skeletal System","text":"Outline the components of the skeletal system, which includes bones, ligaments, and cartilage.","verdict":"keep","justification":"The book explains that ligaments connect bone to bone, tendons connect muscle to bone, and cartilage cushions joints. These distinctions matter for mechanism of injury assessment.\n\n<strong>Most important to take away:</strong> Ligament injuries = sprains. Tendon injuries = strains. Cartilage doesn't heal well because it's avascular — this is why knee and hip cartilage damage is so disabling. These distinctions help your documentation and your communication with the PCP about mechanism of injury.","modIndex":2,"chIndex":0},{"num":42,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 11 — Skeletal System","text":"Identify and describe the functions of the skeletal system.","verdict":"keep","justification":"The book lists support, protection, movement, mineral storage, and blood cell production (hematopoiesis in red bone marrow).\n\n<strong>Most important to take away:</strong> Blood cell production in bone marrow is the reason major long bone fractures are so dangerous — a closed femur fracture can bleed 1–1.5L into the thigh compartment. That's hemorrhagic shock from a \"closed\" fracture with no visible external bleeding. Your EMALB traction splint protocol exists specifically for this.","modIndex":2,"chIndex":0},{"num":43,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 11 — Skeletal System","text":"Explain the organization and functions of the two main divisions of the skeletal system: the axial skeletal system and the appendicular skeletal system.","verdict":"keep","justification":"The book divides the skeleton into axial (skull, vertebral column, ribcage — 80 bones) and appendicular (limbs, shoulder and pelvic girdles — 126 bones).\n\n<strong>Most important to take away:</strong> Axial injuries are immediately more dangerous — skull protects the brain, vertebral column protects the spinal cord, ribcage protects heart and lungs. Appendicular injuries can bleed massively (femur, pelvis) but are more anatomically survivable if haemorrhage is controlled. EMALB pelvic binding is for unstable pelvis fractures — an axial/appendicular junction injury that can cause catastrophic retroperitoneal hemorrhage.","modIndex":2,"chIndex":0},{"num":44,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 11 — Skeletal System","text":"Describe the tissues and cells that make up bones, along with their specific functions, which include making new bone, breaking down bone, producing blood cells, and regulating mineral homeostasis.","verdict":"skim","justification":"The book covers osteoblasts (build bone), osteoclasts (break down bone), and osteocytes (maintain bone).\n\n<strong>What to focus on:</strong> Calcium is stored in bone and released into blood under hormonal control (parathyroid hormone). Hypocalcemia from parathyroid disorders causes muscle cramps, tetany, and cardiac dysrhythmias. Hypercalcemia causes confusion, weakness, and cardiac changes. Both are covered in Module 8. Skip the osteoblast/osteoclast cellular detail.","modIndex":2,"chIndex":0},{"num":45,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 11 — Skeletal System","text":"Identify and label the different types of bones in the skeletal system, based on shape and location.","verdict":"skim","justification":"Long bones (femur, humerus, tibia), short bones (carpals, tarsals), flat bones (skull, sternum, ilium), irregular bones (vertebrae).\n\n<strong>What to focus on:</strong> Pattern recognition in trauma — flat bones like the skull and ribs fracture differently than long bones. Rib fractures can lacerate underlying lung (pneumothorax). Sternal fractures suggest massive thoracic impact and warrant concern about cardiac contusion. Skull fractures may or may not indicate brain injury. Skip memorizing all bone classification subcategories.","modIndex":2,"chIndex":0},{"num":46,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 11 — Skeletal System","text":"Explain how bones grow, remodel, and repair themselves.","verdict":"skip","justification":"The book covers epiphyseal plates, ossification, and bone remodelling cycles. Interesting but no prehospital clinical application.","modIndex":2,"chIndex":0},{"num":47,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 11 — Skeletal System","text":"Outline the different types of joints between bones, where they are located, and the ways in which they allow different types of movement, depending on their structure.","verdict":"keep","justification":"The book covers fibrous (immovable, like skull sutures), cartilaginous (slightly movable, like vertebral discs), and synovial (freely movable, like hip, knee, shoulder) joints.\n\n<strong>Most important to take away:</strong> Synovial joints are your trauma joints — they dislocate, they have ligaments that sprain, and they accumulate blood when injured. The EMALB guidelines specifically address hip dislocation — posterior dislocation (the most common) causes the leg to appear shortened and internally rotated. Knee dislocations are vascular emergencies because the popliteal artery runs directly behind the joint.","modIndex":2,"chIndex":0},{"num":48,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 11 — Skeletal System","text":"Discuss the causes, risk factors, and treatments for the two most common disorders of the skeletal system — osteoporosis and osteoarthritis.","verdict":"keep","justification":"The book explains that osteoporosis causes bones to become brittle and fracture with minimal force, and that osteoarthritis causes cartilage breakdown in joints.\n\n<strong>Most important to take away:</strong> In your demographic — elderly Lower Mainland patients — these are extremely common. An osteoporotic patient who \"just slipped\" may have a hip fracture with minimal mechanism. Don't dismiss low-energy mechanisms in the elderly. Osteoarthritis patients often have baseline joint pain and restricted range of motion — knowing this prevents you from misidentifying a chronic finding as an acute injury. Always ask about baseline function.","modIndex":2,"chIndex":0},{"num":49,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 12 — Muscular System","text":"Compare and contrast the different types of muscle tissue — skeletal, cardiac, and smooth muscle — and their different characteristics and functions.","verdict":"keep","justification":"The book distinguishes these clearly. Skeletal = voluntary, striated, attaches to bone. Cardiac = involuntary, striated, autorhythmic (can beat without neural input). Smooth = involuntary, non-striated, found in blood vessels and airways.\n\n<strong>Most important to take away:</strong> Cardiac muscle's autorhythmicity means the heart can continue beating even after massive CNS injury. Smooth muscle in airway walls contracts in bronchospasm (asthma, anaphylaxis) — bronchodilators like salbutamol work by relaxing this smooth muscle. Smooth muscle in blood vessel walls constricts in sympathetic activation — this is the vasoconstriction of shock.","modIndex":2,"chIndex":1},{"num":50,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 12 — Muscular System","text":"Explain how muscle cells are specialized to contract and cause voluntary and involuntary movements.","verdict":"keep","justification":"The book explains voluntary (somatic) vs involuntary (autonomic) control of muscle.\n\n<strong>Most important to take away:</strong> The diaphragm is a skeletal muscle under voluntary and autonomic control. High cervical spinal cord injury = no diaphragm = no breathing. Know that C3-C5 innervates the diaphragm — \"C3, 4, and 5 keep the diaphragm alive.\" Spinal cord injuries above C4 interrupt voluntary control of the diaphragm, causing immediate respiratory failure.","modIndex":2,"chIndex":1},{"num":51,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 12 — Muscular System","text":"Discuss the ways in which muscle contraction is initiated and controlled.","verdict":"skim","justification":"The book covers the neuromuscular junction — motor neuron releases acetylcholine (ACh) onto the muscle fibre, causing it to contract.\n\n<strong>What to focus on:</strong> Organophosphate poisoning (certain pesticides and nerve agents) blocks acetylcholinesterase, which normally breaks down ACh. The result is continuous stimulation causing SLUDGE syndrome (Salivation, Lacrimation, Urination, Defecation, GI distress, Emesis) plus bronchospasm and bradycardia. Your PCP partner will manage this with atropine. Skip the detailed sliding filament biochemistry.","modIndex":2,"chIndex":1},{"num":52,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 12 — Muscular System","text":"Describe the structure and organization of skeletal muscles, including the different types of muscle fibres, and how actin and myosin filaments move across each other — according to the sliding filament theory — to cause muscle contraction.","verdict":"skip","justification":"The book covers cross-bridge cycling, power stroke, tropomyosin/troponin in considerable detail. This is exercise physiology. No connection to any EMALB protocol or BCEHS CPG.","modIndex":2,"chIndex":1},{"num":53,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 12 — Muscular System","text":"Outline the structure and function of cardiac muscle tissue.","verdict":"keep","justification":"The book explains that cardiac muscle cells are connected by intercalated discs that allow electrical signals to spread rapidly across the heart.\n\n<strong>Most important to take away:</strong> The electrical coupling between cardiac muscle cells means that one dysrhythmia can quickly propagate across the entire heart. Ventricular fibrillation is uncoordinated electrical chaos in ventricular muscle. Defibrillation works by simultaneously depolarizing all cardiac muscle cells, allowing the SA node to re-establish coordinated rhythm. Understanding this makes the rationale for early defibrillation intuitive rather than memorized.","modIndex":2,"chIndex":1},{"num":54,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 12 — Muscular System","text":"Outline the structure and function of smooth muscle tissue.","verdict":"keep","justification":"The key clinical sites: blood vessel walls (vasoconstriction/vasodilation), bronchial walls (bronchoconstriction/bronchodilation), GI tract (peristalsis).\n\n<strong>Most important to take away:</strong> Anaphylaxis involves massive smooth muscle responses — bronchospasm in the airways AND vasodilation in blood vessels simultaneously. This is why anaphylaxis is lethal: the airways are closing at the same time blood pressure is crashing. Epinephrine reverses both effects — it's a bronchodilator AND a vasoconstrictor. This is the mechanism behind the EMALB anaphylaxis protocol.","modIndex":2,"chIndex":1},{"num":55,"modTitle":"Module 3 | Anatomy and Physiology of the Musculoskeletal System","chName":"Chapter 12 — Muscular System","text":"Discuss disorders of the muscular system, including musculoskeletal disorders (such as strains and sprains) and neuromuscular disorders (such as muscular dystrophy and Parkinson's disease).","verdict":"keep","justification":"The book covers strains (muscle/tendon overstretching), sprains (ligament injury), muscular dystrophy, and Parkinson's disease.\n\n<strong>Most important to take away:</strong> Parkinson's patients have baseline rigidity, tremor, and postural instability — they fall frequently and are at high risk of hip fractures and head injuries. Distinguish Parkinson's baseline tremor from new neurological findings. Parkinson's patients may also have dysphagia — aspiration risk during transport. Muscular dystrophy patients may have severely compromised respiratory muscle function — a seemingly minor respiratory illness can be catastrophic.","modIndex":2,"chIndex":1},{"num":56,"modTitle":"Module 4 | Anatomy and Physiology of the Nervous System","chName":"Chapter 8 — Nervous System","text":"Outline the organization of the nervous system — including the central and peripheral nervous systems — and their organs and subdivisions.","verdict":"keep","justification":"The book divides the nervous system clearly: CNS (brain + spinal cord), PNS (all other nerves). PNS subdivides into somatic (voluntary) and autonomic (involuntary). Autonomic into sympathetic (fight-or-flight) and parasympathetic (rest-and-digest).\n\n<strong>Most important to take away:</strong> The sympathetic/parasympathetic distinction explains the clinical presentation of almost every toxicological patient. Opioids, benzos, alcohol → parasympathetic-like (bradycardia, miosis, respiratory depression, reduced LOC). Cocaine, methamphetamine, MDMA → sympathetic (tachycardia, hypertension, hyperthermia, agitation, dilated pupils). Recognizing which system is dominant tells you what drug class or clinical state you're dealing with.","modIndex":3,"chIndex":0},{"num":57,"modTitle":"Module 4 | Anatomy and Physiology of the Nervous System","chName":"Chapter 8 — Nervous System","text":"Describe the cells of the nervous system — neurons and neuroglia — and their anatomical parts and functions.","verdict":"keep","justification":"The book covers neurons (cell body, dendrites, axon, myelin sheath) and neuroglia (support cells). Demyelinating diseases like multiple sclerosis cause slow, patchy nerve conduction resulting in variable neurological deficits.\n\n<strong>Most important to take away:</strong> Neurons don't regenerate meaningfully after injury. This is why spinal cord injuries are permanent and traumatic brain injuries cause lasting deficits. The extent of axonal injury determines recovery — this is what drives the long-term outcomes you see in your ABI patients at Candice Lodge.","modIndex":3,"chIndex":0},{"num":58,"modTitle":"Module 4 | Anatomy and Physiology of the Nervous System","chName":"Chapter 8 — Nervous System","text":"Explain how messages are sent by neurons through the nervous system, and to and from the rest of the body.","verdict":"keep","justification":"The book explains synaptic transmission — the action potential arrives, triggers neurotransmitter release into the synapse, neurotransmitter binds to receptors on the next cell.\n\n<strong>Most important to take away:</strong> This is the mechanism that drugs act on. Opioids bind to opioid receptors and inhibit pain signalling AND respiratory drive. Naloxone works by competitively blocking those same receptors — it doesn't reverse the drug, it out-competes it for receptor binding. This is why re-sedation can occur after naloxone wears off if the opioid is still present. The EMALB naloxone protocol makes much more sense with this understanding.","modIndex":3,"chIndex":0},{"num":59,"modTitle":"Module 4 | Anatomy and Physiology of the Nervous System","chName":"Chapter 8 — Nervous System","text":"Indicate how nerve impulses are transmitted by electrical changes within neurons, and through chemical molecules to other cells.","verdict":"keep","justification":"The book explains the resting membrane potential, action potential, and depolarization. The sodium-potassium pump maintains the resting potential.\n\n<strong>Most important to take away:</strong> Hyperkalemia (high potassium) from renal failure depolarizes cardiac muscle cells, making them more excitable and dysrhythmia-prone. This is why renal failure patients are at risk of fatal cardiac dysrhythmias from electrolyte abnormalities. Local anaesthetics work by blocking sodium channels, preventing depolarization — this is why lidocaine can treat certain cardiac dysrhythmias.","modIndex":3,"chIndex":0},{"num":60,"modTitle":"Module 4 | Anatomy and Physiology of the Nervous System","chName":"Chapter 8 — Nervous System","text":"Identify the structure and functions of different parts of the central nervous system, which includes the brain and spinal cord, and outcomes when damaged.","verdict":"keep","justification":"The book covers the major brain regions in detail. Directly clinically relevant by region:\n\n<strong>Frontal lobe</strong> — personality, judgment, voluntary motor control. Injury = disinhibition, aggression, contralateral motor deficits.\n<strong>Temporal lobe</strong> — hearing, language, memory (hippocampus). Injury = language deficits, memory problems.\n<strong>Parietal lobe</strong> — sensory processing, spatial awareness. Injury = sensory deficits, contralateral neglect.\n<strong>Occipital lobe</strong> — vision. Injury = visual field deficits.\n<strong>Brainstem (medulla oblongata)</strong> — controls breathing rate, heart rate, blood pressure. Brainstem compression from herniation = respiratory arrest and cardiovascular collapse. This is the lethal endpoint of rising ICP.\n<strong>Cerebellum</strong> — coordination and balance. Injury = ataxia, which can mimic intoxication.\n\nKnow the Cushing's triad (hypertension, bradycardia, irregular respiration) — it's a late sign of severe raised ICP and impending herniation. This is a direct BCEHS TBI red flag.","modIndex":3,"chIndex":0},{"num":61,"modTitle":"Module 4 | Anatomy and Physiology of the Nervous System","chName":"Chapter 8 — Nervous System","text":"Describe the normal function of cerebrospinal fluid and where it is found.","verdict":"keep","justification":"The book explains CSF as a clear fluid produced by the brain, circulating between meningeal layers and providing cushioning and chemical stability for the CNS.\n\n<strong>Most important to take away:</strong> Clear fluid from the ear (otorrhea) or nose (rhinorrhea) after head trauma = CSF leak = basilar skull fracture. This is a critical physical exam finding in EMALB TBI management. Do NOT pack the nose or ear — you can force CSF back into the cranial vault and increase ICP.","modIndex":3,"chIndex":0},{"num":62,"modTitle":"Module 4 | Anatomy and Physiology of the Nervous System","chName":"Chapter 8 — Nervous System","text":"Outline the structure and functions of the peripheral nervous system, which includes the nerves that carry motor and sensory information to and from the body to control voluntary and involuntary activities.","verdict":"keep","justification":"The book distinguishes afferent (sensory, travelling toward CNS) and efferent (motor, travelling away from CNS) nerve fibres.\n\n<strong>Most important to take away:</strong> Dermatomes — each spinal nerve level supplies a specific skin area. Testing sensation in a dermatome tells you the level of spinal cord injury. Loss from the nipple line down = T4. Loss from the umbilicus down = T10. Your EMALB spinal management protocol requires documenting neurological deficits to establish a baseline and detect deterioration.","modIndex":3,"chIndex":0},{"num":63,"modTitle":"Module 4 | Anatomy and Physiology of the Nervous System","chName":"Chapter 8 — Nervous System","text":"Describe the human senses, as well as how visual information, sounds, smells, tastes, touch, and balance are detected by sensory receptor cells and then sent to the brain for interpretation.","verdict":"skim","justification":"The book covers all special and general senses in detail. Most is low yield for your work.\n\n<strong>What to focus on:</strong> Pupillary light reflex — pupils constrict in response to light via the optic nerve and oculomotor nerve. Unilateral fixed and dilated pupil = herniation compressing cranial nerve III on the same side. Bilateral fixed and dilated pupils = bilateral herniation or deep coma. This is directly tested in your primary survey LOC assessment and in the EMALB TBI guidelines. Also know that nystagmus (involuntary eye movement) can indicate vestibular disorder, CNS pathology, or intoxication.","modIndex":3,"chIndex":0},{"num":64,"modTitle":"Module 4 | Anatomy and Physiology of the Nervous System","chName":"Chapter 8 — Nervous System","text":"Discuss the main psychoactive effects on the brain and main receptors involved.","verdict":"keep","justification":"Section 8.8 is excellent and directly applicable to your daily work in the Lower Mainland. It covers stimulants, depressants, opioids, benzodiazepines, hallucinogens, and the agonist/antagonist receptor model.\n\n<strong>Most important to take away:</strong>\n<strong>Opioids</strong> = mu-opioid receptor agonists → respiratory depression, miosis, altered LOC. Naloxone = competitive antagonist.\n<strong>Benzodiazepines and alcohol</strong> = GABA agonists → CNS depression, respiratory depression in overdose. No prehospital reversal agent.\n<strong>Cocaine and methamphetamine</strong> = catecholamine release/reuptake blockade → tachycardia, hypertension, hyperthermia, agitation, dilated pupils, coronary vasospasm.\n<strong>Cannabis</strong> = CB1 receptor agonist → variable effects, rarely life-threatening alone but impairs coordination and judgment.\n\nPolypharmacy overdoses (multiple substances combined) are extremely common in the Lower Mainland. Understanding each drug class lets you reason about combined effects — opioids + benzos = synergistic respiratory depression.","modIndex":3,"chIndex":0},{"num":65,"modTitle":"Module 5 | Anatomy and Physiology of the Respiratory System","chName":"Chapter 13 — Respiratory System","text":"Describe the process of respiration, in which oxygen moves from the outside air into the body, and carbon dioxide and other waste gases move from inside the body into the outside air.","verdict":"keep","justification":"The book clearly distinguishes ventilation (moving air in and out) from gas exchange (oxygen into blood, CO₂ out). These are two different failure modes.\n\n<strong>Most important to take away:</strong> SpO₂ measures oxygenation (gas exchange). Respiratory rate and effort measure ventilation. A patient can have a normal SpO₂ and still be tiring from the work of breathing — this is why you assess both. A patient can be ventilating adequately but failing to exchange gases (pulmonary edema, pneumonia) or failing to ventilate (airway obstruction, respiratory arrest). Understanding this distinction is fundamental to respiratory assessment.","modIndex":4,"chIndex":0},{"num":66,"modTitle":"Module 5 | Anatomy and Physiology of the Respiratory System","chName":"Chapter 13 — Respiratory System","text":"Outline the structures of the respiratory system and differentiate between the upper respiratory tract, lower respiratory tract, conducting zones, and respiratory zones.","verdict":"keep","justification":"The book explains the upper tract (nose → pharynx → larynx) as conduction only, and the lower tract (trachea → bronchi → bronchioles → alveoli) where gas exchange occurs in the respiratory zone.\n\n<strong>Most important to take away:</strong> The epiglottis covers the larynx during swallowing — it's the airway's primary aspiration defence. An unconscious patient loses this reflex. The carina (where the trachea splits) is a landmark for confirming ETT placement — your PCP partner listens for bilateral breath sounds to confirm the tube hasn't gone down one side. The alveoli are where actual gas exchange happens — anything that fills or collapses them (pulmonary edema, pneumonia, pneumothorax) impairs oxygenation.","modIndex":4,"chIndex":0},{"num":67,"modTitle":"Module 5 | Anatomy and Physiology of the Respiratory System","chName":"Chapter 13 — Respiratory System","text":"Understand how the respiratory tract protects itself from pathogens and other potentially harmful substances in the air.","verdict":"keep","justification":"The book covers the mucociliary escalator — mucus traps particles, cilia sweep them up to be swallowed or coughed out. It also covers the cough reflex.\n\n<strong>Most important to take away:</strong> When a patient is unconscious, the cough and gag reflexes are impaired — aspiration risk is high. This is why you position unconscious, breathing patients in recovery position. COPD patients have damaged cilia and produce excessive mucus — prone to respiratory infections and chronic cough. Smoking paralyzes cilia and coats them with tar, explaining the long-term damage pattern.","modIndex":4,"chIndex":0},{"num":68,"modTitle":"Module 5 | Anatomy and Physiology of the Respiratory System","chName":"Chapter 13 — Respiratory System","text":"Define normal lung volumes and capacities.","verdict":"keep","justification":"The book covers tidal volume (normal breath ~500mL), vital capacity, residual volume, and total lung capacity.\n\n<strong>Most important to take away:</strong> Tidal volume × respiratory rate = minute ventilation. Normal adult at rest: 500mL × 12–20 breaths = 6–10L/min. When using a BVM, you want to deliver approximately 500–600mL per breath — visible chest rise, not massive inflations. Over-inflating forces air into the stomach, causes regurgitation, and increases aspiration risk. CPAP (in the EMALB PCP protocol) works by maintaining positive pressure in the airways to prevent alveolar collapse in CHF and COPD.","modIndex":4,"chIndex":0},{"num":69,"modTitle":"Module 5 | Anatomy and Physiology of the Respiratory System","chName":"Chapter 13 — Respiratory System","text":"Explain how the rate of breathing is regulated to maintain homeostasis of blood gases and pH.","verdict":"keep","justification":"The book explains that central chemoreceptors in the medulla detect CO₂ levels (via blood pH) and adjust breathing rate accordingly. Peripheral chemoreceptors in the carotid and aortic bodies detect both CO₂ and O₂.\n\n<strong>Most important to take away:</strong> The primary drive to breathe is rising CO₂ (falling pH), not falling O₂. COPD patients with chronic CO₂ retention may rely on hypoxic drive (falling O₂ detected by peripheral chemoreceptors). Never withhold O₂ from a hypoxic patient, but titrate to SpO₂ 88–92% in known COPD rather than targeting 98–100%. This is one of the most practically important concepts in the entire module.","modIndex":4,"chIndex":0},{"num":70,"modTitle":"Module 5 | Anatomy and Physiology of the Respiratory System","chName":"Chapter 13 — Respiratory System","text":"Compare and contrast internal respiration and external respiration.","verdict":"keep","justification":"External respiration = gas exchange in the lungs (alveoli ↔ capillaries). Internal respiration = gas exchange in body tissues (capillaries ↔ cells).\n\n<strong>Most important to take away:</strong> Pneumonia impairs external respiration — the alveoli are filled with exudate, so even though the patient is ventilating, gas exchange is impaired (V/Q mismatch). This explains why pneumonia patients can be tachypneic but still hypoxic despite breathing fast. Shock impairs internal respiration — cells aren't receiving adequate oxygen delivery even if the lungs are working fine.","modIndex":4,"chIndex":0},{"num":71,"modTitle":"Module 5 | Anatomy and Physiology of the Respiratory System","chName":"Chapter 13 — Respiratory System","text":"Differentiate between conscious and unconscious (neurologic) control of breathing and identify homeostatic regulation of breathing.","verdict":"keep","justification":"The book explains that breathing has both voluntary (conscious, via motor cortex) and automatic (brainstem) control.\n\n<strong>Most important to take away:</strong> The automatic control centre in the medulla is what keeps people breathing when unconscious. When the medulla is compressed by rising ICP, breathing becomes irregular (Cheyne-Stokes or ataxic breathing), then stops. Irregular breathing in a head-injured patient is an ominous sign. Opioids suppress the medullary respiratory centre directly — this is why opioid overdose causes respiratory depression even without airway obstruction.","modIndex":4,"chIndex":0},{"num":72,"modTitle":"Module 5 | Anatomy and Physiology of the Respiratory System","chName":"Chapter 13 — Respiratory System","text":"Understand disorders of the respiratory system, including asthma, pneumonia, chronic obstructive pulmonary disease (COPD), and lung cancer.","verdict":"keep","justification":"All covered explicitly in EMALB and BCEHS CPGs.\n\n<strong>Most important to take away:</strong>\n<strong>Asthma</strong> = bronchospasm + mucosal inflammation + mucus → wheeze, prolonged expiration, air trapping. Treat with salbutamol (in EMALB scope). Silent chest in severe asthma = no wheeze because airflow is too low — it's worse than a wheeze, not better.\n<strong>COPD</strong> = chronic airflow limitation from emphysema and/or chronic bronchitis. Barrel chest, prolonged expiration, low baseline SpO₂. Treat exacerbations with salbutamol, ipratropium, CPAP (PCP scope).\n<strong>Pneumonia</strong> = alveolar consolidation from infection. Fever, productive cough, pleuritic chest pain, reduced air entry with crackles. Can cause sepsis in the elderly.","modIndex":4,"chIndex":0},{"num":73,"modTitle":"Module 5 | Anatomy and Physiology of the Respiratory System","chName":"Chapter 13 — Respiratory System","text":"Discuss the negative health effects of smoking.","verdict":"skim","justification":"The book links smoking to COPD, lung cancer, cardiovascular disease, and stroke.\n\n<strong>What to focus on:</strong> Smoking history is one of the most important risk stratifiers in your patient assessment. Pack-year history (packs per day × years smoked) correlates with COPD severity, cardiovascular risk, and cancer risk. A 40-pack-year smoker presenting with chest pain and SOB is a very different patient from a non-smoker with the same complaint. That's the clinical value of this section — it justifies why you always ask about smoking.","modIndex":4,"chIndex":0},{"num":74,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Outline and label the major components of the cardiovascular system: the heart, blood vessels, and blood.","verdict":"keep","justification":"The book frames the cardiovascular system as a transport system. Three components — heart (pump), blood vessels (pipes), blood (fluid). Failure of any one causes circulatory failure.\n\n<strong>Most important to take away:</strong> Pump failure = cardiogenic shock. Pipe failure = distributive shock (sepsis, anaphylaxis, neurogenic). Fluid failure = hypovolemic shock. Your BCEHS hypovolemia CPG applies to all three but the underlying cause changes management entirely. Identifying which component has failed directs treatment.","modIndex":5,"chIndex":0},{"num":75,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Differentiate between the pulmonary circulation and systemic circulation.","verdict":"keep","justification":"The right heart pumps deoxygenated blood to the lungs (pulmonary) and the left heart pumps oxygenated blood to the body (systemic).\n\n<strong>Most important to take away:</strong> Right heart failure causes blood to back up into the venous system (JVD, peripheral edema, hepatomegaly). Left heart failure causes blood to back up into the pulmonary circulation (pulmonary edema, crackles, pink frothy sputum). Your PCP partner's CPAP protocol is specifically for acute pulmonary edema from left heart failure. Knowing which ventricle is failing helps you anticipate presentation and treatment.","modIndex":5,"chIndex":0},{"num":76,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Describe the functions of the cardiovascular system, including transporting needed substances (such as oxygen and nutrients) to the cells of the body, and picking up waste products.","verdict":"keep","justification":"Transport of O₂, nutrients, hormones, immune cells. Removal of CO₂ and metabolic waste.\n\n<strong>Most important to take away:</strong> Shock is fundamentally a failure of oxygen delivery to tissues. Oxygen delivery = cardiac output × arterial oxygen content. Increase either to improve delivery. This is why you manage both the pump (IV fluids to maintain preload, positioning) and the oxygen content (supplemental O₂) in the shocked patient simultaneously.","modIndex":5,"chIndex":0},{"num":77,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Explain the structure and function of the alveolar-capillary membrane how gas exchange occurs through the pulmonary circulation.","verdict":"keep","justification":"The book explains that oxygen diffuses from alveolar air into pulmonary capillary blood across an extremely thin membrane (0.5 micrometres).\n\n<strong>Most important to take away:</strong> Anything that thickens this membrane impairs diffusion — pulmonary edema fluid accumulates in the interstitium and alveoli, increasing diffusion distance. This is why CHF causes hypoxia even with a patent airway. CPAP works by forcing fluid back out of the alveoli and re-opening collapsed alveoli, restoring diffusion. Understanding this mechanism makes CPAP intuitive, not just a protocol step.","modIndex":5,"chIndex":0},{"num":78,"modTitle":"Module 6 | Anatomy and Physiology of the Cardiovascular System","chName":"Chapter 14 — Cardiovascular System","text":"Explain how blood circulates throughout the body through the systemic circulation.","verdict":"keep","justification":"Blood pressure, perfusion, and shock all come from
