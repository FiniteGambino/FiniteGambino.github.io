<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMR Quiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #181c27; --border: #252a38;
    --accent: #e85d2f; --accent2: #f0a500; --green: #3ddc84;
    --red: #e85d2f; --text: #e8eaf0; --muted: #6b7280;
    --mono: 'IBM Plex Mono', monospace; --sans: 'IBM Plex Sans', sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 48px; }
  header { width: 100%; max-width: 640px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .logo { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase; }
  .stats { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; gap: 16px; }
  .stat-val { color: var(--text); font-weight: 600; }
  .category-bar { width: 100%; max-width: 640px; display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .cat-btn { font-family: var(--mono); font-size: 11px; padding: 5px 10px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; border-radius: 4px; transition: all 0.15s; letter-spacing: 0.05em; text-transform: uppercase; }
  .cat-btn:hover { border-color: var(--accent); color: var(--accent); }
  .cat-btn.active { border-color: var(--accent); background: var(--accent); color: #fff; }
  .card { width: 100%; max-width: 640px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 28px 24px; }
  .card-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 16px; display: flex; justify-content: space-between; }
  .question { font-size: 17px; font-weight: 500; line-height: 1.55; margin-bottom: 24px; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .opt { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; transition: all 0.15s; background: transparent; text-align: left; font-family: var(--sans); font-size: 14px; color: var(--text); line-height: 1.45; width: 100%; }
  .opt:hover:not(:disabled) { border-color: #4a5168; background: #1e2332; }
  .opt .letter { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--muted); min-width: 18px; margin-top: 1px; }
  .opt.correct { border-color: var(--green); background: rgba(61,220,132,0.08); }
  .opt.correct .letter { color: var(--green); }
  .opt.wrong { border-color: var(--red); background: rgba(232,93,47,0.08); }
  .opt.wrong .letter { color: var(--red); }
  .opt:disabled { cursor: default; }
  .explanation { font-size: 13px; line-height: 1.6; color: #a8b0c4; background: #13172080; border-left: 3px solid var(--accent2); padding: 12px 14px; border-radius: 0 4px 4px 0; margin-top: 4px; display: none; }
  .explanation.show { display: block; }
  .actions { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; }
  .btn { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: var(--border); color: var(--text); }
  .progress { width: 100%; max-width: 640px; height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 20px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s ease; }
  .qcount { font-family: var(--mono); font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <span class="logo">EMR Quiz</span>
  <div class="stats">
    <span>Score: <span class="stat-val" id="scoreDisp">0</span></span>
    <span>Q: <span class="stat-val" id="qNumDisp">0</span></span>
  </div>
</header>
<div class="category-bar" id="catBar">
  <button class="cat-btn active" data-cat="all">All</button>
  <button class="cat-btn" data-cat="airway">Airway</button>
  <button class="cat-btn" data-cat="cardiac">Cardiac</button>
  <button class="cat-btn" data-cat="trauma">Trauma</button>
  <button class="cat-btn" data-cat="medical">Medical</button>
  <button class="cat-btn" data-cat="pharmacology">Pharm</button>
  <button class="cat-btn" data-cat="assessment">Assessment</button>
</div>
<div class="progress"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<div class="card" id="quizCard">
  <div class="card-meta"><span id="catLabel">—</span><span id="diffLabel">—</span></div>
  <div class="question" id="questionText"></div>
  <div class="options" id="optionsList"></div>
  <div class="explanation" id="explanation"></div>
  <div class="actions">
    <span class="qcount" id="qcount"></span>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-ghost" id="skipBtn" onclick="nextQuestion()">Skip</button>
      <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" style="display:none;">Next →</button>
    </div>
  </div>
</div>

<script>
const ALL_QUESTIONS = [{"category": "airway", "difficulty": "foundational", "question": "You arrive on scene to find an unresponsive adult patient. After ensuring scene safety, what is your first airway intervention?", "options": ["A. Insert an oropharyngeal airway", "B. Open the airway using a head-tilt chin-lift", "C. Begin bag-valve-mask ventilation", "D. Apply high-flow oxygen via non-rebreather mask"], "correct": 1, "explanation": "Opening the airway is always the first step before any adjunct or oxygen delivery. In a non-trauma patient, head-tilt chin-lift is the preferred method. You must establish a patent airway before assessing breathing adequacy."}, {"category": "airway", "difficulty": "intermediate", "question": "A 68-year-old male is unconscious with sonorous respirations. You insert an OPA and he immediately gags and vomits. What is your next action?", "options": ["A. Remove the OPA and suction immediately", "B. Hold the OPA in place and turn him onto his side", "C. Increase OPA size to prevent further vomiting", "D. Begin BVM ventilation through the vomit"], "correct": 0, "explanation": "Gagging with an OPA indicates the gag reflex is present and the airway adjunct is contraindicated. Remove it immediately and suction the airway to clear vomit and prevent aspiration. Consider a nasopharyngeal airway if an adjunct is still needed."}, {"category": "airway", "difficulty": "intermediate", "question": "When sizing a nasopharyngeal airway (NPA), what is the correct landmark measurement?", "options": ["A. Tip of the nose to the earlobe", "B. Center of the nose to the angle of the jaw", "C. Tip of the nose to the corner of the mouth", "D. Naris to the tragus of the ear"], "correct": 3, "explanation": "The NPA is sized by measuring from the naris (nostril) to the tragus of the ear. This approximates the distance from the nostril to the nasopharynx. Correct sizing ensures the tip sits in the pharynx without passing into the larynx."}, {"category": "airway", "difficulty": "advanced", "question": "You are ventilating a cardiac arrest patient with a BVM and two rescuers. What is the correct compression-to-ventilation ratio and ventilation rate?", "options": ["A. 30:2 with ventilations over 1 second each", "B. 15:2 with ventilations over 2 seconds each", "C. 30:2 with ventilations over 2 seconds each", "D. Continuous compressions with 10 breaths per minute"], "correct": 0, "explanation": "For adults in cardiac arrest with a BVM (no advanced airway), the ratio is 30:2. Each ventilation should be delivered over 1 second \u2014 just enough to see visible chest rise. Over-ventilation causes gastric distension and reduces venous return, compromising CPR quality."}, {"category": "airway", "difficulty": "foundational", "question": "Which of the following patients is most appropriate for a non-rebreather mask (NRB) at 15 L/min?", "options": ["A. A COPD patient with SpO2 of 88% and laboured breathing", "B. An apneic trauma patient", "C. A responsive patient with SpO2 of 94% after near-drowning", "D. An unconscious patient with suspected opioid overdose"], "correct": 2, "explanation": "NRB masks deliver approximately 90-95% FiO2 and are appropriate for spontaneously breathing patients who need high-flow oxygen, such as this near-drowning patient with low SpO2. COPD patients need titrated O2; apneic patients need BVM; opioid overdose patients need airway positioning and possibly BVM support."}, {"category": "airway", "difficulty": "intermediate", "question": "A 4-year-old is in respiratory distress with stridor. The child is conscious, sitting upright, and drooling. You should:", "options": ["A. Lay the child supine and attempt to visualize the airway", "B. Apply blow-by oxygen and allow the child to remain in position of comfort", "C. Insert a nasopharyngeal airway immediately", "D. Begin BVM ventilation at 20 breaths per minute"], "correct": 1, "explanation": "Stridor with drooling in a child sitting upright (tripod-like) is a classic sign of a potentially life-threatening upper airway obstruction (epiglottitis or croup). Any agitation or forced positioning can cause complete obstruction. Allow position of comfort and use blow-by oxygen \u2014 minimize interventions and transport urgently."}, {"category": "airway", "difficulty": "advanced", "question": "During BVM ventilation, you notice the chest is not rising despite a proper mask seal. What is the most likely cause and correction?", "options": ["A. Oxygen flow too low \u2014 increase to 15 L/min", "B. Airway obstruction \u2014 reposition the airway and consider suction", "C. Bag volume too small \u2014 switch to adult BVM", "D. Mask size incorrect \u2014 switch to a smaller mask"], "correct": 1, "explanation": "Absent chest rise despite proper technique indicates airway obstruction \u2014 the most common cause is poor head position with tongue obstruction. Reposition with head-tilt chin-lift or jaw thrust, suction if vomit is suspected, and reattempt. Do not increase flow rates as this will not overcome a mechanical obstruction."}, {"category": "airway", "difficulty": "foundational", "question": "What is the maximum suction time recommended for an adult patient during oropharyngeal suctioning?", "options": ["A. 5 seconds", "B. 10 seconds", "C. 15 seconds", "D. 20 seconds"], "correct": 2, "explanation": "Suction should be limited to 15 seconds per attempt in adults to prevent hypoxia. Pre-oxygenate before suctioning when possible, and monitor the patient's SpO2 and clinical status throughout. In infants, suction time is even shorter (5-10 seconds)."}, {"category": "cardiac", "difficulty": "foundational", "question": "A 55-year-old male complains of crushing chest pain radiating to his left arm for 30 minutes. He is diaphoretic and pale. What is your priority intervention?", "options": ["A. Obtain a full SAMPLE history before any treatment", "B. Apply oxygen, obtain vitals, and prepare for rapid transport", "C. Have the patient walk to the ambulance to assess exercise tolerance", "D. Administer aspirin and wait for symptoms to resolve"], "correct": 1, "explanation": "This presentation is consistent with an acute MI. Priority is high-flow oxygen, IV access, cardiac monitoring, and rapid transport to a PCI-capable facility. Time to reperfusion is the critical factor in myocardial salvage \u2014 'door to balloon' time directly impacts mortality."}, {"category": "cardiac", "difficulty": "intermediate", "question": "You are performing CPR on a 62-year-old. A bystander says the patient collapsed suddenly without warning. The AED analyzes and advises 'shock advised.' What do you do?", "options": ["A. Continue CPR for 2 minutes before shocking", "B. Clear all personnel and deliver the shock immediately", "C. Check for a pulse before shocking", "D. Shock only if the patient is not breathing"], "correct": 1, "explanation": "When the AED advises a shock, deliver it immediately after ensuring everyone is clear. Early defibrillation is the definitive treatment for shockable rhythms (VF/pVT). Every minute of delay reduces survival by approximately 7-10%. Resume CPR immediately after the shock."}, {"category": "cardiac", "difficulty": "intermediate", "question": "During CPR, you are performing chest compressions. What is the correct depth and rate for an adult?", "options": ["A. 4-5 cm at 60-80/min", "B. At least 5 cm at 100-120/min", "C. At least 6 cm at 120-140/min", "D. 3-4 cm at 80-100/min"], "correct": 1, "explanation": "Current guidelines (based on AHA/ILCOR) recommend chest compressions of at least 5 cm (2 inches) depth at a rate of 100-120 per minute for adults. Allow full chest recoil between compressions. Compressions exceeding 6 cm may cause injury without improving perfusion."}, {"category": "cardiac", "difficulty": "advanced", "question": "A patient is found unresponsive. CPR is in progress. The cardiac monitor shows a wide-complex regular rhythm at 160 bpm with no palpable pulse. This rhythm is best described as:", "options": ["A. Ventricular fibrillation \u2014 shock immediately", "B. Pulseless electrical activity \u2014 continue CPR and find reversible causes", "C. Pulseless ventricular tachycardia \u2014 shock immediately", "D. Supraventricular tachycardia \u2014 vagal maneuvers"], "correct": 2, "explanation": "A wide-complex regular rhythm without a pulse is pulseless ventricular tachycardia (pVT), a shockable rhythm. Defibrillate immediately. This is distinct from PEA (organized rhythm, no shock indicated) and VF (chaotic, irregular). Do not confuse a regular wide-complex rhythm with VF."}, {"category": "cardiac", "difficulty": "intermediate", "question": "You respond to a 70-year-old female with syncopal episode. She is now conscious with BP 88/60, HR 38 bpm, and skin that is cool and pale. What is this presentation most consistent with?", "options": ["A. Hypovolemic shock from internal bleeding", "B. Symptomatic bradycardia", "C. Anaphylactic shock", "D. Diabetic emergency"], "correct": 1, "explanation": "A heart rate of 38 bpm with hypotension and signs of poor perfusion (syncope, cool/pale skin) constitutes symptomatic bradycardia. This is a true emergency requiring rapid transport. At the EMR level, supportive care and oxygen are priorities while arranging advanced care."}, {"category": "cardiac", "difficulty": "foundational", "question": "When applying AED pads to an adult patient, where are the standard pad placements?", "options": ["A. Both pads on the left side of the chest", "B. One pad on the right upper chest below the clavicle, one on the left lateral chest", "C. One pad on the sternum, one on the left shoulder", "D. Both pads on the anterior chest in a vertical orientation"], "correct": 1, "explanation": "Standard AED pad placement is anterolateral: one pad on the right upper chest (below the clavicle, right of the sternum) and one on the left lateral chest (below the axilla, mid-axillary line). This positioning allows current to pass through the myocardium. Anterior-posterior placement is an alternative."}, {"category": "cardiac", "difficulty": "advanced", "question": "A patient has a cardiac arrest. After 2 minutes of CPR the AED advises 'no shock recommended.' You check for a pulse and find none. What is the most important next step?", "options": ["A. Discontinue resuscitation \u2014 rhythm is non-shockable", "B. Resume CPR immediately and search for reversible causes (H's and T's)", "C. Administer a precordial thump", "D. Wait 2 minutes before checking the rhythm again"], "correct": 1, "explanation": "A non-shockable rhythm in cardiac arrest (asystole or PEA) means CPR must continue while identifying and treating reversible causes \u2014 the H's and T's (hypoxia, hypovolemia, hypothermia, hydrogen ion, hypo/hyperkalemia; tension pneumothorax, tamponade, toxins, thrombosis). This is the core management strategy for non-shockable arrests."}, {"category": "cardiac", "difficulty": "intermediate", "question": "Which of the following is NOT a common sign or symptom of left-sided heart failure?", "options": ["A. Dyspnea on exertion", "B. Pulmonary edema with crackles", "C. Peripheral pitting edema", "D. Pink frothy sputum"], "correct": 2, "explanation": "Peripheral pitting edema is a hallmark of right-sided heart failure (systemic venous congestion). Left-sided heart failure causes pulmonary congestion: dyspnea, orthopnea, crackles, and pink frothy sputum. Many patients have biventricular failure, but understanding the distinction helps with clinical reasoning."}, {"category": "trauma", "difficulty": "foundational", "question": "You arrive at an MVC. A restrained driver is conscious but confused. She has a scalp laceration actively bleeding and complains of neck pain. What is your spinal motion restriction priority?", "options": ["A. None \u2014 she is conscious and can tell you if her neck hurts", "B. Manual spinal stabilization immediately upon contact", "C. Apply a cervical collar only after completing primary survey", "D. Wait for patient to be fully immobilized before assessing airway"], "correct": 1, "explanation": "Manual in-line spinal stabilization should be applied immediately upon patient contact in trauma with a mechanism for spinal injury. Do not wait for a c-collar. The collar is a secondary step \u2014 manual stabilization is the first and must be maintained until full immobilization is achieved or spinal injury is ruled out."}, {"category": "trauma", "difficulty": "intermediate", "question": "A motorcyclist is found unresponsive after a high-speed crash. He has gurgling respirations and is not moving. You open his airway using jaw thrust \u2014 why?", "options": ["A. Jaw thrust delivers more oxygen than head-tilt chin-lift", "B. Jaw thrust minimizes cervical spine movement while opening the airway", "C. Head-tilt chin-lift is only for pediatric patients", "D. Jaw thrust is required for all unconscious patients regardless of mechanism"], "correct": 1, "explanation": "In suspected spinal injury, the jaw thrust maneuver opens the airway with minimal cervical spine movement. Airway always takes priority over spinal precautions \u2014 if jaw thrust fails to open the airway adequately, a head-tilt chin-lift is performed, as a dead patient does not benefit from spinal protection."}, {"category": "trauma", "difficulty": "intermediate", "question": "A trauma patient has a penetrating chest wound. You hear air sucking through the wound on inspiration. After sealing the wound with a vented chest seal, the patient suddenly deteriorates with absent breath sounds on the injured side and JVD. What do you suspect?", "options": ["A. Hemothorax \u2014 the seal is preventing blood drainage", "B. Tension pneumothorax developing \u2014 burp or remove the seal", "C. Pericardial tamponade \u2014 the wound reached the heart", "D. Flail chest \u2014 paradoxical movement has worsened"], "correct": 1, "explanation": "Sudden deterioration after sealing an open chest wound with JVD and absent unilateral breath sounds suggests tension pneumothorax \u2014 pressure is building in the pleural space. The vented (flutter-valve) seal should allow air to escape; if using a non-vented seal, it must be temporarily lifted (burped) to release pressure. This is immediately life-threatening."}, {"category": "trauma", "difficulty": "advanced", "question": "Using the shock index, which patient is most likely in compensated hemorrhagic shock?", "options": ["A. HR 70, BP 120/80 (SI = 0.58)", "B. HR 110, BP 90/60 (SI = 1.22)", "C. HR 88, BP 130/70 (SI = 0.68)", "D. HR 60, BP 140/90 (SI = 0.43)"], "correct": 1, "explanation": "The Shock Index (HR \u00f7 SBP) >1.0 is a sensitive early indicator of significant hemorrhage and the need for blood products or surgical intervention. Patient B with SI of 1.22 (110\u00f790) indicates significant hemodynamic compromise. Normal SI is 0.5-0.7; values >1.0 correlate with Class III-IV hemorrhage."}, {"category": "trauma", "difficulty": "foundational", "question": "You are treating a patient with a femur fracture. The leg is angulated and there is no distal pulse. After one attempt to straighten the limb fails to restore the pulse, you should:", "options": ["A. Splint in position of deformity and transport urgently", "B. Make repeated attempts until the pulse returns", "C. Apply a tourniquet above the fracture site", "D. Ignore the pulse finding and focus on airway"], "correct": 0, "explanation": "If realignment does not restore circulation after one attempt, splint in the position found and transport immediately. Repeated manipulation risks further vascular or nerve injury. Absent distal pulse in a long bone fracture is a vascular emergency requiring surgical intervention \u2014 rapid transport is the priority."}, {"category": "trauma", "difficulty": "intermediate", "question": "A patient has blunt abdominal trauma from a steering wheel impact. He is now hypotensive with a rigid, tender abdomen and distension. This presentation is most consistent with:", "options": ["A. Diaphragmatic rupture", "B. Intra-abdominal hemorrhage with peritoneal irritation", "C. Splenic contusion without significant bleeding", "D. Bowel obstruction from impact"], "correct": 1, "explanation": "Rigid, distended abdomen with tenderness after blunt trauma and hypotension indicates significant intra-abdominal hemorrhage causing peritoneal irritation. The liver and spleen are the most commonly injured solid organs in blunt abdominal trauma. This is a surgical emergency \u2014 rapid transport is the definitive treatment."}, {"category": "trauma", "difficulty": "foundational", "question": "What is the primary purpose of applying a pressure dressing to a bleeding wound?", "options": ["A. To keep the wound sterile", "B. To maintain constant pressure over the wound to promote clot formation", "C. To splint underlying bone fractures", "D. To reduce pain at the wound site"], "correct": 1, "explanation": "Pressure dressings work by maintaining direct pressure over a wound, which reduces blood flow and supports clot formation. Hemostasis requires sustained pressure \u2014 lifting to 'check' the wound disrupts the clot. If bleeding soaks through, add more dressing on top rather than removing the original."}, {"category": "trauma", "difficulty": "advanced", "question": "A trauma patient has a GCS of 8 (E2V2M4). Which component of his assessment is most concerning for a severe TBI?", "options": ["A. Eyes open to pain only (E2)", "B. Confused verbal response (V2 = actually incomprehensible sounds)", "C. Withdraws to pain (M4)", "D. All components are equally concerning"], "correct": 3, "explanation": "A GCS of 8 or below defines severe TBI and indicates the patient cannot protect their airway. All three components contribute to the score \u2014 no single one is more important in isolation at this GCS. The critical clinical implication is that airway management and preventing secondary brain injury (hypoxia, hypotension) are immediate priorities."}, {"category": "medical", "difficulty": "foundational", "question": "A 45-year-old diabetic patient is found confused and diaphoretic. He takes insulin. His blood glucose reads 2.1 mmol/L. What is this condition called and what is the EMR treatment?", "options": ["A. Diabetic ketoacidosis \u2014 withhold glucose", "B. Hypoglycemia \u2014 administer oral glucose if he can swallow safely", "C. Hyperglycemia \u2014 position him upright and transport", "D. Hypoglycemia \u2014 administer insulin to stabilize glucose"], "correct": 1, "explanation": "A blood glucose below 4.0 mmol/L with symptoms is hypoglycemia. If the patient has an intact airway and can swallow, oral glucose (gel or sugar) is appropriate. Never administer anything orally to a patient who cannot protect their airway. Insulin is absolutely contraindicated \u2014 it will worsen hypoglycemia."}, {"category": "medical", "difficulty": "intermediate", "question": "A 22-year-old female has sudden onset of shortness of breath, pleuritic chest pain, and leg swelling after a long flight. SpO2 is 91% on room air. What is the most likely diagnosis?", "options": ["A. Spontaneous pneumothorax", "B. Pulmonary embolism", "C. Acute asthma exacerbation", "D. Pericarditis"], "correct": 1, "explanation": "Classic PE presentation: sudden dyspnea, pleuritic chest pain, hypoxia, and a DVT risk factor (prolonged immobility on a long flight). Virchow's triad (stasis, hypercoagulability, endothelial injury) applies here. Treatment is supportive (O2, positioning, IV access) and rapid transport to a hospital for anticoagulation or intervention."}, {"category": "medical", "difficulty": "intermediate", "question": "You respond to a 30-year-old male having a seizure. The seizure stops before you arrive. He is now postictal, breathing adequately, and unresponsive to verbal stimuli. What is the most important immediate intervention?", "options": ["A. Restrain the patient in case of further seizure activity", "B. Position in recovery position and monitor airway", "C. Insert an OPA and begin BVM ventilation", "D. Administer glucose \u2014 all seizures are caused by hypoglycemia"], "correct": 1, "explanation": "Postictal patients require airway monitoring and positioning in the recovery (lateral) position to prevent aspiration. BVM is not indicated if breathing is adequate. Blood glucose must be checked (hypoglycemia can cause seizures), but treating every seizure as hypoglycemia without checking glucose is inappropriate. Never restrain a seizing patient."}, {"category": "medical", "difficulty": "advanced", "question": "A 58-year-old male has sudden onset of severe headache described as 'the worst of my life,' photophobia, and neck stiffness. He denies trauma. What is the most likely and most dangerous diagnosis to consider?", "options": ["A. Tension headache \u2014 treat with rest", "B. Subarachnoid hemorrhage \u2014 rapid transport", "C. Migraine with aura \u2014 reduce stimulation", "D. Viral meningitis \u2014 contact precautions and transport"], "correct": 1, "explanation": "'Thunderclap' headache (worst of life, sudden onset) with meningismus (neck stiffness, photophobia) without trauma is subarachnoid hemorrhage until proven otherwise. This is immediately life-threatening \u2014 re-bleeding risk is highest in the first 24 hours. Rapid transport to CT and neurosurgery is critical. Meningitis is possible but SAH must be excluded first."}, {"category": "medical", "difficulty": "foundational", "question": "A patient is having an anaphylactic reaction with hives, throat tightness, and hypotension after eating shellfish. He has a prescribed EpiPen. As an EMR, you should:", "options": ["A. Administer oral diphenhydramine and monitor", "B. Assist the patient in using his prescribed epinephrine auto-injector", "C. Apply ice to the hives and transport non-emergently", "D. Withhold the EpiPen until confirmed anaphylaxis by a physician"], "correct": 1, "explanation": "Anaphylaxis with airway involvement and hypotension is immediately life-threatening. EMRs in BC can assist patients with their prescribed epinephrine auto-injectors. Epinephrine is the first-line treatment \u2014 antihistamines are adjuncts and do not treat airway compromise or cardiovascular collapse. Do not delay."}, {"category": "medical", "difficulty": "intermediate", "question": "A 67-year-old male presents with sudden onset right-sided facial droop, left arm weakness, and slurred speech that began 45 minutes ago. BP is 190/110. What is the most time-critical aspect of his care?", "options": ["A. Establishing IV access and administering fluid for his hypertension", "B. Rapid transport to a stroke centre within the treatment window", "C. Performing a detailed neurological exam before transport", "D. Monitoring and documenting symptom progression on scene"], "correct": 1, "explanation": "Acute ischemic stroke has a thrombolytic (tPA) treatment window of up to 4.5 hours from symptom onset. This patient is 45 minutes in \u2014 rapid transport to a stroke centre is the single most important intervention. Do not delay transport for IV access or on-scene assessment. Note exact time of symptom onset and perform the Cincinnati Prehospital Stroke Scale."}, {"category": "medical", "difficulty": "advanced", "question": "A COPD patient is in respiratory distress with SpO2 of 84%. You apply a non-rebreather mask and his SpO2 climbs to 96% but his mental status decreases and his breathing becomes shallower. What has occurred?", "options": ["A. The patient is improving \u2014 mental status changes are normal", "B. Oxygen-induced hypercapnic respiratory failure in a hypoxic drive patient", "C. The mask is too tight and causing CO2 rebreathe", "D. The patient is having a stroke from rapid SpO2 change"], "correct": 1, "explanation": "Some severe COPD patients develop chronic CO2 retention and rely on hypoxic drive. Over-oxygenation can blunt this drive, leading to hypoventilation and rising CO2 (hypercapnia), causing decreased LOC. Titrate oxygen to SpO2 88-92% in known COPD patients. If ventilatory depression occurs, reduce FiO2 and prepare for BVM support."}, {"category": "medical", "difficulty": "foundational", "question": "A patient presents with signs of stroke. Which assessment tool is used in the prehospital setting to screen for stroke?", "options": ["A. Glasgow Coma Scale", "B. AVPU scale", "C. Cincinnati Prehospital Stroke Scale", "D. SAMPLE history"], "correct": 2, "explanation": "The Cincinnati Prehospital Stroke Scale (CPSS) assesses three findings: facial droop, arm drift, and speech abnormality. A single abnormal finding has high sensitivity for stroke. It is the standard prehospital stroke screening tool and should be documented with the exact time of symptom onset for hospital notification."}, {"category": "pharmacology", "difficulty": "foundational", "question": "A patient with known angina is having chest pain and has prescribed nitroglycerin. His BP is 102/68. Should you assist with nitroglycerin?", "options": ["A. Yes \u2014 nitroglycerin is safe at any blood pressure", "B. No \u2014 systolic BP below 90-100 mmHg is a contraindication", "C. Yes \u2014 chest pain always overrides blood pressure concerns", "D. No \u2014 nitroglycerin is only for hospital use"], "correct": 1, "explanation": "Nitroglycerin is a vasodilator and can cause significant hypotension. A systolic BP below 90-100 mmHg (protocol-dependent, often 100 mmHg in BC) is a contraindication. Administering NTG in this patient could cause cardiovascular collapse. Also contraindicated if the patient took a phosphodiesterase inhibitor (Viagra, Cialis) within 24-48 hours."}, {"category": "pharmacology", "difficulty": "intermediate", "question": "A patient took too many of his prescribed opioids and is barely conscious with a respiratory rate of 4 breaths/min and pinpoint pupils. Which drug is specifically indicated and how does it work?", "options": ["A. Epinephrine \u2014 stimulates the adrenergic system to reverse CNS depression", "B. Naloxone \u2014 opioid receptor antagonist that competes with opioids at mu receptors", "C. Glucose \u2014 corrects the hypoglycemia caused by opioids", "D. Atropine \u2014 reverses the cholinergic effects of opioids"], "correct": 1, "explanation": "Naloxone (Narcan) is a competitive opioid receptor antagonist. It displaces opioids from mu receptors in the CNS and reverses respiratory depression, CNS depression, and miosis. In BC, EMRs/EMTs can administer intranasal or IM naloxone under the Naloxone for Overdose Prevention program. Titrate to adequate respirations, not full consciousness."}, {"category": "pharmacology", "difficulty": "intermediate", "question": "Aspirin is given to patients with suspected ACS. What is its mechanism of action in this context?", "options": ["A. It reduces pain by blocking prostaglandin synthesis", "B. It prevents platelet aggregation by irreversibly inhibiting COX-1", "C. It dissolves existing clots in coronary arteries", "D. It dilates coronary arteries to improve blood flow"], "correct": 1, "explanation": "In ACS, aspirin irreversibly inhibits cyclooxygenase-1 (COX-1), preventing thromboxane A2 production and thereby inhibiting platelet aggregation. This reduces thrombus propagation at the site of plaque rupture. It does not dissolve clots \u2014 that is the role of thrombolytics or antithrombotics. It should be given as early as possible in suspected MI."}, {"category": "pharmacology", "difficulty": "advanced", "question": "A patient has been stung by a bee and is in anaphylactic shock. You assist with their epinephrine auto-injector (0.3 mg IM). Five minutes later symptoms recur. What should you do?", "options": ["A. Do not repeat \u2014 maximum dose is one injection", "B. Administer a second dose if symptoms recur and transport time is long", "C. Switch to oral antihistamines now that epinephrine has been given", "D. Administer nitroglycerin to counteract the vasopressor effects"], "correct": 1, "explanation": "A second dose of epinephrine can be given if symptoms recur or do not improve, typically after 5-15 minutes. Biphasic anaphylaxis (recurrence of symptoms after initial improvement) occurs in up to 20% of cases. Continue monitoring, maintain airway, and transport urgently \u2014 all anaphylaxis patients require hospital observation regardless of response to epinephrine."}, {"category": "pharmacology", "difficulty": "foundational", "question": "Oral glucose (glucose gel) is indicated for which patient?", "options": ["A. An unconscious diabetic patient with confirmed hypoglycemia", "B. A conscious diabetic patient with suspected hypoglycemia who can swallow", "C. Any diabetic patient regardless of level of consciousness", "D. A hyperglycemic patient to balance blood sugar levels"], "correct": 1, "explanation": "Oral glucose is ONLY appropriate for a conscious patient with an intact gag reflex who can swallow. Administering anything orally to an unconscious patient risks aspiration and airway compromise. Always confirm the patient can swallow before administering. Unconscious hypoglycemic patients require IV dextrose (ALS intervention) or glucagon."}, {"category": "pharmacology", "difficulty": "intermediate", "question": "A patient uses a salbutamol (Ventolin) MDI for asthma. In what situation might you assist with this medication?", "options": ["A. When the patient requests it for any respiratory symptom", "B. When the patient has an acute asthma attack, has their prescribed inhaler, and can self-administer", "C. Only after confirming with medical direction by phone", "D. Never \u2014 inhalers are strictly hospital-only medications for EMRs"], "correct": 1, "explanation": "EMRs in BC can assist patients in using their own prescribed bronchodilator inhalers during acute asthma attacks. Key criteria: it must be the patient's own prescribed medication, the patient must be able to participate in self-administration, and the inhaler must be appropriate for their presentation. Document dose and response."}, {"category": "pharmacology", "difficulty": "advanced", "question": "You administer epinephrine via auto-injector to an anaphylactic patient. Which side effects should you monitor for?", "options": ["A. Bradycardia and hypotension", "B. Tachycardia, hypertension, and anxiety", "C. Sedation and decreased respiratory rate", "D. Hypoglycemia and diaphoresis"], "correct": 1, "explanation": "Epinephrine (adrenaline) is an alpha and beta agonist. Expected side effects include tachycardia, hypertension, pallor, tremor, and anxiety \u2014 all alpha/beta adrenergic effects. These are generally well-tolerated and preferred over anaphylaxis. Monitor for cardiac dysrhythmias, especially in older patients or those with coronary artery disease."}, {"category": "pharmacology", "difficulty": "foundational", "question": "Which of the following is an absolute contraindication to administering nitroglycerin?", "options": ["A. Patient has taken sildenafil (Viagra) in the last 24 hours", "B. Patient is over 65 years old", "C. Patient has a history of hypertension", "D. Patient reports mild nausea"], "correct": 0, "explanation": "Phosphodiesterase-5 inhibitors (sildenafil/Viagra, tadalafil/Cialis) combined with nitroglycerin can cause severe, refractory hypotension \u2014 potentially fatal. This is an absolute contraindication. Always ask about recent use of erectile dysfunction medications before assisting with nitroglycerin. The window is typically 24 hours for sildenafil and up to 48 hours for tadalafil."}, {"category": "assessment", "difficulty": "foundational", "question": "You arrive to find a patient lying on the ground. What is the correct order of the primary survey?", "options": ["A. Airway, Breathing, Circulation, Disability, Exposure", "B. Circulation, Airway, Breathing, Disability, Exposure", "C. Airway, Circulation, Breathing, Disability, Exposure", "D. Disability, Airway, Breathing, Circulation, Exposure"], "correct": 0, "explanation": "The primary survey follows ABCDE: Airway, Breathing, Circulation, Disability (neurological status), and Exposure. This systematic approach ensures life threats are identified and treated in order of priority. In cardiac arrest, some protocols shift to CAB (Circulation first), but the standard primary survey for responsive patients is ABCDE."}, {"category": "assessment", "difficulty": "intermediate", "question": "A patient's GCS is calculated as: eyes open to voice (E3), confused verbal response (V4), localizes to pain (M5). What is his total GCS score?", "options": ["A. 10", "B. 12", "C. 13", "D. 14"], "correct": 1, "explanation": "GCS = E + V + M = 3 + 4 + 5 = 12. The GCS ranges from 3 (deep coma) to 15 (fully alert). Scores of 13-15 indicate mild TBI, 9-12 moderate, and 3-8 severe TBI. Knowing the components matters more than the total \u2014 a patient with E1V1M10 would be impossible, so always report component scores."}, {"category": "assessment", "difficulty": "foundational", "question": "When obtaining a SAMPLE history, what does the 'P' stand for and what information does it gather?", "options": ["A. Pain \u2014 location and quality of pain", "B. Pertinent past history \u2014 relevant prior medical conditions", "C. Prescription medications currently taken", "D. Prognosis \u2014 patient's expectations of outcome"], "correct": 1, "explanation": "In SAMPLE, P stands for Pertinent Past Medical History \u2014 relevant prior conditions, hospitalizations, surgeries, and similar past episodes. This is distinct from M (Medications). A full SAMPLE: Signs/Symptoms, Allergies, Medications, Pertinent past history, Last oral intake, Events leading up to the call."}, {"category": "assessment", "difficulty": "intermediate", "question": "You assess a patient's skin and find it is cool, pale, and diaphoretic. This presentation is most consistent with:", "options": ["A. Fever and infection", "B. Shock or sympathetic nervous system activation", "C. Adequate perfusion", "D. Vasodilation from heat exposure"], "correct": 1, "explanation": "Cool, pale, diaphoretic skin reflects sympathetic (fight-or-flight) activation \u2014 the body is vasoconstricting the periphery to shunt blood to vital organs, and sweating due to adrenergic stimulation. This is a classic shock presentation. Warm, flushed, dry skin suggests vasodilation (fever, distributive shock). Always assess skin as a quick perfusion indicator."}, {"category": "assessment", "difficulty": "advanced", "question": "You are called to a 19-year-old male who is agitated, tachycardic, hyperthermic, and diaphoretic. His friends say he was 'partying.' His pupils are dilated and he has muscle rigidity. What toxidrome does this represent?", "options": ["A. Opioid toxidrome \u2014 administer naloxone", "B. Cholinergic toxidrome from organophosphate exposure", "C. Sympathomimetic toxidrome from stimulant use", "D. Sedative-hypnotic toxidrome from benzodiazepine overdose"], "correct": 2, "explanation": "Agitation, tachycardia, hyperthermia, diaphoresis, mydriasis (dilated pupils), and hypertension represent the sympathomimetic toxidrome \u2014 consistent with cocaine, methamphetamine, or MDMA use. Treatment is supportive: cool the patient, manage agitation safely, and transport. Do not confuse with serotonin syndrome (which includes clonus and hyperreflexia) or anticholinergic toxidrome (which has dry rather than diaphoretic skin)."}, {"category": "assessment", "difficulty": "foundational", "question": "What does OPQRST stand for when assessing a patient's chief complaint?", "options": ["A. Onset, Provocation, Quality, Radiation, Severity, Time", "B. Origin, Position, Quality, Response, Symptoms, Treatment", "C. Onset, Pain, Quality, Region, Severity, Treatment", "D. Origin, Provocation, Quantity, Radiation, Symptoms, Time"], "correct": 0, "explanation": "OPQRST: Onset (when/how it started), Provocation/Palliation (what makes it better or worse), Quality (character of the symptom), Radiation (does it spread), Severity (0-10 scale), Time (duration and pattern). This structured approach ensures a complete symptom assessment and helps identify the likely condition."}, {"category": "assessment", "difficulty": "intermediate", "question": "A 75-year-old female fell at home. She is alert, has a deformed right hip, and vitals are HR 102, BP 108/72, RR 20, SpO2 97%. Applying the mechanism and vitals, what injury pattern should you be most concerned about?", "options": ["A. Isolated hip fracture with no systemic concern", "B. Significant blood loss from femur/hip fracture contributing to shock", "C. Respiratory compromise from pain", "D. Neurological injury from the fall"], "correct": 1, "explanation": "Hip and femur fractures can lose 1-2 litres of blood into the surrounding soft tissue. This patient's tachycardia and borderline hypotension in the context of a hip injury suggests early hemorrhagic shock. In elderly patients, physiologic reserves are reduced \u2014 do not be falsely reassured by BP that appears 'okay.' Monitor closely and transport urgently."}, {"category": "assessment", "difficulty": "advanced", "question": "During scene size-up of an MVC, you note a single car off the road into a ditch. The airbags have deployed, the windshield has a 'starred' impact pattern, and the patient was unrestrained. How does this inform your index of suspicion?", "options": ["A. Low index of suspicion \u2014 single vehicle accidents are rarely serious", "B. High index of suspicion \u2014 mechanism suggests significant energy transfer and potential head/spinal/thoracic injuries", "C. Moderate index of suspicion \u2014 only if the patient complains of pain", "D. Low index of suspicion \u2014 airbag deployment means adequate protection"], "correct": 1, "explanation": "Index of suspicion is built from the mechanism of injury. Deployed airbags indicate high-speed impact; a starred windshield indicates head contact; lack of restraint means the patient was unrestrained at impact. Together these suggest potential TBI, spinal injury, thoracic trauma, and solid organ injury regardless of initial presentation. Assume severe injury until ruled out."}];

let score = 0, qCount = 0, currentCat = 'all';
let pool = [], usedIndices = new Set();

function getPool() {
  return currentCat === 'all' ? ALL_QUESTIONS : ALL_QUESTIONS.filter(q => q.category === currentCat);
}

function nextQuestion() {
  pool = getPool();
  if (usedIndices.size >= pool.length) usedIndices.clear(); // reset when exhausted

  let idx;
  do { idx = Math.floor(Math.random() * pool.length); } while (usedIndices.has(idx));
  usedIndices.add(idx);

  renderQuestion(pool[idx]);
}

function renderQuestion(q) {
  const diffColors = { foundational: '#6b7280', intermediate: '#f0a500', advanced: '#e85d2f' };
  document.getElementById('catLabel').textContent = q.category.toUpperCase();
  const diffEl = document.getElementById('diffLabel');
  diffEl.textContent = q.difficulty;
  diffEl.style.color = diffColors[q.difficulty] || '#6b7280';
  document.getElementById('questionText').textContent = q.question;
  document.getElementById('explanation').className = 'explanation';
  document.getElementById('explanation').textContent = q.explanation;
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('skipBtn').style.display = 'inline-block';
  document.getElementById('qcount').textContent = usedIndices.size + ' / ' + pool.length + ' seen';
  document.getElementById('progressFill').style.width = (usedIndices.size / pool.length * 100) + '%';

  const letters = ['A','B','C','D'];
  const list = document.getElementById('optionsList');
  list.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="letter">' + letters[i] + '</span><span>' + opt.replace(/^[A-D]\.\s*/, '') + '</span>';
    btn.onclick = () => selectAnswer(i, q.correct);
    list.appendChild(btn);
  });
}

function selectAnswer(chosen, correct) {
  qCount++;
  document.getElementById('qNumDisp').textContent = qCount;
  const opts = document.querySelectorAll('.opt');
  opts.forEach((btn, i) => {
    btn.disabled = true;
    if (i === correct) btn.classList.add('correct');
    else if (i === chosen) btn.classList.add('wrong');
  });
  if (chosen === correct) { score++; document.getElementById('scoreDisp').textContent = score; }
  document.getElementById('explanation').classList.add('show');
  document.getElementById('skipBtn').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'inline-block';
}

document.getElementById('catBar').addEventListener('click', e => {
  const btn = e.target.closest('.cat-btn');
  if (!btn) return;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCat = btn.dataset.cat;
  usedIndices.clear();
  nextQuestion();
});

nextQuestion();
</script>
