Q('bx-ethics','restor','r',"Which question best reflects a restorative (rather than punitive) approach?",
["Who was harmed, and what is needed to repair it?","Which rule was broken?","What punishment fits the offense?","How can we prevent the person from returning?"],
"Restorative practice asks <b>who was harmed, what they need, and whose obligation</b> it is to meet that need.");
Q('bx-ethics','restor','v',"A school proposes a face-to-face restorative circle between a student and the partner who has been physically abusing her. The social worker should:",
["Advise against it because of the abuse and power imbalance","Support it because restorative practices reduce suspensions","Facilitate it but let the victim leave early if upset","Require both students to attend"],
"Face-to-face restorative processes are <b>not appropriate</b> with ongoing danger, coercive control or intimate partner violence. <b>Safety comes before repair.</b>");
Q('bx-ethics','consent','r',"When a client is legally mandated to receive services, the social worker should:",
["Explain the nature of the services and the extent of the client's right to refuse","Skip informed consent because the court ordered services","Tell the client they have no choices","Get consent only from the court"],
"NASW 1.03(d): with involuntary clients, explain the <b>nature and extent of services</b> and the <b>extent of their right to refuse</b>.");
Q('bx-ethics','consent','v',"A client signs a consent form but later says she didn't understand what she agreed to. What does this mean?",
["Informed consent wasn't obtained, and the worker should explain again in clear language","The signed form means consent is valid","The client is being manipulative","The worker should end services to avoid liability"],
"Consent is a <b>process</b>. If the client didn't understand, it wasn't <b>informed</b>. Explain in clear language and answer questions.");
Q('bx-ethics','tech','v',"At the start of a video session, what should the social worker confirm?",
["The client's identity and current location","The client's internet speed","That the client is using a computer rather than a phone","That the client has no one else in their household"],
"The Technology Standards say to <b>verify identity and location</b> at each electronic contact, which is essential if there's an emergency.");
Q('bx-ethics','tech','r',"A client sends the social worker a friend request on a personal social media account. The worker should:",
["Decline and explain the policy on social media contact","Accept but avoid posting personal content","Accept only after the case closes","Ignore it without discussing it"],
"NASW 1.06: <b>no personal social media relationships</b> with clients. Decline, and explain why so the client doesn't feel rejected.");
Q('bx-ethics','billing','v',"An insurer won't pay for couples counselling. The client asks the social worker to bill it as individual therapy for depression. What should the worker do?",
["Refuse and explain that billing must accurately reflect the services provided","Agree, since the client does have some depressive symptoms","Bill it as individual therapy but document the couples work","Reduce the fee and bill part of it to insurance"],
"NASW 3.05: billing must <b>accurately reflect the nature and extent of services</b>. Anything else is fraud, even if it helps the client.");
Q('bx-ethics','billing','r',"Under the NASW Code, bartering for services is:",
["Allowed only in very limited circumstances, with the worker responsible for any harm","Always prohibited","Allowed whenever the client can't pay","Allowed if the supervisor approves"],
"Bartering is permitted only when it's accepted practice in the community, essential to providing services, non-coercive and client-initiated. The worker bears <b>full responsibility</b>.");
Q('bx-ethics','eol','r',"Palliative care differs from hospice care in that palliative care:",
["Can be given alongside curative treatment at any stage of illness","Requires a prognosis of six months or less","Is provided only in hospitals","Ends all treatment except pain medication"],
"<b>Palliative</b> = comfort and quality of life at any stage, and <b>curative treatment can continue</b>. Hospice is for about six months or less, with curative treatment stopped.");
Q('bx-ethics','eol','v',"A terminally ill client in a jurisdiction where medical aid in dying is legal asks for help exploring that option. The social worker is morally opposed. What should the worker do?",
["Arrange for the client's care to transfer to another worker who can help","Explain the worker's religious objection and suggest palliative care instead","Refuse the request and document the client's statement","Tell the client's family so they can talk to the client"],
"NASW: respect <b>self-determination</b> and don't impose your values. A worker who objects should <b>transfer care</b>, not block access.");
Q('bx-ethics','colleagues','v',"A social worker notices a colleague often smells of alcohol at work and has missed client appointments. What should the worker do FIRST?",
["Talk with the colleague about the concern","Report the colleague to the licensing board","Tell the colleague's clients","Ignore it unless a client is harmed"],
"NASW 2.08: <b>consult with the colleague first</b> when feasible and help them take remedial action. Use formal channels if that doesn't work.");
Q('bx-ethics','colleagues','r',"Emotional exhaustion, cynicism and feeling ineffective caused by prolonged workplace stress best describes:",
["Burnout","Vicarious trauma","Compassion satisfaction","Countertransference"],
"<b>Burnout</b> comes from workplace conditions and builds gradually. Vicarious trauma comes from exposure to clients' trauma.");
// ASSESSMENT & PLANNING
Q('bx-assess','sdoh','v',"A client with diabetes keeps missing medical appointments. The team calls her \"noncompliant.\" What should the social worker do FIRST?",
["Ask about practical barriers such as transportation, cost, work hours and child care","Explain the health risks of missing appointments","Refer her to a diabetes education class","Close the case until she is ready to engage"],
"Think <b>social determinants of health</b>: \"noncompliance\" often reflects barriers like transportation or cost. Assess barriers before blaming motivation.");
Q('bx-assess','sdoh','r',"The Housing First model provides:",
["Permanent housing without requiring sobriety or treatment first","Housing only after 90 days of sobriety","Emergency shelter while treatment is completed","Housing to people who complete job training"],
"Housing First = <b>permanent housing without preconditions</b>, with <b>voluntary</b> support services.");
Q('bx-assess','traffick','r',"Which statement about human trafficking is accurate?",
["A minor in commercial sex is a trafficking victim even without force, fraud or coercion","Trafficking requires moving the person across a border","Most victims are kidnapped by strangers","Victims usually identify themselves as trafficked"],
"For anyone <b>under 18</b> in commercial sex, <b>no force, fraud or coercion</b> needs to be shown. Movement isn't required, kidnapping is rare, and victims often don't self-identify.");
Q('bx-assess','traffick','v',"A young woman comes to a clinic with a man who answers every question for her and holds her ID. What should the social worker do?",
["Find a way to speak with her privately","Ask the man how they are related","Ask her directly, in front of him, whether she is being trafficked","Call the police right away"],
"Someone else speaking for her and holding her ID are <b>trafficking red flags</b>. Speak to her <b>privately</b> and safely; direct questions in front of him could put her at risk.");
Q('bx-assess','cooccur','v',"A client with depression is also drinking heavily. The intake worker suggests treating the alcohol use first and addressing the depression once he is sober. The best approach is:",
["Integrated treatment of both conditions at the same time","Treat the alcohol use first as suggested","Treat the depression first, since it may be causing the drinking","Refer him to two separate agencies and let him choose"],
"For <b>co-occurring disorders</b>, treat both <b>at the same time</b> in an integrated way. Don't require sobriety before mental health care.");
Q('bx-assess','cooccur','r',"The \"no wrong door\" principle means:",
["Clients should get help for both conditions wherever they first seek services","Clients must start with substance use treatment","Clients can be referred anywhere without a follow-up","Every agency offers the same services"],
"Whichever service the person enters first should respond to <b>both</b> their substance use and mental health needs.");
Q('bx-assess','ipv','v',"A woman discloses that her husband hits her. She asks if couples counselling would help. The social worker should:",
["Explain that couples counselling isn't recommended while there's violence, and offer individual support and safety planning","Refer them to couples counselling since both want to save the marriage","Invite the husband to the next session to hear his side","Suggest she leave immediately"],
"Couples counselling is <b>not appropriate</b> while there's abuse; it can lead to retaliation. Offer <b>individual</b> work and a <b>safety plan</b>. Leaving can be the most dangerous time, so it needs planning.");
Q('bx-assess','ipv','r',"In Walker's cycle of violence, the phase with apologies, affection and promises to change is:",
["Reconciliation (honeymoon)","Tension-building","Incident","Calm"],
"After the incident comes <b>reconciliation</b>: apologies and promises, which keep hope alive.");
Q('bx-assess','placement','r',"Working toward reunification with the parents while also preparing a backup permanent plan is called:",
["Concurrent planning","Kinship care","Family preservation","Permanency hearing"],
"<b>Concurrent planning</b> pursues reunification <b>and</b> an alternative permanent plan at the same time, to shorten time in care.");
Q('bx-assess','placement','v',"A child must be removed from home. A grandmother is willing and able to care for the child safely. Generally, the preferred placement is:",
["Kinship care with the grandmother","A non-relative foster home","A group home","An adoptive home"],
"<b>Kinship care</b> with relatives is generally preferred: it keeps family and cultural connections.");
Q('bx-assess','caregiving','v',"A family has just learned that their father has Alzheimer's disease. The son says, \"The doctors are wrong; he's just tired.\" This most likely reflects:",
["Denial, a common first reaction to the diagnosis","A need for a second medical opinion","Caregiver burnout","Anticipatory grief that is resolved"],
"From your practice exam: families usually respond to an Alzheimer's diagnosis with <b>denial first</b>. Acknowledge it before care planning.");
Q('bx-assess','caregiving','r',"A service that gives family caregivers a short break while the person is cared for by others is called:",
["Respite care","Hospice care","Adult protective services","Case management"],
"<b>Respite care</b> gives caregivers temporary relief.");
Q('bx-assess','aging','v',"An 80-year-old man who was sharp last week is suddenly confused and agitated. What should the social worker do FIRST?",
["Arrange a medical evaluation","Refer him for a dementia assessment","Explain to the family that this is normal aging","Suggest a memory care facility"],
"Sudden confusion in an older adult → <b>rule out medical causes first</b> (delirium, infection, medication).");
Q('bx-assess','aging','r',"Which is most consistent with normal aging rather than dementia?",
["Forgetting a name and remembering it later","Getting lost on the way home from a familiar store","Being unable to manage monthly bills","Repeating the same question many times"],
"Normal aging: occasional lapses that <b>don't interfere with daily functioning</b>. The others suggest dementia.");
Q('bx-assess','eating','v',"A college student who is severely underweight says she feels fat and exercises for hours a day. What should the social worker do FIRST?",
["Arrange a medical evaluation","Start CBT for body image","Explore family dynamics around food","Refer her to a nutrition class"],
"Anorexia has one of the highest death rates of any mental disorder. <b>Medical danger comes first</b>.");
Q('bx-assess','eating','r',"Binge eating followed by self-induced vomiting or laxative use, usually at a normal weight, best describes:",
["Bulimia nervosa","Anorexia nervosa","Binge-eating disorder","ARFID"],
"<b>Bulimia</b> = binge + compensatory behavior. Binge-eating disorder has <b>no</b> compensation.");
Q('bx-assess','identity','r',"In the Racial/Cultural Identity Development model, a person who strongly embraces their own culture and rejects the dominant culture is in which stage?",
["Resistance and immersion","Conformity","Introspection","Integrative awareness"],
"<b>Resistance and immersion</b> = embrace own group, reject the dominant culture. Conformity is the opposite.");
Q('bx-assess','identity','v',"A young Asian American client says she has always wanted to be \"like the white kids\" and feels embarrassed by her family's customs. Which stage does this suggest?",
["Conformity","Dissonance","Resistance and immersion","Integrative awareness"],
"<b>Conformity</b>: preferring the dominant culture and devaluing one's own.");
Q('bx-assess','capacity','v',"A 78-year-old woman with mild memory problems refuses to move into assisted living, as her daughter wants. What should the social worker do?",
["Assess whether she understands the risks of this specific decision, and respect it if she does","Support the daughter, since the client has memory problems","Seek guardianship so the move can happen","Tell the client she is not competent to decide"],
"Capacity is <b>decision-specific</b>, and <b>disagreeing is not incapacity</b>. Social workers don't declare competence; courts do. Guardianship is the last resort.");
Q('bx-assess','capacity','r',"Competence (as opposed to capacity) is:",
["A legal determination made by a court","A clinical judgment made by the social worker","Specific to one decision and changes day to day","Assessed with the Mini-Mental State Exam"],
"<b>Competence</b> is legal, decided by a court. <b>Capacity</b> is clinical and decision-specific.");
Q('bx-assess','techenv','r',"Compared with in-person bullying, cyberbullying is more:",
["Persistent and permanent, and harder for adults to notice","Likely to involve physical injury","Easily escaped by going home","Limited to school hours"],
"Cyberbullying is <b>persistent</b> (24/7), <b>permanent</b> (content stays online) and <b>hard for adults to notice</b>.");
Q('bx-assess','techenv','v',"A social worker arrives at a shelter the day after a wildfire destroyed a family's home. What should the worker do FIRST?",
["Make sure the family is safe and help with immediate practical needs","Assess the children for PTSD","Help the family process their feelings about the loss","Give them a referral list for trauma therapy"],
"<b>Psychological First Aid</b>: safety, comfort and <b>practical assistance</b> come first after a disaster.");
Q('bx-assess','history','r',"According to your practice exam, the most important reason to obtain a social history is to:",
["Understand the client's goals","Complete the agency's paperwork","Diagnose the client","Identify who is to blame for the problem"],
"The social history puts the client in context so the plan can be built around <b>the client's goals</b>.");
Q('bx-assess','history','v',"A social worker wants to talk with a client's teacher and doctor to better understand his situation. Before contacting them, the worker should:",
["Get the client's written consent","Contact them, since they are professionals","Contact them, but share only the client's name","Ask the client's parents instead of the client"],
"Talking to others is gathering <b>collateral information</b>, which requires the client's <b>consent</b> except in emergencies or legal mandates.");
Q('bx-assess','ecomap','r',"A diagram placing the family in the centre and showing its relationships with school, work, church and agencies is a(n):",
["Ecomap","Genogram","Sociogram","Timeline"],
"The <b>ecomap</b> (Hartman) shows the family's connections to <b>outside systems</b>; the genogram shows the family tree across generations.");
Q('bx-assess','ecomap','v',"A social worker wants to see which community resources support a family and which relationships are stressful. Which tool fits best?",
["Ecomap","Genogram","MMPI","Family life cycle chart"],
"Resources and stressors in the <b>environment</b> → <b>ecomap</b>. Multigenerational patterns → genogram.");
Q('bx-assess','flc','r',"In Carter and McGoldrick's family life cycle, the stage where parents adjust as adult children leave home is:",
["Launching children and moving on","Families with adolescents","Families in later life","Leaving home: single young adults"],
"<b>Launching children and moving on</b>: accepting exits from and entries into the family (empty nest, in-laws, grandchildren).");
Q('bx-assess','flc','v',"A family's conflict started when the oldest child turned 14 and began demanding more independence. The social worker should view this mainly as:",
["A normal family life cycle transition that requires adjusting boundaries","Evidence that the teen has oppositional defiant disorder","A sign that the parents are too permissive","A problem the teen should address in individual therapy"],
"Stress often shows up at <b>life cycle transitions</b>. Families with adolescents need more <b>flexible boundaries</b>. Normalize before pathologizing.");
Q('bx-assess','tests','r',"A client wants help choosing a career. Which instrument is most appropriate?",
["A vocational (interest) inventory","An intelligence scale","A personality inventory such as the MMPI","A perceptual-motor test"],
"<b>Vocational inventories</b> (e.g., Strong Interest Inventory) measure career interests, not ability.");
Q('bx-assess','tests','r',"The MMPI is best described as a(n):",
["Objective self-report personality inventory","Projective personality test","Intelligence scale","Vocational interest inventory"],
"The <b>MMPI</b> is an <b>objective personality inventory</b> with true/false self-report items. Projective tests (Rorschach, TAT) use ambiguous stimuli.");
Q('bx-assess','socialization','r',"When a person adopts a group's values so completely that they follow them without outside pressure, this is:",
["Internalization","Socialization","Recruitment","Compliance"],
"<b>Internalization</b> = the norms become your own. <b>Socialization</b> is the learning process; <b>recruitment</b> brings new members in.");
Q('bx-assess','socialization','r',"The process by which newcomers learn the norms, values and roles of a group is:",
["Socialization","Internalization","Recruitment","Acculturation"],
"<b>Socialization</b> teaches members how to think and act as the group does. It comes after recruitment and before internalization.");
// INTERVENTION & PRACTICE
Q('bx-interv','generalist','r',"Running a support group for grieving parents is an example of which level of practice?",
["Mezzo","Micro","Macro","Clinical"],
"<b>Mezzo</b> = groups and small communities. Micro = individuals and families; macro = communities and policy.");
Q('bx-interv','generalist','v',"A client who feels overwhelmed by several problems at once is helped to pick one small problem to work on first. This is:",
["Partialization","Reframing","Confrontation","Universalization"],
"<b>Partialization</b> (Perlman) breaks a large problem into smaller parts to build confidence.");
Q('bx-interv','interview','v',"At a first meeting, a client asks, \"So are you going to tell me what to do?\" What should the social worker do?",
["Clarify the worker's role, the purpose of meeting, and how they will work together","Begin the assessment questions","Reassure the client that the worker is an expert","Ask why the client thinks that"],
"From your practice exam: structuring the interview includes <b>clarifying roles</b> and purpose early. Also avoid \"why\" questions; they can sound accusatory.");
Q('bx-interv','interview','r',"Which type of question is generally best avoided in social work interviews?",
["\"Why\" questions","Open-ended questions","Clarifying questions","Closed questions about safety"],
"<b>\"Why\"</b> questions can sound accusatory and make clients defensive. Use \"what\" or \"how.\"");
Q('bx-interv','listening','v',"A client's account of events changes between sessions. What should the social worker do?",
["Gently clarify the details without assuming the client is lying","Confront the client about lying","Document that the client is unreliable","End services because trust has been broken"],
"From your practice exam: <b>don't assume a client is purposely inaccurate</b>. Trauma, memory, stress or language can explain inconsistencies. Clarify.");
Q('bx-interv','listening','r',"In SOLER, the \"L\" stands for:",
["Lean toward the client","Listen reflectively","Limit distractions","Look away occasionally"],
"SOLER: Sit squarely, Open posture, <b>Lean</b> toward the client, Eye contact, Relaxed.");
Q('bx-interv','involuntary','v',"A court-mandated client says, \"I don't need to be here. This is a waste of time.\" What is the best response?",
["Acknowledge the frustration and clarify what is required and what the client can choose","Explain the legal consequences of not attending","Document that the client is resistant","Tell the client that everyone feels that way at first"],
"With involuntary clients: <b>acknowledge feelings</b>, be honest about <b>non-negotiable vs negotiable</b> parts, and offer real choices.");
Q('bx-interv','involuntary','r',"With a mandated client, which item is usually negotiable?",
["The goals and methods of the work within the mandate","Whether the social worker must report non-attendance","The conditions set by the court","The worker's duty to report abuse"],
"Court conditions and reporting duties are <b>non-negotiable</b>; goals, schedule and methods often are negotiable.");
Q('bx-interv','casemgmt','v',"A client needs legal help the agency doesn't offer. What is the best way to refer?",
["Discuss options with the client, get consent, connect them directly with the service, and follow up","Give the client a list of legal aid phone numbers","Tell the client to search online for a lawyer","Close the case once the client says they will call"],
"From your practice exam: learn the <b>referral process</b>. Match it to the client, get <b>consent</b>, use a <b>warm handoff</b>, and <b>follow up</b>.");
Q('bx-interv','casemgmt','r',"Checking regularly that services in the plan are delivered and still meet the client's needs is which case management function?",
["Monitoring","Linking","Advocacy","Assessment"],
"<b>Monitoring</b> tracks whether services are delivered and still fit the client's needs.");
Q('bx-interv','harm','v',"A client who injects opioids says she isn't ready to stop. What should the social worker do?",
["Provide naloxone and safer-use information, and keep her engaged in services","Tell her services will start once she is ready to quit","Refer her to detox immediately","Explain that continued use shows she isn't serious about change"],
"<b>Harm reduction</b> meets people where they are: reduce harm without requiring abstinence, and keep them engaged.");
Q('bx-interv','harm','r',"Which is a core principle of harm reduction?",
["Success is measured by improved well-being, not necessarily abstinence","Abstinence is required to receive services","Drug use should be ignored in assessment","Services should be mandatory"],
"Harm reduction measures success by <b>quality of life and well-being</b>, with non-judgmental, non-coercive services.");
Q('bx-interv','task','r',"Task-centered practice is best described as:",
["Brief, time-limited work on client-identified problems broken into specific tasks","Long-term insight-oriented therapy","A crisis model focused on lethality","A family therapy model focused on boundaries"],
"Task-centered (Reid &amp; Epstein): <b>brief, time-limited</b> (about 8–12 sessions), <b>client-agreed target problems</b>, concrete tasks.");
Q('bx-interv','task','v',"In task-centered work, a client hasn't completed the agreed task for two weeks. The social worker should FIRST:",
["Review the task with the client to find barriers and adjust it","Point out that the client agreed to the task","End services due to lack of progress","Assign a larger task to increase motivation"],
"If tasks aren't getting done, <b>review and adjust the task</b>. It may be too big or unclear, or face barriers.");
Q('bx-interv','crisis','r',"In Roberts' seven-stage crisis model, the FIRST stage is to:",
["Assess lethality and safety","Establish rapport","Explore feelings","Develop an action plan"],
"Stage 1 is a <b>lethality and safety assessment</b> (along with a biopsychosocial assessment).");
Q('bx-interv','crisis','v',"A client in crisis after a job loss is now safe and calmer. Which step comes next in the problem-solving process?",
["Identify the main problems and explore options with the client","Begin long-term therapy on childhood issues","Close the case since the crisis has passed","Tell the client which job to apply for"],
"After safety and rapport, identify the <b>problems</b> and <b>generate alternatives</b> with the client: the problem-solving part of crisis work.");
Q('bx-interv','grief','v',"A client whose husband died two weeks ago says, \"I can't believe he's gone.\" What should the social worker do FIRST?",
["Acknowledge the loss and explore her feelings","Teach her coping skills for grief","Refer her to a bereavement group","Help her plan how to manage the household alone"],
"From your practice exam: <b>acknowledge the loss first</b>, then move to coping. This matches Worden's first task, accepting the reality of the loss.");
Q('bx-interv','grief','r',"The first of Worden's tasks of mourning is to:",
["Accept the reality of the loss","Work through the pain of grief","Adjust to a world without the deceased","Find an enduring connection with the deceased"],
"Worden's tasks start with <b>accepting the reality of the loss</b>.");
Q('bx-interv','behavioral','r',"Which reinforcement schedule produces behavior most resistant to extinction?",
["Variable ratio","Fixed ratio","Fixed interval","Continuous reinforcement"],
"<b>Variable ratio</b> (e.g., slot machines). Continuous reinforcement gives the fastest learning but fades quickly.");
Q('bx-interv','behavioral','r',"Which of the following is NOT an intervention technique?",
["Transference","Role playing","Behavioral rehearsal","Modeling"],
"From your practice exam: <b>transference</b> is a phenomenon (the client redirecting feelings onto the worker), <b>not a technique</b>.");
Q('bx-interv','behavioral','v',"A group member acts out an argument she had with her father years ago so the group can explore what happened. This is:",
["Reenacting","Modeling","Behavioral rehearsal","Transference"],
"<b>Reenacting</b> = acting out a <b>past</b> event to explore past behavior (psychodrama). Rehearsal practises a <b>future</b> behavior.");
Q('bx-interv','assert','v',"A client who always agrees to extra shifts wants to learn to say no to her boss. Which intervention fits best?",
["Assertiveness training with behavioral rehearsal","Anger management","Systematic desensitization","Psychodynamic exploration of her childhood"],
"<b>Assertiveness training</b>: \"I\" statements, role play and rehearsal to express needs respectfully.");
Q('bx-interv','assert','r',"In the SAMHSA anger management model, when should a client take a timeout?",
["During escalation, before reaching an explosion","After an explosion, to reflect","Only when the other person agrees","Only in group sessions"],
"The aggression cycle is escalation → explosion → post-explosion. <b>Intervene during escalation</b>.");
Q('bx-interv','groupmodels','r',"A self-help group where members support each other and the worker acts as a mediator reflects which model?",
["Reciprocal","Remedial","Social goals","Psychoeducational"],
"<b>Reciprocal</b> = mutual aid; worker as mediator. Remedial = treatment; social goals = social change.");
Q('bx-interv','groupmodels','r',"A group run by a worker acting as therapist to change members' problem behaviors follows which model?",
["Remedial","Reciprocal","Social goals","Task"],
"<b>Remedial</b> groups treat individual problems; the worker is the expert/therapist.");
Q('bx-interv','family','v',"In a family session, a mother says her son is \"the problem\" because he breaks curfew. Which response best reflects a family systems view?",
["Explore how the mother and son interact around curfew and the conflict between them","Agree that the son needs individual counselling","Tell the mother she is being too strict","Set consequences for the son with the mother's input"],
"From your practice exam: don't pin the problem on the parent or the child. Frame it as a <b>conflict involving both</b> (circular causality).");
Q('bx-interv','family','v',"During a family session about a teen's grades, the father mentions that he pushed the mother last week. What should the social worker do?",
["Address the violence and assess everyone's safety","Note it and return to the grades, since that's the presenting problem","Suggest discussing it at a later session","Ask the mother whether she wants to talk about it"],
"From your practice exam: <b>don't move away from violence</b> when it comes up. Safety comes before the presenting problem.");
Q('bx-interv','teams','r',"A team in which professionals work together and share knowledge toward common goals is:",
["Interdisciplinary","Multidisciplinary","Intradisciplinary","Parallel"],
"<b>Interdisciplinary</b> = working together and sharing knowledge. Multidisciplinary members work separately in parallel.");
Q('bx-interv','teams','v',"A social worker is asked to mediate a conflict between two neighbours. What is the worker's main role?",
["Help both sides reach their own agreement as a neutral third party","Decide who is right","Recommend a solution and persuade both to accept it","Advocate for the neighbour with less power"],
"A mediator is a <b>neutral third party</b> who helps the parties reach their <b>own</b> agreement.");

window.TIPS = [
{title:'Test yourself (retrieval practice)', body:'Pulling an answer out of memory strengthens it far more than re-reading it. <b>Practice testing</b> was one of only two techniques rated "high utility" in a major review of 10 study techniques.', how:'Quiz and Flashcards tabs. In Learn, turn on <b>Recall mode</b> to blur a topic, try to say it from memory, then tap to check.', ref:'Dunlosky et al., 2013'},
{title:'Space it out (distributed practice)', body:'The other "high utility" technique. Short sessions spread over several days beat one long cram, and even across 3 days it helps.', how:'The plan brings back your weak spots at the start of each day.', ref:'Dunlosky et al., 2013'},
{title:'Mix topics (interleaved practice)', body:'Rated "moderate utility". Mixing question types trains you to recognize <i>which</i> concept a question is testing, which is exactly what the exam asks of you.', how:'Use mixed quizzes across several sections instead of one topic at a time.', ref:'Dunlosky et al., 2013'},
{title:'Explain why (elaboration)', body:'Also rated "moderate utility": ask yourself <i>why</i> an answer is right, and explain it in your own words.', how:'After every question, read the explanation and say out loud why the wrong options are wrong.', ref:'Dunlosky et al., 2013'},

 function evidence(x){var b=[];if(x.miss.length)b.push(x.miss.length+' wrong');if(x.acc!==null)b.push(x.acc+'%');if(x.rc!==null)b.push('recall '+x.rc+'%');return b.join(' · ')||'not tried yet';}
 function drillIds(sx){
  var ids=[],seen={};function add(q){if(!seen[q.id]){seen[q.id]=1;ids.push(q.id);}}
  sx.miss.forEach(add);
  sx.wts.forEach(function(x){x.qs.forEach(function(q){var r=S.q[q.id];if(!r||r.last===0)add(q);});});
  if(ids.length<10){var rest=SW.QS.filter(function(q){return q.m===sx.m.id&&!seen[q.id];}).sort(function(p,q){var a=S.q[p.id],b=S.q[q.id];var sa=a?a.c/a.a:-1,sb=b?b.c/b.a:-1;return sa-sb;});rest.slice(0,10-ids.length).forEach(add);}
  return ids.slice(0,20);
 }

 /* ---- focused review for one section ---- */
 if(parts&&parts[1]&&SW.MOD[parts[1]]){
  var sx=secStats(SW.MOD[parts[1]]), m=sx.m, ids=drillIds(sx), origin='#/weak/'+m.id;
  var h='<div class="crumb"><a href="#/weak">Weak spots</a> ›</div><h1>Review: '+esc(m.title)+'</h1>';
  h+='<p class="sub">'+(m.src==='beyond'?'<span class="ext">Beyond the guide</span> ':'')+(sx.weak?'Flagged because: '+sx.why.join('; ')+'.':'Not flagged right now, but here is everything worth a second look.')+'</p>';
  h+='<div class="stats">'+st(sx.acc===null?'—':sx.acc+'%','section accuracy')+st(sx.miss.length,'questions wrong now')+st(sx.wcards.length,'cards to redo')+st(sx.wts.length,'topics to review')+'</div>';
  h+='<ol class="rv-steps">';
  // step 1
  h+='<li><div class="rv-h"><b>Re-read the weak topics</b><span class="muted small">Use Recall mode: type what you remember before reading</span></div>';
  if(!sx.wts.length) h+='<p class="muted small">No single topic stands out. Skim the section list instead: <a href="#/learn/'+m.id+'">'+esc(m.title)+'</a>.</p>';
  else h+=sx.wts.map(function(x){
   var mm=x.miss.length?'<details class="missed rv-miss"><summary><span class="mk">✕</span><span>What you got wrong ('+x.miss.length+')</span></summary><div class="body">'+x.miss.map(function(q){return '<div class="rv-q"><p><b>'+q.stem+'</b></p><p class="ans">Answer: '+q.opts[0]+'</p><p>'+q.exp+'</p></div>';}).join('')+'</div></details>':'';
   return '<div class="rv-topic"><div class="rv-tt"><a href="#/learn/'+m.id+'/'+x.t.id+'"><b>'+esc(x.t.title)+'</b></a><span class="rv-ev '+tone(x.acc===null&&x.rc!==null?x.rc:x.acc)+'">'+evidence(x)+'</span></div><div class="row"><a class="btn" href="#/learn/'+m.id+'/'+x.t.id+'">'+I.book+'Read</a>'+(x.qs.length?'<button class="btn" data-tq="'+x.t.id+'">'+I.quiz+'Quiz topic ('+x.qs.length+')</button>':'')+'</div>'+mm+'</div>';
  }).join('');
  h+='</li>';
  // step 2
  var nCards=sx.wcards.length||sx.cards.length;
  h+='<li><div class="rv-h"><b>Flashcards</b><span class="muted small">'+(sx.wcards.length?'Your "Again" cards from this section':'All cards in this section')+'</span></div>'+(nCards?'<button class="btn" data-rcards>'+I.cards+'Study '+nCards+' card'+(nCards===1?'':'s')+'</button>':'<p class="muted small">No flashcards for this section.</p>')+'</li>';
  // step 3
  h+='<li><div class="rv-h"><b>Drill it</b><span class="muted small">Your misses first, then untried or weak questions from these topics</span></div>'+(ids.length?'<button class="btn primary" data-drill>'+I.target+'Start drill ('+ids.length+' questions)</button>':'<p class="muted small">No questions in this section.</p>')+'</li>';
  // step 4
  h+='<li><div class="rv-h"><b>Check</b><span class="muted small">Come back here after the drill. The section drops off the list once the evidence is gone.</span></div></li>';
  h+='</ol>';
  var next=all.filter(function(x){return x.weak&&x.m.id!==m.id;}).sort(function(p,q){return q.score-p.score;})[0];
  h+='<div class="row" style="margin-top:14px"><a class="btn" href="#/weak">← All weak spots</a>'+(next?'<a class="btn" href="#/weak/'+next.m.id+'">Next weak section: '+esc(next.m.title)+' →</a>':'')+'</div>';
  main.innerHTML=h;
  main.onclick=function(e){
   var tq=e.target.closest('[data-tq]'); if(tq){var tid=tq.getAttribute('data-tq');window.__startQuiz({mods:[m.id],topic:tid,n:999,type:'mixed',origin:origin});return;}
   if(e.target.closest('[data-rcards]')){ if(sx.wcards.length) window.__startCards({mods:[m.id],weak:true,origin:origin}); else window.__startCards({mods:[m.id],origin:origin}); return;}
   if(e.target.closest('[data-drill]')){window.__startQuiz({ids:ids,origin:origin,label:'Focused review: '+m.title});return;}
  };
  return;
 }

 /* ---- overview ---- */
 var weakSecs=all.filter(function(x){return x.weak;}).sort(function(p,q){return q.score-p.score;});
 var watch=all.filter(function(x){return x.watch;}).sort(function(p,q){return q.score-p.score;});
 var h='<h1>Weak spots</h1><p class="sub">Where to spend your remaining time, based on your quizzes, flashcards and recall scores.</p>';
 h+='<div class="stats">'+st(weakSecs.length,'sections to review')+st(wq.length,'questions wrong now')+st(wc.length,'cards to redo')+st(o.acc===null?'—':o.acc+'%','overall accuracy')+'</div>';
 h+='<h2>Focused review</h2>';
 if(!o.seen&&!wc.length) h+='<div class="card empty">Take a few quizzes first. Sections show up here once there\'s enough evidence of weakness.</div>';
 else if(!weakSecs.length) h+='<div class="card empty">No section has enough evidence of weakness right now. Nice. Keep quizzing new sections to be sure.</div>';
 else{
  h+='<button class="btn primary block" data-go="'+weakSecs[0].m.id+'" style="margin-bottom:12px">'+I.target+'Start with your weakest: '+esc(weakSecs[0].m.title)+'</button>';
  h+='<div class="rv-list">'+weakSecs.map(function(x,i){
   return '<a class="rv-sec" href="#/weak/'+x.m.id+'"><span class="rk">'+(i+1)+'</span><span style="min-width:0"><b>'+esc(SW.mt(x.m))+'</b><span class="small muted rv-why">'+esc(x.why.join(' · '))+'</span>'+(x.acc!==null?'<div class="bar '+tone(x.acc)+'"><i style="width:'+x.acc+'%"></i></div>':'')+(x.wts.length?'<span class="small rv-tops">Topics: '+x.wts.slice(0,3).map(function(y){return esc(y.t.title);}).join(', ')+(x.wts.length>3?' +'+(x.wts.length-3)+' more':'')+'</span>':'')+'</span><span class="chev">'+I.chev+'</span></a>';
  }).join('')+'</div>';
 }
 h+='<p class="muted small">'+RULES+'</p>';
 if(watch.length) h+='<h2>Keep an eye on</h2><div class="card">'+watch.map(function(x){return '<div class="acc"><span class="nm">'+esc(SW.mt(x.m))+'<div class="small muted">'+evidence({miss:x.miss,acc:x.acc,rc:null})+(x.wcards.length?' · '+x.wcards.length+' cards':'')+'</div></span><a class="btn" href="#/weak/'+x.m.id+'">Review</a></div>';}).join('')+'</div>';
 h+='<h2>Quick drills</h2><div class="row" style="margin:0 0 6px"><button class="btn" data-wq'+(wq.length?'':' disabled')+'>'+I.target+'All wrong questions ('+wq.length+')</button><button class="btn" data-wc'+(wc.length?'':' disabled')+'>'+I.cards+'All "Again" cards ('+wc.length+')</button></div>';
 var rows=all.filter(function(x){return x.a>0;});
 h+='<h2>Accuracy by section</h2>';
 if(!rows.length) h+='<div class="card empty">Take a quiz and your section-by-section accuracy will show up here.</div>';
 else{
  rows.sort(function(a,b){return a.acc-b.acc;});
  h+='<div class="card">'+rows.map(function(r){var p=r.acc;return '<div class="acc"><span class="nm">'+esc(SW.mt(r.m))+' <span class="muted small">· '+r.a+' answer'+(r.a===1?'':'s')+'</span><div class="bar '+tone(p)+'"><i style="width:'+p+'%"></i></div></span><span class="pc">'+p+'%</span><a class="btn" href="#/weak/'+r.m.id+'">Review</a></div>';}).join('')+'</div>';
  var unseen=SW.QUIZ_MODS.filter(function(m){return SW.modStats(m.id).att===0;});
  if(unseen.length) h+='<details class="missed"><summary><span>Not quizzed yet ('+unseen.length+')</span></summary><div class="body">'+unseen.map(function(m){return esc(SW.mt(m));}).join(' · ')+'</div></details>';
 }
 if(wq.length){
  h+='<details class="missed"><summary><span>Every wrong question ('+wq.length+')</span></summary><div class="body">';
  var by={}; wq.forEach(function(q){(by[q.m]=by[q.m]||[]).push(q);});
  SW.MODULES.forEach(function(m){ if(!by[m.id])return;
   h+='<h3>'+esc(SW.mt(m))+'</h3>'+by[m.id].map(function(q){var r=S.q[q.id];return '<div class="rv-q"><p><b>'+(r.flag?'⚑ ':'')+q.stem+'</b></p><p class="ans">Answer: '+q.opts[0]+'</p><p>'+q.exp+'</p><p class="small muted">Tried '+r.a+'×, correct '+r.c+'× · <a href="#/learn/'+q.m+'/'+q.t+'">Review topic →</a></p></div>';}).join('');
  });
  h+='</div></details>';
 }
 if(wc.length){
  h+='<details class="missed"><summary><span>Every "Again" card ('+wc.length+')</span></summary><div class="body">'+wc.map(function(c){return '<div class="acc"><span class="nm"><b>'+esc(c.f)+'</b><div class="small muted">'+esc(c.b)+'</div></span></div>';}).join('')+'</div></details>';
 }
 main.innerHTML=h;
 main.onclick=function(e){
  var g=e.target.closest('[data-go]'); if(g){location.hash='#/weak/'+g.getAttribute('data-go');return;}
  if(e.target.closest('[data-wq]')) window.__startQuiz({weak:true,origin:'#/weak'});
  if(e.target.closest('[data-wc]')) window.__startCards({mods:'all',weak:true,origin:'#/weak'});
 };
};

/* ---------- PLAN ---------- */
window.__planGo=function(id){
 var it=null; PLAN.forEach(function(d){d.items.forEach(function(x){if(x.id===id)it=x;});}); if(!it||!it.act)return;
 SW.S.plan[id]=true; SW.save();
 var a=it.act;
 if(a.t==='learn') location.hash='#/learn/'+a.mod;
 else if(a.t==='topic') location.hash='#/learn/'+a.mod+'/'+a.topic;
 else if(a.t==='quiz') window.__startQuiz({mods:a.mods,n:a.n,type:a.type});
 else if(a.t==='weakquiz'){ if(SW.weakQs().length) window.__startQuiz({weak:true}); else {SW.toast('No weak questions yet. Try a mixed quiz.'); window.__startQuiz({mods:'all',n:20,type:'mixed'});} }
 else if(a.t==='cards') window.__startCards({mods:a.mods});
 else if(a.t==='weakcards'){ if(SW.weakCards().length) window.__startCards({mods:'all',weak:true}); else {SW.toast('No weak cards. Reviewing THINK + Ethics cards instead.'); window.__startCards({mods:['think','ethics','mnem']});} }
 else if(a.t==='weak') location.hash='#/weak';
};
var resetArm=false;
V.plan=function(main){
 var S=SW.S, exam=SW.parseDate(S.examDate), di=SW.planDayIndex();
 var h='<h1>Plan</h1><p class="sub">From today to exam day, built around research-backed study methods. Tap <b>Go</b> to jump straight to each step.</p>';
 h+='<div class="card row"><label for="ed" style="font-weight:700">Exam</label><input type="date" id="ed" value="'+esc(S.examDate||'')+'"><input type="time" id="et" value="'+esc(S.examTime||'12:00')+'" aria-label="Exam time"><span class="muted small">'+(SW.daysLeft()!==null?(SW.daysLeft()>=0?SW.daysLeft()+' day'+(SW.daysLeft()===1?'':'s')+' away':'past'):'')+'</span></div>';
 h+='<h2>Your plan to '+(exam?SW.fmtDate(exam)+', '+SW.fmtTime(S.examTime):'exam day')+'</h2>';
 PLAN.forEach(function(d,i){
  var date=exam?new Date(exam.getFullYear(),exam.getMonth(),exam.getDate()+d.offset):null;
  var done=d.items.filter(function(x){return S.plan[x.id];}).length;
  h+='<div class="day'+(i===di?' today':'')+'"><div class="day-h"><b>'+esc(d.label)+(date?' · '+SW.fmtDate(date):'')+'</b><span class="when">'+esc(d.title)+' · '+esc(d.time)+' · '+done+'/'+d.items.length+'</span>'+(i===di?'<span class="tag">Today</span>':'')+'</div>';
  d.items.forEach(function(x){var ck=!!S.plan[x.id];h+='<div class="item'+(ck?' done':'')+'"><input type="checkbox" data-ck="'+x.id+'"'+(ck?' checked':'')+' aria-label="Mark step done"><div class="tx">'+x.text+'</div>'+(x.act?'<button class="btn go" data-go="'+x.id+'">Go</button>':'')+'</div>';});
  h+='</div>';
 });
 h+='<h2>How to study: what the research says</h2><p class="muted small">This app is built around the techniques below. They come from study-skills research, not from the guide.</p>';
 TIPS.forEach(function(t){h+='<div class="tipc"><h3>'+t.title+'</h3><p>'+t.body+'</p><p class="how"><b>In this app:</b> '+t.how+'</p><p class="ref">'+t.ref+'</p></div>';});
 h+='<details class="missed"><summary><span>References</span></summary><div class="body"><ul class="refs">'+REFS.map(function(r){return '<li>'+r+'</li>';}).join('')+'</ul></div></details>';
 h+='<h2>Move your progress between devices</h2><div class="card stack"><p class="small" style="margin:0">Progress is saved in this browser only. To continue on another device, copy your progress code here and paste it into this page on the other device.</p><div class="row"><button class="btn" data-export>Copy progress code</button><button class="btn" data-import>Paste progress code</button></div><textarea id="code" placeholder="Your progress code appears here, or paste one from another device" aria-label="Progress code"></textarea></div>';
 h+='<h2>Reset</h2><div class="card"><button class="btn bad" data-reset>'+(resetArm?'Tap again to erase all progress':'Erase all progress')+'</button></div>';
 main.innerHTML=h;
 $('#ed').addEventListener('change',function(e){if(e.target.value){S.examDate=e.target.value;SW.save();SW.updateChrome();V.plan(main);}});
 $('#et').addEventListener('change',function(e){if(e.target.value){S.examTime=e.target.value;SW.save();SW.updateChrome();V.plan(main);}});
 main.onclick=function(e){
  var ck=e.target.closest('[data-ck]'); if(ck){var id=ck.getAttribute('data-ck');if(ck.checked)S.plan[id]=true;else delete S.plan[id];SW.save();V.plan(main);return;}
  var g=e.target.closest('[data-go]'); if(g){window.__planGo(g.getAttribute('data-go'));return;}
  if(e.target.closest('[data-export]')){
   var code=btoa(unescape(encodeURIComponent(JSON.stringify(S)))); var ta=$('#code'); ta.value=code; ta.select();
   var ok=function(){SW.toast('Progress code copied');}, fb=function(){try{document.execCommand('copy');ok();}catch(x){SW.toast('Select the code and copy it');}};
   if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(ok,fb); else fb();
   return;
  }
  if(e.target.closest('[data-import]')){
   var v=$('#code').value.trim(); if(!v){SW.toast('Paste a progress code into the box first');return;}
   try{var obj=JSON.parse(decodeURIComponent(escape(atob(v)))); if(!obj||typeof obj!=='object'||!obj.q)throw 0; var n=JSON.parse(JSON.stringify(SW.DEFAULT)); for(var k in obj)n[k]=obj[k]; SW.S=n; SW.save(); SW.applyTheme(); window.__quizReset(); SW.updateChrome(); SW.toast('Progress imported'); V.plan(main);}
   catch(x){SW.toast('That code didn\'t work. Copy the whole code and try again.');}
   return;
  }
  if(e.target.closest('[data-reset]')){
   if(!resetArm){resetArm=true;V.plan(main);setTimeout(function(){resetArm=false;},4000);return;}
   resetArm=false; var keep={examDate:S.examDate,theme:S.theme}; var n2=JSON.parse(JSON.stringify(SW.DEFAULT)); n2.examDate=keep.examDate; n2.theme=keep.theme; SW.S=n2; SW.save(); window.__quizReset(); SW.updateChrome(); SW.toast('Progress erased'); V.plan(main);
  }
 };
};

/* ---------- ROUTER ---------- */
function route(){
 var parts=location.hash.replace(/^#\/?/,'').split('/'); var r=parts[0]||'home'; if(!V[r])r='home';
 window.__keys=null;
 var main=$('#main'); main.onclick=null;
 V[r](main,parts);
 SW.updateChrome();
 var titles={home:'Home',learn:'Learn',quiz:'Quiz',cards:'Flashcards',weak:'Weak spots',plan:'Plan'};
 document.title='SW Exam Prep · '+titles[r];
}
window.addEventListener('hashchange',function(){route();window.scrollTo(0,0);});
document.addEventListener('keydown',function(e){ if(!window.__keys)return; var tg=e.target.tagName; if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return; if(e.metaKey||e.ctrlKey||e.altKey)return; if(tg==='BUTTON'&&(e.key==='Enter'||e.key===' '))return; window.__keys(e); });
SW.applyTheme(); SW.renderShell(); route();
})();

</script>
</body>
