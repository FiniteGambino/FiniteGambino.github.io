["Assess her suicide risk","Praise her progress and space out sessions","Begin planning for termination","Explore what has helped her mood improve"],
"<b>Sudden ↑ energy after depression</b> is a suicide risk factor, and giving away possessions is a red flag (commenter's note). Triage comes first.");
Q('think','risk','r',"Which is a suicide PROTECTIVE factor in the guide?",
["Family responsibility","Prior attempts","Isolation","Substance use"],
"Protective factors: <b>support system, beliefs, family responsibility</b>. The others are risk factors.");
Q('think','risk','r',"The difference between plan and intent is:",
["Plan = how; intent = determination/desire to follow through","Plan = the desire; intent = the method","They mean the same thing","Plan = passive ideation; intent = active ideation"],
"<b>Plan</b> (how) vs <b>Intent</b> (determination/desire to follow through).");
Q('think','risk','v',"A client discloses active suicidal thoughts. Which response is consistent with the guide?",
["Develop a safety plan: warning signs, coping strategies, contacts, professional resources, means restriction","Have the client sign a no-suicide safety contract","Tell the client to call if things get worse","Schedule a follow-up appointment in two weeks"],
"<b>DO NOT use safety contracts (outdated).</b> Make a safety plan: warning signs, internal coping strategies, social contacts, professional resources, means restriction.");
Q('think','risk','r',"Which of these is part of a safety plan in the guide?",
["Means restriction","A signed no-harm contract","A promise not to tell family","Weekly medication changes"],
"Safety plan: warning signs, internal coping strategies, social contacts, professional resources, <b>means restriction</b>.");
Q('think','risk','v',"A client says, 'If my neighbor blocks my driveway again, I'll shoot him. I keep a rifle in my truck.' What should the social worker do?",
["Act on the duty to warn: there's a threat to an identifiable person and access to a weapon","Explore the client's childhood experiences with anger","Teach anger-management skills and keep it confidential","Wait to see if the client repeats the threat"],
"Homicide risk: <b>threats to an identifiable person + access to weapons → duty to warn</b>.");
Q('think','risk','r',"The guide's triage sequence is:",
["Assess lethality → stabilize → plan → follow-up","Plan → assess → stabilize → follow-up","Follow-up → assess → plan → stabilize","Stabilize → follow-up → assess → plan"],
"Safety first: <b>Assess lethality → stabilize → plan → follow-up</b>.");
Q('think','risk','v',"A client arrives in acute crisis after her apartment burned down. She is shaking and can't focus. What should the social worker do FIRST?",
["Make sure she is safe and help her stabilize","Complete a full biopsychosocial assessment","Explore earlier losses in her life","Schedule her for next week when she is calmer"],
"Crisis intervention: <b>ensure safety &amp; stabilize before assessing</b>. Planning and follow-up come after.");
Q('think','hyp','v',"On a home visit, a social worker sees several empty alcohol bottles in the kitchen. What should the social worker do?",
["Ask the client about them","Refer the client to detox","Report the client to CPS","Document a diagnosis of alcohol use disorder"],
"<b>Assess before action</b>. This is one of the guide's practice-test examples: empty bottles → <b>ask the client</b>.");
Q('think','hyp','v',"A client refuses services, saying her illness is 'God's will.' What should the social worker do?",

topics:[
{id:'aop', title:'Anti-oppressive practice & power',
guide:`<p><b>Anti-oppressive practice</b> looks at how <b>systems and institutions</b> (laws, agencies, policies) create disadvantage. It isn't only about how one worker treats one client.</p>
<div class="tbl"><table><tr><th>Idea</th><th>What it means</th></tr>
<tr><td><b>Anti-oppressive practice</b></td><td>Name and challenge <b>structural</b> power and oppression (racism, sexism, ableism, classism, etc.)</td></tr>
<tr><td><b>Anti-racist practice</b></td><td>Anti-oppressive practice focused specifically on <b>racism</b> and its effects</td></tr>
<tr><td><b>Power differential</b></td><td>The worker holds institutional power: records, referrals, reports, access to resources. Be <b>transparent</b> about it; never pretend it isn't there</td></tr>
<tr><td><b>Internalized oppression</b></td><td>A client absorbs society's negative messages about their group. Frame it as a product of the environment, not a personal failing</td></tr>
<tr><td><b>Cultural mistrust</b></td><td>Wariness of institutions that have harmed people like the client. A <b>reasonable reading</b> of history, not pathology or "resistance"</td></tr>
<tr><td><b>Critical consciousness</b></td><td>Seeing problems as shaped by social, political and economic conditions, then acting on that (reflection + action)</td></tr></table></div>`,
simple:'', tip:`Ask whether the problem in the question is <b>individual or systemic</b>. Wrong answers often treat a reasonable response to discrimination (like distrust) as a symptom, or make the client educate the worker about their culture.`,
refs:[['SWTP: Anti-oppressive and anti-racist approaches (2026)','https://socialworktestprep.com/blog/2026/august/13/anti-oppressive-and-anti-racist-approaches/']]},

{id:'intersect', title:'Intersectionality',
guide:`<p><b>Intersectionality</b> (term coined by <b>Kimberlé Crenshaw</b>) means a person's identities (race, gender, class, disability, sexual orientation, immigration status…) <b>overlap</b> and create a <b>distinct</b> experience of privilege or oppression.</p>
<ul><li>The effects are <b>not additive</b>. A Black disabled woman doesn't face "racism + sexism + ableism" as three separate streams; she faces one combined experience.</li>
<li>In assessment: ask about <b>all</b> of a client's identities and how they interact, instead of focusing on one.</li>
<li>The same person can hold privilege in one identity and face oppression in another.</li></ul>`,
simple:'', tip:`If an answer choice looks at only one part of a client's identity when several are in play, it's usually weaker than the one that considers how they combine.`,
refs:[['SWTP: Anti-oppressive and anti-racist approaches (2026)','https://socialworktestprep.com/blog/2026/august/13/anti-oppressive-and-anti-racist-approaches/'],['Columbia Law School: Crenshaw on intersectionality','https://www.law.columbia.edu/news/archive/kimberle-crenshaw-intersectionality-more-two-decades-later']]},

{id:'bias', title:'Privilege, implicit bias & microaggressions',
guide:`<div class="tbl"><table><tr><th>Term</th><th>Meaning</th></tr>
<tr><td><b>Privilege</b></td><td>Unearned advantages that come from belonging to a dominant group</td></tr>
<tr><td><b>Implicit bias</b></td><td>Attitudes or stereotypes that affect decisions <b>without conscious awareness</b>. Everyone has them, so the fix is ongoing <b>self-reflection</b> and supervision</td></tr>
<tr><td><b>Microaggressions</b> (Derald Wing Sue)</td><td>Everyday slights that send a demeaning message to someone because of their group</td></tr></table></div>
<p><b>Sue's three types</b></p>
<div class="tbl"><table><tr><th>Type</th><th>What it is</th><th>Example</th></tr>
<tr><td><b>Microassault</b></td><td>Explicit, deliberate slur or exclusion</td><td>A racist joke, then "just kidding"</td></tr>
<tr><td><b>Microinsult</b></td><td>Rude or insensitive, often <b>unintentional</b>, message that demeans</td><td>"You're so articulate" said in surprise</td></tr>
<tr><td><b>Microinvalidation</b></td><td>Denies or dismisses the person's lived experience</td><td>"I don't see color"; "Racism isn't a thing anymore"</td></tr></table></div>`,
simple:'', tip:`If a worker commits or witnesses a microaggression, the right answer <b>addresses it</b> (acknowledge, repair, explore the impact). It doesn't ignore it or turn the moment into the worker's guilt.`,
refs:[['SWTP: Anti-oppressive and anti-racist approaches (2026)','https://socialworktestprep.com/blog/2026/august/13/anti-oppressive-and-anti-racist-approaches/'],['PBS: Microassaults, microinsults and microinvalidations','https://www.pbslearningmedia.org/resource/cb19-ss-types.microaggressions/microassult-microinsults-and-microinvalidation/']]},

{id:'culture', title:'Cultural humility & ethnocentrism', pe:true,
guide:`<div class="tbl"><table><tr><th>Term</th><th>Meaning</th></tr>
<tr><td><b>Ethnocentrism</b></td><td>Judging another culture by the standards of <b>your own</b> culture, and seeing yours as the norm or superior</td></tr>
<tr><td><b>Cultural relativism</b></td><td>Understanding a culture by <b>its own standards</b>, not through your own lens (the opposite of ethnocentrism)</td></tr>
<tr><td><b>Xenocentrism</b></td><td>Believing another culture is superior to your own</td></tr>
<tr><td><b>Culture shock</b></td><td>Disorientation when facing an unfamiliar way of life</td></tr>
<tr><td><b>Cultural humility</b></td><td>Lifelong <b>self-reflection</b> and learning; the client is the expert on their own culture</td></tr></table></div>
<p><b>NASW Code 1.05</b> (2021 revision) was retitled from "Cultural Competence" to "<b>Cultural Awareness and Social Diversity</b>." The idea: you never finish becoming competent; you keep learning, reflect on your own biases, and provide culturally informed services.</p>`,
simple:'', tip:`On your practice exam, ethnocentrism came up as a straight definition (recall) question. If an answer choice judges a client's practice as wrong just because it differs from the worker's culture, that's ethnocentrism.`,
refs:[['Lumen: Ethnocentrism and cultural relativism','https://courses.lumenlearning.com/wm-introductiontosociology/chapter/ethnocentrism-and-cultural-relativism/'],['NASW: 1.05 Cultural Awareness and Social Diversity','https://www.socialworkers.org/About/Ethics/Ethics-Education-and-Resources/Ethical-Standard-of-the-Month/Cultural-Awareness-and-Social-Diversity']]},

{id:'lang', title:'Language access & interpreters',
guide:`<p>Clients have a right to understand their services. The NASW Code (1.03) says to use a <b>qualified interpreter</b> or translator when a client has trouble understanding the language used.</p>
<div class="tbl"><table><tr><th>Do</th><th>Don't</th></tr>
<tr><td>Use a <b>trained professional interpreter</b></td><td>Use <b>children</b> as interpreters, ever</td></tr>
<tr><td><b>Speak directly to the client</b> and keep eye contact with them</td><td>Talk to the interpreter ("Tell her that…")</td></tr>
<tr><td><b>Brief the interpreter</b> before the session</td><td>Rely on family or friends unless there's no alternative or the client insists</td></tr>
<tr><td>Speak in <b>short segments</b>; allow extra time</td><td>Talk for a long time without pausing</td></tr>
<tr><td>Review <b>confidentiality</b> with the interpreter</td><td>Assume the interpreter knows the rules</td></tr></table></div>`,
simple:'', tip:`Family members, and especially children, are the classic wrong answer: they break confidentiality, shift family roles, and may filter what's said (for example in abuse or medical situations).`,
refs:[['KSDE: Tips for using interpreters','https://www.ksde.gov/Portals/0/Title/ESOL/Interpreter-TipsforUsing.pdf'],['SWTP: Principles and techniques of interviewing','https://socialworktestprep.com/blog/2024/september/20/the-principles-and-techniques-of-interviewing/'],['NASW Code of Ethics: Responsibilities to clients','https://www.socialworkers.org/About/Ethics/Code-of-Ethics/Code-of-Ethics-English/Social-Workers-Ethical-Responsibilities-to-Clients']]},

{id:'access', title:'Neurodiversity, disability & Deaf culture',
guide:`<ul><li><b>Neurodiversity</b>: natural variation in how brains work (autism, ADHD, dyslexia…). It frames these as <b>differences</b>, not only deficits.</li>
<li><b>Person-first language</b> ("person with a disability") vs <b>identity-first language</b> ("autistic person"). Many autistic adults prefer identity-first. Best practice: <b>ask the person</b> what they prefer.</li>
<li><b>Deaf</b> (capital D) = a cultural and linguistic community that shares <b>American Sign Language (ASL)</b>, a full language with its own grammar. Lowercase "deaf" refers to the hearing condition.</li>
<li>Use a <b>qualified ASL interpreter</b>, not writing notes back and forth or a family member.</li>
<li><b>Accessibility</b> covers physical (ramps, space), communication (interpreters, plain language, alternate formats) and cultural access.</li>
<li>Assess <b>communication ability</b> (hearing, vision, literacy, cognition) early and adapt, rather than assuming the client didn't understand or isn't cooperating.</li></ul>`,
simple:'', tip:`Look for the answer that adapts the service to the client (accommodation, interpreter, the client's preferred language) rather than asking the client to adapt to the agency.`,
refs:[['Disability Rights Texas: Identity-first vs people-first language','https://disabilityrightstx.org/en/2023/04/13/identity-first-language-vs-people-first-language/'],['National Association of the Deaf: Community and culture FAQ','https://www.nad.org/resources/american-sign-language/community-and-culture-frequently-asked-questions/']]},

{id:'immig', title:'Immigrants, refugees & acculturation',
guide:`<div class="tbl"><table><tr><th>Term</th><th>Meaning</th></tr>
<tr><td><b>Refugee</b></td><td>Outside their country with a <b>well-founded fear of persecution</b> (race, religion, nationality, social group, political opinion)</td></tr>
<tr><td><b>Asylum seeker</b></td><td>Has asked for protection; the claim hasn't been decided yet</td></tr>
<tr><td><b>Economic migrant</b></td><td>Moves mainly for better economic opportunity, not to flee persecution</td></tr></table></div>
<p><b>Berry's acculturation strategies</b>: do you keep your heritage culture, and do you take on the host culture?</p>
<div class="tbl"><table><tr><th>Strategy</th><th>Heritage culture</th><th>Host culture</th></tr>
<tr><td><b>Integration</b> (biculturalism; <b>best outcomes</b>)</td><td>Keep</td><td>Adopt</td></tr>
<tr><td><b>Assimilation</b></td><td>Give up</td><td>Adopt</td></tr>
<tr><td><b>Separation</b></td><td>Keep</td><td>Reject</td></tr>
<tr><td><b>Marginalization</b> (worst outcomes)</td><td>Give up</td><td>Reject</td></tr></table></div>
<p>Watch for <b>acculturation gaps</b> in families: children often adapt faster than parents, which can cause conflict and role reversal (e.g., a child interpreting for parents).</p>`,
simple:'', tip:`Explore the client's own migration story and cultural values before assuming a problem. Don't make immigration status a condition for help unless the question makes it legally necessary.`,
refs:[['Maricopa Open: Berry\'s model of acculturation','https://open.maricopa.edu/culturepsychology/chapter/berrys-model-of-acculturation/'],['Wikipedia: Refugee (1951 Convention definition)','https://en.wikipedia.org/wiki/Refugee']]},

{id:'indig', title:'Indigenous peoples & historical oppression',
guide:`<ul><li><b>Historical trauma</b> (Maria Yellow Horse <b>Brave Heart</b>): cumulative, collective wounding across generations from colonization, forced removal, boarding and <b>residential schools</b>, and lost language and ceremony. It's shared by a community and ongoing, not just one person's PTSD.</li>
<li><b>MMIW / MMIWG</b>: Missing and Murdered Indigenous Women (and Girls). Canada's National Inquiry (2019 final report) called the violence a genocide.</li>
<li><b>Indian Child Welfare Act (ICWA, US, 1978)</b>: when a Native child is involved in child welfare, it requires <b>active efforts</b> to keep the family together and <b>prioritizes placement with extended family and the tribe</b>. The tribe can take part in the case or move it to tribal court.</li>
<li><b>Truth and reconciliation</b>: harmed people's testimony comes first. Reconciliation is a possible outcome, not a requirement, and it is <b>not the same as forgiveness</b>.</li></ul>`,
simple:'', tip:`Right answers keep decisions with the community, partner with cultural leaders, and pair acknowledgment of harm with concrete action. Wrong answers rush to closure or put the institution's comfort first.`,
refs:[['SWTP: Truth, reconciliation and restorative practices (2026)','https://socialworktestprep.com/blog/2026/september/15/truth-reconciliation-and-restorative-practices/'],['NICWA: What is ICWA?','https://www.nicwa.org/what-is-icwa/'],['CBC: National inquiry calls MMIWG a Canadian genocide','https://www.cbc.ca/news/indigenous/genocide-murdered-missing-indigenous-women-inquiry-report-1.5157580']]},

{id:'lgbtq', title:'Sexual orientation, gender identity & relationships',
guide:`<ul><li><b>Sexual orientation</b> (who you're attracted to) and <b>gender identity</b> (your internal sense of gender) are different things.</li>
<li><b>Coming out</b> is the client's decision: <b>they choose the timing and who to tell</b>. Help them explore feelings, <b>assess safety</b> first (family reaction, housing, school, work), and plan for coping.</li>
<li><b>Pronouns</b>: ask; don't assume. If you get it wrong, correct yourself briefly and move on.</li>
<li><b>Don't pathologize</b>: LGBTQ+ identity is not a disorder. Conversion therapy is harmful and not supported.</li>
<li><b>LGBTQ+ youth</b> face higher rates of <b>homelessness</b> and family rejection; family acceptance is protective.</li>
<li><b>Diverse relationship structures</b> (e.g., polyamory): assess the relationship without treating the structure itself as the problem.</li></ul>`,
simple:'', tip:`Answers built on <b>self-determination</b> and <b>safety</b> win. Wrong answers push the client to come out, tell the family for them, or treat the identity as the problem.`,
refs:[['Agents of Change: Working with LGBTQ+ populations','https://agentsofchangeprep.com/blog/working-with-lgbtq-populations-cultural-competency-tips-for-the-aswb-exam/'],['Agents of Change: 10 new topics in the 2026 blueprint','https://agentsofchangeprep.com/blog/10-new-topics-in-the-2026-aswb-blueprint/']]},

{id:'restor', title:'Restorative practices',
guide:`<div class="tbl"><table><tr><th>Retributive (punitive)</th><th>Restorative</th></tr>
<tr><td>What rule was broken? What does the person deserve?</td><td><b>Who was harmed</b>, what do they need, and <b>whose obligation</b> is it to meet that need?</td></tr></table></div>
<p><b>Three key features</b></p><ul><li><b>Voluntary, informed participation</b>, especially from the harmed person</li><li><b>Acknowledging the harm</b> (not fact-finding or blame)</li><li><b>Negotiated repair agreements</b>, not assigned penalties</li></ul>
<p><b>Forms</b>: peacemaking/healing circles, victim–offender dialogue, <b>family group conferencing</b> (from Māori practice in New Zealand), restorative school discipline.</p>
<p><b>Not appropriate face to face</b> when there's ongoing danger, coercive control or a big power imbalance, such as <b>intimate partner violence</b>. Safety comes before repair.</p>`,
simple:'', tip:`If a restorative option appears in a case involving ongoing abuse, it's probably a trap. Safety first.`,
refs:[['SWTP: Truth, reconciliation and restorative practices (2026)','https://socialworktestprep.com/blog/2026/september/15/truth-reconciliation-and-restorative-practices/']]},

{id:'consent', title:'Informed consent in depth',
guide:`<p>NASW Code <b>1.03</b>. Use <b>clear, understandable language</b> to explain:</p>
<ul><li>The <b>purpose</b> of services, <b>risks</b>, limits due to third-party payers, <b>costs</b>, reasonable <b>alternatives</b>, the <b>right to refuse or withdraw</b>, and the <b>time frame</b></li>
<li>Give the client a chance to <b>ask questions</b></li></ul>
<div class="tbl"><table><tr><th>Situation</th><th>What the Code says</th></tr>
<tr><td>Literacy or language barrier</td><td>Explain verbally or arrange a <b>qualified interpreter</b></td></tr>
<tr><td>Client lacks capacity</td><td>Get permission from an <b>appropriate third party</b>, and still inform the client at their level</td></tr>
<tr><td><b>Involuntary client</b></td><td>Explain the <b>nature and extent of services</b> and the <b>extent of their right to refuse</b></td></tr>
<tr><td>Electronic services</td><td><b>Verify identity and location</b>; discuss tech risks; assess if remote work suits the client</td></tr></table></div>`,
simple:'', tip:`Consent is a process, not a single signature. If the client doesn't understand, the consent isn't informed.`,
refs:[['NASW Code of Ethics: Responsibilities to clients','https://www.socialworkers.org/About/Ethics/Code-of-Ethics/Code-of-Ethics-English/Social-Workers-Ethical-Responsibilities-to-Clients']]},

{id:'tech', title:'Technology & telehealth ethics',
guide:`<p>From the <b>NASW/ASWB/CSWE/CSWA Standards for Technology in Social Work Practice</b> and the 2021 Code:</p>
<ul><li><b>Informed consent</b> covers tech-specific risks: technology failure, interruptions, privacy breaches</li>
<li><b>Verify the client's identity and location</b> at the start of each electronic contact (needed for emergencies)</li>
<li>Follow the laws of <b>both</b> the worker's and the <b>client's jurisdiction</b> (licensure)</li>
<li>Have an <b>emergency plan</b> and a backup way to communicate</li>
<li>Protect records: <b>encryption</b>, firewalls, secure platforms</li>
<li><b>No personal social media</b> relationships with clients (Code 1.06); never post identifying client information</li>
<li>Don't search clients online without consent, except in <b>emergencies</b> with serious safety concerns</li></ul>`,
simple:'', tip:`A client Googled by curiosity, a friend request, or a telehealth session with no emergency plan are all ethics red flags on the exam.`,
refs:[['NASW: Standards for Technology in Social Work Practice','https://www.socialworkers.org/Practice/NASW-Practice-Standards-Guidelines/Standards-for-Technology-in-Social-Work-Practice'],['NASW Code of Ethics: Responsibilities to clients','https://www.socialworkers.org/About/Ethics/Code-of-Ethics/Code-of-Ethics-English/Social-Workers-Ethical-Responsibilities-to-Clients']]},

{id:'billing', title:'Billing & fees',
guide:`<div class="tbl"><table><tr><th>Standard</th><th>Rule</th></tr>
<tr><td><b>3.05 Billing</b></td><td>Bills must <b>accurately reflect</b> the nature and extent of services and <b>who provided them</b></td></tr>
<tr><td><b>1.13 Payment</b></td><td>Fees must be <b>fair, reasonable</b> and match the service, considering the client's ability to pay</td></tr>
<tr><td><b>Bartering</b></td><td>Only in limited cases: accepted practice in the community, essential to providing services, negotiated without coercion, and at the client's initiative with informed consent. The worker carries full responsibility</td></tr>
<tr><td><b>1.16 Termination for non-payment</b></td><td>Allowed in fee-for-service settings if the arrangement was clear, it was discussed, and the client isn't a danger to self or others</td></tr></table></div>
<p><b>Examples of fraud</b>: billing for sessions that didn't happen, billing a longer or different service than delivered, billing under another provider's name.</p>`,
simple:'', tip:`Any answer that "adjusts" a bill or diagnosis to get insurance to pay is wrong, even if it helps the client.`,
refs:[['NASW Code: Practice settings (3.05)','https://www.socialworkers.org/About/Ethics/Code-of-Ethics/Code-of-Ethics-English/Social-Workers-Ethical-Responsibilities-in-Practice-Settings'],['NASW Code: Responsibilities to clients (1.13, 1.16)','https://www.socialworkers.org/About/Ethics/Code-of-Ethics/Code-of-Ethics-English/Social-Workers-Ethical-Responsibilities-to-Clients']]},

{id:'eol', title:'End-of-life ethics',
guide:`<div class="tbl"><table><tr><th>Term</th><th>Meaning</th></tr>
<tr><td><b>Advance directive</b></td><td>Document stating health care wishes for a time the person can't communicate them</td></tr>
<tr><td><b>Living will</b></td><td>Type of advance directive listing which treatments the person wants or refuses</td></tr>
<tr><td><b>Health care power of attorney / proxy</b></td><td>Names a <b>person</b> to make medical decisions if the client loses capacity</td></tr>
<tr><td><b>Palliative care</b></td><td>Comfort and quality of life at <b>any stage</b> of serious illness; <b>curative treatment can continue</b></td></tr>
<tr><td><b>Hospice</b></td><td>Comfort care near the end of life (prognosis about <b>6 months or less</b>); curative treatment stops</td></tr></table></div>
<p><b>NASW position</b>: respect client <b>self-determination</b> in end-of-life decisions, including access to <b>medical aid in dying</b> where it's legal. Don't impose your own values. A worker who objects on moral grounds should <b>transfer care</b> to another worker, not block the client.</p>`,
simple:'', tip:`Your role is to support an informed decision, explore the client's values and connect family and team, not to decide for them or talk them out of it.`,
refs:[['NASW: End-of-life decision making and care (policy)','https://www.socialworkers.org/LinkClick.aspx?fileticket=JWAkKetOeW0%3D&portalid=0'],['NIA: Palliative care vs hospice','https://www.nia.nih.gov/health/hospice-and-palliative-care/what-are-palliative-care-and-hospice-care'],['Wikipedia: Advance healthcare directive','https://en.wikipedia.org/wiki/Advance_healthcare_directive']]},

{id:'colleagues', title:'Colleagues, impairment & self-care',
guide:`<p><b>Impaired, incompetent or unethical colleague</b> (NASW 2.08–2.10). Same order every time:</p>
<ol class="ladder"><li><b>Talk to the colleague first</b> when feasible, and help them take corrective action</li><li>If that doesn't work, go through <b>formal channels</b>: employer, agency, licensing or regulatory board, NASW</li></ol>
<p>Also defend colleagues who are <b>unjustly</b> accused.</p>
<div class="tbl"><table><tr><th>Term</th><th>Cause</th><th>Looks like</th></tr>
<tr><td><b>Burnout</b></td><td>Prolonged <b>workplace</b> stress and overload; builds gradually</td><td>Exhaustion, cynicism, detachment, feeling ineffective</td></tr>
<tr><td><b>Secondary / vicarious trauma</b></td><td>Exposure to <b>clients' trauma</b></td><td>Intrusive thoughts, numbness, anxiety; changed worldview</td></tr>
<tr><td><b>Compassion fatigue</b></td><td>Cost of ongoing <b>empathic caring</b> for suffering people</td><td>Depleted empathy, numbness, hopelessness</td></tr></table></div>
<p>The 2021 Code added that <b>professional self-care is paramount</b> for competent, ethical practice. Prevention is personal (boundaries, support) <b>and organizational</b> (supervision, debriefing, manageable caseloads).</p>`,
simple:'', tip:`Going straight to the licensing board is usually wrong unless the client is in immediate danger. Talk to the colleague first.`,
refs:[['NASW Code: Responsibilities to colleagues','https://www.socialworkers.org/About/Ethics/Code-of-Ethics/Code-of-Ethics-English/Social-Workers-Ethical-Responsibilities-to-Colleagues'],['SWTP: Burnout, secondary trauma and compassion fatigue','https://socialworktestprep.com/blog/2024/march/04/burnout-secondary-trauma-and-compassion-fatigue/']]}
]});

// ================= BEYOND THE GUIDE: ASSESSMENT & PLANNING =================
MODULES.push({
id:'bx-assess', n:'B2', src:'beyond', title:'Assessment & Planning', blurb:'Assessment concepts, tools and populations on the 2026 outline that the guide skips',
intro:'About 33% of the 2026 Bachelors exam. This fills in social problems, special populations, and the assessment tools and terms from your practice exam.',
topics:[
{id:'sdoh', title:'Social determinants, poverty & homelessness',
guide:`<p><b>Social determinants of health (SDOH)</b>: the conditions where people are born, live, learn, work, play, worship and age that affect health and quality of life.</p>
<p><b>Healthy People 2030's five domains</b></p>
<div class="tbl"><table><tr><th>Domain</th><th>Examples</th></tr>
<tr><td><b>Economic stability</b></td><td>Income, employment, food and housing security</td></tr>
<tr><td><b>Education access and quality</b></td><td>Literacy, school quality, early childhood education</td></tr>
<tr><td><b>Health care access and quality</b></td><td>Insurance, having a regular provider</td></tr>
<tr><td><b>Neighborhood and built environment</b></td><td>Safe housing, transportation, clean air and water</td></tr>
<tr><td><b>Social and community context</b></td><td>Discrimination, social support, incarceration, civic participation</td></tr></table></div>
<p><b>Housing First</b>: give people experiencing homelessness <b>permanent housing without preconditions</b> (no sobriety or treatment required first). Support services are <b>voluntary</b> and offered alongside.</p>`,
simple:'', tip:`When a client's "noncompliance" is really about transportation, cost, housing or child care, the right answer addresses the <b>barrier</b>, not the client's motivation.`,
refs:[['Healthy People 2030: Social determinants of health','https://odphp.health.gov/healthypeople/priority-areas/social-determinants-health'],['National Alliance to End Homelessness: Housing First','https://endhomelessness.org/resources/policy-information/protecting-the-use-of-housing-first/']]},

{id:'traffick', title:'Human trafficking',
guide:`<p><b>Human trafficking</b> = using <b>force, fraud or coercion</b> to get someone to perform <b>labor</b> or <b>commercial sex</b>.</p>
<div class="tbl"><table><tr><th>Key fact</th><th>Detail</th></tr>
<tr><td><b>Minors</b></td><td>Any commercial sex involving someone <b>under 18</b> is sex trafficking. <b>No force, fraud or coercion needs to be shown</b></td></tr>
<tr><td><b>Movement</b></td><td><b>Not required</b>. People can be trafficked in their own hometown</td></tr>
<tr><td><b>Kidnapping</b></td><td>Rare. Control is usually psychological: debt bondage, threats, manipulation, romance</td></tr>
<tr><td><b>Self-identification</b></td><td>Victims often <b>don't see themselves</b> as victims, out of fear, shame, loyalty or language barriers</td></tr></table></div>
<p><b>Red flags</b>: someone else holds their ID or passport; they're not allowed to speak alone; debt to an employer; living where they work; scripted answers; signs of fear, injuries, or not knowing their address.</p>`,
simple:'', tip:`Interview the person <b>privately</b> and use a trauma-informed approach. Don't expect them to label it "trafficking." Safety comes before gathering details.`,
refs:[['FBI: Human trafficking','https://www.fbi.gov/investigate/violent-crime/human-trafficking'],['DHS Blue Campaign: What is human trafficking?','https://www.dhs.gov/blue-campaign/what-human-trafficking'],['SWTP CEUs: What human trafficking really looks like','https://blog.swtpceus.com/what-human-trafficking-really-looks-like/']]},

{id:'cooccur', title:'Co-occurring disorders',
guide:`<p><b>Co-occurring disorders</b> = a substance use disorder <b>and</b> a mental health disorder at the same time.</p>
<ul><li><b>Integrated treatment</b>: treat both <b>at the same time</b>, by the same team or in a coordinated way, not one after the other</li>
<li><b>"No wrong door"</b>: whichever service the person walks into first should respond to both needs</li>
<li><b>Screen for both</b>: one condition often hides or worsens the other</li>
<li><b>Don't require sobriety</b> before offering mental health treatment</li></ul>`,
simple:'', tip:`"Refer them to substance use treatment and address the depression once they're sober" is the classic wrong answer. Integrated care is the right one.`,
refs:[['SAMHSA Advisory: SUD treatment for people with co-occurring disorders (TIP 42)','https://www.samhsa.gov/resource/ebp/advisory-substance-use-disorder-treatment-people-co-occurring-disorders-based-tip-42']]},

{id:'ipv', title:'Domestic violence dynamics', pe:true,
guide:`<p><b>Walker's cycle of violence</b> (1979). Violence tends to escalate over time, and the gaps between phases shorten.</p>
<ol class="ladder"><li><b>Tension-building</b>: stress and conflict build up</li><li><b>Incident</b>: the abusive episode</li><li><b>Reconciliation / "honeymoon"</b>: apologies, affection, promises to change</li><li><b>Calm</b>: a quieter period that keeps hope alive</li></ol>
<p>Criticism: many survivors never experience a honeymoon phase. The <b>Duluth Power and Control Wheel</b> describes abuse as a pattern of <b>power and control</b> tactics (isolation, economic control, threats, using children, etc.).</p>
<ul><li><b>Leaving can be the most dangerous time</b>, so plan it with a <b>safety plan</b></li>
<li><b>Couples counseling is not appropriate</b> while there's abuse. It can lead to retaliation. Use individual sessions and safety planning; refer the abusive partner to a batterer intervention program</li>
<li>Screen <b>privately</b>, never in front of the partner</li>
<li>Per the guide's SAULS HARM: children witnessing DV but not in imminent danger → psychoeducation + safety plan, not an automatic CPS call</li></ul>`,
simple:'', tip:`From your practice exam: if violence comes up, <b>don't move away from it</b>. Stay with the disclosure and assess safety. Changing the subject to the "presenting problem" is wrong.`,
refs:[['Futures Without Violence: The cycle of domestic violence','https://promising.futureswithoutviolence.org/the-cycle-of-domestic-violence/'],['Psych Central: Why couples counseling doesn\'t work in abusive relationships','https://psychcentral.com/relationships/why-couples-counseling-doesnt-work-in-abusive-relationships'],['Wikipedia: Lenore E. Walker','https://en.wikipedia.org/wiki/Lenore_E._Walker']]},

{id:'placement', title:'Out-of-home placement & permanency',
guide:`<div class="tbl"><table><tr><th>Term</th><th>Meaning</th></tr>
<tr><td><b>Permanency planning</b></td><td>Getting a child into a <b>safe, stable, lasting</b> family as quickly as possible</td></tr>
<tr><td><b>Reunification</b></td><td>Returning the child to their parents: the <b>usual first goal</b> when it's safe</td></tr>
<tr><td><b>Kinship care</b></td><td>Placement with <b>relatives or close family friends</b>; generally preferred over non-relative foster care</td></tr>
<tr><td><b>Foster care</b></td><td>Temporary care by licensed caregivers</td></tr>
<tr><td><b>Guardianship / adoption</b></td><td>Permanent options when reunification isn't possible</td></tr>
<tr><td><b>Concurrent planning</b></td><td>Working on reunification <b>and</b> a backup permanent plan <b>at the same time</b>, from the moment the child enters care</td></tr></table></div>
<p>Removal is a last resort (the guide covers "family preservation first"). For Native children, <b>ICWA</b> requires active efforts and prioritizes extended family and tribe.</p>`,
simple:'', tip:`Children in care often grieve their parents even after abuse. Validate loyalty and loss; don't expect them to be relieved.`,
refs:[['Child Welfare Information Gateway: Concurrent planning','https://www.childwelfare.gov/resources/concurrent-planning-timely-permanence/'],['NICWA: What is ICWA?','https://www.nicwa.org/what-is-icwa/']]},

{id:'caregiving', title:'Caregiving & a dementia diagnosis in the family', pe:true,
guide:`<p>From your practice exam: when a family hears an <b>Alzheimer's diagnosis</b>, <b>denial usually comes first</b>. It's also the first of the Alzheimer's Association's warning signs of caregiver stress.</p>
<p><b>Signs of caregiver stress</b> (Alzheimer's Association): denial, anger, social withdrawal, anxiety, depression, exhaustion, sleeplessness, irritability, poor concentration, health problems.</p>
<div class="tbl"><table><tr><th>Support</th><th>What it does</th></tr>
<tr><td><b>Respite care</b></td><td>Short-term care for the person so the caregiver gets a <b>break</b></td></tr>
<tr><td><b>Support groups</b></td><td>Connection with others in the same situation</td></tr>
<tr><td><b>Psychoeducation</b></td><td>What to expect as the disease progresses; reduces blame and conflict</td></tr>
<tr><td><b>Caregiver self-care</b></td><td>Their own medical care, sleep, exercise</td></tr></table></div>`,
simple:'', tip:`Meet the family where they are: acknowledge the shock and denial before jumping to care planning. A stressed, exhausted caregiver is also an elder-abuse risk factor, so assess caregiver strain.`,
refs:[['Alzheimer\'s Association: Caregiver stress','https://www.alz.org/help-support/caregiving/caregiver-health/caregiver-stress']]},

{id:'aging', title:'Normal aging vs dementia',
guide:`<div class="tbl"><table><tr><th>Normal aging</th><th>Possible dementia</th></tr>
<tr><td>Forgets which day it is, <b>remembers later</b></td><td>Loses track of the date or <b>season</b></td></tr>
<tr><td>Makes a bad decision <b>once in a while</b></td><td>Poor judgment <b>much of the time</b></td></tr>
<tr><td>Occasionally misplaces things</td><td>Misplaces things often and <b>can't retrace steps</b></td></tr>
<tr><td>Misses a monthly payment</td><td>Can't manage bills</td></tr>
<tr><td>Slower to recall a word</td><td>Trouble holding a conversation; repeats questions; gets lost in familiar places</td></tr></table></div>
<p>The key difference: normal changes <b>don't interfere with daily functioning</b>; dementia does. Sudden confusion in an older adult → <b>rule out medical causes first</b> (delirium, infection, medication), as the guide says.</p>
<p><b>Ageism</b> = stereotypes and discrimination based on age. Don't assume depression, confusion or loss of sexuality is "just getting old."</p>`,
simple:'', tip:`Depression in older adults can look like dementia. Assess before labelling.`,
refs:[['National Institute on Aging: Memory problems, forgetfulness and aging','https://www.nia.nih.gov/health/memory-loss-and-forgetfulness/memory-problems-forgetfulness-and-aging']]},

{id:'eating', title:'Eating disorders & body image',
guide:`<div class="tbl"><table><tr><th>Disorder</th><th>Key features</th></tr>
<tr><td><b>Anorexia nervosa</b></td><td>Severe <b>restriction</b>, intense fear of weight gain, distorted body image. <b>One of the highest death rates</b> of any mental disorder</td></tr>
<tr><td><b>Bulimia nervosa</b></td><td><b>Binge eating + purging</b> or other compensation (vomiting, laxatives, excessive exercise). Weight is often normal. Dental damage, electrolyte imbalance</td></tr>
<tr><td><b>Binge-eating disorder</b></td><td>Binges with loss of control, shame and secrecy, <b>no purging</b></td></tr>
<tr><td><b>ARFID</b></td><td>Avoids or restricts food because of sensory issues or fear of consequences (choking, vomiting), <b>not body image</b></td></tr></table></div>
<p>Treatment is a <b>team</b>: <b>medical monitoring</b>, therapy and nutrition counselling. Eating disorders often co-occur with depression, anxiety, substance use and suicide risk.</p>`,
simple:'', tip:`With signs of an eating disorder, a <b>medical evaluation</b> comes first. Physical danger outranks insight work.`,
refs:[['NIMH: Eating disorders','https://www.nimh.nih.gov/health/publications/eating-disorders']]},

{id:'identity', title:'Racial & cultural identity development',
guide:`<p><b>Atkinson, Morten &amp; Sue's Racial/Cultural Identity Development model</b> (five stages)</p>
<ol class="ladder"><li><b>Conformity</b>: prefers the dominant culture and devalues their own group</li><li><b>Dissonance</b>: an experience shakes that view; confusion and questioning</li><li><b>Resistance and immersion</b>: embraces their own group and rejects the dominant culture</li><li><b>Introspection</b>: questions rigid "us vs them" views; looks inward</li><li><b>Integrative awareness</b>: secure in their own identity and appreciates other groups</li></ol>
<p>Why it matters: a client's stage affects how they see a worker from the dominant group. Distrust in the resistance stage isn't aimed at you personally.</p>`,
simple:'', tip:`Knowing the stage helps you read the client's reaction. The right answer explores their identity experience rather than arguing with it.`,
refs:[['Psych with Keegan: Racial and cultural identity development stages','https://psychwithkeegan.com/2025/04/what-are-the-stages-of-racial-cultural-identity-development-nce-cpce-study-guide/']]},

{id:'capacity', title:'Capacity, competence & substitute decision-makers',
guide:`<div class="tbl"><table><tr><th></th><th>Capacity</th><th>Competence</th></tr>
<tr><td>Who decides</td><td>A <b>clinician</b></td><td>A <b>court</b> (legal ruling)</td></tr>
<tr><td>Scope</td><td><b>Decision-specific</b>: "Can they make <i>this</i> decision?"</td><td>Global legal status</td></tr>
<tr><td>Can it change?</td><td>Yes, it <b>fluctuates</b> (delirium, medication, time of day)</td><td>Stays until a court changes it</td></tr></table></div>
<ul><li>Adults are <b>presumed competent</b>. "No social worker declares anyone incompetent."</li>
<li><b>Disagreeing is not incapacity.</b> Refusing a recommendation can be self-determination.</li>
<li>Use the <b>least restrictive</b> option first: supported decision-making, <b>power of attorney</b>, <b>health care proxy</b>, advance directive. <b>Guardianship</b> is the last resort.</li>
<li>NASW 1.14: when a client lacks capacity, take reasonable steps to <b>safeguard their interests and rights</b>.</li></ul>`,
simple:'', tip:`Word clues: "adjudicated," "court," "guardian" = competence. "Assess," "fluctuating," "able to understand this choice" = capacity.`,
refs:[['SWTP: Capacity vs competence on the ASWB exam (2026)','https://socialworktestprep.com/blog/2026/july/30/capacity-vs-competence-on-the-aswb-exam/'],['NASW Code: Responsibilities to clients (1.14)','https://www.socialworkers.org/About/Ethics/Code-of-Ethics/Code-of-Ethics-English/Social-Workers-Ethical-Responsibilities-to-Clients']]},

{id:'techenv', title:'Technology, social media & environmental hazards',
guide:`<p><b>Cyberbullying</b>: bullying through phones, computers, social media, gaming or messaging. What makes it different:</p>
<ul><li><b>Persistent</b>: can happen 24/7; hard to escape</li><li><b>Permanent</b>: content can stay online</li><li><b>Hard to notice</b>: adults often miss it</li></ul>
<p>Also assess screen use, online exploitation risk and social media's effect on self-image.</p>
<p><b>Environmental hazards and climate</b>: disasters (fires, floods, heat) cause displacement, loss and trauma. <b>Eco-anxiety</b> = chronic fear or distress about environmental harm and climate change.</p>
<p><b>Psychological First Aid</b> after a disaster (NCTSN core actions): contact and engagement → safety and comfort → stabilization → information gathering → <b>practical assistance</b> → connection with social supports → information on coping → linkage with services.</p>`,
simple:'', tip:`Right after a disaster, meet basic needs and safety before any emotional processing or trauma work.`,
refs:[['StopBullying.gov: What is cyberbullying?','https://www.stopbullying.gov/cyberbullying/what-is-it'],['NCTSN: About Psychological First Aid','https://www.nctsn.org/treatments-and-practices/psychological-first-aid-and-skills-for-psychological-recovery/about-pfa'],['Wikipedia: Eco-anxiety','https://en.wikipedia.org/wiki/Eco-anxiety']]},

{id:'history', title:'Social history & sources of information', pe:true,
guide:`<p>A <b>social history</b> (psychosocial history) gathers the client's background (family, development, education, work, health, relationships, culture, strengths) to understand the client <b>in context</b>.</p>
<p>From your practice exam: the <b>most important reason</b> to get a social history is to understand the <b>client's goals</b>, so planning is built around what the client wants.</p>
<div class="tbl"><table><tr><th>Type of information</th><th>Meaning</th></tr>
<tr><td><b>Primary / direct</b></td><td>From the client themselves (interview, self-report)</td></tr>
<tr><td><b>Collateral</b></td><td>From <b>other people or records</b>: family, teachers, doctors, school, medical and employment records. Needs the client's <b>consent</b> (except emergencies/legal mandates). Key when insight is impaired</td></tr>
<tr><td><b>Subjective</b></td><td>What the client reports: feelings, symptoms</td></tr>
<tr><td><b>Objective</b></td><td>What is observed or measured: behavior, test results, records</td></tr></table></div>
<ul><li><b>Start where the client is</b>: let the client help <b>define the problem</b>; don't impose your own agenda.</li>
<li>Assess <b>communication ability</b> (hearing, vision, literacy, cognition, language) before judging answers.</li></ul>`,
simple:'', tip:`When a question asks what to do first with a new client, answers that involve the client in defining their own problem and goals beat worker-led fact gathering.`,
refs:[['Classace: "Start where the client is"','https://www.classace.io/answers/in-social-work-what-is-the-meaning-of-start-where-the-client-is'],['NASW Case Management Standards (assessment)','https://www.nycourts.gov/reporter/webdocs/nasw_standards_socialwork_casemgt.htm']]},

{id:'ecomap', title:'Ecomaps & genograms', pe:true,
guide:`<div class="tbl"><table><tr><th></th><th>Ecomap</th><th>Genogram</th></tr>
<tr><td>Developed by</td><td><b>Ann Hartman</b> (1975)</td><td>Bowen family systems tradition</td></tr>
<tr><td>Shows</td><td>The client/family's relationships with <b>outside systems</b>: school, work, church, health care, friends, agencies</td><td>The <b>family tree</b> over <b>3+ generations</b>: relationships, patterns, illness, trauma, cutoffs</td></tr>
<tr><td>Layout</td><td>Client/family circle in the <b>centre</b>, systems around it</td><td>□ male, ○ female, X death</td></tr>
<tr><td>Lines</td><td>Thick = strong; dashed = weak/tenuous; hatched/jagged = <b>stressful</b>; <b>arrows</b> = flow of energy or resources</td><td>Lines show marriage, divorce, closeness, conflict</td></tr>
<tr><td>Best for</td><td>Seeing <b>resources and stressors</b> in the environment now</td><td>Seeing <b>multigenerational patterns</b></td></tr></table></div>`,
simple:'', tip:`Question about the client's supports, community resources or environment → ecomap. Question about family patterns across generations → genogram.`,
refs:[['Wikipedia: Eco-map','https://en.wikipedia.org/wiki/Eco-map'],['Encyclopedia.com: Family diagrammatic assessment','https://www.encyclopedia.com/reference/encyclopedias-almanacs-transcripts-and-maps/family-diagrammatic-assessment']]},

{id:'flc', title:'Family life cycle', pe:true,
guide:`<p><b>Carter &amp; McGoldrick's family life cycle</b>: each stage brings predictable tasks and transitions. Families often show stress or symptoms <b>at the transitions</b>.</p>
<ol class="ladder"><li><b>Leaving home: single young adults</b>. Becoming emotionally and financially responsible for yourself</li><li><b>Joining of families through marriage: the new couple</b>. Committing to a new system; realigning with both families</li><li><b>Families with young children</b>. Making room for children; taking on parenting roles</li><li><b>Families with adolescents</b>. More flexible boundaries for teens' growing independence</li><li><b>Launching children and moving on</b>. Accepting exits from and entries into the family (empty nest, in-laws, grandchildren)</li><li><b>Families in later life</b>. Retirement, aging, caring for elders, loss of spouse and peers</li></ol>`,
simple:'', tip:`If a family's problem appears right when a child reaches adolescence or leaves home, think "life cycle transition" and normalize it before pathologizing anyone.`,
refs:[['Leone Centre: Family life cycle in family therapy','https://www.leonecentre.com/glossary/family-life-cycle-in-family-therapy/'],['ScienceDirect Topics: Family cycle','https://www.sciencedirect.com/topics/social-sciences/family-cycle']]},

{id:'tests', title:'Psychological tests & inventories', pe:true,
guide:`<div class="tbl"><table><tr><th>Type</th><th>Measures</th><th>Examples</th></tr>
<tr><td><b>Intelligence scale</b></td><td>Cognitive ability / <b>IQ</b> (average = 100)</td><td>WAIS (adults), WISC (children), Stanford-Binet</td></tr>
<tr><td><b>Personality inventory</b> (objective)</td><td>Personality traits and psychopathology through <b>self-report</b> items (e.g., true/false)</td><td><b>MMPI</b></td></tr>
<tr><td><b>Projective test</b></td><td>Personality through responses to <b>ambiguous</b> stimuli</td><td>Rorschach inkblots, <b>TAT</b> (Thematic <b>Apperception</b> Test)</td></tr>
<tr><td><b>Perception / perceptual-motor test</b></td><td>How a person <b>perceives and reproduces</b> what they see; screens for developmental or neurological problems</td><td>Bender Visual-Motor Gestalt</td></tr>
<tr><td><b>Vocational (interest) inventory</b></td><td>Career <b>interests</b>, not ability</td><td>Strong Interest Inventory (Holland's RIASEC codes)</td></tr></table></div>
<p>Social workers usually <b>refer</b> for psychological testing (psychologists administer most of these), but need to know what each one is for.</p>`,
simple:'', tip:`Match the question's goal to the tool: career direction → vocational inventory; intellectual disability question → intelligence scale; personality or diagnosis → personality inventory.`,
refs:[['Wikipedia: Wechsler Adult Intelligence Scale','https://en.wikipedia.org/wiki/Wechsler_Adult_Intelligence_Scale'],['Wikipedia: MMPI','https://en.wikipedia.org/wiki/Minnesota_Multiphasic_Personality_Inventory'],['Wikipedia: Bender-Gestalt Test','https://en.wikipedia.org/wiki/Bender-Gestalt_Test'],['Wikipedia: Strong Interest Inventory','https://en.wikipedia.org/wiki/Strong_Interest_Inventory']]},

{id:'socialization', title:'Socialization, internalization & recruitment', pe:true,
guide:`<div class="tbl"><table><tr><th>Term</th><th>Meaning</th></tr>
<tr><td><b>Recruitment</b></td><td>Finding and bringing in <b>new members</b> (to a group, program or organization). In group work it's part of <b>planning</b>, along with composition, orientation and contracting</td></tr>
<tr><td><b>Socialization</b></td><td>How newcomers <b>learn</b> the norms, values and roles of a group or society so they can think and act as members do</td></tr>
<tr><td><b>Internalization</b></td><td>Taking those norms and values <b>into yourself</b>, so they become your own and guide you without outside pressure</td></tr>
<tr><td><b>Resocialization</b></td><td>Unlearning old norms and learning new ones (e.g., rehab programs)</td></tr></table></div>
<p>Order to remember: <b>recruit</b> (bring them in) → <b>socialize</b> (teach the norms) → <b>internalize</b> (they own the norms).</p>
<p><b>Agents of socialization</b>: family (first and most influential), school, peers, media, community.</p>`,
simple:'', tip:`Internalization is the deepest level: the person follows the norm because they believe it, not because they're watched or rewarded.`,
refs:[['American Sociological Association: Socialization reading','https://www.asanet.org/wp-content/uploads/savvy/introtosociology/Documents/PersellSocializationReading37.htm'],['Toseland &amp; Rivas planning stage notes (Studocu)','https://www.studocu.com/en-za/document/university-of-south-africa/social-group-work/study-unit-3-planningthe-group-notes/11418949']]}
]});

// ================= BEYOND THE GUIDE: INTERVENTION & PRACTICE =================
MODULES.push({
id:'bx-interv', n:'B3', src:'beyond', title:'Intervention & Practice', blurb:'Practice methods and techniques on the 2026 outline that the guide skips',
intro:'About 32% of the 2026 Bachelors exam. These are the named methods the outline lists but the guide never mentions, plus the practice-exam lessons on interviewing, referral and crisis.',
topics:[
{id:'generalist', title:'Generalist practice & problem-solving', pe:true,
guide:`<div class="tbl"><table><tr><th>Level</th><th>Works with</th><th>Examples</th></tr>
<tr><td><b>Micro</b></td><td>Individuals and families</td><td>Case management, counselling</td></tr>
<tr><td><b>Mezzo</b></td><td>Groups, small communities, organizations</td><td>Support, therapy, education and task groups</td></tr>
<tr><td><b>Macro</b></td><td>Communities, systems, policy</td><td>Advocacy, program development, policy change</td></tr></table></div>
<p><b>Planned change (problem-solving) process</b>: <b>Engagement → Assessment → Planning → Implementation → Evaluation → Termination → Follow-up</b>. The guide lists most of these as the helping process.</p>
<p><b>Helen Harris Perlman's problem-solving model</b>: life is problem-solving, and clients can do it with help. Steps: <b>clarify the facts</b> of the problem → <b>think them through</b> → <b>make a choice</b> and act. <b>Partialization</b> (break a big problem into smaller parts and start with one) builds confidence.</p>`,
simple:'', tip:`Crisis questions often end with problem-solving: once the client is safe and stable, help them identify the problem, list options, and choose a next step themselves.`,
refs:[['UTA Pressbooks: Generalist practice','https://uta.pressbooks.pub/introtosocialwork/chapter/generalist-practice/'],['Allison Murdach: Perlman and the problem-solving model','https://allisonmurdach.wordpress.com/2011/05/05/helen-harris-perlman-and-the-problem-solving-model/']]},

{id:'interview', title:'Structuring the interview', pe:true,
guide:`<p><b>Beginning phase</b> (from your practice exam: structuring includes <b>clarifying roles</b>)</p>
<ul><li>Introduce yourself and <b>build rapport</b></li>
<li>Explain the <b>purpose</b> of the meeting and <b>your role</b>, and ask what the client expects: <b>clarify roles</b></li>
<li>Explain <b>confidentiality and its limits</b></li>
<li>Agree on how you'll work together (collaborative, not top-down)</li></ul>
<div class="tbl"><table><tr><th>Question type</th><th>Use</th></tr>
<tr><td><b>Open-ended</b></td><td>Default; lets the client tell their story</td></tr>
<tr><td><b>Closed</b></td><td>When you need a specific fact (e.g., "Do you have a plan?")</td></tr>
<tr><td><b>"Why" questions</b></td><td><b>Avoid</b>: they sound accusatory. Ask "what" or "how" instead</td></tr></table></div>
<p>Other skills: supporting, clarifying, focusing, validating, reflecting, confronting gently, redirecting back to the main issue.</p>`,
simple:'', tip:`If the client seems confused about why they're there or what the worker does, the first step is to clarify purpose and roles, before assessment or intervention.`,
refs:[['SWTP: Principles and techniques of interviewing','https://socialworktestprep.com/blog/2024/september/20/the-principles-and-techniques-of-interviewing/']]},

{id:'listening', title:'Active listening & assuming good faith', pe:true,
guide:`<p><b>SOLER</b> (Gerard Egan), nonverbal attending:</p>
<div class="tbl"><table><tr><th>Letter</th><th>Meaning</th></tr>
<tr><td><b>S</b></td><td>Sit <b>squarely</b> facing the client</td></tr>
<tr><td><b>O</b></td><td><b>Open</b> posture (no crossed arms)</td></tr>
<tr><td><b>L</b></td><td><b>Lean</b> slightly toward the client</td></tr>
<tr><td><b>E</b></td><td><b>Eye contact</b> (culturally appropriate)</td></tr>
<tr><td><b>R</b></td><td><b>Relaxed</b></td></tr></table></div>
<p><b>Active listening</b> = attending + responding: reflect feelings, paraphrase content, summarize, and check your understanding.</p>
<p>From your practice exam: <b>don't assume a client is purposely inaccurate</b>. Inconsistent or wrong details can come from trauma, memory, stress, cognition, language or culture. <b>Clarify</b> gently instead of accusing.</p>`,
simple:'', tip:`Answers that treat the client as lying ("confront the client about the lie") are usually wrong. Explore and clarify first.`,
refs:[['Counselling Tutor: Egan\'s SOLER model','https://counsellingtutor.com/active-listening-in-counselling-egan-soler-model/']]},

{id:'involuntary', title:'Involuntary & mandated clients',
guide:`<ul><li><b>Be honest</b> about why you're involved and your authority, including any <b>dual role</b> (helper and reporter/investigator)</li>
<li>Spell out what is <b>non-negotiable</b> (court conditions, reporting) and what is <b>negotiable</b> (goals, schedule, methods)</li>
<li>Offer <b>real choices</b> within the limits, and explain the client's <b>right to refuse</b> and its consequences (NASW 1.03(d))</li>
<li><b>Start with the client's view</b> of the problem, even if it's "I don't need to be here"</li>
<li>Don't label them "resistant." Reluctance is a normal reaction to being forced; <b>acknowledge the feelings</b></li>
<li>Build trust through consistency, follow-through and strengths</li></ul>`,
simple:'', tip:`With a mandated client who says "I don't want to be here," the best first response acknowledges their feelings and clarifies the situation, not a lecture on consequences.`,
refs:[['The Social Work Graduate: Working with involuntary clients','https://www.thesocialworkgraduate.com/post/social-work-with-involuntary-clients'],['NASW Code: Responsibilities to clients (1.03)','https://www.socialworkers.org/About/Ethics/Code-of-Ethics/Code-of-Ethics-English/Social-Workers-Ethical-Responsibilities-to-Clients']]},

{id:'casemgmt', title:'Case management & the referral process', pe:true,
guide:`<p><b>Case management</b> (NASW): assess the client's needs, then <b>arrange, coordinate, monitor, evaluate and advocate</b> for a package of services.</p>
<ol class="ladder"><li><b>Assessment</b> (strengths and needs)</li><li><b>Service planning</b> with the client</li><li><b>Linking and coordination</b></li><li><b>Monitoring</b></li><li><b>Advocacy</b></li><li><b>Reassessment</b></li><li><b>Termination</b> with continuity of care</li></ol>
<p><b>Referral process</b> (from your practice exam)</p>
<ul><li>Refer when the client needs expertise or services <b>outside your scope</b>, or when progress stalls (NASW 1.16)</li>
<li><b>Discuss</b> the referral with the client and match it to <b>their</b> needs and goals</li>
<li>Get <b>consent</b> (release of information) before sharing details</li>
<li>Prefer a <b>warm handoff</b>: a direct introduction to the new provider (in person, phone or video), not just a phone number</li>
<li><b>Follow up</b> to confirm the client connected</li></ul>`,
simple:'', tip:`"Give the client a list of agencies" is weaker than connecting them directly and following up. And a referral doesn't mean dropping the client: stay involved until the transfer is complete.`,
refs:[['NASW Standards for Social Work Case Management','https://www.nycourts.gov/reporter/webdocs/nasw_standards_socialwork_casemgt.htm'],['NACo: Warm hand-offs','https://www.naco.org/resource/osc-warm-hand-offs'],['NASW Code: Responsibilities to clients (1.16)','https://www.socialworkers.org/About/Ethics/Code-of-Ethics/Code-of-Ethics-English/Social-Workers-Ethical-Responsibilities-to-Clients']]},

{id:'harm', title:'Harm reduction',
guide:`<p><b>Harm reduction</b> reduces the harms of drug use and other risky behavior <b>without requiring abstinence</b>. "Meet people where they are."</p>
<ul><li><b>Accepts</b> that drug use exists; focuses on reducing harm rather than condemning</li>
<li>Success = better <b>quality of life and well-being</b>, not necessarily stopping use</li>
<li><b>Non-judgmental, non-coercive</b> services</li>
<li>People who use drugs are the <b>primary agents</b> of their own harm reduction</li>
<li>Recognizes how poverty, racism and trauma shape risk</li></ul>
<p><b>Examples</b>: naloxone distribution, syringe services, fentanyl test strips, safer-use education, Housing First.</p>`,
simple:'', tip:`If a client isn't ready to stop using, the right answer offers safer-use options and keeps them engaged. Refusing services until they're abstinent is wrong.`,
refs:[['National Harm Reduction Coalition: Principles of harm reduction','https://harmreduction.org/about-us/principles-of-harm-reduction/']]},

{id:'task', title:'Task-centered practice',
guide:`<p>Developed by <b>William Reid and Laura Epstein</b> (University of Chicago).</p>
<ul><li><b>Brief and time-limited</b>: usually about <b>8–12 sessions</b></li>
<li>Works on <b>specific problems the client identifies and agrees to</b> (target problems)</li>
<li>Breaks goals into small, concrete <b>tasks</b> the client does between sessions</li>
<li><b>Present-focused</b>, practical and collaborative</li></ul>
<p><b>Steps</b>: identify target problems → set goals together → plan and carry out tasks → review progress → adjust tasks → terminate and review.</p>`,
simple:'', tip:`If a client isn't completing tasks, the right move is to <b>review and adjust the task</b> (too big? unclear? barriers?), not to blame the client or end services.`,
refs:[['SWTP: Task-centered approaches','https://socialworktestprep.com/blog/2024/september/30/task-centered-approaches/']]},

{id:'crisis', title:'Crisis intervention steps', pe:true,
guide:`<p><b>Roberts' Seven-Stage Crisis Intervention Model</b></p>
<ol class="ladder"><li><b>Assess</b> lethality, safety and biopsychosocial needs</li><li><b>Establish rapport</b> and psychological contact quickly</li><li><b>Identify the major problems</b>, including what triggered the crisis</li><li><b>Explore feelings and emotions</b> (active listening, validation)</li><li><b>Generate and explore alternatives</b> and coping strategies</li><li><b>Develop and carry out an action plan</b></li><li><b>Follow up</b></li></ol>
<p>This fits the guide: <b>safety and stabilization first</b>; the goal is to <b>restore the previous level of functioning</b>. The later stages are the <b>problem-solving process</b> in action (from your practice exam).</p>`,
simple:'', tip:`Stage 1 is always safety/lethality. Exploring the past or long-term therapy goals during an active crisis is wrong.`,
refs:[['AIHCP: Roberts\' seven-stage crisis intervention model','https://aihcp.net/2024/06/20/crisis-intervention-model-essential-steps-for-effective-response/'],['APA PsycNet: The seven-stage crisis intervention model (Roberts & Ottens)','https://psycnet.apa.org/record/2005-14106-001']]},

{id:'grief', title:'Grief work: acknowledge the loss first', pe:true,
guide:`<p>From your practice exam: the first step in grief work is <b>acknowledging the loss</b>. Do that <b>before</b> moving to coping methods.</p>
<p><b>Worden's four tasks of mourning</b> (unlike stages, the griever actively works on them)</p>
<ol class="ladder"><li><b>Accept the reality of the loss</b></li><li><b>Work through the pain</b> of grief</li><li><b>Adjust</b> to a world without the deceased</li><li>Find an <b>enduring connection</b> with the deceased while moving on with life</li></ol>
<p>Worden says the tasks have "some natural order": later tasks build on accepting the reality first. This also matches the guide's RUSAFE and SFAREAFI: <b>feelings/acknowledgment</b> come before problem-solving.</p>`,
simple:'', tip:`With a grieving client, pick the answer that acknowledges and explores the loss and feelings. Teaching coping skills or making referrals comes later.`,
refs:[['What\'s Your Grief: Worden\'s four tasks of mourning','https://whatsyourgrief.com/wordens-four-tasks-of-mourning/']]},

{id:'behavioral', title:'Behavioral techniques & role play', pe:true,
guide:`<p><b>Reinforcement schedules</b> (the guide covers positive vs negative reinforcement; this adds timing)</p>
<div class="tbl"><table><tr><th>Schedule</th><th>Reward comes after…</th><th>Example</th></tr>
<tr><td><b>Continuous</b></td><td>Every response. <b>Fastest learning</b>, but fades quickly</td><td>Praise every time</td></tr>
<tr><td><b>Fixed ratio</b></td><td>A set number of responses</td><td>Paid per 5 items made</td></tr>
<tr><td><b>Variable ratio</b></td><td>An unpredictable number of responses. <b>Most resistant to extinction</b></td><td>Slot machines</td></tr>
<tr><td><b>Fixed interval</b></td><td>A set amount of time</td><td>Weekly paycheque</td></tr>
<tr><td><b>Variable interval</b></td><td>Unpredictable time</td><td>Surprise inspections</td></tr></table></div>
<div class="tbl"><table><tr><th>Term</th><th>What it is</th></tr>
<tr><td><b>Modeling</b></td><td>Learning by watching someone else (Bandura). The worker or group demonstrates the behavior</td></tr>
<tr><td><b>Role playing</b></td><td>Acting out a situation to practise or explore it</td></tr>
<tr><td><b>Behavioral rehearsal</b></td><td>Practising a new behavior (e.g., saying no) before using it in real life</td></tr>
<tr><td><b>Reenacting</b></td><td>Acting out a <b>past</b> event to <b>explore past behavior</b> and gain insight (psychodrama)</td></tr>
<tr><td><b>Transference</b></td><td>The client redirects feelings from past relationships onto the worker. A <b>phenomenon, not a technique</b></td></tr></table></div>`,
simple:'', tip:`From your practice exam: if "transference" appears in a list of techniques, it doesn't belong. It's something that happens, not something the worker does.`,
refs:[['Lumen: Reinforcement schedules','https://content.one.lumenlearning.com/introductiontopsychology/chapter/reading-reinforcement-schedules/'],['Wikipedia: Psychodrama','https://en.wikipedia.org/wiki/Psychodrama']]},

{id:'assert', title:'Assertiveness & anger management',
guide:`<p><b>Assertiveness training</b> teaches clients to express needs and feelings <b>directly and respectfully</b>.</p>
<div class="tbl"><table><tr><th>Style</th><th>Looks like</th></tr>
<tr><td><b>Passive</b></td><td>Gives up own needs to avoid conflict</td></tr>
<tr><td><b>Aggressive</b></td><td>Meets own needs by overriding others</td></tr>
<tr><td><b>Assertive</b></td><td>Respects <b>both</b> own and others' needs</td></tr></table></div>
<p>Techniques: <b>"I" statements</b> ("I feel… when… I need…"), <b>role play and behavioral rehearsal</b>, body language, saying no, setting boundaries.</p>
<p><b>Anger management</b> (SAMHSA CBT model)</p>
<ul><li><b>Anger meter</b> (1–10) to rate intensity</li>
<li>Know your <b>cues</b>: physical, behavioral, emotional, cognitive</li>
<li><b>Aggression cycle</b>: escalation → explosion → post-explosion. Intervene during <b>escalation</b></li>
<li><b>Anger control plan</b>: <b>timeouts</b>, deep breathing, exercise</li>
<li><b>Cognitive restructuring</b> (A-B-C-D: event, belief, consequence, dispute)</li></ul>`,
simple:'', tip:`A timeout is agreed on ahead of time and used during escalation, not after the explosion.`,
refs:[['SWTP: Assertiveness training','https://socialworktestprep.com/blog/2024/may/22/assertiveness-training/'],['SAMHSA: Anger management CBT manual','https://library.samhsa.gov/product/anger-management-substance-use-disorder-and-mental-health-clients-cognitive-behavioral-therapy-manual/pep19-02-01-001']]},

{id:'groupmodels', title:'Group work models', pe:true,
guide:`<p><b>Papell &amp; Rothman's three models</b> (from your practice exam's "group intervention theory")</p>
<div class="tbl"><table><tr><th>Model</th><th>Purpose</th><th>Worker role</th><th>Examples</th></tr>
<tr><td><b>Social goals</b></td><td><b>Social change</b>, civic participation, social consciousness</td><td>Enabler; promotes democratic participation</td><td>Community action groups</td></tr>
<tr><td><b>Remedial</b></td><td><b>Treat</b> individual problems and change behavior</td><td>Expert / therapist; directive</td><td>Therapy groups, rehab, corrections</td></tr>
<tr><td><b>Reciprocal</b> (mediating)</td><td><b>Mutual aid</b>: members help each other</td><td>Mediator between members and between the group and the agency</td><td>Self-help and support groups</td></tr></table></div>
<p>Group planning tasks (Toseland &amp; Rivas): purpose, <b>recruitment</b>, <b>composition</b> (size, open vs closed, inclusion criteria), <b>orientation</b> and screening, <b>contracting</b>.</p>`,
simple:'', tip:`Mutual aid or "members helping each other" → reciprocal. Treatment or changing individual behavior → remedial. Changing society → social goals.`,
refs:[['Research Korner: Papell & Rothman\'s three models compared','http://researchkorner.blogspot.com/2014/02/comparison-and-contrast-of-three-group.html'],['Toseland & Rivas planning stage notes (Studocu)','https://www.studocu.com/en-za/document/university-of-south-africa/social-group-work/study-unit-3-planningthe-group-notes/11418949']]},

{id:'family', title:'Family sessions: frame the conflict as shared', pe:true,
guide:`<p>From your practice exam:</p>
<ul><li><b>Don't link the problem to the parent or the child alone.</b> In family therapy questions, look for the answer that frames the <b>conflict as involving both</b> (the interaction), not one person as the cause.</li>
<li><b>Don't move away from violence</b> if it comes up in a family session. Stay with it and assess safety.</li></ul>
<p>Why (from the guide's systems theory): <b>circular causality</b>: behavior is mutual and cyclical, so the problem "lives in the relationships." Blaming one member (<b>scapegoating</b>, the "identified patient") keeps the pattern going.</p>
<p>Related tools: <b>reframing</b> (a new, less blaming view of the behavior), focusing on <b>interaction patterns</b>, and a <b>family life cycle</b> view (see Assessment & Planning).</p>`,
simple:'', tip:`Compare "The mother is too controlling" with "The mother and daughter are in conflict over curfew." The second is usually the better answer.`,
refs:[['Built on the guide\'s Systems theory topic, plus your practice-exam notes','#/learn/family/sys']]},

{id:'teams', title:'Interdisciplinary teams & conflict resolution',
guide:`<div class="tbl"><table><tr><th>Team type</th><th>How members work</th></tr>
<tr><td><b>Multidisciplinary</b></td><td>Each profession works <b>separately</b> in parallel, then shares results</td></tr>
<tr><td><b>Interdisciplinary</b></td><td>Professions <b>work together</b> and share knowledge toward shared goals</td></tr>
<tr><td><b>Transdisciplinary</b></td><td>Boundaries blur; roles are shared across disciplines</td></tr></table></div>
<p>NASW 2.03: on a team, bring the <b>social work perspective and values</b>. If there's an ethical disagreement, resolve it through <b>appropriate channels</b> first.</p>
<p><b>Mediation</b>: a <b>neutral third party</b> helps both sides reach their <b>own</b> agreement; the mediator doesn't decide.</p>
<p><b>Principled (interest-based) negotiation</b> (Fisher &amp; Ury, <i>Getting to Yes</i>): separate the <b>people from the problem</b>; focus on <b>interests, not positions</b>; create options for mutual gain; use objective criteria.</p>`,
simple:'', tip:`As a mediator, taking sides or imposing a solution is wrong. Facilitate the parties' own agreement.`,
refs:[['NASW Code: Responsibilities to colleagues (2.03)','https://www.socialworkers.org/About/Ethics/Code-of-Ethics/Code-of-Ethics-English/Social-Workers-Ethical-Responsibilities-to-Colleagues'],['Rehabilitation Matters: Multi-, inter- or transdisciplinary?','https://rehabilitationmatters.com/multidisciplinary-interdisciplinary-or-transdisciplinary/'],['Atlas of Public Management: Fisher and Ury\'s four principles','https://www.atlas101.ca/pm/concepts/fisher-and-urys-four-principles-of-negotiation/']]}
]});

// ================= BEYOND THE GUIDE: QUESTIONS =================
// VALUES & ETHICS
Q('bx-ethics','aop','v',"A client who is Black tells a new social worker that she doesn't trust \"the system\" because her family was mistreated by child welfare. What should the social worker do?",
["Acknowledge that her distrust is understandable given her experience, and be transparent about the worker's role and power","Note the distrust as a sign of resistance to services","Reassure her that the agency treats everyone equally","Ask her to explain her culture so the worker can understand her better"],
"Distrust of institutions that have harmed people like the client is <b>cultural mistrust</b>: a reasonable reading of history, not pathology or resistance. Anti-oppressive practice means being <b>transparent about power</b>. Asking the client to educate the worker puts the burden on her.");
Q('bx-ethics','aop','r',"Anti-oppressive practice focuses mainly on:",
["Structural and institutional sources of oppression and power","Improving the worker's individual rapport skills","Treating the client's internal symptoms","Keeping the worker politically neutral"],
"Anti-oppressive practice looks at <b>systems and institutions</b> (laws, policies, agencies) that create disadvantage, not only the one-to-one relationship.");
Q('bx-ethics','intersect','r',"The idea that a person's race, gender, class and disability overlap to create a unique experience of oppression is called:",
["Intersectionality","Cultural relativism","Acculturation","Internalized oppression"],
"<b>Intersectionality</b> (Crenshaw): identities combine into a distinct experience. The effects are not simply added together.");
Q('bx-ethics','intersect','v',"A social worker is assessing a lesbian immigrant woman with a physical disability who is struggling to find work. Which approach reflects intersectionality?",
["Explore how her identities together shape the barriers she faces","Focus on her disability, since it most directly affects employment","Focus on her immigration status first, then address the rest later","Avoid discussing identity so she doesn't feel singled out"],
"Intersectionality means looking at how <b>all</b> her identities interact, not picking one.");
Q('bx-ethics','bias','r',"A coworker tells a Latina colleague, \"You speak English so well!\" This is an example of a:",
["Microinsult","Microassault","Microinvalidation","Macroaggression"],
"A <b>microinsult</b> is an often <b>unintentional</b> comment that carries a demeaning assumption (here, that she wouldn't speak English well). A microassault is deliberate; a microinvalidation denies someone's experience.");
Q('bx-ethics','bias','v',"A client tells the social worker, \"When you said you don't see color, it felt like you were dismissing what I go through.\" What should the social worker do?",
["Acknowledge the impact, take responsibility and explore the client's experience","Explain that the comment was meant to show the worker isn't biased","Apologize repeatedly and discuss the worker's own guilt","Move on so the session stays focused on the client's goals"],
"\"I don't see color\" is a <b>microinvalidation</b>. The right response <b>addresses it</b>: acknowledge the impact, repair and explore. Defending intent, centering the worker's guilt or skipping past it are the typical wrong answers.");
Q('bx-ethics','culture','r',"Judging another culture's practices by the standards of one's own culture is called:",
["Ethnocentrism","Cultural relativism","Xenocentrism","Acculturation"],
"<b>Ethnocentrism</b> = judging others by your own cultural norms. Cultural relativism is the opposite; xenocentrism is thinking another culture is superior.");
Q('bx-ethics','culture','v',"A social worker thinks a family's practice of having three generations share one home is \"enmeshed\" because that isn't how families work in the worker's culture. The worker is showing:",
["Ethnocentrism","Cultural humility","Cultural relativism","Countertransference toward the grandparents"],
"Labelling a family arrangement as a problem because it differs from your own culture is <b>ethnocentrism</b>. Cultural humility would mean asking the family what this arrangement means to them.");
Q('bx-ethics','lang','v',"A mother who speaks limited English brings her 10-year-old son to interpret at an intake about family conflict. What should the social worker do?",
["Arrange a qualified professional interpreter","Proceed with the son interpreting since the mother chose him","Use simple English and gestures instead","Ask the son to wait outside and continue in English"],
"Children should <b>never</b> interpret. It risks confidentiality, burdens the child and may distort what's said. Use a <b>qualified interpreter</b> (NASW 1.03).");
Q('bx-ethics','lang','r',"When working with an interpreter, the social worker should:",
["Speak directly to the client and maintain eye contact with the client","Speak to the interpreter and ask them to relay each point","Let the interpreter summarize long answers in their own words","Avoid briefing the interpreter to prevent bias"],
"Address the <b>client</b>, not the interpreter; brief the interpreter beforehand; speak in short segments.");
Q('bx-ethics','access','v',"A Deaf client who uses ASL arrives for an appointment. No interpreter was booked. What is the best action?",
["Reschedule with a qualified ASL interpreter, or use one right away if available","Communicate by writing notes back and forth","Ask the client's hearing sister to interpret","Speak slowly so the client can lip-read"],
"ASL is a full language; notes and lip-reading aren't equivalent access, and family members shouldn't interpret. Use a <b>qualified ASL interpreter</b>.");
Q('bx-ethics','access','r',"A social worker is unsure whether to say \"autistic person\" or \"person with autism.\" The best approach is to:",
["Ask the client which they prefer","Always use person-first language","Always use identity-first language","Avoid mentioning autism"],
"Preferences vary; many autistic adults prefer identity-first language. Best practice is to <b>ask the person</b>.");
Q('bx-ethics','immig','r',"According to Berry's model, an immigrant who keeps their heritage culture while also adopting the host culture is using which strategy?",
["Integration","Assimilation","Separation","Marginalization"],
"<b>Integration</b> (biculturalism) = keep heritage + adopt host culture, and it's linked to the best outcomes. Assimilation drops the heritage culture.");
Q('bx-ethics','immig','v',"A refugee family's teenage daughter has adopted local customs quickly and argues often with her parents, who hold to their traditions. The social worker should FIRST:",
["Explore how each family member experiences the move and the cultural differences","Encourage the parents to adapt to the new culture faster","Support the daughter's right to follow the host culture","Refer the daughter for individual counselling"],
"This is an <b>acculturation gap</b>. Start by exploring each member's experience before taking sides or referring.");
Q('bx-ethics','indig','r',"Collective, cross-generational wounding of a community from colonization, forced removal and residential or boarding schools is called:",
["Historical trauma","Vicarious trauma","Complex PTSD","Acculturative stress"],
"<b>Historical trauma</b> (Brave Heart) is shared by a community, builds across generations and is ongoing, unlike one person's PTSD.");
Q('bx-ethics','indig','v',"A Native American child must be removed from home for safety. Under ICWA, which placement should the social worker look for first?",
["The child's extended family or tribe","The first available licensed foster home","A group home near the child's school","An adoptive family ready to take the child permanently"],
"ICWA requires <b>active efforts</b> and <b>prioritizes placement with extended family and the tribe</b>.");
Q('bx-ethics','lgbtq','v',"A 16-year-old tells the school social worker he is gay and wants to tell his very religious parents this weekend. What should the social worker do FIRST?",
["Explore his feelings and assess his safety and supports if he tells them","Tell him to wait until he is 18","Contact his parents to prepare them","Encourage him to tell them as soon as possible to reduce stress"],
"Coming out is the client's choice of timing, but <b>safety comes first</b>: explore feelings, likely reactions, housing and supports. Telling the parents for him breaks confidentiality and self-determination.");
Q('bx-ethics','lgbtq','r',"Which statement about sexual orientation and gender identity is accurate?",
["They are separate aspects of identity","Gender identity is a type of sexual orientation","Sexual orientation is determined by gender identity","Both are usually diagnosed as disorders"],
"Sexual orientation is <b>who you're attracted to</b>; gender identity is <b>your sense of your own gender</b>. Neither is a disorder.");
