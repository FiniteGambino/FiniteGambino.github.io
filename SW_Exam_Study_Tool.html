<li>Precontemplation: no insight → build rapport</li>
<li>Contemplation: ambivalent</li>
<li>Preparation: small steps</li>
<li>Action → Maintenance → Relapse possible</li>
</ul>`,
simple:`<div class="formula">Engagement → Assessment → Planning → Intervention → Evaluation → Termination</div>
<p class="hook"><b>Memory hook:</b> "<b>E</b>very <b>A</b>rtist <b>P</b>aints <b>I</b>n <b>E</b>very <b>T</b>one."</p>
<div class="tbl"><table><tr><th>Stage of change</th><th>Client sounds like</th><th>Social worker</th></tr>
<tr><td><b>Precontemplation</b></td><td>"I don't have a problem."</td><td><b>Build rapport</b></td></tr>
<tr><td><b>Contemplation</b></td><td>"Part of me wants to, part of me doesn't."</td><td>Work with the ambivalence</td></tr>
<tr><td><b>Preparation</b></td><td>"I've started cutting back a little."</td><td>Support small steps</td></tr>
<tr><td><b>Action → Maintenance</b></td><td>Doing it, then keeping it up</td><td>Relapse is possible</td></tr></table></div>
<p class="tip"><b>Exam tip:</b> This model shows up a lot in alcohol-treatment readiness questions.</p>`},
{id:'comm', title:'Communication skills',
guide:`<ul>
<li>Reflection = feelings</li><li>Clarification = clarify meaning</li><li>Confrontation = challenge inconsistency</li><li>Active listening = attending + responding</li><li>Reframing = new perspective</li><li>Universalization = normalize experience</li><li>Silence = therapeutic tool</li><li>Congruence/genuiness = therapist being authentic and transparent in therapeutic relationship</li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Skill</th><th>Sounds like</th></tr>
<tr><td><b>Reflection</b></td><td>"You sound really frustrated." (feelings)</td></tr>
<tr><td><b>Clarification</b></td><td>"When you say 'done,' what do you mean?"</td></tr>
<tr><td><b>Confrontation</b></td><td>"You say things are fine, but you've missed three sessions." (inconsistency)</td></tr>
<tr><td><b>Active listening</b></td><td>Attending + responding</td></tr>
<tr><td><b>Reframing</b></td><td>"Stubborn" → "determined" (new perspective)</td></tr>
<tr><td><b>Universalization</b></td><td>"Many people in your situation feel this way."</td></tr>
<tr><td><b>Silence</b></td><td>A pause that lets the client think</td></tr>
<tr><td><b>Congruence / genuineness</b></td><td>Being authentic and transparent</td></tr></table></div>`},
{id:'strengths', title:'Strengths perspective',
guide:`<ul><li>Client strengths</li><li>Resilience</li><li>Protective factors</li><li>Empowerment</li><li>Solution-focused interventions</li></ul>`,
simple:`<p class="plain"><b>In plain words:</b> Build on what's <b>working</b> (strengths, resilience, protective factors) instead of focusing on what's wrong. Empowerment and solution-focused work fit here.</p>`},
{id:'toknow', title:'Interventions to know',
guide:`<ul>
<li><b>Solution Focused Brief Therapy (SFBT):</b> Future &amp; goal oriented approach focusing on solutions and client strengths rather than problems.
<ul><li>Uses: Miracle question, Scaling questions (rating problem/progress 1-10 to identify change and next steps), Exception finding (times where problem doesnt occur or is less severe' identified existing solutions)</li>
<li>Change talk: clients own arguments for change</li></ul></li>
<li><b>Child Play Therapy</b> (multiple types)</li>
<li><b>Motivational interviewing:</b> client centered approach, enhancing intrinsic motivation for change through exploring ambivalence, good for alcoholics
<ul><li>OARS: Open questions, Affirmations, Reflective listening, Summaries</li><li>Four processes: engaging, focusing, evoking, planning</li></ul></li>
<li><b>Narrative Therapy</b> (explored in family therapy as well): externalization aka separating person from problem to reduce shame and increase personal agency</li>
<li><b>Person Centered Therapy:</b> humanistic approach emphasizing therapists unconditional positive regard</li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Approach</th><th>Core idea</th><th>Signature tools</th></tr>
<tr><td><b>SFBT</b></td><td>Future- and goal-focused; solutions and strengths, not problems</td><td><b>Miracle question</b> ("If a miracle happened tonight…"), <b>scaling</b> 1–10, <b>exception finding</b> ("When doesn't it happen?")</td></tr>
<tr><td><b>Motivational interviewing</b></td><td>Explore <b>ambivalence</b> to build the client's <b>own</b> motivation; good for alcohol use</td><td><b>OARS</b>; four processes: engaging → focusing → evoking → planning</td></tr>
<tr><td><b>Narrative</b></td><td>Separate the person from the problem</td><td><b>Externalization</b> ("the anxiety is bossing you around")</td></tr>
<tr><td><b>Person-centered</b></td><td>Humanistic</td><td>Unconditional positive regard</td></tr>
<tr><td><b>Child play therapy</b></td><td colspan="2">Multiple types</td></tr></table></div>
<p><b>Change talk</b> = the client's own arguments for change.</p>
<p class="hook"><b>Memory hook:</b> MI processes: "<b>E</b>very <b>F</b>ox <b>E</b>ats <b>P</b>ie" = Engaging, Focusing, Evoking, Planning.</p>`}
]});

MODULES.push({
id:'family', n:'07', title:'Systems Theory & Family Therapy', blurb:'Structural, strategic, Bowen, narrative, genograms',
topics:[
{id:'sys', title:'Systems theory',
guide:`<ul>
<li>Problems are understood within relationships and systems, not individuals alone – Families function as interconnected units</li>
<li>Behavior is shaped by ongoing interaction patterns, not single causes</li>
<li><b>Circular causality:</b> behavior is mutual and cyclical (no simple cause → effect)</li>
<li><b>Feedback loops:</b> repetitive interaction patterns that maintain problems</li>
<li><b>Role theory:</b> behavior is shaped by social roles (parent, child, worker, etc.)</li>
</ul>`,
simple:`<p class="plain"><b>In plain words:</b> The problem lives in the <b>relationships</b>, not in one person.</p>
<ul><li><b>Circular causality:</b> A affects B, and B affects A. Mom nags → teen withdraws → mom nags more. There's no single "cause."</li>
<li><b>Feedback loops:</b> the repeating patterns that keep a problem going.</li>
<li><b>Role theory:</b> roles (parent, child, worker) shape behavior.</li></ul>`},
{id:'types', title:'Types of family therapy',
guide:`<ul>
<li><b>Structural Family Therapy (Minuchin):</b> family organization (boundaries, hierarchy, subsystems)
<ul><li>Boundaries: Rigid (isolated), Diffuse (enmeshed), Clear (healthy)</li><li>Techniques: joining, mapping, enactment, unbalancing, reframing</li></ul></li>
<li><b>Strategic Family Therapy:</b> problem is dysfunctional interaction pattern → change the strategy, not insight
<ul><li>Tools: directives, paradoxical interventions, reframing, ordeals</li><li>First-order change: small adjustments (no real change)</li><li>Second-order change: pattern change</li></ul></li>
<li><b>Bowen Family Therapy:</b> focus on differentiation
<ul><li>Triangulation, emotional fusion (overinvolvement), emotional cutoff (avoidance)</li><li>Genograms to track multi-generational patterns</li></ul></li>
<li><b>Narrative Family:</b> Problem is the story, not the person
<ul><li>Externalization: separate person from problem</li><li>Unique outcomes: times problem did not control behavior</li><li>Re-authoring: build new identity story</li><li>Definitional ceremonies: others witness new narrative</li></ul></li>
<li><b>Emotionally Focused Family Therapy:</b> attachment based, focus on emotional bonding and changing negative interaction cycles.</li>
<li><b>Gottman Method (couples therapy):</b> build friendship.</li>
<li><b>Multi-Family Groups:</b>
<ul><li><b>Psychoeducational groups:</b> teach skills/info</li><li><b>Support groups:</b> shared experience and peer support</li><li><b>Therapy groups:</b> multiple families working on relationships</li></ul></li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Model</th><th>Big idea</th><th>Key terms</th></tr>
<tr><td><b>Structural</b> (Minuchin)</td><td>Fix the family's <b>structure</b>: boundaries, hierarchy, subsystems</td><td>Boundaries: rigid (isolated), diffuse (enmeshed), clear (healthy). Joining, mapping, enactment, unbalancing, reframing.</td></tr>
<tr><td><b>Strategic</b></td><td>Change the interaction pattern. <b>Insight isn't needed.</b></td><td>Directives, paradox, reframing, ordeals. 1st-order = small tweak (no real change); <b>2nd-order = the pattern changes</b>.</td></tr>
<tr><td><b>Bowen</b></td><td><b>Differentiation</b> across generations</td><td>Triangulation, fusion (overinvolved), cutoff (avoidance), <b>genograms</b></td></tr>
<tr><td><b>Narrative</b></td><td>The problem is the <b>story</b>, not the person</td><td>Externalization, unique outcomes, re-authoring, definitional ceremonies</td></tr>
<tr><td><b>Emotionally focused</b></td><td><b>Attachment</b>-based</td><td>Emotional bonding, changing negative cycles</td></tr>
<tr><td><b>Gottman</b> (couples)</td><td colspan="2">Build friendship</td></tr>
<tr><td><b>Multi-family groups</b></td><td colspan="2">Psychoeducational (teach) · Support (shared experience) · Therapy (families working on relationships)</td></tr></table></div>
<p class="hook"><b>Memory hook:</b> <b>Structural</b> = structure · <b>Strategic</b> = strategy, no insight · <b>Bowen</b> = bonds across generations.</p>`},
{id:'conc', title:'Concepts in family dynamics',
guide:`<ul>
<li><b>Role reversal:</b> perspective shifting, Scapegoating dynamics visible in positioning/roles</li>
<li><b>Cross-family dialogue: i</b>nteraction across families'</li>
<li><b>Fishbowl:</b> one family interacts while others observe</li>
<li><b>Patterns: Enmeshed –</b> too much closeness, low independence, <b>Disengaged –</b> too little connection, emotional distance, <b>Balanced –</b> flexible boundaries (healthy goal)</li>
<li><b>Scapegoating</b>: one member blamed for system issues</li>
<li><b>Parentification</b>: child takes adult role</li>
<li><b>Family secrets</b>: hidden patterns affecting system</li>
<li><b>Genograms:</b> 3+ generations map of family patterns, Shows relationships, trauma, mental health, alliances, cutoff, Symbols: square = male, circle = female, X = death</li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Term</th><th>Meaning</th></tr>
<tr><td><b>Role reversal</b></td><td>Perspective shifting (can reveal scapegoating)</td></tr>
<tr><td><b>Cross-family dialogue</b></td><td>Families interacting with each other</td></tr>
<tr><td><b>Fishbowl</b></td><td>One family interacts; the others watch</td></tr>
<tr><td><b>Enmeshed / Disengaged / Balanced</b></td><td>Too close / too distant / flexible (the healthy goal)</td></tr>
<tr><td><b>Scapegoating</b></td><td>One member blamed for the system's problems</td></tr>
<tr><td><b>Parentification</b></td><td>A child takes on an adult role</td></tr>
<tr><td><b>Family secrets</b></td><td>Hidden patterns affecting the system</td></tr>
<tr><td><b>Genogram</b></td><td>Map of <b>3+ generations</b>. □ = male, ○ = female, X = death</td></tr></table></div>`}
]});

MODULES.push({
id:'group', n:'08', title:'Group Therapy', blurb:'Tuckman, Yalom, group dynamics and roles',
topics:[
{id:'theory', title:'Theory: Tuckman & Yalom',
guide:`<p><b>Tuckman's Stages of Group Development:</b> Forming, storming, norming, performing, adjourning</p>
<p><b>Yalom's Therapeutic Factors (What heals groups)</b></p>
<ul>
<li>Most seen on exam: <b>Universality</b> ("I'm not alone") &amp; <b>Cohesiveness</b> (belonging/safety in group)</li>
<li>Instillation of hope: "If others improve, I can too"</li>
<li>Altruism: helping others boosts self-worth</li>
<li>Interpersonal learning: learning from others</li>
<li>Catharsis: emotional release</li>
<li>Corrective emotional experience: reworking past relational patterns in group</li>
</ul>`,
simple:`<div class="formula">Forming → Storming → Norming → Performing → Adjourning</div>
<div class="tbl"><table><tr><th>Yalom factor</th><th>Sounds like</th></tr>
<tr><td><b>Universality</b> (most tested)</td><td>"I'm not the only one."</td></tr>
<tr><td><b>Cohesiveness</b> (most tested)</td><td>"I belong here; I feel safe."</td></tr>
<tr><td><b>Instillation of hope</b></td><td>"If they got better, I can too."</td></tr>
<tr><td><b>Altruism</b></td><td>Helping others raises my self-worth</td></tr>
<tr><td><b>Interpersonal learning</b></td><td>Learning from others</td></tr>
<tr><td><b>Catharsis</b></td><td>Emotional release</td></tr>
<tr><td><b>Corrective emotional experience</b></td><td>Reworking old relationship patterns in the group</td></tr></table></div>`},
{id:'core', title:'Core group concepts',
guide:`<ul>
<li>"Here and now" focus: process &gt; content (how members interact in group)</li>
<li>Group is the agent of change (not just leader)</li>
<li>Cooperative learning increases outcomes</li>
<li>Confidentiality is limited (cannot be guaranteed between members)</li>
<li><b>Open</b> (members come/go; e.g., AA) / <b>Closed</b> (fixed membership)</li>
<li><b>Types</b>: support, therapy, psychoeducational, task, crisis</li>
</ul>`,
simple:`<ul>
<li><b>Here and now:</b> focus on <b>how</b> members interact in the room (process), not just what they talk about (content).</li>
<li>The <b>group</b> is the agent of change, not only the leader. Cooperative learning improves outcomes.</li>
<li><b>Confidentiality can't be guaranteed</b> between members. Tell them that honestly.</li>
<li><b>Open</b> = people come and go (AA). <b>Closed</b> = fixed membership.</li>
<li><b>Types:</b> support, therapy, psychoeducational, task, crisis.</li>
</ul>`},
{id:'dyn', title:'Group dynamics',
guide:`<ul>
<li><b>Groupthink:</b> conformity → poor decisions</li>
<li><b>Group polarization:</b> more extreme opinions</li>
<li><b>Psychodrama:</b> role play</li>
<li><b>Folie à deux:</b> shared delusion</li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Term</th><th>Plain meaning</th></tr>
<tr><td><b>Groupthink</b></td><td>Going along to get along → bad decisions</td></tr>
<tr><td><b>Group polarization</b></td><td>Discussion pushes opinions <b>more extreme</b></td></tr>
<tr><td><b>Psychodrama</b></td><td>Role play</td></tr>
<tr><td><b>Folie à deux</b></td><td>A delusion shared by two people</td></tr></table></div>`},
{id:'roles', title:'Group roles & therapist use of self',
guide:`<ul>
<li>Task Roles (productive): Initiate, inform, summarize, coordinate, evaluate</li>
<li>Maintenance Roles (support group): Encourage, harmonize, gatekeep, set norms</li>
<li>Individual Roles (problematic): Aggressor, blocker, monopolizer, silent member, recognition seeker, dominator, confessor, "yes-but" complainer</li>
<li>Therapist use of self: Redirect + set limits + engage group
<ul><li>Self-disclosure (limited)</li><li>Modeling</li><li>Countertransference = clinical data, they can give you useful information about what is happening in the therapeutic relationship.</li></ul></li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Role type</th><th>Examples</th></tr>
<tr><td><b>Task</b> (gets work done)</td><td>Initiate, inform, summarize, coordinate, evaluate</td></tr>
<tr><td><b>Maintenance</b> (keeps group healthy)</td><td>Encourage, harmonize, gatekeep, set norms</td></tr>
<tr><td><b>Individual</b> (problematic)</td><td>Aggressor, blocker, monopolizer, silent member, recognition seeker, dominator, confessor, "yes-but" complainer</td></tr></table></div>
<p><b>When a member is problematic:</b> redirect + set limits + engage the group. Use self-disclosure sparingly, model the behavior you want, and treat your countertransference as <b>useful clinical data</b>.</p>`}
]});

MODULES.push({
id:'community', n:'09', title:'Social Work in Communities', blurb:'Community models, power, evaluation',
topics:[
{id:'power', title:'Community practice, ethics audit & power',
guide:`<p>Self-determination + empowerment + collective power, Shift power to communities; challenge systems of oppression; Intervene more with vulnerable populations</p>
<p><b>Ethics Audit:</b> structured review of an organization's systems, decisions, and behavior to identify ethical risks, gaps, and compliance issues, then fix them and track improvement over time.</p>
<p><b>Power Sources (why someone can influence others' behavior)</b>: Coercive (fear), reward (incentive), expert (knowledge), referent (respect), legitimate (position.title), informational (access to info)</p>`,
simple:`<p class="plain"><b>In plain words:</b> Community work shifts power <b>to</b> communities and challenges oppression, with extra focus on vulnerable groups.</p>
<p><b>Ethics audit:</b> a structured check of an organization's systems, decisions and behavior to find ethical risks, fix them, and track improvement.</p>
<div class="tbl"><table><tr><th>Power source</th><th>Based on</th></tr>
<tr><td><b>Coercive</b></td><td>Fear</td></tr><tr><td><b>Reward</b></td><td>Incentives</td></tr><tr><td><b>Expert</b></td><td>Knowledge</td></tr><tr><td><b>Referent</b></td><td>Respect/admiration</td></tr><tr><td><b>Legitimate</b></td><td>Position/title</td></tr><tr><td><b>Informational</b></td><td>Access to information</td></tr></table></div>
<p class="tip"><b>Watch out:</b> <b>Expert</b> = what you <b>know</b>. <b>Informational</b> = what you have <b>access</b> to.</p>`},
{id:'models', title:'Community models & decision process',
guide:`<p><b>Community Models</b></p>
<ul>
<li><b>Locality Development</b>: community-led, SW = facilitator; participation, consensus, empowerment</li>
<li><b>Social Planning:</b> data-driven, rational, problem solving SW = expert; needs assessment, program design</li>
<li><b>Social Action:</b> confronting injustice, advocacy + protest; challenge power structures</li>
<li><b>Social Reform:</b> System-wide change through collaboration, Policy/system-level reform, coalition-building across orgs</li>
</ul>
<p><b>Decision Process:</b> Orientation → Conflict → Emergence → Reinforcement</p>`,
simple:`<div class="tbl"><table><tr><th>Model</th><th>Key words</th><th>SW role (per guide)</th></tr>
<tr><td><b>Locality development</b></td><td>Community-led, participation, <b>consensus</b>, empowerment</td><td>Facilitator</td></tr>
<tr><td><b>Social planning</b></td><td><b>Data</b>-driven, rational, needs assessment, program design</td><td>Expert</td></tr>
<tr><td><b>Social action</b></td><td>Confront injustice, advocacy + <b>protest</b>, challenge power</td><td>—</td></tr>
<tr><td><b>Social reform</b></td><td>System-wide change through <b>collaboration</b>, policy, coalitions across orgs</td><td>—</td></tr></table></div>
<div class="formula">Decision process: Orientation → Conflict → Emergence → Reinforcement</div>
<p class="hook"><b>Memory hook:</b> "<b>O</b>ld <b>C</b>ats <b>E</b>at <b>R</b>ats."</p>`},
{id:'fiscal', title:'Fiscal management & evaluation',
guide:`<p><b>Fiscal Management:</b> planning, acquisition, allocation, control, reporting<br><b>Evaluation:</b></p>
<ul>
<li><b>Cost-benefit =</b> money vs money</li>
<li><b>Cost-effectiveness =</b> cost vs outcomes</li>
<li><b>Outcome =</b> did goals get met</li>
</ul>`,
simple:`<div class="formula">Fiscal management: Planning → Acquisition → Allocation → Control → Reporting</div>
<div class="tbl"><table><tr><th>Evaluation</th><th>Compares</th></tr>
<tr><td><b>Cost-benefit</b></td><td>$ spent vs $ gained</td></tr>
<tr><td><b>Cost-effectiveness</b></td><td>$ spent vs <b>outcomes</b> (not dollars)</td></tr>
<tr><td><b>Outcome</b></td><td>Were the goals met?</td></tr></table></div>`}
]});

MODULES.push({
id:'org', n:'10', title:'Organizational Theories', blurb:'Prevention levels, practice roles, settings',
topics:[
{id:'prev', title:'Prevention levels',
guide:`<ul>
<li>Primary = prevent problem before it starts (education, prevention programs)</li>
<li>Secondary = early identification + intervention with at-risk groups</li>
<li>Tertiary = treatment after problem exists to reduce impact/recurrence</li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Level</th><th>When</th><th>Example</th></tr>
<tr><td><b>Primary</b></td><td><b>Before</b> it starts</td><td>School-wide education program</td></tr>
<tr><td><b>Secondary</b></td><td><b>Early</b>, with at-risk groups</td><td>Screening at-risk teens</td></tr>
<tr><td><b>Tertiary</b></td><td><b>After</b> it exists, to reduce impact or recurrence</td><td>Relapse prevention in treatment</td></tr></table></div>`},
{id:'orgth', title:'Organizational theories',
guide:`<ul>
<li>Classical theory = efficiency + structure + hierarchy</li>
<li>(Scientific Management, Weber Bureaucracy)</li>
<li>Focus: rules, productivity, reward/punishment</li>
<li>Neoclassical theory = human relationships matter</li>
<li>Focus: worker satisfaction, groups, communication, participation</li>
<li>Modern theory = systems approach (Person-in-Environment)</li>
<li>Focus: organization = interrelated parts affected by environment</li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Theory</th><th>Big idea</th><th>Focus</th></tr>
<tr><td><b>Classical</b> (Scientific Management, Weber's bureaucracy)</td><td>Efficiency, structure, hierarchy</td><td>Rules, productivity, reward/punishment</td></tr>
<tr><td><b>Neoclassical</b></td><td><b>People</b> matter</td><td>Worker satisfaction, groups, communication, participation</td></tr>
<tr><td><b>Modern</b></td><td><b>Systems</b> (person-in-environment)</td><td>Interrelated parts affected by the environment</td></tr></table></div>`},
{id:'roles', title:'Social work practice roles',
guide:`<ul>
<li><b>Advocate = speaks up for client rights and access</b></li>
<li><b>Broker = connects clients to services/resources</b></li>
<li><b>Change agent = works to improve systems/services</b></li>
<li><b>Counselor = helps improve coping and functioning</b></li>
<li><b>Mediator = resolves conflict between parties neutrally</b></li>
<li><b>Mobilizer = organizes community resources/people</b></li>
</ul>
<p><b>Key exam ideas:</b></p>
<ul><li>Broker = connect</li><li>Advocate = fight for</li><li>Counselor = treat/support</li><li>Change agent = system improvement</li></ul>`,
simple:`<div class="tbl"><table><tr><th>Role</th><th>One word</th><th>Example</th></tr>
<tr><td><b>Broker</b></td><td>Connect</td><td>Links a client to a food bank</td></tr>
<tr><td><b>Advocate</b></td><td>Fight for</td><td>Pushes an insurer to honor a client's rights</td></tr>
<tr><td><b>Counselor</b></td><td>Treat/support</td><td>Helps a client cope</td></tr>
<tr><td><b>Change agent</b></td><td>Improve systems</td><td>Redesigns the agency's intake process</td></tr>
<tr><td><b>Mediator</b></td><td>Neutral</td><td>Resolves a dispute between two parties</td></tr>
<tr><td><b>Mobilizer</b></td><td>Organize</td><td>Rallies community people and resources</td></tr></table></div>`},
{id:'settings', title:'Settings: school, CPS, hospital',
guide:`<ul>
<li><b>School SW:</b>
<ul><li>Do NOT diagnose learning disabilities</li><li>Psychologist does testing, SW gathers collateral info + supports student</li><li>Must report suspected abuse</li></ul></li>
<li><b>CPS / Child Welfare</b>
<ul><li>Safety + investigation</li><li>Family preservation first</li><li>Removal is last resort</li><li>Permanency planning = stable long-term placement</li></ul></li>
<li><b>Hospital / Inpatient SW</b>
<ul><li>Risk assessment is critical</li><li>NEVER discharge with active SI/HI</li><li>Focus on safe discharge planning</li></ul></li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Setting</th><th>Do</th><th>Don't</th></tr>
<tr><td><b>School</b></td><td>Gather collateral info, support the student, report suspected abuse</td><td><b>Diagnose learning disabilities</b> (the psychologist tests)</td></tr>
<tr><td><b>CPS</b></td><td>Safety + investigation; <b>family preservation first</b>; permanency planning = a stable long-term placement</td><td>Jump to removal. It's the <b>last resort</b>.</td></tr>
<tr><td><b>Hospital</b></td><td>Risk assessment; safe discharge planning</td><td><b>Discharge with active SI/HI</b></td></tr></table></div>`}
]});

MODULES.push({
id:'research', n:'11', title:'Research', blurb:'Designs, validity, program evaluation',
topics:[
{id:'types', title:'Types of research',
guide:`<ul><li>Qualitative = words, meaning, interviews, focus groups, observation</li><li>Quantitative = numbers, surveys, measurable data</li></ul>`,
simple:`<div class="tbl"><table><tr><th>Qualitative</th><th>Quantitative</th></tr><tr><td><b>Words</b> and meaning: interviews, focus groups, observation</td><td><b>Numbers</b>: surveys, measurable data</td></tr></table></div>
<p class="hook"><b>Memory hook:</b> <b>Qual</b> = <b>qual</b>ities (words) · <b>Quant</b> = <b>quant</b>ities (numbers).</p>`},
{id:'designs', title:'Research designs',
guide:`<ul>
<li><b>Experimental design:</b> Random assignment + control group;
<ul><li>strongest design</li><li>only design that can show cause and effect by comparing outcomes between groups after an intervention.</li></ul></li>
<li><b>Quasi-experimental design:</b>
<ul><li>No random assignment but has comparison groups, commonly used in real-world settings</li><li>suggests relationships but cannot fully establish causation.</li><li>include a separate control or comparison group to establish baseline validity</li><li>Example: A school district wants to test the impact of a new math software on student test scores. School A gets the software and School B does not.</li></ul></li>
<li><b>Pre-experimental design:</b>
<ul><li>No control group and no random assignment, weakest design, usually one group pre-test/post-test</li><li>very limited conclusions about cause and effect.</li><li>Example: School A implements new math software and compares exam scores from before and after implementing it.</li></ul></li>
<li><b>Single-subject design:</b>
<ul><li>One client or case studied over time; client serves as their own control</li><li>uses repeated phases such as A-B (baseline → intervention) or A-B-A (baseline → intervention → return to baseline)</li><li>helps show whether change is linked to intervention but limited generalizability.</li><li>Example: Child A engages in new therapy. Therapist tests mood before and after implementation of therapy.</li></ul></li>
<li><b>Correlational design:</b>
<ul><li>Examines relationships between variables only</li><li>does not test cause and effect; shows whether variables move together (positive, negative, or no relationship).</li></ul></li>
<li><b>Descriptive design:</b> Describes characteristics of a sample or situation
<ul><li>no relationships or causation tested</li><li>summarizes data using percentages, averages, or observations.</li></ul></li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Design</th><th>Random assignment?</th><th>Control/comparison?</th><th>Cause &amp; effect?</th></tr>
<tr><td><b>Experimental</b></td><td>Yes</td><td>Yes (control)</td><td><b>Yes, the only one</b></td></tr>
<tr><td><b>Quasi-experimental</b></td><td>No</td><td>Yes (comparison)</td><td>Suggests only</td></tr>
<tr><td><b>Pre-experimental</b></td><td>No</td><td>No</td><td>Very limited (<b>weakest</b>)</td></tr>
<tr><td><b>Single-subject</b></td><td>—</td><td>Client is their <b>own</b> control (A-B, A-B-A)</td><td>Links change to the intervention; limited generalizability</td></tr>
<tr><td><b>Correlational</b></td><td>—</td><td>—</td><td>No; shows only whether variables move together</td></tr>
<tr><td><b>Descriptive</b></td><td>—</td><td>—</td><td>No; describes with %, averages, observations</td></tr></table></div>
<p class="tip"><b>The school example:</b> School A vs School B = <b>quasi</b>. School A before vs after = <b>pre-experimental</b>. One child, mood before/after therapy = <b>single-subject</b>.</p>`},
{id:'valid', title:'Validity & reliability',
guide:`<ul>
<li>Validity = accuracy of what is being measured</li>
<li>Reliability = consistency of results across time or repeated measures</li>
<li>Internal validity = whether changes are truly caused by the intervention (cause-and-effect confidence)</li>
<li>External validity = whether findings can be generalized to other populations or settings</li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Term</th><th>Plain meaning</th></tr>
<tr><td><b>Validity</b></td><td>Accurate: measures what it's supposed to</td></tr>
<tr><td><b>Reliability</b></td><td>Consistent: same result each time</td></tr>
<tr><td><b>Internal validity</b></td><td>Did the <b>intervention</b> really cause the change?</td></tr>
<tr><td><b>External validity</b></td><td>Does it <b>generalize</b> to other people and settings?</td></tr></table></div>
<p class="hook"><b>Memory hook:</b> <b>In</b>ternal = <b>in</b>side the study (cause). <b>Ex</b>ternal = <b>ex</b>ports to the outside world.</p>`},
{id:'eval', title:'Program evaluation types',
guide:`<ul>
<li>Formative = used during the program to improve or modify it while it is running</li>
<li>Summative = done at the end of the program to evaluate overall effectiveness and outcomes</li>
<li>Process = looks at how the program was implemented and what was actually done</li>
<li>Outcome = measures whether the program achieved its intended changes in clients or conditions</li>
<li>Needs assessment = done before a program starts to identify problems, gaps, and what services are needed</li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>When</th><th>Type</th><th>Question it answers</th></tr>
<tr><td><b>Before</b></td><td>Needs assessment</td><td>What problems and gaps exist?</td></tr>
<tr><td><b>During</b></td><td>Formative</td><td>How can we improve it while it runs?</td></tr>
<tr><td>Any time</td><td>Process</td><td>How was it actually implemented?</td></tr>
<tr><td>Any time</td><td>Outcome</td><td>Did clients or conditions change as intended?</td></tr>
<tr><td><b>End</b></td><td>Summative</td><td>Overall, did it work?</td></tr></table></div>
<p class="hook"><b>Memory hook:</b> <b>Form</b>ative = still <b>form</b>ing. <b>Sum</b>mative = the <b>sum</b> at the end.</p>`}
]});

MODULES.push({
id:'assess', n:'12', title:'Assessment Tools', blurb:'Screening tools, Mental Status Exam, symptoms',
topics:[
{id:'conc', title:'Assessment concepts',
guide:`<p><b>Why?</b> Provides objective approaches</p>
<p><b>Signs (</b>observable indicators) <b>vs Symptoms</b> (subjective experiences reported by client)<br>
<b>Clinical Formulation:</b> comprehensive understanding linking assessment data into coherent explanation<br>
<b>Ongoing Assessment:</b> continuous evaluation through treatment to monitor progress and adjust interventions<br>
<b>Working hypothesis in assessment:</b> preliminary understanding of clients issues that guide initial treatment<br>
<b>Differential Diagnosis:</b> process of distinguishing between conditions with similar presentations</p>
<ul><li><b>Rule out medical FIRST!!!</b></li></ul>
<p><b>Clinical Judgement:</b> professional reasoning process combing knowledge<br>
<b>Collateral Information:</b> important when client has impaired insight, cognitive issues, or is danger to self<br>
<b>Screening (</b>brief tool, identify potential issues) <b>vs Assessment</b> (comprehensive evaluation)</p>`,
simple:`<div class="tbl"><table><tr><th>Term</th><th>Plain meaning</th></tr>
<tr><td><b>Sign vs symptom</b></td><td>Sign = what <b>you observe</b>. Symptom = what the <b>client reports</b>.</td></tr>
<tr><td><b>Working hypothesis</b></td><td>Your first best guess; it guides early treatment</td></tr>
<tr><td><b>Clinical formulation</b></td><td>The full picture tying all the data together</td></tr>
<tr><td><b>Ongoing assessment</b></td><td>Keep checking progress and adjust</td></tr>
<tr><td><b>Differential diagnosis</b></td><td>Telling look-alike conditions apart. <b>Rule out medical FIRST.</b></td></tr>
<tr><td><b>Collateral info</b></td><td>Info from others; key when insight is impaired, there are cognitive issues, or the client is a danger to self</td></tr>
<tr><td><b>Screening vs assessment</b></td><td>Screening = brief check. Assessment = full evaluation.</td></tr></table></div>`},
{id:'tools', title:'Tools: assessments, screenings, scales',
guide:`<ul>
<li><b>WHODAS 2.0 (World Health Organization Disability Assessment Schedule)</b>: how mental or physical disorders affect a person's functioning in daily life</li>
<li><b>Biopsychosocial Assessments</b></li>
<li><b>Columbia Suicide Severity Rating Scale (C-SSRS):</b> standardized tool to assess suicide risk across 6 levels from ideation to attempt</li>
<li><b>SAD PERSONS Scale:</b> Mnemonic for suicide risk – sex, age, depression, previous attempt, ethanol (alcohol), rational thinking, social supports, organized plan, no spouse, sickness</li>
<li><b>CAGE Questionnaire:</b> screening tool for alcohol use based on four questions – cut down, annoyed, guilty, eye opener</li>
<li><b>AUDIT:</b> Alcohol use disorders identification test, 10 item screening for hazardous/harmful alcohol use.</li>
<li><b>PCL-5:</b> PTSD checklist for DSM5, 20 item self report measure for PTSD sx.</li>
<li><b>GAD-7:</b> 7 item screening tool for GAD severity</li>
<li><b>ACEs:</b> adverse childhood experiences, potentially traumatic events in childhood such as neglect, household dysfunction and abuse.</li>
<li><b>PHQ-9:</b> patient health questionnaire - 9 item depression screening and severity measure</li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Tool</th><th>Measures</th><th>Size</th></tr>
<tr><td><b>PHQ-9</b></td><td>Depression</td><td>9 items</td></tr>
<tr><td><b>GAD-7</b></td><td>Anxiety (GAD severity)</td><td>7 items</td></tr>
<tr><td><b>PCL-5</b></td><td>PTSD symptoms (DSM-5)</td><td>20 items, self-report</td></tr>
<tr><td><b>AUDIT</b></td><td>Hazardous/harmful alcohol use</td><td>10 items</td></tr>
<tr><td><b>CAGE</b></td><td>Alcohol: Cut down, Annoyed, Guilty, Eye-opener</td><td>4 questions</td></tr>
<tr><td><b>C-SSRS</b></td><td>Suicide risk, ideation → attempt</td><td>6 levels</td></tr>
<tr><td><b>SAD PERSONS</b></td><td>Suicide risk mnemonic</td><td>10 letters</td></tr>
<tr><td><b>WHODAS 2.0</b></td><td>How disorders affect daily <b>functioning</b></td><td>—</td></tr>
<tr><td><b>ACEs</b></td><td>Adverse childhood experiences (neglect, household dysfunction, abuse)</td><td>—</td></tr></table></div>
<p class="hook"><b>Memory hook:</b> The number in the name = the number of items (PHQ-<b>9</b>, GAD-<b>7</b>). PCL-<b>5</b> is the exception: the 5 means DSM-<b>5</b>, and it has 20 items.</p>`},
{id:'mse', title:'Mental Status Exam: mood & affect',
guide:`<p>Quick assessment of current functioning, usually based on: appearance, orientation (awareness of time/place, etc.), speech pattern, affect/mood, impulsive/potential for harm, judgment/insight, thought processes/reality testing, intellectual functioning/memory – in line with: ASSESS BEFORE ACTION</p>
<ul>
<li><b>Mood:</b> clients sustained emotional state
<ul><li><b>Euthymic:</b> stable mood</li><li><b>Euphoric:</b> excessively elevated</li><li><b>Dysthymic</b>: persistently depressed mood</li></ul></li>
<li><b>Affect:</b> observable emotional expression in the moment
<ul><li><b>Blunted:</b> reduced emotional expressiveness but some visible emotions present</li><li><b>Flat:</b> absence of emotional expression, no visible emotional response</li><li><b>Labile:</b> rapidly changing emotional expressions inconsistent with situation</li><li><b>Restricted:</b> reduced in range and intensity of emotional expression</li><li><b>Appropriate:</b> emotional expression consistent with situation and thought content</li><li><b>Incongruent:</b> emotional expression not matching thought content or situation</li></ul></li>
</ul>`,
simple:`<p class="plain"><b>In plain words:</b> The MSE is a snapshot of how the client is functioning <b>right now</b>: appearance, orientation, speech, mood/affect, risk, judgment/insight, thinking, memory.</p>
<p><b>Mood = climate</b> (sustained over time). <b>Affect = weather</b> (what you see in the moment).</p>
<div class="tbl"><table><tr><th>Mood</th><th>Meaning</th></tr><tr><td>Euthymic</td><td>Stable</td></tr><tr><td>Euphoric</td><td>Excessively elevated</td></tr><tr><td>Dysthymic</td><td>Persistently depressed</td></tr></table></div>
<div class="tbl"><table><tr><th>Affect</th><th>Meaning</th></tr>
<tr><td><b>Flat</b></td><td><b>No</b> visible emotion</td></tr>
<tr><td><b>Blunted</b></td><td>Reduced, but <b>some</b> emotion visible</td></tr>
<tr><td><b>Restricted</b></td><td>Reduced range and intensity</td></tr>
<tr><td><b>Labile</b></td><td>Rapidly changing, doesn't fit the situation</td></tr>
<tr><td><b>Appropriate</b></td><td>Matches the situation and content</td></tr>
<tr><td><b>Incongruent</b></td><td>Doesn't match (e.g., laughing about a death)</td></tr></table></div>`},
{id:'speech', title:'Mental Status Exam: speech & consciousness',
guide:`<ul>
<li><b>Speech:</b>
<ul><li><b>Circumstantial:</b> eventually reaches the point but includes excessive and unnecessary detail</li>
<li><b>Tangential:</b> Goes off topic and never returns to the original point</li>
<li><b>Flight of ideas:</b> rapid shifting between loosely connected thoughts (seen in mania)</li>
<li><b>Thought Blocking:</b> sudden stopping in middle of though due to interruption in thinking</li>
<li><b>Poverty of Speech:</b> minimal verbal responses with little content</li>
<li><b>Pressured Speech:</b> rapid, excessive speech with a sense of urgency that is difficult to interrupt</li>
<li><b>Ideas of Reference:</b> Believing unrelated events or objects have personal significance</li>
<li><b>Confabulation:</b> making up stories to fill memory gap without awareness they are false</li>
<li><b>Perseveration:</b> repetition of responses or behaviors despite changing questions or situations</li></ul></li>
<li><b>Levels of Consciousness:</b> alert, drowsy, lethargic, stuporous, comatose</li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Term</th><th>Plain meaning</th></tr>
<tr><td><b>Circumstantial</b></td><td>Long detours, but <b>gets there</b></td></tr>
<tr><td><b>Tangential</b></td><td>Goes off topic and <b>never comes back</b></td></tr>
<tr><td><b>Flight of ideas</b></td><td>Rapid jumps between loosely linked thoughts (mania)</td></tr>
<tr><td><b>Thought blocking</b></td><td>Stops suddenly mid-thought</td></tr>
<tr><td><b>Poverty of speech</b></td><td>Very little said</td></tr>
<tr><td><b>Pressured speech</b></td><td>Fast, urgent, hard to interrupt</td></tr>
<tr><td><b>Ideas of reference</b></td><td>"The TV is sending me messages."</td></tr>
<tr><td><b>Confabulation</b></td><td>Makes up stories to fill memory gaps, <b>without knowing</b> they're false</td></tr>
<tr><td><b>Perseveration</b></td><td>Keeps repeating the same response</td></tr></table></div>
<div class="formula">Consciousness: Alert → Drowsy → Lethargic → Stuporous → Comatose</div>
<p class="hook"><b>Memory hook:</b> <b>Circ</b>umstantial <b>circ</b>les back; <b>tang</b>ential goes off on a <b>tang</b>ent.</p>`},
{id:'sx', title:'Negative vs positive symptoms',
guide:`<p><b>Common Symptoms Amongst Diagnoses</b><br><b>Negative Sx:</b> absence or reduction of typical behaviors, emotions, and mental functions.</p>
<ul>
<li><b>Avolition:</b> a severe, clinical lack of motivation or ability to start and sustain goal-directed activities.</li>
<li><b>Anhedonia:</b> is the inability to experience pleasure or joy from activities that you would normally find rewarding.</li>
<li><b>Alogia</b>: Poverty of speech</li>
</ul>
<p><b>Positive Sx:</b> exaggerated or added mental phenomena i.e. delusions, hallucinations, disorganized speech</p>`,
simple:`<div class="tbl"><table><tr><th>Negative = something <b>taken away</b></th><th>Positive = something <b>added</b></th></tr>
<tr><td><b>Avolition</b>: no motivation<br><b>Anhedonia</b>: no pleasure<br><b>Alogia</b>: little speech</td><td>Delusions<br>Hallucinations<br>Disorganized speech</td></tr></table></div>
<p class="hook"><b>Memory hook:</b> Negative symptoms are the <b>3 A's</b>, and each one is an <b>a</b>bsence.</p>`}
]});

MODULES.push({
id:'dsm', n:'13', title:'DSM-5 Diagnoses', blurb:'Timeframes, clusters, key distinctions',
topics:[
{id:'spec', title:'Other specified vs unspecified',
guide:`<p>The DSM-5 replaced the Not Otherwise Specified (NOS) categories with two options</p>
<ul>
<li><b>Other Specified Disorder</b>: the clinician can explain why the symptoms do not meet full criteria for a specific disorder but still provides a reason for the subthreshold presentation.</li>
<li><b>Unspecified Disorder</b>: clinician does not specify why the full criteria are not met, often due to limited information or time.</li>
</ul>`,
simple:`<p class="plain"><b>In plain words:</b> NOS is gone. If full criteria aren't met:</p>
<div class="tbl"><table><tr><th>Other specified</th><th>Unspecified</th></tr><tr><td>You <b>say why</b> criteria aren't met</td><td>You <b>don't</b> say why (limited info or time)</td></tr></table></div>`},
{id:'neuro', title:'1. Neurodevelopmental disorders',
guide:`<p><b>Intellectual Disability</b>: IQ less than 70, severity based on adaptive functioning deficits (conceptual, social, practical) not IQ.<br>
<b>Autism Spectrum Disorder:</b> social communication deficits + repetitive behaviors; support level 1–3.<br>
<b>ADHD</b>: symptoms present before age 12.</p>`,
simple:`<ul>
<li><b>Intellectual disability:</b> IQ &lt;70, but <b>severity is based on adaptive functioning</b> (conceptual, social, practical), <b>not IQ</b>.</li>
<li><b>Autism:</b> social communication deficits + repetitive behaviors; support levels 1–3.</li>
<li><b>ADHD:</b> symptoms before age <b>12</b>.</li>
</ul>`},
{id:'psych', title:'2. Psychotic disorders',
guide:`<p><b>Brief Psychotic Disorder</b> (1 day to 1 month)<br><b>Schizophreniform</b> (1 to 6 months)<br><b>Schizophrenia</b> (6+ months, 1 month of active sx)<br><b>Schizoaffective Disorder</b> (psychosis + mood episodes)<br><b>Delusional Disorder</b> (≥1 month, delusions only)</p>
<ul>
<li><b>Delusions</b>: fixed false belief not consistent with cultural background</li>
<li><b>Hallucinations</b>: false perceptions (sensory), most likely = auditory</li>
</ul>`,
simple:`<div class="timeline"><div><b>1 day – 1 month</b><span>Brief psychotic</span></div><div><b>1 – 6 months</b><span>Schizophreniform</span></div><div><b>6+ months</b><span>Schizophrenia (1 month active sx)</span></div></div>
<ul>
<li><b>Schizoaffective</b> = psychosis + mood episodes.</li>
<li><b>Delusional disorder</b> = delusions only, ≥1 month.</li>
<li><b>Delusion</b> = a fixed false <b>belief</b> that doesn't fit the person's culture. <b>Hallucination</b> = a false <b>perception</b>; auditory is most likely.</li>
</ul>`},
{id:'mood', title:'3. Mood disorders',
guide:`<p><b>Major Depressive Disorder</b> (≥2 weeks, 5 symptoms)<br><b>Persistent Depressive Disorder</b> (≥2 years adults)<br><b>Bipolar I</b> (mania ≥1 week or hospitalization)<br><b>Bipolar II</b> (hypomania + depression)<br><b>Cyclothymic Disorder</b> (≥2 years fluctuating)<br><b>Disruptive Mood Dysregulation Disorder</b> (children, chronic irritability)</p>`,
simple:`<div class="tbl"><table><tr><th>Disorder</th><th>Key rule</th></tr>
<tr><td><b>MDD</b></td><td>≥<b>2 weeks</b>, 5 symptoms</td></tr>
<tr><td><b>Persistent depressive</b></td><td>≥<b>2 years</b> (adults)</td></tr>
<tr><td><b>Bipolar I</b></td><td><b>Mania</b> ≥1 week <b>or</b> hospitalization</td></tr>
<tr><td><b>Bipolar II</b></td><td><b>Hypomania</b> + depression</td></tr>
<tr><td><b>Cyclothymic</b></td><td>≥2 years of fluctuating mood</td></tr>
<tr><td><b>DMDD</b></td><td>Children, chronic irritability</td></tr></table></div>
<p class="hook"><b>Memory hook:</b> Bipolar <b>I</b> = full mania. Bipolar <b>II</b> = "hypo" mania (the smaller one).</p>`},
{id:'anx', title:'4. Anxiety disorders',
guide:`<p><b>Generalized Anxiety Disorder</b> (≥6 months)<br><b>Panic Disorder</b> 1+ month, Recurrent unexpected panic attacks, Worry about future attacks<br><b>Agoraphobia</b> Fear of places where escape is difficult<br><b>Separation Anxiety Disorder</b> Excessive fear of separation from attachment figures</p>`,
simple:`<div class="tbl"><table><tr><th>Disorder</th><th>Key rule</th></tr>
<tr><td><b>GAD</b></td><td>≥<b>6 months</b></td></tr>
<tr><td><b>Panic disorder</b></td><td>Recurrent <b>unexpected</b> attacks + 1+ month of worry about future attacks</td></tr>
<tr><td><b>Agoraphobia</b></td><td>Fear of places where <b>escape is difficult</b></td></tr>
<tr><td><b>Separation anxiety</b></td><td>Excessive fear of separation from attachment figures</td></tr></table></div>`},
{id:'trauma', title:'5. Trauma & stress-related disorders',
guide:`<p><b>PTSD</b> ≥1 month, re-experiencing + avoidance + hyperarousal – 4 sx clusters: intrusion, avoidance, negative cognitions/mood, arousal/reactivity<br>
<b>Acute Stress Disorder</b> &lt;1 month<br><b>Adjustment Disorder</b> within 3 months of stressor<br><b>Reactive Attachment Disorder:</b> Severe early neglect, inability to form stable attachments</p>`,
simple:`<div class="timeline"><div><b>&lt; 1 month</b><span>Acute stress disorder</span></div><div><b>≥ 1 month</b><span>PTSD</span></div></div>
<ul>
<li><b>PTSD's 4 clusters:</b> intrusion, avoidance, negative cognitions/mood, arousal/reactivity.</li>
<li><b>Adjustment disorder:</b> starts within <b>3 months</b> of a stressor.</li>
<li><b>Reactive attachment disorder:</b> severe <b>early neglect</b> → can't form stable attachments.</li>
</ul>`},
{id:'ocd', title:'6. OCD & related disorders',
guide:`<p><b>OCD</b> (obsessions + compulsions)<br><b>Hoarding Disorder</b><br><b>Trichotillomania</b></p>`,
simple:`<p><b>OCD</b> = obsessions + compulsions. Hoarding disorder and trichotillomania belong to the same family.</p>
<p class="tip"><b>Don't confuse:</b> OCD (this chapter) vs <b>OCPD</b> (a personality disorder: perfectionism, rigidity, ego-syntonic).</p>`},
{id:'som', title:'7. Somatic symptom-related disorders',
guide:`<p><b>Somatic Symptom Disorder</b> Physical symptoms + excessive thoughts/behaviors<br>
<b>Illness Anxiety Disorder</b> Fear of illness with minimal/no symptoms<br>
<b>Conversion Disorder</b> Neurological symptoms without medical cause<br>
<b>Factitious Disorder</b> (incl. by proxy): Intentionally producing symptoms to assume sick role<br>
<b>Malingering</b> (NOT a mental disorder, important distinction): Faking symptoms for external gain</p>`,
simple:`<div class="tbl"><table><tr><th>Disorder</th><th>Symptoms real?</th><th>Why?</th></tr>
<tr><td><b>Somatic symptom</b></td><td>Yes, plus excessive worry/behavior about them</td><td>—</td></tr>
<tr><td><b>Illness anxiety</b></td><td>Minimal or none, but lots of fear</td><td>—</td></tr>
<tr><td><b>Conversion</b></td><td>Neurological symptoms, no medical cause</td><td>—</td></tr>
<tr><td><b>Factitious</b> (incl. by proxy)</td><td>Produced <b>on purpose</b></td><td>To take on the <b>sick role</b></td></tr>
<tr><td><b>Malingering</b></td><td><b>Faked</b></td><td><b>External gain</b> (money, avoiding duty). <b>Not</b> a mental disorder.</td></tr></table></div>
<p class="hook"><b>Memory hook:</b> Factitious = wants to be a <b>patient</b>. Malingering = wants a <b>payoff</b>.</p>`},
{id:'conduct', title:'8. Disruptive, impulse control & conduct',
guide:`<p>Childhood Dx:<br><b>Oppositional Defiant Disorder (ODD)</b> Angry, argumentative, defiant behavior,<br><b>Conduct Disorder (precursor to antisocial PD)</b> Violation of rights of others, Aggression, theft, serious rule violations</p>`,
simple:`<div class="tbl"><table><tr><th>ODD</th><th>Conduct disorder</th></tr><tr><td>Angry, argumentative, <b>defiant</b></td><td><b>Violates others' rights</b>: aggression, theft, serious rule violations. A precursor to <b>antisocial PD</b>.</td></tr></table></div>`},
{id:'neurocog', title:'9. Neurocognitive disorders',
guide:`<p><b>Delirium</b> (acute, fluctuating, reversible) key feature is inattention<br>
<b>Major Neurocognitive Disorder</b> (dementia/Alzheimer's): Significant cognitive decline<br>
<b>Mild Neurocognitive Disorder</b> mild decline, still independent<br>
<b>Korsakoff's Syndrome</b> Thiamine deficiency (often alcohol-related), Memory loss + confabulation</p>`,
simple:`<div class="tbl"><table><tr><th>Disorder</th><th>Key features</th></tr>
<tr><td><b>Delirium</b></td><td><b>Acute, fluctuating, reversible</b>; key feature = <b>inattention</b></td></tr>
<tr><td><b>Major NCD</b> (dementia)</td><td>Significant decline</td></tr>
<tr><td><b>Mild NCD</b></td><td>Mild decline, <b>still independent</b></td></tr>
<tr><td><b>Korsakoff's</b></td><td>Thiamine deficiency (often alcohol) → memory loss + <b>confabulation</b></td></tr></table></div>
<p class="tip"><b>Exam tip:</b> Sudden confusion in an older adult → think delirium and rule out medical first.</p>`},
{id:'pd', title:'10. Personality disorders',
guide:`<p><b>Cluster A (odd/eccentric)</b></p>
<ul><li><b>Paranoid</b>: distrust</li><li><b>Schizoid</b>: detachment, no desire for relationships</li><li><b>Schizotypal</b>: odd beliefs, magical thinking</li></ul>
<p><b>Cluster B (dramatic/emotional)</b></p>
<ul><li><b>Antisocial</b>: disregard for rights of other</li><li><b>Borderline</b>: instability in mood, relationships, self-image</li><li><b>Histrionic</b>: excessive emotionality and attention-seeking</li><li><b>Narcissistic</b>: grandiosity, lack of empathy</li></ul>
<p><b>Cluster C (anxious/fearful)</b></p>
<ul><li><b>Avoidant</b>: wants relationships but fears rejection</li><li><b>Dependent</b>: excessive need to be cared for</li><li><b>OCPD</b>: perfectionism, control, rigidity (ego-syntonic)</li></ul>`,
simple:`<div class="tbl"><table><tr><th>Cluster</th><th>Theme</th><th>Disorders</th></tr>
<tr><td><b>A</b></td><td>Odd / eccentric ("<b>w</b>eird")</td><td>Paranoid (distrust) · Schizoid (no desire for relationships) · Schizotypal (odd beliefs, magical thinking)</td></tr>
<tr><td><b>B</b></td><td>Dramatic / emotional ("<b>w</b>ild")</td><td>Antisocial · Borderline · Histrionic · Narcissistic</td></tr>
<tr><td><b>C</b></td><td>Anxious / fearful ("<b>w</b>orried")</td><td>Avoidant · Dependent · OCPD</td></tr></table></div>
<p class="tip"><b>Classic mix-up:</b> <b>Schizoid</b> doesn't <b>want</b> relationships. <b>Avoidant</b> wants them but <b>fears rejection</b>.</p>
<p class="hook"><b>Memory hook:</b> Clusters A-B-C = Weird, Wild, Worried.</p>`},
{id:'other', title:'11. Other: substance use & binge eating',
guide:`<ul>
<li><b>Substance Use Disorder:</b> 2+ criteria within 12 months indicating problematic pattern. Severity levels = mild (2-3 criteria), moderate (4-5 criteria), severe (6+ criteria)</li>
<li><b>Binge Eating Disorder:</b> weekly for at least 3 months</li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>SUD criteria (in 12 months)</th><th>Severity</th></tr><tr><td>2–3</td><td>Mild</td></tr><tr><td>4–5</td><td>Moderate</td></tr><tr><td>6+</td><td>Severe</td></tr></table></div>
<p><b>Binge eating disorder:</b> weekly, for at least 3 months.</p>`},
{id:'times', title:'All DSM timeframes on one page',
guide:`<p><em>Every timeframe from the guide's DSM-5 section, collected in one place:</em></p>
<ul>
<li><b>ADHD</b>: symptoms present before age 12.</li>
<li><b>Brief Psychotic Disorder</b> (1 day to 1 month)</li>
<li><b>Schizophreniform</b> (1 to 6 months)</li>
<li><b>Schizophrenia</b> (6+ months, 1 month of active sx)</li>
<li><b>Delusional Disorder</b> (≥1 month, delusions only)</li>
<li><b>Major Depressive Disorder</b> (≥2 weeks, 5 symptoms)</li>
<li><b>Persistent Depressive Disorder</b> (≥2 years adults)</li>
<li><b>Bipolar I</b> (mania ≥1 week or hospitalization)</li>
<li><b>Cyclothymic Disorder</b> (≥2 years fluctuating)</li>
<li><b>Generalized Anxiety Disorder</b> (≥6 months)</li>
<li><b>Panic Disorder</b> 1+ month</li>
<li><b>PTSD</b> ≥1 month</li>
<li><b>Acute Stress Disorder</b> &lt;1 month</li>
<li><b>Adjustment Disorder</b> within 3 months of stressor</li>
<li><b>Substance Use Disorder:</b> 2+ criteria within 12 months</li>
<li><b>Binge Eating Disorder:</b> weekly for at least 3 months</li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Time</th><th>Disorders</th></tr>
<tr><td><b>&lt; 1 month</b></td><td>Acute stress disorder · Brief psychotic (1 day–1 month)</td></tr>
<tr><td><b>≥ 1 week</b></td><td>Bipolar I mania (or hospitalization)</td></tr>
<tr><td><b>≥ 2 weeks</b></td><td>MDD (5 symptoms)</td></tr>
<tr><td><b>≥ 1 month</b></td><td>PTSD · Panic disorder (worry) · Delusional disorder</td></tr>
<tr><td><b>1–6 months</b></td><td>Schizophreniform</td></tr>
<tr><td><b>Within 3 months</b></td><td>Adjustment disorder (after the stressor)</td></tr>
<tr><td><b>≥ 3 months</b></td><td>Binge eating (weekly)</td></tr>
<tr><td><b>≥ 6 months</b></td><td>GAD · Schizophrenia (with 1 month active)</td></tr>
<tr><td><b>12 months</b></td><td>SUD (2+ criteria)</td></tr>
<tr><td><b>≥ 2 years</b></td><td>Persistent depressive · Cyclothymic</td></tr>
<tr><td><b>Before age 12</b></td><td>ADHD symptoms</td></tr></table></div>`}
]});

MODULES.push({
id:'meds', n:'14', title:'Medication', blurb:'Drug classes, examples, side effects',
topics:[
{id:'anti', title:'Antipsychotics',
guide:`<p><b>Antipsychotics</b> (Schizophrenia, Psychosis, Mania)</p>
<ul><li>Examples: Haldol, Thorazine (typical), Risperdal, Abilify, Seroquel (atypical)</li><li>Use: schizophrenia, psychosis, acute mania</li><li>Key side effect: Tardive Dyskinesia (involuntary movements)</li></ul>`,
simple:`<div class="tbl"><table><tr><th>Typical (older)</th><th>Atypical</th></tr><tr><td>Haldol, Thorazine</td><td>Risperdal, Abilify, Seroquel</td></tr></table></div>
<p><b>Used for:</b> schizophrenia, psychosis, acute mania.<br><b>Watch for:</b> <b>tardive dyskinesia</b> (involuntary movements).</p>`},
{id:'mood', title:'Mood stabilizers',
guide:`<p><b>Mood Stabilizer</b> (Bipolar Disorder)</p>
<ul><li>Lithium (MOST TESTED) Depakote, Tegretol</li><li>Lithium: kidney + thyroid toxicity, requires blood monitoring</li><li>Depakote/Tegretol: liver toxicity, require blood monitoring</li></ul>`,
simple:`<div class="tbl"><table><tr><th>Drug</th><th>Toxicity</th><th>Monitoring</th></tr>
<tr><td><b>Lithium</b> (most tested)</td><td><b>Kidney + thyroid</b></td><td>Blood tests</td></tr>
<tr><td>Depakote, Tegretol</td><td><b>Liver</b></td><td>Blood tests</td></tr></table></div>
<p class="hook"><b>Memory hook:</b> <b>L</b>ithium → <b>L</b>evels (blood work) for kidneys and thyroid. Depakote/Tegretol → liver.</p>`},
{id:'anx', title:'Anti-anxiety (benzodiazepines)',
guide:`<p><b>Anti Anxiety</b></p>
<ul><li>Benzodiazepines: Xanax, Ativan, Klonopin, Valium</li><li>Use: acute anxiety, panic, alcohol withdrawal</li><li>Key risk: dependence/addiction + sedation</li></ul>`,
simple:`<p><b>Benzos:</b> Xanax, Ativan, Klonopin, Valium.<br><b>Used for:</b> acute anxiety, panic, alcohol withdrawal.<br><b>Risk:</b> dependence/addiction + sedation.</p>`},
{id:'antidep', title:'Antidepressants',
guide:`<p><b>Antidepressants</b> (Depression, Anxiety, OCD)</p>
<ul><li>SSRIs: Prozac, Zoloft, Paxil (FIRST-LINE)</li><li>SNRIs/Atypical: Effexor, Cymbalta, Wellbutrin</li><li>MAOIs: Nardil, Parnate (RARE but tested) - Food restriction: cheese, wine, beer (tyramine)</li></ul>`,
simple:`<div class="tbl"><table><tr><th>Class</th><th>Examples</th><th>Note</th></tr>
<tr><td><b>SSRIs</b></td><td>Prozac, Zoloft, Paxil</td><td><b>First-line</b></td></tr>
<tr><td><b>SNRIs / atypical</b></td><td>Effexor, Cymbalta, Wellbutrin</td><td>—</td></tr>
<tr><td><b>MAOIs</b></td><td>Nardil, Parnate</td><td>Rare but tested. <b>Avoid tyramine</b>: cheese, wine, beer</td></tr></table></div>
<p><b>Used for:</b> depression, anxiety, OCD.</p>`},
{id:'stim', title:'Stimulants (ADHD)',
guide:`<p><b>Stimulants</b> (ADHD)</p>
<ul><li>Adderall, Ritalin, Vyvanse, Concerta</li><li>Non-stimulant: Strattera</li><li>Use: ADHD (first-line = stimulants)</li></ul>`,
simple:`<p><b>Stimulants (first-line for ADHD):</b> Adderall, Ritalin, Vyvanse, Concerta.<br><b>Non-stimulant:</b> <b>Strattera</b>.</p>`},
{id:'alc', title:'For alcohol use disorder',
guide:`<p><b>For Alcohol Use DO</b></p>
<ul><li><b>Naltrexone:</b> reduces cravings</li><li><b>Benzodiazepines:</b> used for withdrawal/detox</li></ul>`,
simple:`<div class="tbl"><table><tr><th>Naltrexone</th><th>Benzodiazepines</th></tr><tr><td>Reduces <b>cravings</b></td><td><b>Withdrawal/detox</b></td></tr></table></div>`}
]});

MODULES.push({
id:'sup', n:'15', title:'Supervision', blurb:'Supervision vs consultation, types, formats',
topics:[
{id:'vs', title:'Supervision vs consultation',
guide:`<ul>
<li>Consultation: advice you can accept or reject; not hierarchical, usually informal, not ongoing.</li>
<li>Supervision: formal, ongoing relationship where a supervisor is responsible for guidance, evaluation, and professional development. (Go to for ethical dilemma)
<ul><li>Choose actions that protect client safety first</li><li>Use supervisor for ethical issues, risk, or uncertainty</li><li>Follow agency hierarchy when in doubt</li></ul></li>
</ul>`,
simple:`<div class="tbl"><table><tr><th></th><th>Consultation</th><th>Supervision</th></tr>
<tr><td>Advice is…</td><td>Optional: accept or reject</td><td>Part of a responsible relationship</td></tr>
<tr><td>Structure</td><td>Not hierarchical, informal, not ongoing</td><td>Formal, ongoing; supervisor guides and evaluates</td></tr>
<tr><td>Use for</td><td>—</td><td><b>Ethical dilemmas, risk, uncertainty</b></td></tr></table></div>
<p>Safety first · use your supervisor for ethics, risk and uncertainty · follow agency hierarchy when in doubt.</p>`},
{id:'types', title:'Types of supervision',
guide:`<ul>
<li>Educational: teaches clinical skills; focuses on assessment, intervention, treatment; includes transference/countertransference (skill learning)</li>
<li>Administrative: agency rules, documentation, policy, job performance, accountability (Policy/documentation issues)</li>
<li>Supportive: reduces stress, burnout, secondary trauma; supports worker wellbeing (burnout/stress support)</li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Type</th><th>Pick it when the question is about…</th></tr>
<tr><td><b>Educational</b></td><td>Learning clinical skills; transference/countertransference</td></tr>
<tr><td><b>Administrative</b></td><td>Rules, documentation, policy, job performance</td></tr>
<tr><td><b>Supportive</b></td><td>Stress, burnout, secondary trauma</td></tr></table></div>
<p class="hook"><b>Memory hook:</b> "<b>EAS</b>y": Educate, Administer, Support.</p>`},
{id:'formats', title:'Supervision formats',
guide:`<ul>
<li>Individual: 1:1; most focused, best for sensitive/ethical issues; time-consuming</li>
<li>Group: one supervisor + multiple SWs; shared learning; less individualized</li>
<li>Peer: equals supporting each other; helpful but NOT a substitute for formal supervision</li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Format</th><th>Plus</th><th>Minus</th></tr>
<tr><td><b>Individual</b></td><td>Most focused; <b>best for sensitive/ethical issues</b></td><td>Time-consuming</td></tr>
<tr><td><b>Group</b></td><td>Shared learning</td><td>Less individualized</td></tr>
<tr><td><b>Peer</b></td><td>Support from equals</td><td><b>Not</b> a substitute for formal supervision</td></tr></table></div>`}
]});

MODULES.push({
id:'mnem', n:'16', title:'Mnemonics', blurb:'FARM GRITS ROAD, RUSAFE, SAULS HARM, SFAREAFI',
intro:`<p><em>(Mnemonics are moved to a different tab because I find them to be more confusing than helpful other than THINK, which I don't think is necessary either…)</em></p>`,
topics:[
{id:'farm', title:'FARM GRITS ROAD: usually-wrong answers',
guide:`<p>99% of the time, these answers look appealing, but they are incorrect</p>
<p>ELIMINATE ANSWERS THAT DISTRACT..</p>
<p>Using logic: identify hierarchy of needs. Attack safety concerns first, be an active participant in this help. Keep confidentiality when/if you are able to.</p>
<ul class="letters">
<li><b>F</b>ocus on the past</li>
<li><b>A</b>dvice</li>
<li><b>R</b>ecommend later therapy ((individual, family, couples) that's a "DO LATER!")</li>
<li><b>M</b>ake a future appointment</li>
<li><b>G</b>ive pamphlets</li>
<li><b>R</b>ecommend your own therapy</li>
<li><b>I</b>nform Parents
<ul><li>Exception: Intentions of harm on others. i.e. Child told therapist that she is going to push her brother down the stairs</li></ul></li>
<li><b>T</b>erminate
<ul><li><em>First make sure the client is NOT in crisis. Never terminate if in crisis, regardless of the following exceptions…</em></li>
<li>Exceptions: (1) you or your client are moving (2) client reaches all goals (3) client is not paying for sessions (If client is not paying on time, discuss it with the client and then terminate services if debt persists)</li></ul></li>
<li><b>S</b>upervisor help –
<ul><li>Exceptions: (1) ALWAYS go to supervisor for (counter)transference. (2) Conflicts, feeling overwhelmed with case, personal problems, or bias against your client that you cannot manage on your own (3) SW needs more training in a specific therapy intervention that they are unfamiliar with (4) When a court order is received to disclose records, supervision should be obtained first</li>
<li>a supervisor should not be your first line of defense, but sometimes the question will make it clear that you have tried other outlets and still are seeking guidance. Use critical reading skills/code of ethics for these questions.</li></ul></li>
<li><b>R</b>espect self determination IF the person is mentally unstable/psychotic</li>
<li><b>O</b>ffer contracts
<ul><li>No safety contracts should EVER be used when working with a suicidal patient! We always follow SAULS HARM rules. (below)</li></ul></li>
<li><b>A</b>llow clients to lead sessions</li>
<li><b>D</b>o nothing</li>
</ul>`,
simple:`<p class="plain"><b>In plain words:</b> These answers <b>sound</b> good but are usually wrong, because they delay or skip what the client needs <b>now</b>.</p>
<div class="tbl"><table><tr><th>Usually wrong</th><th>…unless (exception)</th></tr>
<tr><td><b>F</b>ocus on the past</td><td>—</td></tr>
<tr><td><b>A</b>dvice</td><td>—</td></tr>
<tr><td><b>R</b>ecommend later therapy</td><td>— ("do later" answers)</td></tr>
<tr><td><b>M</b>ake a future appointment</td><td>—</td></tr>
<tr><td><b>G</b>ive pamphlets</td><td>—</td></tr>
<tr><td><b>R</b>ecommend your own therapy</td><td>—</td></tr>
<tr><td><b>I</b>nform parents</td><td>The child intends to <b>harm others</b></td></tr>
<tr><td><b>T</b>erminate</td><td>Never during a <b>crisis</b>. OK if: someone is moving, all goals are met, or the client isn't paying (discuss it first, then terminate if the debt persists)</td></tr>
<tr><td><b>S</b>upervisor</td><td><b>Always</b> for (counter)transference; conflicts, overwhelm or bias you can't manage; needing training in an unfamiliar intervention; a <b>court order</b> for records</td></tr>
<tr><td><b>R</b>espect self-determination</td><td>Wrong when the client is <b>psychotic/unstable</b></td></tr>
<tr><td><b>O</b>ffer contracts</td><td>Never. No safety contracts, ever.</td></tr>
<tr><td><b>A</b>llow the client to lead</td><td>—</td></tr>
<tr><td><b>D</b>o nothing</td><td>—</td></tr></table></div>`},
{id:'rusafe', title:'RUSAFE',
guide:`<p>NOTE: you should ALWAYS establish rapport in beginning stages of therapy</p>
<ul class="letters">
<li><b>R</b>ule out medical -&gt; physical</li>
<li><b>U</b>nder the influence -&gt; dont treat delusions + hallucinations refer to psychiatrist</li>
<li><b>S</b>ave lives -&gt; SAULS HARM, Safety issues, report abuse/warn/911, ER/Crisis</li>
<li><b>A</b>ssess before action -&gt; assess, ask, DICE (Determine Identify Clarify Explore)</li>
<li><b>F</b>eelings-&gt; Acknowledge, Concerns-&gt; AID(Assist, Inform, Discuss)</li>
<li><b>E</b>mpower -&gt; Respect Client</li>
</ul>
<p>Think logically vs. using the mneumonic. Interventions are based on hierarchy of necessity. We cannot utilize psychoanalysis or other exploratory therapies (feeling/empower based) if there is a physical safety need.</p>`,
simple:`<p class="plain"><b>In plain words:</b> An order of priorities. Always build rapport early.</p>
<div class="tbl"><table><tr><th>Letter</th><th>Priority</th><th>Action</th></tr>
<tr><td><b>R</b></td><td>Rule out medical</td><td>Check for physical causes</td></tr>
<tr><td><b>U</b></td><td>Under the influence</td><td>Don't treat delusions/hallucinations yourself → refer to a psychiatrist</td></tr>
<tr><td><b>S</b></td><td>Save lives</td><td>SAULS HARM: report abuse, warn, 911, ER/crisis</td></tr>
<tr><td><b>A</b></td><td>Assess before action</td><td>DICE: Determine, Identify, Clarify, Explore</td></tr>
<tr><td><b>F</b></td><td>Feelings / concerns</td><td>Acknowledge feelings; AID for concerns: Assist, Inform, Discuss</td></tr>
<tr><td><b>E</b></td><td>Empower</td><td>Respect the client</td></tr></table></div>
<p class="tip"><b>Key point:</b> Exploratory or feelings work can't come first when there's a physical safety need.</p>`},
{id:'sauls', title:'SAULS HARM',
guide:`<ul class="letters">
<li><b>S</b>uspected abuse (CPS)</li>
<li><b>A</b>buse (CPS)
<ul><li><b>In Domestic Violence cases, SW does not call CPS (child is not considered to be in imminent danger): provide psychoeducation on the impact of domestic violence on children. Create a safety plan if the client will not seek shelter for safety. In a crisis situation, the SW must provide immediate, tangible aid. This includes contacting a youth shelter facility for housing FIRST REMEMBER Abuse is often an effort to retain control.</b></li></ul></li>
<li><b>U</b>nexplained marks or bruises (CPS)</li>
<li><b>L</b>ife threats (Suicide assessment)</li>
<li><b>S</b>uicidal ideation (Assess) / intent (Psychiatric institute/ call 911)</li>
<li><b>H</b>omicidal intent (Towards child- Call CPS/proper authorities | Towards an adult- <b>duty to warn</b>)</li>
<li><b>A</b>lcohol/drug increase (usually a <b>sudden increase in use/amount</b> is a red flag for suicide assessment)</li>
<li><b>R</b>eal plan/intent (Action will depend on what the plan is… refer to the other points)</li>
<li><b>M</b>ultiple losses can include loss of a person, animal, job, money, etc. (Complete Suicide assessment)</li>
</ul>
<p>If you are in an intake/meeting and vague concepts of abuse come up you DO have the right/obligation to assess/clarify before taking action. Examples:</p>
<ul>
<li>Parents allude to supporting physical punishment… We want to clarify the client's basic understanding of physical punishment practices before taking any further action.</li>
<li>Caretaker describes yelling at their parents who are in a wheelchair… clarify the extent of the yelling. Bickering is VERY different from verbal abuse. The latter requires a phone call to authorities.</li>
<li>Interview child prior to reporting</li>
</ul>`,
simple:`<p class="plain"><b>In plain words:</b> The red flags that mean <b>act now</b>, and what to do for each.</p>
<div class="tbl"><table><tr><th>Red flag</th><th>Action</th></tr>
<tr><td>Suspected abuse, abuse, unexplained marks/bruises</td><td>CPS</td></tr>
<tr><td>Life threats, suicidal ideation</td><td>Suicide assessment</td></tr>
<tr><td>Suicidal <b>intent</b></td><td>Psychiatric facility / 911</td></tr>
<tr><td>Homicidal intent toward a <b>child</b></td><td>CPS / proper authorities</td></tr>
<tr><td>Homicidal intent toward an <b>adult</b></td><td><b>Duty to warn</b></td></tr>
<tr><td><b>Sudden increase</b> in alcohol/drug use</td><td>Suicide assessment</td></tr>
<tr><td>Real plan/intent</td><td>Depends on the plan</td></tr>
<tr><td>Multiple losses (person, pet, job, money)</td><td>Suicide assessment</td></tr></table></div>
<p><b>Domestic violence:</b> <b>don't</b> call CPS (the child isn't in imminent danger). Give psychoeducation on how DV affects children, and make a safety plan if the client won't go to a shelter.<br>
<b>Crisis:</b> give immediate, <b>tangible</b> aid (e.g., contact a youth shelter for housing <b>first</b>).<br>
<b>Vague hints of abuse:</b> clarify before acting (physical punishment beliefs, "yelling" at a parent). Interview the child before reporting.</p>`},
{id:'sfare', title:'SFAREAFI',
guide:`<p><b><em>I use this as a last resort.. I find it trips me up more than not</em></b></p>
<p>How to use: identify each question as it fits into one of these categories and then pick answers based on this hierarchy.</p>
<ol><li>Safety</li><li>Feelings</li><li>Assess</li><li>Refer</li><li>Educate</li><li>Advocate</li><li>Facilitate</li><li>Intervene</li></ol>`,
simple:`<p class="plain"><b>In plain words:</b> A last-resort ranking. Sort the answer choices into these categories and pick the highest one.</p>
<div class="formula">Safety → Feelings → Assess → Refer → Educate → Advocate → Facilitate → Intervene</div>
<p class="hook"><b>Memory hook:</b> "<b>S</b>ome <b>F</b>riends <b>A</b>re <b>R</b>eally <b>E</b>xcellent <b>A</b>t <b>F</b>inding <b>I</b>deas."</p>`},
{id:'comm', title:"Commenter's note: suicide red flags",
guide:`<p><b><em>Commenter's Note:</em></b> Something to note is that clients who have recently been released from an involuntary hospitalization are at increased risk for suicide. They have been stabilized by treatment and now have the energy to follow through with their plan. Always complete Suicide/Safety assessment following release.</p>
<ul><li><b>Red flags for suicide include:</b> Giving away valued possessions. Example: An elderly client who recently lost his wife and is coming to you for treatment attempts to gift you with a painting. Inquire about the significance of the item and reason behind giving it away.</li></ul>`,
simple:`<ul>
<li><b>Just released from involuntary hospitalization</b> → <b>higher</b> suicide risk (more energy to act) → always do a suicide/safety assessment.</li>
<li><b>Giving away valued possessions</b> = red flag → ask about what the item means and <b>why</b> they're giving it away.</li>
</ul>`}
]});

window.QUESTIONS = window.QUESTIONS || [];
function Q(m,t,type,stem,opts,exp){ QUESTIONS.push({m:m,t:t,type:type,stem:stem,opts:opts,exp:exp}); }
// ---------- ETHICS ----------
Q('ethics','core','v',"After the social worker explains the risks, a competent adult client declines the treatment the team recommends. What should the social worker do?",
["Respect the decision and document the client's understanding of the risks of declining","Keep pressing the client until they agree to the recommended treatment","Contact the client's family and ask them to persuade the client","End services because the client is refusing treatment"],
"This is <b>informed refusal</b>: the client declines treatment knowingly. The guide says to <b>document the client's understanding of the risks</b>. Self-determination is limited only by harm to self/others, abuse, or a legal mandate, and none of those is present. Calling family would breach confidentiality, and ending services would be abandonment.");
Q('ethics','core','r',"According to the guide, a client's right to self-determination can be limited when there is:",
["Harm to self or others, abuse, or a legal mandate","Disagreement between the client and the social worker","A request from a family member","Any mental health diagnosis"],
"Self-determination (limit = <b>harm to self/others, abuse, legal mandate</b>).");
Q('ethics','core','r',"Which list matches the NASW core values in the guide?",
["Service, social justice, dignity/worth, relationships, integrity, competence","Service, loyalty, efficiency, relationships, honesty, competence","Advocacy, social justice, confidentiality, integrity, respect, education","Dignity/worth, empathy, self-determination, fairness, honesty, excellence"],
"NASW Core Values: <b>service, social justice, dignity/worth, relationships, integrity, competence</b>.");
Q('ethics','core','v',"A social worker is asked to provide an intervention they have never been trained in. Under the competence principle, the social worker should:",
["Practice within scope: consult, get supervision, or refer","Try the intervention and learn as they go","Read one article about it and start next session","Tell the client the service is not available anywhere"],
"<b>Competence:</b> practice within scope; consult, get supervision, or refer when needed.");
Q('ethics','core','r',"For clients who cannot give consent, the social worker should obtain:",
["Assent","Informed refusal","A court order","A safety contract"],
"The guide: <b>Assent</b> for clients who cannot consent.");
Q('ethics','confid','v',"A social worker receives a subpoena for a client's full record. What should the social worker do FIRST?",
["Consult, then follow legal/agency requirements and disclose only what is required","Send the complete record to the requesting attorney right away","Ignore it, because all records are confidential","Shred personal process notes before responding"],
"<b>Subpoena ≠ automatic release.</b> For a court order or subpoena the guide says limited disclosure after consultation, following jurisdiction/company legal requirements. Ignoring it is also wrong: you respond, but carefully.");
Q('ethics','confid','r',"Which of these must a social worker comply with?",
["A court order","A subpoena","A request from the client's spouse","A request from the client's employer"],
"<b>Court order = must comply.</b> A subpoena is not an automatic release.");
Q('ethics','confid','r',"Testimonial privilege belongs to:",
["The client","The social worker","The judge","The agency"],
"Testimonial privilege: the <b>client</b> holds the right to prevent the social worker from testifying about their treatment.");
Q('ethics','confid','v',"During an intake, something a parent says gives the social worker reasonable suspicion that their 6-year-old is being neglected. What is the social worker's responsibility?",
["Report, gathering only the minimal necessary information","Investigate the home fully before deciding whether to report","Wait a few sessions to see if more evidence appears","Keep it confidential because the parent is the client"],
"<b>Mandatory reporting:</b> report, <b>do not investigate</b>, only gather minimal necessary information. Mandated reporting overrides confidentiality.");
Q('ethics','confid','r',"Mandatory reporting covers abuse, neglect or exploitation of:",
["Children, elders and dependent adults","Children only","Any adult client who discloses it","Only clients currently in treatment"],
"Mandatory Reporting: (<b>child, elder, dependent adult</b> abuse/neglect/exploitation).");
Q('ethics','bound','v',"A social worker briefly mentions that they also found moving to a new city stressful, and the client feels understood. This is best described as a:",
["Boundary crossing","Boundary violation","Dual relationship","Countertransference reaction"],
"<b>Crossing</b> = minor/can be therapeutic (e.g., self-disclosure). A <b>violation</b> is harmful or exploitative.");
Q('ethics','bound','v',"A current client sends the social worker a friend request on social media. The social worker should:",
["Not accept, because there should be no social media contact with clients","Accept but avoid posting personal content","Accept since the client initiated it","Accept only after checking with the client's family"],
"Boundaries: <b>No social media contact.</b>");
Q('ethics','bound','v',"A social worker notices that a colleague has smelled of alcohol at work several times. What should the social worker do FIRST?",
["Speak with the colleague directly about the concern","Report the colleague to the licensing board","Ask other coworkers whether they've noticed","Ignore it unless a client complains"],
"Address impaired colleagues <b>directly</b> first, then <b>report if unresolved</b>.");
Q('ethics','bound','v',"At termination, a client gives the social worker a small handmade card. The social worker should:",
["Accept it if it is small and clinically appropriate","Refuse all gifts in all circumstances","Accept it and give the client a gift in return","Report the gift to the licensing board"],
"Gifts <b>only if small/clinically appropriate</b>.");
Q('ethics','bound','r',"Regarding dual relationships, the guide says the social worker should:",
["Assess them and avoid them if possible","Always terminate the client","Accept them if the client initiates","Ignore them in small communities"],
"Dual relationships (<b>assess &amp; avoid if possible</b>).");
Q('ethics','doc','r',"According to the guide, records are generally kept for about:",
["7 years (longer for minors; varies by state)","1 year after termination","3 years for adults and minors alike","Until the client dies"],
"Keep <b>~7 years</b> (longer for minors; varies by state). Rights apply even after the client's death.");
Q('ethics','doc','v',"A client asks to read their record. The social worker believes one section could seriously harm the client. The social worker should:",
["Allow access generally, but deny the harmful section and document why","Deny the entire request because records belong to the agency","Release everything, because clients have unlimited access","Require the client to obtain a court order first"],
"Client access is <b>generally allowed</b>, with limits: <b>document and deny</b> if it would cause harm to the client.");
Q('ethics','doc','r',"The guide's order for ethical decision-making is:",
["Prioritize safety → consult + document → choose the least harmful option","Choose the least harmful option → consult → prioritize safety","Consult a lawyer → document → prioritize safety","Follow the client's wishes → document → consult"],
"<b>Ethical decision-making:</b> prioritize safety, consult + document, choose the least harmful option.");
Q('ethics','doc','r',"When does the law override the Code of Ethics, according to the guide?",
["Only when required","Always","Never","Only when the client agrees"],
"Law overrides ethics <b>only when required</b>.");
Q('ethics','neg','r',"Malpractice is best defined as:",
["Negligence + harm + legal damages","Any mistake a social worker makes","Failure to meet the standard of care, even without harm","A boundary crossing"],
"Negligence = failure to meet the standard of care. <b>Malpractice = negligence + harm + legal damages.</b>");
Q('ethics','neg','v',"A social worker abruptly stops seeing a client with no planning or referral. This is:",
["Abandonment","Appropriate termination","Informed refusal","A boundary crossing"],
"Termination must include planning, referral and continuity. <b>Abrupt termination = abandonment</b>, which is also a common cause of malpractice claims.");
Q('ethics','neg','r',"The legal obligation to provide competent professional services is:",
["Duty of care","Duty to warn","Informed consent","Testimonial privilege"],
"<b>Duty of Care:</b> legal obligation to provide competent professional services.");
Q('ethics','patterns','v',"An 80-year-old client who was sharp last month is suddenly confused and disoriented. What should the social worker do FIRST?",
["Refer for a medical evaluation to rule out medical causes","Begin reminiscence therapy","Arrange a dementia care placement","Ask the family to take over decision-making"],
"Clinical exam pattern: <b>elder confusion → rule out medical causes first</b>.");
Q('ethics','patterns','v',"A teacher refers a 9-year-old for acting out in class. Before labeling the behavior, the social worker should consider:",
["Ecological and developmental factors","Whether medication is needed","Suspension from school","A conduct disorder diagnosis"],
"Child behavior issues: consider <b>ecological and developmental factors</b>.");
Q('ethics','patterns','r',"Accepting and valuing clients without judgment or conditions is called:",
["Unconditional positive regard","Congruence","Universalization","Reframing"],
"<b>Unconditional positive regard</b>: accepting and valuing clients without judgment or conditions.");
// ---------- THINK ----------
Q('think','risk','v',"A client being treated for depression arrives upbeat. She says she has 'so much more energy' and has been giving away things she no longer needs. What should the social worker do FIRST?",
