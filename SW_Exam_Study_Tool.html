<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c5f63">
<meta name="description" content="Offline study tool for the social work licensing exam: guide content with simplified explanations, quizzes, flashcards, weak-spot tracking and a study plan to exam day.">
<title>SW Exam Prep</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232c5f63'/%3E%3Cpath d='M18 20h28M18 32h28M18 44h18' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
 --bg:#f5f4ef; --surface:#ffffff; --surface-2:#efede6; --surface-3:#e6e3da;
 --text:#1c1d1a; --muted:#5d5e57; --faint:#8a8a82; --border:#dfdcd2;
 --accent:#2c5f63; --accent-ink:#ffffff; --accent-weak:#e1ecec; --accent-text:#24545a;
 --good:#2d7a4c; --good-bg:#e4f2e8; --bad:#b0412f; --bad-bg:#f7e4df; --warn:#8a6100; --warn-bg:#f8efd6;
 --hook-bg:#f1ecfa; --hook-bd:#d9cdef; --hook-ink:#4b3a78;
 --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
 --radius:14px; --nav-h:62px;
 color-scheme:light;
}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]){
  --bg:#141513; --surface:#1d1e1b; --surface-2:#252622; --surface-3:#2e302b;
  --text:#ebeae4; --muted:#a9a89f; --faint:#7c7b74; --border:#33352f;
  --accent:#7db6ba; --accent-ink:#0f1a1b; --accent-weak:#1f3234; --accent-text:#9fcfd2;
  --good:#6cc08d; --good-bg:#1b3325; --bad:#ee8b7a; --bad-bg:#3a211c; --warn:#e2b454; --warn-bg:#352b14;
  --hook-bg:#26213a; --hook-bd:#3b3358; --hook-ink:#cbbdf0;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
 }
}
:root[data-theme="dark"]{
  --bg:#141513; --surface:#1d1e1b; --surface-2:#252622; --surface-3:#2e302b;
  --text:#ebeae4; --muted:#a9a89f; --faint:#7c7b74; --border:#33352f;
  --accent:#7db6ba; --accent-ink:#0f1a1b; --accent-weak:#1f3234; --accent-text:#9fcfd2;
  --good:#6cc08d; --good-bg:#1b3325; --bad:#ee8b7a; --bad-bg:#3a211c; --warn:#e2b454; --warn-bg:#352b14;
  --hook-bg:#26213a; --hook-bd:#3b3358; --hook-ink:#cbbdf0;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{min-height:100vh}
/* Header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border)}
.top-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand{font-weight:700;letter-spacing:-.01em;font-size:17px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.chip-count{margin-left:auto;font-size:13px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);padding:4px 10px;border-radius:99px;white-space:nowrap}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
/* Main */
main{max-width:780px;margin:0 auto;padding:18px 16px calc(var(--nav-h) + 36px + env(safe-area-inset-bottom))}
h1{font-size:26px;line-height:1.2;letter-spacing:-.02em;margin:4px 0 6px}
h2{font-size:19px;letter-spacing:-.01em;margin:26px 0 10px}
h3{font-size:16px;margin:18px 0 8px}
.sub{color:var(--muted);margin:0 0 16px}
.muted{color:var(--muted)} .small{font-size:14px}
/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--nav-h);text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;position:relative}
nav.tabs .tl{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
@media (max-width:400px){nav.tabs a{font-size:10.5px}}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent-text)}
nav.tabs a[aria-current="page"] .ti{background:var(--accent-weak)}
nav.tabs .ti{display:grid;place-items:center;width:44px;height:28px;border-radius:99px}
nav.tabs .badge{position:absolute;top:6px;left:50%;margin-left:8px;background:var(--bad);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;line-height:16px}
@media (min-width:980px){
 nav.tabs{top:0;bottom:0;right:auto;width:210px;flex-direction:column;justify-content:flex-start;padding:76px 10px 10px;border-top:0;border-right:1px solid var(--border)}
 nav.tabs a{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;height:46px;font-size:15px;padding:0 10px;border-radius:10px}
 nav.tabs a[aria-current="page"]{background:var(--accent-weak)}
 nav.tabs a[aria-current="page"] .ti{background:none}
 nav.tabs .ti{width:26px}
 nav.tabs .badge{position:static;margin:0 0 0 auto}
 body{padding-left:210px}
 main{padding-bottom:60px}
}
/* Cards & buttons */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stack>*+*{margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-weight:600;text-decoration:none;color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.good{background:var(--good-bg);border-color:transparent;color:var(--good)}
.btn.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.action{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);color:var(--text);text-decoration:none}
.action .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-weak);color:var(--accent-text);display:grid;place-items:center;flex:none}
.action .ic svg{width:20px;height:20px}
.action b{display:block;font-size:15px} .action span{display:block;font-size:13px;color:var(--muted)}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good>i{background:var(--good)} .bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}
.countdown{display:flex;align-items:baseline;gap:8px}
.countdown .n{font-size:44px;font-weight:750;letter-spacing:-.03em;line-height:1;color:var(--accent-text);font-variant-numeric:tabular-nums}
.quote{border-left:3px solid var(--accent);padding:6px 0 6px 14px;color:var(--muted);font-style:italic;margin:0}
/* Module list */
.mods{display:grid;gap:10px}
.mod{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);text-decoration:none;color:var(--text);box-shadow:var(--shadow)}
.mod .num{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.mod.done .num{background:var(--good-bg);color:var(--good)}
.mod b{display:block} .mod .meta{font-size:13px;color:var(--muted)}
.mod .bar{margin-top:6px}
.chev{color:var(--faint)} .chev svg{width:18px;height:18px}
.topics{display:grid;gap:8px}
.topic{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--text)}
.topic .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex:none;display:grid;place-items:center}
.topic.done .ck{background:var(--good);border-color:var(--good);color:#fff}
.topic.done .ck svg{width:14px;height:14px}
.topic .qn{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
/* Search */
.search{position:relative;margin:0 0 14px}
.search input{width:100%;height:46px;border-radius:12px;border:1px solid var(--border);background:var(--surface);padding:0 14px 0 40px}
.search svg{position:absolute;left:12px;top:13px;width:20px;height:20px;color:var(--faint)}
.result{display:block;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--text);margin-bottom:8px}
.result small{color:var(--muted);display:block}
mark{background:var(--warn-bg);color:inherit;border-radius:3px;padding:0 2px}
/* Reader */
.crumb{font-size:13px;color:var(--muted);margin-bottom:4px}
.crumb a{color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted);background:none;border:1px solid var(--border);border-radius:12px;padding:8px 12px;min-height:44px}
.toggle[aria-pressed="true"]{color:var(--accent-text);border-color:var(--accent);background:var(--accent-weak)}
.toggle svg{width:18px;height:18px}
.reader-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 14px}
.content{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:6px 18px 14px;position:relative;box-shadow:var(--shadow)}
.content .label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--faint);margin:12px 0 0}
.content ul,.content ol{padding-left:22px;margin:10px 0}
.content li{margin:5px 0}
.content li>ul,.content li>ol{margin:4px 0}
.content h4{margin:16px 0 4px;font-size:15px}
.content p{margin:10px 0}
.intro{color:var(--muted);font-size:14px;margin:4px 0 10px}
.tbl{overflow-x:auto;margin:12px 0;border:1px solid var(--border);border-radius:10px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;vertical-align:top;padding:9px 11px;border-bottom:1px solid var(--border)}
th{background:var(--surface-2);font-size:13px;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:0}
td+td,th+th{border-left:1px solid var(--border)}
.plain{background:var(--accent-weak);border-radius:10px;padding:10px 12px}
.tip{background:var(--warn-bg);border-radius:10px;padding:10px 12px}
.hook{background:var(--hook-bg);border:1px solid var(--hook-bd);color:var(--hook-ink);border-radius:10px;padding:10px 12px}
.hook b{color:inherit}
.formula{font-weight:600;text-align:center;background:var(--surface-2);border-radius:10px;padding:12px;margin:12px 0}
.ext{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--warn);background:var(--warn-bg);border-radius:99px;padding:1px 8px;vertical-align:1px;white-space:nowrap}
.timeline{display:flex;gap:6px;margin:12px 0}
.timeline>div{flex:1;background:var(--surface-2);border-radius:10px;padding:10px;text-align:center;font-size:14px}
.timeline span{display:block;color:var(--muted);font-size:13px}
.ladder{counter-reset:l;list-style:none;padding-left:0!important}
.ladder li{counter-increment:l;position:relative;padding:10px 12px 10px 46px;background:var(--surface-2);border-radius:10px;margin:8px 0}
.ladder li::before{content:counter(l);position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;display:grid;place-items:center}
.pyramid{list-style:none;padding:0!important;display:flex;flex-direction:column-reverse;align-items:center;gap:4px}
.pyramid li{background:var(--accent-weak);border-radius:8px;padding:6px 10px;text-align:center;font-size:14px;margin:0!important}
.pyramid li:nth-child(1){width:100%} .pyramid li:nth-child(2){width:92%} .pyramid li:nth-child(3){width:84%} .pyramid li:nth-child(4){width:76%} .pyramid li:nth-child(5){width:68%} .pyramid li:nth-child(6){width:60%}
.letters{list-style:none;padding-left:0!important}
.letters>li>b:first-child{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--accent-weak);color:var(--accent-text);margin-right:4px}
.recall-wrap{position:relative}
.recall-wrap.hidden .content-body{filter:blur(7px);user-select:none;pointer-events:none}
.recall-cover{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:2;padding:16px}
.recall-wrap.hidden .recall-cover{display:flex}
.recall-cover .card{max-width:340px;text-align:center}
/* Beyond the guide */
.src-seg{margin:2px 0 16px;display:flex}
.src-seg a{white-space:nowrap;flex:1;text-align:center;text-decoration:none;border:0;border-radius:9px;padding:9px 12px;font-weight:650;font-size:14.5px;color:var(--muted);min-height:40px;display:flex;align-items:center;justify-content:center;gap:6px}
.src-seg a[aria-current="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.src-seg .cnt{font-size:12px;font-weight:700;color:var(--faint)}
.bx-note{background:var(--accent-weak);color:var(--accent-text);border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 14px}
.bx-note b{color:inherit}
.mod.bx .num{background:var(--accent-weak);color:var(--accent-text)}
.pe{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--good);background:var(--good-bg);border-radius:99px;padding:1px 8px;vertical-align:2px;white-space:nowrap}
.pe-row{display:table;margin-top:4px}
.xtip{border-left:3px solid var(--accent);background:var(--accent-weak);border-radius:0 10px 10px 0;padding:10px 12px;margin:14px 0 6px}
.xtip .h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent-text);margin-bottom:2px}
.xrefs{margin:12px 0 4px;font-size:13px;color:var(--muted)}
.xrefs .h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--faint);margin-bottom:4px}
.xrefs ul{margin:0;padding-left:18px}.xrefs li{margin:3px 0}
.xrefs a{color:var(--accent-text);overflow-wrap:anywhere}
.title-tags{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 4px}
/* Typed recall */
.recall-wrap.hidden .content{max-height:170px;overflow:hidden}
.recall-wrap.hidden .recall-cover{position:static;display:block;padding:0;margin-bottom:12px}
.recall-cover .card.rc-card{max-width:none;text-align:left}
.rc-card b{display:block;margin-bottom:2px}
.rc-card .rc-input{font-size:16px;line-height:1.5;font-family:inherit;min-height:150px;margin:10px 0;resize:vertical}
.rc-card .rc-actions{display:flex;gap:10px;flex-wrap:wrap}
.rc-card .rc-actions .btn{flex:1 1 160px}
.rc-result{margin-bottom:12px}
.rc-score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rc-score .pct{font-size:30px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rc-score .pct.good{color:var(--good)} .rc-score .pct.warn{color:var(--warn)} .rc-score .pct.bad{color:var(--bad)}
.rc-result .bar{margin:8px 0 12px}
.rc-terms{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.rc-terms span{font-size:13.5px;font-weight:600;border-radius:99px;padding:4px 10px;line-height:1.3}
.rc-terms.got span{background:var(--good-bg);color:var(--good)}
.rc-terms.miss span{background:var(--bad-bg);color:var(--bad)}
.rc-sub{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--faint);margin-top:4px}
.rc-hist{margin:-4px 0 14px;font-size:14px}
.rc-hist summary{cursor:pointer;color:var(--muted);font-weight:600;list-style:none;display:block;padding:8px 0;line-height:1.4}
.rc-hist summary::-webkit-details-marker{display:none}
.rc-hist summary .v{color:var(--text)}
.rc-hist summary .more{color:var(--accent-text);text-decoration:underline;text-underline-offset:3px}
.rc-hist ol{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:6px}
.rc-hist li{display:grid;grid-template-columns:1fr 48px 44px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 12px}
.rc-hist li .d{color:var(--muted);font-size:13px}
.rc-hist li .p{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.topic .rc{margin-left:auto;font-size:12px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}
.topic .rc+.qn{margin-left:8px}
.rc.good{background:var(--good-bg);color:var(--good)} .rc.warn{background:var(--warn-bg);color:var(--warn)} .rc.bad{background:var(--bad-bg);color:var(--bad)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pager a{min-width:0}
.pager a span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;font-size:13px;color:var(--muted)}
.pager .btn{flex-direction:column;align-items:flex-start;gap:0}
.pager .next{align-items:flex-end;text-align:right}
.pager .btn.ghost{background:var(--accent-weak);border-color:transparent;color:var(--accent-text)}
.pager .btn.ghost:hover{border-color:var(--accent)}
.pager .btn.ghost span{color:var(--muted)}
/* Chips & forms */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:14px;font-weight:600;color:var(--muted);min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.field{margin:16px 0}
.field>label,.field>.lab{display:block;font-weight:700;font-size:14px;margin-bottom:8px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
input[type=date],input[type=time]{height:44px;border-radius:10px;border:1px solid var(--border);background:var(--surface);padding:0 10px}
textarea{width:100%;min-height:90px;border-radius:10px;border:1px solid var(--border);background:var(--surface);padding:10px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--text)}
/* Quiz */
.qhead{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:8px}
.qhead .pill{background:var(--surface-2);border-radius:99px;padding:3px 10px;font-weight:600}
.qstem{font-size:18px;line-height:1.5;font-weight:600;margin:6px 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);font-size:15.5px;line-height:1.45;color:var(--text)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-weak)}
.opt.correct{border-color:var(--good);background:var(--good-bg)}
.opt.correct .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default;opacity:1}
.opt.dim{opacity:.6}
.feedback{margin-top:14px;border-radius:12px;padding:14px;border:1px solid var(--border);background:var(--surface)}
.feedback .verdict{font-weight:750;font-size:16px;margin-bottom:4px}
.feedback.ok .verdict{color:var(--good)} .feedback.no .verdict{color:var(--bad)}
.feedback .src{font-size:13px;margin-top:10px}
.qfoot{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:12px 0 4px;background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px;margin-top:6px;z-index:5}
@media (min-width:980px){.qfoot{bottom:0}}
.progress{height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-bottom:12px}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.flag{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;min-height:36px}
.flag[aria-pressed="true"]{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.flag svg{width:16px;height:16px}
.score{font-size:52px;font-weight:750;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.missed{border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-bottom:8px}
.missed summary{padding:12px 14px;cursor:pointer;font-weight:600;list-style:none;display:flex;gap:10px}
.missed summary::-webkit-details-marker{display:none}
.missed summary .mk{color:var(--bad);flex:none}
.missed .body{padding:0 14px 14px;font-size:14.5px}
.missed .ans{color:var(--good);font-weight:600}
/* Flashcards */
.fc-wrap{perspective:1200px;margin:8px 0 14px}
.fc{position:relative;width:100%;min-height:260px;border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1);display:block;text-align:center}
.fc.flipped{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;gap:10px}
.fc .back{transform:rotateY(180deg);background:var(--accent-weak)}
.fc .face .t{font-size:21px;font-weight:700;line-height:1.35}
.fc .back .t{font-size:17px;font-weight:500;line-height:1.5}
.fc .hint{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
@media (prefers-reduced-motion:reduce){.fc{transition:none}.progress>i{transition:none}}
/* Plan */
.day{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

.day-h .when{font-size:13px;color:var(--muted);grid-column:1/-1}
.day-h .tag{grid-column:2;grid-row:1;font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:99px;padding:2px 10px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--border)}

.item .go{flex:none;min-height:36px;padding:6px 12px;font-size:13px}
.tipc{padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-bottom:10px}
.tipc h3{margin:0 0 6px}

.tipc .how{font-size:14px;background:var(--accent-weak);border-radius:8px;padding:8px 10px}

.refs{font-size:13px;color:var(--muted);padding-left:18px}
.refs li{margin:6px 0}
.empty{text-align:center;color:var(--muted);padding:30px 16px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.kbd{font-size:12px;color:var(--faint)}
@media (hover:none){.kbd{display:none}}
.divider{height:1px;background:var(--border);margin:18px 0}
.acc{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.rv-list{display:grid;gap:10px;margin-bottom:10px}
.rv-sec{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:var(--radius);border:1px solid var(--border);border-left:4px solid var(--bad);background:var(--surface);text-decoration:none;color:var(--text);box-shadow:var(--shadow)}
.rv-sec .rk{width:30px;height:30px;border-radius:50%;background:var(--bad-bg);color:var(--bad);display:grid;place-items:center;font-weight:800;font-size:14px}
.rv-sec b{display:block}.rv-sec .rv-why{display:block;margin-top:2px}.rv-sec .bar{margin-top:7px}.rv-sec .rv-tops{display:block;margin-top:6px;color:var(--muted)}
.rv-steps{list-style:none;counter-reset:rv;padding:0;margin:16px 0 0;display:grid;gap:12px}
.rv-steps>li{counter-increment:rv;position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px 14px 52px;box-shadow:var(--shadow)}
.rv-steps>li::before{content:counter(rv);position:absolute;left:14px;top:14px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px}

.rv-miss{margin:10px 0 0}.rv-q{border-top:1px solid var(--border);padding-top:8px;margin-top:8px}.rv-q:first-child{border-top:0;margin-top:0;padding-top:0}.rv-q p{margin:4px 0}

{id:'note', title:"A note from the guide's author",
guide:`<p><em>From Rachel, the guide's author:</em></p>
<p>I want to start by congratulating you on making it this far! I'm so excited for all of you as you work towards becoming social workers. Remember that your score does not reflect your self-worth or your potential in this field. You're here just to pass the exam!</p>`,

MODULES.push({
id:'ethics', n:'01', title:'NASW Code of Ethics', blurb:'Values, confidentiality, boundaries, documentation',
intro:`<p><em>I recommend reading the Code of Ethics at least once before your exam!</em></p>`,
topics:[
{id:'core', title:'Core values & ethical principles',
guide:`<p><b>NASW Core Values: service, social justice, dignity/worth, relationships, integrity, competence</b></p>
<p><b>Core Ethical Principles</b></p>
<ul>
<li>Client self-determination (limit = harm to self/others, abuse, legal mandate)</li>
<li>Confidentiality protected by HIPAA</li>
<li>Informed consent/ Informed refusal = client declines treatment knowingly (document client's understanding of risks when declining recommended treatment)
<ul><li>Assent for clients who cannot consent.</li></ul></li>
<li><b>Competence:</b> Practice within scope, Consult/Get Supervision/Refer when needed</li>
</ul>`,
simple:`<p class="plain"><b>In plain words:</b> Six values drive everything; the principles tell you how to act on them.</p>
<div class="tbl"><table><tr><th>Principle</th><th>What it means on the exam</th></tr>
<tr><td><b>Self-determination</b></td><td>The client decides. The only limits: <b>harm to self/others</b>, <b>abuse</b>, or a <b>legal mandate</b>.</td></tr>
<tr><td><b>Confidentiality</b></td><td>Protected by HIPAA. The exceptions are in the next topic.</td></tr>
<tr><td><b>Informed consent / refusal</b></td><td>A client can knowingly say no. Your job is to <b>document</b> that they understood the risks.</td></tr>
<tr><td><b>Assent</b></td><td>Clients who can't consent still give their agreement (assent).</td></tr>
<tr><td><b>Competence</b></td><td>Stay in your scope. Outside it: <b>consult, get supervision, or refer</b>.</td></tr></table></div>
<p class="hook"><b>Memory hook (core values):</b> "<b>S</b>ome <b>S</b>ocial workers <b>D</b>o <b>R</b>eally <b>I</b>mportant <b>C</b>asework" = Service, Social justice, Dignity/worth, Relationships, Integrity, Competence.</p>`},
{id:'confid', title:'Breaking confidentiality',
guide:`<p><b>Breaking Confidentiality: (Expanded on below in "THINK")</b></p>
<ul>
<li>Danger to self or others, duty to warn.</li>
<li><b>Mandatory Reporting:</b> (child, elder, dependent adult abuse/neglect/exploitation) → report, do not investigate, only gather minimal necessary information.</li>
<li>Court order or Subpoena (limited disclosure after consultation) – follow jurisdictions/company's legal requirements
<ul><li><b>Subpoena</b> ≠ automatic release / <b>Court order</b> = must comply</li>
<li><b>Testimonial privilege</b>: clients holds right to prevent th from testifying about their treatment</li></ul></li>
</ul>`,
simple:`<p class="plain"><b>In plain words:</b> Confidentiality is the default. You break it only for these reasons, and only as much as needed.</p>
<div class="tbl"><table><tr><th>Situation</th><th>What you do</th></tr>
<tr><td>Danger to self or others</td><td>Break confidentiality; <b>duty to warn</b></td></tr>
<tr><td>Abuse / neglect / exploitation of a child, elder or dependent adult</td><td><b>Report.</b> Don't investigate. Gather only the minimum info needed.</td></tr>
<tr><td>Subpoena</td><td><b>Not</b> an automatic release. Consult first, then limited disclosure per legal requirements.</td></tr>
<tr><td>Court order</td><td><b>Must comply.</b></td></tr>
<tr><td>Testimonial privilege</td><td>Belongs to the <b>client</b>. They can stop you from testifying about their treatment.</td></tr></table></div>
<p class="hook"><b>Memory hook:</b> A subpoena <b>asks</b>; a court order <b>orders</b>.</p>`},
{id:'bound', title:'Boundaries',
guide:`<p><b>Boundaries</b></p>
<ul>
<li>Crossing = minor/can be therapeutic (self disclosure) vs. Violation = harmful/exploitative</li>
<li>Dual relationships (asses &amp; avoid if possible), Gifts only if small/clinically appropriate</li>
<li>No sexual relationships</li>
<li>No social media contact</li>
<li>Address impaired colleagues directly and then report if unresolved</li>
</ul>`,
simple:`<p class="plain"><b>In plain words:</b> A <b>crossing</b> is a small step outside the usual role that can help the client. A <b>violation</b> harms or exploits them.</p>
<div class="tbl"><table><tr><th>Issue</th><th>Rule</th></tr>
<tr><td><b>Crossing vs violation</b></td><td>Crossing = minor, can be therapeutic (e.g., brief self-disclosure). Violation = harmful/exploitative.</td></tr>
<tr><td><b>Dual relationships</b></td><td>Assess them; avoid if possible.</td></tr>
<tr><td><b>Gifts</b></td><td>Only if small and clinically appropriate.</td></tr>
<tr><td><b>Never</b></td><td>Sexual relationships. Social media contact.</td></tr>
<tr><td><b>Impaired colleague</b></td><td>Talk to them <b>directly first</b>, then report if it isn't resolved.</td></tr></table></div>
<p class="tip"><b>Exam tip:</b> For an impaired colleague, the FIRST step is going to the colleague, not the board.</p>`},
{id:'doc', title:'Documentation & ethical decisions',
guide:`<p><b>Documentation</b></p>
<ul>
<li>Purpose: track progress &amp; fit of interventions, continuity of care, legal protection, communication with providers, meet requirements</li>
<li>Includes assessments, diagnosis, treatment plans, progress notes, risk, consent, discharge planning, releases, correspondence</li>
<li>Keep ~7 years (longer for minors; varies by state), Rights apply even after client death</li>
<li>Client access generally allowed (with limits, document and deny if it would cause harm to client)</li>
<li><b>Ethical decision-making:</b> Prioritize safety, Consult + document, Choose least harmful option</li>
<li>Law overrides ethics only when required</li>
</ul>`,
simple:`<p class="plain"><b>In plain words:</b> The record protects the client, protects you, and keeps care continuous.</p>
<div class="tbl"><table><tr><th>Question</th><th>Answer</th></tr>
<tr><td>What goes in it?</td><td>Everything clinical: assessments, diagnosis, treatment plans, progress notes, risk, consent, discharge planning, releases, correspondence.</td></tr>
<tr><td>How long to keep it?</td><td>About <b>7 years</b>; longer for minors (varies by state). Rights continue after the client dies.</td></tr>
<tr><td>Can clients see it?</td><td><b>Generally yes.</b> If a part would harm them: deny that part and <b>document why</b>.</td></tr>
<tr><td>Ethical dilemma?</td><td><b>Safety first</b>, then consult + document, then the least harmful option.</td></tr>
<tr><td>Law vs ethics?</td><td>Law overrides ethics <b>only when required</b>.</td></tr></table></div>
<p class="hook"><b>Memory hook:</b> Ethical dilemma = "Safe → Consult → Least harm."</p>`},
{id:'neg', title:'Negligence, malpractice & termination',
guide:`<p><b>Negligence vs malpractice:</b></p>
<ul>
<li><b>Negligence =</b> failure to meet standard of care</li>
<li><b>Malpractice =</b> negligence + harm + legal damages, common causes of claims: suicide, sexual misconduct, breach of confidentiality, improper treatment, abandonment</li>
<li><b>Duty of Care:</b> legal obligation to provide competent professional services</li>
</ul>
<p><b>Termination:</b> Must include planning, referral, continuity</p>
<ul><li>Abrupt termination = abandonment</li></ul>`,
simple:`<p class="plain"><b>In plain words:</b> Negligence is falling below the standard. It becomes malpractice when someone is <b>hurt</b> and there are <b>legal damages</b>.</p>
<div class="formula">Negligence + Harm + Legal damages = <b>Malpractice</b></div>
<ul>
<li><b>Duty of care:</b> your legal obligation to provide competent services.</li>
<li><b>Common malpractice claims:</b> suicide, sexual misconduct, breach of confidentiality, improper treatment, abandonment.</li>
<li><b>Termination</b> needs planning, referral and continuity. Ending <b>abruptly</b> = <b>abandonment</b>.</li>
</ul>`},
{id:'patterns', title:'Clinical exam patterns',
guide:`<p><b>Clinical Exam Patterns</b></p>
<ul>
<li>Elder confusion: rule out medical causes first</li>
<li>Child behavior issues: consider ecological and developmental factors</li>
<li>Unconditional positive regard: accepting and valuing clients without judgment or conditions.</li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>If the question shows…</th><th>Think…</th></tr>
<tr><td>An older adult who is suddenly confused</td><td>Rule out <b>medical</b> causes first</td></tr>
<tr><td>A child acting out</td><td>Look at the <b>environment</b> (ecological) and <b>developmental stage</b> before labeling</td></tr>
<tr><td>"Accepting without judgment"</td><td><b>Unconditional positive regard</b></td></tr></table></div>`}
]});

MODULES.push({
id:'think', n:'02', title:'How to Answer Questions – THINK', blurb:'Clinical sequencing: what to do FIRST',
intro:`<p><b>Clinical Sequencing</b></p>`,
topics:[
{id:'glance', title:'THINK at a glance: what do I do first?',
guide:`<ol class="think">
<li><b>T – Triage:</b> <b>Safety first</b> (risk to self/others, medical issues) <b>Assess lethality → stabilize → plan → follow-up</b></li>
<li><b>H – Hypothesize:</b> <b>ASSESS BEFORE ACTION!</b> Never assume. Consider medical, psychiatric, developmental, and environmental causes.</li>
<li><b>I – Integrate:</b> <b>Integrate all domains:</b> Bio-Psycho-Social-Spiritual Lens + cultural, spiritual dimensions</li>
<li><b>N – Navigate:</b> Choose the least invasive, most ethical, client-centered option, <b>evidence based interventions</b></li>
<li><b>K – Know your role:</b> Follow legal/ethical duties (mandated reporting, confidentiality limits, scope of practice).</li>
</ol>`,
simple:`<p class="plain"><b>In plain words:</b> Walk down this ladder. The <b>first rung that applies</b> is usually your answer.</p>
<ol class="ladder">
<li><b>Is anyone in danger?</b> Suicide, homicide, abuse, a medical issue → safety, stabilize, report.</li>
<li><b>Could it be medical?</b> → Rule out medical first (confused elder, new symptoms).</li>
<li><b>Do I actually know what's going on?</b> → Assess, ask, clarify, explore <b>before acting</b>.</li>
<li><b>Have I seen the whole person?</b> → Bio-psycho-social-spiritual + culture.</li>
<li><b>Which option?</b> → Least invasive, most ethical, client-centered, evidence-based.</li>
<li><b>Is this my job?</b> → Mandated reporting, confidentiality limits, scope. Refer if it's outside your scope.</li>
</ol>
<p class="tip"><b>Exam tip:</b> Wording like "research indicates", "studies show" or "uses clinical judgement" often marks the evidence-based choice (guide, N – Navigate).</p>
<p><b>Answers that are usually wrong</b> (FARM GRITS ROAD, in the Mnemonics section): focusing on the past, giving advice, recommending therapy "later", making a future appointment, handing out pamphlets, recommending your own therapy, informing parents, terminating, going to the supervisor, respecting self-determination when the client is psychotic, offering contracts, letting the client lead, doing nothing. Each has exceptions, which are listed in that section.</p>`},
{id:'risk', title:'T – Triage: safety, suicide & homicide risk',
guide:`<p><b>Safety first</b> (risk to self/others, medical issues) <b>Assess lethality → stabilize → plan → follow-up</b></p>
<p><b>Risk Assessment:</b> determine level of danger ct poses to self and others<br>
<b>Suicide Risk:</b> Prior attempts, plan/means, substance use, isolation, sudden ↑ energy after depression (<b>Protective Factors:</b> Support system, beliefs, family responsibility)</p>
<ul>
<li><b>Suicidal Ideation:</b> thoughts about suicide ranging form passive to active</li>
<li><b>Plan</b> (how) <b>vs Intent</b> (determination/desire to follow through)</li>
<li>DO NOT use safety contracts - outdated</li>
<li><b>Make Safety Plan:</b> warning signs, internal coping strategies, social contacts, professional resources, means restriction</li>
</ul>
<p><b>Homicide Risk:</b> Threats to identifiable person, access to weapons – Duty to warn</p>
<p><b>Crisis Intervention:</b> Ensure safety &amp; Stabilize before assessing → Plan &amp; follow-up can come after.</p>`,
simple:`<p class="plain"><b>In plain words:</b> If anyone could get hurt, that comes first, before feelings, history or anything else.</p>
<div class="formula">Assess lethality → Stabilize → Plan → Follow-up</div>
<div class="tbl"><table><tr><th>Suicide risk factors</th><th>Protective factors</th></tr>
<tr><td>Prior attempts · plan/means · substance use · isolation · <b>sudden ↑ energy after depression</b></td><td>Support system · beliefs · family responsibility</td></tr></table></div>
<ul>
<li><b>Plan</b> = how. <b>Intent</b> = how determined they are to act.</li>
<li><b>Safety plan</b>, 5 parts: warning signs → internal coping → social contacts → professional resources → means restriction.</li>
<li><b>Safety contracts: never.</b> They're outdated.</li>
<li><b>Homicide risk:</b> threat to an <b>identifiable person</b> + access to weapons → <b>duty to warn</b>.</li>
<li><b>Crisis:</b> make them safe and stable first. Full assessment and planning come after.</li>
</ul>
<p class="tip"><b>Exam tip:</b> A depressed client who suddenly has more energy is a <b>red flag</b>, not good news. Assess suicide risk.</p>
<p class="hook"><b>Memory hook (safety plan):</b> "<b>WISP-M</b>": Warning signs, Internal coping, Social contacts, Professional resources, Means restriction.</p>`},
{id:'abuse', title:'T – Triage: child & elder abuse',
guide:`<p><b>Clear Child Abuse – CPS</b></p>
<ul>
<li><b>Conduct child abuse assessment</b> when theres reasonable suspicion of abuse or neglect</li>
<li><b>Indicators of physical abuse:</b> unexplained injuries, patterns inconsistent with explanation, injuries at different healing stages</li>
<li><b>Behavioral indicators:</b> age inappropriate sexual knowledge/behavior, regression, nightmares, avoidance of specific people</li>
<li><b>Psychological Maltreatment of Children:</b> Patterns of caregiver behaviors that harm emotional development and sense of self worth</li>
<li><b>Signs of neglect in children:</b> poor hygiene, untreated medical issues, malnutrition, lack of supervision.</li>
</ul>
<p><b>Elder Abuse</b></p>
<ul>
<li><b>Signs of Elder abuse:</b> unexplained injuries, sudden financial changes, withdrawal, fear of caregiver</li>
<li>Financial exploiting elderly: illegal or improper use of elder funds, considered abuse</li>
</ul>`,
simple:`<p class="plain"><b>In plain words:</b> <b>Clear</b> abuse → report to CPS. <b>Reasonable suspicion</b> → do an abuse assessment. Either way: report, don't investigate.</p>
<div class="tbl"><table><tr><th>Type</th><th>What it looks like</th></tr>
<tr><td><b>Physical abuse</b></td><td>Unexplained injuries; story doesn't match the injury; injuries at <b>different stages of healing</b> (repeated harm)</td></tr>
<tr><td><b>Behavioral signs</b></td><td>Age-inappropriate sexual knowledge/behavior, regression, nightmares, avoiding specific people</td></tr>
<tr><td><b>Psychological maltreatment</b></td><td>A <b>pattern</b> of caregiver behavior that harms emotional development and self-worth</td></tr>
<tr><td><b>Neglect</b></td><td>Poor hygiene, untreated medical issues, malnutrition, lack of supervision</td></tr>
<tr><td><b>Elder abuse</b></td><td>Unexplained injuries, sudden financial changes, withdrawal, fear of caregiver</td></tr>
<tr><td><b>Elder financial exploitation</b></td><td>Illegal or improper use of an elder's funds. This <b>counts as abuse</b>.</td></tr></table></div>`},
{id:'hyp', title:'H – Hypothesize',
guide:`<p><b>ASSESS BEFORE ACTION!</b><br>Never assume. Consider medical, psychiatric, developmental, and environmental causes.<br>
<b>Medical conditions can mimic psychiatric symptoms</b><br>
<b>Examples from practice test: Assess before action!</b></p>
<ul>
<li>Empty bottles of alcohol during a house visit. → ask the client.</li>
<li>Ct refuses services because it's "God's Will" → explore use of religion.</li>
<li>Teacher tells SW that a child is coming to school with messy clothing &amp; occasional bruises → talk to student</li>
</ul>`,
simple:`<p class="plain"><b>In plain words:</b> Don't jump to conclusions. Unless someone is in danger, find out what's really happening <b>before</b> you act.</p>
<p>Possible causes to check: <b>Medical · Psychiatric · Developmental · Environmental</b>. Medical problems can look psychiatric.</p>
<div class="tbl"><table><tr><th>Situation (from the guide)</th><th>Right move</th><th>Tempting wrong move</th></tr>
<tr><td>Empty alcohol bottles on a home visit</td><td><b>Ask the client</b></td><td>Assume a drinking problem and refer</td></tr>
<tr><td>Client refuses services: "God's will"</td><td><b>Explore their use of religion</b></td><td>Argue, or close the case without exploring</td></tr>
<tr><td>Teacher reports messy clothes + occasional bruises</td><td><b>Talk to the student</b></td><td>Act before gathering any information</td></tr></table></div>`},
{id:'ink', title:'I, N, K – Integrate, Navigate, Know your role',
guide:`<h4>I – Integrate</h4>
<p><b>Integrate all domains:</b> Bio-Psycho-Social-Spiritual Lens + cultural, spiritual dimensions</p>
<h4>N – Navigate</h4>
<p>Choose the least invasive, most ethical, client-centered option, <b>evidence based interventions</b> ("research indicates" "studies show" "the social worker uses clinical judgement to..)</p>
<h4>K – Know your role</h4>
<p>Follow legal/ethical duties (mandated reporting, confidentiality limits, scope of practice).<br>
Do not treat alcohol or drug addiction unless you specialize</p>`,
simple:`<div class="tbl"><table><tr><th>Letter</th><th>Ask yourself</th><th>Pick the answer that…</th></tr>
<tr><td><b>I</b></td><td>Have I looked at the whole person?</td><td>Considers <b>bio, psycho, social, spiritual and cultural</b> factors</td></tr>
<tr><td><b>N</b></td><td>Which option is best?</td><td>Is <b>least invasive, most ethical, client-centered, evidence-based</b></td></tr>
<tr><td><b>K</b></td><td>Is this my job?</td><td>Follows mandated reporting, confidentiality limits and scope. <b>Refers</b> addiction treatment unless you specialize.</td></tr></table></div>`}
]});

MODULES.push({
id:'dev', n:'03', title:'Human Development', blurb:'Erikson, Piaget, Freud, attachment, defenses, Maslow',
topics:[
{id:'erik', title:"Erikson's 8 stages of psychosocial development",
guide:`<ol>
<li><b>Trust vs. Mistrust</b> (0–1, infancy)</li>
<li><b>Autonomy vs. Shame/Doubt</b> (1–3, toddler)</li>
<li><b>Initiative vs. Guilt</b> (3–6, preschool)</li>
<li><b>Industry vs. Inferiority</b> (6–12, school age)</li>
<li><b>Identity vs. Role Confusion</b> (12–18, adolescence)
<ol><li>limbic system &gt; prefrontal cortex</li><li>Synaptic proliferation and pruning</li><li>Key issues: sexuality, gender, substance use, suicide risk, technology use</li></ol></li>
<li><b>Intimacy vs. Isolation</b> (20s–40s)</li>
<li><b>Generativity vs. Stagnation</b> (40s–60s)</li>
<li><b>Ego Integrity vs. Despair</b> (60s+)</li>
</ol>`,
simple:`<p class="plain"><b>In plain words:</b> Each life stage has one main tension to work through. Exam questions usually give an <b>age</b>, and you match it to the stage.</p>
<div class="tbl"><table><tr><th>Age</th><th>Stage</th><th>Picture it</th></tr>
<tr><td>0–1</td><td><b>Trust</b> vs Mistrust</td><td>Baby learning whether needs get met</td></tr>
<tr><td>1–3</td><td><b>Autonomy</b> vs Shame/Doubt</td><td>Toddler: "Me do it!"</td></tr>
<tr><td>3–6</td><td><b>Initiative</b> vs Guilt</td><td>Preschooler starting games and plans</td></tr>
<tr><td>6–12</td><td><b>Industry</b> vs Inferiority</td><td>School kid building skills</td></tr>
<tr><td>12–18</td><td><b>Identity</b> vs Role Confusion</td><td>Teen asking "Who am I?"</td></tr>
<tr><td>20s–40s</td><td><b>Intimacy</b> vs Isolation</td><td>Adult seeking close relationships</td></tr>
<tr><td>40s–60s</td><td><b>Generativity</b> vs Stagnation</td><td>Midlife: giving back, mentoring</td></tr>
<tr><td>60s+</td><td><b>Ego Integrity</b> vs Despair</td><td>Looking back: peace or regret</td></tr></table></div>
<p><b>Adolescence notes:</b> the limbic system (emotion) outpaces the prefrontal cortex (control); the brain is growing and pruning connections. Key issues are sexuality, gender, substance use, suicide risk and technology use.</p>
<p class="hook"><b>Memory hook:</b> "<b>T</b>iny <b>A</b>nts <b>I</b>nvade <b>I</b>ce-cream <b>I</b>n <b>I</b>taly, <b>G</b>elato <b>E</b>verywhere" = Trust, Autonomy, Initiative, Industry, Identity, Intimacy, Generativity, Ego integrity.</p>`},
{id:'attach', title:'Mary Ainsworth attachment theory',
guide:`<ul>
<li>Secure: distressed when caregiver leaves, soothed on return</li>
<li>Anxious-ambivalent: clingy, distressed, angry on return</li>
<li>Avoidant: appears unaffected, physiologically stressed</li>
<li>Disorganized: inconsistent, fear-based behavior toward caregiver</li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Style</th><th>How the child reacts</th></tr>
<tr><td><b>Secure</b></td><td>Upset when caregiver leaves → <b>soothed</b> on return</td></tr>
<tr><td><b>Anxious-ambivalent</b></td><td>Clingy and distressed → <b>angry</b> on return</td></tr>
<tr><td><b>Avoidant</b></td><td><b>Looks</b> unaffected, but the body is stressed</td></tr>
<tr><td><b>Disorganized</b></td><td>Inconsistent, <b>fear-based</b> behavior toward the caregiver</td></tr></table></div>
<p class="hook"><b>Memory hook:</b> Avoidant = "acts fine, body isn't." Disorganized = "fear of the person who should comfort."</p>`},
{id:'play', title:'Play stages & developmental red flags',
guide:`<p><em>Likely don't need to know the specifics, but good to know general development to identify when child behavior warrants further testing.</em></p>
<ul>
<li>2-3: Parallel play</li>
<li>3-4: associative play, magical thinking, imaginary friends</li>
<li>4-5: cooperative play, theory of mind develops</li>
<li>5-6: rule-based games, fairness understanding</li>
</ul>
<p><b>Red Flags on the Exam Tests</b></p>
<ul>
<li>No babbling by 12 months, No single words by 16 months. No 2-word phrases by 24 months, No pretend play by 24 months, No interests in other children by 36 months</li>
<li>Loss of previously acquired skills at any age</li>
</ul>`,
simple:`<p class="plain"><b>In plain words:</b> You don't need to memorize play stages in detail. The <b>red flags</b> are what signal "this child needs further testing."</p>
<div class="tbl"><table><tr><th>By this age…</th><th>Red flag if there's no…</th></tr>
<tr><td>12 months</td><td>Babbling</td></tr>
<tr><td>16 months</td><td>Single words</td></tr>
<tr><td>24 months</td><td>2-word phrases or pretend play</td></tr>
<tr><td>36 months</td><td>Interest in other children</td></tr>
<tr><td><b>Any age</b></td><td>…and <b>losing skills</b> the child already had is always a red flag</td></tr></table></div>
<p><b>Play:</b> 2–3 side-by-side (parallel) → 3–4 associative, imaginary friends → 4–5 cooperative, theory of mind → 5–6 rule-based games, fairness.</p>`},
{id:'grief', title:'End of life: Kübler-Ross stages of grief',
guide:`<ul>
<li><b>Stages</b>: denial, anger, bargaining, depression, acceptance (nonlinear)</li>
<li><b>Supporting dying clients</b>: control, connection, meaning, forgiveness, legacy, symptom management</li>
<li>Waves of sadness, self esteem remains intatct, can have positive memories</li>
</ul>`,
simple:`<p class="plain"><b>In plain words:</b> Five stages, and people move back and forth between them. They're <b>not a straight line</b>.</p>
<div class="tbl"><table><tr><th>Stage</th><th>Sounds like</th></tr>
<tr><td><b>Denial</b></td><td>"This can't be happening."</td></tr>
<tr><td><b>Anger</b></td><td>"Why me? It's not fair!"</td></tr>
<tr><td><b>Bargaining</b></td><td>"If I do X, maybe I'll get more time."</td></tr>
<tr><td><b>Depression</b></td><td>"What's the point?"</td></tr>
<tr><td><b>Acceptance</b></td><td>"I'm ready for what's coming."</td></tr></table></div>
<ul><li><b>Supporting dying clients:</b> control, connection, meaning, forgiveness, legacy, symptom management.</li>
<li><b>Grief:</b> sadness comes in <b>waves</b>, <b>self-esteem stays intact</b>, positive memories are still possible.</li></ul>
<p class="hook"><b>Memory hook:</b> <b>DABDA</b>.</p>`},
{id:'piaget', title:"Piaget's cognitive development theory",
guide:`<ul>
<li>Sensorimotor (0–2): sensory learning, object permanence, intentional action</li>
<li>Preoperational (2–7): symbolic thinking, egocentrism, magical thinking</li>
<li>Concrete Operational (7–11): logical thinking about concrete events, conservation, **<b>take others perspectives</b>**</li>
<li>Formal Operational (12+): abstract and hypothetical thinking</li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Stage</th><th>Age</th><th>Clue words in a question</th></tr>
<tr><td><b>Sensorimotor</b></td><td>0–2</td><td>Object permanence, learning through senses</td></tr>
<tr><td><b>Preoperational</b></td><td>2–7</td><td>Egocentrism, magical thinking, symbols/pretend</td></tr>
<tr><td><b>Concrete operational</b></td><td>7–11</td><td>Conservation, logic about real things, <b>takes others' perspectives</b></td></tr>
<tr><td><b>Formal operational</b></td><td>12+</td><td>Abstract, "what if" (hypothetical) thinking</td></tr></table></div>
<p class="hook"><b>Memory hook:</b> "<b>S</b>illy <b>P</b>enguins <b>C</b>an't <b>F</b>ly" = Sensorimotor, Preoperational, Concrete, Formal.</p>`},
{id:'kohl', title:"Kohlberg's moral development",
guide:`<ul>
<li><b>Preconventional</b>: Elementary school level (&lt; 9) punishment/reward-based morality</li>
<li><b>Conventional</b>: Early Adolescence, social approval and law/order orientation, "good girl/bad girl"</li>
<li><b>Postconventional</b>: Teens &amp; adults, abstract ethics, social contract, universal principles (rare)</li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Level</th><th>"I do the right thing because…"</th></tr>
<tr><td><b>Preconventional</b> (&lt;9)</td><td>…I'll get punished or rewarded</td></tr>
<tr><td><b>Conventional</b> (early adolescence)</td><td>…people will approve, and it's the rule/law ("good girl/bad girl")</td></tr>
<tr><td><b>Postconventional</b> (teens &amp; adults, rare)</td><td>…of universal principles and the social contract</td></tr></table></div>
<p class="hook"><b>Memory hook:</b> <b>Pre</b> = Punishment · <b>Conventional</b> = Conform · <b>Post</b> = Principles.</p>`},
{id:'freud', title:"Freud's psychosexual development",
guide:`<ul>
<li>Conscious, Preconscious, Unconscious</li>
<li>Id (impulses), ego (the self, mediator), superego (higher morality)</li>
<li><b>Latent:</b> Alternate meaning, interpretation / <b>Manifest:</b> Literal subject matter</li>
</ul>
<div class="tbl"><table><tr><th>Stage/ Source of Pleasure</th><th>Age</th><th>Result of Fixation</th></tr>
<tr><td>Oral</td><td>0-1</td><td>Dependency</td></tr>
<tr><td>Anal</td><td>2 (toilet trained)</td><td>Control</td></tr>
<tr><td>Phallic</td><td>3-5</td><td>Identity: Guilt or anxiety about sex</td></tr>
<tr><td>Latent</td><td>5-Puberty</td><td>Socialization: Sexuality is dormant; No fixations at this stage</td></tr>
<tr><td>Genital</td><td>Puberty +</td><td>Intimacy: Sexual urges return; No fixations at this stage</td></tr></table></div>`,
simple:`<ul>
<li><b>Id</b> = "I want it now" (impulses). <b>Superego</b> = conscience (higher morality). <b>Ego</b> = the referee between them.</li>
<li><b>Manifest</b> = the literal content. <b>Latent</b> = the hidden meaning underneath.</li>
</ul>
<div class="tbl"><table><tr><th>Stage</th><th>Age</th><th>If stuck (fixation)</th></tr>
<tr><td>Oral</td><td>0–1</td><td><b>Dependency</b></td></tr>
<tr><td>Anal</td><td>~2 (toilet training)</td><td><b>Control</b></td></tr>
<tr><td>Phallic</td><td>3–5</td><td><b>Guilt/anxiety about sex</b></td></tr>
<tr><td>Latent</td><td>5–puberty</td><td>No fixation (sexuality dormant)</td></tr>
<tr><td>Genital</td><td>Puberty+</td><td>No fixation (urges return)</td></tr></table></div>
<p class="hook"><b>Memory hook:</b> "<b>O</b>ld <b>A</b>ge <b>P</b>ensioners <b>L</b>ove <b>G</b>randkids" = Oral, Anal, Phallic, Latent, Genital.</p>`},
{id:'neo', title:'Neo-Freudian approaches',
guide:`<p>Moves from sexual drives to broader motivations (social, unconscious, striving for meaning/perfection). <b>Examples:</b> ego psychology, Adler Individual psychology (Behavior driven by inferiority feelings, striving for superiority, and social belonging), self psychology (focus on unmet childhood needs, focus on empathy</p>
<ul>
<li><b>Psychoanalysis</b> is the original, intensive therapy developed by Sigmund Freud that focuses on uncovering unconscious conflicts through techniques like free association and dream analysis.</li>
<li><b>Psychodynamic</b> <b>therapy</b> is a modern, less intensive adaptation that still explores unconscious processes and early relationships but in a more flexible and time-limited format.</li>
</ul>`,
simple:`<p class="plain"><b>In plain words:</b> Neo-Freudians kept the unconscious but moved <b>beyond sex drives</b> to social needs and meaning.</p>
<div class="tbl"><table><tr><th>Approach</th><th>Focus</th></tr>
<tr><td><b>Adler</b> (Individual psychology)</td><td>Inferiority feelings, striving for superiority, social belonging</td></tr>
<tr><td><b>Self psychology</b></td><td>Unmet childhood needs, empathy</td></tr>
<tr><td><b>Ego psychology</b></td><td>Listed as an example (no detail in the guide)</td></tr></table></div>
<div class="tbl"><table><tr><th></th><th>Psychoanalysis</th><th>Psychodynamic therapy</th></tr>
<tr><td>What</td><td>Freud's original, <b>intensive</b> therapy</td><td>Modern, <b>less intensive</b> adaptation</td></tr>
<tr><td>How</td><td>Free association, dream analysis</td><td>Flexible, <b>time-limited</b></td></tr>
<tr><td>Shared</td><td colspan="2">Both explore the unconscious and early relationships</td></tr></table></div>`},
{id:'psychodyn', title:'Psychodynamic concepts',
guide:`<ul>
<li>Transference (T= to therapist): client's unconscious redirection of feelings from past relatiomshipo onto therapist</li>
<li>Countertransference (C= to client)</li>
<li>Resistance = clients unconscious defense against therapeutic change or exploring painful material</li>
<li>Interpretation = therapist offering meaning about unconscious patterns or conflicts</li>
<li>Working through</li>
<li>Free association</li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Term</th><th>Meaning</th></tr>
<tr><td><b>Transference</b></td><td>Client → therapist. Old feelings (e.g., toward a parent) land on you.</td></tr>
<tr><td><b>Countertransference</b></td><td>Therapist → client. <b>Your</b> feelings toward the client. Take it to supervision.</td></tr>
<tr><td><b>Resistance</b></td><td>The client's <b>unconscious</b> pushback against change or painful material</td></tr>
<tr><td><b>Interpretation</b></td><td>Therapist offers meaning about unconscious patterns</td></tr>
<tr><td><b>Working through</b> <span class="ext">not defined in guide</span></td><td>Going over an insight repeatedly until the change sticks</td></tr>
<tr><td><b>Free association</b> <span class="ext">not defined in guide</span></td><td>Client says whatever comes to mind, without filtering</td></tr></table></div>
<p class="hook"><b>Memory hook (from the guide):</b> <b>T</b>ransference = <b>T</b>o therapist · <b>C</b>ountertransference = to <b>C</b>lient.</p>`},
{id:'defense', title:'Defense mechanisms',
guide:`<p><b>A big part of psychodynamic therapy (exploring how unconscious patterns and past experiences influence present functioning)</b></p>
<ul>
<li>Projection: put feelings on others</li>
<li>Displacement: redirect emotion to safer target</li>
<li>Sublimation: healthy outlet</li>
<li>Reaction formation: act opposite</li>
<li>Intellectualization: avoid emotion with logic</li>
<li>Splitting (BPD): all good/all bad</li>
<li>Denial / repression / dissociation</li>
<li>Other Examples:
<ul><li>Regression</li><li>Rationalization</li><li>Undoing</li><li>Identification</li><li>Introjection</li><li>Compensation</li><li>Isolation of affect</li><li>Suppression (voluntary)</li></ul></li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Mechanism</th><th>What it looks like</th></tr>
<tr><td><b>Projection</b></td><td>Putting your feelings on others: "I'm not angry, <i>you</i> are."</td></tr>
<tr><td><b>Displacement</b></td><td>Mad at the boss, yells at the dog (a safer target)</td></tr>
<tr><td><b>Sublimation</b></td><td>Urges channeled into a <b>healthy</b> outlet (aggression → sport)</td></tr>
<tr><td><b>Reaction formation</b></td><td>Acting the <b>opposite</b> of what you feel (too sweet to someone you dislike)</td></tr>
<tr><td><b>Intellectualization</b></td><td>Facts and logic to avoid feeling</td></tr>
<tr><td><b>Splitting</b> (BPD)</td><td>People are all good or all bad</td></tr></table></div>
<p><b>The rest</b>: the guide lists these by name only, so the short definitions below are added.</p>
<div class="tbl"><table><tr><th>Mechanism <span class="ext">definitions added</span></th><th>Meaning</th></tr>
<tr><td>Denial</td><td>Refusing to accept reality</td></tr>
<tr><td>Repression</td><td><b>Unconsciously</b> blocking painful thoughts/impulses</td></tr>
<tr><td>Dissociation</td><td>Disconnection from thoughts (the guide's trauma section definition)</td></tr>
<tr><td>Regression</td><td>Going back to behavior from an earlier developmental stage</td></tr>
<tr><td>Rationalization</td><td>Justifying behavior with a logical-sounding explanation</td></tr>
<tr><td>Undoing</td><td>Trying to "cancel out" an unacceptable act or thought with an opposite act</td></tr>
<tr><td>Identification / Introjection</td><td>Taking on another person's behaviors, traits or values as your own</td></tr>
<tr><td>Compensation</td><td>Overachieving in one area to make up for a weakness in another</td></tr>
<tr><td>Isolation of affect</td><td>Separating the feeling from the thought or memory</td></tr>
<tr><td>Suppression</td><td>Pushing a thought away <b>on purpose</b>. It's the one the guide marks as <b>voluntary</b>.</td></tr></table></div>`},
{id:'mahler', title:'Margaret Mahler object relations theory',
guide:`<ul>
<li><b>Separation-individuation</b>: developing self while maintaining attachment</li>
<li><b>Key phases:</b>
<ul><li><b>Differentiation</b>: self vs caregiver</li>
<li><b>Practicing</b>: exploration and independence</li>
<li><b>Rapprochement</b> (15–24 months): independence + need for reassurance</li>
<li><b>Object constancy:</b> caregiver remains secure when absent</li></ul></li>
<li><b>Stranger anxiety:</b> 6–12 months</li>
<li><b>Separation anxiety:</b> 8–12 months</li>
</ul>`,
simple:`<p class="plain"><b>In plain words:</b> The baby slowly becomes their own person while staying attached (separation-individuation).</p>
<div class="tbl"><table><tr><th>Phase (in order)</th><th>What's happening</th></tr>
<tr><td><b>Differentiation</b></td><td>"I'm separate from my caregiver"</td></tr>
<tr><td><b>Practicing</b></td><td>Exploring and trying independence</td></tr>
<tr><td><b>Rapprochement</b> (15–24 mo)</td><td>Wants independence, but <b>runs back for reassurance</b></td></tr>
<tr><td><b>Object constancy</b></td><td>Knows the caregiver is still there when out of sight</td></tr></table></div>
<p><b>Stranger anxiety</b> 6–12 months · <b>Separation anxiety</b> 8–12 months</p>
<p class="hook"><b>Memory hook:</b> "<b>D</b>o <b>P</b>uppies <b>R</b>un <b>O</b>ff?" = Differentiation, Practicing, Rapprochement, Object constancy.</p>`},
{id:'parent', title:'Parenting styles',
guide:`<div class="tbl"><table><tr><th></th><th>Undemanding, Dismissive</th><th>High Expectations, Firm</th></tr>
<tr><td><b>Warm, Supportive, Loving</b></td><td><b>Permissive</b> "I'm not your mom, I'm your friend!" High warmth, low structure; indulgent, few rules; impulsive, poor boundaries</td><td><b>Authoritative (best)</b> High warmth, high structure; supportive with clear rules; best outcomes (independent, confident)</td></tr>
<tr><td><b>Cold, Unsupportive</b></td><td><b>Uninvolved (Neglectful)</b> Low warmth, low structure; minimal engagement, attachment and self-regulation problems</td><td><b>Authoritarian</b> Low warmth, high control; strict and rule-focused; anxious, less independent children</td></tr></table></div>`,
simple:`<div class="tbl"><table><tr><th>Style</th><th>Warmth</th><th>Structure</th><th>Kids tend to be…</th></tr>
<tr><td><b>Authoritative</b> (best)</td><td>High</td><td>High</td><td>Independent, confident</td></tr>
<tr><td><b>Permissive</b></td><td>High</td><td>Low</td><td>Impulsive, poor boundaries</td></tr>
<tr><td><b>Authoritarian</b></td><td>Low</td><td>High</td><td>Anxious, less independent</td></tr>
<tr><td><b>Uninvolved</b></td><td>Low</td><td>Low</td><td>Attachment and self-regulation problems</td></tr></table></div>
<p class="hook"><b>Memory hook:</b> Authorita<b>tive</b> = posi<b>tive</b> (the best one). Authorita<b>rian</b> = <b>ri</b>gid.</p>`},
{id:'maslow', title:"Maslow's hierarchy of needs",
guide:`<ol>
<li>Physiological Needs- Food, water, shelter, sleep</li>
<li>Safety Needs- Protection from elements/danger</li>
<li>Social Needs- Love &amp; Belongingness; friendship, intimacy, affection)</li>
<li>Esteem Needs- Self-respect &amp; respect from others</li>
<li>Self-Actualization- Realizing personal potential</li>
<li>Self Transcendence</li>
</ol>`,
simple:`<p class="plain"><b>In plain words:</b> Build from the bottom up. Basic needs come before growth work.</p>
<ol class="pyramid"><li><b>Physiological</b>: food, water, shelter, sleep</li><li><b>Safety</b>: protection from elements and danger</li><li><b>Social</b>: love and belonging</li><li><b>Esteem</b>: self-respect and respect from others</li><li><b>Self-actualization</b>: reaching your potential</li><li><b>Self-transcendence</b></li></ol>
<p class="tip"><b>Exam tip:</b> The guide's mnemonics say to identify the hierarchy of needs and deal with safety first. Exploratory or insight therapy doesn't come first when there's a physical or safety need.</p>`}
]});

MODULES.push({
id:'beh', n:'04', title:'Behavioral Theory', blurb:'Conditioning, CBT, DBT, cognitive distortions',
topics:[
{id:'learn', title:'Learning theory',
guide:`<ul>
<li><b>Classical conditioning (Pavlov):</b> stimulus → involuntary response</li>
<li><b>Operant conditioning (Skinner):</b> behavior shaped by consequences
<ul><li>Reinforcement ↑ behavior / Punishment ↓ behavior</li><li>Positive = add / Negative = remove (NOT "bad")</li></ul></li>
<li><b>Extinction</b> = behavior stops due to removal of reinforcement</li>
<li><b>Shaping</b> = reinforce steps toward target behavior</li>
<li><b>Bandura</b> = observational learning</li>
</ul>`,
simple:`<p class="plain"><b>In plain words:</b> <b>Classical</b> = an automatic reaction gets linked to a signal. <b>Operant</b> = consequences change how often we do something.</p>
<div class="tbl"><table><tr><th></th><th>Add something (+)</th><th>Remove something (−)</th></tr>
<tr><td><b>Behavior goes UP</b> (reinforcement)</td><td><b>Positive reinforcement</b><br>Sticker for finishing homework</td><td><b>Negative reinforcement</b><br>Good grades → extra study hall dropped</td></tr>
<tr><td><b>Behavior goes DOWN</b> (punishment)</td><td><b>Positive punishment</b><br>Extra chores for swearing</td><td><b>Negative punishment</b><br>Phone taken for missing curfew</td></tr></table></div>
<ul><li><b>Extinction:</b> the reinforcement stops, so the behavior stops (ignoring tantrums that used to get attention).</li>
<li><b>Shaping:</b> reward each small step toward the goal.</li>
<li><b>Bandura:</b> we learn by <b>watching</b> others.</li></ul>
<p class="tip"><b>Exam tip:</b> Negative ≠ bad. <b>Negative = subtract.</b> First ask "did the behavior go up or down?", then ask "was something added or removed?"</p>`},
{id:'cbt', title:'Key techniques in behavioral therapy + CBT',
guide:`<p><b>Systematic desensitization</b> = relaxation + anxiety hierarchy<br><b>In vivo desensitization</b> = real-life exposure</p>
<p><b>Cognitive Behavioral Therpay (CBT): change thoughts + behaviors</b> (most effective for depression, anxiety DO, PTSD, OCD, and eating disorders)</p>
<ul>
<li><b>Structure:</b> agenda setting, HW review, working on skills, assigning new HW</li>
<li><b>Cognitive restructuring</b> = identifying and challenging distorted thoughts to change feelings and behaviors</li>
<li><b>Partializing</b> = break problems into parts</li>
<li><b>Psychoeducation</b> = teach client skills/info</li>
<li><b>Behavioral Activation:</b> Increase engagement in rewarding activities to improve mood</li>
<li><b>Systemic Desensitization:</b> pairing relaxation with gradual exposure to anxiety provoking stimuli</li>
<li><b>Rational Emotive Behavior Therapy (REBT)</b> = challenge irrational beliefs</li>
</ul>`,
simple:`<p class="plain"><b>In plain words:</b> CBT changes <b>thoughts + behaviors</b> to change feelings. It's structured, like a class with homework.</p>
<p><b>Best for:</b> depression, anxiety disorders, PTSD, OCD, eating disorders.<br><b>Session flow:</b> agenda → review homework → practice skills → new homework.</p>
<div class="tbl"><table><tr><th>Technique</th><th>What you do</th></tr>
<tr><td><b>Cognitive restructuring</b></td><td>Spot distorted thoughts and challenge them</td></tr>
<tr><td><b>Partializing</b></td><td>Break an overwhelming problem into parts</td></tr>
<tr><td><b>Psychoeducation</b></td><td>Teach skills and information</td></tr>
<tr><td><b>Behavioral activation</b></td><td>Schedule rewarding activities to lift mood</td></tr>
<tr><td><b>Systematic desensitization</b></td><td>Relaxation + step-by-step exposure up an anxiety hierarchy</td></tr>
<tr><td><b>In vivo desensitization</b></td><td>Exposure in real life</td></tr>
<tr><td><b>REBT</b></td><td>Challenge irrational beliefs</td></tr></table></div>`},
{id:'dbt', title:'Dialectical Behavioral Therapy (DBT)',
guide:`<p><b>Dialectical Behavioral Therapy (DBT):</b> comprehensive treatment combining CBT with mindfulness for emotional dysregulation, initially created for cts with DBT</p>
<ul>
<li><b>Dialetics:</b> balancing opposites, acceptance and change</li>
<li><b>Radical Acceptance:</b> fully accepting realit as it is without fighting it</li>
</ul>
<ol>
<li>Mindfulness = non jiudgemental awareness of present moment</li>
<li>Distress tolerance = getting through crisis without making it worse i.e. TIPP</li>
<li>Emotion regulation</li>
<li>Interpersonal Effectiveness = skills for asking for what you need while maintaining relationships and self respect</li>
</ol>`,
simple:`<p class="plain"><b>In plain words:</b> DBT = <b>CBT + mindfulness</b>, for people who struggle with intense emotions (emotional dysregulation).</p>
<ul><li><b>Dialectics:</b> hold two opposites at once: <b>acceptance AND change</b>.</li>
<li><b>Radical acceptance:</b> accept reality as it is and stop fighting it.</li></ul>
<div class="tbl"><table><tr><th>4 skill modules</th><th>What it's for</th></tr>
<tr><td><b>Mindfulness</b></td><td>Non-judgmental awareness of the present</td></tr>
<tr><td><b>Distress tolerance</b></td><td>Get through a crisis without making it worse (e.g., TIPP)</td></tr>
<tr><td><b>Emotion regulation</b></td><td>Managing emotions</td></tr>
<tr><td><b>Interpersonal effectiveness</b></td><td>Ask for what you need while keeping the relationship and your self-respect</td></tr></table></div>
<p class="hook"><b>Memory hook:</b> "<b>M</b>y <b>D</b>istress <b>E</b>ases <b>I</b>nstantly" = Mindfulness, Distress tolerance, Emotion regulation, Interpersonal effectiveness.</p>`},
{id:'dist', title:'Cognitive distortions',
guide:`<ul>
<li>Catastrophizing</li><li>Black-and-white thinking</li><li>Personalization</li><li>Overgeneralization</li><li>Mind reading</li><li>Emotional reasoning</li><li>Should statements</li>
</ul>`,
simple:`<p class="plain"><b>In plain words:</b> Thinking traps. On the exam, you'll usually be given a quote and asked to name the trap.</p>
<div class="tbl"><table><tr><th>Distortion</th><th>Sounds like</th></tr>
<tr><td><b>Catastrophizing</b></td><td>"One mistake and I'll lose everything."</td></tr>
<tr><td><b>Black-and-white</b></td><td>"If it's not perfect, it's a failure."</td></tr>
<tr><td><b>Personalization</b></td><td>"My son failed because I'm a bad parent."</td></tr>
<tr><td><b>Overgeneralization</b></td><td>"I failed once, so I always fail."</td></tr>
<tr><td><b>Mind reading</b></td><td>"She didn't text back, so she must hate me."</td></tr>
<tr><td><b>Emotional reasoning</b></td><td>"I <i>feel</i> stupid, so I <i>am</i> stupid."</td></tr>
<tr><td><b>Should statements</b></td><td>"I should never make mistakes."</td></tr></table></div>`}
]});

MODULES.push({
id:'trauma', n:'05', title:'Trauma & Resilience', blurb:'Crisis theory, trauma types, treatment, polyvagal',
topics:[
{id:'crisis', title:'Crisis theory',
guide:`<ul>
<li><b>Stages:</b> Precipitating event, Increased tension, Failed coping Crisis</li>
<li><b>Goal:</b> Restore previous level of functioning.</li>
<li>Three types of Crisis: maturational (developmental), situational (unexpected events), existential (internal conflicts)</li>
</ul>`,
simple:`<div class="formula">Precipitating event → Increased tension → Failed coping → Crisis</div>
<p><b>Goal:</b> get the person back to how they were functioning <b>before</b>. The aim isn't insight or personality change.</p>
<div class="tbl"><table><tr><th>Type</th><th>Source</th><th>Example</th></tr>
<tr><td><b>Maturational</b> (developmental)</td><td>A life-stage transition</td><td>Puberty, retirement</td></tr>
<tr><td><b>Situational</b></td><td>An unexpected event</td><td>Sudden layoff, house fire</td></tr>
<tr><td><b>Existential</b></td><td>Internal conflict</td><td>"What's the point of my life?"</td></tr></table></div>`},
{id:'types', title:'Types of trauma & definitions',
guide:`<ul>
<li><b>Primary Trauma</b></li>
<li><b>Secondary Trauma:</b> trauma sx from indirect exposure to others' trauma aka <b>vicarious trauma</b></li>
<li><b>Big T</b> (life threatening events) <b>vs little t trauma</b> (distressing experiences that affect functioning)</li>
<li><b>Intergenerational Trauma:</b> trauma effects passed down through generations via parenting and social patterns</li>
<li><b>Historical Trauma:</b> cumulative emotional and psychological wounding across generations from traumatic experiences.</li>
<li><b>Developmental Trauma:</b> trauma occurring during critical developmental periods affecting brain development</li>
<li><b>Betrayal Trauma:</b> trauma perpetrated by someone the victim depends on for survival or well being</li>
<li><b>Sanctuary Trauma:</b> re-traumatization within systems meant to help i.e. hospitals, shelters, therapy</li>
<li><b>Acute Trauma</b> (single incident) vs <b>chronic trauma</b> (repeated exposure over time)</li>
<li><b>Post traumatic growth:</b> positive psychological change resulting from struggle with highly challenging circumstances</li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Term</th><th>Key idea</th></tr>
<tr><td><b>Primary</b> <span class="ext">not defined in guide</span></td><td>You experienced it directly</td></tr>
<tr><td><b>Secondary / vicarious</b></td><td>Symptoms from hearing about or being exposed to <b>others'</b> trauma (common in social workers)</td></tr>
<tr><td><b>Big T vs little t</b></td><td>Life-threatening vs distressing-but-disruptive</td></tr>
<tr><td><b>Intergenerational</b></td><td>Passed down through <b>parenting and social patterns</b></td></tr>
<tr><td><b>Historical</b></td><td>Cumulative wounding <b>across generations</b></td></tr>
<tr><td><b>Developmental</b></td><td>Happens in critical periods and affects brain development</td></tr>
<tr><td><b>Betrayal</b></td><td>Caused by someone you <b>depend on</b></td></tr>
<tr><td><b>Sanctuary</b></td><td>Re-traumatized by a system meant to <b>help</b> (hospital, shelter, therapy)</td></tr>
<tr><td><b>Acute vs chronic</b></td><td>One incident vs repeated over time</td></tr>
<tr><td><b>Post-traumatic growth</b></td><td>Positive change that comes from the struggle</td></tr></table></div>
<p class="hook"><b>Memory hook:</b> <b>Sanctuary</b> trauma = hurt in the "sanctuary" (the place meant to keep you safe).</p>`},
{id:'resp', title:'Trauma responses',
guide:`<ul>
<li><b>4 F responses to trauma:</b> Fight, flight, freeze, fawn</li>
<li><b>Dissociation:</b> disconnection from thoughts</li>
<li><b>Trauma bonding:</b> strong emotional attachment to abuser developed through intermittent reinforcement</li>
<li><b>Trauma reenactment:</b> unconsciously recreating aspects of traumatic experience in current relationships and/or situations</li>
</ul>`,
simple:`<ul>
<li><b>4 Fs:</b> Fight · Flight · Freeze · Fawn (<span class="ext">not defined in guide</span> fawn = appeasing or pleasing the threat).</li>
<li><b>Dissociation:</b> disconnecting from your thoughts.</li>
<li><b>Trauma bonding:</b> a strong attachment to the abuser because abuse and kindness alternate unpredictably (intermittent reinforcement).</li>
<li><b>Reenactment:</b> unconsciously recreating the trauma in current relationships or situations.</li>
</ul>`},
{id:'treat', title:'Trauma treatment & polyvagal theory',
guide:`<p><b>When should trauma processing begin?</b> After the <b>stabilization phase of trauma treatment</b> where ct has adequate coping skills and emotional regulation abilities. (<b>THINK!</b>)</p>
<ul>
<li><b>Core of trauma informed care:</b> safety, trustworthiness and choice</li>
<li><b>Titration</b>: processing trauma in small manageable doses rather than overwhelming amounts.</li>
<li><b>Pendulation:</b> moving between activation and calm states during trauma processing</li>
<li><b>Imaginal Exposure:</b> verbally recounting traumatic memory repeatedly to process and reduce distress</li>
<li><b>Dual Awareness:</b> maintaining awareness of both past trauma and present safety simultaneously</li>
<li><b>In vivo exposure:</b> gradual confrontation with safe situation avoided dur to trauma, confronts feared situations in real life.</li>
</ul>
<p><b>Polyvagal Theory:</b> 3 state model of nervous system: ventral vagal (safe), sympathetic (fight/flight), dorsal vagal (shutdown)</p>
<ul>
<li><b>Hyperarousal</b>: state of increased psychological and physiological tension</li>
<li><b>Hypoarousal</b>: a nervous system "shutdown" response that occurs when the body becomes overwhelmed by stress or trauma</li>
<li><b>Window of Tolerance:</b> range of emotional arousal where person can function effectively (doesn't have to be calm)</li>
</ul>`,
simple:`<div class="formula"><b>Stabilize first</b> (coping + emotion regulation) → <b>then</b> process the trauma</div>
<p><b>Trauma-informed care core:</b> Safety · Trustworthiness · Choice</p>
<div class="tbl"><table><tr><th>Technique</th><th>Plain meaning</th></tr>
<tr><td><b>Titration</b></td><td>Tiny, manageable doses</td></tr>
<tr><td><b>Pendulation</b></td><td>Swing like a pendulum between activation and calm</td></tr>
<tr><td><b>Imaginal exposure</b></td><td>Retell the memory repeatedly until distress drops</td></tr>
<tr><td><b>Dual awareness</b></td><td>"That happened then; I'm safe now," both at once</td></tr>
<tr><td><b>In vivo exposure</b></td><td>Gradually face <b>safe</b> real-life situations you've been avoiding</td></tr></table></div>
<div class="tbl"><table><tr><th>Polyvagal state</th><th>Feels like</th></tr>
<tr><td><b>Ventral vagal</b></td><td>Safe</td></tr>
<tr><td><b>Sympathetic</b></td><td>Fight/flight (hyperarousal: more tension)</td></tr>
<tr><td><b>Dorsal vagal</b></td><td>Shutdown (hypoarousal)</td></tr></table></div>
<p><b>Window of tolerance:</b> the zone where you can still function. It <b>doesn't have to be calm</b>.</p>
<p class="tip"><b>Exam tip:</b> If a client wants to dive into trauma details but has few coping skills, the answer is <b>stabilization first</b>.</p>`},
{id:'interv', title:'Trauma interventions',
guide:`<ul>
<li><b>EMDR</b>: trauma therapy</li>
<li><b>Somatic Experiencing:</b> trauma therapy, focused on physical sensations &amp; releasing stored trauma energy</li>
<li><b>Prolonged Exposure Therapy:</b> CBT based, 8-15 weekly 90 minute sessions, gradually confront trauma, for PTSD, relies on intensive trauma memory processing.</li>
<li><b>TF-CBT:</b> gradual exposure</li>
<li><b>Cognitive Processing Therapy (CPT):</b> helping ct evaluate and change unhelpful beliefs about trauma
<ul><li>Stuck points: beliefs preventing recovery from trauma</li></ul></li>
</ul>`,
simple:`<div class="tbl"><table><tr><th>Therapy</th><th>Core idea</th></tr>
<tr><td><b>EMDR</b></td><td>A trauma therapy (no further detail in the guide)</td></tr>
<tr><td><b>Somatic Experiencing</b></td><td><b>Body</b> sensations; releasing stored trauma energy</td></tr>
<tr><td><b>Prolonged Exposure (PE)</b></td><td>CBT-based, for PTSD. <b>8–15 weekly 90-min sessions</b>. Intensive memory processing.</td></tr>
<tr><td><b>TF-CBT</b></td><td>Gradual exposure</td></tr>
<tr><td><b>CPT</b></td><td>Change unhelpful <b>beliefs</b> about the trauma; targets <b>stuck points</b></td></tr></table></div>
<p class="hook"><b>Memory hook:</b> <b>CPT</b> = Change Problem Thoughts (stuck points). <b>Somatic</b> = soma = body.</p>`}
]});

MODULES.push({
id:'interv', n:'06', title:'Theories Behind Interventions', blurb:'Stages of change, communication, SFBT, MI',
topics:[
{id:'stages', title:'Helping process & stages of change',
guide:`<p><b>Engagement → Assessment → Planning → Intervention → Evaluation → Termination</b></p>
<p><b>Stages of Change</b></p>
<p>Used a lot in readiness for alcohol abuse treatment.</p>
<ul>
