  {
    name: "Special Populations",
    chapters: [
      {
        name: "Chapter 44 — Pediatrics",
        sections: [
          { text: "Pediatric Anatomy and Physiology Differences — airway, chest compliance, metabolism", verdict: "keep", justification: "Pediatric anatomic differences underpin every pediatric clinical decision. EMALB pediatric practical scenarios require age-appropriate equipment selection, vital sign interpretation, and technique modification.|||TAKEAWAY|||Key pediatric differences: larger occiput (flexes airway in supine — use neutral position), funneled airway at cricoid (not glottis), compliant chest (ribs cartilaginous — you see retractions more easily; pulmonary contusions common with no rib fracture), large head:body ratio (heat loss), faster metabolic rate (hypoglycemia risk). Vital signs decrease with age — know normals by age group.|||FIELD|||The pediatric airway looks and works differently. OPA sizing, NPA sizing, BVM mask sizing, and ET tube sizing (if ACP) all change with age and weight. Use Broselow tape as your guide — it color-codes everything. A pediatric patient deteriorates faster than an adult — compensatory mechanisms fail more abruptly. Act early." },
          { text: "Pediatric Assessment Triangle — appearance, work of breathing, circulation", verdict: "keep", justification: "The Pediatric Assessment Triangle (PAT) is the gold-standard rapid assessment tool for pediatric patients. EMALB pediatric scenarios grade its systematic application from the doorway.|||TAKEAWAY|||PAT — from the doorway before touching: Appearance (TICLS: tone, interactivity, consolability, look/gaze, speech/cry — abnormal in any = sick), Work of Breathing (retractions, nasal flaring, head bobbing, grunting, abnormal position), Circulation to Skin (pallor, mottling, cyanosis). Any two limbs = critical. One limb = serious. No limbs = stable. Guides your urgency and sequence of assessment.|||FIELD|||The PAT takes 15–30 seconds before you touch the child. A limp, unresponsive toddler with subcostal retractions and mottled skin fails all three limbs of the PAT = critical. Immediate hands-on assessment. The child running toward you, crying loudly, with pink skin fails no limbs = the crying child may be annoying but is not immediately life-threatening." },
          { text: "Pediatric Airway Emergencies — croup, epiglottitis, bronchiolitis, foreign body", verdict: "keep", justification: "Pediatric airway emergencies are tested in EMALB pediatric scenario stations. Croup vs epiglottitis differentiation, bronchiolitis management, and pediatric asthma are high-yield exam content.|||TAKEAWAY|||Croup (6mo–3yr, viral): barking cough, stridor, hoarse voice, low fever — cool mist/air, racemic epi (ACP) for severe. Epiglottitis (any age, bacterial): toxic appearance, tripod, drooling, muffled voice, high fever, no cough — do not examine throat, calm environment, O2. Bronchiolitis (RSV, <2yr): wheezing + crackles + fever after URI — support O2, suction, hydration. Asthma (>2yr): wheeze + reversible, β2 agonists.|||FIELD|||Stridor + toxic-appearing child not coughing = epiglottitis = hands-off approach. Barking cough + mildly unwell child = croup = calm, cool air, position of comfort. This differentiation determines your entire management approach. Examining the throat of an epiglottitis patient to 'confirm' it can trigger complete laryngospasm — don't do it." },
          { text: "Pediatric Medical Emergencies — seizures, meningitis, diabetic ketoacidosis", verdict: "keep", justification: "Pediatric medical emergencies are common and tested in EMALB scenario exams. Febrile seizure vs complex seizure, meningococcal meningitis recognition, and pediatric DKA are key topics.|||TAKEAWAY|||Febrile seizure: age 6mo–5yr, generalized tonic-clonic, <15 min, single episode, rapid recovery — low risk of recurrence, no epilepsy development. Complex febrile seizure: prolonged (>15 min), focal, or recurrent in 24h — treat as status epilepticus. Meningococcal meningitis: petechial/purpuric rash + fever + stiff neck = septic emergency + droplet. Pediatric DKA: hyperglycemia + Kussmaul breathing + altered LOC — cautious fluid resuscitation (cerebral edema risk with rapid rehydration).|||FIELD|||The febrile child with first-time seizure that resolved: transport for evaluation even if back to baseline. Meningococcal meningitis can initially look identical to a viral illness. The non-blanching petechial rash changes everything — Priority 1, droplet precautions, pre-alert for septic child. Meningococcemia has a mortality of 10–15% even with treatment." },
          { text: "Pediatric Trauma — child abuse suspicion indicators, non-accidental trauma (NAT)", verdict: "keep", justification: "Non-accidental trauma (child abuse) recognition and mandatory reporting are directly tested in EMALB jurisprudence. BCEHS CPG Safeguarding Children specifies reporting obligations.|||TAKEAWAY|||Non-accidental trauma (NAT) indicators: injury inconsistent with developmental stage (bruising in non-mobile infant), injury pattern inconsistent with reported mechanism, multiple injuries in different stages of healing, delay in seeking care, changing history between caregivers, suspicious injuries (bilateral retinal hemorrhages = shaken baby, posterior rib fractures, metaphyseal fractures).|||FIELD|||You are a mandatory reporter. Any reasonable suspicion of child abuse = report to MCFD (1-800-663-9122). You do not need proof. Document the mechanism given, the child's developmental stage, the injuries found, caregiver behavior, and any discrepancies between the reported mechanism and the injury pattern. Your documentation is the evidence. Transport the child safely — do not accuse caregivers at scene." },
          { text: "Pediatric Cardiac Arrest — BLS algorithm, pediatric AED pads, compression depth", verdict: "keep", justification: "Pediatric CPR differences (compression depth, rate, ventilation ratio, AED pad size) are tested on EMALB practical exams. Pediatric cardiac arrest is often respiratory in origin (vs cardiac in adults) — ventilation is more important.|||TAKEAWAY|||Pediatric BLS: compression depth 1/3 AP chest (approximately 4cm infant, 5cm child). Rate: 100–120/min. Ratio: 30:2 (one rescuer), 15:2 (two-rescuer healthcare provider CPR). Infant: two-finger technique (one rescuer) or two-thumb encircling technique (two rescuers). Pediatric AED pads (or pediatric attenuator) for <8 years/25 kg — adult pads if pediatric unavailable. Ventilation critical: pediatric arrest often from respiratory failure.|||FIELD|||Pediatric cardiac arrest: give 5 initial rescue breaths before starting compressions (unlike adult). Most pediatric arrests are respiratory — effective oxygenation/ventilation is the most important intervention. An apneic child's arrest may be reversed by rescue breaths alone (before defibrillation is ever needed). Prioritize ventilation quality over compression rate." },
          { text: "Weight Estimation and Dosing — Broselow tape, weight-based drug calculation", verdict: "keep", justification: "Weight-based drug dosing is mandatory for every pediatric drug administration. EMALB pediatric scenarios grade correct use of Broselow tape and accurate dose calculation. Errors cause harm.|||TAKEAWAY|||Broselow tape: measure heel-to-crown length → color zone → estimated weight + equipment sizes + drug doses. Alternative weight estimation: (age × 2) + 8 = approximate weight in kg (for 1–10 years). Key doses: epinephrine 0.01 mg/kg IM (max 0.3mg), naloxone 0.01 mg/kg IV/IM/IN, D10W 0.5 g/kg IV (5 mL/kg), salbutamol 2.5 mg (<25kg) or 5 mg (>25kg) nebulized.|||FIELD|||Broselow tape is your most important pediatric tool. Use it on every pediatric patient regardless of how confident you feel about the weight. Parents consistently overestimate their child's weight, and overdose errors in pediatric patients are disproportionately common. Take the 30 seconds to use the tape — it tells you everything: tube size, drug doses, IV fluid volumes." },
        ]
      },
      {
        name: "Chapter 45 — Geriatrics",
        sections: [
          { text: "Age-Related Physiologic Changes — decreased reserve, polypharmacy, frailty", verdict: "keep", justification: "Geriatric physiology changes affect vital sign interpretation, drug metabolism, and compensatory reserve. EMALB written exams test age-related changes and their clinical implications.|||TAKEAWAY|||Cardiovascular: ↓heart rate response to stress (beta-blocker use + age-related SA node dysfunction), ↓cardiac output reserve. Respiratory: ↓FEV1, ↑residual volume, ↓cough effectiveness. Renal: ↓GFR 1% per year after 30 → drug accumulation. Neurologic: ↓sensory thresholds, pain perception, thermoregulation. Musculoskeletal: ↓bone density, muscle mass. Baseline tachycardia (HR >90) may represent relative tachycardia even if 'technically normal.'|||FIELD|||An 80-year-old with a HR of 88 and a systolic BP of 100 is not hemodynamically stable — if their baseline is HR 55 and BP 150/90 (common in treated hypertension), this represents significant hemodynamic compromise. Know their baseline if available. In geriatric assessment, trends and context matter more than absolute numbers." },
          { text: "Atypical Presentations in Elderly — silent MI, afebrile sepsis, painless abdomen", verdict: "keep", justification: "Atypical presentations in elderly are a major source of missed diagnoses. EMALB written exams specifically test that elderly patients frequently do not present with classic symptoms.|||TAKEAWAY|||Silent MI (20–60% of MIs in elderly): presenting as weakness, fatigue, dyspnea, syncope or confusion — no chest pain. Afebrile sepsis: elderly immunocompromise + NSAID use → no fever despite serious infection. Painless abdomen: decreased pain sensation + analgesic use → acute abdomen without rebound or guarding. 'Unwell elderly': get a 12-lead, BGL, vital signs, temperature, SpO2 — always.|||FIELD|||An 80-year-old who 'just fell': investigate the cause of the fall before treating the injury. Falls in elderly are frequently symptoms: syncope from arrhythmia, hypoglycemia, PE, silent MI, orthostatic hypotension. The fall is the mechanism — find the medical cause. 12-lead, BGL, full vital signs on every elderly fall." },
          { text: "Falls in the Elderly — syncope, environmental, fracture risk, head injury", verdict: "keep", justification: "Falls are the most common EMS call for elderly patients. BCEHS CPG A12 (Safeguarding Vulnerable Adults) is relevant. Risk stratification for significant injury (anticoagulants, fall height, mechanism) drives transport decision.|||TAKEAWAY|||Elderly fall risk factors: polypharmacy (antihypertensives, sedatives, diuretics), orthostatic hypotension, visual impairment, neuropathy, environmental hazards. High-risk indicators: loss of consciousness before fall, anticoagulated (intracranial hemorrhage risk), fall from height >1m, significant MOI. All anticoagulated patients who hit their head require CT regardless of GCS.|||FIELD|||The anticoagulated elderly patient who fell and hit their head: even with GCS 15 and no focal deficit, Priority 1 transport for CT. Subdural hematoma in warfarin patients can develop over hours to days. 'They fell but feel fine' — fine now does not mean fine in 3 hours when the subdural has expanded. Document exact fall mechanism, any LOC, and all anticoagulant medications." },
          { text: "Dementia and Delirium — differentiation, acute confusion causes, management", verdict: "keep", justification: "Delirium (acute, reversible) vs dementia (chronic, progressive) differentiation is tested in EMALB written exams. Delirium indicates a medical emergency — dementia does not.|||TAKEAWAY|||Delirium: acute onset, fluctuating, reversible (if cause treated) — medical emergency. Causes: AEIOU-TIPS. Key feature: inattention (cannot focus or follow conversation consistently). Dementia: insidious onset, chronic progressive, not reversible. Key field question: 'Is this new or is this their baseline?' — get history from caregiver. Never assume new confusion = dementia baseline. New confusion = delirium = find and treat the cause.|||FIELD|||Delirium in an elderly patient is a medical emergency — it has a 25% in-hospital mortality when untreated. The dementia patient at their baseline may be pleasantly confused; the delirious patient is acutely confused, inattentive, often agitated or somnolent, and has a treatable cause. Always confirm baseline cognition with a caregiver before concluding 'this is just their dementia.'" },
          { text: "Polypharmacy and Drug Interactions — Beers criteria, common interactions", verdict: "keep", justification: "Polypharmacy is one of the most common and clinically important features of elderly patient management. EMALB written exams test drug interaction awareness and the clinical implications of polypharmacy.|||TAKEAWAY|||Polypharmacy (≥5 medications): ↑drug interactions, ↑adverse effects, ↑adherence failure, ↑medication errors. Beers criteria: medications potentially inappropriate for elderly (high anticholinergic load, benzodiazepines, first-generation antihistamines, NSAIDs, muscle relaxants). Digoxin toxicity: narrow therapeutic index + renal clearance decline with age → common cause of arrhythmia in elderly. Warfarin: drug interactions with almost every medication can cause supratherapeutic anticoagulation.|||FIELD|||Elderly patient with new confusion, bradycardia, and nausea: check for digoxin toxicity. Elderly patient on warfarin with minor trauma: high bleed risk. The medication list is your most important tool in geriatric assessment — photograph it or have the patient/family bring the medication bottles. A cardiologist's orders from 2019 may not account for the 5 new medications added since." },
          { text: "Elder Abuse — physical, psychological, financial; mandatory reporting", verdict: "keep", justification: "Elder abuse mandatory reporting obligations (BCEHS CPG A12 Safeguarding Vulnerable Adults) are tested in EMALB jurisprudence. Recognition requires knowing indicators — many are subtle.|||TAKEAWAY|||Elder abuse types: physical (unexplained injuries, bilateral, in protected areas), psychological (fear of caregiver, withdrawal, depression), financial (caregiver has access to finances, recent changes in will), neglect (poor hygiene, malnutrition, untreated pressure ulcers, untreated medical conditions), sexual (any genital injury in cognitively impaired adult). Report suspected elder abuse to the Public Guardian and Trustee (PGT) in BC and to police if criminal.|||FIELD|||The frail elderly patient alone with a caregiver who is reluctant to leave the room, gives answers before the patient can respond, and has multiple unexplained bruises in different stages of healing: interview the patient privately if possible (use clinical need as reason to separate). Document exactly what the patient says verbatim and what the caregiver says verbatim. Report suspicion — the threshold is reasonable grounds, not certainty." },
        ]

      {
        name: "Chapter 46 — Abuse",
        sections: [
          { text: "Child Abuse — physical, emotional, sexual, neglect; indicators and reporting", verdict: "keep", justification: "Child abuse mandatory reporting is tested in EMALB jurisprudence. BC Child, Family and Community Service Act creates an absolute legal obligation. You are both a mandatory reporter and a key clinical observer.|||TAKEAWAY|||Physical abuse indicators: bilateral injuries, injuries in protected areas (chest, abdomen, back, buttocks), posterior rib fractures (classic for shaken baby), metaphyseal fractures, multiple injuries in different healing stages, mechanism inconsistent with development (bruising in a pre-mobile infant). Mandatory report threshold: reasonable suspicion (not proof). Call MCFD 1-800-663-9122 from the scene or immediately after.|||FIELD|||You are one of the few healthcare providers who sees the home environment, caregiver behavior, and patient presentation simultaneously. What you observe in the home (cleanliness, hazards, caregiver-child interaction, sibling conditions) is critical evidence. Document everything you observe objectively and report any reasonable suspicion immediately. Non-reporting is an offence." },
          { text: "Intimate Partner Violence — assessment, safety planning, trauma-informed care", verdict: "keep", justification: "IPV is pervasive and commonly encountered in EMS. BCEHS CPG Intimate Partner Violence provides a trauma-informed framework. Safe documentation and not escalating danger are critical.|||TAKEAWAY|||IPV indicators: injuries inconsistent with reported mechanism, injuries in various healing stages, partner who controls the interview, patient appears fearful or deferential, multiple EMS visits for 'accidents.' Trauma-informed approach: ask privately ('Do you feel safe at home?'), validate without judgment, provide resources (BC Victim Services 1-800-563-0808), document objectively. Do NOT confront the abuser — this escalates danger to the patient.|||FIELD|||Never interview a potential IPV victim with the suspected abuser present. 'I need to take your vitals and ask some questions privately' is an appropriate reason to separate them. If the patient discloses: believe them, document their words verbatim, provide resources. Do not require them to make a report — it is not safe for many victims to do so from the scene. Safety first." },
          { text: "Elder Abuse — financial, physical, caregiver neglect indicators", verdict: "keep", justification: "Elder abuse recognition and reporting are BCEHS CPG A12 topics and EMALB jurisprudence content. Seen frequently in community calls. PGT reporting obligation in BC.|||TAKEAWAY|||Elder abuse is prevalent in 4–6% of elderly living in the community. Financial abuse (most common): missing money, unusual transactions, new 'close friend' with financial access. Caregiver neglect: pressure ulcers, poor hygiene, malnutrition, missed medications, fear of caregivers. Physical: bruising in protected areas, inadequate explanation for injury. Report to PGT (250-356-8860 Victoria) or local Adult Protection in the Lower Mainland.|||FIELD|||The group home or residential care facility environment: document care quality on every call. If a resident appears neglected (unchanged incontinence, severe pressure sores, extreme weight loss, fearful demeanor), report to the facility administrator AND to Adult Protection or the PGT. Your documentation may be the evidence that triggers a licensing investigation." },
        ]

      {
        name: "Chapter 47 — Patients With Special Needs",
        sections: [
          { text: "Patients With Physical Disabilities — wheelchair users, sensory impairments", verdict: "keep", justification: "Adapting assessment and transport for patients with physical disabilities is a daily field skill. BCEHS A-General principles of patient-centred care apply. EMALB practical exams may include patients with adaptive needs.|||TAKEAWAY|||Wheelchair users: ask before moving the chair, understand the patient's baseline (spasticity, pressure injury sites, autonomic dysreflexia risk in SCI), use patient's own cushion if possible during transport. Sensory impairments: visual (describe everything before doing it), deaf/hard of hearing (face-to-face communication, writing, apps). Assistive devices: treat as part of the patient — bring them whenever possible.|||FIELD|||The SCI patient with sudden severe headache + diaphoresis above the injury level + hypertension: autonomic dysreflexia from a noxious stimulus below the injury (full bladder, pressure sore, urinary catheter kink). Treatment: identify and remove the noxious stimulus (check catheter, check for fecal impaction). BP can reach 300 systolic — it is a hypertensive emergency. Priority 1 transport if not rapidly resolved." },
          { text: "Patients With Developmental Disabilities — autism, intellectual disability, communication", verdict: "keep", justification: "Patients with developmental disabilities are frequently encountered in EMS, particularly in group home calls. Adapting communication and assessment for non-verbal or cognitively different patients is a clinical competency.|||TAKEAWAY|||Autism spectrum disorder (ASD): variable communication ability, sensory sensitivities (lights, noise, touch may cause extreme distress), repetitive behaviors, rigid routines. Adaptations: calm environment, consistent communication, allow sensory tools, involve familiar caregiver, minimize physical contact until rapport established. Intellectual disability: use simple language, concrete questions, involve support workers for history. Non-verbal patient: use alternative communication (pointing, picture boards) and caregiver proxy.|||FIELD|||A patient with ASD experiencing medical distress may present as agitation, self-injury, or 'behavioral outburst' — don't dismiss it as a behavioral problem. Pain, full bladder, constipation, and medical illness cause behavioral dysregulation in non-verbal ASD patients. Involve the support worker immediately — they know the patient's baseline and communication style better than anyone." },
          { text: "Patients With Terminal Illness and Palliative Care — comfort care, DNR, family support", verdict: "keep", justification: "Palliative and end-of-life calls are common in EMS and require a different clinical approach than restorative care. BCEHS CPG Palliative Care/End of Life is active. MOST form adherence is a legal and ethical obligation.|||TAKEAWAY|||Palliative care goal: symptom management and quality of life, not curative treatment. Clinical approach: identify MOST form and its directives before any intervention, manage pain and distress (opioids are appropriate even at end of life — symptom relief is the goal), involve family, avoid unnecessary interventions inconsistent with care goals. MOST form specifies: resuscitation preference, hospital transfer preference, other medical interventions.|||FIELD|||A palliative patient in respiratory distress at home with a MOST form: your job is comfort, not cure. Check what the MOST says about hospital transfer and interventions. If they are DNR and prefer home: manage symptoms (opioids for dyspnea — appropriate in palliative context even if respiratory rate decreases), support the family, and facilitate a dignified death. Call CliniCall for guidance if MOST directives create clinical uncertainty." },
          { text: "Bariatric Patients — equipment, airway challenges, dosing adjustments", verdict: "skim", justification: "Bariatric patient considerations affect equipment choices and logistics but are not primary EMALB exam content. Skim for awareness.|||TAKEAWAY|||Bariatric patients (BMI >40): challenges include difficult IV access (deep veins), challenging airway (adipose in airway, limited neck extension, decreased FRC → rapid desaturation), weight-rated equipment requirement, need for additional personnel for safe lifting. Drug dosing: weight-based but some drugs use ideal body weight (IBW) rather than total body weight to avoid toxicity.|||FIELD|||Bariatric patient airway management: pre-oxygenate aggressively (sitting or head-elevated position improves FRC), use a ramp or elevation to achieve sniffing position, have suction ready. A bariatric patient desaturates much faster during apnea than a normal-weight patient — your margin for error is smaller. Call for ACP and additional resources early." },
        ]
      },
      {
        name: "Chapter 48 — Acute Interventions for the Chronic Care Patient",
        sections: [
          { text: "Home Care Patients — colostomy, PEG tube, central lines, ostomy", verdict: "keep", justification: "Home care patients with medical devices are common EMS calls in the Lower Mainland's aging population. Recognizing device-related emergencies and managing them safely is a field competency.|||TAKEAWAY|||Tracheostomy emergencies: obstruction (suction inner cannula, replace if blocked, BVM via stoma if partial airway). PEG tube dislodgement: cover insertion site (bowel content spillage), transport. Central line (PICC, port): do not use without knowing device — they are not for prehospital use without specific training. Urinary catheter obstruction: check for kinking, irrigate if trained, consider autonomic dysreflexia (SCI patient). Colostomy: leakage, skin breakdown — cover, transport.|||FIELD|||The patient with a tracheostomy who is in respiratory distress: suction the inner cannula first (most obstructions are mucus plugs). If unsuccessful: remove the inner cannula and attempt BVM ventilation through the outer cannula stoma. If still obstructed: BVM over the mouth and nose may work if the stoma can be occluded. Know your escalation sequence before the call." },
          { text: "Ventilator-Dependent Patients — alarm troubleshooting, manual ventilation", verdict: "keep", justification: "Home ventilator alarms and troubleshooting are encountered on community calls with chronic respiratory patients. BCEHS CPG Chronic Care Patients provides guidance.|||TAKEAWAY|||Common ventilator alarms: high pressure (obstruction — secretions, kinked circuit, patient biting tube, pneumothorax), low pressure/volume (disconnection, cuff leak, patient's circuit open). Troubleshooting approach: check patient clinically (SpO2, chest rise, LOC) → check circuit (kinking, disconnection) → suction (secretions) → manual BVM if uncertain. DOPE mnemonic: Displacement, Obstruction, Pneumothorax, Equipment failure.|||FIELD|||When a vented patient deteriorates: disconnect the ventilator and bag manually — this both removes equipment failure as a variable and provides immediate manual assessment of compliance. Does the chest rise with BVM? Yes → equipment problem. No → patient problem. DOPE drives your differential. Manual ventilation is always your rescue if the ventilator fails." },
          { text: "End-of-Life Care — advance directives, MOST, palliative pain management", verdict: "keep", justification: "End-of-life care in home settings is a common and emotionally demanding EMS call. BCEHS CPG End of Life Care and MOST form management are direct clinical and legal obligations. EMALB jurisprudence tests MOST form validity and adherence.|||TAKEAWAY|||End-of-life assessment: identify MOST form, verify validity (physician signature, current date, patient identification), understand care goals. Comfort-focused interventions: analgesia (opioids — appropriate for comfort even if respiratory rate decreases), positioning, symptom management. Family support: anticipatory guidance ('this is expected, they are not in distress'), your presence and calm demeanor matter enormously.|||FIELD|||End-of-life calls are among the most psychologically demanding in EMS. A patient actively dying at home with a valid MOST form and comfort-focused goals: honour the document, manage symptoms, support the family, and provide a peaceful environment. Initiating unwanted resuscitation in violation of a MOST form is assault. If family is not honouring the patient's stated wishes, CliniCall for guidance." },
        ]
      },

  {
    name: "EMS Operations",
    chapters: [
      {
        name: "Chapter 49 — Emergency Vehicle Operations",
        sections: [
          { text: "Collision Avoidance and Safe Driving — due regard, driving standards, fatigue", verdict: "keep", justification: "Emergency vehicle operations are tested in EMALB jurisprudence (due regard standard) and are the most common cause of EMS personnel death. The legal duty of due regard is tested directly.|||TAKEAWAY|||Due regard: emergency vehicle operators must exercise due care despite having right-of-way with lights and sirens — not a blanket exemption from traffic law. At intersections: slow to walking pace, confirm all lanes are stopped, proceed through one lane at a time. Weather: double following distance, reduce speed, increase braking distance. Fatigue: impairs driving equivalent to 0.08 BAC after 20 hours awake.|||FIELD|||Every intersection on a code 3 call is a potential crash. The most common EMS vehicle crashes are intersection T-bone collisions when other drivers do not hear or heed sirens. Treat every intersection as potentially unsafe regardless of your right-of-way. Stop if any doubt. The 30 seconds saved by aggressive intersection management is not worth the crash." },
          { text: "Lights and Sirens — when to use, limitations, intersection management", verdict: "keep", justification: "L&S use policy is tested in EMALB jurisprudence. L&S driving increases crash risk 4-fold. Appropriate L&S use decisions are a daily operational competency.|||TAKEAWAY|||L&S indications: life-threatening emergency requiring rapid transport where minutes matter (STEMI, stroke, major trauma, respiratory arrest, cardiac arrest). L&S increases EMS crash risk 4-fold and average response time reduction is 90–180 seconds — not always clinically significant. Physiologic effect on crew: elevated cortisol, increased decision-making errors, tunnel vision. Use L&S judiciously — code 2 (no L&S) is appropriate for stable patients.|||FIELD|||Not every call requires code 3 both ways. Code 2 transport for stable patients reduces crew stress, reduces crash risk, and does not worsen patient outcomes. The drive to the hospital with a stable chest pain patient — already treated, 12-lead transmitted — may not warrant L&S. Clinical need drives the code, not routine." },
          { text: "Air Medical Operations — scene safety, LZ setup, crew communication", verdict: "skim", justification: "Air medical coordination is an infrequent but operationally important skill. Tested at awareness level in EMALB. In the Lower Mainland, BCEHS HEMS operates from multiple bases.|||TAKEAWAY|||LZ requirements: minimum 30m × 30m cleared area, no overhead wires or obstacles, firm surface, marked with one strobe (pilot finds the LZ visually). Approach: never approach a helicopter from the rear (tail rotor is invisible and lethal). Approach from 9 or 3 o'clock position only, crouching in the downwash, only when crew signals you. Radio communication with pilot on designated frequency before LZ setup.|||FIELD|||Lower Mainland LZ setup: clear the area of bystanders, mark the LZ with one light source (flashlight or strobe), communicate obstacles (power lines, trees, towers) and wind direction to the pilot. Never approach the helicopter until the pilot gives the signal — the tail rotor creates an invisible kill zone. Downwash will blow loose objects at dangerous speeds." },
        ]
      },
      {
        name: "Chapter 50 — Medical Incident Command",
        sections: [
          { text: "Incident Command System — ICS structure, positions, unified command", verdict: "keep", justification: "ICS is the operational framework for all multi-casualty and disaster responses in BC. EMALB written exams test ICS positions and the paramedic's role within the command structure.|||TAKEAWAY|||ICS structure: Incident Commander (IC) → Operations, Planning, Logistics, Finance sections. Unified Command: multiple agencies (BCEHS, fire, police) under shared command. Span of control: 5 (± 2) direct reports per supervisor. BCEHS roles at MCI: Medical Group Supervisor (Medical Branch Director), Triage Officer, Treatment Officer (Red/Yellow/Green), Transport Officer.|||FIELD|||In an MCI, you are likely in a specific role — not 'helping everyone.' If you arrive first: establish command, declare the incident, begin triage, call for resources. If you arrive later: check in with the Medical Branch Director and accept your assigned role. Self-deployment to random patients without a role creates chaos. ICS discipline saves lives at the systems level." },
          { text: "Mass Casualty Incidents — START/JumpSTART triage, triage tags, resource management", verdict: "keep", justification: "START triage (adults) and JumpSTART triage (pediatric) are tested in EMALB written exams and MCI practical scenarios. Triage in MCIs is different from routine patient prioritization — it is about maximizing lives saved given finite resources.|||TAKEAWAY|||START triage: Respirations (absent → position and recheck → if still absent = black), Rate >30/min → red. Perfusion (radial pulse absent or cap refill >2 sec → red), Mental status (cannot follow commands → red). JumpSTART (pediatric): same algorithm with modifications (respiratory rate 15–45 normal range, use 5 rescue breaths before tagging black if apneic). Tag categories: black (expectant/deceased), red (immediate), yellow (delayed), green (minor/walking wounded).|||FIELD|||MCI triage is the hardest clinical decision in EMS: you walk past the person you know you cannot save (black tag) to get to the person who is salvageable with minimal intervention (red tag). 'Doing the most good for the most people' is the MCI principle — not doing everything for every individual. Practicing START on paper is essential before you need to apply it under pressure." },
          { text: "Staging and Communication at MCIs — radio protocols, staging areas, reporting", verdict: "skim", justification: "MCI logistics and communication are operational topics tested at awareness level in EMALB written exams.|||TAKEAWAY|||MCI communications: designated radio channel for medical operations (separate from fire/police), clear plain language (no codes), regular SITREP (situation report) updates to IC. Staging: incoming units stage at a designated area until given assignment by the IC — prevents traffic congestion at scene. Resource tracking: vehicles in/out, patients transported and to which hospitals.|||FIELD|||At a large MCI scene, 20 ambulances arriving randomly and going directly to patients creates gridlock and duplicate treatment. Staging at a designated area and receiving assignments from the Transport Officer ensures organized distribution of patients to multiple receiving hospitals and avoids overwhelming a single ED." },
        ]
      },
      {
        name: "Chapter 51 — Terrorism and CBRNE Events",
        sections: [
          { text: "CBRNE Overview — chemical, biological, radiological, nuclear, explosive threats", verdict: "keep", justification: "CBRNE awareness is tested in EMALB written exams. The paramedic's primary role is recognition, protection, and evacuation — not primary responder.|||TAKEAWAY|||CBRNE recognition cues: multiple casualties with similar symptoms (chemical/biological), unusual odors, unexplained devices, mass casualty with explosion. EMS role: recognize → don't approach (2-deep rule: two paramedics at safe distance) → establish decontamination area → call for specialized resources (HAZMAT/CBRNE team, BCEHS command). Self-protection: don't become a casualty. Hot zone = HazMat team only. Warm zone = decontaminated patients.|||FIELD|||CBRNE/terrorism scene: if you see something that doesn't make sense (multiple unconscious patients in an enclosed space, patients with similar unusual symptoms, suspicious devices), do not approach. Stage upwind and uphill, call for specialized resources, and establish a decontamination corridor. Secondary contamination of EMS personnel is a documented risk in chemical events — protect yourself first." },
          { text: "Chemical Agents — nerve agents, blister agents, pulmonary agents, signs", verdict: "keep", justification: "Chemical agent toxidrome recognition (especially nerve agents → cholinergic toxidrome) and antidote use are tested in EMALB CBRNE written content.|||TAKEAWAY|||Nerve agents (sarin, VX, novichok): cholinergic toxidrome (SLUDGE/DUMBELS) — most immediately lethal chemical agent. Antidote: atropine (large doses) + pralidoxime (within first hour). Blister agents (mustard, lewisite): delayed blistering, eye/respiratory involvement. Pulmonary agents (chlorine, phosgene): delayed pulmonary edema. Blood agents (cyanide, CO): cellular hypoxia. Hydroxocobalamin for cyanide.|||FIELD|||Mass casualty event with multiple people having miosis + bronchorrhea + seizures + bradycardia: nerve agent. Don't touch patients until decontaminated — nerve agents absorb through skin. EMS role after decontamination: aggressive atropine (MARK 1 auto-injectors if available), airway management, seizure management, Priority transport to hospital with antidote supplies." },
          { text: "Biological Agents — anthrax, smallpox, plague — recognition and PPE", verdict: "skim", justification: "Biological agent recognition is an awareness-level competency. EMALB written exams test recognition indicators. Skim.|||TAKEAWAY|||Biological attack indicators: unusual disease pattern (clusters of rare disease, multiple presenting at different hospitals with same unusual illness), unusual time course (too many sick too fast). Anthrax: cutaneous (black eschar) or inhalational (flu-like → rapid deterioration). Smallpox: rash in all stages simultaneously, centrifugal distribution. Standard airborne + contact precautions for suspected bioterrorism patient.|||FIELD|||A cluster of patients presenting with similar unusual symptoms that don't fit a clear etiology: think biological agent exposure. Public health is your key partner — BCEHS has a notification protocol for suspected biological exposure. Your personal protection (N95, gloves, gown) and decontamination compliance are the priority." },
          { text: "Radiological Events — types of radiation, decontamination, exposure limits", verdict: "skim", justification: "Radiological events are rare but tested at awareness level in EMALB written exams. Know the difference between radiation exposure and contamination.|||TAKEAWAY|||Radiation exposure: irradiated but not contaminated — no residue on patient (like X-ray — patient is not radioactive). Contamination: radioactive material ON the patient (dust, liquid) — can contaminate others. Decontamination: remove and bag clothing (removes 80% of contamination), wash with soap and water. Acute radiation syndrome: dose-dependent — nausea, vomiting, bone marrow suppression, neurological. Time, distance, shielding reduce exposure.|||FIELD|||Radiological event: remove patient from source, remove clothing (bag it), soap and water decontamination, monitor with Geiger counter if available. Transport to hospital after decontamination. Radiation exposure alone (without contamination) does not make the patient radioactive — do not refuse to treat or transport a radiation exposure patient." },
        ]
      },
      {
        name: "Chapter 52 — Rescue Awareness and Operations",
        sections: [
          { text: "Rescue Operations — awareness vs operations vs technician level roles", verdict: "keep", justification: "Rescue awareness level is the expected EMS competency — knowing what resources to call, not performing technical rescue. EMALB written exams test EMS role at rescue scenes.|||TAKEAWAY|||Rescue levels: awareness (recognize hazard, call for resources, support perimeter), operations (basic rescue techniques with training), technician (advanced rescue, specialized equipment). EMS role at technical rescue: medical standby, patient packaging after rescue team extracts, treating access injuries. Do not self-rescue — becoming a patient instead of a rescuer is the #1 rescue scene error.|||FIELD|||Vehicle extrication scene: your role is medical assessment and treatment while fire performs technical extraction. Get patient access through a window or door fire creates (with your safety maintained). Establish IV access, spinal precautions, and hemorrhage control before extrication is complete — this minimizes time from extraction to definitive care." },
          { text: "Water Rescue — reach, throw, don't go; PFD use, swift water awareness", verdict: "keep", justification: "Water rescue awareness (reach, throw, don't go principle) and drowning management are tested in EMALB written exams and are relevant to BC's aquatic environment.|||TAKEAWAY|||'Reach, throw, row, don't go' — water rescue hierarchy minimizing rescuer drowning risk: reach with a pole/rope, throw a floatation device, row (boat), only enter as last resort with training and PFD. Swift water: current + cold water = extremely dangerous for untrained rescuers. EMS role: manage the rescued patient — hypothermia, hypoxia, aspiration. All submersion patients: O2, monitor for secondary drowning (hours later), transport.|||FIELD|||BC's coastline, rivers, and lakes make water rescue a real scenario. Do not enter fast-moving water without swift water rescue training and equipment — even experienced swimmers have drowned attempting untrained swift water rescue. Your job is to manage the extracted patient: check for hypothermia, pulse, breathing, and begin resuscitation if needed. Coordinate with fire marine or SAR for extraction." },
          { text: "Confined Space and Trench Rescue — atmospheric monitoring, do not enter without IDLH", verdict: "keep", justification: "Confined space rescue awareness is a EMALB written exam topic. Entering a confined space without atmospheric monitoring is the #1 cause of confined space deaths.|||TAKEAWAY|||Confined space hazards: oxygen deficiency, toxic gases (CO, H2S), flammable gases, engulfment, entrapment. 'Do not enter without atmospheric monitoring and permit-required training.' EMS role: standby at entrance, treat patients after extraction by confined space team, monitor for atmospheric toxin effects (CO, H2S poisoning). Trench rescue: do not enter unstable trench — trench collapse is sudden and survivable entrapment becomes fatal quickly.|||FIELD|||Farm or industrial call with workers unconscious inside a silo, tank, or pit: do not enter without SCBA and atmospheric clearance. Multiple rescuers die from H2S (smell of rotten eggs — paralyzes olfactory nerve quickly, you may not smell it) in confined spaces every year. Stage at the entrance, provide oxygen for extracted patients, call for confined space team (fire) immediately." },
        ]
      },
      {
        name: "Chapter 53 — Hazardous Materials Incidents",
        sections: [
          { text: "Recognition of HazMat Incidents — placards, ERG, WHMIS, STEL/IDLH", verdict: "keep", justification: "HazMat scene recognition is tested in EMALB written exams. Using the Emergency Response Guidebook (ERG) is a specific tested skill.|||TAKEAWAY|||HazMat scene indicators: UN placard (4-digit number identifies substance), unusual odor, dead animals, patients with similar symptoms, visible gas cloud/liquid release. ERG: orange section (initial isolation/protective action distances by UN number or material name), green section (initial isolation distances for toxic inhalation hazards). WHMIS GHS symbols. STEL: short-term exposure limit. IDLH: immediately dangerous to life and health.|||FIELD|||Transport truck crash in the Lower Mainland: check the placard before approaching. Look up the UN number in the ERG. The ERG orange section tells you: initial isolation distance (radius around the spill where no one should be) and protective action distance (downwind evacuation distance). This takes 30 seconds and protects both you and the public from secondary exposure." },
          { text: "Decontamination — gross decon, technical decon, secondary contamination prevention", verdict: "keep", justification: "HazMat decontamination principles — that patients must be decontaminated before EMS contact — are tested in EMALB written exams and protect EMS personnel.|||TAKEAWAY|||Decontamination zones: hot (contamination zone — HazMat team only, full protective equipment), warm (decon zone — gross decontamination: remove clothing + soap and water rinse), cold (clean zone — EMS treatment after decontamination confirmed). Removing clothing: removes 80% of solid/liquid contamination. Never accept a patient into your ambulance without HazMat team confirmation of decontamination completion.|||FIELD|||The contaminated patient will try to walk to you (EMS) because you're clearly medical and they want help. Do not let them approach your ambulance until decontamination is complete — secondary contamination of your ambulance affects every patient you subsequently transport and can sideline your truck. Establish your cold zone perimeter and direct patients to the HazMat decon corridor." },
          { text: "PPE Levels at HazMat Scenes — Levels A, B, C, D", verdict: "keep", justification: "PPE levels at HazMat scenes are tested in EMALB written exams. EMS operating in the cold zone typically uses Level D (standard work uniform + gloves + mask).|||TAKEAWAY|||Level A: fully encapsulating suit + SCBA — highest protection, for unknown extremely hazardous substances. Level B: splash protection + SCBA — for known substances with moderate splash risk. Level C: splash protection + air-purifying respirator (APR) — for known concentration of specific substance. Level D: standard work uniform, gloves, safety glasses — clean zone/decontaminated patient care. EMS = Level D in cold zone after HazMat confirms decontamination.|||FIELD|||Your standard PPE (gloves, mask, safety glasses) is Level D — appropriate for treating already-decontaminated patients in the cold zone. You are not equipped to operate in the hot or warm zone. If someone tells you to go into the hot zone without proper PPE, refuse — this is a WorkSafeBC violation and a life safety issue. The HazMat team wears A or B for a reason." },
        ]
      },
      {
        name: "Chapter 54 — Crime Scene Awareness",
        sections: [
          { text: "Scene Safety at Crime Scenes — police clearance, tactical awareness", verdict: "keep", justification: "Crime scene safety is tested in EMALB jurisprudence and is a daily operational reality in the Lower Mainland's urban environment. Entering an uncleared crime scene has resulted in EMS personnel being killed.|||TAKEAWAY|||Crime scene approach: stage until police confirm scene is safe (shooter/suspect contained, scene cleared). Do not enter based on dispatch information alone — dispatch does not see the scene. When ordered to stage: comply. Scene can become unsafe after initial clearance (additional suspects, agitated crowd). Maintain situational awareness throughout patient care — monitor scene, identify exits.|||FIELD|||Lower Mainland gang activity and street-level violence mean EMS regularly responds to active or recent crime scenes. If dispatch says 'shooting' or 'stabbing' and police are not confirmed on scene: stage at a safe distance until police clear. Your safety is the prerequisite for patient care — a dead or injured paramedic helps no one. Stage first, then advance when cleared." },
          { text: "Evidence Preservation — path of travel, documentation, hands-off approach to evidence", verdict: "keep", justification: "Evidence preservation while delivering patient care is tested in EMALB jurisprudence. Paramedics are frequent witnesses and evidence handlers at crime scenes — proper documentation protects both patients and justice.|||TAKEAWAY|||Evidence preservation: enter by the most direct route to the patient and minimize deviation, don't touch or move anything not required for patient care, document exactly what you moved and why, note the patient's original position and condition, document verbatim any statements the patient makes (spontaneous statements are admissible evidence — document them word for word).|||FIELD|||The stab wound patient who says 'it was my brother, he went that way' — document that verbatim: 'Patient stated: It was my brother, he went that way.' This is a dying declaration and spontaneous statement — potentially critical evidence. Don't paraphrase. Note time, patient condition when statement was made, and your assessment of their mental status at that time." },

// Build the planner
const container = document.getElementById('mainContent');
let globalNum = 0;
let totalKeep = 0, totalSkim = 0, totalSkip = 0;

MODULES.forEach((mod, mIdx) => {
  const modDiv = document.createElement('div');
  modDiv.className = `module module-${mIdx + 1}`;
  modDiv.dataset.mod = mIdx;

  const modHeading = document.createElement('div');
  modHeading.className = 'module-heading';
  modHeading.innerHTML = `<span class="mod-tag">Module ${mIdx + 1}</span>${mod.name}`;
  modDiv.appendChild(modHeading);

  mod.chapters.forEach((ch, cIdx) => {
    const chBlock = document.createElement('div');
    chBlock.className = 'chapter-block';
    chBlock.dataset.ch = `${mIdx}-${cIdx}`;

    const chHeader = document.createElement('div');
    chHeader.className = 'chapter-header';
    chHeader.textContent = ch.name;
    chBlock.appendChild(chHeader);

    const colHeader = document.createElement('div');
    colHeader.className = 'col-header-row';
    colHeader.innerHTML = '<div class="col-center">#</div><div class="col-center">Flag</div><div>Section / Topic</div><div class="col-center">Why →</div><div class="col-center">Target Date</div><div class="col-center col-done">Done ✓</div>';
    chBlock.appendChild(colHeader);

    ch.sections.forEach((sec) => {
      globalNum++;
      if (sec.verdict === 'keep') totalKeep++;
      else if (sec.verdict === 'skim') totalSkim++;
      else totalSkip++;

      const objDiv = document.createElement('div');
      objDiv.className = 'obj-row';
      objDiv.dataset.id = globalNum;
      objDiv.dataset.verdict = sec.verdict;

      const numCell = document.createElement('div');
      numCell.className = 'num-cell';
      numCell.textContent = globalNum;

      const verdictCell = document.createElement('div');
      verdictCell.className = 'verdict-cell';
      const badge = document.createElement('span');
      badge.className = `verdict-badge verdict-${sec.verdict}`;
      badge.textContent = sec.verdict === 'keep' ? 'Keep' : sec.verdict === 'skim' ? 'Skim' : 'Skip';
      verdictCell.appendChild(badge);

      const doneCell = document.createElement('div');
      doneCell.className = 'done-cell';
      const label = document.createElement('label');
      label.className = 'check-wrap';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      const box = document.createElement('div');
      box.className = 'check-box';
      cb.addEventListener('change', () => {
        objDiv.classList.toggle('completed', cb.checked);
        updateCounter();
        saveState();
      });
      label.appendChild(cb);
      label.appendChild(box);
      doneCell.appendChild(label);

      const textCell = document.createElement('div');
      textCell.className = 'obj-text-cell';
      textCell.textContent = sec.text;

      const justCell = document.createElement('div');
      justCell.className = 'just-cell';
      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'just-toggle';
      toggleBtn.textContent = 'Why →';
      const panel = document.createElement('div');
      panel.className = 'just-panel';
      const closeBtn = document.createElement('button');
      closeBtn.className = 'just-panel-close';
      closeBtn.innerHTML = '&times;';
      closeBtn.onclick = (e) => { e.stopPropagation(); panel.classList.remove('open'); toggleBtn.textContent = 'Why →'; };
      panel.appendChild(closeBtn);
      const content = document.createElement('div');
      const rawText = sec.justification;
      const takeawaySplit = rawText.split('|||TAKEAWAY|||');
      if (takeawaySplit.length === 2) {
        const fieldSplit = takeawaySplit[1].split('|||FIELD|||');
        let panelHtml = '<strong style="color:var(--navy)">Justification:</strong> ' + takeawaySplit[0].replace(/\n/g, '<br>');
        panelHtml += '<br><br><strong style="display:inline-block;margin-top:8px;color:var(--green-dark)">Key Takeaway:</strong> ' + fieldSplit[0].replace(/\n/g, '<br>');
        if (fieldSplit.length === 2) {
          panelHtml += '<br><br><strong style="display:inline-block;margin-top:8px;color:#8B5500">Field Note:</strong> ' + fieldSplit[1].replace(/\n/g, '<br>');
        }
        content.innerHTML = panelHtml;
      } else {
        const fieldSplit = rawText.split('|||FIELD|||');
        if (fieldSplit.length === 2) {
          content.innerHTML = fieldSplit[0].replace(/\n/g, '<br>') +
            '<br><br><strong style="display:inline-block;margin-top:6px;color:#1a1010">Field:</strong> ' +
            fieldSplit[1].replace(/\n/g, '<br>');
        } else {
          content.textContent = rawText;
        }
      }
      panel.appendChild(content);
      toggleBtn.onclick = (e) => {
        e.stopPropagation();
        const isOpen = panel.classList.contains('open');
        // Close all open panels
        document.querySelectorAll('.just-panel.open').forEach(p => {
          p.classList.remove('open');
          const cell = p.closest('.just-cell');
          if (cell) { const btn = cell.querySelector('.just-toggle'); if (btn) btn.textContent = 'Why →'; }
        });
        if (!isOpen) {
          panel.classList.add('open');
          toggleBtn.textContent = 'Close ×';
          if (window.innerWidth > 600) {
            // Desktop: position beside the button (right side preferred, left if no room)
            const rect = toggleBtn.getBoundingClientRect();
            const panelW = 520;
            const margin = 8;
            let left = rect.right + margin;
            if (left + panelW > window.innerWidth - margin) left = rect.left - panelW - margin;
            if (left < margin) left = margin;
            let top = rect.top;
            const maxTop = window.innerHeight * 0.25;
            if (top > maxTop) top = maxTop;
            panel.style.left = left + 'px';
            panel.style.top = top + 'px';
            panel.style.transform = '';
            panel.style.right = '';
            panel.style.width = panelW + 'px';
          }
          // Mobile: CSS handles centering via fixed + translateY(-50%)
        }
      };
      justCell.appendChild(toggleBtn);
      justCell.appendChild(panel);

      const dateCell = document.createElement('div');
      dateCell.className = 'date-cell';
      const dateInp = document.createElement('input');
      dateInp.type = 'date';
      dateInp.title = 'Target completion date';
      dateInp.addEventListener('change', saveState);
      dateCell.appendChild(dateInp);

      const divider = document.createElement('span');
      divider.className = 'num-divider';

      objDiv.appendChild(numCell);
      objDiv.appendChild(divider);
      objDiv.appendChild(verdictCell);
      objDiv.appendChild(textCell);
      objDiv.appendChild(justCell);
      objDiv.appendChild(dateCell);
      objDiv.appendChild(doneCell);

      chBlock.appendChild(objDiv);
    });

    modDiv.appendChild(chBlock);
  });

  container.appendChild(modDiv);
});

const TOTAL = globalNum;
document.getElementById('totalCount').textContent = TOTAL;
document.getElementById('countAll').textContent = `(${TOTAL})`;
document.getElementById('countKeep').textContent = `(${totalKeep})`;
document.getElementById('countSkim').textContent = `(${totalSkim})`;
document.getElementById('countSkip').textContent = `(${totalSkip})`;

// Close panels on outside click
document.addEventListener('click', () => {
  document.querySelectorAll('.just-panel.open').forEach(p => {
    p.classList.remove('open');
    const cell = p.closest('.just-cell');
    if (cell) { const btn = cell.querySelector('.just-toggle'); if (btn) btn.textContent = 'Why →'; }
  });

});

// FILTER
const activeFilters = new Set(['all']);
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const f = btn.dataset.filter;
    if (f === 'all') {
      activeFilters.clear();
      activeFilters.add('all');
    } else {
      activeFilters.delete('all');
      if (activeFilters.has(f)) {
        activeFilters.delete(f);
        if (activeFilters.size === 0) activeFilters.add('all');
      } else {
        activeFilters.add(f);
      }
    }
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.toggle('active', activeFilters.has(b.dataset.filter));
    });
    applyFilter();
  });
});

function applyFilter() {
  const showAll = activeFilters.has('all');
  const showDone = activeFilters.has('done');
  const verdicts = new Set(['keep', 'skim', 'skip'].filter(v => activeFilters.has(v)));

  document.querySelectorAll('.obj-row').forEach(row => {
    const isDone = row.classList.contains('completed');
    const verdict = row.dataset.verdict;
    if (showAll) {
      row.classList.remove('hidden');
    } else {
      let visible;
      if (verdicts.size > 0 && showDone) {
        visible = verdicts.has(verdict) && isDone;
      } else if (showDone) {
        visible = isDone;
      } else {
        visible = verdicts.has(verdict);
      }
      row.classList.toggle('hidden', !visible);
    }
  });

  document.querySelectorAll('.chapter-block').forEach(block => {
    const rows = block.querySelectorAll('.obj-row');
    const anyVisible = [...rows].some(r => !r.classList.contains('hidden'));
    block.style.display = anyVisible ? '' : 'none';
  });
  document.querySelectorAll('.module').forEach(mod => {
    const blocks = mod.querySelectorAll('.chapter-block');
    const anyVisible = [...blocks].some(b => b.style.display !== 'none');
    const heading = mod.querySelector('.module-heading');
    if (heading) heading.style.display = anyVisible ? '' : 'none';
  });
}

// COUNTER
function updateCounter() {
  const done = document.querySelectorAll('input[type="checkbox"]:checked').length;
  document.getElementById('doneCount').textContent = done;
  const pct = Math.round((done / TOTAL) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
}

};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const STATE_REF = ref(db, 'pcp_planner/state');
let isSyncing = false;

function saveState() {
  const state = {};
  document.querySelectorAll('.obj-row').forEach(row => {
    const id = row.dataset.id;
    const cb = row.querySelector('input[type="checkbox"]');
    const dateInp = row.querySelector('input[type="date"]');
    state[id] = { done: cb.checked, date: dateInp ? dateInp.value : '' };
  });
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
  set(STATE_REF, state).catch(err => console.error('Firebase save error:', err));
}

function applyState(state) {
  if (!state) return;
  isSyncing = true;
  document.querySelectorAll('.obj-row').forEach(row => {
    const id = row.dataset.id;
    if (!state[id]) return;
    const cb = row.querySelector('input[type="checkbox"]');
    const dateInp = row.querySelector('input[type="date"]');
    if (state[id].done) { cb.checked = true; row.classList.add('completed'); }
    else { cb.checked = false; row.classList.remove('completed'); }
    if (dateInp && state[id].date) dateInp.value = state[id].date;
  });
  updateCounter();
  isSyncing = false;
}

onValue(STATE_REF, (snapshot) => { if (!isSyncing) applyState(snapshot.val()); });

(function loadLocal() {
  let state;
  try { state = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch(e) {}
  if (state) applyState(state);
})();
