  {
    name: "Patient Assessment",
    chapters: [
      {
        name: "Chapter 9 — Human Development",
        sections: [
          { text: "Infants — vital signs, fontanelles, developmental milestones, reflexes", verdict: "keep", justification: "EMALB April 2025 guidelines include Child/Infant CPR and Paediatric protocols. Normal infant HR (100–160), RR (30–60), and bulging fontanelle as a sign of ↑ICP are tested in paediatric scenario exams.|||TAKEAWAY|||Infant normal: HR 100–160, RR 30–60, SBP 60–90 mmHg. Anterior fontanelle: open until 12–18 months — bulging = ↑ICP (meningitis, hydrocephalus, TBI); sunken = dehydration. Moro (startle), palmar grasp, and rooting reflexes present at birth; absent/asymmetric reflexes = neurologic compromise.|||FIELD|||A febrile infant with bulging fontanelle is meningitis until proven otherwise. That physical finding changes your transport priority (Priority 1), your communication to the ED, and your assessment of airway status. Always assess fontanelle on any sick infant call." },
          { text: "Toddlers and Preschoolers — airway differences, behavioral approach, vitals", verdict: "keep", justification: "EMALB paediatric scenarios require age-appropriate approach. Toddler airway is narrowed at cricoid cartilage — smaller OPA/NPA sizing, higher baseline RR. Approach affects cooperation and assessment accuracy.|||TAKEAWAY|||Toddler (1–3 yr): HR 80–130, RR 20–30, SBP 80–100. Preschool (3–5 yr): HR 80–120, RR 20–25. Airway anatomy: funnel-shaped narrowing at cricoid (not glottis) — uncuffed ET tube in young children to avoid cricoid compression. Developmental: parallel play, fear of separation, medical anxiety — kneel to their level, speak softly, don't separate from caregiver.|||FIELD|||A scared 3-year-old won't let you near them. Developmentally appropriate approach — get low, use calm voice, let them stay with caregiver, distract before assessing — determines whether you get an accurate assessment at all. Forcing examination on a combative toddler risks airway compromise from crying and agitation." },
          { text: "School-Age Children — vitals, communication strategies", verdict: "keep", justification: "Know normal vitals by age for EMALB scenario exams. School-age: HR 70–120, RR 15–30. Mature minor consent/assent is relevant to BCEHS A09 Refusal of Care guideline.|||TAKEAWAY|||School-age (6–12 yr): HR 70–120, RR 15–30, SBP 80–120. Can give accurate history when spoken to directly. Assent (child's agreement) is sought even if legal consent comes from parents/guardians. Children this age can tell you where it hurts and describe symptom onset — don't talk over them to the parent.|||FIELD|||School-age kids can give you accurate history if you engage them directly. 'Can you tell me where you feel the worst?' will get better clinical information than asking only the parent. Their self-report of pain, nausea, or chest tightness is clinically valid." },
          { text: "Adolescents (Teenagers) — confidentiality, substance use, vital signs", verdict: "keep", justification: "Mature minor doctrine is tested in EMALB jurisprudence — adolescents can consent/refuse if they demonstrate capacity. Adult-range vitals. Substance use calls are common and scenario-tested.|||TAKEAWAY|||Adolescent (13–17): vitals approach adult ranges. Mature minor doctrine (BC Health Care Consent Act): minors who demonstrate capacity (understand and appreciate their situation) can consent to or refuse treatment without parental involvement. Confidentiality applies to adolescent health information unless safety is at risk.|||FIELD|||A 16-year-old who overdosed may refuse transport and claim capacity. Capacity assessment for adolescents is real field work. When in doubt, CliniCall. Remember: a mature minor's confidentiality about substance use may be protected unless their safety requires disclosure." },
          { text: "Early and Middle Adults — normal physiologic baseline, stress response", verdict: "skim", justification: "Establishes your 'normal' reference. EMALB exams use adult baselines as the implicit standard. Know them but don't prioritize — they're assumed knowledge in every protocol.|||TAKEAWAY|||Early adults (19–40): peak physiologic function, minimal chronic disease. Normal: HR 60–100, RR 12–20, SBP 100–140, SpO2 ≥95%. Middle adults (40–60): increasing chronic disease burden, peak career stress. Lifestyle factors (smoking, sedentary, diet) drive most disease in this group.|||FIELD|||Your baseline for every abnormal finding. Every tachycardia, every hypoxia, every altered LOC is abnormal relative to these norms. Know them automatically." },
          { text: "Late Adults — polypharmacy, atypical presentations, fall risk, frailty", verdict: "keep", justification: "BCEHS CPG A12 (Safeguarding Vulnerable Adults) and EMALB written exams test atypical presentations in elderly. Silent MI, afebrile sepsis, and painless abdomen are high-yield. Polypharmacy affects nearly every drug decision.|||TAKEAWAY|||Age-related changes: blunted tachycardia (beta-blockers, conduction disease), decreased pain perception (silent MI, painless abdomen), reduced renal clearance (drug toxicity risk), brittle bones (minor MOI → major fracture). Atypical presentations: confusion may be the only sign of UTI, MI, stroke, or sepsis in elderly patients.|||FIELD|||The 82-year-old who is 'just confused': sepsis, silent MI, subdural from a fall 3 days ago, or medication toxicity. High index of suspicion for life-threatening causes of new-onset confusion in elderly. BGL, full medication list, fall history, and complete vitals before you conclude 'probably just dementia.'" },
        ]
      },
      {
        name: "Chapter 10 — Patient Communication",
        sections: [
          { text: "Internal and External Factors for Effective Communication — noise, bias, environment", verdict: "keep", justification: "EMALB practical exams grade communication as a competency throughout every station. Environmental factors (scene noise, bystanders, language barriers) must be actively managed. Cognitive bias (anchoring) causes missed diagnoses.|||TAKEAWAY|||Internal factors affecting communication: preconceptions, fatigue, emotional state, cognitive bias. External factors: background noise, bystanders, language barriers, patient's LOC or anxiety. Anchoring bias: forming a diagnosis early and filtering subsequent information through it — the most dangerous cognitive error in paramedicine.|||FIELD|||Scene noise, bystanders, language barriers: in the Lower Mainland's multicultural population, you'll regularly work through interpreters (family members, phone services, language lines). Know that interpretation accuracy decreases accuracy of SAMPLE history. Assess for interpreter bias — a family member may not translate exactly what the patient said." },
          { text: "Developing Rapport — active listening, empathy, open-ended questions", verdict: "keep", justification: "EMALB grading criteria assess therapeutic communication as a competency. BCEHS CPG A01 (Clinical Approach) requires shared decision-making support. Rapport directly affects history quality.|||TAKEAWAY|||Active listening: full attention, no interrupting, reflective responses ('it sounds like you've been having chest pain since this morning'). Open-ended questions first ('what brought you to call today?'), then focused questions ('where exactly does it hurt?'). Empathy: acknowledge emotion before proceeding with assessment ('I can see this is really frightening — let's figure out what's happening').  |||FIELD|||A patient in the DTES who has been mistreated by the healthcare system won't give you accurate history if you don't establish trust quickly. Rapport isn't soft — it's clinical information access. Two minutes of genuine engagement gets you better history than ten minutes of interrogation." },
          { text: "Conducting the Interview — SAMPLE, OPQRST, chief complaint", verdict: "keep", justification: "EMALB April 2025 Patient Assessment Model specifies History as a required Secondary Survey component. OPQRST and SAMPLE are the expected frameworks — examiners watch for systematic, complete history-taking.|||TAKEAWAY|||SAMPLE: Signs/Symptoms, Allergies, Medications, Past medical history, Last oral intake, Events leading to. OPQRST: Onset, Provocation/Palliation, Quality, Radiation, Severity (1–10), Time. Use OPQRST for any pain or symptom complaint first, then SAMPLE for context. Chief complaint is the patient's words — document verbatim.|||FIELD|||OPQRST and SAMPLE are your structure for every medical call. Without systematic history you miss things. The patient who 'just feels bad' might have a STEMI if you ask about radiation, diaphoresis, and nausea. Don't let the chief complaint anchor you before you've asked all the questions." },
          { text: "Common Interviewing Errors — leading questions, premature conclusions", verdict: "keep", justification: "Anchoring bias is a major cause of diagnostic error and a conceptual topic in EMALB written exams. The difference between leading and open-ended questions is tested.|||TAKEAWAY|||Leading questions: 'Does your chest hurt?' (yes/no) vs 'Where is your discomfort?' (open). Premature closure: deciding on a diagnosis before completing assessment. Anchoring bias: 'She's a DTES patient so it's probably an overdose' causes missed diagnosis of sepsis, TBI, or hypoglycemia. Ask the question before forming the conclusion.|||FIELD|||Anchoring is the most dangerous cognitive bias in paramedicine. The DTES patient who 'looks like an OD' who is actually in septic shock. The tachycardia you attribute to anxiety that turns out to be SVT. Ask ALL your questions before forming your working impression. Reassess and update your impression." },
          { text: "Nonverbal Skills — body language, positioning, eye contact", verdict: "skim", justification: "Nonverbal communication is implicitly assessed in EMALB practical scenarios but not explicitly graded as a standalone item. Know the principles and demonstrate them naturally.|||TAKEAWAY|||Nonverbal cues: maintain eye level (kneel if patient is on the ground), open posture (no crossed arms), eye contact (not staring), appropriate touch (reassuring hand on shoulder with permission). Nonverbal assessment: diaphoresis, pallor, guarding, facial expression of pain — these supplement and sometimes override verbal history.|||FIELD|||A patient who says they're fine but is diaphoretic, pale, and can't make eye contact is not fine. Your nonverbal read of the patient supplements their verbal history. Discordance between what a patient says and what their body shows is a red flag." },
          { text: "Assessing Mental Status — AVPU, GCS, orientation, cognitive screening", verdict: "keep", justification: "EMALB April 2025 Patient Assessment Model explicitly includes LOC assessment using AVPU as a Primary Survey step. GCS is required for TBI protocol documentation. Both are graded on every practical exam.|||TAKEAWAY|||AVPU: Alert, Voice (responds to), Pain (responds to), Unresponsive. GCS: Eyes (1–4) + Verbal (1–5) + Motor (1–6) = 3–15. GCS ≤8 = severe TBI, consider airway protection (ACP for intubation). Orientation: person, place, time, event — document all four. BGL on every patient with altered LOC — hypoglycemia is the most treatable cause.|||FIELD|||AVPU and GCS on every patient with any LOC concern. BGL on every altered patient — non-negotiable field habit. A GCS of 14 (confused) can deteriorate to 8 (needs airway) in minutes with an expanding intracranial bleed. Serial assessments with documented trends are more valuable than a single score." },
          { text: "Special Interview Situations — language barriers, violence, cognitive impairment", verdict: "keep", justification: "BCEHS CPG A-General includes Agitation and Combative Patients guidelines. EMALB scenarios may include altered or combative patients — safe approach, de-escalation, and proxy history are assessed.|||TAKEAWAY|||Language barriers: use professional interpreters when possible; family members may filter information. Agitated/combative patients: de-escalate before approaching, have police present if needed, consider physiologic cause (hypoglycemia, hypoxia, TBI, excited delirium) before assuming behavioral. Cognitive impairment: use closed simple questions, involve caregivers, check if behavior is baseline.|||FIELD|||You'll work calls with agitated patients, non-English speakers, patients with cognitive disabilities, and patients who are actively psychotic. Adapting your communication approach in real time is a core field skill. The patient who 'won't cooperate' may have a treatable medical cause for their behavior — always check BGL, SpO2, and pupils first." },
        ]
      },
      {
        name: "Chapter 11 — Research and Quality",
        sections: [
          { text: "The Role of Science in Paramedicine — evidence-based practice, levels of evidence", verdict: "skim", justification: "BCEHS CPGs are evidence-based and reference the Dalhousie PEBP project. Know EBP as the basis for protocols — not a primary exam topic.|||TAKEAWAY|||Evidence-based medicine hierarchy: systematic reviews/meta-analyses (highest) > RCTs > cohort studies > case-control > case reports > expert opinion (lowest). BCEHS CPGs synthesize the best available evidence for prehospital care decisions. EBP means using the best evidence + clinical expertise + patient values.|||FIELD|||When a patient or family challenges your treatment ('why are you giving that?'), being able to say 'this is the evidence-based standard of care' is more credible than 'this is what I was told to do.' You don't need to cite a study — knowing the evidence backs your practice gives you confidence." },
          { text: "Research Study Design — RCT, cohort, case-control, meta-analysis", verdict: "skip", justification: "Research methodology is not tested on EMALB PCP written or practical exams. Skip.|||TAKEAWAY|||RCT (randomized controlled trial): gold standard for causal inference — participants randomly assigned to treatment or control. Cohort study: follows exposed vs unexposed groups forward in time. Case-control: compares cases with controls retrospectively. Meta-analysis: pools multiple study results.|||FIELD|||Not field-relevant for EMALB exam prep. Relevant if you pursue graduate-level health sciences study." },
          { text: "Quality Management and Patient Safety — QI cycles, critical event review", verdict: "skim", justification: "BCEHS uses a rolling CPG update model with a 2026 full review planned. PCR documentation feeds QI. Know the concept — not a deep exam topic.|||TAKEAWAY|||QI process: identify problem → analyze root cause → develop intervention → implement → evaluate → sustain. Critical event reviews (CERs) analyze adverse events to identify system failures rather than individual blame. PCR data is aggregated to identify trends, protocol gaps, and training needs.|||FIELD|||Your PCR data is used to audit cardiac arrest survival rates, STEMI door-to-balloon times, and stroke response times in BCEHS. Accurate documentation contributes to system improvement that affects the next patient — not just the one you're documenting." },
        ]
      },
      {
        name: "Chapter 12 — Expanded EMS Systems and Community Paramedicine",
        sections: [
          { text: "What Is Community Paramedicine? — extended role paramedics, low-acuity care", verdict: "skim", justification: "BCEHS has an extensive CP guideline suite (CP 4.xx series) but CP is a separate licence endorsement from PCP. Know the concept; not tested on PCP licensing exams.|||TAKEAWAY|||Community Paramedicine (CP) expands the paramedic role beyond emergency response to include chronic disease management, preventive care, and home visits for high-frequency users of 911. In BC, CP programs operate under BCEHS CP CPG 4.xx series guidelines with additional training and endorsement beyond PCP base licence.|||FIELD|||If you're interested in a different role within BCEHS, CP programs in BC are expanding — particularly in rural areas and for complex vulnerable populations. Not currently field-relevant on a standard BLS truck, but worth knowing as a career option." },
          { text: "Paramedic-Initiated Nontransport and Screening for Medical Necessity", verdict: "skim", justification: "Emerging in BC via CP programs. Not on EMALB PCP written exam. Skim for professional awareness.|||TAKEAWAY|||Non-transport protocols allow paramedics to assess, treat, and refer patients to appropriate resources without transport to ED. Requires specific clinical criteria, documentation, and follow-up systems. In BC, limited PCP non-transport authority exists — primarily for BCEHS CP programs.|||FIELD|||Emerging in BC. Awareness level for now. The future of EMS in Canada likely involves more non-transport protocols to reduce ED overcrowding and better match care to need." },
        ]

      {
        name: "Chapter 13 — Airway Management and Ventilation",
        sections: [
          { text: "Anatomy of the Upper and Lower Airway — structures, landmarks, differences by age", verdict: "keep", justification: "Airway anatomy is foundational to every airway management decision and is tested on every EMALB practical exam scenario involving an airway component. Know landmarks for OPA/NPA sizing, BVM placement, and SGA insertion.|||TAKEAWAY|||Upper airway: nose/mouth → nasopharynx/oropharynx → hypopharynx → larynx. Key landmarks: vallecula (above epiglottis — blade tip for Mac laryngoscope), epiglottis, vocal cords, cricothyroid membrane (surgical airway site). Lower airway: trachea → carina → bronchi → alveoli. Adult narrowest point: glottis. Pediatric narrowest: cricoid cartilage.|||FIELD|||Knowing the cricothyroid membrane location by feel — midline, below thyroid cartilage notch, above sternal notch — is essential for needle cric and surgical airway. Practice this landmark identification on every patient during airway assessment, not only when you need the procedure." },
          { text: "Lung and Respiratory Volumes — TV, IRV, FRC, vital capacity", verdict: "keep", justification: "Respiratory volumes are background for understanding ventilatory failure, oxygen reserve, and safe apnea time. Relevant to BVM ventilation technique and understanding COPD physiology. Tested conceptually in EMALB written exams.|||TAKEAWAY|||Tidal volume (TV): ~500mL per breath at rest. Vital capacity (VC): maximum air moved in one breath (~3.5–4.5L). Functional residual capacity (FRC): air remaining after normal exhalation — provides O2 reservoir during apnea. Pre-oxygenation (3 min of 100% O2 via NRB) increases FRC and extends safe apnea time before desaturation.|||FIELD|||Pre-oxygenation before any airway intervention buys you time. A fully pre-oxygenated healthy adult can maintain SpO2 >90% for 3–5 minutes of apnea. A hypoxic or obese patient desaturates in <90 seconds. Pre-oxygenate aggressively before any SGA attempt." },
          { text: "Ventilation and Respiration — mechanics, control of breathing, hypoxic drive", verdict: "keep", justification: "Control of breathing and the 'hypoxic drive' myth (hypercapnic drive is primary — O2 supplementation does not suppress ventilation in COPD) are directly tested in EMALB written exams and scenario questions.|||TAKEAWAY|||Breathing is driven primarily by CO2 via central chemoreceptors (medulla) — rising PaCO2 increases ventilatory drive. Peripheral chemoreceptors (carotid bodies) respond to hypoxia as a backup. 'Hypoxic drive' in COPD: COPD patients may have chronically elevated CO2 but do NOT lose their drive to breathe from O2 therapy — a persistent but dangerous myth. Give O2 to maintain SpO2 88–92% in COPD; do NOT withhold O2 from a hypoxic patient.|||FIELD|||The COPD patient in respiratory distress who needs O2: give it. Target SpO2 88–92% in known COPD, but do not withhold O2 from a patient with SpO2 <85% citing 'hypoxic drive.' Withholding O2 from a hypoxic patient causes harm. The risk of hyperoxia is secondary to the risk of hypoxia." },
          { text: "Airway Evaluation — look, listen, feel; signs of obstruction and distress", verdict: "keep", justification: "Airway evaluation is step 1 of the primary survey and is graded on every EMALB practical scenario. Recognizing life-threatening airway problems drives the entire management algorithm.|||TAKEAWAY|||Look: chest rise, accessory muscle use (SCM, intercostals, suprasternal retraction), cyanosis, position (tripod = severe distress), level of distress. Listen: stridor (upper airway obstruction), wheezing (lower airway), gurgling (secretions), silence (complete obstruction or apnea). Feel: air movement from nose/mouth, tracheal position, crepitus.|||FIELD|||Silent chest in an asthmatic = the most dangerous sign — no air movement means no wheezing. A wheeze you can hear is moving air. The patient who goes quiet after severe bronchospasm is deteriorating, not improving. Treat immediately with high-flow O2, salbutamol, and Priority transport." },
          { text: "Airway Management — positioning, jaw thrust, head-tilt chin-lift", verdict: "keep", justification: "Basic airway positioning and maneuvers are step-one interventions on every EMALB practical scenario. Jaw thrust is mandatory when C-spine injury is suspected — head-tilt chin-lift is contraindicated.|||TAKEAWAY|||Head-tilt chin-lift: hyperextend head + lift chin — open airway for medical (non-trauma) patients. Jaw thrust: fingers behind mandibular angle, displace jaw anteriorly — C-spine neutral, used for trauma or unknown mechanism. Recovery position (left lateral): unconscious but breathing patient, protects airway from aspiration. Sniffing position in pediatrics: neutral head (large occiput already provides flexion in infants).|||FIELD|||Jaw thrust for every trauma patient until C-spine cleared or clinical judgment supports. The unconscious overdose patient: jaw thrust + recovery position + suction = airway protection until you place an adjunct. These basics save lives before any advanced airway is needed." },
          { text: "Airway Obstructions — partial vs complete, foreign body, FBAO management", verdict: "keep", justification: "FBAO management (Heimlich for adults/children >1yr, back blows/chest thrusts for infants) is tested on every EMALB primary survey and paediatric scenario. Complete obstruction = immediate intervention.|||TAKEAWAY|||Partial obstruction: air movement present, encourage coughing, monitor. Complete obstruction: no air movement, aphonia, cyanosis — act immediately. Adults/children >1 yr: Heimlich maneuver (subdiaphragmatic abdominal thrusts). Infants <1 yr: 5 back blows + 5 chest thrusts alternating. Unconscious patient: CPR compressions may dislodge object; check mouth before ventilation.|||FIELD|||The choking patient who goes silent and unconscious: begin CPR compressions immediately — the compression force can dislodge the object. After every 30 compressions, open the airway, look for the object (remove if visible), attempt ventilation. Don't do blind finger sweeps." },
          { text: "Suctioning — technique, catheters, duration, suction pressure", verdict: "keep", justification: "Suctioning is a graded component of airway management in EMALB practical exams. Knowing suction pressure, catheter selection, and duration limits prevents complications.|||TAKEAWAY|||Yankauer: rigid, for oropharyngeal secretions, vomit, blood. Flexible catheter: for nasotracheal suctioning or through adjuncts. Duration: maximum 10–15 seconds per suction attempt — hypoxia risk. Suction pressure: 80–120 mmHg (pediatric: lower). Pre-oxygenate before and after suctioning. Bradycardia during suctioning = vagal stimulation — stop, oxygenate.|||FIELD|||Gurgling airway on a scene = suction before BVM. Ventilating over secretions pushes them into the lungs. Suction first, then ventilate. The sequence: position → suction → OPA/NPA → BVM is the field airway algorithm for the unconscious patient." },
          { text: "Airway Adjuncts — OPA, NPA, sizing and insertion", verdict: "keep", justification: "OPA and NPA insertion are graded on every EMALB airway scenario. Sizing errors, wrong technique, or use in a semi-conscious patient (OPA) are common exam failures.|||TAKEAWAY|||OPA: measure corner of mouth to earlobe. Insert upside down (concave up), rotate 180° as you advance past the tongue, OR insert with tongue depressor (pediatric preferred). Contraindicated if gag reflex present — triggers vomiting. NPA: measure nostril to earlobe. Lubricate, insert bevel toward septum. Contraindicated with suspected basilar skull fracture.|||FIELD|||OPA in a semi-conscious patient → vomiting → aspiration. Check for gag before OPA. NPA is better tolerated in semi-conscious patients. Size matters: an OPA too short doesn't open the airway; too long pushes the epiglottis down. Measure before you insert." },
          { text: "Supplemental Oxygen Therapy and Delivery Devices — NC, NRB, BVM, Venturi", verdict: "keep", justification: "O2 delivery device selection and flow rates are tested on every EMALB respiratory scenario. Wrong device for the clinical situation (e.g., NC for severe hypoxia) is a graded error.|||TAKEAWAY|||Nasal cannula: 1–6 L/min → FiO2 24–44%. Simple mask: 6–10 L/min → FiO2 35–50%. Non-rebreather (NRB): 10–15 L/min → FiO2 60–90%. BVM with reservoir: 15 L/min → FiO2 ~100%. Target SpO2: ≥95% for most adults; 88–92% for COPD; ≥94% for ACS/stroke; ≥95% for pediatrics.|||FIELD|||The NRB is your highest flow non-ventilating O2 device. If a patient is spontaneously breathing but has SpO2 <90% on NRB, they need BVM-assisted ventilation. Don't wait for them to stop breathing — if SpO2 isn't improving on NRB with adequate seal, start assisting ventilation." },
          { text: "Assisted and Artificial Ventilation — BVM technique, rates, tidal volume", verdict: "keep", justification: "BVM ventilation technique is tested on every EMALB airway practical station. Proper mask seal, volume delivery, and rate are all graded. Over-ventilation (barotrauma, ↓venous return) and under-ventilation are both clinical problems.|||TAKEAWAY|||BVM ventilation: EC clamp for mask seal (thumb + index around mask, other three fingers lift mandible). Rate: adult 10–12/min, pediatric 12–20/min, infant 20/min. Tidal volume: enough to see chest rise (~500mL adult, 6–8 mL/kg pediatric). Two-person BVM: one holds mask seal with two hands (better seal), one squeezes bag — always preferred.|||FIELD|||One-person BVM with inadequate mask seal is a common field error. If SpO2 is not improving with BVM, check: mask seal, airway positioning, suction need, OPA placement. Two-person BVM is almost always better. Don't squeeze the bag hard and fast — slow, visible chest rise, 1 second per breath." },
          { text: "Advanced Airway Management — SGA devices (King LT, LMA, iGel)", verdict: "keep", justification: "Supraglottic airway (SGA) insertion is a PCP Schedule 1 skill. BCEHS CPG Airway Management specifies iGel or King LT as PCP scope. Proper insertion, confirmation, and ongoing monitoring are graded on EMALB practicals.|||TAKEAWAY|||SGA devices (iGel, King LT): blind insertion into hypopharynx, seal above larynx. Indications: unable to maintain BVM oxygenation, cardiac arrest. Insertion: size by patient weight/height (iGel color-coded), lubricate, insert along midline, inflate cuff (King LT), confirm with 5-point auscultation and waveform capnography if available. Monitor for displacement.|||FIELD|||SGA is your airway rescue when BVM fails or during cardiac arrest. Confirm placement with chest rise, epigastric auscultation (no gurgling), bilateral breath sounds, and SpO2 improvement. If in doubt, remove and BVM — an unrecognized esophageal placement with SGA is fatal." },
          { text: "Pharmacologic Adjuncts to Airway Management — RSI overview (ACP-level)", verdict: "skim", justification: "RSI is ACP scope in BC. PCPs need to understand what RSI is and when to call for ACP backup, but do not perform RSI. Skim for conceptual understanding.|||TAKEAWAY|||RSI (Rapid Sequence Intubation): sedation + paralysis to facilitate ET intubation. Medications: induction agent (ketamine or propofol) + neuromuscular blocker (succinylcholine or rocuronium). ACP procedure in BC. PCP role: recognize need for RSI (failed SGA, predicted difficult airway, deteriorating LOC), call for ACP backup, optimize pre-oxygenation before ACP arrival.|||FIELD|||When your patient needs an airway beyond your scope: call for ACP early, before the situation is desperate. Pre-oxygenate aggressively, position optimally, and have suction ready. Your job is to keep the patient alive until ACP arrives — not to improvise RSI." },
          { text: "Surgical and Nonsurgical Cricothyrotomy — needle cric, surgical technique", verdict: "skim", justification: "Surgical cric is ACP/CCP scope in BC. Needle cric (14G angiocath through cricothyroid membrane) may be within PCP rescue scope in BC per BCEHS CPG Can't Intubate Can't Oxygenate. Skim at awareness level.|||TAKEAWAY|||Cricothyrotomy indications: 'Can't intubate, can't oxygenate' (CICO) — failed all other airway attempts, SpO2 dropping, patient dying. Needle cric: 14G IV catheter through cricothyroid membrane, attach to oxygen source — buys time only (minutes, CO2 retention). Surgical cric (ACP): scalpel-finger-tube technique into cricothyroid membrane.|||FIELD|||CICO is the most stressful airway scenario in prehospital care. Know the location of the cricothyroid membrane by feel, know your BCEHS CPG algorithm, and call for ACP as early as possible in any difficult airway — before CICO becomes the scenario." },
        ]
      },
      {
        name: "Chapter 14 — Mechanical Ventilation",
        sections: [
          { text: "Mechanical Ventilation — modes, settings, volume vs pressure control", verdict: "skim", justification: "Mechanical ventilators are not standard PCP equipment in BC. Skim for awareness — you may transport intubated patients from scene to hospital when ACP is present.|||TAKEAWAY|||Volume-control: delivers set tidal volume — risk of barotrauma if airway resistance increases. Pressure-control: limits pressure, volume varies — better for compliant lungs. Key settings: tidal volume (~6–8 mL/kg ideal body weight), rate (12–14/min adult), FiO2, PEEP (positive end-expiratory pressure — prevents alveolar collapse).|||FIELD|||If you're transporting an ACP-intubated patient on a transport ventilator, know the basic alarm types: high pressure alarm (obstruction, ETT displacement, PTX), low pressure alarm (disconnection, cuff leak). Your job: monitor SpO2, ETCO2, hemodynamics, and call ACP for vent adjustments." },
          { text: "Ventilator Management — PEEP, FiO2, rate, tidal volume adjustments", verdict: "skim", justification: "Ventilator troubleshooting is not a primary PCP competency. Skim for awareness when transporting ACP-managed patients.|||TAKEAWAY|||DOPE mnemonic for intubated patient deterioration: Displacement (ETT moved), Obstruction (secretions, kinked tube), Pneumothorax (tension), Equipment failure. If a vented patient desaturates: disconnect from ventilator and BVM manually — you know BVM works.|||FIELD|||Ventilated patient deteriorating on transport: DOPE. Disconnect and BVM first — this both diagnoses equipment failure and provides immediate oxygenation while you troubleshoot. Don't try to fix the ventilator while the patient desaturates." },
        ]
      },
      {
        name: "Chapter 15 — Patient History",
        sections: [
          { text: "Content of the Patient History — CC, HPI, PMH, meds, allergies, social Hx", verdict: "keep", justification: "A complete patient history is graded on every EMALB practical exam scenario. Missing key elements (medications, allergies, PMH) during an exam scenario is a significant deduction.|||TAKEAWAY|||Complete history components: Chief Complaint (CC — patient's words), History of Present Illness (HPI — OPQRST), Past Medical History (PMH), Medications (names, doses, compliance), Allergies (drug and environmental, reaction type), Social history (smoking, ETOH, drugs, living situation), Family history (relevant only for chronic conditions). SAMPLE covers most components.|||FIELD|||The medication list is often the most clinically useful part of your history. Metoprolol + chest pain = probable cardiac history. Warfarin + head trauma = high risk for subdural. Lithium + confusion = possible toxicity. The medications tell you the diagnosis before you examine the patient." },
          { text: "Techniques for History Taking — OPQRST, SAMPLE, PASTE for respiratory", verdict: "keep", justification: "Systematic history frameworks are graded on EMALB practical exams. OPQRST and SAMPLE are the mandatory structures — AEIOU-TIPS and PASTE are additional tools for specific presentations.|||TAKEAWAY|||OPQRST for any pain/symptom. SAMPLE for contextual history. PASTE for respiratory: Provocation, Associated symptoms, Sputum, Talking (dyspnea on exertion?), Exercise tolerance. AEIOU-TIPS for altered mental status: Alcohol, Epilepsy, Insulin (hypo/hyperglycemia), Overdose/Opioids, Uremia, Trauma, Infection, Psychiatric, Stroke/Shock/Syncope.|||FIELD|||AEIOU-TIPS is your differential for every altered LOC call. Run through it systematically: BGL for insulin, pupils and track marks for opioids, fever for infection, focal deficits for stroke, BP for shock. Don't diagnose until you've excluded the treatable causes." },
          { text: "Getting a History on Sensitive Topics — trauma, substance use, mental health", verdict: "keep", justification: "Sensitive history-taking is assessed in EMALB practical scenarios involving psychiatric, substance use, and trauma presentations. Trauma-informed approach is a BCEHS clinical expectation.|||TAKEAWAY|||Trauma-informed history: use non-judgmental language, avoid labeling, ask permission before physical examination, offer choices. For substance use: 'What substances have you used today?' (not 'Have you been using drugs?'). For suicide: ask directly — 'Are you thinking about hurting yourself?' — asking does not increase suicide risk.|||FIELD|||Asking about substance use and self-harm directly and without judgment gets better clinical information. 'I ask all my patients about this' normalizes the question. A patient who feels judged will withhold information that changes your clinical management. Non-judgment is a clinical skill, not just a value." },
          { text: "Special Assessment Challenges — altered LOC, language barriers, pediatric", verdict: "keep", justification: "Special assessment situations are tested in EMALB practical scenarios. Knowing how to get a history when the patient cannot give one is a core clinical skill.|||TAKEAWAY|||Altered LOC: get history from family, bystanders, medical alert bracelet, medications in the home, PCR history if repeat caller. Language barrier: use phone interpreters, family (document relationship and potential bias), visual analog scales for pain. Pediatrics: ask both child and caregiver. Uncooperative: assess for medical cause (hypoglycemia, hypoxia, pain) before behavioral assumption.|||FIELD|||The overdose patient who can't give history: search the home for drug evidence, look for a Narcan kit (confirms opioid use), check medications in the cabinet, ask bystanders what happened before EMS arrived. Environment is your second historian when the patient can't talk." },
        ]
      },
      {
        name: "Chapter 16 — Physical Examination",
        sections: [
          { text: "Examination Techniques — inspection, palpation, percussion, auscultation", verdict: "keep", justification: "Physical examination technique is graded throughout EMALB practical exams. Using a systematic approach — inspection before palpation, auscultation before percussion in abdomen — demonstrates trained clinical practice.|||TAKEAWAY|||Inspection: visual assessment (color, symmetry, movement, deformity). Palpation: light then deep, assess tenderness, crepitus, pulses. Percussion: resonance (air), dullness (fluid/solid), tympany (gas). Auscultation: before palpation in abdominal exam (palpation can change bowel sounds). In chest: compare bilateral zones systematically.|||FIELD|||Systematic physical examination prevents missed findings. The chest exam with unilateral decreased breath sounds + tracheal deviation = tension pneumothorax until proven otherwise. The tender pulsatile abdominal mass = AAA. Finding these requires having a routine that ensures you assess every region every time." },
          { text: "Vital Signs — BP, HR, RR, SpO2, temp, BGL, GCS, pain scale", verdict: "keep", justification: "Vital signs are graded on every EMALB practical exam. Abnormal vital signs drive clinical decisions and transport priority. BGL is required for every altered patient.|||TAKEAWAY|||Adult normal vital signs: BP 100–140/60–90 mmHg, HR 60–100 bpm, RR 12–20/min, SpO2 ≥95%, Temp 36.1–37.8°C, BGL 4.0–8.0 mmol/L (fasting). Pain: numeric rating 0–10. Document all vital signs with time. Trend matters more than a single reading — a BP falling from 130 to 90 over 10 minutes is more concerning than a single BP of 90.|||FIELD|||Orthostatic vital signs (lying → sitting → standing) detect volume depletion: HR increase >20 bpm or SBP drop >20 mmHg on position change = significant hypovolemia even with normal lying BP. Useful in GI bleed, dehydration, and subtle shock presentations." },
          { text: "Equipment Used in the Physical Examination — stethoscope, BP cuff, glucometer", verdict: "keep", justification: "Proper equipment use is assessed in EMALB practical exams. Glucometer and 12-lead ECG use are endorsed PCP skills. Knowing equipment limitations (SpO2 in nail polish, CO poisoning) prevents clinical errors.|||TAKEAWAY|||Pulse oximetry limitations: inaccurate with CO poisoning (CO-Hgb reads as O2-Hgb), poor perfusion (cold, vasoconstriction), nail polish/dark pigmentation, arrhythmias. BP cuff size: too small → falsely high reading; too large → falsely low. Glucometer accuracy: ±15% at extremes of range — treat clinically, not numerically.|||FIELD|||SpO2 in CO poisoning: falsely normal. Suspect CO in any patient from a fire, running engine, or poorly ventilated space regardless of SpO2. The pulse oximeter lies to you in CO — your clinical picture and patient history are more reliable." },
          { text: "The Physical Examination — head-to-toe, focused, rapid trauma assessment", verdict: "keep", justification: "Physical examination approach (systematic head-to-toe vs focused) is a graded decision in EMALB practical exams. DCAP-BTLS is the standard palpation mnemonic for trauma patients.|||TAKEAWAY|||Rapid trauma assessment: systematic head-to-toe for significant MOI — every region in <60–90 seconds. DCAP-BTLS: Deformity, Contusion, Abrasion, Puncture/penetration, Burns, Tenderness, Lacerations, Swelling — assess every body region with this framework. Focused exam: for isolated injury or medical patient — targeted to chief complaint.|||FIELD|||DCAP-BTLS is your hands-on trauma exam. Run it head to toe on every significant MOI: open every shirt button, expose the chest, roll the patient (with C-spine control) to examine the back. The stab wound you didn't see because you didn't expose the patient is a sentinel event." },
          { text: "Physical Examination of Infants and Children — pediatric-specific findings", verdict: "keep", justification: "Pediatric physical examination differences are tested in EMALB pediatric scenario stations. Normal pediatric findings and exam adaptations are expected knowledge.|||TAKEAWAY|||Pediatric exam adaptations: anterior fontanelle in infants (open until 18 months — assess for bulging/sunken), large occiput (neutral head position for airway), soft cartilaginous ribs (subcostal retractions visible in respiratory distress), Babinski reflex (plantar extension) normal until 2 years. Broselow tape for weight/equipment sizing.|||FIELD|||Capillary refill >2 seconds in a child is abnormal — peripheral circulation assessment is more sensitive in kids than in adults. Mottling (irregular bluish-white skin pattern) in a child = shock or sepsis until proven otherwise. Pediatric circulatory shock can be severe with a normal BP — don't be falsely reassured by a 'normal' pediatric BP." },
          { text: "Recording Examination Findings — objective language, SOAP format, PCR", verdict: "keep", justification: "Documentation of physical examination findings is graded in EMALB practical exams and is a daily professional obligation. Objective vs subjective documentation has legal implications.|||TAKEAWAY|||SOAP format: Subjective (patient's history in their words), Objective (your examination findings — vital signs, physical exam), Assessment (your clinical impression), Plan (treatment and transport decision). Use objective language: 'GCS 13 (E3V4M6), pupils 4mm equal and reactive bilaterally' not 'patient seemed confused.' Document time of each vital sign and intervention.|||FIELD|||'Patient seemed agitated and uncooperative' is subjective and useless. 'Patient oriented to person only, GCS 13, resisted examination of right lower extremity — tenderness elicited' is objective and clinically informative. Documentation is a clinical skill — practice objective language on every call." },
        ]
      },
      {
        name: "Chapter 17 — Patient Assessment",
        sections: [
          { text: "Scene Assessment and Evaluation — BSI, safety, MOI, NOI, resources", verdict: "keep", justification: "Scene size-up is the first step of every EMALB patient assessment model and is graded as the opening of every practical scenario. Missing BSI or safety at scene size-up is a major point deduction.|||TAKEAWAY|||Scene size-up sequence: BSI (verbalize gloves/mask/gown as needed) → scene safety (hazards, violence risk) → MOI or NOI (mechanism of injury or nature of illness) → number of patients → additional resources needed (ACP, fire, police, additional units). Takes 5–10 seconds — do it every call.|||FIELD|||Scene safety is not a formality. In the Lower Mainland you'll attend calls with weapons, aggressive individuals, drug paraphernalia creating needlestick risk, structural hazards (unstable buildings, gas leaks), and bystanders with unknown intentions. Stage when in doubt." },
          { text: "The Initial Assessment — general impression, LOC, ABCs, priority", verdict: "keep", justification: "The primary survey/initial assessment is the first clinical action after scene size-up and is graded on every EMALB practical exam. Priority decision (immediate vs non-immediate transport) is the output of the primary survey.|||TAKEAWAY|||Primary survey: General impression (sick or not sick from doorway) → LOC (AVPU) → Airway (patent? threatened? open?) → Breathing (rate, effort, quality) → Circulation (pulse, skin color/temp/moisture, major bleeding) → Disability (GCS, pupils, BGL) → Expose (remove clothing to identify life threats). Priority 1 if: airway compromise, inadequate breathing, shock, GCS <14.|||FIELD|||The 'sick or not sick from the doorway' decision is the most important assessment you make. 30-year-old sitting up talking: probably not immediately dying. Same age, tripod position, cyanotic, silent chest: dying. Your eyes tell you before your hands do. Trust the sick feeling." },
          { text: "The Focused History and Physical Examination — medical vs trauma pathways", verdict: "keep", justification: "The focused history and physical exam is where most of the clinical decision-making happens. EMALB practical exams grade the completeness and relevance of your focused assessment.|||TAKEAWAY|||Medical pathway: full history (OPQRST + SAMPLE) → focused physical exam relevant to complaint → vital signs. Trauma: significant MOI → rapid head-to-toe (DCAP-BTLS) → then history while en route if Priority 1. Unstable patient = abbreviated history, load and go, continue assessment in the ambulance.|||FIELD|||The priority of history vs exam depends on stability. Conscious cardiac chest pain: full OPQRST before moving. Unconscious trauma patient: rapid exam, load and go in 10 minutes or less, get history en route from bystanders/family. Scene time is inversely proportional to patient criticality." },
          { text: "The Detailed Physical Examination — secondary survey, DCAP-BTLS", verdict: "keep", justification: "The secondary survey/detailed physical exam is performed en route or after stabilization. EMALB practical exams may extend to secondary survey documentation. Missing injuries on secondary is a graded error.|||TAKEAWAY|||Detailed secondary survey: systematic head (pupils, scalp, facial bones) → neck (JVD, tracheal position, c-spine) → chest (breath sounds, rib palpation) → abdomen (4 quadrants, peritoneal signs) → pelvis (compression) → extremities (6Ps) → posterior (spine, flanks). Check for missed injuries at every body region. DCAP-BTLS for each region.|||FIELD|||The secondary survey finds the injuries you missed in the primary. The fractured clavicle you didn't find initially. The abdominal tenderness in a patient who complained only of leg pain. Run the secondary on every significant trauma patient during transport — your primary assessment in a chaotic scene often misses things." },
          { text: "The Ongoing Assessment — serial vitals, treatment response, reassessment", verdict: "keep", justification: "Serial reassessment is a graded component of EMALB practical exams. Monitoring treatment response and documenting changes in patient condition are key clinical and legal requirements.|||TAKEAWAY|||Ongoing assessment frequency: Priority 1 (unstable) — reassess every 5 minutes. Priority 2 (stable) — reassess every 15 minutes. Reassessment includes: repeat primary survey (AVPU, ABCs), repeat vital signs, reassess chief complaint, evaluate treatment response (e.g., SpO2 after salbutamol, BP after NTG, BGL after D10W).|||FIELD|||Treatment response monitoring is how you know if what you're doing is working. Salbutamol for asthma: reassess SpO2, RR, and breath sounds at 5 minutes. D10W for hypoglycemia: recheck BGL at 10 minutes. NTG for chest pain: reassess pain score and BP at 5 minutes. Document the change — it's your evidence of clinical decision-making." },
        ]
      },
      {
        name: "Chapter 18 — Clinical Decisions",
        sections: [
          { text: "Critical Thinking and Clinical Decision Making — pattern recognition, heuristics", verdict: "keep", justification: "Clinical decision-making under pressure is a core paramedic competency assessed throughout EMALB practical exams. Understanding cognitive bias helps avoid diagnostic errors.|||TAKEAWAY|||Pattern recognition: rapidly matching presentation to known disease template (STEMI chest pain pattern, anaphylaxis pattern). Heuristics: mental shortcuts that work most of the time but fail under atypical presentations. Dangerous biases: anchoring (first impression drives all subsequent interpretation), availability bias (diagnosing the last interesting case you saw), confirmation bias (only noticing evidence that confirms your diagnosis).|||FIELD|||Your index of suspicion must remain high even after you have a working impression. The patient presenting as 'just drunk' gets BGL, pupils, and GCS every time. The chest pain patient who is 37 and fit gets a 12-lead regardless of how atypical the presentation is. Systemic thinking protects patients from cognitive shortcuts." },
          { text: "The Range of Patient Conditions — stable, serious, critical, cardiac arrest", verdict: "keep", justification: "Matching response intensity to patient acuity is a core clinical competency. EMALB practical exams grade the appropriateness of transport decision and intervention sequence.|||TAKEAWAY|||Stable: can be managed at scene, transport non-urgent. Serious: needs monitoring and intervention, transport Priority 2. Critical: immediate life threat, load and go Priority 1 with interventions en route. Cardiac arrest: CPR immediately, AED/defibrillation, ACP backup. The priority decision should be made within 60 seconds of patient contact.|||FIELD|||'Load and go vs stay and play' is the classic EMS decision. Penetrating trauma to the torso: load and go — time to surgery is what saves them, not your IV. Hypoglycemia: treat at scene — BGL will improve with D10W and the patient doesn't need the ED. Unstable cardiac arrest: CPR starts immediately, everything else is secondary." },
          { text: "From Theory to Practical Application — protocols, standing orders, judgment", verdict: "keep", justification: "Using protocols appropriately and knowing when to deviate (and call CliniCall) is a graded competency on EMALB exams and a daily field skill.|||TAKEAWAY|||BCEHS CPGs are your primary clinical decision tools — they represent the standard of care for your jurisdiction. Deviation from protocol requires clinical justification and is often appropriate in complex presentations. CliniCall is the mechanism for protocol deviation: call before you deviate, document the conversation and the physician's advice.|||FIELD|||The patient who doesn't fit a protocol exactly: that's when clinical judgment matters. A COPD patient with anaphylaxis — salbutamol and epinephrine both have theoretical concerns in context. CliniCall. Document: 'Consulted CliniCall re: epinephrine in patient with severe COPD and anaphylaxis. Dr. [name] advised...' This is how you protect yourself and your patient." },
        ]
      },
      {
        name: "Chapter 19 — Communications and Documentation",
        sections: [
          { text: "Phases of Communication — dispatch, scene, hospital handoff, documentation", verdict: "keep", justification: "Communication skills are assessed throughout EMALB practical exams — verbal hospital handoff is graded as a closing station in many exam scenarios. Structured communication prevents errors.|||TAKEAWAY|||Structured radio/verbal report (MIST or SBAR): Mechanism/Medical complaint, Injuries/Interventions, Signs/Vitals, Treatment en route. Hospital handoff: patient name, age, chief complaint, key history, exam findings, vitals trend, treatment given and response, current status. Clear, organized, and concise.|||FIELD|||Your hospital handoff takes 60–90 seconds. Practice the MIST format until it's automatic. The ED nurse is your partner in care — give them what they need to continue treatment without having to re-read your PCR before doing anything. 'Mr. Smith, 65, chest pain onset 45 min ago, STEMI on ECG, ASA given, no NTG due to hypotension, BP 88/60, now en route Priority 1.'" },
          { text: "Communicating by Radio — brevity, accuracy, professional language, codes", verdict: "keep", justification: "Radio communication is a daily field skill and is graded on EMALB practical exams during dispatch, en route, and hospital notification communications.|||TAKEAWAY|||Radio communication principles: identify yourself and unit (BCEHS Unit #), be brief and accurate, use plain language (not 10-codes in most BCEHS systems), speak clearly (avoid technical jargon with dispatch), document time of key radio contacts. ETOC (estimated time of contact): notify hospital 5–10 minutes before arrival for Priority 1 patients.|||FIELD|||Pre-alert the hospital for Priority 1 patients — STEMI, stroke, trauma, septic shock. Give them: patient age, chief complaint, your ETA, and what they need to prepare (cath lab activation, trauma team, stroke team). A 5-minute heads-up changes their response time and the patient's outcome." },
          { text: "Documentation — PCR components, objective vs subjective, legal standards", verdict: "keep", justification: "PCR documentation is graded on EMALB practical exams and is a daily professional and legal obligation. BCEHS has specific PCR standards that are audited.|||TAKEAWAY|||PCR is a legal document, medical record, billing record, and QI data source. Required components: demographics, dispatch information, times (dispatch/arrive scene/depart scene/arrive hospital), scene information, patient assessment findings, all interventions with times, all vital signs with times, patient response to treatment, receiving facility and handoff provider.|||FIELD|||Times on the PCR must be accurate — they are used in STEMI, stroke, and cardiac arrest audits. Retrospectively invented times are falsification of a legal record. If you forgot to note a time, write what you know and note that it's approximate. Accuracy with uncertainty is acceptable; fabrication is not." },
        ]
