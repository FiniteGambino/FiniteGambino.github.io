<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCP Study Planner — Nancy Caroline's Emergency Care in the Streets</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #4a0e0e;
    --blue: #7a1a1a;
    --mid: #b22222;
    --light: #faf0f0;
    --accent: #c8922a;
    --green: #2a7a4b;
    --green-bg: #edf7f1;
    --green-dark: #1e5c38;
    --amber: #b86c00;
    --amber-bg: #fff8ec;
    --amber-border: #f0c060;
    --red: #b83232;
    --red-bg: #fdf0f0;
    --red-border: #e8a0a0;
    --row-alt: #fdf8f8;
    --border: #ddc8c8;
    --text: #1a1010;
    --muted: #7a5a5a;
    --white: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #f5f0f0; color: var(--text); min-height: 100vh; font-size: 16px; }

  /* STICKY HEADER */
  .sticky-header {
    position: sticky; top: 0; z-index: 200;
    background: var(--navy);
    box-shadow: 0 4px 20px rgba(74,14,14,0.45);
    width: 100%;
  }
  .header-inner {
    max-width: 1280px; margin: 0 auto;
    padding: 14px 32px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
  }
  .header-title h1 { font-family: 'DM Serif Display', serif; font-size: 1.45rem; color: white; letter-spacing: 0.02em; }
  .header-title p { font-size: 0.88rem; color: #e0b0b0; margin-top: 2px; font-weight: 300; }

  .header-stats { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }

  .stat-pill {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.13);
    border-radius: 8px; padding: 6px 14px; text-align: center;
  }
  .stat-num { font-family: 'DM Serif Display', serif; font-size: 1.6rem; color: var(--accent); line-height: 1; }
  .stat-label { font-size: 0.65rem; color: #e0b0b0; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2px; }

  .progress-section { min-width: 160px; }
  .progress-label { font-size: 0.65rem; color: #e0b0b0; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 5px; }
  .progress-track { height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--mid), var(--accent)); width: 0%; transition: width 0.4s cubic-bezier(0.4,0,0.2,1); border-radius: 3px; }
  .progress-pct { font-size: 0.72rem; color: #e0b0b0; text-align: right; margin-top: 4px; }

  /* FILTER BAR */
  .filter-bar {
    background: white; border-bottom: 1px solid var(--border);
    position: sticky; top: 68px; z-index: 100;
    box-shadow: 0 2px 8px rgba(74,14,14,0.08);
  }
  @media (max-width: 600px) {
    .filter-bar { top: 0; position: sticky; }
    .sticky-header { position: relative; }
  }
  .filter-inner {
    max-width: 1280px; margin: 0 auto;
    padding: 10px 32px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .filter-label { font-size: 0.88rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-right: 4px; }
  .filter-btn {
    border: none; border-radius: 6px; padding: 6px 16px;
    font-size: 0.9rem; font-family: 'DM Sans', sans-serif; font-weight: 600;
    cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px;
  }
  .filter-btn.all { background: var(--navy); color: white; }
  .filter-btn.keep { background: var(--green-bg); color: var(--green-dark); border: 1px solid #a0d4b8; }
  .filter-btn.skim { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
  .filter-btn.skip { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
  .filter-btn.done { background: #f0f0f0; color: #666; border: 1px solid #ccc; }
  .filter-btn.active { box-shadow: 0 0 0 2px var(--mid); }
  .filter-btn .count { opacity: 0.7; font-weight: 400; }

  /* CONTAINER */
  .container { max-width: 1280px; margin: 0 auto; padding: 32px 32px 80px; }

  /* MODULE */
  .module { margin-bottom: 44px; }
  .module-heading {
    font-family: 'DM Serif Display', serif; font-size: 1.4rem; color: var(--navy);
    margin-bottom: 18px; padding-bottom: 10px; border-bottom: 3px solid var(--mid);
    display: flex; align-items: center; gap: 12px;
  }
  .mod-tag {
    font-size: 0.68rem; font-family: 'DM Sans', sans-serif; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase;
    background: var(--mid); color: white; padding: 3px 10px; border-radius: 3px; flex-shrink: 0;
  }

  /* CHAPTER BLOCK */
  .chapter-block { margin-bottom: 20px; border-radius: 8px; overflow: visible; box-shadow: 0 2px 10px rgba(74,14,14,0.12); }
  .chapter-header {
    background: var(--blue); color: white;
    padding: 10px 16px; font-family: 'DM Serif Display', serif; font-size: 1rem;
  }

  /* COLUMN HEADER ROW */
  .col-header-row {
    display: grid;
    grid-template-columns: 52px 52px 1fr 130px 160px 90px;
    background: #6a1010;
    font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: rgba(255,255,255,0.85);
  }
  .col-header-row > div { padding: 8px 12px; border-right: 1px solid rgba(255,255,255,0.1); }
  .col-header-row > div:last-child { border-right: none; }
  .col-center { text-align: center; }

  /* OBJ ROW */
  .obj-row {
    display: grid;
    grid-template-columns: 52px 52px 1fr 130px 160px 90px;
    border-top: 1px solid var(--border);
    transition: background 0.12s;
  }
  .obj-row:nth-child(even) { background: var(--row-alt); }
  .obj-row:nth-child(odd) { background: white; }
  .obj-row:hover { background: #fde8e8; }
  .obj-row.completed { background: var(--green-bg) !important; }
  .obj-row.completed .obj-text-cell { color: var(--muted); }
  .obj-row.hidden { display: none; }

  .obj-row > div {
    padding: 11px 14px;
    font-size: 1rem;
    border-right: 1px solid var(--border);
    display: flex; align-items: center;
  }
  .obj-row > div:last-child { border-right: none; }
  .num-divider { display: none; }

  /* NUM cell */
  .num-cell {
    justify-content: center; align-items: center;
    font-weight: 700; font-size: 0.9rem; color: var(--blue);
    background: var(--light) !important;
    flex-shrink: 0;
  }
  .obj-row.completed .num-cell { background: #c8ead8 !important; color: var(--green); }

  /* VERDICT badge */
  .verdict-cell { justify-content: center; align-items: center; }
  .verdict-badge {
    display: inline-block; padding: 3px 8px; border-radius: 4px;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    white-space: nowrap;
  }
  .verdict-keep { background: var(--green-bg); color: var(--green-dark); border: 1px solid #a0d4b8; }
  .verdict-skim { background: var(--amber-bg); color: var(--amber); border: 1px solid var(--amber-border); }
  .verdict-skip { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }

  /* OBJ TEXT */
  .obj-text-cell { line-height: 1.5; color: var(--text); }

  /* JUSTIFICATION */
  .just-cell { flex-direction: column; position: relative; justify-content: center; align-items: center; }
  .just-toggle {
    background: var(--light); border: 1px solid var(--border); border-radius: 5px;
    padding: 5px 12px; font-size: 0.84rem; font-weight: 600; color: var(--blue);
    cursor: pointer; white-space: nowrap; font-family: 'DM Sans', sans-serif;
    transition: all 0.15s; width: 100%;
  }
  .just-toggle:hover { background: var(--mid); color: white; border-color: var(--mid); }
  .just-panel {
    display: none; position: fixed; z-index: 500;
    background: white; border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 32px rgba(74,14,14,0.22);
    padding: 18px 20px; width: 520px; max-width: 92vw;
    font-size: 1rem; line-height: 1.75; color: var(--text);
    max-height: 70vh; overflow-y: auto;
  }
  .just-panel.open { display: block; }
  .just-panel-close {
    float: right; background: none; border: none; font-size: 1.1rem;
    cursor: pointer; color: var(--muted); margin: -4px -4px 8px 8px; line-height: 1;
  }

  /* DATE */
  .date-cell input[type="date"] {
    border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px;
    font-size: 0.88rem; font-family: 'DM Sans', sans-serif; color: var(--text);
    background: white; width: 100%; cursor: pointer;
  }
  .date-cell input:focus { outline: none; border-color: var(--mid); box-shadow: 0 0 0 2px rgba(178,34,34,0.15); }

  /* DONE */
  .done-cell { justify-content: center; align-items: center; }
  .col-done { display: flex; align-items: center; justify-content: center; }
  .check-wrap { position: relative; width: 26px; height: 26px; cursor: pointer; flex-shrink: 0; }
  .check-wrap input[type="checkbox"] { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; margin: 0; }
  .check-box {
    width: 26px; height: 26px; border: 2px solid var(--border); border-radius: 5px;
    background: white; display: flex; align-items: center; justify-content: center; transition: all 0.15s;
    pointer-events: none;
  }
  .check-wrap input:checked ~ .check-box { background: var(--green); border-color: var(--green); }
  .check-wrap input:checked ~ .check-box::after {
    content: ''; display: block; width: 6px; height: 11px;
    border: 2px solid white; border-top: none; border-left: none;
    transform: rotate(45deg) translate(-1px,-1px);
  }
  .check-wrap:hover .check-box { border-color: var(--mid); box-shadow: 0 0 0 3px rgba(178,34,34,0.15); }

  /* ── MODULE COLOUR THEMES ── */
  .module-1  .module-heading .mod-tag { background: #3892cc; }
  .module-1  .module-heading          { border-color: #67ccff; }
  .module-1  .chapter-header          { background: #3892cc; }
  .module-1  .col-header-row          { background: #2970a8; }

  .module-2  .module-heading .mod-tag { background: #29a575; }
  .module-2  .module-heading          { border-color: #4eefad; }
  .module-2  .chapter-header          { background: #29a575; }
  .module-2  .col-header-row          { background: #1e7d59; }

  .module-3  .module-heading .mod-tag { background: #9464cc; }
  .module-3  .module-heading          { border-color: #dca2ff; }
  .module-3  .chapter-header          { background: #9464cc; }
  .module-3  .col-header-row          { background: #7048a8; }

  .module-4  .module-heading .mod-tag { background: #e05f13; }
  .module-4  .module-heading          { border-color: #ff923a; }
  .module-4  .chapter-header          { background: #e05f13; }
  .module-4  .col-header-row          { background: #b04a0e; }

  .module-5  .module-heading .mod-tag { background: #ea4e4e; }
  .module-5  .module-heading          { border-color: #ff8e88; }
  .module-5  .chapter-header          { background: #ea4e4e; }
  .module-5  .col-header-row          { background: #c03a3a; }

  .module-6  .module-heading .mod-tag { background: #81c027; }
  .module-6  .module-heading          { border-color: #ccff4e; }
  .module-6  .chapter-header          { background: #81c027; }
  .module-6  .col-header-row          { background: #609018; }

  /* ── TABLET ── */
  @media (max-width: 900px) {
    .col-header-row, .obj-row { grid-template-columns: 44px 52px 1fr 110px 80px 76px; }
    .date-cell { display: none; }
    .just-panel { width: 92vw; }
  }

  /* ── MOBILE ── */
  @media (max-width: 600px) {
    body { font-size: 15px; }

    .header-inner {
      flex-direction: column; align-items: flex-start;
      padding: 12px 16px 10px; gap: 10px;
    }
    .header-title h1 { font-size: 1.1rem; }
    .header-title p { font-size: 0.78rem; }
    .header-stats { width: 100%; justify-content: space-between; }
    .stat-pill { padding: 4px 10px; }
    .stat-num { font-size: 1.3rem; }
    .progress-section { flex: 1; min-width: 0; }

    .sticky-header { position: relative; }
    .filter-bar { top: 0; }
    .filter-inner { padding: 8px 12px; gap: 8px; }
    .filter-label { display: none; }
    .filter-btn { padding: 5px 11px; font-size: 0.82rem; }

    .container { padding: 16px 12px 60px; }
    .module { margin-bottom: 28px; }
    .module-heading { font-size: 1.1rem; gap: 8px; }
    .chapter-header { font-size: 0.9rem; padding: 8px 12px; }
    .chapter-block { border-radius: 6px; }
    .col-header-row { display: none; }

    .obj-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      padding: 10px 12px 0;
    }

    .obj-row > div {
      border-right: none !important;
      padding: 0 !important;
      font-size: 0.92rem;
    }

    .num-cell {
      order: 1;
      flex: 0 0 auto;
      background: transparent !important;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      padding-right: 0 !important;
      padding-left: 0 !important;
      border-right: none !important;
      align-self: center;
      justify-content: center;
      min-width: 0;
      width: auto;
    }
    .obj-row.completed .num-cell { background: transparent !important; color: var(--green); }

    .num-divider {
      order: 2;
      display: block !important;
      width: 1px;
      height: 16px;
      background-color: var(--border);
      margin: 0 10px;
      flex-shrink: 0;
      align-self: center;
    }

    .verdict-cell {
      order: 3;
      flex: 0 0 auto;
      padding-left: 0 !important;
      align-self: center;
    }

    .done-cell {
      order: 4;
      flex: 0 0 auto;
      margin-left: auto;
      align-self: center;
    }

    .obj-text-cell {
      order: 5;
      flex: 0 0 100%;
      padding: 18px 0 18px !important;
      line-height: 1.55;
    }

    .just-cell {
      order: 6;
      flex: 0 0 auto;
      padding-bottom: 16px !important;
      padding-top: 0 !important;
      align-self: center;
    }
    .just-toggle { font-size: 0.85rem; padding: 7px 16px; width: auto; }

    .date-cell {
      order: 7;
      flex: 0 0 auto;
      margin-left: 12px;
      padding-left: 0 !important;
      padding-bottom: 16px !important;
      padding-top: 0 !important;
      display: flex;
      align-self: center;
    }
    .date-cell input[type="date"] { font-size: 0.84rem; width: 160px; padding: 6px 8px; }

    .obj-row::before {
      content: '';
      order: 6;
      flex: 1;
    }
    .obj-row::after {
      content: '';
      order: 8;
      flex: 1;
    }

    .just-panel {
      position: fixed;
      left: 8px !important; right: 8px !important;
      top: 50% !important;
      transform: translateY(-50%);
      width: auto !important;
      max-height: 75vh;
      font-size: 0.93rem;
      line-height: 1.65;
      z-index: 9999;
    }
  }
</style>
</head>
<body>

<div class="sticky-header">
  <div class="header-inner">
    <div class="header-title">
      <h1>PCP Study Planner — Nancy Caroline's Emergency Care</h1>
      <p>Nancy Caroline's Emergency Care in the Streets &nbsp;·&nbsp; Canadian Edition, 8th Ed. &nbsp;·&nbsp; 54 Chapters</p>
    </div>
    <div class="header-stats">
      <div class="stat-pill">
        <div class="stat-num" id="doneCount">0</div>
        <div class="stat-label">Complete</div>
      </div>
      <div class="stat-pill">
        <div class="stat-num" style="color:#e0b8b8" id="totalCount">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="progress-section">
        <div class="progress-label">Overall Progress</div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-pct" id="progressPct">0%</div>
      </div>
    </div>
  </div>
</div>

<div class="filter-bar">
  <div class="filter-inner">
    <span class="filter-label">Filter:</span>
    <button class="filter-btn all active" data-filter="all">All <span class="count" id="countAll"></span></button>
    <button class="filter-btn keep" data-filter="keep">✅ Keep <span class="count" id="countKeep"></span></button>
    <button class="filter-btn skim" data-filter="skim">⚪ Skim <span class="count" id="countSkim"></span></button>
    <button class="filter-btn skip" data-filter="skip">❌ Skip <span class="count" id="countSkip"></span></button>
    <button class="filter-btn done" data-filter="done">☑ Done</button>
  </div>
</div>

<div class="container" id="mainContent"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-database.js";

const MODULES = [
  {
    name: "Foundations of Paramedicine",
    chapters: [
      {
        name: "Chapter 1 — EMS Systems, Roles, and Responsibilities",
        sections: [
          { text: "The History of Paramedicine — origins and evolution of EMS in Canada", verdict: "skim", justification: "Background context only. EMALB written exam focuses on current regulatory framework, not historical trivia. Skim for general awareness; nothing here is directly tested.|||TAKEAWAY|||Modern Canadian paramedicine evolved from 1960s–70s US/UK systems. The Canada Health Act (1984) and the PAC's 2001 National Occupational Competency Profile (NOCP) are the two Canadian milestones that shaped current PCP scope and provincial licensing structures.|||FIELD|||Low direct field relevance. History gives context for why protocols look the way they do and helps when advocating for scope with physicians or the public." },
          { text: "The Paramedic System — structure of EMS in Canada, tiers of care", verdict: "keep", justification: "EMALB jurisprudence tests understanding of BC's tiered response system. Know the four tiers (EMR, PCP, ACP, CCP) and that BCEHS uses a mixed PCP/ACP model in the Lower Mainland.|||TAKEAWAY|||Canada uses four certification tiers: EMR (basic first responder), PCP (BLS + limited ALS), ACP (intubation, IV drug infusions, advanced airways), CCP (critical care transport). In BC, EMALB licences PCPs and ACPs; BCEHS dispatches based on acuity.|||FIELD|||You'll work ACP intercepts regularly — know what falls in their scope vs yours. EJV, IO, RSI, and many drug infusions are ACP scope. When calling for ACP, have your assessment ready and know specifically what you need from them." },
          { text: "Paramedic Education — entry-to-practice standards and programs", verdict: "skim", justification: "Know that EMALB requires a Board-recognized PCP program and COPR exams. Provincial program variability is not tested. Skim.|||TAKEAWAY|||BC PCP licensure requires: completion of an EMALB-recognized program, passing COPR written and practical exams, and maintaining an active EMALB licence with CE requirements. BC uses a 5-year licence renewal cycle.|||FIELD|||Relevant when precepting students from other provinces. Don't assume equivalency — a PCP from Ontario may have different drug endorsements and never used BCEHS CPGs." },
          { text: "National EMS Group Involvement — NAEMSP, CAEP, provincial regulators", verdict: "skip", justification: "National org trivia is not tested on EMALB written or practical exams. Your operational regulator in BC is EMALB under the Emergency Health Services Act. Skip.|||TAKEAWAY|||The Paramedic Association of Canada (PAC) and Paramedic Chiefs of Canada (PCC) set national frameworks; your regulator is EMALB; clinical authority is BCEHS via EPOS and CPGs.|||FIELD|||No direct field relevance for EMALB exam prep." },
          { text: "Licensure, Certification, and Registration — regulatory framework", verdict: "keep", justification: "EMALB jurisprudence exam directly tests this. Know: EMALB licences PCPs under the EHS Act; Schedule 1 (core PCP skills) vs Schedule 2 (endorsements requiring additional training — IV, IO, 12-lead, airway).|||TAKEAWAY|||In BC, PCPs are licenced by EMALB under the Emergency Health Services Act. Your licence specifies Schedule 1 (mandatory core) and Schedule 2 (endorsements). Working outside your endorsed scope is an EMALB violation. You must work under physician medical oversight via EPOS.|||FIELD|||Your scope is your legal protection. When a bystander physician or family asks you to do something outside your scope, 'That's not within my PCP scope in BC' is a complete answer. Document it and call CliniCall if needed." },
          { text: "Professionalism — attributes, behaviors, accountability", verdict: "keep", justification: "EMALB practical exams assess professional conduct throughout — graders observe demeanor, communication, and composure as much as clinical skills. Unprofessional conduct is grounds for EMALB discipline.|||TAKEAWAY|||Nancy Caroline identifies integrity as the single most important professional attribute. Others: empathy, self-motivation, communication, teamwork, patient advocacy, careful delivery of service. These are graded competencies in EMALB practicals, not just soft skills.|||FIELD|||First 30 seconds on scene sets the tone with patients, families, and FRs. Professionalism in the DTES means non-judgmental care regardless of presentation. Conduct in uniform — including social media — is subject to EMALB standards 24/7." },
          { text: "Roles and Responsibilities — primary vs extended care, scope of practice", verdict: "keep", justification: "EMALB exams test scope boundaries. PCP Schedule 1 covers core services; Schedule 2 endorsements have specific credentialing requirements. Patient advocacy is a tested professional responsibility.|||TAKEAWAY|||PCP responsibilities: preparation → response → scene management → assessment → treatment → transport → transfer of care → documentation. Patient advocacy means acting in the patient's best interest including when family or the system push back. Document all decisions.|||FIELD|||Two-PCP crew means you're making scope decisions together. When uncertain about a skill or drug, CliniCall. Post-call PCR is both a clinical and legal record — write it as if it will be read in court, because it might be." },
          { text: "Medical Direction — online vs offline, protocols, standing orders", verdict: "keep", justification: "BCEHS CPGs operate as treatment guidelines via offline medical oversight. EPOS provides online (CliniCall) direct medical oversight. EMALB exams test understanding of when online consultation is required.|||TAKEAWAY|||Offline medical direction = BCEHS CPGs written in advance. Online medical direction = CliniCall/EPOS physician consultation in real time. CliniCall is used for: cases outside protocol, medication orders beyond standard dosing, refusal-of-care situations, and clinical uncertainty.|||FIELD|||CliniCall is underused by new PCPs. In the Lower Mainland with complex multi-drug patients or atypical presentations, it provides both clinical guidance and legal protection. Calling is not weakness — it's appropriate use of your medical oversight system." },
          { text: "Improving System Quality — QI, continuous improvement, outcome tracking", verdict: "skim", justification: "Know the concept of PCR as a QI tool. BCEHS uses a rolling CPG update model. Not a primary EMALB exam topic — skim.|||TAKEAWAY|||CQI in EMS uses PCR data, critical event reviews, and outcome tracking to improve protocols and training. The PCR is the primary data input — accurate, detailed documentation directly enables system improvement and CPG revision.|||FIELD|||Your PCR feeds BCEHS QI data. Sloppy documentation at 3am has downstream effects: STEMI door-to-balloon audits, cardiac arrest outcome tracking, and protocol review all depend on what you write." },
        ]
      },
      {
        name: "Chapter 2 — The Well-Being of the Paramedic",
        sections: [
          { text: "Components of Well-Being — physical, mental, emotional, spiritual health", verdict: "keep", justification: "Occupational health knowledge is directly relevant to career longevity. EMALB may test occupational hazard awareness. Paramedic PTSD and burnout rates are among the highest of any profession in Canada.|||TAKEAWAY|||Physical fitness, sleep hygiene, and nutrition directly affect clinical performance. Night shift work disrupts circadian rhythms and increases cardiovascular risk. Chronic occupational stress activates the HPA axis leading to cortisol dysregulation, immune suppression, and PTSD. The textbook treats well-being as a professional responsibility.|||FIELD|||Running night shifts on an emergency car, sleep deprivation is your biggest clinical risk factor. Chronic fatigue impairs clinical decision-making equivalent to alcohol intoxication. Know your own signs of deteriorating mental health — engage EAP before crisis." },
          { text: "Stress — types, physiologic response, cumulative stress, CISD", verdict: "keep", justification: "EMALB practical exams assess composure under stress. Understanding stress physiology helps you recognize impairment in yourself and partners. CISM and peer support are BCEHS-available resources.|||TAKEAWAY|||Acute stress: sympathetic activation (↑HR, pupil dilation, reduced GI, ↑glucose). Prolonged activation → HPA dysregulation → PTSD. CISM (Critical Incident Stress Management) is a structured peer support tool used post-critical incident — not a clinical treatment but a recognized debriefing intervention.|||FIELD|||Paramedic PTSD rates in Canada exceed 20%. Recognize cumulative stress in your partner. BCEHS has peer support and EAP — use them before crisis. Pediatric calls, traumatic deaths, and patient suicides are the most common triggers for delayed stress responses in EMS." },
          { text: "Coping With Death and Dying — Kübler-Ross stages, professional boundaries", verdict: "keep", justification: "EMALB practical exams grade PPE use and scene safety assessment on every scenario station. BSI failure is an automatic practical exam fail. Scene safety precedes patient contact on every call.|||TAKEAWAY|||Standard precautions treat every patient as potentially infectious: gloves for all contact, mask + eye protection for airway procedures/splash risk, N95 for suspected airborne illness (TB, COVID). Scene violence assessment: read the environment before entering — agitation, weapons, unknown persons, drug paraphernalia.|||FIELD|||In the DTES and Lower Mainland, TB and bloodborne pathogen exposure risk is real. N95 for any patient with cough + weight loss + night sweats. Violence on EMS calls is common — if you don't feel safe, stage for police. No patient contact is worth a physical assault." },
          { text: "Emergency Vehicle Operations — fatigue, alertness, reaction time", verdict: "skim", justification: "EMALB practical exams may include DNR/MOST scenarios and family support. Kübler-Ross stages are tested content. MOST forms are daily clinical reality in BC — valid No CPR orders are legally binding.|||TAKEAWAY|||Kübler-Ross five stages: Denial, Anger, Bargaining, Depression, Acceptance — non-linear, patients cycle through in any order. In BC, No CPR orders and MOST (Medical Orders for Scope of Treatment) forms are legally binding when valid (physician signature, patient identified). Initiating unwanted CPR is assault.|||FIELD|||You will attend calls where resuscitation is not appropriate. Knowing how to support a grieving family in the minutes after a death — calmly, compassionately, without false hope — and how to take care of yourself afterward is a core paramedic competency. Debrief after difficult death calls." },
          { text: "Protecting Yourself — PPE, situational awareness, scene safety", verdict: "keep", justification: "EMS vehicle crashes are the leading cause of paramedic death. EMALB practical exams assess driving safety and proper lifting technique. WorkSafeBC obligations apply to all BCEHS operations.|||TAKEAWAY|||EMS vehicle crashes are the #1 cause of paramedic occupational death in North America. Lights-and-sirens driving increases crash risk 4-fold. Lower back injury from improper lifting is the most common disabling injury in EMS. Use proper body mechanics: leg-not-back, team lifts, power equipment.|||FIELD|||Treat code 3 driving as the most dangerous procedure you perform. The Lower Mainland's traffic density makes emergency driving genuinely hazardous. Use the stair chair and power stretcher — the 30-second time difference is not worth a disc herniation. Your career depends on your spine and your driving record." },
        ]
      },
      {
        name: "Chapter 3 — Illness and Injury Prevention",
        sections: [
          { text: "Injury Prevention and EMS — epidemiology, public health role of paramedicine", verdict: "skim", justification: "Injury prevention theory is not directly tested on EMALB written or practical exams. Skim for professional awareness — CP programs use this framework.|||TAKEAWAY|||The Haddon Matrix analyzes injury by host, agent, and environment across pre-event, event, and post-event phases. Primary prevention stops injury before it occurs (seatbelts); secondary reduces severity (airbags); tertiary minimizes consequences (EMS response). Paramedics operate primarily in tertiary prevention.|||FIELD|||Understanding injury epidemiology helps you recognize high-risk populations. The DTES has extremely high rates of preventable injury and overdose death — your field observations can feed upstream prevention programs through QI channels." },
          { text: "Principles of Injury Prevention — Haddon matrix, primary/secondary/tertiary prevention", verdict: "skim", justification: "EMS advocacy and community education roles are not tested on EMALB exams. Skim — relevant for CP programs and career development.|||TAKEAWAY|||EMS providers are uniquely positioned to observe injury patterns, unsafe environments, and at-risk populations. PCR data, when aggregated, drives public health interventions. Paramedics can directly educate patients on fall prevention, car seat use, and medication safety.|||FIELD|||In group home or community settings, your observations about unsafe conditions, repeated falls, or medication mismanagement can directly improve resident safety — document and report through appropriate channels." },
          { text: "Getting Started in Your Community — community paramedicine programs", verdict: "skip", justification: "Program development for injury prevention is not tested on EMALB PCP exams. Skip.|||TAKEAWAY|||Injury prevention programs require needs assessment, coalition building with community stakeholders, and outcome measurement. These are public health administration functions beyond PCP scope for exam purposes.|||FIELD|||Not directly field-relevant at the PCP level. Relevant if you pursue CP program work later in your career." },
          { text: "How Every Paramedic Can Be Involved — advocacy, education, outreach", verdict: "skip", justification: "Volunteerism in injury prevention is not a tested EMALB competency. Skip.|||TAKEAWAY|||Paramedics can contribute to prevention through CPR classes, school visits, safe-home assessments, and media advocacy. These activities build community trust and professional identity.|||FIELD|||Good for career development and fire department applications, but not a PCP licensing priority." },
        ]
      },
      {
        name: "Chapter 4 — Medical and Legal Issues",
        sections: [
          { text: "The Legal System in Canada — tort law, criminal vs civil liability", verdict: "keep", justification: "EMALB jurisprudence exam tests legal framework understanding. Know the difference between criminal (Crown vs accused) and civil (plaintiff vs defendant) liability, and what constitutes negligence in a prehospital context.|||TAKEAWAY|||Canada uses common law (case-based precedent) and statute law (legislation). Paramedic liability is primarily civil negligence: duty of care + breach + causation + damages. Criminal liability (criminal negligence causing bodily harm/death) requires gross departure from standards — a much higher threshold.|||FIELD|||Every ambulance call creates a duty of care once you respond. Abandonment of an established patient or improper refusal-of-care handling is a breach. Your PCR is your primary legal defence — document your assessment, findings, treatment, and patient response every time." },
          { text: "Legal Accountability of the Paramedic — duty to act, standard of care", verdict: "keep", justification: "Consent is tested on every EMALB practical exam station. Implied consent for unconscious adults, informed consent for competent patients, mature minor doctrine (BC Health Care Consent Act) are all exam content and daily field reality.|||TAKEAWAY|||Expressed consent: patient explicitly agrees. Implied consent: assumed for unconscious/incapacitated adults (reasonable person standard). Informed consent requires: disclosure of treatment plan, risks, alternatives, and confirmed patient capacity. In BC, capacity = patient must both understand AND appreciate their situation (Health Care Consent Act).|||FIELD|||Hardest consent situations: intoxicated patients refusing transport, patients with mental health conditions asserting capacity, adolescents refusing care. When in doubt about capacity, default is to treat and transport. Document your capacity assessment in detail — this is what protects you legally." },
          { text: "Negligence and Protection Against Negligence Claims — four elements of negligence", verdict: "keep", justification: "BCEHS CPG A09 (Refusal of Care) is an active guideline. Improper handling of a refusal is a major legal exposure and patient safety risk. A common EMALB exam station.|||TAKEAWAY|||Valid refusal requires: patient capacity, informed refusal (patient understands risks of refusing), and proper documentation. Use CliniCall for any refusal involving high-risk presentations (chest pain, altered LOC, hypoglycemia, overdose). BCEHS A09 specifies documentation requirements — patient signature when possible.|||FIELD|||A refusal-of-care call is one of your highest legal risk calls. The patient who refuses and dies creates liability if your capacity assessment and documentation were inadequate. Call CliniCall, document the risk disclosure conversation verbatim, and make at least one re-approach before leaving." },
          { text: "Licensure and Certification — practice permits, maintenance of competency", verdict: "keep", justification: "Negligence law is directly tested in EMALB jurisprudence. The four elements (duty, breach, causation, damages) are the framework for every legal analysis of paramedic conduct.|||TAKEAWAY|||Negligence = duty of care (established when you respond) + breach (failure to meet standard of care) + causation (breach caused harm) + damages (quantifiable harm resulted). Standard of care = what a reasonable, similarly-trained paramedic would do in the same circumstances.|||FIELD|||Your PCR is your legal defence document. Write it as if plaintiff's counsel will read it. Gaps in documentation are interpreted against you. 'If it wasn't documented, it wasn't done' is how courts and EMALB treat PCRs." },
          { text: "Paramedic–Patient Relationships — consent, refusal, capacity, DNR", verdict: "keep", justification: "EMALB jurisprudence tests BC FIPPA obligations. Patient health information is confidential; disclosure exceptions include legal compulsion, safety of others, and mandatory reporting.|||TAKEAWAY|||Patient health information cannot be disclosed without consent except: to other treating providers (need-to-know), mandatory reporting obligations (child abuse, gunshot wounds, reportable diseases), court orders, or imminent danger to others. BC Freedom of Information and Protection of Privacy Act (FIPPA) governs paramedic records.|||FIELD|||In the Lower Mainland, police frequently want patient information and bystanders ask about patients. Default answer to anyone other than treating providers: no disclosure without consent or legal compulsion. If a patient's words suggest imminent harm to another, you may have a duty to warn." },
          { text: "Crime Scene and Emergency Scene Responsibilities — preserving evidence, duty to report", verdict: "keep", justification: "EMALB jurisprudence and BC legislation (CFCSA, Public Health Act) create mandatory reporting obligations. These are tested on written exams and are non-negotiable legal duties in the field.|||TAKEAWAY|||BC mandatory reporting: suspected child abuse/neglect (CFCSA → report to MCFD 1-800-663-9122), gunshot and stab wounds (Police Act), certain communicable diseases (Public Health Act). Threshold for child abuse reporting is reasonable suspicion — not certainty. You report, not investigate.|||FIELD|||Child abuse mandatory reporting: suspicion is the threshold, not proof. Document physical findings objectively, caregiver's explanation verbatim, and any inconsistencies — then report to MCFD. Failure to report is a legal offence in BC. You are protected from liability for good-faith reports." },
          { text: "Documentation — PCR standards, accuracy, legal implications", verdict: "keep", justification: "PCR documentation is tested practically and in jurisprudence. EMALB exams assess completeness, accuracy, and appropriate terminology. BCEHS PCR standards are specific and audited.|||TAKEAWAY|||Complete PCR includes: patient demographics, chief complaint, full history (SAMPLE, OPQRST), primary and secondary assessment findings, all treatments with times and patient responses, all reassessments, and transfer-of-care documentation. Errors: single line strike-through with initials — never erase or white-out.|||FIELD|||Your PCR follows the patient and follows you. ED staff read it to understand pre-hospital findings. QI audits your performance. Lawyers use it in complaints. Write it clearly, completely, and immediately — memory degrades fast on shift. Vague language ('patient appeared unwell') is not documentation." },
          { text: "Reportable Cases — gunshot wounds, communicable diseases, child abuse", verdict: "keep", justification: "Crime scene management is tested in EMALB jurisprudence. Balancing patient care with evidence preservation is a real field challenge. BCEHS CPG A-General addresses scene management with police.|||TAKEAWAY|||Patient care always takes priority over evidence preservation, but minimize unnecessary scene disturbance. Document: scene condition on arrival, anything moved for patient care (with reason), patient's exact words, weapons or unusual findings, entry/exit path. Treat obvious-death scenes as crime scenes until confirmed otherwise.|||FIELD|||In the Lower Mainland you'll attend suspected homicides, suspicious deaths, and overdoses with unclear circumstances. Don't move bodies unless patient care requires it. Note your entry/exit path, what you touched and why. Coordinate with police — they are on scene for a reason; work with them." },
        ]
      },
      {
        name: "Chapter 5 — Ethical Issues",
        sections: [
          { text: "Medical Ethics — beneficence, non-maleficence, autonomy, justice", verdict: "keep", justification: "The four bioethical principles are tested in EMALB jurisprudence and appear in scenario-based ethical dilemmas. They form the framework for resolving clinical-ethical conflicts.|||TAKEAWAY|||Four principles: Autonomy (patient's right to self-determination), Beneficence (act in patient's best interest), Non-maleficence (do no harm), Justice (fair distribution of resources/treatment). Most EMS ethical dilemmas involve a conflict between autonomy and beneficence.|||FIELD|||The intoxicated patient refusing transport: autonomy vs beneficence. The DNR patient whose family demands resuscitation: autonomy vs family wishes. The framework doesn't resolve these — it structures your reasoning, documentation, and CliniCall conversations." },
          { text: "Patient Autonomy — right to refuse, informed consent, substitute decision makers", verdict: "keep", justification: "BCEHS CPG A-General Advance Care Planning and EMALB jurisprudence address advance directives and MOST forms. These are daily clinical realities in BC with legal force.|||TAKEAWAY|||In BC, advance directives including No CPR orders and MOST (Medical Orders for Scope of Treatment) are legally binding. MOST must be signed by a physician to be valid. Honour valid No CPR orders — initiating unwanted CPR on a patient with a valid DNR constitutes assault.|||FIELD|||Community calls to group homes, palliative patients at home, and care facilities frequently involve MOST forms and No CPR orders. Verify validity (physician signature, patient identity), honour the document, support the family, and document your actions. If in doubt, CliniCall." },
          { text: "Withholding or Withdrawing Resuscitation — DNR, MOST, family wishes", verdict: "keep", justification: "BCEHS CPG Termination of Resuscitation and Withholding Resuscitation are active guidelines. EMALB exams test obvious death criteria and when CPR may be withheld or terminated in the field.|||TAKEAWAY|||BCEHS criteria for withholding resuscitation: valid No CPR order, or obvious biological death (rigor mortis, dependent lividity, decomposition, decapitation, injuries incompatible with life). Termination of resuscitation (TOR) in the field requires meeting BCEHS CPG TOR criteria after ALS-level care has been delivered.|||FIELD|||You will arrive at calls where CPR has been started by bystanders but the patient meets obvious death criteria or has a valid No CPR order. Stopping resuscitation takes confidence — support the family, explain your actions calmly, and document everything. CliniCall is available if uncertain." },
          { text: "Conflicts in Professional Integrity and Roles — ethics of advocacy vs following orders", verdict: "skim", justification: "Ethical conflicts between protocols, patient needs, and personal values are EMALB jurisprudence topics and real career situations.|||TAKEAWAY|||Paramedics have a professional obligation to act ethically even when instructions conflict. If directed to do something clearly wrong (falsify a PCR, withhold indicated care), you must refuse and report through appropriate channels. Whistleblower protections exist under BC labour law.|||FIELD|||Rare but real: partner cutting corners, supervisor pressure to close a call inappropriately, or systemic issues. Document concerns and report through BCEHS channels. Your EMALB licence is personal — protect it. Following unethical orders is not a defence in a discipline proceeding." },
          { text: "Organ Donation — identification of potential donors, family discussion", verdict: "skip", justification: "EMS role in organ donation is limited — primarily preserving perfusion until hospital declaration. Not a primary EMALB exam topic but worth knowing.|||TAKEAWAY|||EMS role: optimize perfusion (oxygenation, BP support) in potential donors (severe TBI, cardiac arrest). In BC, BC Transplant coordinates donation decisions at the hospital level. Your job is to optimize resuscitation quality and transport speed.|||FIELD|||If you're running a traumatic cardiac arrest or severe TBI, your resuscitation quality directly affects whether that patient could donate organs. This framing can help sustain motivation during prolonged or distressing resuscitation attempts." },
          { text: "Ethics and EMS Research — informed consent in research, IRBs", verdict: "skip", justification: "Research ethics is not tested on EMALB PCP exams. Skim for professional awareness.|||TAKEAWAY|||EMS research involving patients requires REB (Research Ethics Board) oversight and informed consent where possible. Emergency research has special provisions for waiver of consent when the patient cannot consent and community benefit exists.|||FIELD|||If BCEHS asks you to participate in a research protocol (e.g., cardiac arrest intervention study), understand your role and the ethics clearance behind it. Patient participation must be voluntary." },
          { text: "Ethics in the EMS Workplace: Accountability — reporting colleagues, professionalism", verdict: "skim", justification: "Workplace ethics are not a primary EMALB exam topic but professional conduct obligations are real. Skim.|||TAKEAWAY|||Paramedics have an obligation to report impaired colleagues or unsafe practice to EMALB. Working while impaired (substance, fatigue, emotional distress) creates patient safety risk and personal legal liability. EAP and peer support exist before problems reach the regulatory level.|||FIELD|||If your partner shows up impaired, you have an obligation to prevent them from working. Patient safety comes first. BCEHS has a process — use it. Covering for a colleague who is impaired makes you complicit." },
        ]
      },
    ]

  {
    name: "Pathophysiology & Pharmacology",
    chapters: [
      {
        name: "Chapter 6 — Pathophysiology",
        sections: [
          { text: "Review of the Basic Cellular Systems — cell structure, organelles, function", verdict: "skim", justification: "Basic cell biology is background knowledge, not directly tested on EMALB exams. Skim — understand enough to support pathophysiology topics.|||TAKEAWAY|||Cells require oxygen, glucose, and electrolytes to maintain membrane potential and produce ATP via aerobic metabolism. Disruption of any of these drives cellular injury. The cell membrane controls what enters and exits via active transport, diffusion, and osmosis.|||FIELD|||Knowing cellular basics helps you understand why you treat hypoglycemia (no glucose = no ATP = cell death), why hypoxia is the final common pathway of most critical illness, and why electrolyte abnormalities cause arrhythmias." },
          { text: "Adaptations in Cells and Tissues — hypertrophy, atrophy, hyperplasia, metaplasia", verdict: "keep", justification: "Cellular adaptations are background for understanding common pathology seen on calls. Hypertrophy (heart failure, hypertension) and atrophy (muscle wasting in bedridden patients) are encountered in practice.|||TAKEAWAY|||Hypertrophy = cell enlargement (e.g., left ventricular hypertrophy in hypertension — increased O2 demand, reduced compliance). Atrophy = cell shrinkage (e.g., muscle wasting in immobilized patients). Hyperplasia = increased cell number (e.g., prostate). Dysplasia = disordered growth (pre-malignant).|||FIELD|||LVH on a 12-lead or echo report = patient has longstanding hypertension and is at high risk for diastolic heart failure, arrhythmia, and sudden cardiac death. This changes your index of suspicion for every cardiac call on that patient." },
          { text: "The Cellular Environment — fluid compartments, osmosis, diffusion", verdict: "keep", justification: "Fluid compartment physiology is essential for understanding IV fluid selection, hyponatremia/hypernatremia presentations, and pulmonary edema. Directly tested in EMALB pharmacology and vascular access scenarios.|||TAKEAWAY|||Total body water = ~60% body weight. Intracellular (40%) vs extracellular (20% — interstitial 15%, intravascular 5%). Osmolality drives fluid movement: water follows sodium. Isotonic fluids (NS, LR) stay in extracellular space. Hypotonic fluids shift into cells. Hypertonic pulls water from cells.|||FIELD|||Why D10W and not NS for hypoglycemia? Glucose enters cells and is metabolized, providing intracellular fuel without dangerous sodium loading. Why NS for hypovolemic shock? Isotonic — stays in the vascular space to restore circulating volume. Fluid selection is not arbitrary." },
          { text: "Acid–Base Balance — pH, buffers, respiratory and metabolic compensation", verdict: "keep", justification: "Acid-base physiology is directly tested in EMALB written exams and underlies interpretation of clinical presentations (Kussmaul breathing, hyperventilation). Critical for DKA, respiratory failure, and shock management.|||TAKEAWAY|||Normal pH: 7.35–7.45. Acidosis <7.35, alkalosis >7.45. Respiratory control: CO2 (carbonic acid) — hyperventilation blows off CO2, raises pH. Metabolic control: HCO3 — kidneys regulate. Kussmaul respirations (deep, labored) = respiratory compensation for metabolic acidosis (e.g., DKA).|||FIELD|||The patient breathing rapidly and deeply with a BGL of 28 mmol/L: Kussmaul breathing compensating for DKA metabolic acidosis. The COPD patient in respiratory failure who is 'not breathing fast enough': CO2 retention causing respiratory acidosis. Understanding acid-base helps you predict deterioration." },
          { text: "Cell Injury — hypoxia, ischemia, free radicals, apoptosis", verdict: "keep", justification: "Cell injury mechanisms underpin all critical illness. Understanding ischemia-reperfusion injury is essential for understanding why organ damage occurs in shock, cardiac arrest, and stroke — all high-yield EMALB topics.|||TAKEAWAY|||Hypoxia is the most common cause of cell injury. Ischemia = hypoxia + nutrient deprivation. Without O2, cells switch to anaerobic glycolysis → lactic acid → acidosis. ATP depletion → ion pump failure → cellular swelling → membrane rupture → necrosis. Reperfusion injury adds free radical damage when O2 is restored.|||FIELD|||Every minute of VF cardiac arrest = more ischemic cell death. Every minute of ischemic stroke = ~1.9 million neurons. This is why CPR quality and time-to-ROSC matter — you're racing against irreversible ischemic injury with every compression." },
          { text: "Genetics and Familial Disease — inherited conditions, risk factors", verdict: "skip", justification: "Genetics is not tested on EMALB PCP written or practical exams. Skip.|||TAKEAWAY|||Genetic predispositions affect drug metabolism (CYP450 variants), disease risk (familial hypercholesterolemia, BRCA), and treatment response. Not clinically actionable at the PCP level.|||FIELD|||No direct field relevance for EMALB exam prep. Awareness that family history affects disease risk is clinically implicit." },
          { text: "Hypoperfusion — mechanisms, classification of shock, cellular effects", verdict: "keep", justification: "Shock physiology is the most heavily tested pathophysiology topic on EMALB written exams. Every trauma and medical critical patient requires shock recognition and management.|||TAKEAWAY|||Shock = inadequate tissue perfusion. Four types: Hypovolemic (blood/fluid loss), Distributive (septic, anaphylactic, neurogenic — vasodilation), Cardiogenic (pump failure), Obstructive (tension PTX, tamponade). Compensated shock: normal BP via vasoconstriction. Decompensated: falling BP, high-priority transport immediately.|||FIELD|||Compensated shock is the one you miss because BP is still 'normal.' Tachycardia + pallor + diaphoresis + narrow pulse pressure = compensated hypovolemic shock in a trauma patient. Don't wait for hypotension to declare an emergency — by then you're already behind." },
          { text: "The Body's Self-Defence Mechanisms — innate vs adaptive immunity, inflammation", verdict: "keep", justification: "Immune and inflammatory physiology underpins anaphylaxis, sepsis, and many allergic/infectious presentations encountered on EMALB exam scenarios.|||TAKEAWAY|||Innate immunity: first-line non-specific (neutrophils, macrophages, complement). Adaptive immunity: specific (B-cells → antibodies, T-cells). IgE-mediated hypersensitivity (Type I) = anaphylaxis — mast cell degranulation → histamine → vasodilation, bronchoconstriction, angioedema. Onset: minutes.|||FIELD|||The bee sting patient who says 'I've been stung before and was fine': previous exposure sensitized them (IgE production) — the next sting can trigger anaphylaxis even if prior reactions were mild. Allergy history does not guarantee safety." },
          { text: "Acute and Chronic Inflammation — inflammatory mediators, signs of inflammation", verdict: "keep", justification: "SIRS (Systemic Inflammatory Response Syndrome) and sepsis pathophysiology are directly tested on EMALB exams and are among the most common medical calls you'll run.|||TAKEAWAY|||Signs of inflammation: redness (rubor), heat (calor), swelling (tumor), pain (dolor), loss of function. SIRS criteria: ≥2 of: temp >38°C or <36°C, HR >90, RR >20, WBC >12 or <4. Sepsis = SIRS + suspected infection source + organ dysfunction. Distributive shock from sepsis = vasodilation + maldistribution.|||FIELD|||The febrile patient with confusion, tachycardia, and a UTI history: this is sepsis until proven otherwise. Septic shock is one of the most common causes of preventable death. Early recognition, fluid resuscitation (30 mL/kg NS), and rapid transport to an ED matter — every hour of delayed treatment increases mortality." },
          { text: "Variances in Immunity and Inflammation — autoimmune conditions, immunodeficiency", verdict: "skim", justification: "Autoimmune and immunosuppression topics are background knowledge for understanding special populations but not primary EMALB exam content. Skim.|||TAKEAWAY|||Immunosuppressed patients (transplant recipients, chemotherapy, HIV/AIDS, corticosteroid users) present atypically — fever may be absent despite serious infection. Autoimmune diseases (lupus, rheumatoid arthritis) can cause pericarditis, pleuritis, and vasculitis that mimic other emergencies.|||FIELD|||Transplant patient + any infection sign = high-acuity patient. Their immunosuppression masks typical fever response. 'A little off' in a transplant patient is a hospital call. Document all immunosuppressive medications — they interact with many drugs you carry." },
          { text: "Stress and Disease — neuroendocrine response, cortisol, catecholamines", verdict: "skim", justification: "Stress physiology is background for understanding sympathetic response and why chronic stress causes disease. Not a primary EMALB exam topic. Skim.|||TAKEAWAY|||Physiologic stress activates the HPA axis → cortisol release → ↑glucose, ↑BP, anti-inflammatory effects. Catecholamines (epinephrine, norepinephrine) mediate the immediate sympathetic response. Chronic activation leads to allostatic load — cumulative physiologic wear from repeated stress exposure.|||FIELD|||Relevant to understanding why chronically stressed patients (DTES residents with complex social determinants of health) often have worse clinical presentations — chronic stress accelerates cardiovascular disease, diabetes, and immune dysfunction." },
        ]
      },
      {
        name: "Chapter 7 — Pharmacology",
        sections: [
          { text: "Historical Trends in Pharmacology — drug discovery, evidence-based use", verdict: "skip", justification: "Drug history is not tested on EMALB exams. Skip.|||TAKEAWAY|||Pharmacology evolved from plant-based remedies to synthetic compounds through randomized controlled trials. Modern drug approval requires Phase I-III trials. Not clinically actionable.|||FIELD|||No direct field relevance for EMALB exam prep." },
          { text: "Medication Names — generic vs trade, chemical names", verdict: "keep", justification: "EMALB exams and BCEHS CPG drug monographs use generic names exclusively. You must know both generic and common trade names for all drugs in your scope to avoid confusion at handoff and in communication.|||TAKEAWAY|||Generic name = INN (International Nonproprietary Name), used in all clinical and regulatory contexts. Trade name = brand (e.g., epinephrine vs Epipen, salbutamol vs Ventolin, acetylsalicylic acid vs Aspirin). EMALB drug monographs list generic names — know the generic to trade translation for all PCP drugs.|||FIELD|||Patient says 'I take Lopressor' — that's metoprolol, a beta-blocker, which is a contraindication to epinephrine dose calculation adjustments and affects heart rate response assessment. Drug name recognition is a patient safety skill." },
          { text: "Sources of Medications and Drug Information — pharmacopeia, formularies", verdict: "skim", justification: "Drug reference sources are relevant for ongoing professional development but not primary EMALB exam content. Know the BCEHS drug monographs are your clinical authority in BC.|||TAKEAWAY|||BCEHS April 2025 drug monographs are your authoritative drug reference for scope, dosing, and contraindications. The Compendium of Pharmaceuticals and Specialties (CPS) is the Canadian drug reference. The PDR is American and less relevant to BC practice.|||FIELD|||Your BCEHS CPGs and drug monographs are what you're examined on. Keep an updated copy accessible. When in doubt about a drug interaction or dose, CliniCall." },
          { text: "Canadian Regulation of Pharmaceuticals — Health Canada, controlled drugs, schedules", verdict: "keep", justification: "EMALB jurisprudence tests understanding of controlled substance regulations. PCPs carry Schedule I controlled substances (fentanyl, ketamine in some systems). Chain of custody, documentation, and waste requirements are legally mandated.|||TAKEAWAY|||Health Canada regulates drugs under the Food and Drugs Act and Controlled Drugs and Substances Act (CDSA). Narcotics and controlled substances require strict accounting: count at start/end of shift, document all doses given, waste witnessed and documented. Diversion of controlled substances is a criminal offence.|||FIELD|||Every controlled substance you administer requires witnessed waste documentation if not fully used. Discrepancies trigger a mandatory investigation. Know your drug counts at start of shift — discrepancies from the previous crew are not your problem if documented before you take the rig." },
          { text: "Special Considerations in Medication Therapy — pediatrics, geriatrics, pregnancy", verdict: "keep", justification: "Special population drug considerations are directly tested in EMALB scenario exams. Pediatric weight-based dosing, geriatric drug sensitivity, and pregnancy drug safety affect almost every call.|||TAKEAWAY|||Pediatrics: all drugs are weight-based (mg/kg) — use Broselow tape. Geriatrics: decreased renal/hepatic clearance → prolonged drug effect, lower doses needed; polypharmacy increases interaction risk. Pregnancy: avoid vasoconstrictors where possible; epinephrine still indicated for anaphylaxis (maternal survival = fetal survival).|||FIELD|||When giving any drug to a pregnant, pediatric, or renally compromised patient, the dose calculation process is different. Don't default to adult standard doses — use Broselow, weight-based formulas, or CliniCall for guidance." },
          { text: "Pharmacology and the Nervous System — ANS, sympathetic/parasympathetic", verdict: "keep", justification: "ANS pharmacology is the foundational framework for understanding most PCP drugs. Adrenergic agonists (epinephrine, salbutamol), antagonists (beta-blockers), and anticholinergic drugs all work via ANS receptors.|||TAKEAWAY|||Sympathetic (fight-or-flight): norepinephrine/epinephrine via alpha (vasoconstriction) and beta receptors (β1: ↑HR, ↑contractility; β2: bronchodilation, vasodilation). Parasympathetic (rest-and-digest): acetylcholine via muscarinic receptors (↓HR, ↑secretions, bronchoconstriction). Most EMS drugs modulate these pathways.|||FIELD|||Epinephrine is both alpha and beta agonist — in anaphylaxis it reverses bronchoconstriction (β2), increases HR/contractility (β1), and causes vasoconstriction (α1). Salbutamol is selective β2 — bronchodilation without the cardiac effects of full epinephrine. Atropine blocks muscarinic receptors → ↑HR (used for bradycardia)." },
          { text: "General Properties of Medications — half-life, onset, peak, duration", verdict: "keep", justification: "Drug property knowledge is tested in EMALB pharmacology written questions and is essential for safe drug administration and monitoring.|||TAKEAWAY|||Half-life: time for plasma concentration to halve — determines dosing frequency. Onset: time to clinical effect. Duration: how long effect lasts. Therapeutic index (TI) = toxic dose / therapeutic dose — a narrow TI (digoxin, lithium) means the difference between therapeutic and toxic dosing is small.|||FIELD|||Naloxone has a shorter half-life than most opioids — the patient who 'woke up' post-naloxone can re-narcotize when it wears off. Monitor them. Don't leave after reversal without ensuring they're going to definitive care or a safe environment." },
          { text: "Medication Forms — tablets, solutions, suspensions, sprays, patches", verdict: "keep", justification: "Drug form knowledge is directly tested in EMALB practical scenarios. Knowing the difference between a suspension (needs shaking) and a solution, and how to draw up drugs from different preparations, is a practical skill.|||TAKEAWAY|||Solutions: drug dissolved in solvent — stable, directly injectable. Suspensions: drug particles in liquid — shake before use. Sublingual tablets: dissolved under tongue for rapid absorption. Auto-injectors (EpiPen): fixed dose IM delivery. MDIs: metered dose inhalers — require proper technique. Transdermal patches: slow sustained release.|||FIELD|||Drawing up epinephrine for anaphylaxis: confirm concentration (1:1000 for IM, 1:10,000 for IV). Confirm concentration before every draw. A 10x epinephrine dosing error has caused cardiac arrest. Know your drug concentrations." },
          { text: "Routes of Medication Administration — PO, SL, IM, IN, IV, IO, INH", verdict: "keep", justification: "Routes of administration are tested on every EMALB drug administration scenario. Route selection determines onset speed, bioavailability, and clinical suitability.|||TAKEAWAY|||Route onset (fastest to slowest): IV (immediate) = IO > IM > IN > SL > PO > SC > Transdermal. IM: vastus lateralis for most IM drugs (EpiPen, glucagon). IN: naloxone via MAD device. SL: NTG, rapidly absorbed via sublingual plexus. IO: equivalent to IV in cardiac arrest — all IV drugs work via IO.|||FIELD|||In anaphylaxis: IM epinephrine (vastus lateralis) is the first-line route — NOT IV, unless the patient is in cardiac arrest. IM provides sustained absorption without the cardiovascular risks of IV epinephrine bolus. Know which drugs are IM only, IV only, and which can be given multiple ways." },
          { text: "Pharmacokinetics — absorption, distribution, metabolism, excretion (ADME)", verdict: "keep", justification: "ADME is foundational pharmacology tested in EMALB written exams. Understanding how drugs are processed explains drug interactions, variable patient responses, and special population dosing.|||TAKEAWAY|||Absorption: bioavailability depends on route and first-pass effect (oral drugs metabolized in liver before systemic circulation — reduces bioavailability). Distribution: lipid-soluble drugs cross blood-brain barrier; protein binding affects free drug concentration. Metabolism: primarily hepatic (CYP450 enzymes). Excretion: primarily renal — affected by renal failure.|||FIELD|||The elderly patient on multiple hepatic CYP450 metabolized drugs (warfarin, phenytoin, many antibiotics): adding a new drug can inhibit or induce CYP450, dramatically changing drug levels. This is why polypharmacy makes field drug decisions complex — CliniCall if uncertain." },
          { text: "Pharmacodynamics — receptor theory, agonists, antagonists, dose-response", verdict: "keep", justification: "Pharmacodynamics explains how drugs produce their effects and is tested in EMALB written pharmacology questions. Understanding agonists/antagonists underpins reversal agents (naloxone, flumazenil) and competitive inhibition.|||TAKEAWAY|||Agonist: drug that binds receptor and activates it (e.g., morphine at opioid receptor). Antagonist: binds receptor and blocks it (e.g., naloxone competitively displaces opioids). Partial agonist: activates receptor but with lower maximum effect. Dose-response curve shows minimum effective dose, therapeutic range, and toxic threshold.|||FIELD|||Naloxone is a competitive antagonist at opioid receptors — it works by out-competing opioids for receptor binding. With synthetic opioids (fentanyl, carfentanil), you may need higher or repeated naloxone doses because the synthetic opioid has very high receptor affinity. Don't assume one naloxone dose is enough." },
          { text: "Medication Classifications — by mechanism, receptor type, therapeutic class", verdict: "keep", justification: "Drug classification is essential for understanding clinical effects and anticipating drug interactions. EMALB exams test drugs by class and mechanism.|||TAKEAWAY|||Key PCP drug classes: Sympathomimetics (epinephrine, salbutamol), Anticholinergics (ipratropium, atropine), Analgesics (acetaminophen, ketorolac, fentanyl), Anticonvulsants (midazolam — ACP), Anticoagulants (ASA), Antihypoglycemics (D10W, glucagon), Vasodilators (NTG). Know class = know mechanism = know contraindications.|||FIELD|||Beta-blocker patient with anaphylaxis: epinephrine may be less effective (β receptors blocked). May require higher epinephrine doses and glucagon (which bypasses beta receptors) for refractory anaphylaxis. Knowing drug class interactions saves lives." },
        ]
      },
      {
        name: "Chapter 8 — Vascular Access and Medication Administration",
        sections: [
          { text: "Medical Asepsis and Routine Precautions — sterile technique, BSI, sharps disposal", verdict: "keep", justification: "BSI and aseptic technique are tested on every EMALB practical exam. Failure to demonstrate appropriate precautions is an automatic station fail.|||TAKEAWAY|||Medical asepsis: clean technique minimizing pathogen transmission. Sterile technique: used for invasive procedures (IV insertion, IO, urinary catheterization). Six Rights of Drug Administration: Right drug, Right dose, Right patient, Right route, Right time, Right documentation. All six must be verbalized and demonstrated on EMALB practicals.|||FIELD|||Verbalize BSI steps in EMALB practicals — don't just put on gloves silently. 'Ensuring BSI precautions — gloves on, assessing need for mask and eye protection given the airway management involved.' This narration demonstrates competency to examiners." },
          { text: "Fluids and Electrolytes — sodium, potassium, chloride, normal values", verdict: "keep", justification: "Electrolyte physiology is tested in EMALB written exams and is essential for understanding arrhythmias, seizures, and shock management.|||TAKEAWAY|||Normal values: Na+ 135–145, K+ 3.5–5.0, Cl- 95–105, Ca2+ 2.1–2.6 mmol/L. Hyperkalemia (K+ >5.5): peaked T waves, widened QRS, risk of VF — seen in renal failure. Hyponatremia (Na+ <135): confusion, seizure — seen in SIADH, excess free water. Hypocalcemia: tetany, carpopedal spasm, laryngospasm.|||FIELD|||The ESRD (end-stage renal disease) patient on dialysis who missed their session: assume hyperkalemia until proven otherwise. Peaked T waves on 12-lead, widened QRS = hyperkalemic emergency. Calcium gluconate is ACP scope — you need to recognize this and call for ACP backup." },
          { text: "Fluid and Electrolyte Movement — osmosis, hydrostatic pressure, oncotic pressure", verdict: "keep", justification: "Fluid movement physiology explains edema, pulmonary edema, and why different IV fluids behave differently. Tested in EMALB written pharmacology and pathophysiology questions.|||TAKEAWAY|||Osmosis: water moves toward higher solute concentration. Hydrostatic pressure: pushes fluid out of capillaries. Oncotic pressure: albumin in plasma pulls fluid back in. Third-spacing: fluid shifts from intravascular to interstitial (burns, sepsis, ascites) — causes hypovolemia despite normal or high total body water.|||FIELD|||The CHF patient with pulmonary edema has fluid in the wrong compartment — too much in interstitial/alveolar space. IV fluid will make them worse. The septic shock patient with capillary leak is third-spacing — they need fluid resuscitation despite appearing 'edematous.' Context determines fluid management." },
          { text: "IV Fluid Composition — NS, LR, D5W, colloids vs crystalloids", verdict: "keep", justification: "IV fluid selection is directly tested in EMALB written and practical exams. BCEHS CPG IV Maintenance Rate Calculation and fluid resuscitation protocols specify which fluids to use in which contexts.|||TAKEAWAY|||Normal Saline (0.9% NaCl): isotonic crystalloid — stays in extracellular space, first-line for hypovolemia. Lactated Ringer's: more physiologic (balanced electrolytes), preferred for large-volume resuscitation. D10W (10% dextrose): PCP glucose replacement for hypoglycemia — NOT D5W. Colloids (albumin): not in PCP scope.|||FIELD|||NS vs LR vs D10W decisions happen on every call with a line. Wrong fluid in wrong context has real consequences: excess NS in renal failure → hyperchloremic metabolic acidosis. D5W is not a glucose replacement — D10W is. Know your concentrations and indications cold." },
          { text: "IV Techniques and Administration — cannulation, drip rates, maintenance vs bolus", verdict: "keep", justification: "EMALB Schedule 2 IV endorsement requires 10 supervised successful IV starts. IV cannulation, drip rate calculation, and troubleshooting are tested practically and are daily field skills.|||TAKEAWAY|||IV cannulation: tourniquet proximal, vein selection (antecubital > forearm > hand), bevel up at 10–30°, confirm blood flash, advance catheter, remove needle, secure and dress. Drip rate (drops/min) = Volume (mL) × drop factor / Time (min). BCEHS standard drip set: 10 drops/mL. Macrodrip for fluid bolus, microdrip for maintenance.|||FIELD|||In the Lower Mainland, patients with destroyed peripheral veins from IV drug use are common. Antecubital, cephalic, basilic, and hand veins may all be gone. Know your alternatives: EJV, IO. Have a plan B before you start the IV attempt." },
          { text: "External Jugular Vein Cannulation — technique, indications", verdict: "keep", justification: "EJV cannulation is a BCEHS CPG skill procedure and a PCP Schedule 2 endorsement in BC post-M292. Know indications (failed peripheral access), technique, and contraindications.|||TAKEAWAY|||EJV indications: failed peripheral IV access in a patient needing IV access urgently. Technique: patient supine/Trendelenburg, head turned away, compress vein below clavicle, insert at 45° angle midpoint of vein, advance catheter, secure carefully. Contraindications: suspected cervical injury, bleeding disorders at site.|||FIELD|||DTES patient with no peripheral access who is hypoglycemic and unconscious needs D10W now. EJV gives you access when peripheral veins are unavailable. Practice this skill on every feasible training opportunity — you'll need it at the worst possible time." },
          { text: "Factors Affecting IV Flow Rates — catheter size, viscosity, height of bag", verdict: "keep", justification: "EMALB IV Maintenance Rate Calculation protocol is in the April 2025 exam guidelines. Know how to calculate drip rates and troubleshoot flow problems. IV math is tested written and practically.|||TAKEAWAY|||Flow rate ∝ (catheter diameter)⁴ / (fluid viscosity × tube length). Larger catheter = dramatically faster flow (16G flows ~4x faster than 20G). Bag height: higher = more hydrostatic pressure = faster flow. Fluid viscosity: colloids and PRBCs flow slower than crystalloids. Kinked tubing, clotted catheter, and infiltration all reduce flow.|||FIELD|||Troubleshooting slow drip in the field: check for kinking, confirm site for infiltration (swelling, pain, no blood return), check bag height, try flushing with NS. A clotted catheter needs re-site. Don't push fluid through resistance — you may be infiltrating." },
          { text: "Potential Complications of IV Therapy — infiltration, phlebitis, air embolism", verdict: "keep", justification: "Recognizing and managing IV complications is tested practically. Infiltration (most common) requires removal and re-site. Air embolism prevention is a safety concern in IV maintenance.|||TAKEAWAY|||Infiltration: fluid/drug into surrounding tissue — signs: swelling, pain, no blood return, cool skin. Phlebitis: vein inflammation — signs: warmth, redness, tenderness along vein. Air embolism: air bolus into vein — risk when IV tubing changed without clamping. Prevention: prime tubing completely, clamp before disconnection.|||FIELD|||Infiltration in a patient who can't report pain (unconscious, intoxicated) means the drug is going into tissue instead of the vein. Always check for blood return and assess the IV site visually before pushing drugs. D10W infiltrating into subcutaneous tissue causes tissue irritation and necrosis." },
          { text: "Intraosseous Infusion — indications, sites, technique, EZ-IO", verdict: "keep", justification: "IO cannulation is a PCP Schedule 1 skill post-M292 in BC. BCEHS CPG Intraosseous Cannulation is active. Know: indications (failed IV in critical patient/cardiac arrest), proximal tibia and proximal humerus sites, EZ-IO device use.|||TAKEAWAY|||IO indications: failed peripheral IV access in patient in cardiac arrest, shock, or immediate life threat. Sites: proximal tibia (2 cm below tibial tuberosity, medial surface), proximal humerus (greater tubercle). EZ-IO: 15mm pink needle for most adults, 25mm yellow for obese, 45mm blue for >39kg pediatric. After placement: confirm no infiltration, flush with 10mL NS, all IV drugs work.|||FIELD|||IO is your backup when IV fails in a crashing patient. Cardiac arrest, anaphylactic shock, severe pediatric dehydration. EZ-IO into the proximal tibia in 5 seconds gives you vascular access equivalent to central line. Pain on infusion in conscious patients: consider lidocaine IO before fluid bolus." },
          { text: "Calculating Fluid Infusion Rates and Drug Doses — math, weight-based dosing", verdict: "keep", justification: "Drug math and IV rate calculations are tested on every EMALB written exam and many practical stations. Drug math errors in the field cause patient harm — automatic fail if incorrect on practicals.|||TAKEAWAY|||Drip rate (drops/min) = [Volume (mL) × drop factor (drops/mL)] / Time (min). Weight-based dose: dose (mg) = weight (kg) × dose (mg/kg). Concentration: dose (mL) = dose (mg) / concentration (mg/mL). Practice: D10W for 50kg patient with BGL of 2.0: 0.5g/kg = 25g ÷ 10g/100mL = 250mL D10W over 20–30 min.|||FIELD|||Drug math errors in the field are a real patient safety risk. Epinephrine 10x dose error has caused cardiac arrests. Practice your math until it is automatic. During high-stress scenarios, always verbalize your calculation and have your partner double-check before administration." },
          { text: "Enteral Medication Administration — oral, sublingual, rectal routes", verdict: "keep", justification: "SL NTG (0.4mg, max 3 doses), PO ASA (160–325mg chewable), and PO/PR acetaminophen are all in BCEHS CPG drug monographs. Route and dose are tested on cardiac and pain scenarios.|||TAKEAWAY|||Sublingual NTG: tablet or spray under tongue, rapid absorption (2–5 min onset), contraindicated if SBP <90, used PDE5i in last 24h, or HR <50. Chewable ASA: 160–325mg chewed (not swallowed whole) for ACS — chewing increases absorption speed. PO route: avoid if patient has swallowing impairment or decreased LOC.|||FIELD|||SL NTG for ACS chest pain: confirm BP ≥90 systolic, no PDE5 inhibitor use, give 0.4mg SL q5min max 3 doses while monitoring BP. ASA for suspected ACS: 160–325mg chewed. These two drugs together in the first 10 minutes of a cardiac call can significantly alter outcomes." },
          { text: "Parenteral Medication Administration — IM, SC, IV techniques", verdict: "keep", justification: "IM epinephrine (0.3mg 1:1000 into vastus lateralis) for anaphylaxis is in BCEHS CPG Anaphylaxis protocol. Site selection, technique, and dose are tested on anaphylaxis scenarios — missed epinephrine is an automatic fail.|||TAKEAWAY|||IM technique: 90° angle, vastus lateralis (outer mid-thigh) or deltoid. For anaphylaxis: epinephrine 1:1000, 0.3mg IM vastus lateralis (0.01mg/kg pediatric). SC: 45° angle, pinched skin, slower absorption than IM. IV push: confirm IV patency, inject over appropriate time (rapid for arrest drugs, slower for others).|||FIELD|||IM epinephrine into the vastus lateralis for anaphylaxis: speed and correct technique matter. The patient in laryngeal edema is minutes from respiratory arrest. Know: 1:1000 for IM (not 1:10,000), vastus lateralis (not deltoid for anaphylaxis — better absorption), 0.3mg adult dose. Repeat in 5 minutes if no improvement." },
          { text: "Medications Administered by the Inhalation Route — MDI, nebulizer technique", verdict: "keep", justification: "Nebulized salbutamol (2.5–5mg) and ipratropium (0.5mg) are in BCEHS CPG Asthma/COPD protocol. Nebulizer setup, mouthpiece technique, and drug mixing are tested practically on every respiratory scenario.|||TAKEAWAY|||Salbutamol (Ventolin): β2 agonist, bronchodilator — 2.5–5mg nebulized in 3mL NS at 6–8 L/min O2 flow, 5–10 min treatment. Ipratropium (Atrovent): anticholinergic, blocks bronchoconstriction — 0.5mg nebulized, combined with salbutamol in moderate-severe asthma/COPD. MDI technique: shake, exhale fully, slow deep breath in, hold 10 seconds.|||FIELD|||Nebulized salbutamol and ipratropium for asthma/COPD: in the Lower Mainland you'll run several respiratory calls per shift. Setting up the nebulizer, checking flow, placing the mouthpiece properly, and monitoring response (RR, SpO2, accessory muscle use) before and after is a routine field skill." },
        ]
      },
