  {
    name: "Trauma",
    chapters: [
      {
        name: "Chapter 20 — Trauma Systems and Mechanism of Injury",
        sections: [
          { text: "Trauma, Energy, Biomechanics, and Kinematics — Newton's laws, energy transfer", verdict: "keep", justification: "Kinematics of trauma is tested in EMALB written exams and drives your index of suspicion for hidden injuries. MOI predicts injury pattern before physical examination.|||TAKEAWAY|||Kinetic energy = ½mv². Velocity is squared — doubling speed quadruples injury energy. Three collisions in an MVC: vehicle hits object, occupant hits vehicle interior, organs hit internal structures. High-risk MOI: ejection, death in same vehicle, >30 km/h velocity change, rollover, unrestrained occupant, pedestrian vs vehicle.|||FIELD|||High-risk MOI = assume serious injury until proven otherwise. The unbelted driver at 80 km/h who 'feels fine': spinal cord injury from unrecognized mechanism is still a possibility. Your kinematics assessment tells you what to look for before you find it." },
          { text: "Types of Trauma — blunt vs penetrating, blast, crush", verdict: "keep", justification: "Trauma type determines injury pattern and guides examination priorities. EMALB written exams test blunt vs penetrating injury patterns.|||TAKEAWAY|||Blunt trauma: force distributed over area — deceleration injuries (organs continue moving after structure stops), shear injuries at points of fixation (aorta at ligamentum arteriosum), compression injuries. Penetrating: direct tissue destruction along wound track; blast: primary (pressure wave) → secondary (fragmentation) → tertiary (body thrown) → quaternary (burns, crush).|||FIELD|||Penetrating abdominal trauma: assume hollow organ injury (bowel, stomach) and vascular injury until proven otherwise. Don't remove impaled objects in the field — they may be the only thing tamponading a hemorrhage. Stabilize in place, transport Priority 1." },
          { text: "Multisystem Trauma — recognition, priority, load and go vs stay and play", verdict: "keep", justification: "Multisystem trauma management (Priority 1, load and go, limited scene time) is tested on EMALB trauma scenarios. Scene time goals are explicit in BCEHS trauma protocols.|||TAKEAWAY|||Multisystem trauma criteria (any one): GCS <14, SBP <90 or HR >120, RR <10 or >29, penetrating torso/head/neck/extremity proximal to elbow/knee, amputation proximal to wrist/ankle, two or more proximal long bone fractures, suspected spinal injury. Goal: scene time <10 minutes, en route Priority 1, continue assessment in ambulance.|||FIELD|||Scene time is inversely proportional to patient criticality in trauma. The golden hour is a concept — your job is to minimize the time between injury and definitive hemorrhage control (surgery). Every minute on scene with a hemorrhaging trauma patient is a minute closer to death. Load and go." },
          { text: "Trauma Centres and Triage — trauma team activation criteria, transport decisions", verdict: "keep", justification: "Trauma centre destination decisions are part of BCEHS Transport Destination protocol and are tested on EMALB written exams. Knowing when to bypass local ED for a trauma centre is a clinical and systems competency.|||TAKEAWAY|||In BC, Level I trauma centres: Vancouver General Hospital (adult), BC Children's Hospital (pediatric), Royal Columbian Hospital. Trauma team activation criteria: significant MOI + physiologic instability or anatomic injury. Transport directly to trauma centre when physiologically or anatomically indicated — may bypass closer hospitals.|||FIELD|||In the Lower Mainland, you have direct access to VGH and RCH trauma centres. Know your transport protocols for trauma triage: penetrating torso trauma → VGH or RCH directly. Pediatric major trauma → BC Children's. Alert the receiving trauma team en route — their team activation depends on your pre-alert." },
          { text: "Trauma Lethal Triad — hypothermia, acidosis, coagulopathy", verdict: "keep", justification: "The lethal triad of trauma is tested in EMALB written exams and drives field management priorities (hemorrhage control, warming, appropriate fluid resuscitation).|||TAKEAWAY|||Lethal triad: Hypothermia (↓enzyme function → ↓clotting) + Acidosis (from tissue hypoperfusion and anaerobic metabolism → ↓clotting factor function) + Coagulopathy (from consumption and dilution of clotting factors). Each factor worsens the others — a positive feedback loop toward death. Prevention: hemorrhage control, cover patient, minimize IV fluid dilution, rapid transport.|||FIELD|||Cold, acidotic, coagulopathic trauma patient is in lethal triad. Every minute of uncontrolled hemorrhage worsens all three. Cover the patient early (even if not hypothermic yet — prevent it), control bleeding immediately, limit crystalloid resuscitation (dilutes clotting factors), and transport as fast as safely possible." },
        ]
      },
      {
        name: "Chapter 21 — Bleeding and Shock",
        sections: [
          { text: "Pathophysiology of Hemorrhage — classes I–IV, compensated vs decompensated", verdict: "keep", justification: "Hemorrhage classification and clinical signs of shock stages are tested in EMALB written exams and are the framework for every trauma assessment and resuscitation decision.|||TAKEAWAY|||Class I: <750mL (<15% blood volume) — minimal signs. Class II: 750–1500mL (15–30%) — tachycardia, anxiety, normal BP (compensated). Class III: 1500–2000mL (30–40%) — hypotension, confusion, tachycardia, pallor (decompensated). Class IV: >2000mL (>40%) — severe hypotension, absent radial pulses, unconscious, immediately life-threatening. Class II is the key to catch early.|||FIELD|||Compensated shock (Class II) has a normal BP. Tachycardia + pale cool diaphoretic skin + narrowed pulse pressure = compensated shock — don't wait for hypotension to act. By the time BP drops in a young healthy patient, they've lost >30% of their blood volume and are decompensating rapidly." },
          { text: "Assessment of a Bleeding Patient — external vs internal bleeding signs", verdict: "keep", justification: "Bleeding assessment integrates vital signs, exam findings, and MOI. EMALB trauma scenarios test recognition of internal hemorrhage (no visible bleeding, shock physiology).|||TAKEAWAY|||External bleeding: visible — control with direct pressure. Internal hemorrhage: inferred from MOI, shock physiology, and exam (abdominal tenderness, pelvic instability, thigh swelling from femur fracture, flank bruising from retroperitoneal bleed). Shock index = HR/SBP: >1.0 = significant hemorrhage; >1.4 = massive hemorrhage.|||FIELD|||The trauma patient with no external bleeding and shock physiology: internal hemorrhage until proven otherwise. Femur fracture alone can sequester 1–1.5L. Pelvic ring disruption: up to 3–4L. Intra-abdominal: unlimited. Your assessment of mechanism + physiology identifies internal hemorrhage before you can see it." },
          { text: "Treatment of a Bleeding Patient — direct pressure, tourniquets, hemostatic dressings", verdict: "keep", justification: "Hemorrhage control is the most time-critical trauma intervention. EMALB practical exams grade tourniquet application, wound packing, and pressure dressing techniques.|||TAKEAWAY|||Hemorrhage control hierarchy: direct pressure → pressure dressing → tourniquet (extremity) → wound packing with hemostatic dressing (junctional/non-compressible wounds). Tourniquet application: 5–8 cm above wound, tighten until bleeding stops, note time of application, do not remove. Hemostatic gauze (QuikClot): pack wound with firm continuous pressure for 3 minutes.|||FIELD|||Tourniquet time starts the moment you apply it — document immediately. Tourniquet pain in conscious patients is intense but expected. 'The tourniquet is saving your life — the pain means it's working' is an appropriate response. Never remove a tourniquet in the field once applied — reperfusion injury and sudden massive hemorrhage are the risks." },
          { text: "Pelvic Trauma — pelvic binder, mechanism, blood loss potential", verdict: "keep", justification: "Pelvic fracture hemorrhage control with a pelvic binder is a PCP skill in BCEHS. Pelvic injuries are high-mortality trauma — early binder application is critical.|||TAKEAWAY|||Pelvic ring disruption (open-book fracture): can sequester 3–4L of blood in the pelvic space — sufficient to cause fatal hemorrhage. Mechanism: high-energy lateral or AP compression, falls from height. Pelvic binder: place at greater trochanters (not iliac crests), close and tighten to reduce pelvic volume. Do not repeatedly rock the pelvis to assess instability — it disrupts clots.|||FIELD|||Pelvic fracture assessment: check for instability once (one firm AP and lateral compression) — do not repeat. Apply binder immediately if suspected. A positive pelvic exam with shock physiology = Priority 1 transport with binder applied. The pelvic space is a black box — you cannot externally control bleeding; minimize blood loss by closing the volume." },
          { text: "Pathophysiology of Shock — distributive, hypovolemic, obstructive, cardiogenic", verdict: "keep", justification: "Shock classification and differentiation are directly tested in EMALB written exams and drive treatment decisions. Each type has a different mechanism, presentation, and management.|||TAKEAWAY|||Hypovolemic: fluid/blood loss → low preload → ↓CO → pale, cool, clammy, tachycardia. Distributive (septic, anaphylactic, neurogenic): vasodilation → ↓SVR → warm, flushed early (septic/neurogenic) or urticarial (anaphylaxis). Cardiogenic: pump failure → ↑preload, ↓CO → JVD, pulmonary edema, cool extremities. Obstructive (tension PTX, tamponade): mechanical obstruction → ↓CO → JVD + shock.|||FIELD|||Distributive (septic) shock: warm extremities, hypotension, fever/hypothermia = fluids + Priority transport. Obstructive (tension PTX): JVD + decreased breath sounds + tracheal deviation + shock = needle decompression immediately. Cardiogenic: JVD + pulmonary edema + shock = cautious fluid, CPAP (ACP), Priority transport — do not fluid-load." },
          { text: "General Assessment and Treatment of Shock — IV access, fluid resuscitation, positioning", verdict: "keep", justification: "Shock management including IV fluid resuscitation, permissive hypotension in trauma, and treatment priorities are tested in EMALB written and practical exams.|||TAKEAWAY|||Hypovolemic shock: IV access (two large-bore IVs if possible), NS or LR bolus, reassess. Permissive hypotension in trauma: target SBP 80–90 mmHg (not normal BP) — aggressive fluid resuscitation dilutes clotting factors and worsens coagulopathy. Exception: TBI — maintain SBP ≥90 for cerebral perfusion pressure. Priority transport over IV access.|||FIELD|||IV access in trauma: don't delay transport for a difficult IV. Two attempts en route is better than 10 minutes on scene. If IV cannot be established, IO is your backup. Permissive hypotension: in hemorrhagic shock without TBI, targeting SBP 80–90 (not normal) is the evidence-based approach — more fluid is not better." },
        ]
      },
      {
        name: "Chapter 22 — Soft-Tissue Injuries",
        sections: [
          { text: "Structure and Function of the Skin — layers, functions, wound healing phases", verdict: "keep", justification: "Skin anatomy and wound healing are background knowledge for understanding wound management and infection risk. EMALB exams test wound types and management priorities.|||TAKEAWAY|||Skin layers: epidermis (protection), dermis (vessels, nerves, appendages), hypodermis/subcutaneous fat. Functions: thermoregulation, barrier, sensory, immunologic. Wound healing phases: hemostasis (immediate, clotting), inflammatory (1–4 days, cleaning), proliferative (days–weeks, new tissue), remodeling (months–years, scar formation).|||FIELD|||Understanding wound depth helps you assess infection risk and the need for specialized care. Full-thickness wounds (through dermis) require suturing; partial-thickness wounds (abrasions, superficial burns) may heal without. Contaminated deep wounds = infection risk = document thoroughly and ensure ED awareness." },
          { text: "Closed vs Open Wounds — contusions, lacerations, avulsions, amputations", verdict: "keep", justification: "Wound classification is tested in EMALB practical exams. Open wound management (irrigation, dressing, controlling hemorrhage) is a graded skill.|||TAKEAWAY|||Closed wounds: contusion (bruise, no skin break), hematoma (blood collection), crush injury (no external wound but major internal damage). Open wounds: abrasion (superficial, skin surface), laceration (tear), avulsion (tissue flap torn partially or fully away), amputation (complete separation), penetrating (puncture, impalement). Priority for all: hemorrhage control first, then wound care.|||FIELD|||Avulsion with tissue flap: wrap avulsed tissue in saline-moistened dressing, do not remove, transport. Amputated part: wrap in moist dressing, place in plastic bag, cool (not frozen) — it may be replantable. Never place amputated parts directly on ice. Document time of amputation and preservation method." },
          { text: "Assessment and Management of Soft-Tissue Injuries — irrigation, dressings, splinting", verdict: "keep", justification: "Wound management is tested on EMALB practical exams. Key decisions: irrigate vs not, remove vs stabilize impaled objects, appropriate dressing selection.|||TAKEAWAY|||Wound irrigation: irrigate contaminated wounds with NS to reduce infection risk (field irrigation with pressure is effective). Impaled objects: stabilize in place with bulky dressing — do not remove (except in airway obstruction or when CPR cannot be performed). Dressings: dry sterile dressing for most wounds; occlusive dressing (Vaseline gauze or commercial) for open chest wounds (3-sided or vented).|||FIELD|||The impaled object rule: never remove in the field because it may be tamponading a major hemorrhage. The knife in the chest that's pulled out in the field is the knife that becomes immediately fatal. Stabilize it with a ring pad or bulky dressing and transport." },
          { text: "Crush Injuries — compartment syndrome, rhabdomyolysis, crush syndrome", verdict: "keep", justification: "Crush injuries and their systemic complications (rhabdomyolysis, hyperkalemia, renal failure) are EMALB written exam topics and occur in construction, MVA, and entrapment scenarios.|||TAKEAWAY|||Prolonged crush (>1 hour): muscle cell death releases myoglobin, potassium, and other intracellular contents. On release: 'crush syndrome' — sudden hyperkalemia (cardiac risk) and myoglobinuria (renal tubule precipitation → acute renal failure). Field management: aggressive IV fluid resuscitation (NS, not LR — LR contains potassium) before extraction to dilute release products.|||FIELD|||Crush syndrome is a medical emergency at the moment of rescue release, not at the time of crushing. Rapid release of a prolonged crush without fluid preparation can cause fatal hyperkalemia. Coordinate with fire/rescue: start large-bore IV and fluid infusion before extrication of prolonged entrapments. Alert hospital early for crush syndrome patients." },
          { text: "Blast Injury Assessment and Management — primary, secondary, tertiary, quaternary", verdict: "keep", justification: "Blast injury patterns are tested in EMALB written exams and CBRNE/terrorism awareness. Understanding the four phases predicts injury patterns.|||TAKEAWAY|||Primary blast: pressure wave → air-containing organs (tympanic membrane rupture, pulmonary barotrauma, bowel perforation, brain injury). Secondary: fragmentation → penetrating injuries. Tertiary: body thrown → blunt trauma, fractures. Quaternary: burns, chemical exposure, crush, inhalation. Tympanic membrane rupture in all survivors: screen for other primary blast injuries.|||FIELD|||Blast injury survivors with TM rupture may have internal blast lung injury (pulmonary barotrauma) with initially normal SpO2. Hyperbaric oxygen is not available prehospital — provide O2 via NRB, monitor closely, and transport Priority 1. Blast lung can deteriorate rapidly." },
        ]
      },
      {
        name: "Chapter 23 — Burns",
        sections: [
          { text: "Pathophysiology of Burns — zones of injury (coagulation, stasis, hyperemia)", verdict: "keep", justification: "Burn pathophysiology drives management priorities. EMALB exams test burn depth classification and systemic effects of major burns.|||TAKEAWAY|||Three zones: coagulation (central dead tissue — irreversible), stasis (potentially salvageable with adequate perfusion and cooling), hyperemia (outer zone, always recovers). Systemic effects of major burns (>20% TBSA): massive fluid shifts, inflammatory response, immunosuppression, hypermetabolic state. Airway involvement with inhalation injury dramatically worsens prognosis.|||FIELD|||The zone of stasis can convert to coagulation with inadequate cooling and fluid resuscitation. Early cool-water irrigation (15–20 min, stop if patient becomes hypothermic) preserves the zone of stasis. This is why burn cooling in the first 15 minutes after injury matters — it's the only field intervention that changes burn depth." },
          { text: "Carbon Monoxide Intoxication — mechanism, SpO2 limitation, treatment", verdict: "keep", justification: "CO poisoning is a common and frequently missed diagnosis in the Lower Mainland. SpO2 is unreliable in CO poisoning — clinical recognition is essential. Tested on EMALB written exams.|||TAKEAWAY|||CO binds hemoglobin with 250x affinity of O2 → carboxyhemoglobin (CO-Hgb) → functional anemia + impaired O2 delivery. Symptoms: headache, nausea, confusion, syncope, cherry-red skin (late, unreliable). SpO2 falsely normal (pulse oximeter cannot distinguish O2-Hgb from CO-Hgb). Treatment: 100% O2 via tight-fitting NRB (reduces CO half-life from 5 hours to 90 minutes).|||FIELD|||CO poisoning: think of it in any patient from a house fire, running car engine in enclosed space, gas appliances, or poorly ventilated generator. 'Multiple family members sick at same time' = CO until proven otherwise. 100% O2 immediately, remove from environment, consider hyperbaric oxygen referral at hospital for severe cases." },
          { text: "General Assessment of Burns — Rule of Nines, TBSA, depth classification", verdict: "keep", justification: "Burn size estimation (Rule of Nines) and depth classification are directly tested in EMALB written exams and drive triage to burn centres.|||TAKEAWAY|||Rule of Nines (adult): head 9%, each arm 9%, anterior trunk 18%, posterior trunk 18%, each leg 18%, genitalia 1%. Pediatric: head larger (18%), legs smaller. Burn depth: superficial (epidermis only — red, painful, dry, no blisters); partial-thickness (dermis involved — blisters, wet, painful); full-thickness (through dermis — white/brown/black, leathery, painless — nerve destruction).|||FIELD|||Full-thickness burns are painless — nerve endings are destroyed. A patient who reports no pain at the center of a burn has full-thickness injury, not reassuringly minor injury. The depth of burn determines fluid requirement, healing potential, and whether surgical grafting is needed." },
          { text: "Management of Burns — cooling, covering, fluid formula, circumferential burns", verdict: "keep", justification: "Burn management priorities are tested in EMALB written and practical exams. Airway management in inhalation injury and appropriate fluid resuscitation are key decision points.|||TAKEAWAY|||Cooling: cool water (not ice) to wound for 15–20 min within first 3 hours. Cover: dry sterile non-adherent dressing (wet dressings cause hypothermia in large burns). Fluid: Parkland formula — 4 mL/kg/% TBSA of NS or LR in 24h (PCP gives initial bolus, hospital calculates full). Airway: early intubation indication — singed facial/nasal hair, carbonaceous sputum, hoarse voice, stridor (airway edema can close airway completely within hours).|||FIELD|||Hoarse voice after burn = intubate now (ACP) or transport Priority 1 for emergency airway before edema closes it. The airway that is manageable at 30 minutes can be completely obstructed at 2 hours. Don't wait for stridor — by then the window for non-surgical intubation may be gone." },
          { text: "Transfer to a Burn Specialty Centre — transfer criteria, packaging", verdict: "keep", justification: "Burn centre transfer criteria are tested in EMALB written exams. Knowing which patients need a burn centre (vs local ED) is a triage decision.|||TAKEAWAY|||Burn centre criteria (any one): partial or full-thickness >10% TBSA (pediatric/elderly) or >20% TBSA (adult), any full-thickness burn, burns to face/hands/feet/genitalia/major joints, inhalation injury, electrical burns, chemical burns, burns with significant comorbidities. In BC: BC Children's Hospital (pediatric), VGH burn unit (adult).|||FIELD|||In the Lower Mainland, VGH has the regional burn unit for adults. Pre-alert for significant burns — the burn team needs to prepare. Adequate pain management en route (fentanyl in some systems, ketorolac, acetaminophen for PCP): partially-burnt areas (zone of stasis) are exquisitely painful — appropriate analgesia is both humane and reduces stress response." },
        ]
      },
      {
        name: "Chapter 24 — Head and Face Injuries",
        sections: [
          { text: "The Skull and Facial Bones — anatomy, fracture patterns, Le Fort classification", verdict: "keep", justification: "Skull and facial anatomy is foundational for head injury assessment. Basilar skull fracture signs (Battle's sign, raccoon eyes, CSF leak) are classic EMALB written exam content.|||TAKEAWAY|||Skull: frontal, parietal, temporal (thin — epidural hematoma risk), occipital. Facial: mandible (most commonly fractured), zygoma, orbit. Basilar skull fracture signs: Battle's sign (retroauricular ecchymosis — delayed), raccoon eyes (periorbital ecchymosis — delayed), CSF rhinorrhea (nasal fluid that doesn't clot — contains glucose), otorrhea. Le Fort fractures: I (palate), II (midface), III (craniofacial separation).|||FIELD|||Raccoon eyes and Battle's sign develop 12–24 hours after injury — you may not see them at the scene. But CSF rhinorrhea (clear fluid from nose that is watery and doesn't clot) can be present acutely. Never insert NPA in suspected basilar skull fracture — risk of intracranial placement through the fracture. Use OPA instead." },
          { text: "Head Injuries — primary vs secondary brain injury, herniation syndromes", verdict: "keep", justification: "Primary vs secondary brain injury and ICP management principles are directly tested in EMALB written exams and drive field management of TBI.|||TAKEAWAY|||Primary injury: direct trauma-induced — neuron death at moment of impact, not reversible. Secondary injury: cascade from primary — cerebral edema → ↑ICP → ↓cerebral perfusion pressure (CPP = MAP - ICP) → further ischemia. Field ICP management: prevent hypoxia (SpO2 ≥94%), prevent hypotension (SBP ≥90), prevent hyperthermia, avoid hyperventilation (use capnography — target EtCO2 35–45 mmHg).|||FIELD|||Hypoxia and hypotension are the two most preventable causes of secondary TBI death. SpO2 <90% for even one minute after TBI doubles mortality. SBP <90 mmHg in TBI → CPP drops → brain ischemia. Your job is to prevent secondary injury: oxygenate, maintain perfusion, avoid hyperventilation except for impending herniation (GCS rapidly dropping with blown pupil)." },
          { text: "Traumatic Brain Injuries — concussion, contusion, epidural/subdural hematoma", verdict: "keep", justification: "TBI classification and clinical presentation differences are tested in EMALB written exams. Epidural vs subdural hematoma presentation differences are classic exam content.|||TAKEAWAY|||Concussion: transient LOC or confusion, no structural damage, GCS returns to 15. Epidural hematoma: arterial bleed (middle meningeal artery — temporal skull fracture), lucid interval then rapid deterioration — neurosurgical emergency. Subdural hematoma: venous bleed, slower accumulation, may present days later (chronic subdural in elderly). Intracerebral: worst prognosis, deep bleeding.|||FIELD|||The 'lucid interval' of epidural hematoma: patient seemingly recovered after head strike, then rapidly deteriorates (fixed dilated pupil, decorticate posturing, GCS drops). This is a neurosurgical emergency — Priority 1 transport to trauma centre. Declining GCS trend is more alarming than any single GCS reading." },
          { text: "Assessment and Management of Head and Brain Injuries — GCS, SpO2 target, CO2 target", verdict: "keep", justification: "TBI assessment (serial GCS, pupils, SpO2/BP maintenance) is tested on EMALB trauma practical scenarios. Preventing secondary injury through appropriate oxygenation and perfusion targets is the core management goal.|||TAKEAWAY|||Serial GCS is the primary TBI monitoring tool: decreasing GCS trend = deterioration. Pupils: unilateral fixed dilated pupil (blown pupil) = uncal herniation, ipsilateral mass lesion — immediate neurosurgical emergency. Management targets: SpO2 ≥94%, SBP ≥90, EtCO2 35–45 mmHg (avoid hyperventilation), temperature control (normothermia), HOB 30° if no spinal injury.|||FIELD|||Blown pupil (one pupil fixed and dilated) in a deteriorating TBI patient: herniation is occurring. Priority 1 transport, consider brief hyperventilation (EtCO2 30–35 mmHg — NOT aggressive), call ahead to neurosurgery. This is one of the true neurosurgical emergencies where minutes make the difference between survival and death." },
          { text: "Eye, Ear, and Oral Injuries — assessment and management", verdict: "skim", justification: "Eye and facial injuries are not primary EMALB scenario topics. Skim — know basic field management.|||TAKEAWAY|||Chemical eye exposure: continuous irrigation with NS or water for minimum 20 minutes — do not delay transport for complete irrigation, continue en route. Avulsed tooth: preserve in milk or saline, handle by crown not root. Globe injury: cover with eye shield (rigid, no pressure), treat pain, Priority transport. No eye patches on open globe injuries.|||FIELD|||Chemical eye exposure: start irrigation immediately, do not wait for medical direction. Every minute of acid/alkali contact increases corneal damage. Irrigate en route if necessary — the eye takes priority over standing still." },
          { text: "Injuries to the Anterior Neck — laryngeal fracture, vascular injury, airway threat", verdict: "keep", justification: "Anterior neck trauma with airway involvement is a high-priority EMALB written and scenario topic. Laryngeal fracture is a difficult airway that can deteriorate rapidly.|||TAKEAWAY|||Anterior neck trauma: blunt (steering wheel, seatbelt, direct blow) or penetrating. Laryngeal fracture: hoarse voice, subcutaneous emphysema (crepitus on palpation), stridor, hemoptysis → rapidly progressive airway obstruction. Penetrating neck: zone II (thyroid to angle of mandible) — highest risk of vascular and airway injury. BVM may be impossible with laryngeal disruption.|||FIELD|||Anterior neck trauma with any hoarseness or subcutaneous emphysema: call for ACP, prepare for surgical airway, transport Priority 1. The patient who looks stable with a laryngeal fracture can lose their airway completely in minutes as edema progresses. Don't be fooled by initial stability." },
        ]
      },
      {
        name: "Chapter 25 — Spine and Nervous System Trauma",
        sections: [
          { text: "Spinal Anatomy and Physiology — vertebral levels, cord segments, dermatomes", verdict: "keep", justification: "Spinal anatomy and dermatome/myotome knowledge allows you to localize cord injuries from clinical findings. Tested in EMALB written exams and trauma scenario assessments.|||TAKEAWAY|||Cervical (C1–C7): arm/hand function, phrenic nerve (C3–C5 = diaphragm). Thoracic (T1–T12): intercostal muscles, trunk. Lumbar (L1–L5): legs. Sacral (S1–S5): bowel/bladder/sexual function. Dermatomes: C6=thumb, C7=middle finger, C8=little finger, T4=nipple line, T10=umbilicus, L4=medial leg, S1=lateral foot. Level of sensory/motor deficit indicates injury level.|||FIELD|||The C4 spinal cord injury patient loses phrenic nerve function → respiratory arrest (C3,4,5 keeps the diaphragm alive). A patient with high cervical injury may be awake but unable to breathe — immediate ventilatory support is required. Palpate the spine for step-off, tenderness, and crepitus on every trauma patient." },
          { text: "Mechanisms of Spinal Injury — flexion, extension, rotation, axial loading", verdict: "keep", justification: "MOI-based spinal injury risk assessment is the starting point for C-spine precaution decisions. BCEHS CPG Spinal Motion Restriction and Canadian C-Spine Rule are directly relevant to field practice.|||TAKEAWAY|||Flexion: anterior cord compression — most common (MVA, diving). Extension: posterior ligamentous injury — elderly with spondylosis at low-energy MOI. Axial loading: compressive fractures (jumping/landing, fall from height). Distraction: ligamentous rupture (hanging). High-risk MOI: MVC >100 km/h, fall >3× body height, high-speed sports, diving.|||FIELD|||MOI predicts injury risk before you assess the patient. Any high-risk MOI = spinal motion restriction until cleared clinically (Canadian C-Spine Rule) or radiologically. An awake, alert, neurologically intact patient can be cleared from SMR using the Canadian C-Spine Rule — you don't have to board every trauma patient." },
          { text: "Assessment of Spinal Injury — Canadian C-Spine Rule, NEXUS criteria", verdict: "keep", justification: "BCEHS CPG Spinal Motion Restriction references the Canadian C-Spine Rule (CCR) as a validated clinical decision tool. Using CCR appropriately is a clinical and medico-legal skill. Tested in EMALB written exams.|||TAKEAWAY|||Canadian C-Spine Rule indications to clear (no imaging needed): age <65, no dangerous MOI (fall >1m, axial load, MVC >100km/h, motorized recreational vehicle, bicycle collision, diving), no focal neurologic deficit, no painful distracting injury, and can actively rotate neck 45° bilaterally. If any CCR criterion is positive → SMR + transport. Neurologic exam: grip strength, ankle dorsiflexion, sensation in dermatomes.|||FIELD|||The Canadian C-Spine Rule lets you clinically clear appropriate patients from SMR without imaging — reducing scene time, improving patient comfort, and avoiding unnecessary immobilization. Know the 'high-risk' and 'low-risk' criteria cold. If the patient has pain with neck movement, altered LOC, or concerning MOI → SMR on." },
          { text: "Management of Spinal Injuries — c-collar, long board vs vacuum mattress, log roll", verdict: "keep", justification: "BCEHS CPG Spinal Motion Restriction (SMR) is the current BC protocol — away from rigid long board toward vacuum mattress and selective SMR. Tested in EMALB practical exams.|||TAKEAWAY|||Current evidence-based SMR: cervical collar + vacuum mattress preferred over rigid long board (long board increases pain and pressure injury without improving outcomes). Indications for SMR: high-risk MOI, focal neurologic deficit, spinal tenderness, altered LOC, distracting injury. Manual in-line stabilization during airway management when SMR applied.|||FIELD|||BCEHS has moved away from routine long-board boarding of all trauma patients. Vacuum mattress conforms to the patient's body, reduces pressure injury risk, and improves patient comfort for longer transports. Know the equipment on your truck and how to set it up quickly for a spine-injured patient." },
          { text: "Neurogenic Shock — mechanism, presentation, differentiation from hypovolemic shock", verdict: "keep", justification: "Neurogenic shock vs hypovolemic shock differentiation is a classic EMALB written exam question. Neurogenic shock is warm, bradycardic shock — the opposite of hypovolemic.|||TAKEAWAY|||Neurogenic shock: high cervical or thoracic spinal cord injury → loss of sympathetic tone → vasodilation + bradycardia (normal reflex would be tachycardia). Presentation: hypotension + bradycardia + warm, dry, flushed skin (no vasoconstriction). Contrast with hypovolemic: hypotension + tachycardia + cool, pale, clammy. Coexisting traumatic hemorrhage makes differentiation difficult.|||FIELD|||Trauma patient with SBP 80 and HR 55 and warm skin: think neurogenic shock from spinal injury. Trauma patient with SBP 80 and HR 135 and pale clammy skin: hemorrhagic shock. These are different diagnoses requiring different treatment approaches — bradycardia with hypotension after trauma is neurogenic shock until proven otherwise." },
        ]

      {
        name: "Chapter 26 — Thoracic Injuries",
        sections: [
          { text: "Rib Fractures and Flail Chest — paradoxical movement, respiratory failure risk", verdict: "keep", justification: "Rib fractures and flail chest are common trauma injuries with significant respiratory implications. Tested in EMALB written and practical exams.|||TAKEAWAY|||Rib fractures: painful breathing → splinting → atelectasis → pneumonia risk. Each rib fracture increases mortality by 19% in elderly. Flail chest: ≥3 consecutive ribs broken in ≥2 places → paradoxical movement (segment moves opposite to chest wall). Management: O2, analgesia (reduces splinting), positive pressure ventilation if severe respiratory compromise, treat underlying pneumothorax.|||FIELD|||Flail chest is a clinical diagnosis — look for paradoxical segment movement, palpate for crepitus over multiple ribs, auscultate for decreased breath sounds. Pain management for rib fractures is not optional — inadequate analgesia leads to splinting, hypoventilation, and pneumonia. Fentanyl (ACP) or ketorolac where available." },
          { text: "Pneumothorax — simple, open (sucking chest wound), tension", verdict: "keep", justification: "Pneumothorax recognition and management (needle decompression for tension PTX, occlusive dressing for open PTX) are priority EMALB exam skills — both written and practical.|||TAKEAWAY|||Simple PTX: air in pleural space, lung collapse, decreased breath sounds ipsilateral. Open (sucking chest wound): chest wall defect >2/3 trachea diameter → air preferentially enters through wound. Tension PTX: one-way valve mechanism → progressive air accumulation → mediastinal shift → JVD, tracheal deviation, cardiovascular collapse. Treatment: open PTX → 3-sided occlusive dressing; tension PTX → needle decompression (2nd ICS MCL or 4th/5th ICS AAL).|||FIELD|||Tension PTX kills in minutes. Presentation: absent breath sounds + JVD + tracheal deviation (late) + cardiovascular collapse + no response to CPR in cardiac arrest. Needle decompress immediately — don't wait for tracheal deviation (it's a late sign). 2nd ICS MCL (midclavicular line), 14G or 16G angiocath, listen for rush of air." },
          { text: "Hemothorax — massive hemothorax, presentation, management", verdict: "keep", justification: "Hemothorax and massive hemothorax are tested in EMALB written exams. Differentiation from pneumothorax and combined hemopneumothorax drives management.|||TAKEAWAY|||Hemothorax: blood in pleural space. Massive hemothorax: >1500mL blood loss into pleural space. Presentation: decreased breath sounds (dull to percussion unlike PTX which is hyperresonant), hypotension from blood loss, respiratory compromise. Management: O2, IV access, fluid resuscitation, Priority 1 transport — cannot be drained prehospital.|||FIELD|||Massive hemothorax is one of the immediately life-threatening chest injuries. Dull percussion note + decreased breath sounds + shock = hemothorax. Fluid bolus does not fix the source — the blood vessel is bleeding into the chest. Definitive treatment is chest tube + surgical hemorrhage control in hospital. Your job is rapid transport." },
          { text: "Cardiac Tamponade — Beck's triad, mechanism, pericardiocentesis overview", verdict: "keep", justification: "Beck's triad (JVD, muffled heart sounds, hypotension) and the mechanism of cardiac tamponade are classic EMALB written exam content. Recognition drives transport decision.|||TAKEAWAY|||Cardiac tamponade: blood in pericardial sac → compression of heart → ↓venous return → ↓CO → shock. Beck's triad: JVD (↑venous pressure), muffled heart sounds, hypotension (↓CO). Also: pulsus paradoxus (SBP drops >10 mmHg on inspiration), tachycardia, narrow pulse pressure. Mechanism: penetrating chest trauma, ruptured aortic aneurysm, pericarditis. Pericardiocentesis: hospital/ACP procedure.|||FIELD|||Penetrating chest trauma + JVD + muffled heart sounds + hypotension = cardiac tamponade. Priority 1 transport — pericardiocentesis cannot be performed by PCP but must be recognized and transported urgently. Even 10–20mL of blood in the pericardial sac can significantly impair cardiac output." },
          { text: "Aortic Disruption and Other Great Vessel Injuries — MOI, presentation", verdict: "keep", justification: "Traumatic aortic injury is a high-mortality injury with specific MOI patterns. EMALB written exams test recognition criteria.|||TAKEAWAY|||Traumatic aortic disruption: most common at aortic isthmus (ligamentum arteriosum) — deceleration injury. MOI: high-speed MVC, fall from significant height. 80% die at scene; survivors have contained hematoma. Presentation: widened mediastinum on CXR (hospital finding), inter-arm BP difference >20 mmHg, tearing chest-to-back pain. Prehospital: suspect from MOI + hemodynamic instability.|||FIELD|||You can't diagnose aortic dissection in the field — but you can suspect it from MOI and present it as a consideration in your radio report to trauma. 'High-speed deceleration MVC, hemodynamically unstable, concern for aortic injury' activates the right hospital response. Transport Priority 1 to trauma centre." },
          { text: "Needle Decompression — indications, landmark (2nd ICS MCL), technique", verdict: "keep", justification: "Needle thoracostomy is a PCP Schedule 2 endorsement in BC. BCEHS CPG Needle Thoracostomy specifies indications, landmarks, and technique. Tested on EMALB practical exams for endorsed PCPs.|||TAKEAWAY|||Indications: tension PTX with cardiovascular compromise (hypotension + absent ipsilateral breath sounds + JVD or tracheal deviation, OR cardiac arrest with suspected tension PTX). Landmark: 2nd ICS midclavicular line (avoid neurovascular bundle under rib — insert just above lower rib). 14G angiocath, remove needle after insertion, leave catheter. Reassess breath sounds and hemodynamics after.|||FIELD|||Needle decompression in cardiac arrest from suspected tension PTX: do both sides if unsure which side (bilateral tension PTX can occur with bilateral injuries). Success: rush of air + improvement in hemodynamics/SpO2. No rush of air: either wrong side, needle too short (obese patient — longer needle needed), or not tension PTX. Reassess immediately." },
        ]
      },
      {
        name: "Chapter 27 — Abdominal Injuries",
        sections: [
          { text: "Abdominal Anatomy — quadrants, organs, retroperitoneal structures", verdict: "keep", justification: "Abdominal anatomy is foundational for interpreting tenderness patterns and predicting injury from MOI. EMALB written exams test organ location and referred pain patterns.|||TAKEAWAY|||Quadrants: RUQ (liver, gallbladder, right kidney), LUQ (spleen, stomach, left kidney), RLQ (appendix, right ovary), LLQ (sigmoid colon, left ovary). Retroperitoneal: kidneys, pancreas, aorta, IVC — injuries here can present with back/flank pain, not anterior tenderness. Referred pain: Kehr's sign (left shoulder pain from diaphragmatic irritation — spleen injury), Cullen's sign (periumbilical bruising — retroperitoneal bleed).|||FIELD|||Left shoulder pain after abdominal trauma = Kehr's sign = likely splenic injury with diaphragmatic irritation. The spleen is the most commonly injured abdominal organ in blunt trauma. Left-sided rib fractures = high index of suspicion for splenic laceration. Treat as internal hemorrhage." },
          { text: "Assessment of Abdominal Injuries — tenderness, guarding, Kehr's sign", verdict: "keep", justification: "Abdominal assessment for trauma is tested in EMALB practical scenarios. Peritoneal signs (guarding, rigidity, rebound tenderness) indicate significant intra-abdominal injury.|||TAKEAWAY|||Abdominal assessment: inspect for distension, bruising, seatbelt marks (Grey Turner's sign = flank bruising, Cullen's sign = periumbilical bruising). Palpate 4 quadrants: voluntary guarding (patient contracts muscles in anticipation), involuntary guarding/rigidity (reflex muscle spasm = peritoneal irritation = significant injury). Rebound tenderness (pain with rapid release) = peritonitis. Hematuria: kidney/bladder injury.|||FIELD|||Seatbelt sign (seatbelt mark across abdomen) = significant force + hollow organ injury risk (small bowel perforation from compression against spine). Seatbelt + abdominal tenderness = Priority 1 transport regardless of initial hemodynamic stability — hollow organ injuries can present with delayed deterioration." },
          { text: "Management of Abdominal Injuries — evisceration care, pain management, rapid transport", verdict: "keep", justification: "Evisceration management and abdominal trauma care are tested in EMALB practical exams. The key principles (don't replace eviscerated organs, don't remove impaled objects) are frequently tested.|||TAKEAWAY|||Evisceration: do not replace organs — cover with moist sterile dressing (saline-soaked), keep warm, prevent drying. Impaled objects: stabilize in place with bulky dressing — do not remove. Internal hemorrhage: large-bore IV access, permissive hypotension (SBP 80–90), Priority 1 transport. Avoid abdominal palpation of penetrating wounds — can disrupt clot.|||FIELD|||Evisceration is disturbing to see and to the patient — a calm, deliberate response is clinically and psychologically essential. 'I'm going to cover this to protect it and keep it moist while we get you to the hospital.' Moist dressing, gentle handling, Priority transport. Do not push organs back — this introduces infection and can injure blood supply." },
        ]
      },
      {
        name: "Chapter 28 — Musculoskeletal Injuries",
        sections: [
          { text: "Types of Fractures — open vs closed, greenstick, comminuted, pathologic", verdict: "keep", justification: "Fracture classification and identification are tested in EMALB practical exams. Open fractures (bone through skin) change management priority and infection risk significantly.|||TAKEAWAY|||Fracture types: closed (no skin break), open (skin breach — bone visible or wound over fracture site — high infection risk), greenstick (incomplete, pediatric — flexible bone bends without complete fracture), comminuted (multiple fragments), pathologic (bone disease weakens structure — minor MOI causes fracture). Stress fracture: repetitive loading without acute trauma.|||FIELD|||Open fracture = open wound over a fracture site, even if bone is not visible = treat as contaminated. Cover the wound with moist sterile dressing, do not irrigate in the field for open fractures, splint, and Priority transport. Infection risk starts immediately — time to surgical debridement matters." },
          { text: "Dislocations — common sites, NV assessment before and after reduction", verdict: "keep", justification: "Joint dislocation recognition and neurovascular assessment (6 Ps) before and after splinting are tested in EMALB practical exams.|||TAKEAWAY|||Common dislocations: shoulder (anterior most common), hip (posterior most common, high-energy trauma), patella, finger. Neurovascular assessment: pulse, capillary refill, motor function, sensation distal to dislocation before and after splint. Hip dislocation: avascular necrosis risk increases after 6 hours — Priority transport. Reduction is generally not PCP scope without medical direction.|||FIELD|||Hip dislocation from high-energy trauma (dashboard injury in MVC): leg shortened, internally rotated, hip flexed. Neurovascular compromise distal to dislocation = Priority transport — time to reduction affects whether the femoral head dies. Document NV status before and after every splint — if it worsens, you may have applied the splint too tightly." },
          { text: "Assessment of Musculoskeletal Injuries — 6 Ps (pain, pallor, pulselessness, paresthesia, paralysis, pressure)", verdict: "keep", justification: "The 6 Ps are the standard neurovascular assessment framework tested on EMALB practical exams for every extremity injury.|||TAKEAWAY|||6 Ps of neurovascular compromise: Pain (at rest or with passive stretch — compartment syndrome early sign), Pallor (pale, mottled, or cyanotic distal to injury), Pulselessness (absent distal pulse), Paresthesia (numbness, tingling — early compartment syndrome), Paralysis (motor deficit — late finding), Pressure (tense, firm compartment on palpation). Any positive finding = Priority escalation.|||FIELD|||Passive stretch pain is the earliest sign of compartment syndrome — pain out of proportion to injury that worsens with passive stretch of the involved muscles. This occurs before pulses are lost. A patient who keeps saying 'the splint is too tight' after proper splint application may have compartment syndrome developing — don't dismiss it." },
          { text: "Splinting Principles — immobilize joint above and below, NV check before/after", verdict: "keep", justification: "Splinting technique is tested on EMALB practical exams. Proper splint application (immobilize joint above and below, NV check pre and post) is a graded competency.|||TAKEAWAY|||Splinting principles: immobilize joint above AND below fracture site, pad bony prominences, document and reassess NV status before and after splinting, position of function (slight flexion). Do not straighten fractures unless: circulation absent distally, significant deformity prevents transport, or distal NV compromise. Traction splint: femur fractures only — reduces pain and blood loss.|||FIELD|||Traction splints (Hare, Sager, or SLISHMAN) are for femoral shaft fractures only — not ankle, not hip, not knee dislocations. Applying traction to a knee dislocation or hip fracture will cause additional injury. Confirm isolated femur fracture before applying traction. Document NV status before and after application." },
          { text: "Femur Fractures — traction splint, blood loss (1–1.5L), shock risk", verdict: "keep", justification: "Femur fracture recognition, blood loss quantification (up to 1.5L into the thigh), and traction splint application are tested in EMALB practical exams.|||TAKEAWAY|||Femoral shaft fracture: 1–1.5L blood loss into thigh (sufficient to cause Class II–III hemorrhagic shock). Presentation: thigh swelling/deformity, pain, shortened and externally rotated leg (vs hip fracture: no thigh deformity). Traction splint: reduces fracture, decreases blood loss, reduces pain. Apply traction until pain relief (not until limb straightens geometrically).|||FIELD|||The femur fracture patient who seems hemodynamically stable: 1L may already be sequestered in the thigh before you arrive. Monitor serial vital signs, establish large-bore IV access, and apply traction splint correctly (proximal ring against ischial tuberosity, traction at ankle, both legs should appear equal length after). Trending tachycardia = hemorrhage is continuing." },
        ]
      },

  {
    name: "Medical Emergencies",
    chapters: [
      {
        name: "Chapter 29 — Respiratory Emergencies",
        sections: [
          { text: "Respiratory Anatomy and Physiology Review — V/Q matching, gas exchange", verdict: "keep", justification: "V/Q mismatch physiology underpins understanding of hypoxia types and why certain conditions (PE, pneumonia) cause hypoxia that doesn't fully respond to O2. Tested in EMALB written exams.|||TAKEAWAY|||V/Q (ventilation/perfusion) matching: ideal lung has matched ventilation and perfusion. V/Q mismatch: pneumonia (no ventilation, perfusion present — shunt), PE (ventilation present, no perfusion — dead space). O2 delivery = CO × CaO2; CaO2 = (Hgb × SaO2 × 1.34) + (PaO2 × 0.003). Anemia and CO poisoning reduce O2 delivery despite normal SpO2.|||FIELD|||The pneumonia patient with SpO2 82% on room air who goes to 93% on 15L NRB: V/Q mismatch improving with supplemental O2 — good response. The same SpO2 on 15L NRB that stays at 82%: significant shunt physiology (fluid-filled alveoli receiving no ventilation) — these patients may need CPAP or intubation. Response to O2 tells you about the type of hypoxia." },
          { text: "Pathophysiology of Respiratory Emergencies — hypoxia, hypercarbia, respiratory failure", verdict: "keep", justification: "Distinguishing ventilatory failure (CO2 retention — needs ventilatory support) from oxygenation failure (hypoxia — needs O2 and maybe CPAP) drives management decisions. Tested in EMALB written exams.|||TAKEAWAY|||Hypoxic failure (Type I): PaO2 low, PaCO2 normal/low — V/Q mismatch (pneumonia, PE, pulmonary edema). Responds to supplemental O2. Ventilatory failure (Type II): PaO2 low + PaCO2 high — inadequate alveolar ventilation (COPD exacerbation, neuromuscular disease, OD). Requires ventilatory support (BVM, CPAP, intubation), not just O2.|||FIELD|||The COPD patient who is drowsy, cyanotic, and breathing shallowly at 8/min: ventilatory failure — needs BVM assist, not just NRB. The CHF patient with normal RR but SpO2 of 78%: oxygenation failure — may respond to CPAP (ACP) and diuresis. Distinguishing the failure type changes your management." },
          { text: "Asthma — pathophysiology, bronchospasm, status asthmaticus, management", verdict: "keep", justification: "BCEHS CPG Asthma/COPD/Bronchospasm is an active protocol. Salbutamol + ipratropium administration is a core PCP skill. Recognizing status asthmaticus (life-threatening) drives ACP backup and priority transport decisions.|||TAKEAWAY|||Asthma pathophysiology: bronchospasm + mucosal edema + mucus plugging → ↑airway resistance → air trapping → hyperinflation → ↓tidal volume. Status asthmaticus: severe bronchospasm not responding to initial treatment — SpO2 <90% despite O2, silent chest (no air movement), accessory muscle use, diaphoresis, altered LOC. Management: salbutamol 2.5–5mg neb + ipratropium 0.5mg neb, O2 to target, ACP backup for status asthmaticus.|||FIELD|||Silent chest in asthma = worst sign. No air movement = no wheezing, but that means no gas exchange. Priority 1, call ACP immediately, continue nebulized bronchodilators en route, prepare for BVM. The asthmatic who stops talking because they 'feel better' who is also cyanotic is not better — they're exhausted and heading toward respiratory arrest." },
          { text: "COPD — emphysema vs chronic bronchitis, hypoxic drive debate, management", verdict: "keep", justification: "COPD is one of the most common respiratory calls in EMS. BCEHS CPG Asthma/COPD/Bronchospasm and the correct SpO2 target (88–92%) are directly tested in EMALB written and practical exams.|||TAKEAWAY|||Emphysema: alveolar destruction → air trapping → barrel chest, pursed-lip breathing, 'pink puffer.' Chronic bronchitis: hypersecretion → plugging, 'blue bloater.' COPD exacerbation: infection/trigger → acute-on-chronic bronchospasm + hypercapnia. SpO2 target: 88–92% (not 95%+). Salbutamol + ipratropium. CPAP (ACP): positive pressure overcomes hyperinflation dynamic. Do NOT withhold O2 for SpO2 <85% regardless of COPD history.|||FIELD|||SpO2 target 88–92% in COPD: this is to avoid hyperoxia-mediated V/Q worsening and hypercapnia, not because of hypoxic drive suppression (a persistent myth). The COPD patient with SpO2 of 78% needs oxygen — start high flow and titrate down toward 88–92%. Never let a COPD patient sit at 78% SpO2 citing 'hypoxic drive.'" },
          { text: "Pulmonary Edema — cardiogenic vs non-cardiogenic, presentation, management", verdict: "keep", justification: "Cardiogenic pulmonary edema is one of the most common medical emergencies you'll run. BCEHS CPG CHF/Pulmonary Edema specifies NTG, CPAP (ACP), and furosemide (ACP) as treatment interventions.|||TAKEAWAY|||Cardiogenic: LV failure → ↑pulmonary capillary wedge pressure → fluid into alveoli → pink frothy sputum, severe dyspnea, SpO2 ↓, crackles bilaterally, JVD. Non-cardiogenic (ARDS): capillary permeability → alveolar flooding without cardiac cause (sepsis, aspiration, drowning). Management: NTG (vasodilation → ↓preload/afterload — if SBP ≥90), positioning upright, CPAP (ACP), positive pressure ventilation if severe.|||FIELD|||The patient sitting bolt upright, leaning forward, coughing up pink froth, unable to speak in full sentences, bilateral crackles, SpO2 78% on NRB: cardiogenic pulmonary edema. NTG 0.4mg SL if SBP ≥90. Position upright. Call ACP for CPAP. This is one of the presentations where NTG can produce dramatic improvement in minutes." },
          { text: "Pulmonary Embolism — risk factors, Virchow's triad, Wells criteria, presentation", verdict: "keep", justification: "PE is a common and frequently missed diagnosis. Clinical recognition criteria and risk factors are tested in EMALB written exams. PE is one of the causes of PEA cardiac arrest — reversible with anticoagulation/thrombolysis in hospital.|||TAKEAWAY|||Virchow's triad (PE risk): stasis (immobility, DVT), endothelial injury, hypercoagulability (OCP, cancer, inherited). Classic presentation: sudden dyspnea, pleuritic chest pain (with infarction), tachycardia, hypoxia without another explanation, low-grade fever, hemoptysis. Wells score: clinical scoring for PE probability. BCEHS management: O2, IV, Priority transport.|||FIELD|||PE is the 'great masquerader' — it can present as chest pain, dyspnea, syncope, or cardiac arrest (PEA). Consider PE in any patient with acute dyspnea + tachycardia + hypoxia who has risk factors and no obvious alternative diagnosis. In PEA arrest: consider PE as reversible cause (Hs and Ts) — hospital thrombolysis can save them." },
          { text: "Spontaneous Pneumothorax — risk factors, presentation, needle decompression criteria", verdict: "keep", justification: "Spontaneous PTX (primary: tall young males; secondary: COPD, Marfan) is a common ED presentation that can deteriorate to tension PTX. Needle decompression criteria are tested in EMALB written exams.|||TAKEAWAY|||Primary spontaneous PTX: young tall males, no underlying disease — bleb rupture. Secondary: COPD, Marfan, CF, cancer. Presentation: sudden pleuritic chest pain + dyspnea, decreased breath sounds ipsilateral, hyperresonant percussion. Progresses to tension if significant air leak. Management: O2, monitor, Priority transport; needle decompression if hemodynamic compromise develops.|||FIELD|||The 25-year-old tall, thin male with sudden left-sided pleuritic chest pain and dyspnea — no trauma — is a spontaneous PTX until proven otherwise. SpO2 may be only mildly reduced initially. Monitor closely for tension PTX development (worsening dyspnea, hypotension, JVD). If he deteriorates en route, needle decompression." },
          { text: "Hyperventilation Syndrome — diagnosis of exclusion, reassurance, rebreathing", verdict: "skim", justification: "Hyperventilation syndrome is a diagnosis of exclusion — never assume it before ruling out serious causes (PE, DKA, metabolic acidosis, anxiety-masking pain). Skim — the key teaching point is 'don't paper bag.'|||TAKEAWAY|||Hyperventilation syndrome (anxiety/panic): tachypnea → hypocapnia → respiratory alkalosis → peripheral tingling, carpopedal spasm, perioral paresthesia, lightheadedness. Diagnosis of exclusion only after ruling out: PE, DKA, cardiac ischemia, toxic ingestion. Do NOT use paper bag — risk of hypoxia. Treatment: reassurance, grounding, controlled breathing coaching.|||FIELD|||Never diagnose hyperventilation syndrome in the field without ruling out serious causes. The STEMI patient who is hyperventilating from pain and anxiety looks identical to a panic attack. Treat the cardiac cause first. If no cause found after full assessment, coach slow breathing and monitor to hospital." },
        ]
      },
      {
        name: "Chapter 30 — Cardiovascular Emergencies",
        sections: [
          { text: "Cardiac Anatomy and Physiology — coronary circulation, conduction system", verdict: "keep", justification: "Cardiac physiology is the foundation for understanding ACS, arrhythmias, and heart failure — the most common medical emergencies in EMS. Tested in EMALB written exams.|||TAKEAWAY|||Coronary arteries: LAD (anterior wall, septum, anterior papillary muscle — most dangerous occlusion), RCA (inferior wall, SA and AV nodes), LCx (lateral wall). Conduction: SA node (pacemaker, 60–100/min) → AV node (delay, 40–60/min backup) → bundle of His → Purkinje fibres. Frank-Starling: increased preload (stretch) → increased stroke volume (to a point — fails in severe CHF).|||FIELD|||LAD occlusion = anterior STEMI = most dangerous MI (large territory, papillary muscle involvement, cardiogenic shock risk). RCA occlusion = inferior STEMI (also right heart MI — JVD, ↓BP, NO NTG — NTG in RV infarct causes catastrophic hypotension). Know your ECG territory to predict complications." },
          { text: "Atherosclerosis and ACS — plaque formation, STEMI vs NSTEMI vs UA", verdict: "keep", justification: "ACS pathophysiology and classification (STEMI vs NSTEMI vs UA) are directly tested in EMALB written exams. STEMI drives cath lab activation — BCEHS STEMI Protocol is active.|||TAKEAWAY|||Atherosclerosis: foam cell → fatty streak → fibrous plaque → vulnerable plaque → rupture → thrombus. ACS spectrum: UA (unstable angina — plaque rupture without troponin release), NSTEMI (partial occlusion, troponin rise, no ST elevation), STEMI (complete occlusion, ST elevation, massive infarction). BCEHS STEMI Protocol: 12-lead → STEMI identified → direct cath lab activation via pre-alert.|||FIELD|||STEMI pre-alert is one of the highest-impact interventions you can make. A 12-lead showing STEMI sent from the ambulance can activate the cath lab before the patient arrives, reducing door-to-balloon time and saving myocardium. Know the BCEHS STEMI protocol (which hospitals accept primary PCI in the Lower Mainland) and use it on every suspicious 12-lead." },
          { text: "Assessment of Chest Pain — OPQRST, atypical presentations, 12-lead ECG", verdict: "keep", justification: "Chest pain assessment and 12-lead ECG acquisition are core PCP competencies tested on EMALB practical scenarios. Recognizing atypical presentations of ACS (especially in women, diabetics, elderly) prevents missed diagnoses.|||TAKEAWAY|||OPQRST for chest pain: typical ACS — pressure/squeezing, substernal, radiation to jaw/arm/back, diaphoresis, nausea. Atypical: epigastric pain (inferior MI), jaw/arm pain only, fatigue/dyspnea (especially women, diabetics, elderly). High-risk features: diaphoresis, radiation, relief with NTG, associated dyspnea, syncope, prior MI history. 12-lead: acquire within 10 minutes of patient contact on all chest pain calls.|||FIELD|||The 52-year-old woman with jaw pain and nausea who 'feels terrible' but denies chest pain: atypical ACS until proven otherwise. Get a 12-lead. Women, diabetics, and elderly patients with ACS are less likely to have classic chest pain — their presentations are more subtle and more frequently missed. Don't let the absence of chest pain reassure you." },
          { text: "Management of ACS — ASA, NTG, O2 targets, transport to PCI centre", verdict: "keep", justification: "BCEHS ACS Protocol specifies ASA, NTG indications/contraindications, O2 targets, and STEMI protocol. These are directly tested on EMALB practical exams.|||TAKEAWAY|||ACS management: ASA 160–325mg chewable (if not already taken, no allergy), NTG 0.4mg SL q5min × 3 (if SBP ≥90, no PDE5i in 24h, no RV infarct), O2 to target SpO2 ≥94% (not hyperoxia — excessive O2 can worsen ischemic injury), 12-lead acquisition and transmission, Priority transport to PCI-capable centre for STEMI.|||FIELD|||NTG contraindications are life-or-death important: SBP <90, HR <50 or >100, RV infarct (inferior STEMI — ST elevation in lead II, III, aVF — check right-sided leads), PDE5 inhibitor use within 24–48h (sildenafil, tadalafil). NTG in RV infarct → preload drops → massive hypotension → cardiac arrest. Know these before you reach for the NTG." },
          { text: "Cardiac Arrhythmias — sinus rhythms, AF, SVT, VT, VF, heart blocks", verdict: "keep", justification: "12-lead ECG and rhythm interpretation are PCP Schedule 2 endorsement skills. BCEHS CPG Cardiac Rhythm Disturbances specifies management of symptomatic arrhythmias. Rhythm recognition is heavily tested in EMALB written exams.|||TAKEAWAY|||Life-threatening rhythms: VF (chaotic, no organized complexes — defibrillate immediately), pulseless VT (no pulse — treat as VF), symptomatic bradycardia (HR <50 with hypotension, altered LOC, chest pain — atropine 0.5mg IV; ACP for transcutaneous pacing), SVT (narrow complex tachycardia — vagal maneuvers, adenosine ACP). AF: irregular irregular — anticoagulation consideration, rate vs rhythm control hospital decision.|||FIELD|||The cardiac monitor is your partner on every significant call. VF on the monitor = CPR + defibrillation. Symptomatic bradycardia (syncope, hypotension, altered LOC with HR 38) = atropine. SVT (HR 180, narrow complex) = vagal maneuvers first (Valsalva), then ACP for adenosine. You need to recognize these rhythms instantly — drill 12-lead reading until patterns are automatic." },
          { text: "Cardiac Arrest Management — CPR quality, AED, 2:30 CPR cycles, team dynamics", verdict: "keep", justification: "Cardiac arrest management is the highest-stakes clinical scenario in EMS. BCEHS CPG Cardiac Arrest specifies CPR quality standards, defibrillation timing, and post-ROSC management. Tested on every EMALB practical exam.|||TAKEAWAY|||CPR quality: compressions 100–120/min, depth 5–6cm (adult), full recoil, minimal interruptions (<10 sec). 30:2 ratio (PCP) or continuous compressions with advanced airway. Defibrillation: for shockable rhythms (VF, pulseless VT) — shock ASAP, resume CPR immediately after shock (2 minutes before rhythm check). Post-ROSC: 12-lead, temperature management, O2 titration (SpO2 94–98%), BP support.|||FIELD|||CPR quality is the single most modifiable variable in cardiac arrest survival. Hard, fast, minimize interruptions, full recoil. In two-person CPR: rotate compressors every 2 minutes. Pre-ROSC 12-lead prep: defibrillation pads are your monitor — don't switch to limb leads until ROSC. Every second of paused compressions reduces coronary perfusion pressure. Pause only for rhythm checks and defibrillation." },
          { text: "Congestive Heart Failure — left vs right, Frank-Starling law, management", verdict: "keep", justification: "CHF is one of the most common medical emergencies. BCEHS CPG CHF specifies NTG, CPAP (ACP), and furosemide (ACP). Recognition of left vs right failure changes management (NTG is contraindicated with right heart failure if it worsens hypotension).|||TAKEAWAY|||Left heart failure: ↓LV output → pulmonary congestion → crackles, orthopnea, PND, pink frothy sputum. Right heart failure: ↓RV output → systemic congestion → JVD, peripheral edema, hepatomegaly, ascites. Biventricular failure: both. Acute decompensated CHF: NTG (if SBP ≥90) → dramatic preload reduction → often dramatic symptom relief within minutes.|||FIELD|||The patient with biventricular failure has both pulmonary edema AND peripheral edema — they may be 20kg fluid overloaded but still in shock because their heart can't pump effectively. NTG carefully (hypotension risk when preload-dependent). CPAP (ACP scope) dramatically improves oxygenation by splitting alveoli open. These patients often look terrifying but respond well to the right treatment." },
          { text: "Hypertensive Emergencies — hypertensive urgency vs emergency, end-organ damage", verdict: "keep", justification: "Hypertensive emergency (HTN + end-organ damage) vs urgency (HTN without acute end-organ damage) differentiation drives treatment priority. Tested in EMALB written exams.|||TAKEAWAY|||Hypertensive emergency: SBP >180 or DBP >120 WITH end-organ damage (stroke symptoms, chest pain/STEMI, acute pulmonary edema, acute renal failure, hypertensive encephalopathy — headache, confusion, papilledema). Urgency: severe BP without acute end-organ damage — less immediately dangerous. Field management: O2, IV, Priority transport — do not aggressively lower BP prehospitally (can worsen ischemic stroke).|||FIELD|||Never aggressively lower BP in the prehospital setting for suspected ischemic stroke — the elevated BP may be the body maintaining perfusion to the ischemic penumbra. Rapid BP lowering can convert ischemic to infarcted tissue. Get them to the stroke team quickly; let the neurologist manage the BP with imaging guidance." },
          { text: "Cardiogenic Shock — low output failure, differentiation, management", verdict: "keep", justification: "Cardiogenic shock recognition and differentiation from hypovolemic shock is tested in EMALB written exams. Fluid management in cardiogenic shock is the opposite of hypovolemic shock management.|||TAKEAWAY|||Cardiogenic shock: pump failure → ↓CO → hypotension + tachycardia + JVD + pulmonary edema. Skin: cool, pale, clammy (vasoconstriction from compensatory catecholamine release). Key differentiator: JVD + pulmonary edema = cardiogenic (fluid overloaded). Treatment: DO NOT fluid load (worsens pulmonary edema), NTG if SBP permits, O2, CPAP (ACP), Priority transport to PCI centre (often cardiogenic shock = STEMI with major territory infarction).|||FIELD|||Cardiogenic shock patient with JVD and crackles: do not bolus IV fluid. The cardiac output problem is not from lack of fluid — it's from pump failure. Fluid loading fills an already congested pulmonary bed. NTG (vasodilation → ↓afterload → ↑CO), CPAP (ACP), and rapid transport to revascularization is the treatment pathway." },
          { text: "Aortic Aneurysm and Dissection — tearing back pain, BP differential, management", verdict: "keep", justification: "Aortic dissection and AAA are high-mortality emergencies that require rapid transport to surgical centre. EMALB written exams test classic presentation features.|||TAKEAWAY|||Aortic dissection: intimal tear → blood tracks between layers → tearing pain radiating to back, maximal at onset, may migrate. BP differential between arms >20 mmHg (tear involves subclavian artery origin). Pulse deficits. Ruptured AAA: pulsatile abdominal mass + hypotension + back/flank pain. Management: IV access, permissive hypotension (SBP 80–90 — aggressive fluid resuscitation worsens dissection), Priority transport to vascular surgery.|||FIELD|||Tearing back pain maximal at onset in a hypertensive patient = aortic dissection until proven otherwise, not renal colic. The distinction: renal colic builds gradually and causes writhing; dissection is sudden and maximal, and the patient cannot find a comfortable position. Both need Priority transport but dissection needs vascular surgery immediately." },
        ]
