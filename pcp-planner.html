      {
        name: "Chapter 31 — Neurologic Emergencies",
        sections: [
          { text: "Stroke — ischemic vs hemorrhagic, Cincinnati Prehospital Stroke Scale, FAST", verdict: "keep", justification: "BCEHS CPG Stroke is an active protocol with specific time windows for tPA eligibility (3–4.5h ischemic) and thrombectomy (up to 24h in select patients). CPSS is tested in EMALB written and practical exams.|||TAKEAWAY|||Cincinnati Prehospital Stroke Scale (CPSS): facial droop (one side doesn't move), arm drift (one arm drifts down), abnormal speech (slurred, wrong words, no speech) — any one positive = likely stroke. Ischemic (85%): clot. Hemorrhagic (15%): bleed — worse prognosis. Cannot distinguish prehospitally. Last known well time = most important data point for tPA eligibility. Priority 1 to stroke centre.|||FIELD|||Last known well time is the critical data point — not 'when symptoms were found,' but the last time the patient was confirmed normal. Document exact words from witnesses: 'Wife states patient was normal at 07:15 when she left for work.' This time determines tPA eligibility. Every minute of delay from symptom onset to tPA = brain tissue loss." },
          { text: "TIA — presentation, differentiation from stroke, transport decision", verdict: "keep", justification: "TIA (symptoms resolve within 24h) is often dismissed as 'not a stroke' but carries 10–15% 30-day stroke risk. EMALB written exams test the importance of transporting TIA patients even after symptom resolution.|||TAKEAWAY|||TIA: focal neurologic deficit resolving completely within 24h (typically <1h). 10–15% risk of stroke within 30 days — highest risk in first 48 hours. Cannot distinguish TIA from stroke prehospitally or even clinically during resolution. ABCD2 score predicts short-term stroke risk. Management: treat as stroke, Priority transport, document last known well time.|||FIELD|||The patient who had facial droop and arm weakness 'but it went away': this is a TIA with high short-term stroke risk. Do not reassure them that they're fine because symptoms resolved. Priority transport for same-day neurology workup. The next event may be a completed stroke. Document symptom onset, duration, and resolution timing precisely." },
          { text: "Seizures — generalized vs focal, status epilepticus, postictal management", verdict: "keep", justification: "BCEHS CPG Seizure specifies midazolam (ACP scope) for status epilepticus. PCP scope includes seizure management and post-ictal care. Recognition of status epilepticus drives ACP backup decision.|||TAKEAWAY|||Generalized tonic-clonic: bilateral tonic (stiffening) → clonic (rhythmic jerking) → postictal (confusion, somnolence, ±Todd's paralysis). Focal seizure: one hemisphere (unilateral movement or sensory). Status epilepticus: continuous seizure >5 minutes or ≥2 seizures without recovery — airway compromise, hypoxia, hyperthermia, brain injury risk. PCP management: protect from injury, airway, O2, BGL, recovery position post-ictally. ACP: midazolam for status.|||FIELD|||The postictal patient who is unconscious: protect airway (recovery position, OPA/NPA, suction ready), get BGL (hypoglycemia can cause seizure and looks identical post-ictally), monitor for repeat seizure. Do not restrain during active seizure — guide away from hazards. Time the seizure duration: >5 minutes = status epilepticus = ACP backup now." },
          { text: "Syncope — vasovagal, cardiac, orthostatic; assessment and differentiation", verdict: "keep", justification: "Syncope is a common EMS call that encompasses benign (vasovagal) and life-threatening (cardiac) causes. Risk stratification (age, cardiac history, abnormal ECG) is tested in EMALB written exams.|||TAKEAWAY|||Vasovagal (neurocardiogenic): prodrome of warmth/nausea/diaphoresis, precipitating trigger (pain, emotional stress, prolonged standing), brief loss of consciousness, rapid recovery, normal ECG — low risk. Cardiac syncope: no prodrome, exertional or positional trigger, older patient, cardiac history, abnormal ECG, EF may be reduced — HIGH risk. Management: 12-lead, full assessment, IV access, Priority transport for any uncertain or cardiac cause.|||FIELD|||'I just fainted' is never a benign diagnosis until you have an ECG, vital signs, and a good history. The Brugada syndrome patient who faints at rest. The long QT syndrome teenager who collapses during exercise. The 60-year-old with new syncope and a subtle Mobitz II on ECG. These are lethal arrhythmias presenting as 'fainting.' Get the 12-lead." },
          { text: "Headache — tension, migraine, cluster, subarachnoid hemorrhage (worst headache of life)", verdict: "keep", justification: "Distinguishing SAH from benign headache is a critical clinical decision. The 'worst headache of life' red flag is tested in EMALB written exams.|||TAKEAWAY|||SAH red flags: thunderclap onset (worst headache of life, maximal at onset), associated with exertion, neck stiffness, focal deficit, altered LOC, +/- meningism. Benign: gradual onset, prior similar headaches, no focal deficit, photophobia/phonophobia (migraine). Never diagnose 'just a migraine' prehospitally if thunderclap onset present — 10% mortality in first day from aneurysmal SAH.|||FIELD|||Any patient describing their worst headache ever that came on suddenly: Priority 1 to stroke centre for CT/LP. The aneurysm may not have fully ruptured yet — a sentinel bleed precedes the major bleed by hours to days in 30% of cases. Appropriate urgency can get them to surgery before the catastrophic rupture." },
          { text: "Altered LOC — differential diagnosis: AEIOU-TIPS, BGL, temperature, tox screen", verdict: "keep", justification: "Altered LOC is one of the most common medical calls with a broad differential. BCEHS CPG Altered Level of Consciousness and AEIOU-TIPS mnemonic are foundational. BGL on every altered patient is non-negotiable.|||TAKEAWAY|||AEIOU-TIPS: Alcohol/acidosis, Epilepsy (postictal), Infection (meningitis, encephalitis, septic encephalopathy), Opioids/Overdose, Uremia (renal failure), Trauma (TBI, intracranial bleed), Insulin (hypo/hyperglycemia), Psychiatric, Stroke/Shock/Syncope. BGL is the mandatory first step. Pupils: pinpoint (opioid, pontine bleed), fixed dilated (herniation, atropine), unequal (herniation).|||FIELD|||BGL on every altered patient — it takes 30 seconds and hypoglycemia is the most treatable and most missed cause of altered LOC. After BGL: pupils, GCS trend, temperature, SpO2, respiratory rate pattern. Run AEIOU-TIPS systematically every time — it prevents anchoring on the most recent diagnosis you've seen." },
        ]
      },
      {
        name: "Chapter 32 — Endocrine Emergencies",
        sections: [
          { text: "Diabetes Mellitus — type 1 vs type 2, insulin physiology, glucose regulation", verdict: "keep", justification: "Diabetic emergencies are among the most frequent medical calls in EMS. Understanding insulin physiology explains both hypoglycemia and hyperglycemia presentations and management.|||TAKEAWAY|||Type 1: autoimmune beta-cell destruction → absolute insulin deficiency → prone to DKA. Type 2: insulin resistance + relative deficiency → prone to HHS. Insulin drives glucose into cells; glucagon raises blood glucose. Normal fasting BGL: 4–6 mmol/L. Threshold for hypoglycemia symptoms: typically ≤3.5 mmol/L (earlier in non-diabetics, later in long-standing diabetics with impaired awareness).|||FIELD|||Long-standing diabetics may have hypoglycemia unawareness — their autonomic warning symptoms (diaphoresis, tremor) are blunted, so they present with neurological symptoms (confusion, seizure) at BGLs that would cause symptoms in others. Higher index of suspicion for occult hypoglycemia in brittle Type 1 diabetics." },
          { text: "Hypoglycemia — presentation, BGL threshold, oral glucose vs D10W vs glucagon", verdict: "keep", justification: "BCEHS CPG Hypoglycemia specifies D10W (0.5g/kg IV) as the primary treatment, with oral glucose for conscious patients. Hypoglycemia management is tested on every EMALB medical practical scenario. BGL assessment is mandatory on every altered patient.|||TAKEAWAY|||Hypoglycemia: BGL <4.0 mmol/L (symptomatic), <2.8 mmol/L (severe). Spectrum: mild (diaphoresis, tremor, palpitations, hunger) → moderate (confusion, bizarre behavior, combativeness) → severe (seizure, unconscious). PCP treatment: conscious with intact swallow → oral glucose 15g (glucose tablets/gel). Unable to swallow → D10W 0.5g/kg IV (e.g., 70kg patient = 35g = 350mL D10W) over 20–30 min. Recheck BGL in 10 minutes.|||FIELD|||The combative, confused patient who is 'drunk' in the DTES: BGL before assuming alcohol. Hypoglycemia mimics intoxication perfectly. A BGL of 1.8 mmol/L explains everything. D10W IV → alert and oriented in minutes. You cannot distinguish hypoglycemia from intoxication clinically — always check BGL." },
          { text: "Diabetic Ketoacidosis — Kussmaul breathing, fruity breath, BGL >14, anion gap", verdict: "keep", justification: "DKA recognition and initial management (IV fluids) are tested in EMALB written exams. Recognizing DKA vs HHS changes management priorities.|||TAKEAWAY|||DKA: Type 1 predominant, absolute insulin deficiency → fatty acid breakdown → ketone production → metabolic acidosis. Triad: hyperglycemia (BGL >14 mmol/L), ketonemia, acidosis (pH <7.3). Presentation: Kussmaul respirations (deep, labored — respiratory compensation for metabolic acidosis), fruity acetone breath, polyuria, polydipsia, nausea, vomiting, abdominal pain. Management: large-bore IV, NS resuscitation (1–2L bolus in severe cases), O2, Priority transport.|||FIELD|||DKA patient: BGL 28, Kussmaul breathing, GCS 12, fruity breath, dry mucous membranes. Start aggressive IV NS resuscitation en route — these patients are profoundly volume depleted (3–5L deficit typical). Do not give insulin prehospitally. The hospital will manage insulin with electrolyte monitoring (potassium drops precipitously when insulin is given)." },
          { text: "Hyperosmolar Hyperglycemic State (HHS) — BGL >33, no ketones, elderly", verdict: "keep", justification: "HHS (formerly HONK) is tested in EMALB written exams as a differentiation from DKA. Elderly Type 2 diabetic, extreme hyperglycemia, no Kussmaul breathing, profound dehydration.|||TAKEAWAY|||HHS: Type 2 predominant, elderly, slow onset over days-weeks. BGL typically >33 mmol/L (can reach 60+). No significant ketosis (some insulin present to suppress fatty acid metabolism). No Kussmaul breathing (no acidosis). Profound dehydration, altered LOC, focal neurologic deficits possible. Osmolarity >320 mOsm/kg → neurological effects. Management: cautious IV fluid resuscitation (faster rehydration → cerebral edema risk), Priority transport.|||FIELD|||HHS often presents after days of polyuria + poor oral intake in an elderly patient found at home in altered LOC. BGL may be 55 mmol/L — your glucometer will say 'HI' if it maxes out. These patients need cautious fluid resuscitation (not the aggressive approach of DKA) — the rapid osmolarity change risks cerebral edema. Transport Priority 1." },
          { text: "Thyroid and Adrenal Emergencies — thyroid storm, Addisonian crisis, overview", verdict: "skim", justification: "Thyroid and adrenal emergencies are rare and not primary EMALB exam topics. Skim for recognition — field management is supportive.|||TAKEAWAY|||Thyroid storm: extreme hyperthyroidism → hyperthermia, tachycardia, hypertension, altered LOC, heart failure. Myxedema coma: severe hypothyroidism → hypothermia, bradycardia, hypotension, altered LOC. Addisonian crisis: adrenal insufficiency (especially steroid-dependent patients who miss doses during illness) → hypotension, hyponatremia, hyperkalemia, altered LOC.|||FIELD|||Addisonian crisis is the most field-relevant of these: steroid-dependent patient (asthma, RA, transplant) who develops an acute illness and missed or vomited their steroids. Refractory hypotension + hyponatremia + hyperkalemia + altered LOC. Alert the ED to consider adrenal crisis. Hydrocortisone (hospital) is life-saving." },
        ]
      },
      {
        name: "Chapter 33 — Allergic Reactions",
        sections: [
          { text: "Pathophysiology of Allergic Reactions — IgE, mast cells, histamine, mediators", verdict: "keep", justification: "Anaphylaxis pathophysiology explains the multi-system presentation and why epinephrine is the only effective first-line treatment. Tested in EMALB written exams.|||TAKEAWAY|||Type I (IgE-mediated) hypersensitivity: prior sensitization → IgE on mast cells → re-exposure → mast cell degranulation → histamine, tryptase, leukotrienes, prostaglandins released → vasodilation, bronchospasm, urticaria, angioedema. Biphasic reaction: initial response resolves → second wave 4–8h later without re-exposure (histamine and leukotriene second wave).|||FIELD|||Biphasic anaphylaxis: the patient who 'feels better' after IM epinephrine still needs hospital monitoring for 4–8 hours minimum for biphasic reaction. Do not allow anaphylaxis patients to refuse transport after apparent resolution — the second wave can be as severe or worse than the first." },
          { text: "Anaphylaxis — biphasic reaction, systemic involvement, Epinephrine as first-line", verdict: "keep", justification: "Anaphylaxis recognition criteria are tested on EMALB practical exams. The WORLD Allergy Organization criteria (two body systems, or hypotension alone after known allergen exposure) are clinically useful.|||TAKEAWAY|||Anaphylaxis: rapid multi-system allergic response. Diagnostic criteria (any one): (1) acute skin + respiratory/CV involvement after allergen exposure, (2) two or more systems involved after likely allergen, (3) hypotension after known allergen. Systems: skin (urticaria, angioedema, flushing), respiratory (bronchospasm, stridor, hypoxia), cardiovascular (hypotension, tachycardia, shock), GI (nausea, vomiting, abdominal pain).|||FIELD|||The patient with bee sting who has hives only = allergic reaction, not anaphylaxis. The patient with bee sting who has hives + wheezing = anaphylaxis. The patient with bee sting who has hypotension only = anaphylaxis (cardiovascular variant). The system involvement is what defines anaphylaxis and drives epinephrine use." },
          { text: "Assessment of Allergic Reactions — mild vs moderate vs severe, grading", verdict: "keep", justification: "Severity stratification of allergic reactions (mild/localized vs moderate/systemic vs severe/anaphylaxis) guides treatment decisions including when epinephrine is indicated.|||TAKEAWAY|||Mild (localized): urticaria, pruritus limited to contact area — antihistamines, monitor. Moderate (systemic without compromise): generalized urticaria, mild bronchospasm without hypoxia — diphenhydramine, salbutamol if bronchospasm, close monitoring. Severe (anaphylaxis): multi-system with airway, respiratory, or CV compromise — epinephrine IM immediately, all other treatments secondary.|||FIELD|||If you're debating whether to give epinephrine, give it. Epinephrine IM to the vastus lateralis is safe with minimal risk in anaphylaxis — the risk of withholding it is far greater than the risk of giving it unnecessarily. Delay in epinephrine is the most common preventable cause of death in anaphylaxis." },
          { text: "Management — IM epinephrine (0.3mg 1:1000), route, repeat dosing, diphenhydramine", verdict: "keep", justification: "Epinephrine administration (1:1000, 0.3mg IM vastus lateralis) for anaphylaxis is a core PCP competency directly tested in EMALB practical exams. Dose, concentration, route, and repeat criteria must be automatic.|||TAKEAWAY|||Epinephrine 1:1000 (1mg/mL) — IM vastus lateralis: adult 0.3mg (0.3mL), pediatric 0.01mg/kg (max 0.3mg). Repeat in 5–15 minutes if no improvement. Adjuncts (secondary to epinephrine): salbutamol for persistent bronchospasm, diphenhydramine (Benadryl) for urticaria — does NOT treat anaphylaxis, slows histamine effect only. IV fluid bolus for hypotension. All patients require minimum 4h hospital observation for biphasic reaction.|||FIELD|||1:1000 for IM, 1:10,000 for IV (cardiac arrest). These concentrations are critical — giving 1:1000 IV is a 10x IV epinephrine overdose and has caused cardiac arrest. Always read the label, always verbalize the concentration before drawing up. Confirm with your partner before administration." },
        ]
      },
      {
        name: "Chapter 34 — Gastrointestinal Emergencies",
        sections: [
          { text: "GI Anatomy Review — abdominal organs, referred pain patterns", verdict: "keep", justification: "GI anatomy is foundational for localizing abdominal pathology from pain patterns. Tested in EMALB written exams for acute abdomen diagnosis.|||TAKEAWAY|||Abdominal vasculature: celiac (stomach, liver, spleen), SMA (small bowel, right colon — ischemia → severe periumbilical pain after eating), IMA (left colon). Visceral pain: poorly localized, crampy, periumbilical or epigastric. Parietal pain: well-localized, sharp, worse with movement. Referred pain: appendicitis → McBurney's point (RLQ), cholecystitis → right shoulder (phrenic nerve), peptic ulcer → back.|||FIELD|||McBurney's point tenderness (2/3 from umbilicus to ASIS) = appendicitis until proven otherwise. Murphy's sign (pain on deep RUQ palpation with inspiration) = cholecystitis. These clinical signs take seconds to assess and significantly narrow your differential. Use them." },
          { text: "Upper GI Bleeding — hematemesis, melena, causes (peptic ulcer, varices)", verdict: "keep", justification: "GI hemorrhage can be life-threatening and is a common EMS call. Recognition of severity (hemodynamic instability, shock) drives transport priority. BCEHS CPG GI Bleeding is active.|||TAKEAWAY|||Upper GI bleed (above ligament of Treitz): hematemesis (bright red or coffee-ground vomitus), melena (tarry black stool — slow bleed). Causes: peptic ulcer (most common), gastroesophageal varices (cirrhosis — massive bleed), Mallory-Weiss tear (vomiting-induced). Severity: orthostatic vital signs, HR, BP — Class II shock = 750–1500mL loss. Management: IV access (large bore), NS, Priority transport.|||FIELD|||The patient with hematemesis and HR 120, SBP 88: Class III hemorrhagic shock from GI bleed. Treat as hemorrhagic shock: two large-bore IVs, fluid resuscitation, Priority 1. Cirrhotic with varices can lose liters within minutes. This is a life-threatening emergency even though there's no external wound." },
          { text: "Lower GI Bleeding — hematochezia, causes (diverticulosis, colorectal cancer)", verdict: "skim", justification: "Lower GI bleeding is usually less immediately life-threatening than upper GI bleeding. Skim for recognition — management principles are similar.|||TAKEAWAY|||Lower GI bleed (below ligament of Treitz): hematochezia (bright red blood per rectum). Causes: diverticulosis (most common in elderly), colorectal cancer, hemorrhoids, IBD (Crohn's, UC). Hemodynamic instability is less common but can occur with massive diverticular bleed. Management: IV access, serial vital signs, Priority transport if hemodynamically unstable.|||FIELD|||Hemodynamically stable patient with rectal bleeding: IV access, monitoring, Priority 2 transport. Hemodynamically unstable: treat as upper GI bleed — Priority 1, fluid resuscitation. The distinction between upper and lower GI bleed matters less than the hemodynamic status." },
          { text: "Acute Abdomen — appendicitis, cholecystitis, bowel obstruction, AAA", verdict: "keep", justification: "Acute abdomen causes and clinical differentiation are tested in EMALB written exams. Some causes are immediately life-threatening (AAA, mesenteric ischemia) and require Priority 1 transport.|||TAKEAWAY|||Life-threatening acute abdomen: AAA (pulsatile mass + back pain + hypotension — Priority 1 to vascular surgery), mesenteric ischemia (severe pain out of proportion to exam, elderly, AF history — pain-exam discrepancy is classic). Common: appendicitis (periumbilical → RLQ, rebound, fever), cholecystitis (RUQ, Murphy's sign, fat/fair/forty/fertile/female). Bowel obstruction: colicky pain, distension, vomiting, absent bowel sounds.|||FIELD|||'Pain out of proportion to exam' in an elderly patient with AF = mesenteric ischemia from thromboembolism until proven otherwise. Their abdomen may be soft initially — the pain is ischemic (visceral, poorly localized). This is a surgical emergency with extremely high mortality if missed. Priority 1, no delay." },
          { text: "Nausea, Vomiting, Diarrhea — assessment and management, dehydration risk", verdict: "skim", justification: "NVD is a common EMS complaint. Management is supportive — assess for dehydration and dangerous underlying causes. Skim for management principles.|||TAKEAWAY|||Nausea, vomiting, diarrhea (NVD): assess for dehydration (tachycardia, orthostasis, dry mucous membranes, poor skin turgor). Concerning features: bloody stool/emesis, signs of obstruction, hemodynamic instability, severe dehydration, altered LOC. IV fluid resuscitation for significant dehydration. Ondansetron (Zofran): ACP scope antiemetic.|||FIELD|||Don't dismiss NVD as minor — dehydration from prolonged NVD can cause significant hypovolemia, especially in elderly and pediatric patients. Assess orthostatic vital signs. In pediatric patients, significant dehydration can occur quickly with prolonged vomiting and diarrhea. IV access and fluid resuscitation are indicated for moderate-severe dehydration." },
        ]
      },
      {
        name: "Chapter 35 — Renal and Urologic Emergencies",
        sections: [
          { text: "Renal Failure — acute vs chronic, uremia, fluid overload, electrolyte disturbances", verdict: "keep", justification: "ESRD and dialysis patients are common in the Lower Mainland. Hyperkalemia, fluid overload, and uremic encephalopathy are tested in EMALB written exams and encountered frequently on calls.|||TAKEAWAY|||Acute renal failure (AKI): sudden ↓GFR — prerenal (hypoperfusion), intrinsic (nephrotoxins, sepsis, ischemia), postrenal (obstruction). Chronic kidney disease (CKD): progressive nephron loss → ↓GFR, ↑creatinine/BUN, ↓erythropoietin (anemia), ↓vitamin D, impaired electrolyte regulation. Uremia: toxic accumulation → encephalopathy, pericarditis, bleeding tendency. ESRD on dialysis: hyperkalemia risk between sessions, fluid overload risk.|||FIELD|||ESRD patient who missed dialysis = assume hyperkalemia + fluid overload until proven otherwise. Get a 12-lead immediately — peaked T waves → widened QRS → sine wave → VF is the progression of hyperkalemic cardiac toxicity. Calcium gluconate (ACP scope) stabilizes cardiac membrane. Do not give LR to ESRD patients — contains potassium. NS only." },
          { text: "Kidney Stones — renal colic, CVA tenderness, hematuria, pain management", verdict: "keep", justification: "Renal colic is a common EMS call. Pain management and differentiating from AAA (life-threatening) are clinically important. BCEHS CPG Pain Management applies.|||TAKEAWAY|||Renal colic: stone in ureter → obstructive spasm → colicky flank-to-groin pain, CVA tenderness (costovertebral angle), hematuria, nausea/vomiting. Classic: writhing in agony (cannot find comfortable position — unlike peritonitis where patient lies still). Differentiate from AAA: renal colic patient is younger, VS stable, no pulsatile mass, pain is colicky. Management: analgesia (ketorolac, fentanyl in some systems), IV access, transport.|||FIELD|||Renal colic pain is described as the worst pain imaginable — comparable to labor. Aggressive analgesia is appropriate and expected. Ketorolac (if available in your system) is highly effective for ureteric colic. If the patient is older with cardiovascular risk factors and the pain is constant rather than colicky — consider AAA and transport Priority 1." },
          { text: "Urinary Tract Infection — urosepsis risk in elderly, altered LOC, SIRS criteria", verdict: "keep", justification: "UTI causing urosepsis with altered LOC in elderly is a common and frequently missed diagnosis. EMALB written exams test atypical presentations of sepsis in elderly patients.|||TAKEAWAY|||UTI: dysuria, frequency, urgency, suprapubic pain, cloudy/malodorous urine. Urosepsis: UTI + SIRS criteria (fever/hypothermia, tachycardia, ↑WBC) ± organ dysfunction. In elderly: UTI may present solely as altered LOC, falls, or decreased appetite with no urinary symptoms. Urosepsis mortality: 20–40%. Management: IV access, 30 mL/kg NS bolus for septic shock, Priority transport.|||FIELD|||The 85-year-old found confused in their room with no other symptoms: check for fever and urinary symptoms, but remember — elderly UTI patients often have no urinary complaints. 'Baseline confusion is not their baseline' is your clinical trigger. Urosepsis is sepsis — treat it the same way: fluids, Priority transport, early antibiotics (hospital)." },
        ]

      {
        name: "Chapter 36 — Toxicology: Substance Abuse and Poisoning",
        sections: [
          { text: "Toxidromes — opioid, sympathomimetic, cholinergic, anticholinergic, sedative-hypnotic", verdict: "keep", justification: "Toxidrome recognition is one of the most clinically useful skills in EMS. EMALB written exams test all five major toxidromes. In the Lower Mainland, opioid and sympathomimetic toxidromes are encountered on nearly every shift.|||TAKEAWAY|||Opioid: ↓RR, pinpoint pupils, altered LOC, ↓BP — naloxone reverses. Sympathomimetic (cocaine, meth): ↑HR, ↑BP, dilated pupils, diaphoresis, hyperthermia, agitation. Cholinergic (organophosphate): SLUDGE/DUMBELS (salivation, lacrimation, urination, defecation, GI distress, emesis / bradycardia). Anticholinergic (diphenhydramine, TCA, atropine): dry as a bone, blind as a bat, red as a beet, hot as a hare, mad as a hatter. Sedative-hypnotic (benzo, ETOH): CNS depression, slurred speech, ataxia, without pinpoint pupils.|||FIELD|||Pattern recognition of toxidromes lets you identify the class of substance and start treatment before you know the exact agent. Pinpoint pupils + RR 4/min + unconscious = opioid → naloxone. Dilated pupils + HR 160 + hyperthermia + agitation = sympathomimetic → cool, benzos (ACP), supportive. Dry + hot + delirious + urinary retention = anticholinergic → supportive, physostigmine (hospital)." },
          { text: "Opioid Toxicity — respiratory depression, pinpoint pupils, naloxone dosing", verdict: "keep", justification: "BCEHS CPG Opioid Overdose and naloxone administration are core PCP competencies. The Lower Mainland has among the highest opioid overdose call volumes in Canada. Naloxone dosing for synthetic opioids (fentanyl, carfentanil) may require higher/repeated doses.|||TAKEAWAY|||Opioid toxidrome: ↓RR (<12/min), miosis (pinpoint pupils), ↓LOC. Naloxone: competitive opioid receptor antagonist — 0.4–2mg IV/IM/IN. Synthetic opioids (fentanyl, carfentanil): extremely high receptor affinity → may require 4–8mg+ naloxone for adequate reversal. Naloxone half-life (60–90 min) < most opioids → re-narcotization risk. BCEHS CPG: titrate naloxone to respiratory rate ≥12/min, not to full awakening.|||FIELD|||Titrate naloxone to respiratory rate (≥12/min), not to consciousness — precipitating full reversal in an opioid-dependent patient causes acute withdrawal (agitation, vomiting, combativeness) and the patient will leave and re-use. Titrated naloxone maintains airway protection without triggering withdrawal. In the DTES, fentanyl and its analogues are the predominant supply — expect to use multiple doses." },
          { text: "Stimulant Toxicity — cocaine, methamphetamine, sympathomimetic toxidrome", verdict: "keep", justification: "Stimulant toxicity (cocaine, methamphetamine) is a common DTES and Lower Mainland call. Sympathomimetic toxidrome recognition and its complications (arrhythmia, stroke, hyperthermia, excited delirium) are tested in EMALB written exams.|||TAKEAWAY|||Cocaine: ↑catecholamines, blocks reuptake → sympathomimetic toxidrome + Na+ channel block (cocaine's local anesthetic effect → arrhythmias: wide-complex, Brugada-like QRS). Sodium bicarbonate (ACP): for cocaine-related wide-complex tachycardia. Meth: amphetamine → extended sympathomimetic toxidrome (longer duration than cocaine), dental decay, meth psychosis. Complications: STEMI (coronary vasospasm), stroke, hypertensive emergency, excited delirium syndrome.|||FIELD|||Never use beta-blockers for cocaine-related chest pain or hypertension — unopposed alpha stimulation worsens vasospasm and hypertension. Stimulant-related STEMI is real — coronary vasospasm ± thrombosis. Get a 12-lead, treat as ACS (ASA, NTG with caution), Priority transport. The patient may also be psychotic — de-escalation and safety before clinical assessment." },
          { text: "Alcohol Toxicity and Withdrawal — BAC effects, withdrawal seizures, Wernicke's", verdict: "keep", justification: "Alcohol intoxication and withdrawal are daily EMS realities in the Lower Mainland. Withdrawal seizures, Wernicke's encephalopathy, and medically important presentations mimicking intoxication are tested topics.|||TAKEAWAY|||Alcohol toxicity: CNS depression proportional to BAC; respiratory depression at high BAC (>400 mg/dL); aspiration risk. Alcohol withdrawal: 6–48h after last drink → tremor, diaphoresis, tachycardia → 24–72h → seizure risk; delirium tremens (72–96h): hyperthermia, hypertension, hallucinations, confusion — mortality up to 15% untreated. Wernicke's encephalopathy: thiamine deficiency (ataxia, confusion, ophthalmoplegia) — irreversible if not treated with thiamine.|||FIELD|||The patient who is 'drunk' and having a seizure: withdrawal seizure is more likely than alcohol-induced seizure (alcohol suppresses seizures; seizures occur with BAC declining). BGL (hypoglycemia mimics intoxication), pupils, and vital signs before assuming alcohol explains everything. Give naloxone if opioid co-ingestion suspected — polydrug use is the norm in the DTES." },
          { text: "Carbon Monoxide, Cyanide, and Other Inhalants — cherry red, pulse ox unreliability", verdict: "keep", justification: "CO poisoning is common in BC (gas appliances, generators, house fires) and is missed because SpO2 is falsely normal. Cyanide poisoning (house fires with synthetic materials) may co-occur with CO. Both are EMALB written exam topics.|||TAKEAWAY|||CO: binds Hgb 250× affinity of O2 → CO-Hgb → functional anemia + cellular hypoxia. SpO2 falsely normal (cannot distinguish CO-Hgb from O2-Hgb). Treatment: 100% O2 via NRB (reduces half-life 5h → 90 min). Cyanide: inhibits cytochrome c oxidase → cellular hypoxia despite adequate O2 delivery → high-flow O2 + hydroxocobalamin (Cyanokit — ACP). Fire victim with altered LOC + elevated lactate = CO + cyanide until proven otherwise.|||FIELD|||House fire survivor with altered LOC: assume CO + cyanide poisoning regardless of SpO2. SpO2 is meaningless in CO — it will read normal while the patient is dying from cellular hypoxia. Remove from environment, 100% O2 immediately, Priority 1 transport. Hydroxocobalamin (Cyanokit) for cyanide is ACP scope — call for ACP backup in fire victims with severe LOC changes." },
          { text: "Organophosphate Poisoning — SLUDGE/DUMBELS, atropine, pralidoxime", verdict: "keep", justification: "Organophosphate poisoning (agricultural pesticide, nerve agents in CBRNE context) produces the cholinergic toxidrome. BCEHS CBRNE CPG and EMALB written exams test recognition and atropine treatment.|||TAKEAWAY|||Organophosphates: inhibit acetylcholinesterase → ACh accumulates → cholinergic excess. DUMBELS: Defecation/Diarrhea, Urination, Miosis, Bradycardia/Bronchospasm/Bronchorrhea, Emesis, Lacrimation, Salivation. KILLER finding: bronchorrhea + bronchospasm (can asphyxiate). Treatment: atropine (blocks muscarinic receptors — large doses needed, titrate to drying of secretions), pralidoxime (PAM — ACP/hospital, regenerates cholinesterase if given early).|||FIELD|||Agricultural pesticide call in BC's Fraser Valley is a real scenario. Farmer with SLUDGE symptoms + miosis + bronchorrhea = organophosphate. Your first job: PPE (secondary contamination via skin/clothing contact possible). Do not enter without appropriate decontamination. Atropine titrated to drying of secretions (not to heart rate) — you may need massive doses (10–20mg+) in severe cases." },
          { text: "Tricyclic Antidepressant Overdose — QRS widening, seizures, sodium bicarb", verdict: "keep", justification: "TCA overdose is a high-mortality toxicological emergency. QRS widening >100ms and sodium bicarbonate treatment are tested in EMALB written exams. TCAs include amitriptyline, nortriptyline, clomipramine.|||TAKEAWAY|||TCA toxidrome: anticholinergic symptoms + Na+ channel blockade + alpha blockade. Na+ channel block → QRS widening (>100ms = significant toxicity, >160ms = high risk of VF/pulseless VT) + seizures + conduction block. Alpha block → hypotension. Treatment: sodium bicarbonate 1–2 mEq/kg IV (ACP) → alkalinizes blood → reduces Na+ channel blockade → narrows QRS. Avoid Class Ia and Ic antiarrhythmics (worsen blockade).|||FIELD|||TCA overdose patient with altered LOC: check 12-lead immediately for QRS widening. Wide-complex tachycardia + TCA history = TCA toxicity, not VT — do NOT treat with amiodarone (worsens Na+ channel block). Sodium bicarb (ACP) is the antidote. Call for ACP early. These patients can deteriorate from talking to cardiac arrest within minutes." },
          { text: "Acetaminophen and Salicylate Toxicity — delayed presentation, N-acetylcysteine overview", verdict: "skim", justification: "Acetaminophen and salicylate toxicity are important but presentation is typically delayed (acetaminophen 24–72h) or complex (salicylate mixed acid-base). Skim for recognition — field management is supportive.|||TAKEAWAY|||Acetaminophen: toxic dose >150 mg/kg → hepatotoxicity. Initially asymptomatic or mild nausea → 24–72h → liver failure. Treatment: N-acetylcysteine (hospital). Salicylate (ASA): respiratory alkalosis + metabolic acidosis + tinnitus + hyperthermia + altered LOC. Treatment: alkalinization (sodium bicarb), fluid resuscitation, hospital.|||FIELD|||Acetaminophen OD is insidious — the patient may feel fine for 24–72 hours while liver destruction progresses. Any patient who intentionally ingested acetaminophen needs hospital evaluation regardless of current symptoms. Document exact dose, time of ingestion, and products taken — crucial for N-acetylcysteine dosing decision." },
        ]
      },
      {
        name: "Chapter 37 — Hematologic Emergencies",
        sections: [
          { text: "Anemia — types, presentation, clinical impact on oxygen delivery", verdict: "skim", justification: "Anemia is common but rarely the primary emergency — it complicates other conditions. Skim for clinical awareness.|||TAKEAWAY|||Anemia: reduced Hgb → ↓O2 carrying capacity → compensatory tachycardia, dyspnea on exertion, fatigue, pallor. Severe anemia (Hgb <70 g/L): high-output cardiac failure, angina. Types: iron deficiency (most common), B12/folate deficiency, hemolytic, aplastic. SpO2 is often normal (enough functional Hgb, just less of it) — O2 delivery is reduced even with normal SpO2.|||FIELD|||Anemia worsens every other condition: the patient with ACS and severe anemia has worse ischemia because O2 delivery to myocardium is already reduced. The COPD patient with anemia tolerates hypoxia far less than an anemia-free patient. Document pallor, conjunctival pallor, and tachycardia at rest as clinical signs of anemia." },
          { text: "Sickle Cell Disease — vaso-occlusive crisis, acute chest syndrome, management", verdict: "keep", justification: "Sickle cell disease is encountered in the Lower Mainland's diverse population. Vaso-occlusive crisis and acute chest syndrome are medical emergencies tested in EMALB written exams.|||TAKEAWAY|||Sickle cell: HbS polymerizes under hypoxia/dehydration/cold/stress → RBC sickling → vascular occlusion → ischemic pain (vaso-occlusive crisis). Acute chest syndrome: sickling in pulmonary vasculature → chest pain + fever + new infiltrate + hypoxia — most common cause of death in SCD. Management: O2 (reverse sickling trigger), IV fluids (rehydration), analgesia (fentanyl — these patients have high opioid tolerance), Priority transport.|||FIELD|||Sickle cell patients in vaso-occlusive crisis are in severe pain — take their pain seriously. Under-treatment of pain in sickle cell is a systemic healthcare bias problem. These patients often know their own pain management regimen well — ask them what works. Acute chest syndrome mimics pneumonia but is a hematologic emergency requiring exchange transfusion in hospital." },
          { text: "Clotting Disorders — hemophilia, thrombocytopenia, anticoagulant therapy complications", verdict: "keep", justification: "Anticoagulant complications (warfarin, NOAC) are daily clinical encounters given prevalence of AF and DVT treatment. EMALB written exams test reversal agents and bleeding risk assessment.|||TAKEAWAY|||Hemophilia: Factor VIII (A) or IX (B) deficiency → abnormal clotting → hemorrhage from minor trauma. Thrombocytopenia: ↓platelets → petechiae, mucosal bleeding, spontaneous bruising. Anticoagulants: warfarin (reversal: vitamin K, PCC/FFP), NOACs (dabigatran → idarucizumab; rivaroxaban/apixaban → andexanet alfa). In the field: anticoagulated patient + head trauma = Priority 1, high suspicion for intracranial hemorrhage.|||FIELD|||The patient on warfarin or NOAC who had a fall and hit their head: even with GCS 15 and no focal deficit, they need CT. Anticoagulants prevent normal clot formation and subdural hematomas can expand rapidly. Document the anticoagulant, dose, and last dose time — critical for reversal decisions in the ED. Low threshold for Priority 1 in anticoagulated head trauma." },
        ]
      },
      {
        name: "Chapter 38 — Environmental Emergencies",
        sections: [
          { text: "Hyperthermia — heat cramps, heat exhaustion, heat stroke (core >40°C, CNS dysfunction)", verdict: "keep", justification: "Heat stroke is a life-threatening emergency with a specific treatment (active cooling) that must begin immediately. BCEHS CPG Heat-Related Illness is active. Tested in EMALB written exams.|||TAKEAWAY|||Heat cramps: painful muscle spasm, normal temp, normal LOC — hydration, rest. Heat exhaustion: core temp <40°C, profuse sweating, weakness, nausea, normal LOC — cooling, IV fluids. Heat stroke: core temp >40°C + altered LOC — medical emergency. Exertional (young athletes, workers) vs classic (elderly in hot environment). Treatment: aggressive cooling (ice water immersion if possible, wet sheets + fan, cold IV fluids), IV access, O2, Priority 1 transport.|||FIELD|||Heat stroke: altered LOC + hot skin (classic — anhidrotic) or diaphoretic (exertional) + core temp >40°C. Start cooling immediately — every degree above 40°C causes additional organ damage. Remove clothing, apply ice packs to neck/axilla/groin (high vascular density), wet sheets + fan, cold NS IV. Don't wait for temperature confirmation if clinical picture fits." },
          { text: "Hypothermia — mild/moderate/severe, afterdrop, rewarming strategies", verdict: "keep", justification: "Hypothermia is common in BC's outdoor and homeless populations. BCEHS CPG Hypothermia specifies rewarming approach and withholding CPR criteria. 'Not dead until warm and dead' is a tested principle.|||TAKEAWAY|||Mild hypothermia (32–35°C): shivering, confusion, ataxia. Moderate (28–32°C): shivering stops, serious arrhythmia risk (AF common), decreasing LOC. Severe (<28°C): unconscious, VF risk, appears dead. Afterdrop: core temperature continues to fall after rescue → handle gently (movement triggers VF). Rewarming: passive (insulate, remove wet clothes), active external (warm packs to neck/axilla/groin), active internal (warm humidified O2, warm IV fluids). 'Not dead until warm and dead' — resuscitate until core temp 32°C if cardiac arrest.|||FIELD|||The DTES patient found unresponsive outdoors in winter: hypothermia until proven otherwise. Handle with extreme gentleness (rough handling triggers VF in moderate-severe hypothermia). If cardiac arrest with severe hypothermia: start CPR (at reduced rate — 1 compression per 2 seconds if core <28°C in some protocols), begin passive and active rewarming, transport for ECMO rewarming (VGH). Don't withhold resuscitation based on appearance alone." },
          { text: "Frostbite — superficial vs deep, field management, rewarming contraindications", verdict: "keep", justification: "Frostbite management principles (do not rewarm if refreezing risk, do not rub, protect the tissue) are tested in EMALB written exams. Common in BC outdoor environments.|||TAKEAWAY|||Frostbite: ice crystal formation in tissue → vascular endothelial damage → tissue ischemia. Superficial: ice-cold, firm, white/gray skin with preserved sensation — rewarms to red/painful. Deep: hard, wooden, non-blanching, may be blistered — no sensation (nerve damage). Field management: protect from further cold (don't rewarm if refreezing risk), do not rub affected areas (mechanical cell damage), gentle padding, elevate, transport. Rewarm only in hospital if no refreezing risk.|||FIELD|||The hiker with frostbitten feet who still has to walk out: do not rewarm feet if they will need to walk — walking on rewarmed, blistered tissue causes severe damage and the patient loses ambulation. Refreezing after rewarming is more damaging than leaving tissue frozen. Get them to the hospital before rewarming." },
          { text: "Near Drowning — submersion, aspiration, cold water neuroprotection, resuscitation", verdict: "keep", justification: "Drowning management including resuscitation of cold water submersion (cold water neuroprotection) and secondary drowning risk are tested in EMALB written and practical exams.|||TAKEAWAY|||Drowning: aspiration of water → surfactant disruption → V/Q mismatch → hypoxia. Outcome determined by duration of submersion and hypoxia, not water type. Cold water drowning: hypothermia before cardiac arrest provides neurologic protection — survivors after prolonged submersion in cold water exist. Resuscitate aggressively. Secondary drowning: pulmonary edema developing hours after apparent recovery — all submersion patients need hospital observation.|||FIELD|||Cold water drowning: resuscitate aggressively even with prolonged submersion — the cold protects the brain. 'Not dead until warm and dead' applies here too. Any patient pulled from water who appears recovered: transport and observe for secondary drowning (pulmonary edema developing hours later). No discharge home from a submersion event without medical clearance." },
          { text: "Altitude Illness — AMS, HACE, HAPE — recognition and descent", verdict: "skim", justification: "Altitude illness is relevant in BC's mountainous terrain. EMALB written exams may include altitude emergencies at awareness level. Descent is the definitive treatment.|||TAKEAWAY|||Acute Mountain Sickness (AMS): headache + one of nausea/fatigue/dizziness/poor sleep after ascending above 2500m. HACE (High Altitude Cerebral Edema): AMS + ataxia or altered LOC — emergency. HAPE (High Altitude Pulmonary Edema): dyspnea at rest, cough, cyanosis — most common cause of altitude death. Treatment: descent (most effective), O2, nifedipine/dexamethasone (hospital).|||FIELD|||BC mountain rescues (North Shore Mountains, Whistler, Garibaldi): altitude illness is a real call. Any hiker with ataxia or altered LOC at altitude = HACE = emergency descent. HAPE patient struggling to breathe at altitude: descend immediately, O2 via NRB — do not wait for helicopter if descent is possible." },
          { text: "Envenomation — bee stings, snakebite, marine envenomation", verdict: "skim", justification: "Envenomation is not a common EMALB exam topic but is field-relevant in BC (Western rattlesnake in Okanagan/Thompson regions). Skim for management principles.|||TAKEAWAY|||BC rattlesnake (Crotalus oreganus): hemotoxic venom → local tissue necrosis, coagulopathy, systemic effects. Field management: immobilize the limb (no tourniquet, no incision/suction), keep below heart level, remove rings/constricting clothing, rapid transport for antivenom. Bee sting anaphylaxis: far more common and life-threatening than snakebite — manage per anaphylaxis protocol. Marine envenomation (BC coast): jellyfish, sea urchin — wash with seawater, remove tentacles without touching.|||FIELD|||Rattlesnake bites in BC are rare (Okanagan valley is the primary habitat) but have very specific management: no tourniquet, no incision, no suction. Immobilize and transport for antivenom. Anaphylaxis to bee stings is a far more common call and much more rapidly fatal — epinephrine first, everything else second." },
        ]
      },
      {
        name: "Chapter 39 — Infectious and Communicable Diseases",
        sections: [
          { text: "Infection Control — airborne, droplet, contact precautions, PPE levels", verdict: "keep", justification: "Infection control precautions are tested on every EMALB practical exam as part of scene safety and BSI. BCEHS CPG Infection Prevention and Control specifies PPE requirements by exposure type.|||TAKEAWAY|||Airborne: N95, eye protection, gown — TB, measles, varicella, COVID-19 aerosol-generating procedures. Droplet: surgical mask, eye protection — influenza, meningitis, pertussis, COVID-19 routine. Contact: gloves, gown — C. diff, MRSA, scabies, wound care. Standard precautions: all patient care. Post-exposure protocol: report immediately, document, follow BCEHS/WorkSafeBC protocol for needlestick or mucous membrane exposure.|||FIELD|||Needlestick protocol: wash wound with soap and water for minimum 5 minutes, report to BCEHS supervisor immediately, go to ED for post-exposure prophylaxis (PEP) within 2 hours for HIV risk. Document the patient's HIV/hepatitis status if known. Your health after an exposure depends on how quickly you act — this is not something to 'watch and see.'" },
          { text: "Sepsis — SIRS criteria, qSOFA, early recognition, fluid resuscitation", verdict: "keep", justification: "Sepsis recognition and early management (30 mL/kg fluid resuscitation, Priority transport) are directly tested in EMALB written and practical exams. Sepsis is a leading cause of preventable death and a common medical call.|||TAKEAWAY|||SIRS criteria (≥2): temp >38°C or <36°C, HR >90, RR >20, WBC >12 or <4. Sepsis = SIRS + infection. Septic shock = sepsis + refractory hypotension (SBP <90 after 30 mL/kg fluid). qSOFA (prehospital screen): altered mental status + RR ≥22 + SBP <100 — 2 of 3 = high sepsis risk. Management: IV access, 30 mL/kg NS bolus, O2, source identification (fever/chills + recent procedure/infection/indwelling device), Priority transport.|||FIELD|||Septic shock kills. The qSOFA screen takes 10 seconds: altered + tachypneic + hypotensive = high risk. Start 30 mL/kg NS bolus in the ambulance while en route — don't wait for hospital to start fluids. Every hour of delayed resuscitation increases mortality by 7%. The elderly patient who is 'just confused' with a UTI and HR 102 has sepsis until proven otherwise." },
          { text: "COVID-19, Influenza, TB, Meningitis — key pathogens and precaution levels", verdict: "keep", justification: "Airborne and droplet respiratory pathogen awareness is essential for paramedic safety. TB remains prevalent in the Lower Mainland (particularly in homeless and immigrant populations). All are tested in EMALB written exams.|||TAKEAWAY|||TB: airborne, chronic cough >3 weeks + night sweats + weight loss + hemoptysis → N95 mandatory. High-risk populations: homeless, immigrant, HIV+, incarcerated. Meningitis: fever + headache + neck stiffness + photophobia + petechial rash (N. meningitidis — true emergency) → droplet precautions. COVID-19: airborne for AGPs, droplet routine care → N95 for intubation, BVM, nebulizer. Influenza: droplet precautions.|||FIELD|||DTES population has disproportionate TB burden. Any patient with chronic cough, weight loss, and night sweats gets N95 immediately — before assessment. Petechial rash + fever + stiff neck = meningococcal meningitis = septic emergency + droplet precautions. Pre-alert the ED so they can prepare an isolated room." },
          { text: "HIV/AIDS, Hepatitis — transmission, PEP, exposure protocols", verdict: "keep", justification: "HIV and hepatitis exposure protocols are a practical safety topic. BCEHS has a post-exposure protocol that must be followed within hours. Clinical presentations of AIDS-defining illnesses are field-relevant in the DTES.|||TAKEAWAY|||HIV: transmitted via blood/semen/vaginal fluid/breast milk — not by casual contact. PEP: antiretrovirals within 72h (ideally 2h) after significant exposure reduce transmission risk >80%. Hepatitis B: highly infectious via blood/body fluids — HBV vaccination is mandatory for BC paramedics. Hepatitis C: blood-to-blood transmission only — no vaccine, treat with DAAs. AIDS-defining illnesses: PCP pneumonia (cough + dyspnea + low-grade fever), CMV, cryptococcal meningitis.|||FIELD|||HBV vaccination status: you should be vaccinated and have confirmed immunity (titre check). If you have an exposure (needlestick, blood splash to mucous membrane) and you are non-immune: HBV HBIG + vaccine within 24h. HIV PEP: ≤72h, 28-day course. Document, report, and initiate immediately — your health depends on it." },
          { text: "Pediatric Infectious Diseases — epiglottitis, croup, meningitis red flags", verdict: "keep", justification: "Epiglottitis (H. influenzae, post-vaccine era is rarer but still occurs in unvaccinated) and croup (viral, common) are tested in EMALB pediatric scenario exams. Differentiation is critical — approaches are opposite.|||TAKEAWAY|||Croup (viral, 6mo–3yr): barking seal cough, hoarse voice, inspiratory stridor, low-grade fever — position of comfort, nebulized saline, cool air; Racemic epinephrine (ACP) for severe. Epiglottitis (any age, bacterial): sudden high fever, drooling, tripod position, muffled 'hot potato' voice, no cough — DO NOT examine throat, keep patient calm in position of comfort, O2, Priority transport, ACP early. Meningitis: fever + bulging fontanelle (infant) or neck stiffness + petechiae → Priority 1 + droplet precautions.|||FIELD|||The sick child with stridor in tripod position, drooling, and muffled voice = epiglottitis until proven otherwise. Do NOT try to examine the throat — the exam can trigger laryngospasm and complete airway obstruction. Place the child in their caregiver's arms in position of comfort, blow-by O2, calm environment, Priority 1 transport, ACP backup. Every intervention that upsets them risks losing the airway." },
        ]
      },
      {
        name: "Chapter 40 — Behavioural Emergencies",
        sections: [
          { text: "Psychiatric Emergencies — psychosis, mania, depression, suicidal ideation", verdict: "keep", justification: "Psychiatric emergencies are among the most frequent calls in the Lower Mainland. BCEHS CPG Behavioural Emergencies and Mental Health Act (BC) apply. EMALB written and practical exams test psychiatric assessment and safe approach.|||TAKEAWAY|||Psychosis: break from reality — delusions (fixed false beliefs), hallucinations (auditory most common in schizophrenia), disorganized thought. Mania: elevated mood, grandiosity, decreased sleep, pressured speech, impulsivity. Key field principle: rule out medical cause of psychiatric presentation — hypoglycemia, hypoxia, sepsis, TBI, intoxication before attributing to primary psychiatric disease.|||FIELD|||The patient who appears acutely psychotic: check BGL, SpO2, pupils, temperature, and 12-lead before concluding psychiatric etiology. New-onset psychosis in a 55-year-old is not schizophrenia — it's a medical emergency until proven otherwise (TBI, stroke, encephalitis, drug toxicity). First episode psychosis in young adults: gentle approach, maintain calm, involve family, transport for full workup." },
          { text: "Suicide Risk Assessment — ideation, plan, means, intent — field assessment", verdict: "keep", justification: "Suicide calls are among the highest in EMS in the Lower Mainland. EMALB jurisprudence tests Mental Health Act apprehension criteria and safe messaging principles. Asking about suicide directly is tested.|||TAKEAWAY|||Suicide risk assessment: ideation (passive 'I wish I were dead' vs active 'I'm thinking about killing myself'), plan (specific method identified), means (access to method), intent (degree of intention to act). High-risk: specific plan + lethal means + high intent, prior attempt, male, elderly, social isolation, recent loss. Ask directly: 'Are you thinking about suicide?' — asking does not increase risk.|||FIELD|||Asking 'Are you thinking about killing yourself?' is clinically indicated and will not plant the idea. It opens the door to honest assessment. A patient with suicidal ideation + specific plan + means access (firearm, medications stockpiled): Mental Health Act apprehension criteria under BC Mental Health Act Section 28 may apply. Call CliniCall for guidance on apprehension when uncertain." },
          { text: "Excited Delirium — hyperthermia, superhuman strength, sudden death risk, restraint", verdict: "keep", justification: "Excited delirium is a BCEHS CPG-recognized high-risk scenario with specific management recommendations. It occurs at the intersection of EMS and police response. EMALB written exams test recognition and risk factors.|||TAKEAWAY|||Excited delirium syndrome (ExDS): extreme agitation + disorientation + superhuman strength + hyperthermia + insensitivity to pain. Associated with: stimulant intoxication (cocaine, meth), psychiatric illness, restraint. Risk: sudden death from cardiac arrest (catecholamine surge + hyperthermia + acidosis). Management: de-escalation, chemical sedation (droperidol/midazolam — ACP), avoid prone restraint (positional asphyxia), monitor closely post-sedation, Priority transport.|||FIELD|||Positional asphyxia: restraining a combative patient prone with weight on their back while they are hypoxic and tachycardic = fatal respiratory compromise. Do not restrain prone. Once police have controlled the patient, your job is medical monitoring — these patients can arrest quickly after restraint from catecholamine surge + acidosis. Continuous monitoring, O2, and rapid transport are mandatory." },
          { text: "Mental Health Act — BC form 4, criteria for apprehension, patient rights", verdict: "keep", justification: "BC Mental Health Act apprehension criteria and Section 28 (police/ambulance apprehension) are tested in EMALB jurisprudence. You will use this framework on psychiatric calls regularly.|||TAKEAWAY|||BC Mental Health Act Section 28: any person may apprehend someone who appears to have a mental disorder AND has recently threatened or attempted to harm themselves or others AND is likely to do so again, AND is not suitable for voluntary admission. Police can apprehend under Section 28 authority. Form 4 (physician's certificate): required for involuntary admission to facility. Your role: transport safely, document behaviors and statements observed.|||FIELD|||Your documentation of the patient's behaviors and statements on a Mental Health Act call is critical — it forms part of the record used to determine if involuntary admission is warranted. Document exact quotes ('patient stated he would kill himself and his family'), specific behaviors (pacing, self-injurious, assaultive), and threat details. This is a legal document that protects both the patient and the clinician." },
          { text: "De-escalation Techniques — verbal, non-threatening posture, scene control", verdict: "keep", justification: "De-escalation is assessed in EMALB practical scenario exams involving agitated or combative patients. It is also your primary safety tool on psychiatric calls before any physical or chemical intervention.|||TAKEAWAY|||De-escalation principles: calm voice, slow speech, non-threatening body language (hands visible, open posture, at patient's eye level), validate emotions ('I can see you're very upset'), offer choices ('Would you prefer to sit here or in the ambulance?'), avoid demands or ultimatums, reduce environmental stimulation (clear bystanders, reduce noise), give personal space (stay outside striking range). If escalating despite de-escalation: police + chemical sedation (ACP).|||FIELD|||De-escalation starts before you enter the scene. If police are staging for an agitated patient, stage with them — don't rush in. Your positioning relative to the patient matters: stand at an angle (not directly in front = confrontational), keep an exit route available, never corner yourself. A patient who chooses to cooperate is safer than one physically restrained." },
        ]
      },
      {
        name: "Chapter 41 — Gynecologic Emergencies",
        sections: [
          { text: "Vaginal Bleeding — causes, assessment, ectopic pregnancy red flags", verdict: "keep", justification: "Vaginal bleeding in reproductive-age women can be life-threatening (ectopic rupture, placenta previa). EMALB written exams test differential diagnosis and priority assessment.|||TAKEAWAY|||Causes of vaginal bleeding: ectopic pregnancy (most dangerous — rupture = massive hemorrhage), miscarriage/spontaneous abortion, dysfunctional uterine bleeding (non-pregnant), fibroids, trauma. In any reproductive-age woman with vaginal bleeding + pelvic pain: assume ectopic until proven otherwise. Key questions: LMP (last menstrual period), pregnancy test status, sexual activity, prior ectopic.|||FIELD|||The 28-year-old with acute pelvic pain + vaginal spotting + shoulder tip pain (Cullen's sign — hemoperitoneum irritating diaphragm): ruptured ectopic pregnancy = hemorrhagic shock. Priority 1, two large-bore IVs, fluid resuscitation, OR activation en route. Don't let 'not much bleeding' reassure you — most ectopic hemorrhage is internal." },
          { text: "Ectopic Pregnancy — rupture, hemorrhagic shock, Cullen's sign", verdict: "keep", justification: "Ruptured ectopic pregnancy is a life-threatening emergency that causes rapid hemorrhagic shock. EMALB written exams test recognition and management.|||TAKEAWAY|||Ectopic pregnancy: implantation outside uterus (fallopian tube 95% of cases) → fetus grows → tube ruptures → massive intraperitoneal hemorrhage. Presentation: 6–8 weeks gestation (missed period), sudden severe unilateral pelvic pain (rupture), syncope or near-syncope, Cullen's sign (periumbilical ecchymosis from hemoperitoneum), shoulder tip pain. Shock physiology. Definitive treatment: emergency surgery.|||FIELD|||Any woman of reproductive age with syncope + pelvic pain = ruptured ectopic until proven otherwise. This patient can exsanguinate before reaching the OR. Priority 1, two large-bore IVs en route, aggressive fluid resuscitation, pre-alert gynaecology, and direct transport to a hospital with an OR available. Don't be reassured by a 'negative urine pregnancy test' — these can be false negative early." },
          { text: "Sexual Assault — trauma-informed care, evidence preservation, mandatory reporting", verdict: "keep", justification: "Sexual assault calls require specific clinical, legal, and ethical considerations. BCEHS CPG Sexual Assault specifies evidence preservation principles. EMALB jurisprudence tests mandatory reporting and patient rights.|||TAKEAWAY|||Sexual assault management: safety first (ensure patient is in a safe location), trauma-informed care (patient-led, no judgment, offer choices at each step, explain before every action), evidence preservation (do not wash patient, minimize what you remove, bag clothing separately, preserve any biological material). Do not perform internal exam. Medical priority: physical injuries. Mandatory reporting: not required without patient consent (unlike child abuse) — patient controls disclosure.|||FIELD|||The sexual assault patient needs a calm, patient-led encounter. Ask permission before every physical action: 'May I take your pulse?' Your role is medical care and transport — not investigation. Explain that evidence collection (SANE nurse exam) happens at the hospital and the patient can choose whether to report to police. Treating the patient with dignity is the most therapeutically important thing you can do." },
          { text: "Pelvic Inflammatory Disease — presentation, differential from appendicitis", verdict: "skim", justification: "PID is a clinical diagnosis made at the hospital. Field management is supportive. Skim for recognition.|||TAKEAWAY|||PID: ascending genital tract infection (chlamydia, gonorrhea most common) → salpingitis, oophoritis, peritonitis. Presentation: bilateral lower pelvic pain, cervical motion tenderness (chandelier sign), fever, vaginal discharge, nausea. Differentiate from appendicitis (typically RLQ, fever earlier, no cervical motion tenderness). Management: IV access, analgesia, transport.|||FIELD|||Bilateral pelvic pain in a sexually active woman of reproductive age: PID vs appendicitis vs ectopic (know your presentation differences). Unilateral → more likely appendicitis or ectopic. Bilateral + fever + discharge → more likely PID. All three warrant Priority transport — only imaging distinguishes them definitively." },
        ]
      },
      {
        name: "Chapter 42 — Obstetrics",
        sections: [
          { text: "Normal Pregnancy — trimesters, physiologic changes (BP, HR, positioning)", verdict: "keep", justification: "Physiologic changes of pregnancy affect vital sign interpretation, drug metabolism, and positioning. EMALB written and practical exams test pregnancy physiology and its clinical implications.|||TAKEAWAY|||Pregnancy physiology: CO increases 40% (↑HR ~15 bpm, ↑blood volume 50%), BP decreases in 2nd trimester (normally 90–100 systolic — don't undertreat 'low' BP), progesterone relaxes smooth muscle (↓GI motility → aspiration risk). Supine hypotension syndrome (>20 weeks): uterus compresses IVC → left lateral decubitus position. Drug safety: epinephrine still indicated in anaphylaxis (maternal survival = fetal survival).|||FIELD|||Pregnant patient (>20 weeks) in any position other than left lateral: reposition to left lateral decubitus or wedge the right hip with a pillow. Supine position can reduce CO by 30% via IVC compression — a hemodynamically stable patient can decompensate simply by lying flat. During CPR in pregnancy: manual uterine displacement left + CPR continues normally." },
          { text: "Assessment of the Obstetric Patient — fundal height, fetal heart tones, crowning", verdict: "keep", justification: "Obstetric assessment including fundal height estimation (weeks gestation) and fetal heart tone assessment are tested in EMALB obstetric practical scenarios.|||TAKEAWAY|||Fundal height: umbilicus = 20 weeks, each additional cm ≈ 1 additional week to 36 weeks. Fetal heart tones: normal 110–160 bpm (Doppler or auscultation over maternal abdomen). Contraction assessment: timing from start of one contraction to start of next (frequency), duration of contraction, intensity. Contractions <5 min apart, lasting >60 seconds, very strong = active labor.|||FIELD|||Fundal height at or above the umbilicus: ≥20 weeks — left lateral decubitus positioning required for any supine procedures. Listen for fetal heart tones in any obstetric call — document frequency and quality. Absent or bradycardic fetal heart tones + maternal shock = fetal distress or intrauterine fetal death — Priority 1 transport." },
          { text: "Normal Delivery — stages of labor, delivery technique, APGAR scoring", verdict: "keep", justification: "Field delivery is a tested EMALB practical scenario. Stage recognition, controlled delivery technique, APGAR scoring, and immediate newborn care are graded competencies.|||TAKEAWAY|||Stage 1 (latent → active → transition): cervical dilation 0–10cm. Stage 2 (delivery of baby): begin when fully dilated, ends with delivery. Stage 3 (placental delivery): 5–30 min after baby. Delivery technique: gentle perineal support, control head delivery between contractions, check for nuchal cord, deliver shoulders one at a time. APGAR at 1 and 5 minutes: Appearance, Pulse, Grimace, Activity, Respiration (0–2 each, max 10). Cord cutting: wait for cord to stop pulsating if possible (delayed cord clamping).|||FIELD|||Crowning = delivery imminent = don't move the patient unless absolutely necessary. Controlled delivery of the head between contractions prevents perineal tearing and reduces risk of rapid decompression. After delivery: dry and stimulate the newborn immediately, keep warm (temperature regulation is absent in newborns). Call for ACP/additional resources early if complications are anticipated." },
          { text: "Complications of Delivery — prolapsed cord, shoulder dystocia, breech, placenta", verdict: "keep", justification: "Obstetric complications are EMALB practical scenario topics. Prolapsed cord and shoulder dystocia require specific immediate interventions. Both are time-critical.|||TAKEAWAY|||Prolapsed cord: umbilical cord precedes presenting part → cord compression → fetal asphyxia. Management: relieve pressure on cord (elevate presenting part manually, knee-chest position), continuous pressure until delivery, Priority 1, call for ACP. Shoulder dystocia: head delivers but shoulders impacted behind pubic symphysis. McRoberts maneuver (hyperflexion of maternal hips), suprapubic pressure (not fundal). Breech: feet/buttocks first — attempt to allow spontaneous delivery, support, do not pull.|||FIELD|||Prolapsed cord is one of the true obstetric emergencies. Your gloved hand goes in to relieve pressure on the cord — you will be maintaining this pressure until the patient reaches the OR. Do not remove your hand. Alert the hospital immediately with exact situation — they need to activate an emergency C-section team." },
          { text: "Preeclampsia and Eclampsia — hypertension, seizure, magnesium (ACP), rapid transport", verdict: "keep", justification: "Preeclampsia and eclampsia are life-threatening obstetric emergencies. BCEHS CPG Preeclampsia/Eclampsia specifies magnesium sulfate (ACP scope) for seizure prevention/treatment. EMALB written exams test recognition.|||TAKEAWAY|||Preeclampsia: HTN (≥140/90) + proteinuria after 20 weeks gestation. Severe preeclampsia: BP ≥160/110, severe headache, visual changes, RUQ pain (hepatic capsule distension), pulmonary edema. Eclampsia: preeclampsia + seizure. Management: left lateral, O2, IV access, Priority 1 transport. Magnesium sulfate (ACP): seizure prophylaxis and treatment. NTG/hydralazine (ACP) for severe hypertension — avoid diuretics.|||FIELD|||The pregnant patient at 35 weeks with severe headache and BP 170/115 is a preeclampsia emergency — seizure (eclampsia) can occur at any moment. Left lateral positioning, O2, IV access, Priority 1 transport, ACP backup for MgSO4. Eclamptic seizures are managed with MgSO4 (not benzodiazepines as first line — but midazolam is acceptable if MgSO4 unavailable or seizure refractory)." },
          { text: "Postpartum Hemorrhage — uterine atony, massage, oxytocin (ACP scope overview)", verdict: "keep", justification: "Postpartum hemorrhage (PPH) is the leading cause of maternal mortality worldwide. Uterine massage is a PCP skill. Oxytocin is ACP scope in BC. EMALB written exams test PPH recognition and management.|||TAKEAWAY|||PPH: >500mL blood loss after vaginal delivery, >1000mL after C-section. Most common cause: uterine atony (uterus fails to contract after delivery — feels soft/boggy). Management: uterine fundal massage (bimanual if needed), breastfeeding (oxytocin release), IV access + large-bore fluid resuscitation, oxytocin IV/IM (ACP), Priority 1 transport. Secondary causes: retained placenta fragments, lacerations, coagulopathy.|||FIELD|||After a field delivery, feel the uterine fundus (at or above umbilicus) — if it is soft and boggy, massage immediately. A well-contracted uterus feels firm like a softball. A boggy uterus with bright red bleeding = atony = massage continuously until firm or ACP oxytocin is available. 500–1000mL blood loss can occur rapidly in atony — these patients can crash quickly." },
          { text: "Spontaneous Abortion and Placental Abruption — assessment and management", verdict: "keep", justification: "Miscarriage and placental abruption are common obstetric emergencies with significant hemorrhage risk and psychological impact. Tested in EMALB written exams.|||TAKEAWAY|||Spontaneous abortion (miscarriage): <20 weeks, cramping + vaginal bleeding. Types: threatened (cervix closed, may continue), inevitable (cervix open, will miscarry), incomplete (partial tissue passage), complete (all tissue passed). Placental abruption: premature separation of placenta → painful vaginal bleeding + uterine rigidity ('board-like abdomen') + fetal distress — can be concealed (no external bleeding). Immediate transport for both.|||FIELD|||Placental abruption is a true emergency — the rigid, painful uterus with or without external bleeding = abruption until proven otherwise. Fetal distress and maternal hemorrhagic shock can develop rapidly. Priority 1, large-bore IV, fluid resuscitation, emotional support. Miscarriage calls: provide compassionate care — this is a devastating loss. Document products of conception if passed, handle with dignity." },
        ]
      },
      {
        name: "Chapter 43 — Neonatology",
        sections: [
          { text: "Initial Assessment of the Newborn — APGAR, term, tone, cry, color", verdict: "keep", justification: "Newborn assessment (APGAR, term vs preterm, respiratory effort) is tested in EMALB obstetric practical scenarios. Rapid assessment determines whether neonatal resuscitation is needed.|||TAKEAWAY|||APGAR score (1 and 5 minutes): Appearance (skin color — pink 2, acrocyanosis 1, blue 0), Pulse (HR — >100 = 2, <100 = 1, absent = 0), Grimace (reflex irritability), Activity (muscle tone), Respiration (strong cry 2, weak cry 1, apneic 0). APGAR 7–10: vigorous, normal. 4–6: some compromise, stimulate. 0–3: severely depressed, initiate NRP. Term (≥37 weeks): cry + good tone + pink = routine care. Preterm: higher resuscitation risk.|||FIELD|||A newborn who is not crying, blue, and floppy immediately after delivery: begin the NRP algorithm immediately — warm, dry, stimulate (within 30 seconds), assess breathing and HR. You have 30 seconds at each step before moving to the next intervention. Time matters — brain injury begins with prolonged hypoxia within minutes of birth." },
          { text: "Newborn Resuscitation — warming, stimulation, BVM, NRP algorithm", verdict: "keep", justification: "Neonatal resuscitation (NRP algorithm) is tested in EMALB obstetric practical scenarios. Key differences from adult CPR (HR <60 for compressions, 3:1 ratio) are commonly tested.|||TAKEAWAY|||NRP algorithm: warm + dry + stimulate (30 sec) → assess breathing and HR. HR >100 and breathing: routine care. HR 60–100 or not breathing: BVM 21% O2 at 40–60/min × 30 sec → reassess. HR <60: chest compressions (3:1 ratio, 90 compressions + 30 breaths/min) + BVM. Compression technique: encircling thumbs method (preferred), 1/3 AP chest depth. IO access if no response. Epinephrine (ACP): if HR <60 after 60 sec of compressions.|||FIELD|||Neonatal CPR is different: 3:1 compression:ventilation ratio (vs adult 30:2), HR threshold for compressions is 60 (not absent pulse), O2 is titrated (not blasted — room air first, then up to 100% if no improvement), and the encircling thumbs technique generates better compressions in the small chest. Know these differences before you deliver a baby." },
          { text: "Common Neonatal Emergencies — meconium, prematurity, respiratory distress", verdict: "keep", justification: "Meconium aspiration, prematurity, and neonatal hypoglycemia are tested in EMALB neonatal scenario exams. Meconium in amniotic fluid changes delivery management.|||TAKEAWAY|||Meconium-stained amniotic fluid (MSAF): thick/particulate (high-risk) vs thin/watery (lower risk). Vigorous newborn with MSAF: routine care. Non-vigorous + MSAF: suction mouth/nose with bulb syringe before stimulating (ETT suctioning no longer universally recommended — intubate and suction only if meconium in airway and not breathing). Premature (<37 weeks): ↑heat loss (larger SA:volume ratio), ↑respiratory distress, ↑hypoglycemia risk. Neonatal hypoglycemia: BGL <2.6 mmol/L — breastfeed if able, D10W 2 mL/kg slow IV if unable.|||FIELD|||Premature delivery in the field: wrap in polyethylene bag (no drying — prevents heat loss from evaporation), warm blankets over bag, minimize exposure. Temperature is the most critical physiologic parameter in premature newborns — hypothermia within minutes of birth can be fatal. Pre-alert neonatal team at the receiving hospital early." },
        ]
      },
    ]
